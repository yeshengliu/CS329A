nding code LLMs in execution feedback","problem":"Coding agents generate code but need a feedback signal to iterate against user intent. Simply showing a base model faulty solutions plus execution output does not, by itself, improve it.","why":"Code is uniquely verifiable — you can actually run it and read test pass/fail — so correctness can be turned into a scalar reward. What is missing is a principled loop that feeds per-turn execution feedback back into generation and uses the final result to update the policy.","how":"RLEF is an end-to-end RL fine-tuning framework: action = generated code, observation = execution feedback (running tests and collecting pass/fail output), reward = binary from whether tests pass, optimized with PPO.","detail":"<p>RLEF (RL with Execution Feedback) was among the first papers to show that execution feedback markedly improves coding LLMs. It maps the agent loop directly onto RL:<\/p><ul><li><b>Action<\/b> = the generated code solution.<\/li><li><b>Observation<\/b> = execution feedback — actually running tests and collecting the pass/fail output.<\/li><li><b>Reward<\/b> = binary, from whether tests pass.<\/li><\/ul><p>Motivation: a majority of the class already uses Claude Code, and much engineering work has been delegated to these agents. The critical requirement is understanding user intent and getting feedback on the generated code so the agent can iterate. The paper's two innovations are the <b>two-tier test strategy<\/b> and the <b>hybrid token-level / turn-level policy<\/b>.<\/p>","terms":["RLEF","execution feedback","PPO","binary reward","coding agents","Claude Code"]},"zh":{"title":"RLEF：以执行反馈为代码 LLM 提供 grounding","problem":"编程智能体生成代码，但需要一个反馈信号来对照用户意图迭代。仅向基础模型展示有缺陷的解法加执行输出，本身并不能改进它。","why":"代码具有独特的可验证性——你可以真正运行它并读取测试的通过/失败——因此正确性可以转化为标量奖励。缺失的是一个有原则的循环，把每轮的执行反馈送回生成过程，并用最终结果更新策略。","how":"RLEF 是一个端到端 RL 微调框架：action = 生成的代码，observation = 执行反馈（运行测试并收集通过/失败输出），reward = 测试是否通过的二值奖励，用 PPO 优化。","detail":"<p>RLEF（RL with Execution Feedback）是最早表明执行反馈能显著改进代码 LLM 的论文之一。它把智能体循环直接映射到 RL：<\/p><ul><li><b>Action<\/b> = 生成的代码解法。<\/li><li><b>Observation<\/b> = 执行反馈——实际运行测试并收集通过/失败输出。<\/li><li><b>Reward<\/b> = 二值的，取决于测试是否通过。<\/li><\/ul><p>动机：班上大多数人已经在用 Claude Code，许多工程工作已委派给这些智能体。关键要求是理解用户意图，并就生成的代码获得反馈，以便智能体迭代。该论文的两项创新是<b>两层测试策略<\/b>和<b>混合的 token 级 / 轮次级策略<\/b>。<\/p>","terms":["RLEF","执行反馈","PPO","二值奖励","编程智能体","Claude Code"]}},{"t":1766,"figs":[{"t":1791,"file":"slides/part04/slide_119.jpg"}],"en":{"title":"RLEF's iterative loop: exploitation, public-test iteration, private-test reward","problem":"How is the generation cycle structured, and where exactly does the learning signal enter?","why":"The loop has two phases: the model exploits its current policy through inference-time feedback, then the policy is updated from execution results, which is what enables continuous self-improvement.","how":"A natural-language problem description is given; the model generates a solution; it is evaluated on public tests; if it fails, the execution feedback is appended and the model retries until it passes or hits a turn limit. Passing solutions go to a private test set, whose verdict determines the reward used in the PPO update.","detail":"<p>Concretely, on a palindrome-substring problem the first attempt fails the public tests with an <b>execution timeout<\/b> — a very common issue. After receiving that feedback the model produces an optimized solution that passes the public tests.<\/p><ul><li><b>Left / exploitation phase<\/b>: exploit the current policy through inference-time feedback loops.<\/li><li><b>Right / policy update<\/b>: update the policy from execution results, enabling continuous self-improvement.<\/li><li>Only solutions that clear the public tests advance to the private evaluation and policy update.<\/li><li>The feedback is real execution (a Python test function), not the model's self-assessment.<\/li><\/ul><p>This separation of iteration-time feedback from reward-time evaluation is the core of the self-improvement loop.<\/p>","terms":["exploitation phase","public tests","private tests","turn limit","policy update","PPO"]},"zh":{"title":"RLEF 的迭代循环：利用、公开测试迭代、私有测试奖励","problem":"生成周期是如何组织的，学习信号究竟从哪里进入？","why":"该循环有两个阶段：模型通过推理时反馈利用其当前策略，然后依据执行结果更新策略，这正是实现持续自我改进的关键。","how":"给出自然语言的问题描述；模型生成一个解法；在公开测试上评估；若失败，就把执行反馈追加进去，模型重试直到通过或达到轮次上限。通过的解法进入私有测试集，其判定决定 PPO 更新所用的奖励。","detail":"<p>具体来说，在一个回文子串问题上，第一次尝试因<b>执行超时<\/b>而未能通过公开测试——这是一个非常常见的问题。收到该反馈后，模型产生了一个通过公开测试的优化解法。<\/p><ul><li><b>左侧 / 利用阶段<\/b>：通过推理时反馈循环利用当前策略。<\/li><li><b>右侧 / 策略更新<\/b>：依据执行结果更新策略，实现持续自我改进。<\/li><li>只有通过公开测试的解法才会进入私有评估和策略更新。<\/li><li>反馈是真实的执行（一个 Python 测试函数），不是模型的自我评估。<\/li><\/ul><p>把迭代时反馈与奖励时评估分离，是这一自我改进循环的核心。<\/p>","terms":["利用阶段","公开测试","私有测试","轮次上限","策略更新","PPO"]}},{"t":1845,"figs":[{"t":1845,"file":"slides/part04/slide_107.jpg"},{"t":1905,"file":"slides/part04/slide_118.jpg"}],"en":{"title":"Two-tier test strategy: preventing reward leakage and memorization","problem":"If the tests supplying iteration feedback are the same tests that determine the reward, the model can learn to memorize test outputs instead of learning to program, destroying generalization.","why":"This is reward-signal leakage: the feedback the model conditions on and the target it is graded on must be disjoint, or the objective is trivially satisfiable by memorization. Real competition design works the same way — public sample tests for iteration, hidden system tests for the verdict (CodeContests).","how":"Split the suite into public tests (a small subset visible during generation, giving immediate fine-grained feedback for faster iteration) and private tests (hidden entirely, used only to score the final solution and compute the reward).","detail":"<p>Public tests provide immediate feedback that guides better solution development; because they are only a small subset, iteration is fast. Private tests stay completely hidden during generation and determine the PPO reward.<\/p><ul><li>If the feedback tests equal the reward tests, the model can simply <b>memorize test outputs<\/b>; keeping reward tests hidden forces genuine program synthesis.<\/li><li>Feedback is fed back to the LM as explicit execution output — here is the output you generated and here is the feedback you got.<\/li><li>Q&amp;A clarified that the split is a design choice over a fixed test set; for CodeContests you keep some tests public for inference-time feedback and some to train.<\/li><li>The speaker called this a very useful innovation in the self-improvement loop; hard problems may additionally need richer error traces.<\/li><\/ul>","terms":["two-tier test strategy","public tests","private tests","reward leakage","memorization","CodeContests"]},"zh":{"title":"两层测试策略：防止奖励泄漏与记忆化","problem":"如果提供迭代反馈的测试与决定奖励的测试相同，模型可能学会记忆测试输出而不是学会编程，从而破坏泛化。","why":"这就是奖励信号泄漏：模型据以调整的反馈与它被评分的目标必须互不重叠，否则目标可以被记忆化轻易满足。真实竞赛的设计也是如此——公开样例测试用于迭代，隐藏系统测试用于判定（CodeContests）。","how":"把测试套件拆成公开测试（生成期间可见的一小部分，提供即时细粒度反馈以加快迭代）和私有测试（完全隐藏，仅用于给最终解法评分并计算奖励）。","detail":"<p>公开测试提供即时反馈，引导更好地开发解法；由于只是很小的子集，迭代很快。私有测试在生成期间完全隐藏，并决定 PPO 奖励。<\/p><ul><li>如果反馈测试等于奖励测试，模型可以简单地<b>记忆测试输出<\/b>；把奖励测试隐藏起来才能迫使真正的程序合成。<\/li><li>反馈以显式执行输出的形式回传给 LM——这是你生成的输出，这是你收到的反馈。<\/li><li>问答澄清：这种拆分是对固定测试集的一种设计选择；对 CodeContests，你保留一些测试公开用于推理时反馈，另一些用于训练。<\/li><li>讲者称这是自我改进循环中一个非常有用的创新；困难问题可能还需要更丰富的错误轨迹。<\/li><\/ul>","terms":["两层测试策略","公开测试","私有测试","奖励泄漏","记忆化","CodeContests"]}},{"t":1938,"figs":[{"t":1950,"file":"slides/part04/slide_115.jpg"}],"en":{"title":"Hybrid token-level / turn-level policy optimization","problem":"In language-space RL the policy emits code one token at a time, but execution feedback for a solution only exists after the whole response is generated. Which granularity does the advantage use?","why":"Reward arrives at the end of the turn, so per-token credit assignment is ill-defined without a value estimate for every token, yet per-token control over generation is exactly what makes code synthesis tractable.","how":"Use a hybrid objective: token-level generation and control combined with a turn-level value function. The reward is computed over the entire response using the last token of the prompt, and a single advantage value is broadcast to all tokens in that turn.","detail":"<p>The mismatch between token-level generation and turn-level reward is resolved by a hybrid policy objective:<\/p><ul><li><b>Token-level<\/b>: the policy emits code token by token, giving fine-grained control over generation.<\/li><li><b>Turn-level<\/b>: the value function scores the <i>entire<\/i> response using only the last token, so one advantage value is shared by all tokens in the turn.<\/li><\/ul><p>The speaker maps this to <b>PPO<\/b> and notes the turn-level broadcast is closer to <b>GRPO/GSPO<\/b>-style sequence-level rewards than to strict per-token credit assignment. The trade-off is explicit: a sequence-level advantage is simple, stable, and cheap but blurs which token caused pass/fail. Per-token or per-step rewards could localize credit better — the unresolved <b>process reward model vs outcome reward model<\/b> debate, which may need different answers per domain and benchmark. Remaining design choices: how many turns to allow, and whether to provide richer error traces or suggestions beyond raw test output.<\/p>","terms":["PPO","GRPO","GSPO","advantage","turn-level value function","process vs outcome reward"]},"zh":{"title":"混合的 token 级 / 轮次级策略优化","problem":"在语言空间 RL 中，策略一次一个 token 地生成代码，但一个解法的执行反馈只有在整个响应生成完毕后才存在。优势值采用哪种粒度？","why":"奖励在轮次结束时才到达，因此若没有对每个 token 的价值估计，逐 token 的信用分配就是定义不清的；然而对生成进行逐 token 控制恰恰是代码合成可行的原因。","how":"使用混合目标：token 级生成与控制结合轮次级价值函数。奖励使用 prompt 的最后一个 token 在整个响应上计算，单个优势值被广播到该轮次的所有 token。","detail":"<p>token 级生成与轮次级奖励之间的错配，由混合策略目标解决：<\/p><ul><li><b>token 级<\/b>：策略逐 token 输出代码，对生成提供细粒度控制。<\/li><li><b>轮次级<\/b>：价值函数仅用最后一个 token 对<i>整个<\/i>响应打分，因此一个优势值被该轮次所有 token 共享。<\/li><\/ul><p>讲者把这映射到 <b>PPO<\/b>，并指出轮次级广播更接近 <b>GRPO/GSPO<\/b> 式的序列级奖励，而非严格的逐 token 信用分配。权衡是明确的：序列级优势简单、稳定、便宜，但模糊了是哪个 token 导致通过/失败。逐 token 或逐步奖励可以更好地定位信用——这就是尚未解决的<b>过程奖励模型 vs 结果奖励模型<\/b>之争，可能在不同领域和基准上需要不同答案。剩余的设计选择：允许多少轮，以及是否提供比原始测试输出更丰富的错误轨迹或建议。<\/p>","terms":["PPO","GRPO","GSPO","优势值","轮次级价值函数","过程 vs 结果奖励"]}},{"t":1993,"figs":[{"t":2123,"file":"slides/part04/slide_121.jpg"}],"en":{"title":"Q&A: where public tests come from, and what a failed test means","problem":"Where do the public tests come from on the very first turn, and who or what decides that a test failed?","why":"The evaluation must be an actual execution, not the model's self-assessment, and the user can supply arbitrary problem descriptions, so the loop has to be designed around a fixed test set.","how":"Keep one set of tests as public and another as private; for CodeContests you keep a subset public for inference-time feedback and a subset for training. Failing means the generated solution is incorrect; the raw test output is appended to the LM as explicit execution feedback before the next attempt.","detail":"<p>Student questions and answers:<\/p><ul><li><b>Source of public tests<\/b>: you hold out a set of tests as public and another as private. This is designed for the automatic loop — for example with CodeContests, design the auto loop so the model can improve, keeping some tests for inference-time feedback and some to train on.<\/li><li><b>Meaning of failure<\/b>: a failing test says the generated solution is not correct. The test output is fed to the model — you failed — and that output is the execution feedback that goes back into the LM.<\/li><li><b>Who evaluates<\/b>: it is an actual running test, e.g. a simple Python function, not a model judgment. In the homework the analogous exercise is on math, identifying the error in a generated solution rather than executing code.<\/li><\/ul>","terms":["test execution","pass/fail","inference-time feedback","CodeContests","held-out tests"]},"zh":{"title":"问答：公开测试从何而来，以及测试失败意味着什么","problem":"在最初的轮次里，公开测试从哪里来？由谁或什么来判定测试失败？","why":"评估必须是真实的执行，而非模型的自我评估；用户可能提供任意的问题描述，因此循环必须围绕固定的测试集来设计。","how":"保留一组测试作为公开、另一组作为私有；对 CodeContests，你保留一个子集公开用于推理时反馈，另一个子集用于训练。失败意味着生成的解法不正确；原始测试输出会作为显式执行反馈追加给 LM，然后才进行下一次尝试。","detail":"<p>学生提问与回答：<\/p><ul><li><b>公开测试的来源<\/b>：你拿出一组测试作为公开，另一组作为私有。这是为自动循环设计的——例如 CodeContests，设计自动循环使模型能够改进，保留一些测试用于推理时反馈，一些用于训练。<\/li><li><b>失败的含义<\/b>：测试失败说明生成的解法不正确。测试输出被喂给模型——你失败了——该输出就是回传给 LM 的执行反馈。<\/li><li><b>谁来评估<\/b>：是一个真正运行的测试，例如一个简单的 Python 函数，而非模型判断。在作业中，类似的练习是在数学上识别生成解法中的错误，而不是执行代码。<\/li><\/ul>","terms":["测试执行","通过/失败","推理时反馈","CodeContests","留出测试"]}},{"t":2124,"figs":[{"t":2123,"file":"slides/part04/slide_121.jpg"},{"t":2194,"file":"slides/part04/slide_122.jpg"},{"t":2212,"file":"slides/part04/slide_128.jpg"},{"t":2304,"file":"slides/part04/slide_146.jpg"}],"en":{"title":"RLEF results: solve rate and targeted error repair","problem":"Does execution-feedback RL actually raise code solve rates, and does training on competitive programming transfer to other coding benchmarks?","why":"The base model does not profit from merely seeing faulty solutions and execution feedback. What helps is that feedback is shown every turn, so the model learns <i>where<\/i> the error is and makes targeted repairs instead of random edits — and this generalizes.","how":"Train on CodeContests with per-turn execution feedback and evaluate solve rate over a sampling budget on validation and test splits; then analyze error counts per turn and the number of code changes.","detail":"<p>Results on <b>Llama 3.1<\/b> trained on <b>CodeContests<\/b>:<\/p><ul><li><b>Solve rate<\/b> rises substantially with RLEF on both validation and test. Solve-rate 10@K means passing at least one of 10 generated solutions; the x-axis (sampling budget) is log-scaled, so gains are real but front-loaded.<\/li><li>Error analysis across turns 1, 2, 3 shows RLEF yields <b>fewer wrong outputs<\/b> and increasingly <b>targeted edits<\/b>. Without the iteration loop the model makes incorrect edits rather than repairs.<\/li><li>Mechanism: leverage both higher sample <b>diversity<\/b> and the per-turn <b>error localization<\/b> that lets the model repair rather than regenerate.<\/li><li>Failures shift toward <b>timeout<\/b> errors when the solution never becomes correct.<\/li><li>Takeaway: execution feedback improves code generation and generalizes to other benchmarks in the code-generation realm.<\/li><\/ul>","terms":["solve rate","pass@K","CodeContests","Llama 3.1","targeted repair","timeout"]},"zh":{"title":"RLEF 结果：解题率与有针对性的错误修复","problem":"执行反馈 RL 是否真的提高了代码解题率，且在竞赛编程上训练能否迁移到其他编程基准？","why":"基础模型仅仅看到有缺陷的解法和执行反馈并不会获益。有帮助的是：每一轮都展示反馈，使模型学会<i>错误在哪里<\/i>并做出有针对性的修复，而不是随机编辑——而且这能泛化。","how":"在 CodeContests 上以每轮执行反馈进行训练，并在验证集和测试集上以一定采样预算评估解题率；然后分析每轮的错误数和代码修改次数。","detail":"<p>在 <b>CodeContests<\/b> 上训练的 <b>Llama 3.1<\/b> 的结果：<\/p><ul><li>在验证集和测试集上，RLEF 都使<b>解题率<\/b>大幅上升。Solve-rate 10@K 指 10 个生成解法中至少一个通过；x 轴（采样预算）为对数尺度，因此收益是真实的，但靠前部分更集中。<\/li><li>对第 1、2、3 轮的错误分析显示，RLEF 产生<b>更少的错误输出<\/b>和越来越<b>有针对性的编辑<\/b>。没有迭代循环时，模型做的是不正确的编辑而非修复。<\/li><li>机制：同时利用更高的样本<b>多样性<\/b>和每轮的<b>错误定位<\/b>，让模型修复而不是重新生成。<\/li><li>当解法始终不正确时，失败会转向<b>超时<\/b>错误。<\/li><li>结论：执行反馈改进代码生成，并在代码生成领域泛化到其他基准。<\/li><\/ul>","terms":["解题率","pass@K","CodeContests","Llama 3.1","针对性修复","超时"]}},{"t":2305,"figs":[{"t":2304,"file":"slides/part04/slide_146.jpg"},{"t":2314,"file":"slides/part04/slide_131.jpg"},{"t":2504,"file":"slides/part04/slide_137.jpg"},{"t":2512,"file":"slides/part04/slide_138.jpg"},{"t":2534,"file":"slides/part04/slide_139.jpg"},{"t":2591,"file":"slides/part04/slide_143.jpg"}],"en":{"title":"RLEF Q&A: is binary reward enough? generalization and SFT vs RL","problem":"Is a binary reward sufficient to drive improvement, especially for harder problems? Does the method encourage first-turn correctness? Does RL beat supervised fine-tuning?","why":"CodeContests problems are small and simple, so binary feedback was enough; harder problems likely need richer error traces or metadata to debug efficiently. SFT on reasoning traces captures in-domain gains, but RL is able to solve slightly newer problems and thus generalizes more.","how":"Discussion of reward design at the final solution versus per-step rewards, and whether the model gets enough chances to self-correct before the private-test evaluation.","detail":"<p>Key exchanges:<\/p><ul><li><b>Binary sufficiency<\/b>: plausible that for more complex problems you would also need error traces or other metadata, not just pass/fail. This was flagged as a good project idea.<\/li><li><b>First-turn correctness<\/b>: the method does not force it; the model may take multiple turns, and for simple enough problems can often become correct. There is inference-time feedback plus the public-test gate before PPO, so the model gets a few chances to correct itself.<\/li><li><b>Generalization<\/b>: contest problems are harder than typical human-level coding, which may be why RLEF generalizes. SFT on reasoning traces still yields in-domain gains (same loss function), but RL shows a bit more generalization to newer/out-of-domain problems.<\/li><li><b>Process vs outcome<\/b>: the debate is not fully solved; different domains and benchmarks may need different choices. Residual failures are mostly timeout errors when the solution is still not correct, and much of this is domain specific.<\/li><\/ul>","terms":["binary reward","error trace","generalization","SFT vs RL","process reward model","outcome reward model"]},"zh":{"title":"RLEF 问答：二值奖励足够吗？泛化与 SFT vs RL","problem":"二值奖励是否足以驱动改进，尤其是在更难的问题上？该方法是否鼓励首轮就正确？RL 是否胜过监督微调？","why":"CodeContests 的问题小而简单，因此二值反馈足够；更难的问题很可能需要更丰富的错误轨迹或元数据才能高效调试。在推理轨迹上做 SFT 能获得域内收益，但 RL 能解决稍新一些的问题，因而泛化更好。","how":"讨论最终解法的奖励设计 vs 每步奖励，以及模型在私有测试评估前是否有足够机会自我纠正。","detail":"<p>关键交流：<\/p><ul><li><b>二值是否足够<\/b>：对于更复杂的问题，很可能还需要错误轨迹或其他元数据，而不仅仅是通过/失败。这被标为一个好项目想法。<\/li><li><b>首轮正确性<\/b>：该方法并不强制首轮正确；模型可以多轮尝试，对足够简单的问题往往能变正确。在 PPO 之前有推理时反馈加公开测试闸门，因此模型有几次自我纠正的机会。<\/li><li><b>泛化<\/b>：竞赛题比典型人类水平的编程更难，这可能是 RLEF 能泛化的原因。在推理轨迹上做 SFT 仍带来域内收益（同样的损失函数），但 RL 对新/域外问题展现出稍好的泛化。<\/li><li><b>过程 vs 结果<\/b>：这场争论尚未完全解决；不同领域和基准可能需要不同选择。残余失败大多是解法仍不正确时的超时错误，且其中很多是领域相关的。<\/li><\/ul>","terms":["二值奖励","错误轨迹","泛化","SFT vs RL","过程奖励模型","结果奖励模型"]}},{"t":2641,"figs":[{"t":2644,"file":"slides/part04/slide_147.jpg"},{"t":2704,"file":"slides/part04/slide_152.jpg"}],"en":{"title":"Long-context repos: retrieval and summarization before patching (SWE-bench, CodeMonkey)","problem":"What do you do when the codebase does not fit in the context window, as in real-repo engineering tasks?","why":"You cannot feed the whole repository to the model. You must first decide what information is needed, retrieve it, and only then produce a patch and test it — so retrieval and summarization are prerequisites for the test-pass step.","how":"Use ReAct-style behavior: think about what information is needed, use search tools, and continue until enough information is gathered. Condense or summarize each document so summaries fit in context; use graph factorization plus similarity (RAG); then generate the code patch and check whether the test passes.","detail":"<p>The class proposed and the speaker endorsed several approaches:<\/p><ul><li><b>Search/retrieval first<\/b>: think about what is needed, search, and only move on when enough information is available — exactly the previous paper's pattern.<\/li><li><b>Summarization<\/b>: condense the code of each document into a short summary so the summaries together fit in context.<\/li><li><b>RAG / representation<\/b>: graph-factorize the code and retrieve by similarity, then iterate; in the loop, verify whether enough information was gathered and if not retrieve again.<\/li><\/ul><p>This is what actually runs inside Claude Code: search for the relevant code, apply the edit, then test. One benchmark targeting this is <b>SWE-bench<\/b>; the speaker notes one slide was skipped and the takeaway is that execution feedback generalizes across coding benchmarks. <b>CodeMonkey<\/b> (from Aalya's lab) targets very similar ideas.<\/p>","terms":["RAG","context window","SWE-bench","CodeMonkey","code patch","summarization"]},"zh":{"title":"长上下文代码库：打补丁前先检索与摘要（SWE-bench、CodeMonkey）","problem":"当代码库放不进上下文窗口时，比如真实仓库的工程任务，你该怎么办？","why":"你无法把整个仓库喂给模型。必须先决定需要哪些信息、检索它，然后才产出补丁并测试——因此检索与摘要是测试通过步骤的前提。","how":"使用 ReAct 式行为：思考需要哪些信息，使用搜索工具，直到收集到足够信息。压缩或摘要每份文档，使摘要能放进上下文；使用图分解加相似度（RAG）；然后生成代码补丁并检查测试是否通过。","detail":"<p>课堂提出并获得讲者认可的做法：<\/p><ul><li><b>先搜索/检索<\/b>：思考需要什么，搜索，只有信息足够时才继续——正是上一篇论文的模式。<\/li><li><b>摘要<\/b>：把每份文档的代码压缩成简短摘要，使所有摘要合起来能放进上下文。<\/li><li><b>RAG / 表示<\/b>：对代码做图分解并按相似度检索，然后迭代；在循环中核实是否收集到足够信息，若没有则再次检索。<\/li><\/ul><p>这正是 Claude Code 实际运行的方式：搜索相关代码、应用编辑、然后测试。针对这一点的基准之一是 <b>SWE-bench<\/b>；讲者提到有一页幻灯片被跳过，结论是执行反馈在编程基准之间泛化。<b>CodeMonkey<\/b>（来自 Aalya 的实验室）针对非常相似的想法。<\/p>","terms":["RAG","上下文窗口","SWE-bench","CodeMonkey","代码补丁","摘要"]}},{"t":2790,"figs":[{"t":2817,"file":"slides/part04/slide_158.jpg"},{"t":2875,"file":"slides/part04/slide_159.jpg"},{"t":2949,"file":"slides/part04/slide_179.jpg"},{"t":2977,"file":"slides/part04/slide_167.jpg"},{"t":3040,"file":"slides/part04/slide_169.jpg"}],"en":{"title":"Constitutional AI: replacing human labels with a written constitution","problem":"RLHF needs tens of thousands of human preference labels — slow, tedious, and unscalable — yet base models can produce harmful outputs, and we want models that are both helpful and harmless.","why":"Human feedback is the bottleneck. But models are now good at instruction following, so you can ask whether an output exhibits a behavior and ask for a rewrite — turning human-written <b>rules<\/b> into a scalable feedback source with humans in the loop only to write the rules.","how":"Write a constitution of 16 human-written principles. For each output issue a <i>critique request<\/i> (is it harmful/unethical, gender-biased, inappropriate for children?) and a <i>revision request<\/i> (remove that content). Fine-tune on the self-critique/revision traces (supervised stage), then train an AI preference model on those responses plus the constitution and RL the LLM (RLAIF).","detail":"<p><b>RLHF<\/b> collects human preferences (is the output correct, useful, specific enough?) to build a reward model; larger models clearly benefit more from RLHF than from plain fine-tuning. Constitutional AI replaces the labels with principles.<\/p><ul><li>The constitution is <b>16 principles<\/b> defining desired behavior, written by humans, used as the seed for the self-improvement loop.<\/li><li>Each principle becomes a prompt that elicits whether the model is following the constitution, critiques the output, and asks for a revision.<\/li><li>Revising <i>requires two capabilities<\/i>: detecting the behavior in text, and following the rewrite instruction. Both are emergent instruction-following skills the paper exploits.<\/li><li>Example critiques in the paper cover harm/unethical content, gender bias, and content inappropriate for children, each paired with a revision request.<\/li><\/ul>","terms":["RLHF","constitution","critique request","revision request","self-critique","RLAIF"]},"zh":{"title":"Constitutional AI：用成文 constitution 取代人类标注","problem":"RLHF 需要数万条人类偏好标注——缓慢、繁琐、难以扩展——而基础模型可能产生有害输出，我们想要既有用又无害的模型。","why":"人类反馈是瓶颈。但模型如今擅长指令遵循，因此你可以询问某个输出是否表现出某种行为、并要求重写——把人工撰写的<b>规则<\/b>变成可扩展的反馈来源，人类只需参与编写规则。","how":"编写由 16 条人工撰写的原则构成的 constitution。对每个输出发出一个<i>批判请求<\/i>（它是否有害/不道德、有性别偏见、不适合儿童？）和一个<i>修订请求<\/i>（移除该内容）。在自我批判/修订轨迹上微调（监督阶段），然后在这些响应加 constitution 上训练 AI 偏好模型，并对 LLM 做 RL（RLAIF）。","detail":"<p><b>RLHF<\/b> 收集人类偏好（输出是否正确、有用、足够具体？）来构建奖励模型；更大的模型从 RLHF 中获得的收益明显多于普通微调。Constitutional AI 用原则取代标注。<\/p><ul><li>constitution 是定义期望行为的 <b>16 条原则<\/b>，由人类撰写，用作自我改进循环的种子。<\/li><li>每条原则变成一个 prompt，用于引出模型是否遵循 constitution、对输出进行批判，并要求修订。<\/li><li>修订<i>需要两种能力<\/i>：在文本中检测该行为，以及遵循重写指令。两者都是论文所利用的涌现式指令遵循技能。<\/li><li>论文中的示例批判涵盖有害/不道德内容、性别偏见和不适合儿童的内容，每个都配有一个修订请求。<\/li><\/ul>","terms":["RLHF","constitution","批判请求","修订请求","自我批判","RLAIF"]}},{"t":3045,"figs":[{"t":3052,"file":"slides/part04/slide_170.jpg"},{"t":3086,"file":"slides/part04/slide_171.jpg"}],"en":{"title":"CAI supervised stage: the helpfulness / harmlessness trade-off","problem":"Does supervised learning on self-revisions actually improve harmlessness without destroying helpfulness?","why":"Pushing the model toward a fixed set of principles can make it less helpful, but the paper's claim is that helpfulness plus harmlessness improves monotonically overall. There is no explicit feedback signal — only a reshaped output distribution biased toward the revised responses, which holds as long as fine-tuning is small relative to pretraining.","how":"Fine-tune on the critique/revision traces and measure helpfulness and harmlessness as revisions increase.","detail":"<p>The mechanism is deliberately simple: the model generates responses, critiques them against the constitution, revises them, and is fine-tuned on the revised traces. Student Q&amp;A drew out the key subtlety:<\/p><ul><li>This stage simply reinforces the likelihood of the revised generations — it biases the distribution toward constitutional responses rather than optimizing an explicit reward.<\/li><li>Because the fine-tuning is much smaller than pretraining, the model does not lose its initial capabilities, but its output distribution starts to shift.<\/li><li>With increasing revisions, <b>harmlessness improves<\/b> and <b>helpfulness declines<\/b> under pure supervised learning, yet the combined helpfulness-plus-harmlessness metric improves monotonically.<\/li><li>The speaker framed this as a general pattern used in many later pipelines, not unique to Constitutional AI.<\/li><\/ul>","terms":["supervised fine-tuning","harmlessness","helpfulness","output distribution","pretraining scale","revision"]},"zh":{"title":"CAI 监督阶段：有用性与无害性的权衡","problem":"在自我修订上做监督学习，是否真的能提升无害性而不破坏有用性？","why":"把模型推向一组固定的原则可能使它不那么有用，但论文的主张是：总体上有用性加无害性单调提升。这里没有显式的反馈信号——只有一个被重塑、偏向修订后响应的输出分布，只要微调相对预训练规模很小这一点就成立。","how":"在批判/修订轨迹上微调，并随着修订次数增加测量有用性与无害性。","detail":"<p>机制刻意保持简单：模型生成响应，依据 constitution 对其进行批判、修订，并在修订后的轨迹上微调。学生问答引出了其中的关键微妙之处：<\/p><ul><li>这一阶段只是强化修订后生成结果的似然——它把分布偏向符合 constitution 的响应，而不是优化某个显式奖励。<\/li><li>由于微调远小于预训练，模型不会失去初始能力，但其输出分布开始偏移。<\/li><li>随着修订增加，在纯监督学习下<b>无害性提升<\/b>而<b>有用性下降<\/b>，但有用性加无害性的综合指标单调提升。<\/li><li>讲者把这一点描述为许多后续流水线都会用到的通用模式，并非 Constitutional AI 独有。<\/li><\/ul>","terms":["监督微调","无害性","有用性","输出分布","预训练规模","修订"]}},{"t":3107,"figs":[],"en":{"title":"CAI RL stage and the constitution-amendment problem","problem":"How is the preference model trained and used, and what happens when the constitution must be amended?","why":"A preference model trained on AI critiques substitutes for human preference labels (RLAIF). But updating or removing rules is a continual-learning / unlearning problem, and there is no proven way to make a model forget a rule.","how":"Train a preference model on the stage-1 responses plus the constitution, then RL-fine-tune the LLM to maximize it, so the model responds in the most thoughtful, respectful, and cordial way. Amendments are handled because RLAIF is a late post-training stage (roughly 5% of compute) that is rerun frequently.","detail":"<p>Stage 2 replaces the RLHF loop: instead of tens of thousands of human labels, a preference model trained with the constitution provides the reward signal.<\/p><ul><li>The preference model is trained separately from the constitution and then used to fine-tune the LLM.<\/li><li><b>Validation<\/b>: when training the preference model you keep a test/validation set and check agreement with human scores, but it is not scaled to 10,000 labels — it works compositionally from the principles.<\/li><li><b>Amendments<\/b>: post-training is a small percentage of total compute and is refreshed often, so a changed constitution can be reapplied. However, making the model <i>completely remove<\/i> old rules is unsolved; interpretability-based cancellation is proposed but not proven.<\/li><li>The speaker flagged continual learning as an open research problem.<\/li><\/ul>","terms":["preference model","RLAIF","continual learning","unlearning","post-training","validation set"]},"zh":{"title":"CAI 的 RL 阶段与 constitution 修订问题","problem":"偏好模型如何训练和使用，当 constitution 必须被修订时又会怎样？","why":"在 AI 批判上训练的偏好模型可替代人类偏好标注（RLAIF）。但更新或移除规则是一个持续学习/遗忘问题，且没有可靠方法让模型忘掉某条规则。","how":"在阶段一的响应加 constitution 上训练一个偏好模型，然后对 LLM 做 RL 微调以最大化它，使模型以最有思想、最尊重、最诚恳的方式回应。修订之所以可处理，是因为 RLAIF 是后训练末期的阶段（约占算力 5%），会被频繁重跑。","detail":"<p>阶段二取代了 RLHF 循环：不再需要数万条人类标注，而是由一个用 constitution 训练出的偏好模型提供奖励信号。<\/p><ul><li>偏好模型与 constitution 分开训练，然后用于微调 LLM。<\/li><li><b>验证<\/b>：训练偏好模型时你会保留一个测试/验证集，检查与人类评分的一致性，但它并不扩展到 1 万条标注——它基于原则组合式地工作。<\/li><li><b>修订<\/b>：后训练只占总算力的一小部分，且会频繁刷新，因此改动后的 constitution 可以重新应用。然而，让模型<i>完全移除<\/i>旧规则尚未解决；有人提出基于可解释性的消除，但未经证实。<\/li><li>讲者把持续学习标为一个开放研究问题。<\/li><\/ul>","terms":["偏好模型","RLAIF","持续学习","遗忘","后训练","验证集"]}},{"t":3232,"figs":[{"t":3265,"file":"slides/part04/slide_177.jpg"},{"t":3511,"file":"slides/part04/slide_189.jpg"}],"en":{"title":"CAI results: the helpfulness / harmlessness Pareto frontier","problem":"Where on the helpfulness/harmlessness plane does constitutional RL land relative to human-feedback RLHF?","why":"Helpfulness and harmlessness trade off inversely — making a model more harmless can hurt the helpful axis — so the real objective is the Pareto frontier between the two, not a single axis.","how":"Plot harmlessness ELO on the y-axis against helpfulness ELO on the x-axis and compare: raw base model, helpful-only RLHF, helpful-plus-harmless RLHF, constitutional supervised learning, constitutional RL, and constitutional RL with chain-of-thought. Also sweep the number of training sequences on separate helpfulness-ELO and harmlessness-ELO axes.","detail":"<p>Ordering on the helpfulness/harmlessness plane:<\/p><ul><li>Raw pretrained base model is lowest; helpful-only RLHF pushes toward higher helpfulness; helpful-plus-harmless RLHF does better on both.<\/li><li><b>Constitutional supervised learning alone is still below RLHF.<\/b><\/li><li><b>Constitutional RL with chain-of-thought reaches the best Pareto frontier<\/b> — the headline result.<\/li><li>Replacing human preferences with AI feedback still yields a model that is roughly equally helpful (maybe slightly less) but much more harmless, which is where Claude models were historically strong.<\/li><li>Because harmlessness rises at the cost of helpfulness, the practical objective is to find the right balance — the frontier — rather than maximize one axis.<\/li><li>The pattern generalizes to any conflicting instruction-following objective, not just helpfulness vs harmlessness.<\/li><\/ul>","terms":["helpfulness ELO","harmlessness ELO","Pareto frontier","constitutional RL","chain-of-thought"]},"zh":{"title":"CAI 结果：有用性 / 无害性的 Pareto 前沿","problem":"相对于人类反馈 RLHF，constitutional RL 落在有用性/无害性平面的哪个位置？","why":"有用性与无害性呈反向权衡——让模型更无害可能损害有用性轴——因此真正的目标不是单一轴，而是两者之间的 Pareto 前沿。","how":"以无害性 ELO 为 y 轴、有用性 ELO 为 x 轴作图并比较：原始基础模型、仅有用性 RLHF、有用性加无害性 RLHF、constitutional 监督学习、constitutional RL，以及带 chain-of-thought 的 constitutional RL。另外在各自的有用性-ELO 和无害性-ELO 轴上扫描训练序列数量。","detail":"<p>在有用性/无害性平面上的排序：<\/p><ul><li>原始预训练基础模型最低；仅有用性 RLHF 推向更高的有用性；有用性加无害性 RLHF 在两者上都更好。<\/li><li><b>仅用 constitutional 监督学习仍低于 RLHF。<\/b><\/li><li><b>带 chain-of-thought 的 constitutional RL 达到最佳的 Pareto 前沿<\/b>——这是头条结果。<\/li><li>用 AI 反馈取代人类偏好，仍能得到一个有用性大致相当（可能略低）但无害性高得多的模型，这正是 Claude 系列模型历史上最强的地方。<\/li><li>由于无害性以有用性为代价上升，实际目标是找到合适的平衡——即前沿——而不是最大化某一轴。<\/li><li>这一模式可泛化到任何相互冲突的指令遵循目标，而不仅是有用性 vs 无害性。<\/li><\/ul>","terms":["有用性 ELO","无害性 ELO","Pareto 前沿","constitutional RL","chain-of-thought"]}},{"t":3578,"figs":[{"t":3592,"file":"slides/part04/slide_190.jpg"}],"en":{"title":"Follow-on work: RLAIF vs RLHF, Self-Refine, consensus critique","problem":"Is self-critique a reliable feedback signal, and what research followed Constitutional AI?","why":"Getting a model to critique itself is harder than it looks because models are overconfident and not well calibrated. A <b>consensus of models<\/b> often critiques better than a single self-critique.","how":"Follow-ons: a paper comparing RLAIF with RLHF; Self-Refine, which does iterative refinement with self-feedback; and work that teaches models self-correction with reinforcement learning. The speaker frames this as an active area beyond the helpfulness/harmlessness paradigm and a source of project ideas.","detail":"<p>These follow-ons extend the core idea that a model can generate its own feedback, but refine how reliable that feedback is:<\/p><ul><li><b>RLAIF vs RLHF<\/b>: direct comparison of AI feedback against human feedback as the preference source.<\/li><li><b>Self-Refine<\/b>: iterative refinement driven by self-feedback, closely related to the critique/revision stage.<\/li><li><b>Self-correction RL<\/b>: training models to self-correct rather than relying on a fixed constitutional critique.<\/li><li><b>Consensus critique<\/b>: because a model can be overconfident in what it does not know, aggregating critiques across several models can work better than isolated self-critique.<\/li><\/ul><p>The unifying takeaway from all three papers: build a feedback loop on top of the model, and when the loop carries enough signal, the model improves beyond the data it was trained on.<\/p>","terms":["RLAIF","RLHF","Self-Refine","self-correction RL","model consensus","self-feedback"]},"zh":{"title":"后续工作：RLAIF vs RLHF、Self-Refine、共识批判","problem":"自我批判是可靠的反馈信号吗，Constitutional AI 之后有哪些研究？","why":"让模型批判自己比看起来更难，因为模型过度自信且校准不佳。<b>多个模型的共识<\/b>往往比单一自我批判批判得更好。","how":"后续工作：一篇比较 RLAIF 与 RLHF 的论文；Self-Refine，用自我反馈做迭代精炼；以及用强化学习教会模型自我纠正的工作。讲者把这描述为有用性/无害性范式之外的一个活跃领域，也是项目想法的来源。","detail":"<p>这些后续工作扩展了模型能生成自身反馈这一核心想法，但改进了这种反馈的可靠性：<\/p><ul><li><b>RLAIF vs RLHF<\/b>：直接比较 AI 反馈与人类反馈作为偏好来源。<\/li><li><b>Self-Refine<\/b>：由自我反馈驱动的迭代精炼，与批判/修订阶段密切相关。<\/li><li><b>自我纠正 RL<\/b>：训练模型自我纠正，而不是依赖固定的 constitutional 批判。<\/li><li><b>共识批判<\/b>：由于模型可能对自己不知道的东西过度自信，跨多个模型聚合并批判往往比孤立的自我批判效果更好。<\/li><\/ul><p>三篇论文统一的结论：在模型之上构建一个反馈循环，当循环携带足够信号时，模型就会超越其训练数据而改进。<\/p>","terms":["RLAIF","RLHF","Self-Refine","自我纠正 RL","模型共识","自我反馈"]}},{"t":3628,"figs":[{"t":3689,"file":"slides/part04/slide_197.jpg"},{"t":3781,"file":"slides/part04/slide_204.jpg"}],"en":{"title":"Recap: three feedback channels","problem":"What is the unifying lesson across ReAct, RLEF, and Constitutional AI?","why":"When a feedback loop carries enough signal, the model has a way to improve beyond the data it was trained on. The three papers are worked examples of that principle with different feedback sources.","how":"Recap the three channels: ReAct (act in the real world, combine environment feedback with reasoning to ground answers and decisions), RLEF (execution/test feedback to iteratively generate correct code, reducing the compute budget to reach state of the art on competitive programming), and Constitutional AI (self-critique against human-written rules, or any rule set whose compliance can be checked).","detail":"<p>Summary of what was covered:<\/p><ul><li><b>ReAct<\/b>: get the model to act and combine the resulting observations with reasoning, so it is grounded and can answer questions, check facts, and act as a decision maker in games or browser agents. A key benefit of doing it in language space is that decision traces are extremely interpretable. Tool calling is now innate in many out-of-the-box models, but ReAct is the building block.<\/li><li><b>RLEF<\/b>: coding agents need execution feedback, best obtained from unit tests, to iteratively produce correct code; this reduces the budget needed to reach state-of-the-art competitive-programming performance.<\/li><li><b>Constitutional AI<\/b>: use a constitution of human-written principles to generate self-improvement feedback, generalizable to any rule set where compliance can be evaluated.<\/li><\/ul>","terms":["feedback loop","self-improvement","tool calling","execution feedback","constitution","interpretability"]},"zh":{"title":"回顾：三种反馈渠道","problem":"ReAct、RLEF 和 Constitutional AI 统一的教训是什么？","why":"当一个反馈循环携带足够信号时，模型就有办法超越其训练数据而改进。这三篇论文就是该原理在不同反馈来源下的实例。","how":"回顾三种渠道：ReAct（在真实世界中行动，把环境反馈与推理结合以 grounding 答案和决策）、RLEF（执行/测试反馈以迭代生成正确代码，降低达到竞赛编程最优水平所需的算力预算）、以及 Constitutional AI（依据人工撰写规则的自我批判，或任何可检查合规性的规则集）。","detail":"<p>所涵盖内容的总结：<\/p><ul><li><b>ReAct<\/b>：让模型行动，并把得到的观测与推理结合，使其有 grounding，能够回答问题、核查事实，并在游戏或浏览器智能体中充当决策者。在语言空间中做这件事的一个关键好处是决策轨迹极其可解释。工具调用如今在许多开箱即用的模型中已属天生，但 ReAct 是构建块。<\/li><li><b>RLEF<\/b>：编程智能体需要执行反馈，最好来自单元测试，以迭代产出正确代码；这降低了达到竞赛编程最先进水平所需的预算。<\/li><li><b>Constitutional AI<\/b>：用由人工撰写原则构成的 constitution 来生成自我改进反馈，可泛化到任何能评估合规性的规则集。<\/li><\/ul>","terms":["反馈循环","自我改进","工具调用","执行反馈","constitution","可解释性"]}},{"t":3812,"figs":[],"en":{"title":"Closing discussion: cognitive science, agent transfer, and the boundaries of the approach","problem":"Are there systematic ways to import cognitive/behavioral science into LLMs? Do these techniques transfer to agents? Does ReAct's handcrafted framework become obsolete under RL? Is context simply the state? Can harmful outputs be restricted directly?","why":"We still use parallels from how humans solve problems because reasoning-space search is not automated for open-ended tasks. The deeper question is whether reasoning-space search can be defined and automated; for finance or legal agents the workflow is inherently domain specific.","how":"Speaker answers: closed-source models hill-climb without naming the reasoning space; ReAct defines the sequence or workflow (reason, act, reason, act), and generalizing it to an agent is domain specific. Context is the state in prompting. Reward can shape token generation, but the workflow that accomplishes the task still matters. Harmful-output restriction happens partly, but since models are trained on internet data, no amount of restriction removes all of it, and data filtering plays a large role.","detail":"<p>Final Q&amp;A themes:<\/p><ul><li><b>Cognitive science<\/b>: we use human-style heuristics (think step by step, decompose, analyze, run parallel loops) because the reasoning space is not well defined. If a well-defined search space exists — as in games with limited actions — you can define and automate the search; for open-ended experience with real tools you must collect observations and use them.<\/li><li><b>Agents<\/b>: this is a fundamental building block; an agent adds interconnected models, memory, and sessions, but how an LLM responds in a certain way remains the foundation.<\/li><li><b>ReAct under RL<\/b>: partly yes, partly no. If you can define the search space, RL can handle it; but for a finance or legal agent the required workflow is domain specific, so some handcrafted structure persists.<\/li><li><b>Formalism<\/b>: the context C-sub-t is treated as the state — in prompting, state literally is what is in the context.<\/li><li><b>Restriction<\/b>: some filtering happens, but models trained on the internet cannot be fully scrubbed.<\/li><\/ul>","terms":["cognitive science","agent workflow","reasoning space","context as state","data filtering","domain specificity"]},"zh":{"title":"收尾讨论：认知科学、智能体迁移与该方法的边界","problem":"有没有系统性的方法把认知/行为科学引入 LLM？这些技术会迁移到智能体吗？在 RL 下 ReAct 这种手工设计的框架会过时吗？上下文就是状态吗？有害输出能直接被限制吗？","why":"我们仍然使用人类解决问题的类比，因为对开放式任务而言，推理空间搜索尚未自动化。更深层的问题是，推理空间搜索能否被定义并自动化；对金融或法律智能体，工作流本质上是领域特定的。","how":"讲者回答：闭源模型在不指名推理空间的情况下爬山；ReAct 定义了序列或工作流（推理、行动、推理、行动），把它泛化到智能体是领域特定的。在提示中，上下文就是状态。奖励可以塑造 token 生成，但完成任务的工作流仍然重要。有害输出限制在一定程度上发生，但由于模型在互联网数据上训练，任何限制都无法完全消除它，数据过滤起很大作用。","detail":"<p>最后的问答主题：<\/p><ul><li><b>认知科学<\/b>：我们使用人类式启发法（逐步思考、分解、分析、运行并行循环），因为推理空间没有被很好地定义。如果存在定义良好的搜索空间——比如动作有限的游戏——你就能定义并自动化搜索；对于使用真实工具的开放式体验，你必须收集观测并使用它们。<\/li><li><b>智能体<\/b>：这是一个基础的构建块；智能体增加了相互连接的模型、记忆和会话，但 LLM 如何以某种方式回应仍是基础。<\/li><li><b>RL 下的 ReAct<\/b>：部分是，部分不是。如果你能定义搜索空间，RL 就能处理它；但对金融或法律智能体，所需工作流是领域特定的，因此某些手工设计的结构仍会保留。<\/li><li><b>形式化<\/b>：上下文 C-sub-t 被视为状态——在提示中，状态字面上就是上下文里的内容。<\/li><li><b>限制<\/b>：会发生一些过滤，但在互联网上训练的模型无法被完全清洗。<\/li><\/ul>","terms":["认知科学","智能体工作流","推理空间","上下文即状态","数据过滤","领域特定性"]}}]},{"n":5,"id":"Ml_fp9XkB8Y","duration":4492,"slideCount":47,"en":{"title":"Planning and Multi-Step Reasoning","summary":"This lecture surveys three systems that turn a language model into a planning agent that reasons, acts, and searches. LATS unifies reasoning, acting, and planning by bolting Monte-Carlo Tree Search onto an LLM loop: actions are sampled, scored by an LLM-judge value plus self-consistency, selected with UCT, simulated to a terminal state, and back-propagated, with a reflection step writing lessons back into context. It sets HotpotQA and WebShop records test-time but pays a large, unmeasured compute cost and assumes reversible actions. SPRINT attacks the latency of long sequential chains by teaching (via GPT-4o-annotated reasoning DAGs and SFT) a planner that emits independent plans and executors that run them in parallel, cutting sequential tokens ~40% while raising accuracy on math/GPQA. SWIRL builds synthetic multi-step, tool-use trajectories offline, scores each step with an LLM judge, filters by process rather than only outcome, and runs multi-step RL without live tool calls, generalizing from GSM8K to HotpotQA and vice versa. Recurring themes: value/process guidance, exploration-exploitation, parallelization, verification, and train-time vs test-time compute."},"zh":{"title":"规划与多步推理","summary":"本讲梳理了三个将语言模型转变为会推理、行动与搜索的规划 agent 的系统。LATS 通过把 Monte-Carlo Tree Search 接入 LLM 循环，将推理、行动与规划统一起来：动作被采样，由 LLM-judge 价值加 self-consistency 打分，用 UCT 选择，模拟至终局状态，再进行反向传播，并通过一个 reflection 步骤把经验写回 context。它在 test-time 刷新了 HotpotQA 与 WebShop 的纪录，但付出了巨大且未被测量的算力成本，并假设动作可逆。SPRINT 针对长顺序链的延迟问题，通过（由 GPT-4o 标注的推理 DAG 加 SFT）教出一个 planner 输出独立计划、以及一组 executor 并行执行这些计划，在数学/GPQA 上把顺序 token 削减约 40% 的同时提升准确率。SWIRL 离线构建合成的多步、工具使用轨迹，用 LLM judge 为每一步打分，按过程而非仅按结果过滤，并在不进行实时工具调用的情况下运行多步 RL，实现从 GSM8K 到 HotpotQA 以及反向的泛化。反复出现的主题包括：价值/过程引导、探索与利用、并行化、验证，以及训练时算力与测试时算力的权衡。"},"sections":[{"t":5,"figs":[{"t":10,"file":"slides/part05/slide_003.jpg"},{"t":28,"file":"slides/part05/slide_004.jpg"},{"t":69,"file":"slides/part05/slide_006.jpg"}],"en":{"title":"Lecture Framing: Reasoning, Acting, and Searching Across Three Papers","problem":"Multi-step tasks cannot be solved by a single generation: the agent must think about what to do, act to gather information or change state, then search over the trajectories that result.","why":"Trip planning is the running example: reason about budget and plan, act by browsing Reddit or a travel blog, search by refining the plan and considering alternatives. Reasoning alone never touches the world; acting alone never picks a good route.","how":"The lecture covers three papers on multi-step reasoning and planning, starting with LATS (Language Agent Tree Search), an ICML paper whose title explicitly unifies reasoning, acting, and planning in language models.","detail":"<p>Opening framing for CS329A lecture 5, <b>Planning and Multi-Step Reasoning<\/b>.<\/p><ul><li>The class will cover <b>three papers<\/b> on multi-step reasoning and planning, beginning with <code>LATS<\/code> (<i>Language Agent Tree Search<\/i>) from <b>ICML<\/b>.<\/li><li>The target applications need the model to <b>reason<\/b> about what to do and <b>act<\/b> through those reasoning steps, then <b>search/optimize trajectories<\/b> toward a final correct answer.<\/li><li>Running example — planning a trip: the reasoning step covers budget and destination; the action step browses the web, generates a search query, reads Reddit or a travel blog; the search step refines the plan given the gathered feedback (e.g. consider alternative destinations, find new activities).<\/li><li>So the agent alternates reasoning, action, and search, rather than producing an answer in one shot.<\/li><\/ul>","terms":["LATS","Language Agent Tree Search","multi-step reasoning","planning","acting","trajectory search","ICML"]},"zh":{"title":"课程导入：跨三篇论文的推理、行动与搜索","problem":"多步任务无法通过单次生成解决：agent 必须先思考要做什么，通过行动收集信息或改变状态，然后在由此产生的轨迹上进行搜索。","why":"旅行规划是贯穿全程的示例：推理预算与计划，通过浏览 Reddit 或旅行博客来行动，通过细化计划并考虑备选方案来搜索。仅靠推理永远无法触及真实世界；仅靠行动也永远选不出好的路线。","how":"本讲涵盖三篇关于多步推理与规划的论文，首先从 LATS（Language Agent Tree Search）开始，这是一篇 ICML 论文，其标题明确地将语言模型中的推理、行动与规划统一起来。","detail":"<p>CS329A 第 5 讲的开场框架，主题为 <b>Planning and Multi-Step Reasoning<\/b>。<\/p><ul><li>本课程将涵盖<b>三篇论文<\/b>，均关于多步推理与规划，首先从 <code>LATS<\/code>（<i>Language Agent Tree Search<\/i>）开始，这是一篇 <b>ICML<\/b> 论文。<\/li><li>目标应用需要模型<b>推理<\/b>要做什么，并通过这些推理步骤<b>行动<\/b>，然后<b>搜索/优化轨迹<\/b>以得到最终正确答案。<\/li><li>贯穿全程的示例——规划一次旅行：推理步骤涵盖预算与目的地；行动步骤浏览网页、生成搜索查询、阅读 Reddit 或旅行博客；搜索步骤根据收集到的反馈细化计划（例如考虑备选目的地、发现新的活动）。<\/li><li>因此 agent 在推理、行动与搜索之间交替进行，而不是一次性给出答案。<\/li><\/ul>","terms":["LATS","Language Agent Tree Search","多步推理","规划","行动","轨迹搜索","ICML"]}},{"t":138,"figs":[{"t":139,"file":"slides/part05/slide_008.jpg"}],"en":{"title":"Core Challenge: Diversity, Exploration, and the MCTS Import","problem":"LLMs generate a plan and execute it, but they are weak at creating a diversity of candidate solutions and at acting on them — a limitation that persists today.","why":"Without diversified exploration, multi-step optimization settles into one mediocre trajectory; to reach better solutions the agent must sample many paths, measure them, and keep exploring while exploiting.","how":"The paper imports known RL and multi-step planning techniques — most importantly Monte-Carlo Tree Search — into the LLM reasoning path, and lets the model take environment feedback back in to refine future plans and search.","detail":"<p>The paper's stated challenge: go from <i>the LLM generates a plan and executes it<\/i> to something that encourages <b>diversification and exploration<\/b> of different plans/paths.<\/p><ul><li>Observed weakness (still true today): models are poor at <b>creating diverse solutions<\/b> and at <b>acting upon them<\/b>, and at planning multiple steps of optimization to reach a solution.<\/li><li>Prescription: bring proven techniques from <b>reinforcement learning<\/b> and <b>multi-step planning<\/b> — specifically <b>Monte-Carlo Tree Search<\/b> — into the LLM reasoning path.<\/li><li>Because models can consume feedback, the framework also lets the agent take <b>feedback from the environment<\/b> as it explores and feed that back to refine and optimize future plans and search.<\/li><li>The tension the whole lecture returns to: more search buys accuracy but costs compute, and the cost is not free.<\/li><\/ul>","terms":["diversity","exploration","exploitation","Monte-Carlo Tree Search","reinforcement learning","environment feedback","plan refinement"]},"zh":{"title":"核心挑战：多样性、探索与 MCTS 的引入","problem":"LLM 会生成一个计划并执行它，但在创造多样化的候选解以及据此行动方面表现薄弱——这一局限至今仍然存在。","why":"若没有多样化的探索，多步优化会陷入一条平庸的轨迹；为了得到更好的解，agent 必须采样大量路径、对它们进行评估，并在利用的同时持续探索。","how":"该论文将已知的 RL 与多步规划技术——最重要的是 Monte-Carlo Tree Search——引入 LLM 的推理路径，并让模型把环境反馈纳入进来，以细化未来的计划与搜索。","detail":"<p>论文提出的挑战：从<i>LLM 生成一个计划并执行它<\/i>，走向一种鼓励对不同计划/路径进行<b>多样化与探索<\/b>的方法。<\/p><ul><li>观察到的弱点（今天依然如此）：模型在<b>创造多样化解<\/b>与<b>据此行动<\/b>方面表现很差，也不擅长规划多个优化步骤以得到解。<\/li><li>对策：将<b>强化学习<\/b>与<b>多步规划<\/b>中经过验证的技术——具体而言是 <b>Monte-Carlo Tree Search<\/b>——引入 LLM 的推理路径。<\/li><li>由于模型能够消费反馈，该框架还让 agent 在探索过程中接收<b>来自环境的反馈<\/b>，并将其回馈以细化和优化未来的计划与搜索。<\/li><li>整讲反复回到的张力：更多搜索能换来更高准确率，但会消耗算力，而算力并非免费。<\/li><\/ul>","terms":["多样性","探索","利用","Monte-Carlo Tree Search","强化学习","环境反馈","计划细化"]}},{"t":219,"figs":[],"en":{"title":"LATS Walkthrough: Scoring Actions and Expanding the Tree","problem":"Given a prompt, the model can propose many actions, but there is no built-in signal telling it which branch of the plan is worth pursuing.","why":"If every sampled action is scored and the tree is expanded only along high-scoring actions, the agent spends its budget on promising trajectories while still sampling alternatives.","how":"Take the Hawaii-trip prompt: sampling yields actions like 'ask friends who went' or 'read related subreddits'. The framework scores each action, expands the higher-scoring one (e.g. ask friend A and friend B), scores the resulting responses, and repeats. Some actions can run in parallel.","detail":"<p>Concrete example: prompt = <i>plan a trip to Hawaii<\/i>.<\/p><ul><li>Sampling the model yields candidate actions, e.g. <b>ask friends who have been to Hawaii<\/b> or <b>read subreddits<\/b> about it.<\/li><li>The framework assigns a <b>score to each action<\/b> and updates the <b>search space / trajectory<\/b> — the tree of follow-up expansions — based on that score.<\/li><li>In the illustrated tree, action 1 scores higher, so the model expands it (ask friends A and B for opinions); the quality of those responses gets its own score, and expansion continues from there.<\/li><li>This is a flavor of <b>multi-action sampling<\/b>: some actions (e.g. the two 'ask a friend' branches, or two sub-queries) are <b>independent and can execute in parallel<\/b>.<\/li><li>Design principle: continue exploration from the <b>best state<\/b>, but mix <b>exploration and exploitation<\/b> — which is exactly where <b>MCTS<\/b> comes in.<\/li><\/ul>","terms":["multi-action sampling","action scoring","tree expansion","Hawaii trip","parallel actions","exploration vs exploitation","MCTS"]},"zh":{"title":"LATS 演练：为动作打分并扩展树","problem":"给定一个 prompt，模型可以提出许多动作，但并没有内建信号告诉它计划中的哪条分支值得深入。","why":"如果对每个采样到的动作打分，并且只沿高分动作扩展树，agent 就会把预算花在有潜力的轨迹上，同时仍然采样其他备选方案。","how":"以夏威夷旅行 prompt 为例：采样得到诸如“问去过夏威夷的朋友”或“阅读相关 subreddit”这样的动作。框架为每个动作打分，扩展得分更高的那个（例如问朋友 A 和朋友 B），对由此产生的回答打分，然后重复。部分动作可以并行执行。","detail":"<p>具体示例：prompt = <i>plan a trip to Hawaii<\/i>。<\/p><ul><li>对模型采样得到候选动作，例如<b>询问去过夏威夷的朋友<\/b>或阅读相关的 <b>subreddit<\/b>。<\/li><li>框架为<b>每个动作分配一个分数<\/b>，并基于该分数更新<b>搜索空间/轨迹<\/b>——即后续扩展构成的树。<\/li><li>在示意图的树中，动作 1 得分更高，因此模型扩展它（询问朋友 A 和朋友 B 的意见）；这些回答的质量也有各自的分数，并从此继续扩展。<\/li><li>这是<b>多动作采样<\/b>的一种形式：某些动作（例如两个“询问朋友”分支，或两个子查询）是<b>相互独立且可以并行执行的<\/b>。<\/li><li>设计原则：从<b>最佳状态<\/b>继续探索，但混合<b>探索与利用<\/b>——这正是 <b>MCTS<\/b> 发挥作用的地方。<\/li><\/ul>","terms":["多动作采样","动作打分","树扩展","夏威夷旅行","并行动作","探索 vs 利用","MCTS"]}},{"t":327,"figs":[{"t":329,"file":"slides/part05/slide_009.jpg"},{"t":344,"file":"slides/part05/slide_010.jpg"}],"en":{"title":"How LATS Diverges: Outcome Scoring, Reflection, and ReAct Lineage","problem":"Prior search-guided reasoning scores intermediate reasoning steps, but the quality of a step in an embodied/acting setting depends on what actually happens when the action is taken.","why":"Scoring outcomes and letting the model reflect on a trajectory (and observe the environment) gives a richer, more grounded signal than scoring reasoning choices in isolation.","how":"Math-Shepherd used a verifier scoring reasoning trajectories to guide test-time search. LATS instead scores based on the outcomes of actions taken, adds model reflection to evaluate how a trajectory went, ingests environment observations, and inherits ReAct's memory/reflection/environment interaction — with substantially more planning.","detail":"<p>The paper positions itself against two predecessors:<\/p><ul><li><b>Math-Shepherd<\/b> — a verifier scores the <b>reasoning trajectories<\/b> and guides test-time search; the expansion is driven by those reasoning-level scores.<\/li><li><b>ReAct<\/b> — adds memory/reflection and explicit <b>interaction with the environment<\/b> (the 'reason, act, observe' loop).<\/li><\/ul><p>LATS's differences:<\/p><ul><li>Scoring is <b>not based on reasoning choices<\/b> but on the <b>outcomes of the actions<\/b> the model takes — a more grounded signal.<\/li><li>It adds a <b>reflection<\/b> step in which the model evaluates how the trajectory went, plus explicit use of <b>environment observations<\/b>.<\/li><li>It has <b>more and more planning<\/b> folded into the process than ReAct.<\/li><\/ul><p>This lineage matters: LATS = MCTS planning + outcome/reflection guidance over a ReAct-style acting loop.<\/p>","terms":["Math-Shepherd","verifier","ReAct","outcome scoring","reflection","environment observations","test-time search"]},"zh":{"title":"LATS 的差异所在：结果打分、反思与 ReAct 谱系","problem":"此前的搜索引导推理会对中间推理步骤打分，但在具身/行动场景中，一步的好坏取决于该动作被真正执行时实际发生了什么。","why":"对结果打分并让模型对轨迹进行反思（以及观察环境），比孤立地为推理选择打分能提供更丰富、更贴近实际的信号。","how":"Math-Shepherd 使用 verifier 为推理轨迹打分来引导 test-time 搜索。LATS 则根据所执行动作的结果来打分，加入模型反思以评估轨迹的进展，吸收环境观察，并继承 ReAct 的记忆/反思/环境交互——同时规划的成分大幅增加。","detail":"<p>论文将自己与两个前身进行对比：<\/p><ul><li><b>Math-Shepherd<\/b>——verifier 为<b>推理轨迹<\/b>打分并引导 test-time 搜索；扩展由这些推理层面的分数驱动。<\/li><li><b>ReAct<\/b>——加入记忆/反思以及对<b>环境的显式交互<\/b>（即“推理、行动、观察”循环）。<\/li><\/ul><p>LATS 的不同之处：<\/p><ul><li>打分<b>不基于推理选择<\/b>，而是基于模型所执行动作的<b>结果<\/b>——一个更贴近实际的信号。<\/li><li>它加入了一个<b>反思<\/b>步骤，让模型评估轨迹的进展，并显式利用<b>环境观察<\/b>。<\/li><li>相比 ReAct，它在流程中融入了<b>越来越多的规划<\/b>。<\/li><\/ul><p>这一谱系很重要：LATS = MCTS 规划 + 在 ReAct 式行动循环之上的结果/反思引导。<\/p>","terms":["Math-Shepherd","verifier","ReAct","结果打分","反思","环境观察","test-time 搜索"]}},{"t":431,"figs":[{"t":469,"file":"slides/part05/slide_011.jpg"},{"t":485,"file":"slides/part05/slide_012.jpg"},{"t":521,"file":"slides/part05/slide_014.jpg"}],"en":{"title":"LATS Intuition and the Six-Stage Pipeline (Maze Setup)","problem":"The method needs a concrete procedural skeleton so the borrowed MCTS ideas become an executable loop over an LLM's reasoning and actions.","why":"Decomposing the process into named stages makes the mechanism auditable and shows exactly where the LLM, the judge, and the environment each contribute.","how":"Chain of thought decomposes reasoning into steps; action generation forms a tree; search/planning runs over that tree; ReAct-style feedback from actions is folded into future search. Concretely LATS has six stages: selection, expansion, evaluation, simulation, back-propagation, reflection.","detail":"<p>Intuition behind LATS:<\/p><ul><li><b>Chain of thought<\/b> decomposes the reasoning process into a number of steps.<\/li><li><b>Tree expansion<\/b> — action generation builds a tree of candidate states.<\/li><li><b>Search and planning<\/b> — MCTS runs over that tree.<\/li><li><b>Feedback<\/b> — following ReAct, observations from executed actions are incorporated into future search.<\/li><\/ul><p>The concrete method has <b>six stages<\/b>: <code>selection<\/code>, <code>expansion<\/code>, <code>evaluation<\/code>, <code>simulation<\/code>, <code>back-propagation<\/code>, <code>reflection<\/code>.<\/p><p>Running example used to walk through them: <i>navigate a maze to reach an exit<\/i>. Initial observation: you are in a dimly lit room with <b>two doors, one on the left and one on the right<\/b>; the goal is to reach the exit.<\/p>","terms":["chain of thought","tree expansion","MCTS","selection","expansion","evaluation","simulation","back-propagation","reflection","maze"]},"zh":{"title":"LATS 直觉与六阶段流水线（迷宫设定）","problem":"该方法需要一个具体的流程骨架，使借鉴来的 MCTS 思想成为在 LLM 推理与动作之上的可执行循环。","why":"将过程分解为具名阶段，使机制可被审查，并清楚展示 LLM、judge 与环境各自在何处做出贡献。","how":"Chain of thought 将推理分解为若干步骤；动作生成形成一棵树；搜索/规划在这棵树上运行；来自动作的 ReAct 式反馈被融入未来的搜索。具体而言，LATS 有六个阶段：selection、expansion、evaluation、simulation、back-propagation、reflection。","detail":"<p>LATS 背后的直觉：<\/p><ul><li><b>Chain of thought<\/b> 将推理过程分解为若干步骤。<\/li><li><b>树扩展<\/b>——动作生成构建一棵候选状态树。<\/li><li><b>搜索与规划<\/b>——MCTS 在这棵树上运行。<\/li><li><b>反馈<\/b>——遵循 ReAct，将已执行动作的观察纳入未来的搜索。<\/li><\/ul><p>具体方法包含<b>六个阶段<\/b>：<code>selection<\/code>、<code>expansion<\/code>、<code>evaluation<\/code>、<code>simulation<\/code>、<code>back-propagation<\/code>、<code>reflection<\/code>。<\/p><p>用于逐一讲解它们的贯穿示例：<i>在迷宫中导航以到达出口<\/i>。初始观察：你身处一个昏暗的房间，里面有<b>两扇门，一扇在左、一扇在右<\/b>；目标是到达出口。<\/p>","terms":["chain of thought","树扩展","MCTS","selection","expansion","evaluation","simulation","back-propagation","reflection","迷宫"]}},{"t":522,"figs":[{"t":521,"file":"slides/part05/slide_014.jpg"}],"en":{"title":"Maze Walkthrough Part 1: Selection, Expansion, and Observations","problem":"MCTS needs a starting node and a branching factor, but here the branches must be generated by the LLM and executed in a real environment.","why":"The environment response is what turns a sampled action into a new state with an observation that can be appended to context for the next round.","how":"First select a node to expand (via UCT, detailed later). From the initial node, sample actions — e.g. open the left door, open the right door, inspect the room for clues. Execute each in the environment and append the observation (e.g. 'dark corridor with paintings') to the context.","detail":"<p><b>Selection<\/b> — choose a node to expand, based on <b>UCT<\/b> (covered later). The initialized node is the initial observation: <i>you're in a dimly lit room&hellip;<\/i><\/p><p><b>Expansion<\/b> — from the selected node, the model samples candidate actions. In the example, three are sampled:<\/p><ul><li>open the <b>left door<\/b><\/li><li>open the <b>right door<\/b><\/li><li><b>inspect the room for clues<\/b><\/li><\/ul><p>Each action is then <b>executed in the environment<\/b>, and the resulting <b>observation is appended to the context<\/b>. For 'open the left door' the observation is a <i>dark corridor with paintings<\/i>; the right door and inspect actions return their own observations.<\/p><p>The point of this stage: the LLM supplies the branching, but the environment supplies the ground-truth consequence that becomes the new node's content.<\/p>","terms":["selection","expansion","UCT","action sampling","observations","context","environment execution"]},"zh":{"title":"迷宫演练（第 1 部分）：Selection、Expansion 与观察","problem":"MCTS 需要一个起始节点和分支因子，但在这里分支必须由 LLM 生成，并在真实环境中执行。","why":"环境响应正是将采样动作转化为一个新状态的关键，该状态带有一条可追加到 context 中以供下一轮使用的观察。","how":"首先选择一个要扩展的节点（通过 UCT，稍后详述）。从初始节点出发采样动作——例如打开左门、打开右门、检查房间以寻找线索。在环境中执行每个动作，并将观察（例如“挂着画作的黑暗走廊”）追加到 context。","detail":"<p><b>Selection<\/b>——基于 <b>UCT<\/b>（稍后介绍）选择一个要扩展的节点。初始化的节点就是初始观察：<i>你身处一个昏暗的房间&hellip;<\/i><\/p><p><b>Expansion<\/b>——从选中的节点出发，模型采样候选动作。在示例中采样了三个：<\/p><ul><li>打开<b>左门<\/b><\/li><li>打开<b>右门<\/b><\/li><li><b>检查房间以寻找线索<\/b><\/li><\/ul><p>随后每个动作都<b>在环境中执行<\/b>，并将得到的<b>观察追加到 context<\/b>。对于“打开左门”，观察是一条<i>挂着画作的黑暗走廊<\/i>；右门和检查动作各自返回自己的观察。<\/p><p>这一阶段的要点：LLM 提供分支，而环境提供真实后果，后者成为新节点的内容。<\/p>","terms":["selection","expansion","UCT","动作采样","观察","context","环境执行"]}},{"t":594,"figs":[{"t":650,"file":"slides/part05/slide_016.jpg"}],"en":{"title":"Maze Walkthrough Part 2: Evaluation via LM-Judge and Self-Consistency","problem":"The tree needs a scalar value per action to decide which branch to continue, but there is no ground-truth reward inside the episode.","why":"Two cheap, complementary estimates — how promising the state looks, and how often the action is produced under sampling — combine into a robust value without any trained reward model.","how":"For each executed action, add two scores: an <b>LM score<\/b> from prompting the LLM as a judge for a 0–1 promise estimate, and a <b>self-consistency score<\/b> based on how frequently that action is sampled (e.g. 50 samples; state A scored higher because action A appeared ~75% of the time). The two are summed/averaged into one value.","detail":"<p>The <b>evaluation<\/b> stage scores each new state reached by an executed action.<\/p><ul><li><b>LM score<\/b>: prompt the LLM as a <b>judge<\/b> with the action + observation and ask how promising the state is, requesting a score between <b>0 and 1<\/b>.<\/li><li><b>Self-consistency score<\/b>: instead of 3 actions, sample ~<b>50<\/b>, categorize them into action types, and assign a score proportional to the <b>frequency<\/b> with which an action type is sampled. Example: state A's self-consistency score is higher because action A is sampled ~<b>75%<\/b> of the time.<\/li><\/ul><p>These two are combined (added / averaged) into a single <b>value<\/b> for the action/state, e.g. <code>V(SA)<\/code>. No separate reward model is trained — the value function is prompt-based.<\/p>","terms":["LM as a judge","self-consistency","value function","0-1 score","sampling frequency","state evaluation"]},"zh":{"title":"迷宫演练（第 2 部分）：通过 LM-Judge 与 Self-Consistency 进行评估","problem":"树需要为每个动作给出一个标量值，以决定继续哪条分支，但 episode 内部没有 ground-truth 奖励。","why":"两个廉价且互补的估计——状态看起来多有前景，以及该动作在采样中被产生的频率——组合成一个稳健的值，且无需任何训练过的 reward model。","how":"对每个已执行的动作，加入两个分数：一个是<b>LM score<\/b>，通过将 LLM 提示为 judge 来得到 0–1 的前景估计；另一个是<b>self-consistency score<\/b>，基于该动作被采样的频率（例如采样 50 次；状态 A 得分更高，因为动作 A 出现了约 75% 的次数）。两者相加/平均为一个值。","detail":"<p><b>evaluation<\/b> 阶段为每个由已执行动作到达的新状态打分。<\/p><ul><li><b>LM score<\/b>：将 LLM 作为 <b>judge<\/b> 提示，输入动作 + 观察，询问该状态多有前景，要求给出 <b>0 到 1<\/b> 之间的分数。<\/li><li><b>Self-consistency score<\/b>：不是采样 3 个动作，而是采样约 <b>50<\/b> 个，将它们归类为动作类型，并给出与该动作类型被采样的<b>频率<\/b>成正比的分数。例如：状态 A 的 self-consistency score 更高，因为动作 A 约 <b>75%<\/b> 的次数被采样到。<\/li><\/ul><p>两者被合并（相加/平均）为该动作/状态的一个<b>值<\/b>，例如 <code>V(SA)<\/code>。不需要训练单独的 reward model——value function 是基于 prompt 的。<\/p>","terms":["LM as a judge","self-consistency","价值函数","0-1 分数","采样频率","状态评估"]}},{"t":690,"figs":[],"en":{"title":"Maze Walkthrough Part 3: Simulation, Budget, and Back-Propagation Setup","problem":"Evaluating one step is not enough; the agent must know whether a chosen branch actually reaches success before trusting it.","why":"Simulating (rolling out) from the best-looking state to a terminal outcome produces the actual return that can update all the values that led there.","how":"Greedily expand the highest-scoring state SA, sampling more actions and following them until a terminal state (success or failure) or a maximum expansion budget is hit. In the example the rollout takes the staircase and finds the exit door marked, scoring a point. That outcome is what back-propagation later distributes.","detail":"<p><b>Simulation<\/b>: from the evaluation stage, suppose <b>SA<\/b> has the highest score while <b>SB<\/b> and <b>SC<\/b> are much lower. A <b>greedy<\/b> method expands SA, sampling further actions and continuing expansions <b>until an end state<\/b> — success or failure — or until the <b>budget<\/b> for expanding that state is exhausted.<\/p><ul><li>In the example SA is rolled out toward a staircase; the next observation happily reveals the <b>exit door clearly marked<\/b>, so the trajectory scores a point.<\/li><li>The rollout therefore yields either a <b>successful trajectory<\/b> or a failure.<\/li><li>The critical question: how to use that terminal observation to <b>back-propagate<\/b> and update the scores of every action along the path.<\/li><li>This is the back-propagation stage, covered next, and it is what makes the tree's values reflect actual outcomes rather than only local promise.<\/li><\/ul>","terms":["simulation","rollout","terminal state","expansion budget","greedy expansion","back-propagation"]},"zh":{"title":"迷宫演练（第 3 部分）：Simulation、预算与 Back-Propagation 设定","problem":"只评估一步是不够的；agent 必须知道所选分支是否真能到达成功，然后才能信任它。","why":"从看起来最好的状态模拟（roll out）到终局结果，会产生真实的 return，用以更新通往该处的所有值。","how":"贪心地扩展得分最高的状态 SA，采样更多动作并沿着它们推进，直到到达终局状态（成功或失败）或触及最大扩展预算。在示例中，rollout 沿楼梯前进，发现出口门有标记，因此得一分。该结果正是后续 back-propagation 要传播的。","detail":"<p><b>Simulation<\/b>：在 evaluation 阶段之后，假设 <b>SA<\/b> 得分最高，而 <b>SB<\/b> 和 <b>SC<\/b> 低得多。一个<b>贪心<\/b>方法会扩展 SA，继续采样动作并持续扩展，<b>直到到达终局状态<\/b>——成功或失败——或直到用于扩展该状态的<b>预算<\/b>耗尽。<\/p><ul><li>在示例中，SA 沿楼梯方向 rollout；下一条观察恰好揭示<b>出口门有清晰标记<\/b>，因此该轨迹得一分。<\/li><li>于是 rollout 要么产生一条<b>成功轨迹<\/b>，要么失败。<\/li><li>关键问题：如何利用该终局观察来<b>反向传播<\/b>，更新路径上每个动作的分数。<\/li><li>这就是接下来要讲的 back-propagation 阶段，它使树的值反映真实结果，而不仅是局部前景。<\/li><\/ul>","terms":["simulation","rollout","终局状态","扩展预算","贪心扩展","back-propagation"]}},{"t":796,"figs":[{"t":825,"file":"slides/part05/slide_018.jpg"}],"en":{"title":"Value Function, UCT, and Back-Propagation Math","problem":"Picking the highest-value node every time is greedy and can miss branches that look weak now but lead to much better outcomes later.","why":"Balancing exploitation (current value) with exploration (under-visited branches) is the classic MCTS fix, and it must be coupled to a value update that uses the simulated return.","how":"The value function is the LLM-judge score plus the self-consistency score. Selection uses UCT — value V(s) plus a hyperparameter times an exploration term (parent visits n_p over node visits n_s) — so under-visited children get a boost. Back-propagation updates each state's value as (old_value*(visits-1) + return)/visits.","detail":"<p><b>Value function<\/b>: a weighted average of the <b>LLM-as-judge<\/b> score (0–1 probability of success given observation + action) and the <b>self-consistency<\/b> count of how often the action is sampled.<\/p><p><b>UCT (Upper Confidence Bounds Applied to Trees)<\/b>, borrowed directly from the MCTS literature, selects which node to expand:<\/p><ul><li>It combines an <b>exploitation<\/b> term <code>V(s)<\/code> with a hyperparameter times an <b>exploration<\/b> term.<\/li><li>Here <code>n_p<\/code> = number of visits to the <b>parent<\/b>, <code>n_s<\/code> = number of visits to the <b>current node<\/b>; the term behaves like <code>sqrt(n_p / n_s)<\/code>.<\/li><li>If a node is visited less relative to its parent, the ratio is large and UCT rises, encouraging exploration; a heavily visited node's term shrinks.<\/li><\/ul><p><b>Back-propagation<\/b>: at the end of a trajectory (success or failure) the return updates values along the path: <code>new_value = (old_value*(visits-1) + return) / visits<\/code>. A student notes this is akin to bandit algorithms; the lecturer agrees there is intuition but no optimality proof.<\/p>","terms":["UCT","upper confidence bounds","exploration term","n_p","n_s","back-propagation","return","visit count","bandit learning"]},"zh":{"title":"Value Function、UCT 与 Back-Propagation 的数学","problem":"每次都选价值最高的节点是贪心的，可能错过当前看起来弱但之后能带来更好结果的分支。","why":"在利用（当前价值）与探索（访问不足的分支）之间取得平衡，是 MCTS 的经典解法，并且必须与使用模拟 return 的价值更新相耦合。","how":"value function 是 LLM-judge 分数加上 self-consistency 分数。Selection 使用 UCT——价值 V(s) 加上一个超参数乘以探索项（父节点访问次数 n_p 除以节点访问次数 n_s）——因此访问不足的子节点会得到加成。Back-propagation 按 (old_value*(visits-1) + return)/visits 更新每个状态的价值。","detail":"<p><b>Value function<\/b>：<b>LLM-as-judge<\/b> 分数（给定观察 + 动作时成功的 0–1 概率）与 <b>self-consistency<\/b> 计数（该动作被采样的频率）的加权平均。<\/p><p><b>UCT（Upper Confidence Bounds Applied to Trees）<\/b>直接借鉴自 MCTS 文献，用于选择扩展哪个节点：<\/p><ul><li>它将一个<b>利用<\/b>项 <code>V(s)<\/code> 与一个超参数乘以<b>探索<\/b>项组合起来。<\/li><li>这里 <code>n_p<\/code> = <b>父节点<\/b>的访问次数，<code>n_s<\/code> = <b>当前节点<\/b>的访问次数；该项的行为类似 <code>sqrt(n_p / n_s)<\/code>。<\/li><li>如果某节点相对其父节点被访问得更少，比值就大，UCT 随之升高，鼓励探索；被大量访问的节点该项会缩小。<\/li><\/ul><p><b>Back-propagation<\/b>：在轨迹结束时（成功或失败），return 会更新路径上的价值：<code>new_value = (old_value*(visits-1) + return) / visits<\/code>。有学生指出这类似于 bandit 算法；讲师认同其中确有直觉，但没有最优性证明。<\/p>","terms":["UCT","upper confidence bounds","探索项","n_p","n_s","back-propagation","return","访问次数","bandit learning"]}},{"t":1003,"figs":[{"t":1027,"file":"slides/part05/slide_022.jpg"},{"t":1086,"file":"slides/part05/slide_023.jpg"},{"t":1109,"file":"slides/part05/slide_026.jpg"},{"t":1126,"file":"slides/part05/slide_025.jpg"}],"en":{"title":"Reflection and LATS Results on HotpotQA and WebShop","problem":"Trees are discarded after search, so the lessons learned from failed (or successful) trajectories are lost to future episodes.","why":"Appending the model's own verbal reflection to the context increases the quality of later search, effectively internalizing the experience without weight updates.","how":"After back-propagation, the model appends a reflection on the trajectory — why it failed or succeeded. LATS is then evaluated on HotpotQA (multi-hop QA that by construction needs retrieval from at least two Wikipedia pages) and WebShop (practical shopping queries); scaling samples/trajectories substantially improves performance, and reflections add further boosts, reaching near human-expert results with no fine-tuning.","detail":"<p><b>Reflection<\/b>: after back-propagation, the model appends its own <b>thinking<\/b> about the trajectory — what led to failure or success. This has been reported to significantly raise overall quality.<\/p><p><b>Results<\/b>:<\/p><ul><li><b>HotpotQA<\/b> — multi-step QA where answering a question requires retrieval from at least <b>two different Wikipedia pages<\/b> by design, so the task is inherently multi-hop.<\/li><li>As they increase the <b>number of samples / trajectories<\/b>, performance improves significantly; reflection + bringing reasoning traces back gives large end-stage boosts.<\/li><li><b>WebShop<\/b> — a practical shopping dataset (e.g. 'a small portable standing desk, already fully assembled, in this color/finish, at this price'), also a multi-step process.<\/li><li>With <b>no fine-tuning<\/b>, purely at test time, LATS gets high results — <b>close to human experts<\/b>.<\/li><li>Net: LATS provides a mechanism to convert more <b>test-time compute<\/b> into better solutions for multi-step reasoning.<\/li><\/ul>","terms":["reflection","HotpotQA","WebShop","test-time compute","multi-hop retrieval","human expert baseline","no fine-tuning"]},"zh":{"title":"Reflection 以及 LATS 在 HotpotQA 与 WebShop 上的结果","problem":"搜索结束后树就被丢弃，因此从失败（或成功）轨迹中学到的经验无法用于未来的 episode。","why":"将模型自己的语言化 reflection 追加到 context，能提升后续搜索的质量，实际上在无需更新权重的情况下内化了经验。","how":"back-propagation 之后，模型追加一段对轨迹的 reflection——说明为何失败或成功。随后在 HotpotQA（多跳 QA，按设计至少需要从两个 Wikipedia 页面检索）和 WebShop（实际购物查询）上评估 LATS；扩大 samples/trajectories 数量能显著提升性能，reflections 又带来进一步增益，在无需 fine-tuning 的情况下接近人类专家水平。","detail":"<p><b>Reflection<\/b>：在 back-propagation 之后，模型追加自己关于该轨迹的<b>思考<\/b>——是什么导致了失败或成功。据报道这能显著提升整体质量。<\/p><p><b>结果<\/b>：<\/p><ul><li><b>HotpotQA<\/b>——多步 QA，按设计回答问题至少需要从<b>两个不同的 Wikipedia 页面<\/b>检索，因此任务本质上是多跳的。<\/li><li>随着<b>samples/trajectories 数量<\/b>的增加，性能显著提升；reflection 加上把推理轨迹带回能带来很大的末端增益。<\/li><li><b>WebShop<\/b>——一个实际购物数据集（例如“一张小巧便携的站立式书桌，已完全组装好，是这个颜色/饰面，在这个价位”），同样是多步流程。<\/li><li>在<b>没有任何 fine-tuning<\/b>、纯 test-time 的情况下，LATS 就取得了很高的结果——<b>接近人类专家<\/b>。<\/li><li>净效果：LATS 提供了一种机制，将更多 <b>test-time compute<\/b> 转化为多步推理的更好解。<\/li><\/ul>","terms":["reflection","HotpotQA","WebShop","test-time compute","多跳检索","人类专家基线","no fine-tuning"]}},{"t":1149,"figs":[{"t":1186,"file":"slides/part05/slide_027.jpg"},{"t":1237,"file":"slides/part05/slide_028.jpg"}],"en":{"title":"LATS Summary, Limitations, and the Discussion Prompt","problem":"Despite strong results, LATS's practicality is bounded by compute cost and by real-world actions that cannot be undone.","why":"A framework that expands and back-propagates a tree per query is expensive, and its search assumes actions are cheap and reversible — false for transactions.","how":"Summary: LATS fuses reasoning, acting, and planning, imports MCTS into the LLM world, is portable/modular as a test-time method, but the cost-benefit is not analyzed and irreversible actions (e.g. paying for a service) aren't addressed. The class is asked to discuss strengths, weaknesses, and extensions.","detail":"<p><b>Summary.<\/b> LATS proposes a new technique that brings <b>reasoning, action, and planning together<\/b> and imports known ideas such as <b>MCTS<\/b> into the language-model world, yielding strong results across domains.<\/p><ul><li><b>Upside:<\/b> a test-time, modular approach that is <b>portable<\/b> and relatively easy to build, and it successfully converts more test-time compute into accuracy.<\/li><li><b>Downside 1 — cost:<\/b> each back-propagation and tree expansion adds a lot of cost; the paper does <b>not analyze cost-benefit<\/b>.<\/li><li><b>Downside 2 — irreversible actions:<\/b> the search assumes actions can be sampled and rolled back, but some actions (running a transaction, paying for a service) are <b>consequential<\/b> and cannot be undone.<\/li><\/ul><p>The lecturer then asks the class to think about strengths/weaknesses of the paper and how they would adapt or extend it.<\/p>","terms":["cost-benefit","irreversible actions","consequential actions","transactions","portability","test-time method"]},"zh":{"title":"LATS 总结、局限与讨论题","problem":"尽管结果很强，LATS 的实用性受到算力成本以及无法撤销的真实世界动作的限制。","why":"一个每次查询都扩展并 back-propagate 一棵树的框架开销很大，其搜索还假设动作廉价且可逆——这对交易类操作并不成立。","how":"总结：LATS 融合了推理、行动与规划，将 MCTS 引入 LLM 世界，作为 test-time 方法可移植/模块化，但未分析成本收益，也未处理不可逆动作（例如为服务付费）。课堂上要求讨论其优点、缺点与扩展方向。","detail":"<p><b>总结。<\/b>LATS 提出了一种新技术，将<b>推理、行动与规划结合在一起<\/b>，并把 <b>MCTS<\/b> 等已知思想引入语言模型世界，在多个领域取得了强劲结果。<\/p><ul><li><b>优势：<\/b>一种 test-time、模块化的方法，<b>可移植<\/b>且相对易于构建，并成功地将更多 test-time compute 转化为准确率。<\/li><li><b>缺点 1——成本：<\/b>每次 back-propagation 和树扩展都会增加大量成本；论文<b>未分析成本收益<\/b>。<\/li><li><b>缺点 2——不可逆动作：<\/b>该搜索假设动作可以被采样并回滚，但某些动作（执行交易、为服务付费）具有<b>重大后果<\/b>且无法撤销。<\/li><\/ul><p>随后讲师要求全班思考这篇论文的优点/缺点，以及他们会如何改造或扩展它。<\/p>","terms":["成本收益","不可逆动作","有后果的动作","交易","可移植性","test-time 方法"]}},{"t":1260,"figs":[{"t":1409,"file":"slides/part05/slide_036.jpg"}],"en":{"title":"Class Discussion: Bandit Alternatives and the Tree-vs-Graph Assumption","problem":"Students probe whether UCT is the only exploration mechanism and how repeated actions are handled inside the search structure.","why":"The answers clarify what is a genuine contribution versus a design choice others can swap, and expose an implicit structural assumption of the method.","how":"UCT is essentially a confidence-bound rule from bandit learning; the paper does not compare other multi-armed-bandit exploration schemes, and its main contribution is a platform on which such optimizers can be plugged in. For repeated actions, their count is incremented and folded into UCT; LATS assumes a tree, not a fully connected graph, so identical actions in different nodes are treated as independent trajectories.","detail":"<p>Two threads from the Q&amp;A:<\/p><ul><li><b>Is UCT the only option?<\/b> A student notes UCT is a <b>confidence-bound<\/b> rule from <b>bandit learning<\/b>, where many algorithms pick/explore arms. The lecturer confirms the paper did <b>not<\/b> compare alternatives; their main contribution is instead a <b>platform<\/b> that others can extend with other exploration-exploitation optimizers.<\/li><li><b>Repeated actions.<\/b> If the same action appears in multiple nodes / as A-B-A-B, LATS <b>increments the count<\/b> for that action given a parent, which feeds the <b>UCT<\/b> formula. The speaker stresses the method assumes a <b>tree, not a fully connected graph<\/b>, so repeated actions are treated as <b>independent trajectories<\/b>.<\/li><\/ul><p>These answers frame the method more as a flexible framework than a fully tuned search algorithm.<\/p>","terms":["UCT","bandit learning","multi-armed bandit","exploration-exploitation","repeated actions","tree vs graph","platform"]},"zh":{"title":"课堂讨论：Bandit 备选方案与树 vs 图的假设","problem":"学生探究 UCT 是否是唯一的探索机制，以及搜索结构内部如何处理重复动作。","why":"这些回答澄清了哪些是真正的贡献、哪些是他人可以替换的设计选择，并揭示了该方法一个隐含的结构性假设。","how":"UCT 本质上是来自 bandit learning 的置信界规则；论文未与其他 multi-armed-bandit 探索方案做比较，其主要贡献是一个可将此类优化器接入的平台。对于重复动作，其计数会被递增并纳入 UCT；LATS 假设的是树而非完全连接的图，因此不同节点中相同的动作被视为相互独立的轨迹。","detail":"<p>问答环节的两条线索：<\/p><ul><li><b>UCT 是唯一的选择吗？<\/b>有学生指出 UCT 是来自 <b>bandit learning<\/b> 的<b>置信界<\/b>规则，而在该领域有许多算法用于选择/探索 arm。讲师确认论文<b>没有<\/b>比较其他方案；其主要贡献反而是提供了一个<b>平台<\/b>，其他人可以在其上接入其他的探索-利用优化器。<\/li><li><b>重复动作。<\/b>如果同一动作出现在多个节点中/以 A-B-A-B 的形式出现，LATS 会针对给定父节点<b>递增该动作的计数<\/b>，进而进入 <b>UCT<\/b> 公式。讲者强调该方法假设的是<b>树而非完全连接的图<\/b>，因此重复动作被视为<b>相互独立的轨迹<\/b>。<\/li><\/ul><p>这些回答把该方法更多地定位为一个灵活框架，而非一个完全调优的搜索算法。<\/p>","terms":["UCT","bandit learning","multi-armed bandit","探索-利用","重复动作","树 vs 图","平台"]}},{"t":1415,"figs":[{"t":1460,"file":"slides/part05/slide_038.jpg"}],"en":{"title":"SPRINT Motivation: Longer Thinking Correlates with Higher Accuracy","problem":"Sequential long chains of thought raise accuracy on hard problems but make inference painfully slow and expensive.","why":"Reasoning models (o1, Gemini 2.5 Pro thinking, DeepSeek R1) are trained to 'think more' on harder problems, and longer responses correlate with higher accuracy — but all that text is generated one token at a time.","how":"The lecture shows DeepSeek R1 training curves: as math performance improves, the average response length also rises. SPRINT is a new 2025 paper (not yet presented at a conference) motivated by this: exploit the fact that many reasoning steps are independent so they can run in parallel.","detail":"<p>Motivation for <b>SPRINT<\/b>, described as a new <b>2025<\/b> paper not yet presented at a conference.<\/p><ul><li>Frontier reasoning models — <b>o1<\/b>, <b>Gemini 2.5 Pro thinking<\/b>, <b>DeepSeek R1<\/b> — show a tendency to <b>think more for harder problems<\/b>, and longer thinking corresponds to <b>higher accuracy<\/b>.<\/li><li>The DeepSeek R1 curves show that as training continues the model gets better on math <b>and<\/b> the <b>average length per response goes up<\/b> — a positive correlation between thinking tokens and accuracy.<\/li><li>The pain: these long chains are generated **sequentially**, so latency and cost become a huge burden, especially for multi-step reasoning; the user waits a long time for a response.<\/li><li>SPRINT explores planning and <b>parallel execution<\/b> of plans, using the model itself to help it think better in parallel and then optimizing that.<\/li><\/ul>","terms":["SPRINT","DeepSeek R1","o1","Gemini 2.5 Pro","chain of thought","sequential tokens","latency","test-time compute"]},"zh":{"title":"SPRINT 动机：更长的思考与更高的准确率相关","problem":"顺序的长 chain of thought 提升了难题上的准确率，却让推理变得极其缓慢和昂贵。","why":"reasoning model（o1、Gemini 2.5 Pro thinking、DeepSeek R1）被训练为在更难的问题上“思考更多”，更长的回答与更高的准确率相关——但所有这些文本都是一次一个 token 生成的。","how":"讲座展示了 DeepSeek R1 的训练曲线：随着数学性能提升，平均回答长度也随之上升。SPRINT 是一篇 2025 年的新论文（尚未在会议上发表），其动机正是利用许多推理步骤相互独立、因而可以并行执行这一事实。","detail":"<p><b>SPRINT<\/b> 的动机，它被描述为一篇尚未在会议上发表的 <b>2025<\/b> 年新论文。<\/p><ul><li>前沿 reasoning model——<b>o1<\/b>、<b>Gemini 2.5 Pro thinking<\/b>、<b>DeepSeek R1<\/b>——表现出在<b>更难的问题上思考更多<\/b>的倾向，而更长的思考对应<b>更高的准确率<\/b>。<\/li><li>DeepSeek R1 的曲线显示，随着训练进行，模型在数学上变得更好，<b>且<\/b>每次回答的<b>平均长度上升<\/b>——思考 token 与准确率之间呈正相关。<\/li><li>痛点：这些长链是 **按顺序** 生成的，因此延迟和成本成为巨大负担，尤其是在多步推理中；用户要等待很长时间才能得到回答。<\/li><li>SPRINT 探索对计划进行规划与<b>并行执行<\/b>，利用模型本身帮助它以并行方式更好地思考，然后对此进行优化。<\/li><\/ul>","terms":["SPRINT","DeepSeek R1","o1","Gemini 2.5 Pro","chain of thought","顺序 token","延迟","test-time compute"]}},{"t":1509,"figs":[{"t":1552,"file":"slides/part05/slide_039.jpg"},{"t":1602,"file":"slides/part05/slide_040.jpg"}],"en":{"title":"SPRINT Architecture: Independent Steps, Planner + Parallel Executors","problem":"Long reasoning traces contain many substeps that do not depend on each other, yet autoregressive decoding forces them into a single sequential stream.","why":"If independent steps can be identified and emitted together, their executions can run concurrently, shortening the critical path without losing the reasoning content.","how":"Observation: models try alternative approaches, decompose tasks into parallelizable subtasks, and verify previous steps. SPRINT fine-tunes a reasoning model to plan and then execute: a planner emits a set of plans, executors run them in parallel, and planning/execution interleave repeatedly to accelerate reasoning.","detail":"<p>Key observation behind SPRINT: while long reasoning helps, <b>many reasoning steps are independent of each other<\/b> — e.g. trying alternative approaches, decomposing a task into subtasks that can run in parallel, or verifying earlier steps.<\/p><ul><li>Looking at the graph of a reasoning trace, parts of the computation are <b>mutually independent<\/b>; there is no need to wait for all steps to be generated sequentially.<\/li><li>SPRINT is a <b>post-training / fine-tuning<\/b> framework: it takes a reasoning model and enables it to generate its response through a <b>planner<\/b> plus a set of <b>executors<\/b>.<\/li><li>The planner creates a set of plans for the problem; the executors carry the plans out <b>in parallel<\/b>; this can happen <b>again and again<\/b>, with plan-set → parallel-execution → plan-set → parallel-execution.<\/li><li>The <b>interleaving of planning and execution<\/b> is what accelerates the reasoning process while keeping the model's output channel a single next-token stream.<\/li><\/ul>","terms":["planner","executor","parallel execution","task decomposition","interleaving","post-training","supervised fine-tuning"]},"zh":{"title":"SPRINT 架构：独立步骤、Planner + 并行 Executor","problem":"长推理轨迹包含许多彼此不依赖的子步骤，但自回归解码迫使它们进入单一的顺序流。","why":"如果能识别出独立步骤并将它们一起输出，其执行就可以并发运行，在不丢失推理内容的情况下缩短关键路径。","how":"观察：模型会尝试不同方法、将任务分解为可并行的子任务，并验证之前的步骤。SPRINT 对 reasoning model 进行 fine-tune，使其先规划再执行：planner 输出一组计划，executor 并行运行它们，规划/执行反复交错以加速推理。","detail":"<p>SPRINT 背后的关键观察：虽然长推理有帮助，但<b>许多推理步骤彼此独立<\/b>——例如尝试不同方法、将任务分解为可并行运行的子任务，或验证之前的步骤。<\/p><ul><li>观察一条推理轨迹的图，其中
