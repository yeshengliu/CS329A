<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS329A · Self-Improving AI Agents · 配图讲解 / Illustrated Notes</title>
<style>
:root{
  --bg:#f7f8fb; --panel:#ffffff; --panel2:#f0f2f8; --line:#e2e6f0;
  --fg:#1b2030; --fg2:#4c5468; --fg3:#8b93a7;
  --acc:#2f5fd0; --acc2:#0e8a72; --warn:#b06000;
  --code:#eef1f8; --hit:#fff2b0; --hitfg:#6b4d00;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0f1117; --panel:#161a25; --panel2:#1c2030; --line:#2a3042;
  --fg:#e6e9f2; --fg2:#a9b1c6; --fg3:#6f7793;
  --acc:#7aa2ff; --acc2:#5ee1c4; --warn:#ffb86b;
  --code:#1d2233; --hit:#4a3f16; --hitfg:#ffe08a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15.5px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code{font:13.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:5px}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:60}

header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:9px 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--fg3)}
select#partsel{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:320px}
.searchwrap{position:relative;flex:1;max-width:440px;margin-left:auto}
.searchwrap input{width:100%;padding:8px 34px 8px 34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);outline:none}
.searchwrap input:focus{border-color:var(--acc)}
.searchwrap .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.searchwrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--fg3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.tbtn{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg2);font-size:13px;white-space:nowrap}
.tbtn:hover{color:var(--fg);border-color:var(--acc)}
.tbtn.on{color:var(--acc);border-color:var(--acc)}
#btnLang{font-weight:700;min-width:52px}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1400px;margin:0 auto}
aside{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto;padding:16px 14px 60px;border-right:1px solid var(--line)}
aside h4{margin:6px 6px 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--fg3)}
.lec{display:flex;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:9px;color:var(--fg2);margin-bottom:2px}
.lec:hover{background:var(--panel2);color:var(--fg)}
.lec.active{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--fg)}
.lec b{font:12px var(--mono);color:var(--fg3);padding-top:2px}
.sec-link{display:block;width:100%;text-align:left;padding:5px 9px;border-radius:7px;color:var(--fg3);
  font-size:12.8px;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-link:hover{color:var(--fg);background:var(--panel2)}
.sec-link.active{color:var(--acc);border-left-color:var(--acc)}
.tocwrap{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}

main{padding:26px 34px 140px;max-width:1020px}
.lechead h1{margin:0 0 8px;font-size:30px;line-height:1.2;letter-spacing:-.4px}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--fg3);font-size:13px;align-items:center;margin-bottom:16px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel)}
.summary{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:10px;padding:14px 16px;margin-bottom:26px;color:var(--fg2)}
section.sec{padding:22px 0 10px;border-top:1px solid var(--line);scroll-margin-top:70px}
section.sec:first-of-type{border-top:0}
.sec h2{margin:0 0 12px;font-size:22px;line-height:1.3;letter-spacing:-.2px}
.sec h2 .t{font:12px var(--mono);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);
  border-radius:6px;padding:3px 8px;margin-right:10px;vertical-align:2px}
.prose{color:var(--fg2);max-width:74ch}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:22px}
.prose li{margin:3px 0}
.prose b{color:var(--fg)}
.chain{margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.node{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--fg3);border-radius:9px;padding:10px 13px;color:var(--fg2)}
.node .tag{font-size:12px;font-weight:700;letter-spacing:.5px;padding-top:1px}
.node.p{border-left-color:#e05d5d}.node.p .tag{color:#e05d5d}
.node.w{border-left-color:var(--warn)}.node.w .tag{color:var(--warn)}
.node.h{border-left-color:var(--acc2)}.node.h .tag{color:var(--acc2)}
.node b{color:var(--fg)}
.node code{font-size:13px}
.terms{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.term{font-size:12px;color:var(--fg3);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px}
.term:hover{color:var(--acc2);border-color:var(--acc2)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin:6px 0 8px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;background:#0b0d12;cursor:zoom-in}
figcaption{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:12px;color:var(--fg3);border-top:1px solid var(--line)}
figcaption a{font:12px var(--mono)}
body.ponly .prose,body.ponly .terms,body.ponly .chain{display:none}
body.ponly .figs{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:.15s}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(700px,95vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:80;transform:translateX(102%);transition:.2s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header h3{margin:0;font-size:16px}
.panel .body{overflow:auto;padding:14px 16px}
.close{font-size:20px;color:var(--fg3);margin-left:auto}
.result{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;margin-bottom:6px}
.result:hover{background:var(--panel2)}
.result .rq{font:11.5px var(--mono);color:var(--fg3);margin-bottom:3px}
.result .rt{color:var(--fg2);font-size:13.5px}
mark{background:var(--hit);color:var(--hitfg);border-radius:3px;padding:0 2px}
.nores{color:var(--fg3);padding:16px 4px}

#lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#lightbox .x{position:absolute;top:16px;right:22px;color:#fff;font-size:30px;opacity:.8}
#lightbox .cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#cfd6e6;font:12.5px var(--mono)}

@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px}.brand small{display:none}}
@media print{header.top,aside,.overlay,.panel,#lightbox,#progress{display:none!important}
  .layout{display:block}main{max-width:none;padding:0}.figs{grid-template-columns:1fr 1fr}
  body.ponly .prose,body.ponly .chain{display:block} section.sec{break-inside:avoid}}
</style>
</head>

<script>
const DATA = {"course":"Stanford CS329A — Self-Improving AI Agents","source":"https://www.youtube.com/playlist?list=PLangBM27OtEA","parts":[{"n":1,"id":"6YnLB0XbTnI","duration":4178,"slideCount":40,"en":{"title":"Course Overview","summary":"CS329A frames self-improving AI agents as the successor to static LLM pipelines. The lecture traces scaling laws (compute/data/parameters) into emergent chain-of-thought, then walks the post-training stack (SFT, instruction tuning, RLHF/RLAIF) that produced ChatGPT. It then shows inference/test-time scaling (repeated sampling + verifiers, o1-style reasoning) being folded back into training to create a self-improvement loop, surveys agentic workflows and application areas, and closes with course logistics."},"zh":{"title":"课程概览","summary":"CS329A 将自我改进的 AI agents 定位为静态 LLM pipeline 的继任者。讲座先追溯 scaling laws（compute/data/parameters）如何引出 emergent chain-of-thought，再梳理催生 ChatGPT 的 post-training 技术栈（SFT、instruction tuning、RLHF/RLAIF）。随后展示 inference/test-time scaling（重复采样 + verifiers、o1 式 reasoning）如何被折回训练形成自我改进循环，综述 agentic workflows 与应用领域，最后介绍课程安排。"},"sections":[{"t":5,"figs":[{"t":76,"file":"slides/part01/slide_003.jpg"},{"t":120,"file":"slides/part01/slide_089.jpg"}],"en":{"title":"Welcome and course framing","problem":"The course must orient a mixed audience to CS329A, define its theme (self-improving AI agents), and establish the instructors' credibility.","why":"The instructors come from frontier LLM work, so the material is anchored in current practice rather than textbook abstractions.","how":"Self-introductions, an audience poll, and a statement that the second offering has updated lectures and course mechanics, with the website as the hub.","detail":"<p>CS329A is framed as a course on <b>self-improving AI agents<\/b>. Instructor <b>Akanksha<\/b> is an adjunct professor who works on large language models and does research at the startup <b>Reflection AI<\/b>; <b>Azalia Mirhoseini<\/b> is an assistant professor in the CS department. They met at <b>Google Brain / Google DeepMind<\/b>, and Azalia has also worked on Codex, Anthropic, and Gemini. This is the <b>second<\/b> time they teach the course, with updates to lectures and logistics.<\/p><ul><li>Audience poll: mostly <b>masters students<\/b>, with fewer PhD and undergrad students—what they call a \"really good balance.\"<\/li><li>The instructors were struck by the level of interest in the course.<\/li><li>Course website <code>cs329a.stanford.edu<\/code> holds lecture materials, the reading list, homework schedule, and project proposal structure.<\/li><li>Today's agenda: an LLM/scaling overview first, then course logistics, which directly influence grades.<\/li><\/ul>","terms":["CS329A","self-improving agents","Reflection AI","Google Brain"]},"zh":{"title":"欢迎与课程定位","problem":"课程需要向背景各异的听众介绍 CS329A，界定其主题（自我改进的 AI agents），并建立讲师的公信力。","why":"两位讲师来自前沿 LLM 工作，因此内容锚定在当下实践，而非教科书式的抽象。","how":"通过自我介绍、听众投票，以及说明这是第二次开课、讲座与课程机制均已更新，网站是信息中枢。","detail":"<p>CS329A 被定位为一门关于 <b>自改进 AI agents<\/b> 的课程。讲师 <b>Akanksha<\/b> 是兼职教授，从事 large language models 相关工作，并在创业公司 <b>Reflection AI<\/b> 做研究；<b>Azalia Mirhoseini<\/b> 是 CS 系的助理教授。两人在 <b>Google Brain / Google DeepMind<\/b> 相识，Azalia 还参与过 Codex、Anthropic 和 Gemini。这是他们<b>第二次<\/b>讲授该课程，讲座与课程安排都有更新。<\/p><ul><li>听众投票：以 <b>硕士生<\/b>为主，PhD 和本科生较少——他们称这是“非常好的平衡”。<\/li><li>讲师对这门课受关注的程度感到惊讶。<\/li><li>课程网站 <code>cs329a.stanford.edu<\/code> 提供讲座材料、阅读清单、作业安排和项目提案结构。<\/li><li>今天的议程：先做 LLM/scaling 概览，再讲直接影响成绩的课程安排。<\/li><\/ul>","terms":["CS329A","self-improving agents","Reflection AI","Google Brain"]}},{"t":143,"figs":[{"t":156,"file":"slides/part01/slide_007.jpg"},{"t":265,"file":"slides/part01/slide_011.jpg"}],"en":{"title":"Scaling laws and model-size growth","problem":"Early BERT/T5-class models were decent but limited; it was not obvious how far raw scale could push capability.","why":"Empirically, test loss falls smoothly as compute, dataset size, and parameter count increase—a predictable power-law (scaling) relationship—so more scale meant strictly better base models.","how":"Scale all three axes: more compute, more data, and more transformer layers/parameters to drive test loss down and improve the pretrained base model.","detail":"<p>The lecture's first trend is <b>scaling laws<\/b>: with compute on the x-axis, loss on the y-axis falls; more data lowers test loss further; and more parameters (deeper transformers) lowers loss again. These three axes became the foundation for GPT-3 and successors.<\/p><ul><li>Model sizes grew roughly exponentially <b>2018–2024<\/b>: BERT <b>340M<\/b>, GPT-2 <b>1.5B<\/b>, GPT-3 <b>175B<\/b>, PaLM <b>540B<\/b>, and GPT-4 estimated in the <b>trillions<\/b> of parameters.<\/li><li>\"Large\" in LLM literally refers to this growth in size.<\/li><li>According to the lecture, the trend began to hit a <b>saturation point<\/b> around last year, motivating the rest of the course.<\/li><li>This scaling produced GPT-3, ChatGPT, PaLM, and Gemini.<\/li><\/ul>","terms":["scaling laws","test loss","parameters","GPT-3","PaLM"]},"zh":{"title":"Scaling laws 与模型规模增长","problem":"早期 BERT/T5 级别的模型表现尚可但有局限；尚不清楚单纯扩大规模能把能力推到多远。","why":"经验上，随着 compute、dataset size 和 parameter count 增加，test loss 平滑下降——一种可预测的幂律（scaling）关系——因此规模越大，base model 严格更好。","how":"同时在三个维度上扩展：更多 compute、更多 data、更多 transformer layers/parameters，以压低 test loss 并改进预训练 base model。","detail":"<p>讲座的第一个趋势是 <b>scaling laws<\/b>：以 compute 为横轴、loss 为纵轴，loss 下降；更多数据进一步降低 test loss；更多参数（更深的 transformers）又进一步降低 loss。这三个维度成为 GPT-3 及其后继者的基础。<\/p><ul><li>模型规模在 <b>2018–2024<\/b> 大致指数增长：BERT <b>340M<\/b>、GPT-2 <b>1.5B<\/b>、GPT-3 <b>175B<\/b>、PaLM <b>540B<\/b>，GPT-4 估计达到<b>数万亿<\/b>参数。<\/li><li>LLM 中的“Large”字面上就指这种规模的膨胀。<\/li><li>据讲座所述，该趋势在去年左右开始触及<b>饱和点<\/b>，这也促成了课程后续内容。<\/li><li>这种 scaling 催生了 GPT-3、ChatGPT、PaLM 和 Gemini。<\/li><\/ul>","terms":["scaling laws","test loss","parameters","GPT-3","PaLM"]}},{"t":293,"figs":[{"t":302,"file":"slides/part01/slide_012.jpg"},{"t":340,"file":"slides/part01/slide_016.jpg"}],"en":{"title":"Why scaling matters: benchmarks and few-shot learning","problem":"Raw loss numbers are abstract; the practical question is what capability scaling actually buys.","why":"Bigger models improve continuously on natural-language and reasoning benchmarks and acquire in-context learning: they follow a task template from a few examples instead of needing task-specific fine-tuning.","how":"Use prompting—describe the task (zero-shot) or provide a handful of demonstrations (few-shot)—so a fixed model generalizes to new tasks without retraining.","detail":"<p>Three payoffs of scale are highlighted:<\/p><ul><li><b>Benchmark gains<\/b> on natural-language, reasoning, and other tasks.<\/li><li><b>Few-shot / zero-shot learning.<\/b> Zero-shot = give a task (e.g. \"translate English to French\") with no examples; few-shot = include a few English→French pairs, then ask for \"cheese\". Earlier you had to fine-tune per domain; now a few examples let the model follow the template, making prototyping easy.<\/li><li><b>Emergent behavior:<\/b> capabilities such as reasoning appear only in larger models, not predictably at smaller sizes.<\/li><\/ul><p>These in-context abilities, demonstrated by GPT-3 and PaLM across many tasks, made prompting—rather than fine-tuning—the default interface and seeded later work on reasoning.<\/p>","terms":["few-shot learning","zero-shot","in-context learning","emergent behavior"]},"zh":{"title":"为何 scaling 重要：benchmarks 与 few-shot learning","problem":"原始 loss 数值很抽象；实际问题是 scaling 究竟带来了什么能力。","why":"更大的模型在自然语言与 reasoning benchmarks 上持续改进，并获得了 in-context learning：只需几个示例就能遵循任务模板，而无需针对特定任务做微调。","how":"使用 prompting——描述任务（zero-shot）或提供少量示范（few-shot）——让固定模型无需重训练即可泛化到新任务。","detail":"<p>强调了规模的三个回报：<\/p><ul><li>在自然语言、reasoning 等任务上的 <b>benchmark 提升<\/b>。<\/li><li><b>Few-shot / zero-shot learning。<\/b>Zero-shot = 给出任务（例如“translate English to French”）而不给示例；few-shot = 附上若干 English→French 配对，再要求翻译 “cheese”。过去必须按领域微调；现在几个示例就能让模型遵循模板，使原型开发变得容易。<\/li><li><b>Emergent behavior：<\/b>诸如 reasoning 的能力只在更大模型中出现，在小规模上无法预测。<\/li><\/ul><p>这些 in-context 能力由 GPT-3 和 PaLM 在众多任务上展示，使 prompting——而非 fine-tuning——成为默认接口，并为后续 reasoning 工作埋下种子。<\/p>","terms":["few-shot learning","zero-shot","in-context learning","emergent behavior"]}},{"t":399,"figs":[{"t":410,"file":"slides/part01/slide_021.jpg"},{"t":568,"file":"slides/part01/slide_022.jpg"}],"en":{"title":"Emergent behavior and chain of thought","problem":"Scaling laws describe average loss but do not predict qualitatively new behaviors, and some behaviors only help above a size threshold.","why":"Chain of thought (CoT) is an emergent capability: at small scale (LLaMA ~8B, GPT ~7B, PaLM 8B) supplying reasoning steps does nothing, while larger models use the demonstrated process to solve new problems.","how":"Instead of a bare one-shot answer, include the worked reasoning in the prompt (CoT prompting), so the model learns the procedure and transfers it.","detail":"<p>Azalia frames emergence as behaviors \"we never could predict until we had these bigger models.\" The canonical example is <b>chain of thought<\/b>.<\/p><ul><li>Usual one-shot math prompting gives a problem plus an answer; the model may or may not generalize.<\/li><li>CoT prompting additionally shows the reasoning: \"Roger started with 5 balls. Two cans of 3 is 6. 5+6=11.\" The model then follows the process on new problems.<\/li><li>The toy example is trivial for a 1B model today, but the property \"holds to this day\" and underpins thinking/reasoning models.<\/li><li>Empirically, small models (8B LLaMA, ~7B GPT) gain nothing from CoT; larger LLaMA/PaLM can leverage the traces to solve problems better.<\/li><\/ul>","terms":["chain of thought","emergent behavior","LLaMA","PaLM"]},"zh":{"title":"Emergent behavior 与 chain of thought","problem":"Scaling laws 描述的是平均 loss，无法预测质变式的新行为，而有些行为只有超过某规模阈值才会奏效。","why":"Chain of thought（CoT）是一种 emergent capability：在小规模（LLaMA ~8B、GPT ~7B、PaLM 8B）上提供 reasoning 步骤毫无作用，而更大的模型能利用示范的过程解决新问题。","how":"不要只给一个孤立的 one-shot 答案，而是在 prompt 中给出完整的推理解答过程（CoT prompting），让模型学到该流程并迁移使用。","detail":"<p>Azalia 将涌现描述为“直到有了这些更大的模型我们才可能预测”的行为。典型例子是 <b>chain of thought<\/b>。<\/p><ul><li>通常的 one-shot 数学 prompting 只给问题和答案；模型未必能泛化。<\/li><li>CoT prompting 额外展示推理：“Roger 一开始有 5 个球。两罐各 3 个是 6。5+6=11。”模型随后能在新问题上复现该过程。<\/li><li>这个玩具示例对今天的 1B 模型微不足道，但这一性质“至今成立”，并支撑着 thinking/reasoning models。<\/li><li>经验上，小模型（8B LLaMA、~7B GPT）从 CoT 毫无收益；更大的 LLaMA/PaLM 能利用这些 trace 更好地解题。<\/li><\/ul>","terms":["chain of thought","emergent behavior","LLaMA","PaLM"]}},{"t":603,"figs":[{"t":604,"file":"slides/part01/slide_024.jpg"}],"en":{"title":"More emergent abilities and continued scaling momentum","problem":"CoT is not the only capability that appears abruptly, and labs need to know whether further scaling still pays off.","why":"Certain skills—modular arithmetic, word unscrambling—switch on suddenly at a particular model size, so smaller models cannot get them regardless of prompting.","how":"Frontier labs keep pushing the scaling laws on the assumption that more emergent behaviors will surface at larger scale.","detail":"<p>Beyond CoT, larger models suddenly gain abilities like <b>modular arithmetic<\/b> and <b>word unscramble<\/b> problems—\"all of a sudden it appears at a certain size.\" These are step functions, not smooth improvements, and they cannot be coaxed out of a smaller model by prompting alone.<\/p><ul><li>Because of these surprises, frontier companies and labs stay motivated to keep pushing the scaling laws rather than only optimizing known objectives.<\/li><li>Azalia's point is that we cannot predict these transitions ahead of time: they were only observed once bigger models existed, and she expects <b>more emergent behaviors<\/b> to surface and matter for downstream agent capability.<\/li><li>This sets up the lecture's pivot: once pre-training/fine-tuning started to stall, <b>inference-time computation<\/b> became a new frontier for making models more capable.<\/li><li>It also motivates the whole course: if capability appears unpredictably with scale and test-time compute, agents built on top must be measured empirically, not assumed.<\/li><\/ul>","terms":["emergent abilities","modular arithmetic","word unscramble","frontier labs"]},"zh":{"title":"更多 emergent abilities 与 scaling 势头延续","problem":"CoT 并非唯一突然出现的能力，实验室需要判断继续扩大规模是否仍有回报。","why":"某些技能——modular arithmetic、word unscrambling——在特定模型规模上突然开启，因此小模型无论怎么 prompting 都学不会。","how":"前沿实验室持续推动 scaling laws，假定更大规模会涌现更多 emergent behaviors。","detail":"<p>除 CoT 之外，更大的模型会突然获得 <b>modular arithmetic<\/b> 和 <b>word unscramble<\/b> 等能力——“在某个规模上它突然就出现了”。这些是阶跃函数而非平滑改进，且无法仅靠 prompting 从小模型中诱导出来。<\/p><ul><li>正是这些意外，让前沿公司和实验室持续有动力推进 scaling laws，而不是只优化已知目标。<\/li><li>Azalia 的要点是我们无法提前预测这些跃迁：它们只在更大模型出现后才被观察到，她预期会有<b>更多 emergent behaviors<\/b> 浮现并影响下游 agent 能力。<\/li><li>这为讲座的转向做铺垫：当 pre-training/fine-tuning 开始停滞，<b>inference-time computation<\/b> 成为提升模型能力的新前沿。<\/li><li>这也为整门课程提供动机：如果能力会随规模与 test-time compute 不可预测地出现，那么构建其上的 agents 必须通过实证衡量，而不能想当然。<\/li><\/ul>","terms":["emergent abilities","modular arithmetic","word unscramble","frontier labs"]}},{"t":649,"figs":[{"t":692,"file":"slides/part01/slide_025.jpg"}],"en":{"title":"ChatGPT and the post-training recipe","problem":"Scaling alone produced GPT-3 but not a usable assistant; GPT-3-era models did not reliably follow instructions.","why":"ChatGPT introduced two post-training innovations—instruction tuning and RLHF—that aligned a base model with human instructions and preferences, driving breakout adoption.","how":"Combine instruction tuning (supervised instruction/answer pairs) with reinforcement learning from human feedback to steer generations toward human-preferred answers.","detail":"<p>ChatGPT launched in <b>November 2022<\/b> and reached <b>1 million users in 5 days<\/b>—faster than the other famous software and services shown on the slide. Azalia stresses it was not just scale: pieces of innovation on top of parameter scaling made the leapfrog over GPT-3.<\/p><ul><li>The two key innovations: <b>instruction tuning<\/b> and <b>reinforcement learning from human feedback (RLHF)<\/b>.<\/li><li>These are previewed here and studied in depth throughout the course.<\/li><li>The pipeline the course builds toward: <b>pre-training → fine-tuning on high-quality data → instruction tuning → RLHF/RLAIF<\/b>.<\/li><li>This history frames the rest of the lecture: first the pre-training/alignment pipeline in detail, then the newer inference-scaling and agentic directions.<\/li><li>It also previews the recurring theme—capability leaps come from combining scale with a training/feedback objective, not from scale alone.<\/li><\/ul>","terms":["ChatGPT","instruction tuning","RLHF","post-training"]},"zh":{"title":"ChatGPT 与 post-training 配方","problem":"仅靠 scaling 得到的是 GPT-3，而不是可用的助手；GPT-3 时代的模型无法可靠地遵循指令。","why":"ChatGPT 引入了两项 post-training 创新——instruction tuning 和 RLHF——使 base model 与人类指令和偏好对齐，从而带来爆发式采用。","how":"将 instruction tuning（有监督的指令/答案配对）与 reinforcement learning from human feedback 结合，将生成结果导向人类偏好的答案。","detail":"<p>ChatGPT 于 <b>2022 年 11 月<\/b>发布，<b>5 天内达到 100 万用户<\/b>——比幻灯片上其他著名软件与服务都快。Azalia 强调这不仅是规模：在参数扩展之上的一系列创新，才实现了对 GPT-3 的跃迁。<\/p><ul><li>两项关键创新：<b>instruction tuning<\/b> 和 <b>reinforcement learning from human feedback（RLHF）<\/b>。<\/li><li>这里先做预告，课程中会深入学习。<\/li><li>课程逐步构建的 pipeline：<b>pre-training → 在高质量数据上 fine-tuning → instruction tuning → RLHF/RLAIF<\/b>。<\/li><li>这段历史框定了讲座的其余部分：先详述 pre-training/alignment pipeline，再讲更新的 inference-scaling 与 agentic 方向。<\/li><li>它也预告了反复出现的主题——能力跃迁来自将规模与训练/反馈目标结合，而非仅靠规模。<\/li><\/ul>","terms":["ChatGPT","instruction tuning","RLHF","post-training"]}},{"t":720,"figs":[{"t":729,"file":"slides/part01/slide_028.jpg"},{"t":758,"file":"slides/part01/slide_030.jpg"}],"en":{"title":"Pretraining and alignment: process overview","problem":"A pretrained model has absorbed all internet text but has no notion of right vs. wrong and does not know how to follow instructions.","why":"Pre-training only optimizes next-token prediction over raw web/books data, so it captures statistical structure but not human values or task-following behavior.","how":"Add an alignment/fine-tuning stage that steers the model toward human goals, preferences, and values—shown concretely by fine-tuning a base model for properties like sensibleness and safety with curated data.","detail":"<p>The <b>pre-training<\/b> step is the easiest: train on lots of text/data to predict the next token; it is the beginning of any language model. But the resulting base model \"statistically knows about the state of the world\" without knowing what is right, and it does not follow instructions.<\/p><ul><li>Alignment—steering models to human goals/preferences/values—is described as \"still a big problem… we haven't mastered it yet.\"<\/li><li>The class shows graphs of fine-tuning a base model for <b>sensibleness<\/b> and <b>safety<\/b> using curated, high-quality data that demonstrates what is safe/unsafe and sensible/nonsensical.<\/li><li>Fine-tuning was the \"key differentiating factor\" for ChatGPT relative to GPT-3 and prior models.<\/li><li>Although models are getting more powerful, the instructors emphasize that alignment is not solved—it remains an active problem the course returns to.<\/li><\/ul>","terms":["pre-training","alignment","base model","sensibleness","safety"]},"zh":{"title":"Pretraining 与 alignment：流程概览","problem":"预训练模型已吸收所有互联网文本，但没有对错概念，也不知道如何遵循指令。","why":"Pre-training 只在原始网页/书籍数据上优化 next-token prediction，因此学到的是统计结构，而非人类价值或遵循任务的行为。","how":"加入 alignment/fine-tuning 阶段，将模型导向人类目标、偏好与价值——具体体现为用精选数据微调 base model 以获得 sensibleness 和 safety 等属性。","detail":"<p><b>Pre-training<\/b> 步骤最简单：在大量文本/数据上训练以预测 next token；这是任何语言模型的起点。但由此得到的 base model“在统计上了解世界的状态”，却不知道什么是对的，也不遵循指令。<\/p><ul><li>Alignment——将模型导向人类目标/偏好/价值——被描述为“仍是个大问题……我们还没掌握它”。<\/li><li>课程展示了用精选高质量数据微调 base model 以获得 <b>sensibleness<\/b> 和 <b>safety<\/b> 的曲线，这些数据演示了何为安全/不安全、合理/荒谬。<\/li><li>Fine-tuning 是 ChatGPT 相对 GPT-3 及更早模型的“关键差异化因素”。<\/li><li>尽管模型越来越强大，讲师强调 alignment 尚未解决——它仍是一个活跃问题，课程会反复回到它。<\/li><\/ul>","terms":["pre-training","alignment","base model","sensibleness","safety"]}},{"t":861,"figs":[{"t":864,"file":"slides/part01/slide_033.jpg"}],"en":{"title":"Supervised fine-tuning on curated data","problem":"A pretrained model needs behavior that raw web text does not reliably teach.","why":"Fine-tuning repeats next-token prediction but on a much higher-quality, curated corpus, shifting the model's outputs toward the distribution you actually want.","how":"Fine-tune on expensive, curated data—books, creative essays, and similar high-quality text—rather than scraped web data.","detail":"<p>Supervised fine-tuning (SFT) \"follows the same process as pre-training\" (next-token prediction) but on <b>much higher-quality data<\/b>, so the model stays the same architecture while its output distribution shifts.<\/p><ul><li>Examples of the curated corpus: <b>books, creative essays<\/b>, and licensed text that companies pay millions—potentially hundreds of millions—of dollars to acquire.<\/li><li>\"The model becomes much better as a result of that.\"<\/li><li>The lecture emphasizes this is the first of several data-curation steps: the same high-quality-data lever reappears in instruction tuning and reward modeling.<\/li><li>Data quality at this stage shapes downstream behavior and is a large part of the cost and effort of building a frontier model.<\/li><\/ul>","terms":["supervised fine-tuning","next-token prediction","data curation"]},"zh":{"title":"基于精选数据的 supervised fine-tuning","problem":"预训练模型需要的行为无法由原始网页文本可靠地教会。","why":"Fine-tuning 仍重复 next-token prediction，但在质量高得多的精选语料上进行，从而把模型输出分布推向你真正想要的分布。","how":"在昂贵精选的数据上微调——书籍、创意散文等高质量文本——而非抓取的网页数据。","detail":"<p>Supervised fine-tuning（SFT）“与 pre-training 过程相同”（next-token prediction），但用的是<b>质量高得多的数据<\/b>，因此模型架构不变，输出分布却发生偏移。<\/p><ul><li>精选语料的例子：<b>书籍、创意散文<\/b>，以及公司花费数百万——可能数亿——美元获得的授权文本。<\/li><li>“模型因此变得好得多。”<\/li><li>讲座强调这是若干数据精选步骤中的第一步：同一个高质量数据杠杆在 instruction tuning 和 reward modeling 中会再次出现。<\/li><li>这一阶段的数据质量决定下游行为，是构建前沿模型成本与投入的重要部分。<\/li><\/ul>","terms":["supervised fine-tuning","next-token prediction","data curation"]}},{"t":907,"figs":[{"t":916,"file":"slides/part01/slide_036.jpg"}],"en":{"title":"Instruction tuning","problem":"Even a well-fine-tuned base model does not naturally behave like an assistant responding to user requests.","why":"Raw text lacks explicit instruction→answer mappings, so the model never learns the conversational format of following a directive and producing the desired answer.","how":"Train on instruction/question–answer pairs (human-generated data/templates plus synthetic data) so the model learns to answer and walk through processes; chain-of-thought fine-tuning includes the reasoning with the label.","detail":"<p><b>Instruction tuning<\/b> exposes the model to <b>instruction + question/answer pairs<\/b>. Traditionally the data is a combination of <b>human-generated data or templates<\/b> plus <b>synthetic data<\/b>.<\/p><ul><li>Example instruction: \"Please answer the following question. What is the boiling point of nitrogen?\" followed by the answer.<\/li><li><b>Chain-of-thought fine-tuning<\/b> goes further and shows the model a process to reach the answer, with the label/result provided.<\/li><li>The <b>quality and generality<\/b> of this dataset \"has a lot of impact on the quality of the model.\"<\/li><li>After this stage the model \"becomes more and more like the models we see today\"—you can ask questions and go back and forth.<\/li><\/ul>","terms":["instruction tuning","chain-of-thought fine-tuning","synthetic data"]},"zh":{"title":"Instruction tuning","problem":"即便是微调良好的 base model，也不会自然地像助手那样响应用户请求。","why":"原始文本缺少明确的 instruction→answer 映射，因此模型从未学会遵循指令并给出期望答案的对话格式。","how":"在 instruction/question–answer 配对上训练（人类生成的数据/模板加合成数据），让模型学会作答并展示过程；chain-of-thought fine-tuning 会把 reasoning 连同标签一起给出。","detail":"<p><b>Instruction tuning<\/b> 让模型接触 <b>instruction + question/answer 配对<\/b>。传统上这些数据由 <b>人类生成的数据或模板<\/b> 加上 <b>synthetic data<\/b> 组合而成。<\/p><ul><li>示例指令：“Please answer the following question. What is the boiling point of nitrogen?”后面跟着答案。<\/li><li><b>Chain-of-thought fine-tuning<\/b> 更进一步，向模型展示通向答案的过程，并提供标签/结果。<\/li><li>该数据集的<b>质量与泛化性<\/b>“对模型质量有很大影响”。<\/li><li>经过这一阶段，模型“越来越像我们今天看到的模型”——你可以提问并来回交流。<\/li><\/ul>","terms":["instruction tuning","chain-of-thought fine-tuning","synthetic data"]}},{"t":1011,"figs":[{"t":1023,"file":"slides/part01/slide_039.jpg"}],"en":{"title":"RLHF and reward modeling","problem":"Supervised pairs cover only so many behaviors, and there is no scalar objective telling the model which of two plausible answers is better.","why":"The RLHF objective is not a fixed supervised label but a learned <b>reward model<\/b> distilled from human preference ratings, so generation can be optimized against an approximate human judge.","how":"Have humans (sometimes experts) rate model answers, train a reward model on those comparisons, then use it to guide the LLM's parameters toward high-reward generations; different reward types can be weighted.","detail":"<p><b>RLHF<\/b> = reinforcement learning from human feedback. The key difference from SFT is how the <b>objective and data<\/b> are created: instead of supervised prompt/label pairs, a <b>reward model<\/b> is built from human preferences.<\/p><ul><li>Companies spend heavily to have humans (sometimes experts, sometimes ordinary people) rate generated answers as correct or not.<\/li><li>The reward model replaces the human at training time and steers the LLM toward answers it scores highly.<\/li><li>Reward dimensions mentioned: <b>correctness, helpfulness, specificity, harmlessness<\/b>, weighted according to what a lab cares about (the transcript slips between RLHF and \"RLAIF\" here).<\/li><li>Together, <b>pre-training → high-quality fine-tuning → instruction tuning → RLHF<\/b> were the core components that made ChatGPT far more capable than GPT-3 and prior models.<\/li><\/ul>","terms":["RLHF","reward model","human preferences","helpfulness","harmlessness"]},"zh":{"title":"RLHF 与 reward modeling","problem":"有监督配对只能覆盖有限的行为，且没有标量目标告诉模型两个看似合理的答案哪个更好。","why":"RLHF 的目标不是固定的监督标签，而是从人类偏好评分中蒸馏出的学习型 <b>reward model<\/b>，因此可以针对一个近似的人类评判者优化生成。","how":"让人类（有时是专家）对模型答案评分，在这些比较上训练一个 reward model，再用它引导 LLM 的参数朝高奖励生成靠拢；不同奖励类型可加权。","detail":"<p><b>RLHF<\/b> = reinforcement learning from human feedback。与 SFT 的关键区别在于 <b>目标和数据<\/b> 的构造方式：不再是有监督的 prompt/label 配对，而是从人类偏好构建 <b>reward model<\/b>。<\/p><ul><li>公司投入巨资让人类（有时是专家，有时是普通人）对生成答案的正确与否进行评分。<\/li><li>Reward model 在训练时替代人类，把 LLM 导向它评分高的答案。<\/li><li>提到的奖励维度：<b>correctness、helpfulness、specificity、harmlessness<\/b>，按实验室关注的重点加权（transcript 在这里在 RLHF 和 “RLAIF” 之间有所混用）。<\/li><li>合起来看，<b>pre-training → 高质量 fine-tuning → instruction tuning → RLHF<\/b> 是使 ChatGPT 远强于 GPT-3 及更早模型的核心组件。<\/li><\/ul>","terms":["RLHF","reward model","human preferences","helpfulness","harmlessness"]}},{"t":1177,"figs":[{"t":1183,"file":"slides/part01/slide_043.jpg"},{"t":1200,"file":"slides/part01/slide_045.jpg"},{"t":1344,"file":"slides/part01/slide_050.jpg"}],"en":{"title":"Inference scaling and Large Language Monkeys","problem":"Until roughly a year before the lecture, capability came from pretraining and fine-tuning; test-time compute was not treated as a scaling axis.","why":"Generations are stochastic (controllable via temperature), so a single sample reveals only one point in a much larger space—the model may already know a correct answer it rarely emits.","how":"Parallel sampling: sample many answers to the same problem, use a verifier/selection mechanism (e.g. unit tests), and output a verified-correct one—without changing any model parameters.","detail":"<p>Inference is a new frontier for capability. Azalia presents <b>Large Language Monkeys<\/b>, inspired by the <b>infinite monkey theorem<\/b>: let the LLM be the monkey and repeatedly ask it to solve the same input problem.<\/p><ul><li>Instead of one generation, produce many (<b>parallel sampling<\/b>) and use a <b>verifier<\/b> to select a correct one—e.g. run unit tests on generated code and keep the version that passes.<\/li><li>Why it works: model responses have variance; they are non-deterministic, and <b>temperature<\/b> controls that diversity.<\/li><li>\"Inference scaling\" means the model's parameters stay <b>fixed<\/b>—only decoding/sampling changes to produce harder-problem solutions.<\/li><li>A Q&A notes the space of possible answers is vastly larger than what 10,000 samples can cover, and that raising temperature too high yields gibberish (usually beyond ~1.2).<\/li><\/ul>","terms":["inference scaling","parallel sampling","verifier","temperature","Large Language Monkeys"]},"zh":{"title":"Inference scaling 与 Large Language Monkeys","problem":"直到讲座前约一年，能力都来自 pretraining 和 fine-tuning；test-time compute 未被当作 scaling 轴。","why":"生成是随机的（可通过 temperature 控制），因此单个样本只揭示了更大空间中的一个点——模型可能已经知道正确答案，只是很少输出。","how":"并行采样：对同一问题采样多个答案，用 verifier/选择机制（如 unit tests）挑出验证正确的答案——完全不改变任何模型参数。","detail":"<p>Inference 是能力的新前沿。Azalia 介绍了 <b>Large Language Monkeys<\/b>，其灵感来自 <b>infinite monkey theorem<\/b>：让 LLM 扮演猴子，反复要求它求解同一个输入问题。<\/p><ul><li>不做单次生成，而是产生许多次（<b>parallel sampling<\/b>）并用 <b>verifier<\/b> 选出正确的那个——例如对生成的代码运行 unit tests，保留通过测试的版本。<\/li><li>为何有效：模型回答有方差；它们是非确定性的，而 <b>temperature<\/b> 控制这种多样性。<\/li><li>“Inference scaling”意味着模型参数保持<b>固定<\/b>——只改变 decoding/sampling 来产生更难问题的解。<\/li><li>Q&amp;A 指出，可能答案的空间远大于 10,000 次采样所能覆盖的范围，且 temperature 提得太高会产生乱码（通常超过约 1.2 就不行）。<\/li><\/ul>","terms":["inference scaling","parallel sampling","verifier","temperature","Large Language Monkeys"]}},{"t":1403,"figs":[],"en":{"title":"Repeated sampling results: coverage scaling","problem":"Does repeated sampling actually turn weak models into strong problem solvers?","why":"If any sample is correct, a perfect verifier recovers it, so coverage—the fraction of problems solved by at least one of k samples—should rise with k even when single-sample accuracy is low.","how":"Measure coverage as samples-per-problem grow from 1 to 10,000 on math and coding benchmarks.","detail":"<p>The experiment sweeps samples per problem from <b>1 to 10,000<\/b> on math and coding benchmarks and plots <b>coverage<\/b> (fraction solved by at least one sample).<\/p><ul><li>At one sample, smaller open models (LLaMA 3 8B, LLaMA 7B) trail <b>GPT-4o<\/b>.<\/li><li>As samples increase, the smaller models' coverage curves cross above GPT-4o in all cases shown.<\/li><li>Interpretation: models \"already know a whole lot more\" than a single generation exposes.<\/li><li>For some hard problems only <b>3–4 of 10,000<\/b> samples were correct—showing both the potential and the sample-inefficiency.<\/li><li>This motivates inference scaling without touching parameter count, and \"there are many other ways\" to do it beyond repeated sampling.<\/li><\/ul>","terms":["coverage","pass@k","GPT-4o","LLaMA","sample efficiency"]},"zh":{"title":"重复采样结果：coverage scaling","problem":"重复采样真能把弱模型变成强解题者吗？","why":"只要有一个样本正确，完美的 verifier 就能找出来，因此 coverage——k 个样本中至少一个解出的题目比例——应随 k 上升，即使单样本准确率很低。","how":"在数学和编程 benchmarks 上，将每题采样数从 1 增至 10,000，测量 coverage。","detail":"<p>实验在数学和编程 benchmarks 上把每题采样数从 <b>1 扫到 10,000<\/b>，并绘制 <b>coverage<\/b>（至少一个样本解出的比例）。<\/p><ul><li>单个样本时，较小的开源模型（LLaMA 3 8B、LLaMA 7B）落后于 <b>GPT-4o<\/b>。<\/li><li>随着样本增加，小模型的 coverage 曲线在所展示的所有情形中都越过 GPT-4o。<\/li><li>解读：模型“已经知道的东西”远比单次生成所暴露的多得多。<\/li><li>对某些难题，10,000 个样本中只有 <b>3–4 个<\/b>正确——既显示了潜力，也显示了样本效率之低。<\/li><li>这为不改变参数量的 inference scaling 提供动机，而“还有很多其他方式”可以做到，不止重复采样。<\/li><\/ul>","terms":["coverage","pass@k","GPT-4o","LLaMA","sample efficiency"]}},{"t":1496,"figs":[],"en":{"title":"Q&A: sampling cost, verifiers, and temperature","problem":"Students probe the practical limits of repeated sampling: latency, verification when no checker exists, and diversity control.","why":"Parallel samples can run concurrently, so latency is less of an issue than total compute cost; and selection requires a verifier, which is hard in open-ended domains.","how":"Use reward models / LLM-as-judge when unit-test-style verifiers are unavailable; tune temperature and other tricks for diversity; trade compute cost against problem complexity.","detail":"<p>Key points from the Q&A:<\/p><ul><li><b>Answer space:<\/b> the model can only select among answers it can generate; the full space is far larger than 10,000 samples, yet 10,000 is \"highly sample efficient\" relative to IMO-level problems a tiny 7B/8B LLaMA can occasionally solve.<\/li><li><b>Latency/cost:<\/b> parallel samples can be batched, so latency is less of an issue, but there is a compute-cost trade-off that varies with problem complexity—covered later in the course.<\/li><li><b>Verifiers:<\/b> easier when available; otherwise there is research on <b>LLM judges, LLM reward functions, and LLMs with tools<\/b>. A dedicated lecture covers verifiers.<\/li><li><b>Temperature:<\/b> cannot be too high (gibberish); beyond ~1.2 it is \"not great,\" and there is research on tuning it plus other tricks for answer diversity.<\/li><\/ul>","terms":["LLM-as-judge","reward model","temperature","latency","verifier"]},"zh":{"title":"Q&A：采样成本、verifiers 与 temperature","problem":"学生探究重复采样的实际限制：latency、没有 checker 时如何验证，以及多样性控制。","why":"并行样本可以并发运行，因此 latency 问题不如总 compute 成本突出；而选择需要 verifier，这在开放式领域很难。","how":"当没有 unit-test 式 verifier 时，使用 reward models / LLM-as-judge；调整 temperature 及其他技巧以获得多样性；在 compute 成本与问题复杂度之间权衡。","detail":"<p>Q&amp;A 的要点：<\/p><ul><li><b>答案空间：<\/b>模型只能在它能生成的答案中选择；完整空间远大于 10,000 个样本，但相对于一个 7B/8B 小 LLaMA 偶尔能解出的 IMO 级问题，10,000 已“采样效率很高”。<\/li><li><b>Latency/成本：<\/b>并行样本可以批处理，因此 latency 问题较小，但存在随问题复杂度变化的 compute 成本权衡——课程后续会讲。<\/li><li><b>Verifiers：<\/b>有 verifier 时更容易；否则有关于 <b>LLM judges、LLM reward functions 以及带工具的 LLMs<\/b> 的研究。会有一讲专门讨论 verifiers。<\/li><li><b>Temperature：<\/b>不能太高（会出乱码）；超过约 1.2 就“不太好”，有研究在调它以及其他获得答案多样性的技巧。<\/li><\/ul>","terms":["LLM-as-judge","reward model","temperature","latency","verifier"]}},{"t":1696,"figs":[{"t":1719,"file":"slides/part01/slide_053.jpg"}],"en":{"title":"DeepSeek/o1 and closing the train–test loop","problem":"Inference scaling improves outputs on a fixed model but does not itself make the model better; reasoning releases (DeepSeek, o1, Gemini thinking) raised a new question.","why":"Test-time generation can become training data: when the answer is known (math) or verifiable (code), many generated solutions/traces can be filtered and used as synthetic supervision, improving the model rather than just the outputs.","how":"Combine fine-tuning and test-time scaling in a loop—generate large volumes of quality synthetic data at test time, add it to the training set, fine-tune—so the model continually improves itself.","detail":"<p>DeepSeek (released <b>December 2024<\/b>), OpenAI's <b>o1<\/b> series, and Gemini thinking models marked a shift. The new move is to <b>bring fine-tuning and test-time scaling together<\/b>.<\/p><ul><li>For math, where the answer is known, the model can generate many reasoning paths that lead to the golden answer.<\/li><li>For coding problems, it can generate tons of quality data during test-time scaling that becomes part of the training set.<\/li><li>Fine-tuning on that data makes the model better—\"the self-improving piece that we are very excited about.\"<\/li><li>The instructors call the loop open-ended: \"there is no boundary in how good the models can become with test time scaling\" fed back into training.<\/li><\/ul>","terms":["DeepSeek","o1","test-time scaling","synthetic data","self-improvement"]},"zh":{"title":"DeepSeek/o1 与闭合 train–test 循环","problem":"Inference scaling 在固定模型上改进输出，但本身不会让模型变好；reasoning 发布（DeepSeek、o1、Gemini thinking）提出了新问题。","why":"Test-time 生成可以变成训练数据：当答案已知（数学）或可验证（代码）时，可以筛选大量生成的解/trace 作为合成监督，改进模型而不只是改进输出。","how":"在循环中结合 fine-tuning 与 test-time scaling——在 test time 生成大量高质量合成数据，加入训练集，再微调——使模型持续自我改进。","detail":"<p>DeepSeek（<b>2024 年 12 月<\/b>发布）、OpenAI 的 <b>o1<\/b> 系列和 Gemini thinking 模型标志着一个转变。新做法是 <b>把 fine-tuning 和 test-time scaling 结合起来<\/b>。<\/p><ul><li>对数学而言，答案已知，模型可以生成许多通向 golden answer 的 reasoning paths。<\/li><li>对编程问题而言，它可以在 test-time scaling 期间生成大量高质量数据，这些数据成为训练集的一部分。<\/li><li>在这些数据上微调会让模型更好——“这就是我们非常兴奋的自我改进部分。”<\/li><li>讲师称这个循环是开放式的：“把 test time scaling 反馈进训练，模型能变得多好是没有边界的。”<\/li><\/ul>","terms":["DeepSeek","o1","test-time scaling","synthetic data","self-improvement"]}},{"t":1820,"figs":[{"t":1820,"file":"slides/part01/slide_055.jpg"},{"t":1885,"file":"slides/part01/slide_059.jpg"}],"en":{"title":"Reasoning models and test-time compute","problem":"Hard problems need more than one forward pass; a fixed amount of computation caps quality on math/IMO-level tasks.","why":"Like humans, reasoning models spend more compute—longer chains of thought and multiple strategies—so accuracy can scale with test-time compute while parameter count stays fixed.","how":"Train/elicit thinking traces that perform problem analysis, task decomposition, self-evaluation with feedback (tests, calculator), self-correction, and backtracking; OpenAI's o1 showed a log-linear rise in pass@1 with test-time compute on AIME.","detail":"<p>Motivation: for difficult problems, humans think longer and try different strategies; thinking models do the same. Steps named in the lecture:<\/p><ul><li><b>Problem analysis<\/b> — parse what is being asked.<\/li><li><b>Task decomposition<\/b> — break into simpler, more addressable subproblems.<\/li><li><b>Self-evaluation / feedback<\/b> — run tests, use a calculator, or judge the answer.<\/li><li><b>Self-correction and backtracking<\/b> — abandon a wrong approach and try another.<\/li><\/ul><p>Some of this was curated into training data; much is acquired during fine-tuning and RL-from-synthetic-data. OpenAI's o1 showed <b>log-linear<\/b> growth of <b>pass@1<\/b> with test-time compute on the hard AIME math benchmark, at fixed parameters. A worked example is o1 writing a bash script to transpose a matrix, producing its own analysis, decomposition, and mid-stream self-corrections (\"wait, something is wrong\").<\/p>","terms":["test-time compute","pass@1","AIME","problem analysis","backtracking","self-correction"]},"zh":{"title":"Reasoning models 与 test-time compute","problem":"难题需要不止一次前向传播；固定的计算量限制了数学/IMO 级任务的质量。","why":"像人类一样，reasoning models 花更多 compute——更长的 chains of thought 和多种策略——因此准确率可随 test-time compute 扩展，而参数量保持固定。","how":"训练/引出能进行 problem analysis、task decomposition、带反馈的自评估（tests、calculator）、self-correction 和 backtracking 的 thinking traces；OpenAI 的 o1 展示了在 AIME 上 pass@1 随 test-time compute 呈对数线性上升。","detail":"<p>动机：对困难问题，人类会思考更久并尝试不同策略；thinking models 也是如此。讲座列出的步骤：<\/p><ul><li><b>Problem analysis<\/b> —— 解析问题在问什么。<\/li><li><b>Task decomposition<\/b> —— 拆解为更简单、更易处理的子问题。<\/li><li><b>Self-evaluation / feedback<\/b> —— 运行测试、使用 calculator，或评判答案。<\/li><li><b>Self-correction and backtracking<\/b> —— 放弃错误思路并尝试另一条。<\/li><\/ul><p>其中一部分被整理进训练数据；大部分是在 fine-tuning 和 RL-from-synthetic-data 过程中习得的。OpenAI 的 o1 展示了在困难的 AIME 数学 benchmark 上，固定参数下 <b>pass@1<\/b> 随 test-time compute 呈<b>对数线性<\/b>增长。一个实例是 o1 编写 bash script 来转置矩阵，自行完成分析、分解和过程中的自我纠正（“wait, something is wrong”）。<\/p>","terms":["test-time compute","pass@1","AIME","problem analysis","backtracking","self-correction"]}},{"t":2086,"figs":[],"en":{"title":"Reasoning vs GPT-4o and mechanism Q&A","problem":"Are reasoning-model gains due to actually generating the reasoning, or merely the instruction to think step by step?","why":"The answer differs by metric: coverage/pass@k can improve from sampling alone, but pass@1 requires the model to know which chain is correct—which is what train-time/RL learning adds.","how":"Treat the training data as teaching a generalized thinker: models learn decomposition, backtracking, and analysis that generalize beyond the instructions they were trained on.","detail":"<p>Reasoning models like o1 outperform GPT-4o on math calculation, data analysis, and programming, but not necessarily on creative/personal writing and text editing.<\/p><ul><li>A student asks whether the gain comes from generating the reasoning process or just from asking the model to think step by step and discovering latent capability; the instructors reply that the data has turned the model into a \"generalized thinker,\" with skills that generalize to new problems.<\/li><li>A base model can reason somewhat but \"doesn't quite know which one is correct\"; much of train-time/test-time scaling teaches correctness selection, which is why <b>pass@1<\/b> rises in reasoning models vs. <b>pass@k / coverage<\/b> in repeated sampling.<\/li><li>Thinking is expensive, but \"we want them to generate those because it leads to better answers.\"<\/li><\/ul>","terms":["pass@1","pass@k","GPT-4o","generalized thinker"]},"zh":{"title":"Reasoning 对比 GPT-4o 及机制 Q&A","problem":"reasoning models 的提升是因为真的生成了推理，还是仅因为被要求逐步思考？","why":"答案因指标而异：coverage/pass@k 可以仅靠采样提升，但 pass@1 需要模型知道哪条 chain 正确——这正是 train-time/RL 学习所补充的。","how":"把训练数据看作在教一个泛化的思考者：模型学到的分解、回溯和分析能泛化到训练指令之外。","detail":"<p>像 o1 这样的 reasoning models 在数学计算、数据分析和编程上优于 GPT-4o，但在创意/个人写作和文本编辑上未必。<\/p><ul><li>有学生问，提升是来自生成推理过程，还是仅仅来自要求模型逐步思考从而发现潜在能力；讲师回答说，数据已把模型变成“泛化的思考者”，其技能可泛化到新问题。<\/li><li>base model 也能做一定推理，但“不太清楚哪一个才是正确的”；train-time/test-time scaling 的很大一部分是在教正确性选择，这也是为什么 reasoning models 提升的是 <b>pass@1<\/b>，而重复采样提升的是 <b>pass@k / coverage<\/b>。<\/li><li>思考很昂贵，但“我们希望它们生成这些，因为这能带来更好的答案”。<\/li><\/ul>","terms":["pass@1","pass@k","GPT-4o","generalized thinker"]}},{"t":2257,"figs":[],"en":{"title":"Q&A: reasoning traces and how reasoning is taught","problem":"Should a separate (smaller) model produce the reasoning while a larger model gives the final answer? Are reasoning traces hardcoded or learned?","why":"Reasoning capability has scaled with model size, and models empirically prefer their own generated traces even over traces from a better model—so mixing models naively is unreliable.","how":"Bootstrap from CoT-heavy instruction data and templates, then let models generalize through fine-tuning and RL; outcome-reward and process-reward models supply the feedback that teaches better reasoning.","detail":"<p>Q&A highlights:<\/p><ul><li>Typically the <b>larger<\/b> model does reasoning, and you might use a smaller model to summarize the final answer—but \"models like their own traces more,\" even when traces come from a better model.<\/li><li>How reasoning is taught: \"it's a bit of both.\" The base model already had some thinking capability; CoT is heavily used in instruction-tuning data and templates; much is learned via fine-tuning and RL from synthetic data. No single published work fully covers this.<\/li><li>The course will cover <b>outcome reward models<\/b> and <b>process reward models<\/b>. There is always some bootstrapping (templates, CoT), but models generalize well beyond their training instructions.<\/li><li>A student asks whether sample count should depend on problem difficulty; absent published work, a <b>reward model<\/b> with a complexity notion could gate more (repeated or parallel) sampling.<\/li><\/ul>","terms":["own traces","outcome reward model","process reward model","bootstrapping","RL from synthetic data"]},"zh":{"title":"Q&A：reasoning traces 与 reasoning 如何习得","problem":"是否应由一个单独的（更小的）模型产生推理，而让更大的模型给出最终答案？reasoning traces 是硬编码的还是学到的？","why":"reasoning 能力随模型规模扩展，且经验上模型偏好自己生成的 traces，甚至胜过来自更好模型的 traces——因此简单混合模型并不可靠。","how":"从 CoT 密集的指令数据和模板中自举，再让模型通过 fine-tuning 和 RL 泛化；outcome-reward 和 process-reward models 提供教会更好推理的反馈。","detail":"<p>Q&amp;A 要点：<\/p><ul><li>通常由<b>更大<\/b>的模型做推理，你可以用更小的模型来总结最终答案——但“模型更喜欢自己的 trace”，即便那些 trace 来自更好的模型。<\/li><li>reasoning 如何教：“两者兼有。”base model 已有一些思考能力；CoT 在 instruction-tuning 数据和模板中被大量使用；很多是通过 fine-tuning 和 RL from synthetic data 学到的。没有单一已发表工作能完全覆盖这一点。<\/li><li>课程会讲 <b>outcome reward models<\/b> 和 <b>process reward models<\/b>。总会有一些自举（模板、CoT），但模型能泛化到远超训练指令的范围。<\/li><li>有学生问采样数是否应取决于问题难度；在没有已发表工作的情况下，一个带有复杂度概念的 <b>reward model<\/b> 可以用来决定是否做更多（重复或并行）采样。<\/li><\/ul>","terms":["own traces","outcome reward model","process reward model","bootstrapping","RL from synthetic data"]}},{"t":2449,"figs":[{"t":2461,"file":"slides/part01/slide_062.jpg"},{"t":2583,"file":"slides/part01/slide_063.jpg"},{"t":2658,"file":"slides/part01/slide_064.jpg"}],"en":{"title":"From LLMs to agents","problem":"LLMs as chatbots or reasoning models are essentially single-turn: they are fun to interact with but do not accomplish tasks for you.","why":"Achieving a task requires more than one generation: the system must hold a goal, plan, interact with an environment, react to feedback, and decide when to stop—plus memory to stay on task.","how":"Wrap the model in an agent loop—goal, planning, tool calls, environment feedback, self-correction, and stopping conditions—as in Claude Code and Deep Research.","detail":"<p>Recent agents (Claude Code, Deep Research, Codex) let people complete real workflows end-to-end. Azalia's example: research where to rent a home for a year while taking a Stanford class—the agent browses many sites, summarizes, and returns pros/cons. \"This used to not be possible before.\"<\/p><ul><li>Distinguishing feature of agents: <b>a goal → plan → take actions → get feedback → decide when to stop<\/b>.<\/li><li>They may require <b>external tools<\/b> and some form of <b>memory<\/b> to keep track of the task.<\/li><li>Today's reality is mostly <b>static agentic workflows<\/b>: one model produces a solution, another judges it and decides whether to accept; Deep Research calls the LLM on multiple inputs and aggregates into a summary.<\/li><li>Coding and research are where end-to-end autonomy is starting to show \"signs of life.\"<\/li><\/ul>","terms":["agent","Claude Code","Deep Research","tool use","memory"]},"zh":{"title":"从 LLM 到 agents","problem":"作为 chatbot 或 reasoning model 的 LLM 本质上是单轮的：互动有趣，但不会替你完成任务。","why":"完成一项任务需要不止一次生成：系统必须持有目标、规划、与环境交互、对反馈作出反应，并决定何时停止——还需要 memory 来保持不偏离任务。","how":"把模型包进 agent 循环——目标、规划、tool calls、环境反馈、self-correction 和停止条件——如 Claude Code 和 Deep Research 那样。","detail":"<p>近来的 agents（Claude Code、Deep Research、Codex）让人能端到端完成真实工作流。Azalia 的例子：研究在斯坦福上课期间到哪儿租一年的房子——agent 浏览许多网站、做总结并返回优缺点。“这在以前是不可能的。”<\/p><ul><li>agents 的显著特征：<b>目标 → 规划 → 采取行动 → 获取反馈 → 决定何时停止<\/b>。<\/li><li>它们可能需要 <b>external tools<\/b> 和某种 <b>memory<\/b> 来跟踪任务。<\/li><li>今天的现实大多是 <b>静态 agentic workflows<\/b>：一个模型产生解答，另一个评判并决定是否接受；Deep Research 对多个输入调用 LLM 并聚合成摘要。<\/li><li>编程和研究是端到端自主性开始显现“生命迹象”的领域。<\/li><\/ul>","terms":["agent","Claude Code","Deep Research","tool use","memory"]}},{"t":2703,"figs":[{"t":2728,"file":"slides/part01/slide_069.jpg"}],"en":{"title":"Agentic workflow building blocks and orchestration","problem":"Open-ended agent loops are hard to make reliable, so most deployed systems use hand-constructed graphs of LLM calls.","why":"Decomposing a task into a fixed workflow lets you insert verification and control, which is easier to make dependable than an unconstrained loop.","how":"Compose primitives—LLM calls, verifiers (unit tests in code/math), critics/judges (LLM-as-judge), tool calls (search, weather)—and orchestrate with prompt chaining, routing, parallelization, and an orchestrator/LLM manager.","detail":"<p>Typical workflows contain:<\/p><ul><li><b>LLM calls<\/b> with an instruction/input, producing an output.<\/li><li><b>Verifiers<\/b> (a full lecture is devoted to these) and <b>critics/judges<\/b>—effectively the LLM-as-judge paradigm.<\/li><li><b>Tool calls<\/b>—e.g. web search for Deep Research, looking up the weather.<\/li><\/ul><p>Orchestration patterns named: <b>prompt chaining<\/b> (chaining subtasks to the end goal), <b>routing<\/b> (complex vs. simple paths), <b>parallelization<\/b> (independent subtasks run simultaneously, then aggregated), and an <b>orchestrator / LLM manager<\/b> that plans and issues subsequent LLM calls (as seen in Claude Code). An evaluator or judge can replace real-world test feedback. All of this demands better <b>planning, multi-step reasoning, and self-improvement<\/b> than plain reasoning LLMs provide.<\/p>","terms":["prompt chaining","routing","parallelization","orchestrator","LLM-as-judge"]},"zh":{"title":"Agentic workflow 构件与编排","problem":"开放式 agent 循环很难做得可靠，因此大多数已部署系统使用手工构建的 LLM 调用图。","why":"把任务分解为固定 workflow 可以插入验证与控制，这比无约束的循环更容易做到可靠。","how":"组合原语——LLM calls、verifiers（代码/数学中的 unit tests）、critics/judges（LLM-as-judge）、tool calls（search、weather）——并用 prompt chaining、routing、parallelization 以及 orchestrator/LLM manager 来编排。","detail":"<p>典型 workflows 包含：<\/p><ul><li>带指令/输入的 <b>LLM calls<\/b>，产生输出。<\/li><li><b>Verifiers<\/b>（会有一整讲专门讨论）和 <b>critics/judges<\/b>——实际上就是 LLM-as-judge 范式。<\/li><li><b>Tool calls<\/b>——例如 Deep Research 的 web search、查天气。<\/li><\/ul><p>提到的编排模式：<b>prompt chaining<\/b>（把子任务串到最终目标）、<b>routing<\/b>（复杂 vs. 简单路径）、<b>parallelization<\/b>（独立子任务并行运行再聚合），以及负责规划并发起后续 LLM 调用的 <b>orchestrator / LLM manager<\/b>（见 Claude Code）。evaluator 或 judge 可以替代真实世界的测试反馈。所有这些都比普通 reasoning LLM 更要求更好的 <b>planning、multi-step reasoning 和 self-improvement<\/b>。<\/p>","terms":["prompt chaining","routing","parallelization","orchestrator","LLM-as-judge"]}},{"t":2889,"figs":[{"t":2904,"file":"slides/part01/slide_071.jpg"}],"en":{"title":"Coding agents, reliability, and RL","problem":"A year ago the edit-run-inspect loop of coding agents was unreliable; making it dependable is the crux of useful autonomy.","why":"The agent must navigate repositories, search/edit files, run terminal commands, and use command output to decide the next edit—errors compound unless the loop is verifiable and self-correcting.","how":"Same loop as before, enabled by more powerful models, better RL, RL with verifiable rewards, and train-time scaling; once models improve, a self-improvement loop kicks in where the model generates and verifies its own tasks.","detail":"<p>A coding agent interacts with the computer through the <b>terminal<\/b>: edit files, navigate/search the repo, run commands, inspect output, and branch to other files. The loop \"very much mirrors\" the agent loop—\"not quite reliable last year,\" now \"just starting to get reliable.\"<\/p><ul><li>Instructors argue the paradigm is unchanged; progress comes from <b>more powerful models and better RL<\/b>.<\/li><li><b>RL with verifiable rewards<\/b> and <b>train-time scaling<\/b> are working.<\/li><li>The <b>self-improvement loop<\/b>: as models improve, they can <b>generate tasks<\/b> and the tasks become more reliable; e.g. in <b>Code Monkeys<\/b>, generating unit tests for model-generated code and checking whether they help is a strong verification signal.<\/li><li>They invite research projects on making generation/verification more robust.<\/li><\/ul>","terms":["coding agent","RLVR","train-time scaling","Code Monkeys","unit tests"]},"zh":{"title":"Coding agents、可靠性与 RL","problem":"一年前 coding agents 的 edit-run-inspect 循环并不可靠；让它变得可靠是有用自主性的关键。","why":"agent 必须浏览仓库、搜索/编辑文件、运行终端命令，并用命令输出决定下一步编辑——除非循环可验证且能自我纠正，否则错误会累积。","how":"与之前相同的循环，靠更强大的模型、更好的 RL、RL with verifiable rewards 和 train-time scaling 来实现；一旦模型改进，就会出现自我改进循环：模型生成并验证自己的任务。","detail":"<p>coding agent 通过 <b>terminal<\/b> 与计算机交互：编辑文件、浏览/搜索仓库、运行命令、检查输出，并分支到其他文件。这个循环“非常像”agent 循环——“去年还不太可靠”，现在“刚刚开始变得可靠”。<\/p><ul><li>讲师认为范式未变；进展来自<b>更强大的模型和更好的 RL<\/b>。<\/li><li><b>RL with verifiable rewards<\/b> 和 <b>train-time scaling<\/b> 正在奏效。<\/li><li><b>自我改进循环<\/b>：随着模型改进，它们能<b>生成任务<\/b>，任务也变得更可靠；例如在 <b>Code Monkeys<\/b> 中，为模型生成的代码生成 unit tests 并检查它们是否有帮助，是一个很强的验证信号。<\/li><li>他们邀请大家做研究项目，使生成/验证更稳健。<\/li><\/ul>","terms":["coding agent","RLVR","train-time scaling","Code Monkeys","unit tests"]}},{"t":3042,"figs":[],"en":{"title":"The generator–verifier gap","problem":"Models can generate huge amounts of content, but generating is not the same as producing something useful.","why":"Usefulness requires a feedback signal; where feedback is cheap (math, code, rule-based domains) improvement continues, but in open-ended domains like creative writing human feedback becomes a bottleneck.","how":"Invest in robust verification—combining verifiers, LLM judges/reward models, tools—and accept that verification, not generation, is the limiting factor.","detail":"<p>This is the <b>generator–verifier gap<\/b>: it is easy for models to generate nonsense or plausible reasoning traces, but deciding usefulness needs a feedback loop.<\/p><ul><li>In domains with good, cheap feedback (math, code, rule-based tasks), continued improvement is possible.<\/li><li>In domains like <b>creative writing<\/b>, human feedback \"ends up becoming a bottleneck.\"<\/li><li>Getting <b>robust verification<\/b> is hard; Azalia's lab has a paper on <b>combining verifiers<\/b>, and verification \"continues to be one of the bottlenecks in this space.\"<\/li><li>A follow-up student discussion asks whether the big jump comes from RL or from diverse pre-training data—instructors say there is <b>no consensus<\/b>; both help, the loop is not well understood, and it is \"first signs of life\" being commercialized with much research still open.<\/li><\/ul>","terms":["generator-verifier gap","verification bottleneck","creative writing","RL"]},"zh":{"title":"Generator–verifier gap","problem":"模型能生成海量内容，但能生成并不等于能产出有用的东西。","why":"有用性需要反馈信号；在反馈廉价的地方（数学、代码、基于规则的领域）改进可以持续，但在创意写作等开放式领域，人类反馈成为瓶颈。","how":"投入稳健的验证——组合 verifiers、LLM judges/reward models、工具——并接受验证而非生成才是限制因素。","detail":"<p>这就是 <b>generator–verifier gap<\/b>：模型很容易生成无意义内容或看似合理的 reasoning traces，但判断有用性需要反馈循环。<\/p><ul><li>在反馈良好且廉价的领域（数学、代码、基于规则的任务），持续改进是可能的。<\/li><li>在 <b>creative writing<\/b> 等领域，人类反馈“最终成为瓶颈”。<\/li><li>获得<b>稳健验证<\/b>很难；Azalia 的实验室有一篇关于<b>组合 verifiers<\/b> 的论文，而验证“仍是这个领域的瓶颈之一”。<\/li><li>后续学生讨论问，大幅跃升来自 RL 还是多样的 pre-training 数据——讲师说<b>没有共识<\/b>；两者都有帮助，这个循环尚未被充分理解，这只是被商业化的“最初的生命迹象”，仍有许多研究待做。<\/li><\/ul>","terms":["generator-verifier gap","verification bottleneck","creative writing","RL"]}},{"t":3172,"figs":[{"t":3178,"file":"slides/part01/slide_076.jpg"},{"t":3248,"file":"slides/part01/slide_077.jpg"},{"t":3261,"file":"slides/part01/slide_078.jpg"},{"t":3270,"file":"slides/part01/slide_079.jpg"},{"t":3276,"file":"slides/part01/slide_083.jpg"}],"en":{"title":"The agent task loop and repetitive knowledge work","problem":"Even with a goal, it is often unclear what the user actually wants, and there may be no obvious signal that the task was completed.","why":"User intent is usually underspecified, so the agent must clarify it, search for the right context, and rely on verification (often tests it generates itself) to know when it is done.","how":"Use the goal → clarify intent → search → act → verify loop, and target tasks where verification and repetition make delegation easy: code migrations, version upgrades, restructuring, data engineering, data-warehouse migration.","detail":"<p>One abstraction from the agent chart: even when given a goal, the model must <b>clarify user intent<\/b>, then search for relevant files, choose actions, and <b>verify<\/b>—in the coding example, by passing tests it may itself generate.<\/p><ul><li>The key question is how the agent knows it completed what was asked, since <b>users often do not specify the problem well enough<\/b>.<\/li><li>Models like <b>o3<\/b> have seen many such end-to-end traces, so they can plan, reason, and conclude; much is still needed for full end-to-end goals.<\/li><li><b>Repetitive tasks<\/b> are where agents shine: code migrations, version upgrades, code-base restructuring, data extraction and cleanup, and data-warehouse migration—tedious for humans, easy to delegate.<\/li><\/ul>","terms":["intent clarification","verification","code migration","data engineering"]},"zh":{"title":"Agent 任务循环与重复性知识工作","problem":"即使有目标，用户真正想要什么往往也不清楚，而且可能没有明显信号表明任务已完成。","why":"用户意图通常描述不足，因此 agent 必须澄清它、搜索正确上下文，并依赖验证（往往是它自己生成的测试）来判断何时完成。","how":"使用 目标 → 澄清意图 → 搜索 → 行动 → 验证 的循环，并瞄准那些验证与重复性使委托变得容易的任务：code migrations、version upgrades、重构、data engineering、data-warehouse migration。","detail":"<p>从 agent 图中得出的一个抽象：即使给定目标，模型也必须<b>澄清用户意图<\/b>，然后搜索相关文件、选择动作并<b>验证<\/b>——在编程示例中，就是通过它可能自己生成的测试。<\/p><ul><li>关键问题是 agent 如何知道它完成了所要求的事，因为<b>用户往往没有把问题描述得足够清楚<\/b>。<\/li><li>像 <b>o3<\/b> 这样的模型见过许多这类端到端 traces，因此能规划、推理并得出结论；要实现完整的端到端目标仍有很多需要。<\/li><li><b>重复性任务<\/b>是 agents 大放异彩之处：code migrations、version upgrades、代码库重构、数据抽取与清洗、data-warehouse migration——对人类枯燥，容易委托。<\/li><\/ul>","terms":["intent clarification","verification","code migration","data engineering"]}},{"t":3279,"figs":[],"en":{"title":"Customer support agents","problem":"Customer support is a high-volume, thankless job, and the domain spans many sub-tasks that are hard to cover with one system.","why":"Much of support is lookup and summarization rather than deep reasoning, so LLMs can supply live knowledge and drafts that reduce the agent's cognitive load.","how":"Deploy focused capabilities: live transcription, knowledge assist that surfaces the relevant article from a database, smart reply drafting, and call summaries; some segments are heading toward end-to-end automation.","detail":"<p>Customer support is called one of the most prevalent agent applications. Concrete LLM capabilities mentioned:<\/p><ul><li><b>Live transcription<\/b>—gives a clean record of interactions (now common in meetings too).<\/li><li><b>Knowledge assist<\/b>—the support agent does not need to know everything; consult the LLM to get an answer and surface the relevant article, \"better than having just search like an index.\"<\/li><li><b>Smart replies<\/b>—agents draft chat responses.<\/li><li><b>Call summaries<\/b>—improve the customer experience on their own.<\/li><\/ul><p>Multiple companies target this space, each covering a different segment of the problem, with live transcription and lookup-style assist already useful today and some end-to-end automation starting to appear. The pattern generalizes: high-volume, lookup-heavy workflows with cheap feedback are the easiest to delegate to LLM agents.<\/p>","terms":["knowledge assist","smart replies","transcription","call summary"]},"zh":{"title":"客户支持 agents","problem":"客户支持是高频、吃力不讨好的工作，且该领域涵盖许多子任务，很难用单一系统覆盖。","why":"支持工作很大部分是查找和摘要而非深度推理，因此 LLM 可以提供实时知识和草稿，减轻 agent 的认知负担。","how":"部署聚焦的能力：实时转录、从数据库找出相关文章的 knowledge assist、smart reply 草拟，以及通话摘要；某些细分正在走向端到端自动化。","detail":"<p>客户支持被称为最普遍的 agent 应用之一。提到的具体 LLM 能力：<\/p><ul><li><b>Live transcription<\/b>——给出干净的交互记录（现在在会议中也很常见）。<\/li><li><b>Knowledge assist<\/b>——支持 agent 不必什么都知道；向 LLM 求解并找出相关文章，“比只有像索引一样的搜索更好”。<\/li><li><b>Smart replies<\/b>——agents 草拟聊天回复。<\/li><li><b>Call summaries<\/b>——本身就改善了客户体验。<\/li><\/ul><p>多家公司瞄准这一领域，各自覆盖问题的不同细分，其中实时转录和查找式 assist 今天已很有用，一些端到端自动化也开始出现。这个模式可推广：高频、以查找为主、反馈廉价的工作流最容易委托给 LLM agents。<\/p>","terms":["knowledge assist","smart replies","transcription","call summary"]}},{"t":3359,"figs":[{"t":3370,"file":"slides/part01/slide_084.jpg"}],"en":{"title":"Deep research agents","problem":"Comprehensive reports used to require a manual literature review: read and summarize each paper, then synthesize them.","why":"The multi-step research process—identify references, judge relevance, summarize, combine—is decomposable, so an agent can automate the pipeline.","how":"Give the agent a topic; it identifies references to consult, builds an outline, summarizes relevant content from each, and combines them into a full-length article—one of the homework assignments.","detail":"<p>For complex topics, agents can produce comprehensive reports that previously required a full literature review.<\/p><ul><li>Pipeline: identify which <b>references<\/b> to look at → construct an <b>outline<\/b> judging relevance → <b>summarize<\/b> each reference's relevant content → <b>combine<\/b> into a full-length article.<\/li><li>Example prompt: \"2022 Winter Olympics opening ceremony.\"<\/li><li>The results are \"very impressive in certain cases\"; students will try it in one of the homeworks, which makes this one of the more directly testable agent capabilities in the course.<\/li><li>Mechanistically it is a fan-out/fan-in pattern: parallel retrieval and summarization, then aggregation—similar to the parallelization orchestration primitive discussed earlier. The quality bottleneck is reference relevance and faithful summarization, not text generation.<\/li><\/ul>","terms":["deep research","literature review","outline","summarization"]},"zh":{"title":"Deep research agents","problem":"全面的报告过去需要人工文献综述：阅读并总结每篇论文，再进行综合。","why":"多步研究过程——确定参考文献、判断相关性、总结、组合——是可分解的，因此 agent 可以让这条 pipeline 自动化。","how":"给 agent 一个主题；它确定要查阅的参考文献、构建大纲、总结每篇的相关内容，并组合成一篇完整文章——这是作业之一。","detail":"<p>对复杂主题，agents 可以产出以前需要完整文献综述才能得到的全面报告。<\/p><ul><li>Pipeline：确定要看哪些 <b>references<\/b> → 构建判断相关性的 <b>outline<\/b> → <b>summarize<\/b> 每篇的相关内容 → <b>combine<\/b> 成一篇完整文章。<\/li><li>示例 prompt：“2022 Winter Olympics opening ceremony”。<\/li><li>结果“在某些情况下非常令人印象深刻”；学生将在某次作业中尝试它，这使它成为课程中较可直接测试的 agent 能力之一。<\/li><li>机制上这是一个 fan-out/fan-in 模式：并行检索与总结，再聚合——类似之前讨论的 parallelization 编排原语。质量瓶颈是参考文献相关性和忠实摘要，而非文本生成。<\/li><\/ul>","terms":["deep research","literature review","outline","summarization"]}},{"t":3409,"figs":[{"t":3411,"file":"slides/part01/slide_086.jpg"},{"t":3457,"file":"slides/part01/slide_087.jpg"}],"en":{"title":"AI scientists","problem":"Scientific discovery is open-ended and expensive; researchers need help generating ideas and iterating on experiments.","why":"LLMs can act as broad brainstorming engines that combine knowledge from the web, potentially proposing ideas outside an individual researcher's frame.","how":"Use agents across the research lifecycle—idea generation, experiment iteration, and paper write-up—as in the AI Scientist paper.","detail":"<p>A forward-looking direction: using research agents as <b>AI scientists<\/b> to assist with math and science problems.<\/p><ul><li><b>Idea generation<\/b>: the LLM brainstorms hypotheses.<\/li><li><b>Experiment iteration<\/b>: it helps iterate on the experiments you want to run (from the <b>AI Scientist<\/b> paper).<\/li><li><b>Paper write-up<\/b>: it helps improve the write-up itself.<\/li><li>Even though these models <b>hallucinate<\/b>, their ability to generate many ideas—drawing on reading the web—can surface out-of-the-box directions a long-time researcher or someone who only took courses might miss, making them valuable brainstorming partners.<\/li><li>The trade-off is explicit: creativity/diversity is valuable precisely <i>because<\/i> generation is cheap, but hallucination means outputs must be filtered—again pushing the bottleneck onto verification and human judgment.<\/li><\/ul>","terms":["AI Scientist","idea generation","experiment iteration","hallucination"]},"zh":{"title":"AI scientists","problem":"科学发现是开放式且昂贵的；研究者需要帮助来产生想法并迭代实验。","why":"LLM 可以作为广泛的头脑风暴引擎，结合网络上的知识，可能提出超出单个研究者框架的想法。","how":"在整个研究生命周期中使用 agents——想法生成、实验迭代和论文写作——如 AI Scientist 论文所示。","detail":"<p>一个前瞻方向：把研究 agents 用作 <b>AI scientists<\/b> 来协助数学和科学问题。<\/p><ul><li><b>Idea generation<\/b>：LLM 头脑风暴假设。<\/li><li><b>Experiment iteration<\/b>：它帮助迭代你想做的实验（来自 <b>AI Scientist<\/b> 论文）。<\/li><li><b>Paper write-up<\/b>：它帮助改进写作本身。<\/li><li>尽管这些模型会 <b>hallucinate<\/b>，但它们生成大量想法的能力——借助阅读网络——可以提出资深研究者或只上过课的人可能遗漏的另辟蹊径的方向，使它们成为有价值的头脑风暴伙伴。<\/li><li>权衡很明确：创造力/多样性之所以有价值，恰恰<i>因为<\/i>生成廉价，但 hallucination 意味着输出必须被筛选——再次把瓶颈推到验证和人类判断上。<\/li><\/ul>","terms":["AI Scientist","idea generation","experiment iteration","hallucination"]}},{"t":3485,"figs":[{"t":3646,"file":"slides/part01/slide_096.jpg"}],"en":{"title":"Course topics and guest lectures","problem":"Students need to understand the scope of the course and what distinguishes this offering from the previous one.","why":"The field moves fast, so the syllabus mixes core lectures with guest lectures from frontier labs to keep content current.","how":"A mix of lectures, guest talks (post-training evolution, multimodal agents, robotics), and student project presentations, all organized around the same central theme.","detail":"<p>The course covers a broad list of topics; the <b>overall theme stays the same<\/b> across the quarter. Format:<\/p><ul><li><b>Lectures<\/b> plus <b>guest lectures<\/b> from people at frontier AI labs.<\/li><li>Guest topics include how <b>post-training has evolved<\/b>, and <b>multimodal agents and robotics<\/b>.<\/li><li><b>Project presentations<\/b> by students.<\/li><li>The reading list (papers) is posted on the website; students are expected to read along to build deeper intuition and can base projects on critiquing or improving those papers.<\/li><li>Azalia calls the topic list \"very cool\" and stresses the through-line: planning, multi-step reasoning, and self-improvement are the capabilities that run through every week, tying the guest talks back to the core lectures.<\/li><\/ul>","terms":["guest lectures","post-training","multimodal agents","robotics"]},"zh":{"title":"课程主题与 guest lectures","problem":"学生需要理解课程范围，以及本次开课与上一次有何不同。","why":"该领域发展迅速，因此大纲混合了核心讲座与来自前沿实验室的 guest lectures，以保持内容更新。","how":"讲座、guest talks（post-training 演进、multimodal agents、robotics）与学生项目展示相结合，全部围绕同一核心主题组织。","detail":"<p>课程覆盖广泛的主题列表；<b>总体主题在整个学期保持不变<\/b>。形式：<\/p><ul><li><b>Lectures<\/b> 加上来自前沿 AI 实验室人士的 <b>guest lectures<\/b>。<\/li><li>guest 主题包括 <b>post-training 如何演进<\/b>，以及 <b>multimodal agents 和 robotics<\/b>。<\/li><li>学生进行 <b>project presentations<\/b>。<\/li><li>阅读清单（论文）发布在网站上；学生应同步阅读以建立更深的直觉，并可基于对这些论文的批评或改进来做项目。<\/li><li>Azalia 称主题列表“非常酷”，并强调主线：planning、multi-step reasoning 和 self-improvement 是贯穿每周的能力，把 guest talks 与核心讲座串起来。<\/li><\/ul>","terms":["guest lectures","post-training","multimodal agents","robotics"]}},{"t":3683,"figs":[{"t":3702,"file":"slides/part01/slide_098.jpg"},{"t":3725,"file":"slides/part01/slide_099.jpg"},{"t":3793,"file":"slides/part01/slide_102.jpg"}],"en":{"title":"Course logistics and homeworks","problem":"Grades and deadlines depend on understanding the mechanics, and the course is large this quarter.","why":"Because the class is big, policies must be applied uniformly—no exceptions—so students must plan around deadlines.","how":"Use the website and Canvas for updates; prerequisites, three homeworks this quarter (one more than last offering), a course project, and fixed due dates are posted; lectures are uploaded before class.","detail":"<p>Logistics:<\/p><ul><li>Check prerequisites and register only if comfortable; official updates go through <b>Canvas<\/b>, with an external website for materials.<\/li><li>Lectures are uploaded before each class; all assignment and project due dates are already posted.<\/li><li>This quarter has <b>three homeworks<\/b>—one more than the prior offering—designed with the TAs to help students learn the topics more deeply.<\/li><li>Plus a <b>course project<\/b> where students build agentic systems or design experiments around a research question, with examples/suggestions provided.<\/li><li>Because the class is large this quarter, the instructors say they cannot make exceptions on deadlines, so late days should be used wisely; audits are not allowed and lecture videos will eventually appear on YouTube.<\/li><\/ul>","terms":["Canvas","prerequisites","homeworks","course project"]},"zh":{"title":"课程安排与 homeworks","problem":"成绩和截止日期取决于对机制的理解，而本学期课程规模很大。","why":"由于班级很大，政策必须统一执行——没有例外——因此学生必须围绕截止日期做好规划。","how":"用网站和 Canvas 获取更新；先修要求、本学期三次 homeworks（比上次开课多一次）、一个课程项目，以及固定的截止日期均已发布；讲座在课前上传。","detail":"<p>课程安排：<\/p><ul><li>检查先修要求，只在有把握时注册；官方更新通过 <b>Canvas<\/b>，材料放在外部网站。<\/li><li>每次课前上传讲座；所有作业和项目的截止日期都已发布。<\/li><li>本学期有 <b>三次 homeworks<\/b>——比上次开课多一次——与 TAs 共同设计，帮助学生更深入地学习主题。<\/li><li>外加一个 <b>course project<\/b>，学生围绕研究问题构建 agentic systems 或设计实验，会提供示例/建议。<\/li><li>由于本学期班级很大，讲师表示不能在截止日期上破例，因此 late days 应明智使用；不允许 audit，讲座视频最终会出现在 YouTube 上。<\/li><\/ul>","terms":["Canvas","prerequisites","homeworks","course project"]}},{"t":3794,"figs":[{"t":3793,"file":"slides/part01/slide_102.jpg"},{"t":3836,"file":"slides/part01/slide_103.jpg"},{"t":3849,"file":"slides/part01/slide_105.jpg"}],"en":{"title":"Course project, milestones, and grading","problem":"Students must scope a research-grade project and manage milestones rather than build a demo.","why":"The course values research contribution (hypothesis, question, measurable improvement), so negative examples like a survey or a plain app do not qualify.","how":"Do researchy work: a new eval dataset/benchmark, a reliability study of an existing agentic system, or hill-climbing an existing benchmark; deliver a proposal, midterm progress, a final report, and a poster.","detail":"<p>Project mechanics and expectations:<\/p><ul><li>Work in teams of <b>2–4<\/b> (solo possible); more teammates means more pooled <b>API credits<\/b> for experiments. Successful prior projects are posted on the website.<\/li><li>Acceptable directions: a <b>new evaluation dataset/benchmark<\/b>, a <b>reliability study<\/b> of an existing agentic system, or <b>hill-climbing an existing benchmark<\/b>; you can also build on or critique papers from the course.<\/li><li>Not acceptable: just a <b>survey<\/b> or a <b>demo app<\/b> (\"just live coding\"); the project needs a hypothesis and a measurable improvement or property analysis.<\/li><li>Milestones: project proposal (~early October), midterm presentation with real progress, final report, and poster session <b>December 12, 4–6 pm<\/b> with industry guests.<\/li><li>Grading: <b>50% homeworks / 50% project<\/b>; honor code required.<\/li><li>Office hours on Canvas; ask questions publicly on <b>Ed Stem<\/b>; submit milestones/homeworks via <b>GradeScope<\/b>.<\/li><li>Late policy is on the generous side but has no exceptions due to class size; no audits; lecture videos eventually on YouTube. Prior students published papers from their projects.<\/li><\/ul>","terms":["benchmark","hill climbing","poster session","GradeScope","Ed Stem","honor code"]},"zh":{"title":"课程项目、里程碑与评分","problem":"学生必须界定一个研究级项目并管理里程碑，而不是做一个 demo。","why":"课程看重研究贡献（假设、问题、可衡量的改进），因此像综述或普通应用这样的反面例子不合格。","how":"做有研究性的工作：新的 eval dataset/benchmark、对现有 agentic system 的可靠性研究，或在现有 benchmark 上做 hill climbing；交付 proposal、midterm progress、final report 和 poster。","detail":"<p>项目机制与期望：<\/p><ul><li>以 <b>2–4<\/b> 人组队（也可单人）；队友越多，可汇集越多用于实验的 <b>API credits<\/b>。过往成功项目发布在网站上。<\/li><li>可接受的方向：<b>新的 evaluation dataset/benchmark<\/b>、对现有 agentic system 的 <b>可靠性研究<\/b>，或在现有 benchmark 上做 <b>hill climbing<\/b>；你也可以基于课程论文构建或对其进行批评。<\/li><li>不可接受：只是 <b>survey<\/b> 或 <b>demo app<\/b>（“只是 live coding”）；项目需要假设和可衡量的改进或性质分析。<\/li><li>里程碑：项目 proposal（约十月初）、展示真实进展的 midterm presentation、final report，以及 <b>12 月 12 日下午 4–6 点<\/b> 有业界来宾的 poster session。<\/li><li>评分：<b>50% homeworks / 50% project<\/b>；需要遵守 honor code。<\/li><li>Office hours 在 Canvas；在 <b>Ed Stem<\/b> 公开提问；通过 <b>GradeScope<\/b> 提交里程碑/作业。<\/li><li>Late policy 较为宽松，但因班级规模没有例外；不允许 audit；讲座视频最终会上 YouTube。过往学生曾把项目成果发表成论文。<\/li><\/ul>","terms":["benchmark","hill climbing","poster session","GradeScope","Ed Stem","honor code"]}}]},{"n":2,"id":"-Ggc37xLj_Y","duration":3797,"slideCount":42,"en":{"title":"Test-Time Compute Scaling","summary":"The lecture treats inference as a first-class scaling axis. It starts from the Large Language Monkeys paradigm — repeated sampling plus an automated verifier, which lets weak open models beat frontier proprietary ones — and derives an inference scaling law in which coverage follows a power law in the number of samples, valid only when the task distribution has a long tail of hard problems. It then isolates the generation-verification gap: majority voting and reward-model selectors plateau far below oracle coverage, and the gap widens on harder data. After a survey of verification mechanisms (formal proofs, unit tests, compilers) and class discussion of open directions, it covers the Scaling Test-Time Compute Optimally paper — parallel sampling vs sequential revisions, ORMs vs PRMs, PRM-guided beam search, and difficulty-binned allocation. It closes with Archon/ITAS, which searches over compositions of models and prompt-based inference operators (generation, fusion, critic, ranker, verifier, unit tests) to maximize pass@1 under an inference-call budget, matching closed frontier models with open-source ones by an average of +14.1%."},"zh":{"title":"Test-Time Compute Scaling","summary":"本讲将推理视为与训练并列的一等扩展维度。首先从 Large Language Monkeys 范式出发——重复
