案是肯定的，验证器的 test-time scaling 会在后面的幻灯片中讲到。<\/li><li>设计教训：在大量样本时，限制准确率的是验证器的“锐度”，而不是生成器的覆盖率。<\/li><\/ul>","terms":["精度","排序","覆盖率","验证器扩展"]}},{"t":1240,"figs":[],"en":{"title":"Paper 1 discussion: crossover and keeping the generator general","problem":"Do fine-tuning and verification curves cross again at very large data, and what is the practical benefit of a verifier.","why":"Clarifies when a verifier is preferable to customizing the generator.","how":"Conceptual comparison of data regimes and of what each approach modifies.","detail":"<p>Asked whether the two curves cross again with much more data, the lecturer expects that with a huge amount of data fine-tuning and verification would converge to similar performance. The decisive advantage of a verifier is therefore more than a small accuracy delta.<\/p><ul><li>The verifier leaves the base generator untouched, so it does not overfit the generator to a single dataset or task.<\/li><li>The base generator stays general, and the verifier can then guide it at inference without retraining the model.<\/li><li>This separation is what makes verifiers reusable across tasks and ports cleanly into the later ensemble and RL approaches.<\/li><\/ul>","terms":["generalization","verifier","base model","supervised fine-tuning"]},"zh":{"title":"论文 1 讨论：曲线交叉与保持生成器的通用性","problem":"在数据极大时，微调与验证的曲线是否会再次交叉，以及验证器的实际收益是什么。","why":"阐明了何时验证器比定制生成器更可取。","how":"从概念上比较不同的数据规模区间，以及每种方法所修改的对象。","detail":"<p>当被问到数据更多时两条曲线是否会再次交叉，讲师认为在数据量极大时，微调与验证会收敛到相近的性能。因此验证器的决定性优势不仅仅是小幅的准确率差。<\/p><ul><li>验证器让基础生成器保持不动，因此不会让生成器过拟合到单一数据集或任务上。<\/li><li>基础生成器保持通用，验证器随后可以在推理时引导它，而无需重新训练模型。<\/li><li>正是这种分离，使验证器可以跨任务复用，并干净地迁移到后续的集成方法与 RL 方法中。<\/li><\/ul>","terms":["泛化","验证器","基础模型","有监督微调"]}},{"t":1285,"figs":[{"t":1290,"file":"slides/part03/slide_020.jpg"},{"t":1335,"file":"slides/part03/slide_021.jpg"}],"en":{"title":"Paper 2: Let's Verify Step by Step - outcome vs process supervision","problem":"A single wrong step early in a chain of thought can derail the whole answer, but outcome supervision only observes the final result.","why":"The error location is the information needed; outcome labels provide no credit assignment across steps.","how":"Introduce outcome-based reward models (ORM) and process-based reward models (PRM).","detail":"<p>Paper 2, also from OpenAI and less than two years after the first, starts from the same persistent problem - LLMs hallucinate and stay wrong even as they improve - but focuses on step-by-step reasoning: one wrong early step can corrupt the whole final answer. It frames two reward-modeling approaches.<\/p><ul><li>Outcome-based reward model (ORM): assigns one reward to the entire solution based on whether the final answer is correct, exactly as in the previous paper.<\/li><li>Process-based reward model (PRM): assigns a distinct reward per step of the solution, giving a denser and more localized signal for credit assignment.<\/li><li>This outcome-versus-process dichotomy organizes the rest of the lecture and recurs in later papers.<\/li><\/ul>","terms":["outcome reward model","process reward model","credit assignment","chain of thought"]},"zh":{"title":"论文 2：Let's Verify Step by Step——结果监督 vs 过程监督","problem":"思维链中早期的一个错误步骤就可能让整个答案跑偏，但结果监督只观察最终结果。","why":"真正需要的信息是错误的位置；结果标签无法在步骤之间提供 credit assignment。","how":"引入基于结果的奖励模型（ORM）和基于过程的奖励模型（PRM）。","detail":"<p>论文 2 同样来自 OpenAI，距离第一篇不到两年，出发点仍是同一个长期问题——LLM 会产生幻觉，即使不断改进也仍然出错——但聚焦于逐步推理：早期的一个错误步骤就可能破坏整个最终答案。它提出两种奖励建模思路。<\/p><ul><li>基于结果的奖励模型（ORM）：根据最终答案是否正确，为整个解答分配一个奖励，与前一篇论文完全一致。<\/li><li>基于过程的奖励模型（PRM）：为解答的每一步分配一个独立的奖励，从而提供更稠密、更局部化的 credit assignment 信号。<\/li><li>这种结果与过程的二分法组织了本讲的其余内容，并在后续论文中反复出现。<\/li><\/ul>","terms":["结果奖励模型","过程奖励模型","credit assignment","思维链"]}},{"t":1356,"figs":[{"t":1371,"file":"slides/part03/slide_024.jpg"}],"en":{"title":"Training ORM vs PRM: human step labels and reward products","problem":"PRM training requires per-step correctness labels, which do not exist for free.","why":"Human annotators can judge whether each step is correct given the preceding steps, enabling precise process supervision.","how":"Get one solution per problem, have annotators label each step, and define the final reward as the product of step rewards.","detail":"<p>For a math problem the generator produces one solution with steps 1..n, and the ground truth fixes whether the final answer is correct. ORM stops there: the label is final correctness. PRM goes further.<\/p><ul><li>Human annotators review each model step and assign correct/incorrect (plus neutral in practice) labels, building a stepwise dataset.<\/li><li>The final stepwise reward can be computed as the product of the per-step rewards; the paper trains against these annotations.<\/li><li>Because the generator can be prompted to emit explicit steps, the PRM can be run per step and multiplied to score and then accept or retry an answer.<\/li><li>This is process supervision, with explicit credit assignment and more precise labels than final-answer-only.<\/li><\/ul>","terms":["process supervision","step labels","product of step rewards","credit assignment","annotators"]},"zh":{"title":"训练 ORM vs PRM：人工步骤标签与奖励乘积","problem":"PRM 训练需要每一步的正确性标签，而这些标签并非免费可得。","why":"人工标注者可以在给定前序步骤的情况下判断每一步是否正确，从而实现精确的过程监督。","how":"为每道题获取一个解答，让标注者标注每一步，并将最终奖励定义为各步骤奖励的乘积。","detail":"<p>对于一道数学题，生成器产生一个包含步骤 1..n 的解答，而 ground truth 决定了最终答案是否正确。ORM 到此为止：标签就是最终正确性。PRM 则更进一步。<\/p><ul><li>人工标注者审查模型的每一步，并分配正确/错误（实践中还有中性）标签，从而构建逐步数据集。<\/li><li>最终的逐步奖励可以按各步骤奖励的乘积来计算；论文依据这些标注进行训练。<\/li><li>由于可以提示生成器输出显式步骤，PRM 能逐步运行并相乘，用来打分，进而接受或重试某个答案。<\/li><li>这就是过程监督，具有显式的 credit assignment，以及比仅用最终答案更精确的标签。<\/li><\/ul>","terms":["过程监督","步骤标签","步骤奖励乘积","credit assignment","标注者"]}},{"t":1506,"figs":[{"t":1534,"file":"slides/part03/slide_025.jpg"},{"t":1637,"file":"slides/part03/slide_026.jpg"},{"t":1685,"file":"slides/part03/slide_033.jpg"}],"en":{"title":"Why process supervision: false positives, interpretability, PRM800K","problem":"Outcome supervision can reward a solution with wrong reasoning that happens to end at the right answer.","why":"Supervising every step suppresses this failure mode and yields human-endorsed, interpretable reasoning.","how":"Collect high-quality step labels, prioritizing cases that expose the failure mode, and release the dataset.","detail":"<p>The key property is that process supervision manages false positives far better than outcome supervision. Models surprisingly often hallucinate a path and still reach a correct final answer; with only the final answer as signal, that wrong process is reinforced.<\/p><ul><li>Because every step is scored, it is less likely to land in the mode where steps are wrong but the final answer is right, and it encourages interpretable, human-endorsed reasoning.<\/li><li>The paper released PRM800K, an open-source dataset of roughly 800K step-level labels.<\/li><li>To collect it efficiently they generated many stepwise samples and prioritized <em>convincing wrong<\/em> answers - correct final answer but incorrect intermediate steps - making annotation 2.6x more data efficient than random selection.<\/li><li>The loop was iterative: collect labels, train a PRM, use it to surface harder samples, and improve data quality. Labels were positive, negative, or neutral; e.g. a final step giving x=7 instead of 15/14 is incorrect.<\/li><\/ul>","terms":["PRM800K","convincing wrong answers","false positive","active learning","neutral label"]},"zh":{"title":"为何需要过程监督：假阳性、可解释性、PRM800K","problem":"结果监督可能奖励那种推理错误、却碰巧得出正确答案的解答。","why":"对每一步都进行监督可以抑制这种失败模式，并产生被人工认可、可解释的推理。","how":"收集高质量的步骤标签，优先选择能暴露该失败模式的样本，并发布该数据集。","detail":"<p>关键特性在于，过程监督对假阳性的处理远好于结果监督。模型出人意料地常常产生幻觉路径，却仍然得到正确的最终答案；在只有最终答案作为信号时，这种错误的推理过程会被强化。<\/p><ul><li>由于每一步都被打分，它就不太容易落入“步骤错误但最终答案正确”的模式，并鼓励可解释、被人工认可的推理。<\/li><li>论文发布了 PRM800K，一个约 80 万条步骤级标签的开源数据集。<\/li><li>为高效收集，他们生成大量逐步样本，并优先选择<em>有说服力的错误<\/em>答案——最终答案正确但中间步骤错误——使标注的数据效率比随机选择高 2.6 倍。<\/li><li>该循环是迭代式的：收集标签，训练 PRM，用它挖掘更难的样本，并提升数据质量。标签分为正、负或中性；例如最后一步给出 x=7 而非 15/14 即为错误。<\/li><\/ul>","terms":["PRM800K","有说服力的错误答案","假阳性","主动学习","中性标签"]}},{"t":1709,"figs":[{"t":1712,"file":"slides/part03/slide_028.jpg"}],"en":{"title":"ORM/PRM training setup and scoring conventions","problem":"The two reward models need concrete scoring rules that affect selection.","why":"Scoring conventions must match how the reward is aggregated at test time.","how":"Fine-tune GPT-4 for both, then train ORM and PRM on their respective label types.","detail":"<p>Both reward models used GPT-4 as the base and were fine-tuned on this data, with supervised fine-tuning first; this mirrors Paper 1's two-stage recipe. The training pairs, however, differ by supervision type.<\/p><ul><li>ORM: pairs of generated sample and final correctness; the score is the final token score of the completion, i.e. the token-level convention from Paper 1.<\/li><li>PRM: generated sample plus stepwise correctness labels; the score is the product of per-step probabilities.<\/li><li>The convention matters because it determines how a single scalar is produced from either one label (outcome) or many (process).<\/li><li>Test-time selection then picks the highest-scoring candidate under whichever convention was trained.<\/li><\/ul>","terms":["GPT-4","final token score","product of probabilities","supervised fine-tuning"]},"zh":{"title":"ORM/PRM 训练设置与打分约定","problem":"两种奖励模型都需要具体的打分规则，而这些规则会影响选择。","why":"打分约定必须与测试时奖励的聚合方式相匹配。","how":"为两者微调 GPT-4，然后分别在各自的标签类型上训练 ORM 和 PRM。","detail":"<p>两种奖励模型都以 GPT-4 为基础，并在这些数据上微调，先做有监督微调；这呼应了论文 1 的两阶段配方。但训练对因监督类型而异。<\/p><ul><li>ORM：生成的样本与最终正确性构成的对；得分是 completion 的 final token 得分，即论文 1 中的 token 级约定。<\/li><li>PRM：生成的样本加上逐步正确性标签；得分是各步骤概率的乘积。<\/li><li>这一约定很重要，因为它决定了如何从单个标签（结果）或多个标签（过程）产生一个标量。<\/li><li>测试时的选择随后按所训练的约定，挑选得分最高的候选。<\/li><\/ul>","terms":["GPT-4","final token 得分","概率乘积","有监督微调"]}},{"t":1765,"figs":[{"t":1796,"file":"slides/part03/slide_029.jpg"},{"t":1808,"file":"slides/part03/slide_030.jpg"}],"en":{"title":"Results: PRM beats ORM and majority voting","problem":"Quantify whether process supervision improves selection on math.","why":"Benchmarks with n samples per problem reveal the selector quality.","how":"Compare PRM, ORM, and majority voting across sample counts.","detail":"<p>PRM outperforms both ORM and majority voting. With n the number of solutions per problem, majority voting again fails after roughly 100 samples; ORM (blue) improves over it, and PRM (orange) is best.<\/p><ul><li>PRM detects correct solutions in rare cases: problems whose sample distribution has less than 5% correct answers, where voting cannot find the signal.<\/li><li>Both PRM and ORM benefit from more labels, but PRM is more sample efficient. Roughly, 100 labeled solutions per problem for ORM is comparable to about one solution per problem for PRM, because each PRM label covers many steps.<\/li><li>The paper credits larger data and its active-learning collection for these gains.<\/li><\/ul>","terms":["sample efficiency","majority voting","ORM","PRM","rare correct answers"]},"zh":{"title":"结果：PRM 优于 ORM 与多数投票","problem":"量化过程监督是否能在数学上改进选择。","why":"每道题有 n 个样本的基准能揭示选择器的质量。","how":"在不同样本数下比较 PRM、ORM 与多数投票。","detail":"<p>PRM 优于 ORM 和多数投票。设 n 为每道题的解答数，多数投票再次在约 100 个样本后失效；ORM（蓝色）优于它，而 PRM（橙色）最好。<\/p><ul><li>PRM 能在罕见情形下发现正确解答：即在样本分布中正确答案占比不足 5% 的题目上，投票无法找到信号。<\/li><li>PRM 和 ORM 都能从更多标签中获益，但 PRM 的样本效率更高。大致上，ORM 每道题 100 个带标签解答的效果，相当于 PRM 每道题约 1 个解答，因为每个 PRM 标签覆盖许多步骤。<\/li><li>论文将这些增益归功于更大的数据量及其主动学习式收集。<\/li><\/ul>","terms":["样本效率","多数投票","ORM","PRM","罕见正确答案"]}},{"t":1859,"figs":[{"t":1894,"file":"slides/part03/slide_031.jpg"}],"en":{"title":"Generalization: distribution shift and new domains","problem":"A verifier must transfer to unseen datasets and domains, not just the training distribution.","why":"Deployment robustness depends on tolerating distribution shift.","how":"Evaluate the selectors on new domains and datasets.","detail":"<p>Generalizability to new domains and datasets is highlighted as a first-class target for verifier and reward-model design, not just in-distribution accuracy.<\/p><ul><li>Majority voting generalizes better than ORM, meaning outcome reward models can overfit the training distribution.<\/li><li>PRM is better than majority voting overall and tolerates substantially more distribution shift.<\/li><li>Combined with the accuracy and sample-efficiency gains, PRM is presented as the stronger approach at this point in the lecture.<\/li><li>Later papers revisit the same theme, reporting gains on harder benchmarks such as MATH and GPQA relative to GSM8K.<\/li><li>The lecture frames this as a design objective for anyone building reward models for deployment.<\/li><\/ul>","terms":["distribution shift","generalization","out-of-domain","ORM","PRM"]},"zh":{"title":"泛化：distribution shift 与新领域","problem":"验证器必须能迁移到未见过的数据集与领域，而不仅是训练分布。","why":"部署时的鲁棒性取决于对 distribution shift 的容忍度。","how":"在新领域和新数据集上评测这些选择器。","detail":"<p>对新领域和新数据集的泛化能力被强调为验证器与奖励模型设计的一等目标，而不只是分布内准确率。<\/p><ul><li>多数投票比 ORM 泛化得更好，这意味着结果奖励模型会过拟合训练分布。<\/li><li>PRM 总体上优于多数投票，并能容忍明显更多的 distribution shift。<\/li><li>结合准确率与样本效率上的增益，在本讲此处 PRM 被视为更强的方法。<\/li><li>后续论文重温了同一主题，报告了在 MATH、GPQA 等比 GSM8K 更难的基准上的增益。<\/li><li>课程将这一点框定为所有为部署而构建奖励模型的人都应关注的设计目标。<\/li><\/ul>","terms":["distribution shift","泛化","域外","ORM","PRM"]}},{"t":1907,"figs":[],"en":{"title":"Paper 2 discussion: PRM risks, PRM+ORM, threshold cost","problem":"PRM can assign false credit when a step looks locally plausible but does not contribute to the final answer.","why":"The reward is a proxy, so optimizing it can diverge from final-answer correctness.","how":"Discuss combining PRM and ORM and the extra hyperparameter PRM introduces.","detail":"<p>Asked whether PRM can ever hurt, the lecturer confirms that a step can look locally good yet not contribute to the correct final answer, i.e. false credit assignment. The mitigation is hybridization.<\/p><ul><li>Many newer approaches combine PRM-based and ORM-based selection to capture the precision of process rewards and the reliability of outcome rewards.<\/li><li>PRM also introduces a threshold that must be tuned to decide when to accept or retry an answer.<\/li><li>That threshold is an additional system hyperparameter and a source of complexity compared with outcome-only scoring.<\/li><li>Trade-off: process supervision is more data-efficient and precise but not free.<\/li><li>Net effect: PRM is preferred but usually wrapped with an outcome signal and tuned thresholds.<\/li><\/ul>","terms":["false credit assignment","PRM+ORM","threshold","hyperparameter"]},"zh":{"title":"论文 2 讨论：PRM 风险、PRM+ORM、阈值成本","problem":"当某一步在局部看似合理、却对最终答案没有贡献时，PRM 可能给出错误的 credit。","why":"奖励只是一个代理指标，因此优化它可能与最终答案的正确性发生偏离。","how":"讨论结合 PRM 与 ORM，以及 PRM 引入的额外超参数。","detail":"<p>当被问到 PRM 是否会带来损害时，讲师确认某一步可以局部看起来很好，却对正确的最终答案没有贡献，即错误的 credit assignment。缓解办法是混合化。<\/p><ul><li>许多较新的方法结合基于 PRM 与基于 ORM 的选择，以兼取过程奖励的精度与结果奖励的可靠性。<\/li><li>PRM 还引入了一个阈值，必须调参以决定何时接受或重试某个答案。<\/li><li>与仅用结果的打分相比，该阈值是一个额外的系统超参数，也是复杂性的来源。<\/li><li>权衡：过程监督更省数据、更精确，但并非没有代价。<\/li><li>净效果：PRM 更受青睐，但通常要与结果信号和调好的阈值配合使用。<\/li><\/ul>","terms":["错误的 credit assignment","PRM+ORM","阈值","超参数"]}},{"t":1961,"figs":[],"en":{"title":"Paper 2 discussion: label costs, majority voting, reward hacking","problem":"PRM requires K times the number of steps in labels, and optimizing a generator against a PRM may be gamed by skipping reasoning.","why":"Cost and validity determine whether PRM is practical, and generator-side use changes the failure modes.","how":"Compare label budgets, define majority voting, and rely on human labels plus prompting to prevent shortcuts.","detail":"<p>The lecturer notes the comparison is hard: ORM needs K labels per problem while PRM needs K times the number of steps, and the number of steps is hard to control, though the paper tried to match budgets.<\/p><ul><li>Majority voting in this context means taking the final answer repeated most often, with no reward model and no view of the reasoning process.<\/li><li>A student asks about hacking: a solution could declare x directly and skip intermediate step scores. The PRM sees the question, previous steps, and current step, but does not by itself force step-by-step generation; the generator is unchanged and can be prompted to reason.<\/li><li>If the PRM is instead used to fine-tune the generator, care is needed so the chain of thought stays sensible; human step labels would score reasoning-skipping steps low.<\/li><li>The lecture assumes human labels here and notes the next paper removes that assumption.<\/li><\/ul>","terms":["label budget","majority voting","reward hacking","generator fine-tuning"]},"zh":{"title":"论文 2 讨论：标签成本、多数投票、reward hacking","problem":"PRM 需要的标签量是步骤数的 K 倍，而针对 PRM 优化生成器可能被“跳过推理”钻空子。","why":"成本与有效性决定了 PRM 是否实用，而生成器侧的使用会改变失败模式。","how":"比较标签预算，定义多数投票，并依靠人工标签加上提示来防止走捷径。","detail":"<p>讲师指出这一比较很难：ORM 每道题需要 K 个标签，而 PRM 需要 K 乘以步骤数，且步骤数难以控制，尽管论文尝试让两者的预算相匹配。<\/p><ul><li>这里的多数投票指的是取重复次数最多的最终答案，不使用奖励模型，也不考虑推理过程。<\/li><li>有学生问到 reward hacking：一个解答可以直接给出 x，从而跳过中间步骤的得分。PRM 看到问题、先前步骤和当前步骤，但它本身并不强制逐步生成；生成器未被改动，并且可以被提示去推理。<\/li><li>如果反过来用 PRM 微调生成器，就需要小心让思维链保持合理；人工步骤标签会把跳过推理的步骤打低分。<\/li><li>本讲在此假设有人工标签，并指出下一篇论文将去掉这一假设。<\/li><\/ul>","terms":["标签预算","多数投票","reward hacking","生成器微调"]}},{"t":2268,"figs":[{"t":2276,"file":"slides/part03/slide_035.jpg"},{"t":2286,"file":"slides/part03/slide_036.jpg"},{"t":2326,"file":"slides/part03/slide_037.jpg"}],"en":{"title":"Paper 3: Math-Shepherd - verification without human annotation","problem":"PRMs are data-hungry and human step annotation is expensive to scale.","why":"Automating step-quality labels while also feeding the verifier back into generator optimization via RL would remove the bottleneck.","how":"Define automatic annotation and combine it with RL against the learned reward model.","detail":"<p>Math-Shepherd, subtitled verify and reinforce step by step without human annotation, starts from the observation that stronger verifiers improve reasoning behavior, especially when combined with test-time scaling, and that PRMs show more potential than ORMs but require a large amount of hard-to-collect data.<\/p><ul><li>Goal: automate the collection of step-level labels so verifier quality can scale with compute instead of human annotator hours.<\/li><li>Second contribution: bring the learned reward model into the generator optimization loop via reinforcement learning.<\/li><li>This directly addresses the data bottleneck identified as the main weakness of process supervision in Paper 2.<\/li><li>The paper also covers how the PRM can be used both to select answers and to reinforce the generator.<\/li><\/ul>","terms":["Math-Shepherd","automatic annotation","reinforcement learning","reward model"]},"zh":{"title":"论文 3：Math-Shepherd——无需人工标注的验证","problem":"PRM 对数据需求量大，而人工步骤标注难以规模化，成本高昂。","why":"将步骤质量标签自动化，同时通过 RL 把验证器反馈回生成器优化，就能消除这一瓶颈。","how":"定义自动标注，并将其与针对所学奖励模型的 RL 结合。","detail":"<p>Math-Shepherd 的副标题是“无需人工标注、逐步验证与强化”，它始于这样一个观察：更强的验证器能改善推理行为，尤其是与 test-time scaling 结合时；而 PRM 比 ORM 更有潜力，却需要大量难以收集的数据。<\/p><ul><li>目标：将步骤级标签的收集自动化，使验证器质量能够随算力而非人工标注工时扩展。<\/li><li>第二项贡献：通过强化学习把所学奖励模型带入生成器的优化循环。<\/li><li>这直接针对论文 2 中识别出的、过程监督的主要弱点——数据瓶颈。<\/li><li>论文还涵盖了如何将 PRM 既用于选择答案，又用于强化生成器。<\/li><\/ul>","terms":["Math-Shepherd","自动标注","强化学习","奖励模型"]}},{"t":2343,"figs":[{"t":2349,"file":"slides/part03/slide_039.jpg"}],"en":{"title":"Hard vs soft estimation of step quality","problem":"Without humans, how is a step labeled as good.","why":"A step is valuable if it can still lead to the correct final answer, which can be estimated by rolling out completions.","how":"Sample n completions from the current step and measure how often they reach a correct final answer.","detail":"<p>The quality of a reasoning step is defined as its <em>potential<\/em> to reach the final correct answer. From a given step, the method samples n completions and observes whether they end correctly.<\/p><ul><li>Hard estimate: the step is labeled success if <em>any<\/em> of the n generations after it reaches the correct final answer; a binary label.<\/li><li>Soft estimate: the fraction of those n generations that reach the correct final answer; a frequency in [0,1].<\/li><li>Example with n=3: for step one, hard estimate = 1 while soft estimate = 2/3.<\/li><li>This replaces human annotation with rollout statistics, at the cost of generation compute.<\/li><\/ul>","terms":["hard estimate","soft estimate","rollout","step potential","automatic labeling"]},"zh":{"title":"步骤质量的 hard vs soft 估计","problem":"在没有人工的情况下，如何标注某一步为好。","why":"如果某一步仍能导向正确的最终答案，它就是有价值的，这可以通过 rollout completion 来估计。","how":"从当前步骤采样 n 个 completion，并测量它们达到正确最终答案的频率。","detail":"<p>一个推理步骤的质量被定义为其达到最终正确答案的<em>潜力<\/em>。从给定的一步出发，该方法采样 n 个 completion，并观察它们是否以正确结果结束。<\/p><ul><li>Hard 估计：如果其后的 n 个生成中<em>存在任何一个<\/em>达到正确的最终答案，该步骤就标为成功；这是一个二元标签。<\/li><li>Soft 估计：这 n 个生成中达到正确最终答案的比例；即 [0,1] 区间内的频率。<\/li><li>以 n=3 为例：对第 1 步，hard 估计 = 1，而 soft 估计 = 2/3。<\/li><li>这用 rollout 统计替代了人工标注，代价是生成算力。<\/li><\/ul>","terms":["hard 估计","soft 估计","rollout","步骤潜力","自动标注"]}},{"t":2445,"figs":[{"t":2447,"file":"slides/part03/slide_040.jpg"}],"en":{"title":"Drawbacks of rollout-based annotation","problem":"Rollout labels are only as good as the samples used to produce them.","why":"Sampling error and the outcome-only view create systematic bias in step labels.","how":"Enumerate the failure modes and the hope that more samples mitigate them.","detail":"<p>Students identify the central weaknesses, and the lecturer confirms both.<\/p><ul><li>Hard problems get no signal: if almost no rollout is correct, a valid step receives score zero. A trajectory that would need n=100 to be found is missed at n=3 and wrongly labeled.<\/li><li>Unpredictable or unusual but valid solution paths can be scored low simply because few rollouts followed them.<\/li><li>Wrong middle steps can still reach a correct final answer, so those steps get labeled correct; the hope is that more samples expose the wrongness in some trajectory, but this is not guaranteed.<\/li><li>Net trade-off: labeling is free of humans but noisy, biased against hard or novel reasoning.<\/li><\/ul>","terms":["sampling error","hard problems","unpredictable paths","bias"]},"zh":{"title":"基于 rollout 的标注的缺陷","problem":"rollout 标签的质量取决于用于生成它们的样本。","why":"采样误差以及仅看结果的视角，会在步骤标签中造成系统性偏差。","how":"列举这些失败模式，以及“更多样本可缓解它们”的期望。","detail":"<p>学生们指出了核心弱点，讲师确认了两点。<\/p><ul><li>难题得不到信号：如果几乎没有 rollout 是正确的，一个有效的步骤就会得到零分。一条需要 n=100 才能被发现的轨迹，在 n=3 时会被漏掉并被错误标注。<\/li><li>不可预测或不寻常但有效的解题路径，可能仅仅因为跟随它的 rollout 很少而被打低分。<\/li><li>错误的中间步骤仍可能达到正确的最终答案，于是这些步骤被标为正确；希望是更多样本能在某条轨迹中暴露出其错误，但这并不保证。<\/li><li>净权衡：标注无需人工，但有噪声，且对困难或新颖的推理存在偏差。<\/li><\/ul>","terms":["采样误差","难题","不可预测的路径","偏差"]}},{"t":2605,"figs":[{"t":2624,"file":"slides/part03/slide_041.jpg"},{"t":2638,"file":"slides/part03/slide_043.jpg"},{"t":2729,"file":"slides/part03/slide_044.jpg"},{"t":2761,"file":"slides/part03/slide_045.jpg"}],"en":{"title":"Verification and RL with the PRM; benchmark results","problem":"How the automatically labeled PRM is used, and whether it matches human-annotated PRMs.","why":"Both selection at test time and generator training need evaluation.","how":"Sample candidate solutions, select the highest PRM score, and separately RL the generator against the PRM.","detail":"<p>At verification time the system samples candidate solutions, scores them with the PRM, and selects the highest-scoring one. The same PRM is also used as a reward model for RL on the generator.<\/p><ul><li>Hard vs soft: as n grew, soft annotations seemed to do better, but with rollout depth n=4 they got their best results anyway, so the choice barely mattered; they used hard estimation because it was easier to measure.<\/li><li>Comparisons: self-consistency / majority voting (red), ORM (blue), and Math-Shepherd PRM (green). The green PRM wins despite using no human annotation, and it outperformed the human-labeled PRM800K.<\/li><li>Gains were larger on MATH, which is harder than GSM8K.<\/li><li>Consistent across LLaMA 70B, LLaMA 34B, and DeepSeek 67B.<\/li><\/ul>","terms":["self-consistency","MATH","PRM800K","hard vs soft","rollout depth"]},"zh":{"title":"使用 PRM 进行验证与 RL；基准结果","problem":"自动标注的 PRM 如何使用，以及它是否比得上人工标注的 PRM。","why":"测试时的选择与生成器训练都需要评测。","how":"采样候选解答，选出 PRM 得分最高者，并另外用 PRM 对生成器做 RL。","detail":"<p>在验证时，系统采样候选解答，用 PRM 为其打分，并选出得分最高者。同一个 PRM 也被用作奖励模型，对生成器做 RL。<\/p><ul><li>Hard vs soft：随着 n 增大，soft 标注似乎表现更好，但在 rollout 深度 n=4 时他们无论如何都取得了最佳结果，因此这一选择影响甚微；他们使用 hard 估计，因为它更易于度量。<\/li><li>对比：self-consistency / 多数投票（红色）、ORM（蓝色）、Math-Shepherd PRM（绿色）。绿色 PRM 即便不使用人工标注也胜出，并且超过了人工标注的 PRM800K。<\/li><li>在比 GSM8K 更难的 MATH 上增益更大。<\/li><li>在 LLaMA 70B、LLaMA 34B 和 DeepSeek 67B 上结果一致。<\/li><\/ul>","terms":["self-consistency","MATH","PRM800K","hard vs soft","rollout 深度"]}},{"t":2789,"figs":[{"t":2828,"file":"slides/part03/slide_046.jpg"},{"t":2860,"file":"slides/part03/slide_051.jpg"}],"en":{"title":"Reinforcing the generator: RL/PPO with PRM reward","problem":"Can the PRM also improve the generator, not just select outputs.","why":"Self-generated annotations plus RL create a self-improvement loop without human labels.","how":"Run PPO on Mistral 7B against the trained PRM and compare with RL against an ORM.","detail":"<p>The paper reinforces the model against the PRM it trained. Using Mistral 7B and PPO with the PRM as reward yields much higher results than RL with an ORM.<\/p><ul><li>The improvement is slightly smaller than the gain from test-time scaling with the same PRM, but it is a distinct, training-time route to better reasoning.<\/li><li>This is multi-level self-improvement: the model generates its own annotations, a PRM is trained on them, and the PRM then improves the generator both at test time and through RL fine-tuning.<\/li><li>Stacking RL, PPO, and verification on top gives further gains, but the lecturer notes the optimizations appear to plateau.<\/li><\/ul>","terms":["PPO","Mistral 7B","self-improvement","RL reward","plateau"]},"zh":{"title":"强化生成器：以 PRM 为奖励的 RL/PPO","problem":"PRM 是否不仅用于选择输出，也能改进生成器。","why":"自生成的标注加上 RL，形成一个无需人工标签的自我改进循环。","how":"在 Mistral 7B 上针对训练好的 PRM 运行 PPO，并与针对 ORM 的 RL 进行比较。","detail":"<p>论文用它训练出的 PRM 来强化模型。使用 Mistral 7B 和以 PRM 为奖励的 PPO，得到的结果远高于用 ORM 做 RL。<\/p><ul><li>这一改进略小于用同一个 PRM 做 test-time scaling 带来的增益，但它是一条独立的、训练时通向更好推理的路径。<\/li><li>这是多层次的自我改进：模型生成自己的标注，在其上训练 PRM，随后 PRM 既在测试时、也通过 RL 微调来改进生成器。<\/li><li>把 RL、PPO 与验证叠加起来会带来进一步增益，但讲师指出这些优化似乎趋于平缓。<\/li><\/ul>","terms":["PPO","Mistral 7B","自我改进","RL 奖励","平缓"]}},{"t":2876,"figs":[],"en":{"title":"Paper 3 discussion: self-correction, compute allocation, decoding","problem":"PRMs as currently defined reward correct steps, so they do not obviously encourage recovering from errors; and comparing these systems fairly is tricky.","why":"Design and evaluation choices materially affect results and reproducibility.","how":"Use rubrics and tools for extra signal, control total inference compute, and keep data sources matched.","detail":"<p>Asked whether PRMs can incentivize self-correction, the lecturer agrees this is desirable and describes ways to add signal: give the scorer a rubric or rules to check each step, and allow tool use such as a calculator or symbolic solver, which can both score and solve more reliably.<\/p><ul><li>Controlling test compute is an open issue: under a fixed budget one can sample more from the generator or more from the verifier, and how to allocate between them is unresolved.<\/li><li>Fair comparison requires ORM and PRM to come from the same data; training data matters a lot.<\/li><li>A question about greedy decoding and temperature: the RL results use greedy decoding, and repeating the whole pipeline (new labels, new verifier) from the PPO model was not tried and would be interesting.<\/li><\/ul>","terms":["self-correction","rubric","tool use","compute allocation","greedy decoding"]},"zh":{"title":"论文 3 讨论：自我纠错、算力分配、解码","problem":"目前定义的 PRM 奖励的是正确的步骤，因此它们并不明显地鼓励从错误中恢复；而且公平地比较这些系统并不容易。","why":"设计与评测选择会实质性地影响结果与可复现性。","how":"使用 rubric 和工具来提供额外信号，控制总推理算力，并让数据来源保持匹配。","detail":"<p>当被问到 PRM 能否激励自我纠错时，讲师认同这是值得追求的目标，并描述了增加信号的方法：给打分器一份 rubric 或规则来检查每一步，并允许使用计算器或符号求解器等工具，这些工具既能让打分更可靠，也能让求解更可靠。<\/p><ul><li>控制测试算力是一个尚未解决的问题：在固定预算下，可以多从生成器采样，或多从验证器取样，而如何在两者之间分配仍未解决。<\/li><li>公平比较要求 ORM 与 PRM 来自相同的数据；训练数据影响很大。<\/li><li>关于 greedy decoding 与 temperature 的问题：RL 结果使用 greedy decoding，而从 PPO 模型出发重复整个流程（新标签、新验证器）并未尝试过，会很有意思。<\/li><\/ul>","terms":["自我纠错","rubric","工具使用","算力分配","greedy decoding"]}},{"t":3107,"figs":[{"t":3118,"file":"slides/part03/slide_053.jpg"},{"t":3150,"file":"slides/part03/slide_054.jpg"}],"en":{"title":"Paper 4: shrinking the gap with weak-verifier ensembles","problem":"The generation-verification gap remains, but training yet another verifier is not the only option.","why":"Existing verifiers can be combined using inference compute to form a stronger selector.","how":"Ensemble many imperfect verifiers, including PRMs, ORMs, and LLM judges.","detail":"<p>This Stanford 2025 paper takes a different approach: rather than training a new verifier, reduce the generation-verification gap with inference compute, specifically by ensembling verifiers. <em>Weak<\/em> here means no verifier is perfect, not that deliberately bad verifiers were chosen - these are the best available.<\/p><ul><li>Weak verifiers correlate with the true correctness label but carry imperfections.<\/li><li>Three categories are considered: PRMs, ORMs, and LLMs used as judges.<\/li><li>An LLM judge can simply be asked whether an answer is correct, or can use tools and rubrics to produce a score.<\/li><li>The ensemble aims to produce one much more capable verifier from many weak ones.<\/li><\/ul>","terms":["weak verifier","ensemble","LLM-as-judge","rubric","inference compute"]},"zh":{"title":"论文 4：用弱验证器集成缩小 gap","problem":"generation-verification gap 依然存在，但再训练一个验证器并非唯一选择。","why":"可以利用推理算力组合现有的验证器，形成一个更强的选择器。","how":"集成许多不完美的验证器，包括 PRM、ORM 和 LLM judge。","detail":"<p>这篇 Stanford 2025 的论文采取了不同的思路：不是训练一个新验证器，而是用推理算力缩小 generation-verification gap，具体做法是集成验证器。这里的<em>弱<\/em>意味着没有哪个验证器是完美的，而非刻意选择糟糕的验证器——这些都是当前最好的。<\/p><ul><li>弱验证器与真实正确性标签相关，但带有不完美之处。<\/li><li>考虑三类：PRM、ORM，以及用作 judge 的 LLM。<\/li><li>可以让 LLM judge 直接判断答案是否正确，也可以让它使用工具和 rubric 来产出得分。<\/li><li>集成的目标是从许多弱验证器中得到一个能力强得多的验证器。<\/li><\/ul>","terms":["弱验证器","集成","LLM-as-judge","rubric","推理算力"]}},{"t":3182,"figs":[{"t":3187,"file":"slides/part03/slide_056.jpg"},{"t":3295,"file":"slides/part03/slide_057.jpg"},{"t":3371,"file":"slides/part03/slide_058.jpg"}],"en":{"title":"Ensembling and the score-weight-select pipeline","problem":"Naively combining verifier scores does not reliably help.","why":"Verifier scales and quality differ, so aggregation needs normalization, filtering, and learned weights.","how":"Score, normalize, filter low-quality verifiers, then combine with weights fitted on labels.","detail":"<p>Across four datasets the paper compares top-1, top-5, and top-10 verifiers (by some ranking). Ensembling helps but not monotonically. What always helps is learning how to combine them.<\/p><ul><li>With a small labeled training set, fit one weight per verifier via simple methods such as naive averaging or logistic regression, then apply the learned weights to test data for the corresponding task.<\/li><li>Pipeline: score outputs of the verifiers, normalize them onto a common scale, and filter out low-quality verifiers.<\/li><li>Filtering is emphasized as important - a verifier must be above a certain quality to enter the pool at all.<\/li><li>Verifier outputs may be 0/1 or log-probabilities of correctness.<\/li><\/ul>","terms":["score-weight-select","logistic regression","normalization","verifier filtering","naive ensemble"]},"zh":{"title":"集成与 score-weight-select 流程","problem":"朴素地组合验证器得分并不能可靠地带来帮助。","why":"验证器的规模与质量各不相同，因此聚合需要归一化、过滤和学习到的权重。","how":"打分、归一化、过滤低质量验证器，然后用基于标签拟合的权重进行组合。","detail":"<p>论文在四个数据集上比较了 top-1、top-5 和 top-10 验证器（按某种排名）。集成有帮助，但并非单调递增。始终有帮助的是学习如何组合它们。<\/p><ul><li>用一个小规模带标签训练集，通过朴素平均或 logistic regression 等简单方法为每个验证器拟合一个权重，然后把学到的权重应用到相应任务的测试数据上。<\/li><li>流程：为验证器的输出打分，将它们归一化到统一尺度，并过滤掉低质量验证器。<\/li><li>过滤被强调为很重要——验证器必须达到一定质量才能进入池中。<\/li><li>验证器的输出可能是 0/1，也可能是正确性的 log-probabilities。<\/li><\/ul>","terms":["score-weight-select","logistic regression","归一化","验证器过滤","朴素集成"]}},{"t":3400,"figs":[{"t":3424,"file":"slides/part03/slide_060.jpg"}],"en":{"title":"Beaver: weak-to-strong aggregation","problem":"Estimating the probability that a solution is correct from many noisy verifier labels with almost no ground truth.","why":"This is a weak-supervision problem: combine weak signals into a stronger one.","how":"Use the Beaver method, inspired by Snorkel, assuming verifiers capture independent aspects of correctness.","detail":"<p>The setup is n queries, k solutions per query, and m verifiers, giving n times k times m labels. The target is the probability that solution j is correct given all verifier labels.<\/p><ul><li>Key assumption: each verifier captures an independent aspect of correctness. If all verifiers agreed on every sample, nothing new would be learned, so the signal comes from similarity and dissimilarity across the pool.<\/li><li>Under independence, plus the basic definition of conditional probability, the method writes the target probability and an optimization that yields a weight per verifier.<\/li><li>Beaver uses weak supervision to estimate verifier accuracy from very little labeled data. It is motivated by Snorkel and related Stanford work.<\/li><li>The weak-to-strong aggregation beats a naive ensemble, with large gains on hard sets such as GPQA diamond, MATH, and MMLU Pro where the baseline is low.<\/li><\/ul>","terms":["weak supervision","Beaver","Snorkel","independence assumption","GPQA diamond"]},"zh":{"title":"Beaver：weak-to-strong 聚合","problem":"在几乎没有 ground truth 的情况下，从许多带噪的验证器标签中估计某个解答正确的概率。","why":"这是一个弱监督问题：把弱信号组合成更强的信号。","how":"使用受 Snorkel 启发的 Beaver 方法，假设各验证器捕捉的是正确性的相互独立的方面。","detail":"<p>其设定是 n 个 query、每个 query 有 k 个解答、m 个验证器，共得到 n 乘以 k 乘以 m 个标签。目标是：在给定所有验证器标签的条件下，解答 j 正确的概率。<\/p><ul><li>关键假设：每个验证器捕捉正确性的一个独立方面。如果所有验证器在每个样本上都一致，就学不到新东西，因此信号来自整个验证器池中的相似性与差异性。<\/li><li>在独立性假设下，再加上条件概率的基本定义，该方法写出目标概率以及一个优化式，从而得到每个验证器的权重。<\/li><li>Beaver 用弱监督从极少量带标签数据中估计验证器准确率。它受到 Snorkel 及相关 Stanford 工作的启发。<\/li><li>weak-to-strong 聚合优于朴素集成，在 GPQA diamond、MATH、MMLU Pro 等基线较低的难集上增益很大。<\/li><\/ul>","terms":["弱监督","Beaver","Snorkel","独立性假设","GPQA diamond"]}},{"t":3569,"figs":[{"t":3601,"file":"slides/part03/slide_061.jpg"},{"t":3633,"file":"slides/part03/slide_062.jpg"},{"t":3655,"file":"slides/part03/slide_063.jpg"},{"t":3848,"file":"slides/part03/slide_064.jpg"}],"en":{"title":"Scaling verification compute and bridging model classes","problem":"Inference compute can be spent in several places, and the best allocation is unclear.","why":"Different scaling axes trade off, and the system-level accuracy (not coverage) is what matters.","how":"Compare sampling more generations, larger models, and more verifiers against oracle and baselines.","detail":"<p>Ways to scale verification compute include sampling more generations (10 to 100 to 1000), using larger generation and verification models, and increasing the number of verifiers in the pool.<\/p><ul><li>Dashed dark red is the pass@k oracle: an idealized selector that always picks a correct answer. Verifiers exist because that oracle is unavailable.<\/li><li>Purple assumes a large body of labels (supervised); blue uses only 1% of training labels (unsupervised); orange is the naive ensemble, still with quality filtering.<\/li><li>All are substantially better than majority voting and than multi-agent verification (MAV), which is rubric-style LLM prompting and in two cases is worse than majority voting.<\/li><li>On hard problems accuracy jumps from slightly over 40% to over 70%, matching o3-mini. A LLaMA 3.1 8B generator with a verifier pool of 8B and below averages about 70%, comparable to 7B-class majority voting; the 70B class reaches 86.2%, comparable to o3-mini. These are end-to-end solution accuracies, not coverage.<\/li><\/ul>","terms":["pass@k oracle","multi-agent verification","supervised vs unsupervised","model-class gap","o3-mini"]},"zh":{"title":"扩展验证算力与弥合模型类别差距","problem":"推理算力可以花在多个地方，而最佳分配方式尚不明确。","why":"不同的扩展维度之间存在权衡，真正重要的是系统级准确率（而非覆盖率）。","how":"将采样更多生成、更大模型、更多验证器与 oracle 和基线进行比较。","detail":"<p>扩展验证算力的方式包括：采样更多生成（10、100、1000）、使用更大的生成与验证模型，以及增加池中的验证器数量。<\/p><ul><li>深红色虚线是 pass@k oracle：一个理想化的、总能选出正确答案的选择器。验证器之所以存在，正是因为该 oracle 不可得。<\/li><li>紫色假设有大量标签（有监督）；蓝色只用 1% 的训练标签（无监督）；橙色是朴素集成，仍带有质量过滤。<\/li><li>它们都显著优于多数投票，也优于 multi-agent verification（MAV），后者是 rubric 风格的 LLM 提示，在两种情况下甚至不如多数投票。<\/li><li>在难题上，准确率从略高于 40% 跃升到超过 70%，与 o3-mini 相当。配备 8B 及以下验证器池的 LLaMA 3.1 8B 生成器平均约为 70%，与 7B 级的多数投票相当；70B 级达到 86.2%，与 o3-mini 相当。这些都是端到端的解答准确率，而非覆盖率。<\/li><\/ul>","terms":["pass@k oracle","multi-agent verification","有监督 vs 无监督","模型类别差距","o3-mini"]}},{"t":3860,"figs":[{"t":3885,"file":"slides/part03/slide_065.jpg"},{"t":3942,"file":"slides/part03/slide_066.jpg"},{"t":3954,"file":"slides/part03/slide_067.jpg"}],"en":{"title":"Distilling Beaver into a small verifier","problem":"Running many verifier models over many samples for every problem is expensive.","why":"A single distilled verifier preserves most of the ensemble quality at a fraction of the compute.","how":"Train Beaver once, then distill it into a much smaller model.","detail":"<p>Ensembling means running a large number of models on every solution (and many solutions per problem), which multiplies cost. The proposal is to train Beaver once and then distill it into a much smaller model.<\/p><ul><li>The distilled model can be tiny - around 400 million parameters, versus the original pool in the 70B range.<\/li><li>It captures about 97% of the accuracy of the large verifier pool while using 99+% less compute at test time.<\/li><li>Both the distilled and original versions are open-sourced, with checkpoints available for agentic and test-time-scaling projects.<\/li><li>Plotted as success rate against total inference compute, the distilled model dominates, and even the original Beaver becomes more FLOP-efficient than naive ensembling and majority voting at higher accuracy levels.<\/li><\/ul>","terms":["distillation","400M parameters","compute efficiency","open-source checkpoints"]},"zh":{"title":"将 Beaver 蒸馏为一个小型验证器","problem":"对每道题的许多样本运行多个验证器模型代价高昂。","why":"单个蒸馏得到的验证器能以一小部分算力保留大部分集成质量。","how":"训练一次 Beaver，然后将其蒸馏到一个更小得多的模型中。","detail":"<p>集成意味着对每个解答（以及每道题的许多解答）都要运行大量模型，这会使成本成倍增加。方案是：训练一次 Beaver，然后将其蒸馏到一个更小得多的模型。<\/p><ul><li>蒸馏后的模型可以很小——约 4 亿参数，而原始池在 70B 量级。<\/li><li>它保留了大型验证器池约 97% 的准确率，同时在测试时少用 99% 以上的算力。<\/li><li>蒸馏版和原始版都已开源，并为 agentic 与 test-time-scaling 项目提供了 checkpoint。<\/li><li>以成功率对总推理算力作图，蒸馏模型占优；即便原始 Beaver，在较高准确率水平下也比朴素集成和多数投票更具 FLOP 效率。<\/li><\/ul>","terms":["蒸馏","4 亿参数","算力效率","开源 checkpoint"]}},{"t":3997,"figs":[{"t":4002,"file":"slides/part03/slide_069.jpg"},{"t":4085,"file":"slides/part03/slide_070.jpg"}],"en":{"title":"Recap: the four-paper trajectory of verification","problem":"Synthesize how verification research changed over the four papers.","why":"The progression shows the field moving from trained verifiers to automatic process labels to ensembled weak verifiers.","how":"Summarize each paper and the recurring themes.","detail":"<p>The lecture recaps four papers spanning roughly four years and the trajectory of verification research.<\/p><ul><li>Verification improves both training and inference quality.<\/li><li>Process rewards are very effective, generally more so than outcome rewards, but the best results likely come from combining PRMs and ORMs.<\/li><li>Math-Shepherd showed that verifier training scales with data: the more data thrown at verifier training, the better it gets, and the verifier can then be used during RL fine-tuning to improve the generator.<\/li><li>Beaver took a different route: weak-supervised optimization over an ensemble of verifiers. It uses test-time scaling by adding more verifiers rather than sampling one verifier more, and can be distilled into a much smaller model while retaining most of the quality.<\/li><\/ul>","terms":["process reward","outcome reward","RL fine-tuning","ensemble","distillation"]},"zh":{"title":"回顾：验证研究的四篇论文脉络","problem":"综合这四篇论文，梳理验证研究发生了怎样的变化。","why":"这一演进显示出该领域从训练验证器，走向自动过程标签，再到集成弱验证器。","how":"总结每篇论文及其反复出现的主题。","detail":"<p>本讲回顾了横跨约四年的四篇论文，以及验证研究的演进脉络。<\/p><ul><li>验证能同时提升训练与推理的质量。<\/li><li>过程奖励非常有效，通常比结果奖励更有效，但最佳结果很可能来自结合 PRM 与 ORM。<\/li><li>Math-Shepherd 表明验证器训练可随数据扩展：投入到验证器训练的数据越多，它就越强；随后验证器还能在 RL 微调期间用于改进生成器。<\/li><li>Beaver 走了另一条路：在验证器集成上做弱监督优化。它通过增加更多验证器（而非对单个验证器采样更多）来实现 test-time scaling，并且可以蒸馏成一个更小得多的模型，同时保留大部分质量。<\/li><\/ul>","terms":["过程奖励","结果奖励","RL 微调","集成","蒸馏"]}},{"t":4096,"figs":[],"en":{"title":"Q&A: beyond math - coding and generated unit tests","problem":"Almost all covered benchmarks are math or reasoning problems.","why":"Reasoning tasks generally should benefit from the same verification machinery, and coding offers a natural oracle.","how":"Discuss coding as a target and the CodeMonkeys idea of generating unit tests as verifiers.","detail":"<p>Asked whether other domains could work, the lecturer notes that some of the covered benchmarks already include coding problems and that coding is a very interesting area for verification and reasoning more broadly.<\/p><ul><li>CodeMonkeys is mentioned as a paper taking an entirely different approach: instead of directly training a verifier, have the model generate unit tests at test time, and those tests become the verifier.<\/li><li>This links verification to executable oracles and tool use, a theme raised earlier for self-correction and rubrics.<\/li><li>The broader claim is that these verification techniques should transfer to any reasoning task, not only math word problems.<\/li><\/ul>","terms":["coding","CodeMonkeys","unit tests","executable oracle"]},"zh":{"title":"问答：超越数学——编程与生成的单元测试","problem":"所涵盖的基准几乎都是数学或推理问题。","why":"推理任务通常都应受益于同一套验证机制，而编程天然提供了一个 oracle。","how":"讨论将编程作为目标，以及 CodeMonkeys 用生成单元测试作为验证器的想法。","detail":"<p>当被问到其他领域是否可行时，讲师指出所涵盖的某些基准已经包含编程题，并且编程对验证以及更广义的推理而言都是一个非常有意思的领域。<\/p><ul><li>文中提到 CodeMonkeys 这篇论文采取了完全不同的方法：不是直接训练验证器，而是让模型在测试时生成单元测试，这些测试便成为验证器。<\/li><li>这把验证与可执行的 oracle 和工具使用联系起来，这一主题在之前讨论自我纠错和 rubric 时已提出。<\/li><li>更宽泛的主张是：这些验证技术应能迁移到任何推理任务，而不只是数学应用题。<\/li><\/ul>","terms":["编程","CodeMonkeys","单元测试","可执行 oracle"]}},{"t":4162,"figs":[],"en":{"title":"Q&A: reasoning models, future test-time scaling, verifier architecture","problem":"How verification interacts with reasoning models, whether test-time scaling becomes training-only, and whether generator and verifier should share a family.","why":"These questions probe the long-run design of self-improving reasoning systems.","how":"Open discussion rather than a recipe.","detail":"<p>The final discussion moves to broader implications.<\/p><ul><li>Reasoning models benefit from this too: much of their training generates reasoning steps, uses a reward, and runs an RL loop, feeding positive trajectories into the next round. Test-time scaling is inherently used to generate training data, and more sampling lets the model explore more of the solution space.<\/li><li>Asked whether repeated sampling becomes training-only with pass@1 inference, the lecturer sees that as the desired direction for efficiency, with a caveat: sharpening the model to one answer may lose the creativity and diversity that are valuable features.<\/li><li>On whether generator and verifier should be the same family, the lecturer calls it a good open research question. Models often judge their own generations better than another family's, but some models benefit from a different class of verifier. No specific study of same-size/same-family versus different-size/family is known.<\/li><\/ul>","terms":["reasoning models","pass@1","positive trajectories","creativity","model family"]},"zh":{"title":"问答：reasoning model、未来的 test-time scaling、验证器架构","problem":"验证如何与 reasoning model 交互、test-time scaling 是否会变成仅用于训练，以及生成器与验证器是否应同属一个模型家族。","why":"这些问题探究了自我改进推理系统的长期设计。","how":"开放式讨论，而非固定配方。","detail":"<p>最后的讨论转向更广泛的影响。<\/p><ul><li>reasoning model 同样受益于此：它们的大部分训练都在生成推理步骤、使用奖励并运行 RL 循环，把正向轨迹送入下一轮。test-time scaling 本质上被用来生成训练数据，而更多采样让模型能探索更大的解空间。<\/li><li>当被问到在 pass@1 推理下重复采样是否变成仅用于训练时，讲师认为这是效率上值得追求的方向，但有一个前提：把模型“磨尖”到只给一个答案，可能会损失创造性与多样性这些有价值的特性。<\/li><li>关于生成器与验证器是否应属于同一家族，讲师称这是一个很好的开放研究问题。模型判断自己的生成往往比判断另一个家族的更好，但有些模型能从不同类别的验证器中获益。目前尚不清楚有针对同规模/同家族 vs 不同规模/家族的专门研究。<\/li><\/ul>","terms":["reasoning model","pass@1","正向轨迹","创造性","模型家族"]}}]},{"n":4,"id":"Lxh9RF5S-K0","duration":4269,"slideCount":54,"en":{"title":"Learning from Feedback with Tools and Code","summary":"Three self-improvement loops that differ only in where the learning signal comes from: ReAct (feedback from environment/tool observations via interleaved thought-action traces), RLEF (feedback from code execution and test pass/fail used as a binary reward in an RL loop), and Constitutional AI (feedback from the model's own critique against a human-written constitution, distilled via SL and then turned into an AI preference model for RL). Recurring mechanisms: grounding unverified model output against an external signal; separating iteration-time feedback from reward-time evaluation to prevent leakage; the hybrid token-level/turn-level credit-assignment problem; and trading helpfulness against harmlessness on a Pareto frontier."},"zh":{"title":"借助工具与代码从反馈中学习","summary":"三个自我改进循环，唯一的区别在于学习信号的来源：ReAct（反馈来自环境/工具观测，通过交替的思考-行动轨迹）、RLEF（反馈来自代码执行与测试通过/失败，在 RL 循环中作为二值奖励使用）、以及 Constitutional AI（反馈来自模型依据人工撰写的 constitution 所做的自我批判，先通过 SL 蒸馏，再转化为用于 RL 的 AI 偏好模型）。反复出现的机制包括：用外部信号为未经验证的模型输出提供 grounding；把迭代时反馈与奖励时评估分离以防止泄漏；混合的 token 级/轮次级信用分配问题；以及以 Pareto 前沿权衡有用性与无害性。"},"sections":[{"t":5,"figs":[{"t":37,"file":"slides/part04/slide_004.jpg"},{"t":56,"file":"slides/part04/slide_198.jpg"}],"en":{"title":"Three self-improvement loops: where does the feedback come from?","problem":"LLMs are strong at NLP and chat, but to be useful on real-world tasks they must interact with environments, tools, and code, and then learn from that interaction. Test-time compute and robust verification (the previous two lectures) only build part of the picture.","why":"A chat-style model has no grounding: it cannot observe the consequences of an action, so it cannot close a feedback loop on its own. The binding question is not whether to self-improve but where the learning signal originates.","how":"Study three papers whose loops differ only in feedback source: ReAct (environment/tool observations), RLEF (execution and test feedback for code), and Constitutional AI (model self-critique against human-written principles).","detail":"<p>All three papers answer the same question — <b>where does the learning signal come from?<\/b> — but differ in the feedback channel:<\/p><ul><li><b>ReAct<\/b>: feedback = observations returned by tool calls (search results, API responses); reasoning and acting are interleaved in-context.<\/li><li><b>RLEF<\/b>: feedback = execution/test results of generated code, converted into a binary reward for an RL loop.<\/li><li><b>Constitutional AI<\/b>: feedback = the model's own critique against a human-written constitution, distilled via supervised learning and then used as an AI preference model for RL.<\/li><\/ul><p>The unifying claim: once a loop produces <b>enough signal<\/b>, the model can improve <i>beyond<\/i> the data it was pretrained on. Modern thinking models already have ReAct-style tool-call traces distilled in, so the loop looks innate rather than hand-engineered.<\/p>","terms":["self-improvement loop","tool calling","grounding","feedback signal","Constitutional AI"]},"zh":{"title":"三种自我改进循环：反馈从何而来？","problem":"LLM 在 NLP 和对话任务上很强，但要在真实世界任务中发挥作用，它们必须与环境、工具和代码交互，并从这种交互中学习。测试时计算与稳健验证（前两讲的内容）只构成了全貌的一部分。","why":"对话式模型缺乏 grounding：它无法观察某个动作带来的后果，因此无法自行闭合反馈回路。关键问题不是要不要自我改进，而是学习信号源自何处。","how":"研究三篇论文，它们的循环仅在反馈来源上不同：ReAct（环境/工具观测）、RLEF（针对代码的执行与测试反馈）、Constitutional AI（模型依据人工撰写的原则进行自我批判）。","detail":"<p>这三篇论文回答的是同一个问题——<b>学习信号从何而来？<\/b>——但反馈渠道不同：<\/p><ul><li><b>ReAct<\/b>：反馈 = 工具调用返回的观测（搜索结果、API 响应）；推理与行动在上下文内交替进行。<\/li><li><b>RLEF<\/b>：反馈 = 生成代码的执行/测试结果，被转换为 RL 循环中的二值奖励。<\/li><li><b>Constitutional AI<\/b>：反馈 = 模型依据人工撰写的 constitution 进行的自我批判，先通过监督学习蒸馏，再作为 AI 偏好模型用于 RL。<\/li><\/ul><p>统一的主张：一旦某个循环产生<b>足够的信号<\/b>，模型就能<i>超越<\/i>其预训练数据。现代 thinking 模型已蒸馏进 ReAct 式的工具调用轨迹，因此该循环看起来像是天生的，而非人工设计的。<\/p>","terms":["自我改进循环","工具调用","grounding","反馈信号","Constitutional AI"]}},{"t":114,"figs":[{"t":125,"file":"slides/part04/slide_010.jpg"},{"t":182,"file":"slides/part04/slide_012.jpg"},{"t":203,"file":"slides/part04/slide_014.jpg"}],"en":{"title":"ReAct: reasoning and acting are isolated processes","problem":"Models struggle to combine reasoning and acting. Ask a chatbot what the temperature is today and it has no current-events knowledge unless it actually issues a search call, so it confidently hallucinates instead.","why":"Humans run a think-act-observe loop (thirsty, walk to kitchen, water is out, decide to go to the store). LLMs historically had no such loop: they had no notion of grounding in the world and could not feed action consequences back into reasoning.","how":"ReAct interleaves verbal reasoning traces with actions: prompt the model to think step by step, append that reasoning to the context, then emit an action; the observation feeds the next reasoning step — thought1, act1, observation1, thought2, act2.","detail":"<p>The motivating observation is that reasoning and acting were two disjoint research lines: chain-of-thought reasons over the model's internal state with no external feedback, while WebGPT-style agents learn browser interaction but have no explicit reasoning abstraction. ReAct is the first abstraction that combines them effectively.<\/p><ul><li>Each step the model emits either a <b>thought<\/b> (free-form language that does <i>not<\/i> affect the environment) or an <b>action<\/b> (e.g. a search call).<\/li><li>The loop runs entirely in <b>language space<\/b>, so it is cheap to try and easy to inspect.<\/li><li>Grounding is the point: a search call fetches an observation the model could not have generated itself, curing the temperature/current-events failure.<\/li><li>Today's thinking modes (e.g. Qwen) reproduce this behavior automatically because they were distilled on exactly these traces, so tool calling looks innate.<\/li><\/ul>","terms":["ReAct","chain-of-thought","WebGPT","grounding","hallucination","interleaved traces"]},"zh":{"title":"ReAct：推理与行动是两个孤立的过程","problem":"模型难以将推理与行动结合起来。问聊天机器人今天气温如何，除非它真的发起搜索调用，否则它没有实时事件知识，于是会自信地产生幻觉。","why":"人类运行着一个思考-行动-观察循环（口渴，走到厨房，水没了，决定去商店）。LLM 历史上没有这样的循环：它们没有在真实世界中 grounding 的概念，也无法把行动后果反馈回推理。","how":"ReAct 将语言推理轨迹与动作交替：提示模型逐步思考，把该推理追加到上下文，然后输出一个动作；观测喂给下一个推理步骤——thought1、act1、observation1、thought2、act2。","detail":"<p>其动机观察是：推理与行动原本是两条互不相干的研究路线：chain-of-thought 在模型内部状态上推理，没有外部反馈；而 WebGPT 式智能体学习浏览器交互，但没有显式的推理抽象。ReAct 是第一个有效结合两者的抽象。<\/p><ul><li>每一步模型输出一个 <b>thought<\/b>（自由形式的语言，<i>不<\/i>影响环境）或一个 <b>action<\/b>（例如搜索调用）。<\/li><li>整个循环完全在<b>语言空间<\/b>中运行，因此尝试成本低、易于检视。<\/li><li>grounding 是关键：搜索调用取回模型自身无法生成的观测，治愈了气温/实时事件这类失败。<\/li><li>如今的 thinking 模式（如 Qwen）会自动复现这种行为，因为它们正是在这些轨迹上蒸馏而来的，所以工具调用看起来像是天生的。<\/li><\/ul>","terms":["ReAct","chain-of-thought","WebGPT","grounding","幻觉","交替轨迹"]}},{"t":244,"figs":[{"t":278,"file":"slides/part04/slide_016.jpg"},{"t":341,"file":"slides/part04/slide_020.jpg"},{"t":399,"file":"slides/part04/slide_021.jpg"}],"en":{"title":"From CoT and WebGPT to interleaved prompting; interpretability","problem":"Chain-of-thought gives reasoning but is ungrounded, and action-only agents act but do not reason about what to do. How do you get both in one model, and what does grounding actually buy you?","why":"To ground the model you need an external signal, but to decide <i>what<\/i> to retrieve you need reasoning as an intermediate. Combining internal knowledge with external retrieval via a reasoning step is where the value is.","how":"Prompt the model to reason step by step, append the reasoning to the context, then ask which action to take; repeat. A tiny action space (search, lookup, finish) simulates a human interacting with Wikipedia, with no policy training up front.","detail":"<p>CoT intermediate steps may or may not be grounded because they come from the model's internal state and receive no feedback from the outside world. WebGPT-style agents are fine-tuned on browser interaction traces plus human preference data, but learn actions without the reasoning abstraction.<\/p><ul><li><b>Grounding<\/b>: each observation is external evidence, so hallucination drops relative to CoT.<\/li><li><b>Interpretability<\/b>: the decision trace is explicit, so humans can audit and trust it — almost like watching the model break a task down step by step.<\/li><li>Tasks used: <b>HotpotQA<\/b> (multi-hop QA), <b>FEVER<\/b> (fact checking), <b>WebShop<\/b> (buy products online); all require real-world knowledge and a sequence of tool calls.<\/li><\/ul><p>Without grounding the model cannot keep making progress; ReAct is the minimal prompting abstraction that supplies it.<\/p>","terms":["chain-of-thought","WebGPT","interpretability","HotpotQA","FEVER","WebShop"]},"zh":{"title":"从 CoT 与 WebGPT 到交替提示；可解释性","problem":"chain-of-thought 提供了推理但没有 grounding，而仅行动的智能体会行动但不会思考该做什么。如何在一个模型中同时获得两者，grounding 究竟带来什么？","why":"要为模型提供 grounding，你需要外部信号；但要决定<i>检索什么<\/i>，你需要推理作为中间环节。通过一个推理步骤把内部知识与外部检索结合起来，价值正在于此。","how":"提示模型逐步推理，把推理追加到上下文，然后询问该采取哪个动作；重复。一个很小的动作空间（search、lookup、finish）模拟人类与 Wikipedia 的交互，且无需预先进行策略训练。","detail":"<p>CoT 的中间步骤可能有 grounding，也可能没有，因为它们来自模型的内部状态，且不接收来自外部世界的反馈。WebGPT 式智能体在浏览器交互轨迹加人类偏好数据上微调，但学到的是动作，缺少推理抽象。<\/p><ul><li><b>grounding<\/b>：每个观测都是外部证据，因此相对于 CoT，幻觉减少。<\/li><li><b>可解释性<\/b>：决策轨迹是显式的，人类可以审计并信任它——几乎就像看着模型一步步拆解任务。<\/li><li>使用的任务：<b>HotpotQA<\/b>（多跳问答）、<b>FEVER<\/b>（事实核查）、<b>WebShop<\/b>（在线购买商品）；它们都需要真实世界知识和一系列工具调用。<\/li><\/ul><p>没有 grounding，模型就无法持续推进；ReAct 是提供 grounding 的最小提示抽象。<\/p>","terms":["chain-of-thought","WebGPT","可解释性","HotpotQA","FEVER","WebShop"]}},{"t":434,"figs":[{"t":466,"file":"slides/part04/slide_025.jpg"}],"en":{"title":"ReAct as a language-space agent: thoughts vs actions","problem":"Interleaving observations and actions implicitly defines a full agent. The principled approach would be to learn a policy over the context and past actions, but that requires a complex and expensive RL loop.","why":"A learned policy is expensive, whereas prompting can approximate the same interleaving for free. Thoughts are a language-space abstraction that does not touch the environment; only parsed actions do.","how":"Treat the context plus history of actions as state, generate thoughts in language space, then emit an action. Each step informs the next, so the process is sequential; parallel sampling is possible but must be explicitly designed.","detail":"<p>The setup is a full agent: observations about the world plus a set of available actions chosen from the context and action history. ReAct deliberately avoids the policy-learning route by doing everything in the <b>prompting space<\/b>.<\/p><ul><li><b>Left loop<\/b> = reasoning traces; <b>right loop<\/b> = actions on the environment.<\/li><li>Interleaving is sequential: thought1, act1, thought2, act2 — each observation informs the next thought, mirroring the human thirsty-to-store example.<\/li><li>Reasoning tokens do not act on the environment; only the parsed action does. You can do parallel sampling and similar tricks, but then you must design that process yourself.<\/li><li>The abstraction maps naturally onto today's RL-trained thinking models, which already internalized the pattern.<\/li><\/ul>","terms":["policy","language space","observations","sequential trajectory","parallel sampling"]},"zh":{"title":"作为语言空间智能体的 ReAct：thought 与 action","problem":"将观测与动作交替，隐含地定义了一个完整的智能体。原则性的做法是学习一个基于上下文和过去动作的策略，但这需要一个复杂且昂贵的 RL 循环。","why":"学习策略代价高昂，而提示可以免费近似同样的交替。Thought 是语言空间中的抽象，不触碰环境；只有被解析的 action 才会。","how":"把上下文加动作历史视为状态，在语言空间中生成 thought，然后输出一个 action。每一步都为下一步提供信息，因此过程是顺序的；并行采样可行，但必须显式设计。","detail":"<p>这是一个完整的智能体设定：关于世界的观测，加上一组从上下文和动作历史中选出的可用动作。ReAct 刻意避开策略学习路线，一切都在<b>提示空间<\/b>中完成。<\/p><ul><li><b>左侧循环<\/b> = 推理轨迹；<b>右侧循环<\/b> = 作用于环境的动作。<\/li><li>交替是顺序的：thought1、act1、thought2、act2——每个观测都为下一个 thought 提供信息，呼应人类从口渴到商店的例子。<\/li><li>推理 token 不作用于环境；只有被解析出的 action 才会。你可以做并行采样之类的技巧，但那样就得自己设计这个过程。<\/li><li>该抽象自然映射到如今经 RL 训练的 thinking 模型，它们已经内化了这个模式。<\/li><\/ul>","terms":["策略","语言空间","观测","顺序轨迹","并行采样"]}},{"t":480,"figs":[{"t":551,"file":"slides/part04/slide_030.jpg"},{"t":578,"file":"slides/part04/slide_048.jpg"}],"en":{"title":"Valid-action classification and the PAL frozen-LLM implementation","problem":"If the model generates actions, how do you guarantee they are valid, and how does it decide when to reason versus when to act? Open-ended generation can emit malformed or illegal actions.","why":"Large or continuous action spaces (e.g. robotics) demand that only valid actions be considered, and demonstrations cannot fit in context, so training a full policy was impractical at the time.","how":"Frame action selection as <b>classification over an enumerated valid action subset<\/b>: given the reasoning, the state of the world, and the valid actions, pick one. Implement with a <b>frozen LLM<\/b> (the PAL model) plus few-shot exemplars of thought/action/observation triplets.","detail":"<p>Implementation is deliberately lightweight — no policy training required up front. Two decisions matter:<\/p><ul><li><b>Reason or act?<\/b> Given world state plus prior thinking, emit a reasoning trace or an action.<\/li><li><b>Which action is valid?<\/b> Instead of open-ended generation, classify over the enumerated valid subset. This gives a more grounded response and was also used in a Google robotics collaboration where a strict state space demanded only valid actions.<\/li><\/ul><p>The whole loop runs in language space, so it is cheap to try and easy to inspect. A full learned policy over context and action history would require a complex, expensive RL loop; ReAct shows prompting can approximate the same interleaving. Today, RL-trained thinking modes reproduce much of this behavior natively because their traces were distilled from these patterns.<\/p>","terms":["PAL","frozen LLM","few-shot prompting","classification over actions","action space","reason-or-act"]},"zh":{"title":"合法动作分类与 PAL 冻结 LLM 实现","problem":"如果模型生成动作，如何保证它们合法，以及它如何决定何时推理、何时行动？开放式生成可能输出格式错误或非法的动作。","why":"大或连续的动作空间（例如机器人）要求只考虑合法动作，而示范无法放入上下文，因此当时训练完整策略并不现实。","how":"把动作选择表述为<b>在枚举出的合法动作子集上做分类<\/b>：给定推理、世界状态和合法动作，选出一个。用<b>冻结 LLM<\/b>（PAL 模型）加 thought/action/observation 三元组的 few-shot 范例来实现。","detail":"<p>实现刻意保持轻量——无需预先进行策略训练。有两个决策很重要：<\/p><ul><li><b>推理还是行动？<\/b>给定世界状态和先前的思考，输出一条推理轨迹或一个动作。<\/li><li><b>哪个动作合法？<\/b>不做开放式生成，而是在枚举出的合法子集上分类。这样得到的响应更有 grounding，也曾用于一项 Google 机器人合作，其中严格的状态空间要求只允许合法动作。<\/li><\/ul><p>整个循环在语言空间中运行，因此尝试成本低、易于检视。基于上下文和动作历史的完整学习策略需要复杂、昂贵的 RL 循环；ReAct 表明提示可以近似同样的交替。如今，经 RL 训练的 thinking 模式原生复现了其中大部分行为，因为它们的轨迹正是从这些模式中蒸馏而来。<\/p>","terms":["PAL","冻结 LLM","few-shot prompting","动作分类","动作空间","reason-or-act"]}},{"t":585,"figs":[],"en":{"title":"Worked example: HotpotQA Apple Remote multi-hop reformulation","problem":"The multi-hop question <i>Aside from the Apple Remote, what other device can control the program Apple Remote was originally designed to interact with?<\/i> defeats standard prompting and full chain-of-thought: both return wrong answers.","why":"Answering requires chaining an unverified intermediate fact (Apple Remote to Front Row media center). CoT produces plausible steps but cannot verify them, so the intermediate fact is hallucinated; an action-only agent answers prematurely after the first search.","how":"ReAct reasons about what to look up, executes search actions, reads observations, and — critically — when a lookup fails it reformulates the query (Front Row to Front Row software) and reaches the grounded answer.","detail":"<p>Trace from the paper:<\/p><ul><li><b>Standard prompting<\/b> gives a wrong answer. <b>CoT<\/b> shows intermediate steps but is still not correct because the facts are ungrounded.<\/li><li><b>Action-only<\/b> returns that the Apple Remote is a 2005 remote designed to control the <b>Front Row<\/b> media center, then emits an answer prematurely.<\/li><li><b>ReAct<\/b>: thought — first find the Apple Remote, then the program it was designed for; act: search[Apple Remote] returns Front Row; act: search[Front Row] fails; thought — try <b>Front Row software<\/b>; act: search[Front Row software] finds discontinued media-center software; finish with the answer.<\/li><\/ul><p>The key mechanism is <b>reflection on a failed action<\/b>: the observation lets the model reformulate its query and recover, which neither CoT (no actions) nor an action-only agent (no reasoning) can do. Failure analysis confirms CoT hallucination is the dominant error mode, while ReAct's grounded observations cut it substantially.<\/p>","terms":["HotpotQA","multi-hop QA","query reformulation","observation","finish action","reflection"]},"zh":{"title":"实例分析：HotpotQA 中 Apple Remote 的多跳改写","problem":"多跳问题 <i>Aside from the Apple Remote, what other device can control the program Apple Remote was originally designed to interact with?<\/i> 击败了标准提示与完整 chain-of-thought：两者都返回错误答案。","why":"回答它需要串联一个未经核实的中间事实（Apple Remote 到 Front Row 媒体中心）。CoT 产生看似合理的步骤但无法核实，因此中间事实是幻觉；仅行动的智能体在第一次搜索后就过早作答。","how":"ReAct 推理该查找什么，执行搜索动作，阅读观测，并且——关键在于——当某次查找失败时，它改写查询（Front Row 改为 Front Row software）从而得到有 grounding 的答案。","detail":"<p>论文中的轨迹：<\/p><ul><li><b>标准提示<\/b>给出错误答案。<b>CoT<\/b> 展示了中间步骤，但因事实缺乏 grounding 仍不正确。<\/li><li><b>仅行动<\/b>返回 Apple Remote 是 2005 年一款用于控制 <b>Front Row<\/b> 媒体中心的遥控器，然后过早地输出答案。<\/li><li><b>ReAct<\/b>：thought——先找到 Apple Remote，再找它原设计所针对的程序；act：search[Apple Remote] 返回 Front Row；act：search[Front Row] 失败；thought——改试 <b>Front Row software<\/b>；act：search[Front Row software] 找到已停产的媒体中心软件；以答案 finish。<\/li><\/ul><p>关键机制是<b>对失败动作的反思<\/b>：观测让模型改写查询并恢复，这是 CoT（无动作）和仅行动智能体（无推理）都做不到的。失败分析确认 CoT 幻觉是主要错误模式，而 ReAct 有 grounding 的观测大幅削减了它。<\/p>","terms":["HotpotQA","多跳问答","查询改写","观测","finish 动作","反思"]}},{"t":743,"figs":[{"t":745,"file":"slides/part04/slide_039.jpg"}],"en":{"title":"Discussion: model self-knowledge, calibration, interleaving, and conflicting evidence","problem":"How does the model know what it knows and when to search? Does the action influence the next reasoning step, or are all thoughts emitted first? And what happens when the model and the search result disagree?","why":"Models are overconfident and not well calibrated, so a research problem remains open; the practical goal for an application is not knowing whether the model knows but getting it to use the right tools for grounded knowledge. ReAct interleaves in sequence, so each action does inform the next reasoning step.","how":"For application design, add guardrails: majority voting / self-consistency and validating the answer before returning it. When evidence conflicts, let the user decide and increase confidence by sampling multiple times or validating. Grounded search hallucination is far more controllable than relying on the internal state.","detail":"<p>Student Q&amp;A clarified several points:<\/p><ul><li><b>Calibration<\/b>: there are contradictory opinions on whether models know what they know; asked to rate their own confidence they are typically overconfident and not well calibrated. For an application, the goal is not to measure self-knowledge but to route the model to the right tools so its knowledge is grounded.<\/li><li><b>Interleaving<\/b>: it is thought1, act1, thought2, act2 — genuinely sequential, very much like the human process (thirsty, kitchen, water is out, next decision). Each observation genuinely conditions the next reasoning step.<\/li><li><b>Conflicting observations<\/b>: if the environment contradicts the model, the user decides; majority voting or a validation step adds confidence and guardrails.<\/li><li>Hallucination with search results can be controlled much better than depending on the model's internal state alone.<\/li><\/ul>","terms":["calibration","overconfidence","self-consistency","majority voting","guardrails","conflicting observations"]},"zh":{"title":"讨论：模型的自我知识、校准、交替与相互矛盾的证据","problem":"模型如何知道它知道什么、何时该搜索？动作会影响下一个推理步骤，还是所有 thought 都先输出？当模型与搜索结果不一致时会发生什么？","why":"模型过度自信且校准不佳，因此这仍是一个开放研究问题；对应用而言，实际目标不是知道模型是否知道，而是让它使用正确的工具来获得有 grounding 的知识。ReAct 按顺序交替，因此每个动作确实会影响下一个推理步骤。","how":"在应用设计中加入防护：多数投票 / self-consistency，并在返回前验证答案。当证据冲突时，让用户决定，并通过多次采样或验证来提高置信度。有 grounding 的搜索比单纯依赖内部状态要可控得多。","detail":"<p>学生问答澄清了几点：<\/p><ul><li><b>校准<\/b>：关于模型是否知道自己知道什么，存在相互矛盾的观点；让它们给自己的置信度打分时，它们通常过度自信且校准不佳。对应用而言，目标不是测量自我知识，而是把模型引导到正确的工具上，使其知识有 grounding。<\/li><li><b>交替<\/b>：它是 thought1、act1、thought2、act2——真正顺序的，非常像人类过程（口渴、厨房、水没了、下一个决定）。每个观测都真正地约束下一个推理步骤。<\/li><li><b>冲突的观测<\/b>：如果环境与模型矛盾，由用户决定；多数投票或验证步骤可增加置信度与防护。<\/li><li>相比仅依赖模型的内部状态，搜索结果带来的幻觉可以控制得好得多。<\/li><\/ul>","terms":["校准","过度自信","self-consistency","多数投票","防护措施","冲突观测"]}},{"t":955,"figs":[{"t":972,"file":"slides/part04/slide_053.jpg"},{"t":1014,"file":"slides/part04/slide_055.jpg"}],"en":{"title":"Discussion: KV-cache interleaving patterns and whether reasoning is part of the action space","problem":"Do the KV-cache representations of a thought versus an observation show detectable interleaving patterns, given that observations come from the environment and are not generated by the LM? And why are reasoning traces treated as separate from the action space?","why":"Observations are produced by the environment, so their hidden-state signature may differ from generated thoughts; the answer to the second question is that language models are trained on language and benefit from reasoning tokens as an intermediate abstraction to emit the right action.","how":"The KV-cache question is posed as an open research project using open-source LLMs. Architecturally, reasoning traces live on the left loop and actions on the right loop; if you had true intermediate representations, the explicit reasoning tokens might not even be necessary.","detail":"<p>Two clarifying questions in the ReAct discussion:<\/p><ul><li><b>KV-cache / internal representation<\/b>: whether the hidden states of thoughts and observations differ in a systematic interleaving pattern is an open question — a suggested class project, workable with open-source LMs. The important structural fact is that observations are injected by the environment, not generated by the model.<\/li><li><b>Action space vs reasoning<\/b>: the framework does <i>not<\/i> put reasoning inside the action space. Actions (search, finish) are the right loop; reasoning traces are a separate left loop. The reason for having explicit reasoning tokens is that language models are trained on language and are helped by a reasoning abstraction when choosing the next action. With genuine intermediate representations, those tokens might not matter.<\/li><\/ul>","terms":["KV cache","internal representation","reasoning trace","action space","intermediate abstraction"]},"zh":{"title":"讨论：KV-cache 交替模式，以及推理是否属于动作空间","problem":"鉴于观测来自环境、并非由 LM 生成，thought 与 observation 的 KV-cache 表示是否显示出可检测的交替模式？为什么推理轨迹被视为独立于动作空间？","why":"观测由环境产生，因此其隐状态特征可能与生成的 thought 不同；第二个问题的答案是，语言模型在语言上训练，受益于以推理 token 作为中间抽象来输出正确的动作。","how":"KV-cache 问题被提出为一个使用开源 LLM 的开放研究项目。从架构上看，推理轨迹位于左侧循环，动作位于右侧循环；如果你拥有真正的中间表示，显式的推理 token 或许根本没必要。","detail":"<p>ReAct 讨论中的两个澄清性问题：<\/p><ul><li><b>KV-cache / 内部表示<\/b>：thought 与 observation 的隐状态是否存在系统性的交替模式差异，这是一个开放问题——被建议作为课程项目，用开源 LM 即可开展。重要的结构性事实是：观测由环境注入，而非模型生成。<\/li><li><b>动作空间 vs 推理<\/b>：该框架<i>没有<\/i>把推理放进动作空间。动作（search、finish）是右侧循环；推理轨迹是独立的左侧循环。需要显式推理 token 的原因是，语言模型在语言上训练，在选择下一个动作时受益于推理抽象。若有真正的中间表示，这些 token 或许就不重要了。<\/li><\/ul>","terms":["KV cache","内部表示","推理轨迹","动作空间","中间抽象"]}},{"t":1048,"figs":[{"t":1049,"file":"slides/part04/slide_060.jpg"},{"t":1098,"file":"slides/part04/slide_061.jpg"},{"t":1121,"file":"slides/part04/slide_064.jpg"}],"en":{"title":"ReAct results on HotpotQA and FEVER","problem":"Interleaving thought and action looks appealing, but does it beat prompting, chain-of-thought, self-consistency, or action-only agents when those are properly tuned?","why":"ReAct adds overhead (extra reasoning tokens and turns), so any benefit must be demonstrated against real baselines rather than an action-only straw man.","how":"Compare standard prompting, CoT, CoT-SC, ACT (action-only, two variants), ReAct, and a ReAct-to-CoT-SC fallback on HotpotQA and FEVER with a small action space of search[entity], lookup[string], and finish[answer].","detail":"<p>Tasks: <b>HotpotQA<\/b> (multi-hop QA over Wikipedia) and <b>FEVER<\/b> (fact checking); the action space deliberately simulates a human on Wikipedia.<\/p><ul><li>Baselines: standard prompting; CoT; <b>CoT-SC<\/b> (self-consistency, i.e. majority voting); <b>ACT<\/b> (actions only); ReAct; and a fallback.<\/li><li>Findings: ReAct generally beats ACT; it beats CoT on FEVER but <i>not always<\/i> on HotpotQA; the fallback scheme (CoT-SC when ReAct stalls after N steps, or ReAct when the majority answer occurs less than half the time) beats both individual approaches.<\/li><li>Interpretation: the value comes from properly combining model-internal knowledge with external retrieval, using reasoning as the intermediate that decides <i>what<\/i> to retrieve.<\/li><li>Scaling matters: prompting &lt; fine-tuning &lt; RL loop. Fine-tuned ReAct clearly beats prompted ReAct, and an RL loop does even better (covered the following week).<\/li><\/ul>","terms":["HotpotQA","FEVER","self-consistency","ACT baseline","fallback","search-lookup-finish"]},"zh":{"title":"ReAct 在 HotpotQA 与 FEVER 上的结果","problem":"交替 thought 与 action 看起来有吸引力，但在公平调优的情况下，它是否胜过提示、chain-of-thought、self-consistency 或仅行动的智能体？","why":"ReAct 增加了开销（额外的推理 token 和轮次），因此任何收益都必须对照真实基线来证明，而不是与仅行动的稻草人比较。","how":"在 HotpotQA 和 FEVER 上比较标准提示、CoT、CoT-SC、ACT（仅行动，两个变体）、ReAct，以及 ReAct 回退到 CoT-SC 的方案，动作空间很小：search[entity]、lookup[string] 和 finish[answer]。","detail":"<p>任务：<b>HotpotQA<\/b>（基于 Wikipedia 的多跳问答）与 <b>FEVER<\/b>（事实核查）；动作空间刻意模拟人类在 Wikipedia 上的行为。<\/p><ul><li>基线：标准提示；CoT；<b>CoT-SC<\/b>（self-consistency，即多数投票）；<b>ACT<\/b>（仅动作）；ReAct；以及一个回退方案。<\/li><li>发现：ReAct 总体胜过 ACT；在 FEVER 上胜过 CoT，但在 HotpotQA 上<i>并非总是<\/i>如此；回退方案（ReAct 在 N 步后停滞时改用 CoT-SC，或多数答案出现次数不足一半时改用 ReAct）胜过两种单独方法。<\/li><li>解读：价值来自把模型内部知识与外部检索正确结合，以推理作为决定<i>检索什么<\/i>的中间环节。<\/li><li>规模很重要：提示 &lt; 微调 &lt; RL 循环。微调过的 ReAct 明显胜过提示式 ReAct，而 RL 循环效果更好（下一周的内容）。<\/li><\/ul>","terms":["HotpotQA","FEVER","self-consistency","ACT 基线","回退方案","search-lookup-finish"]}},{"t":1178,"figs":[{"t":1187,"file":"slides/part04/slide_069.jpg"}],"en":{"title":"Failure modes and the prompting < fine-tuning < RL ladder","problem":"Where does ReAct fail, and how much does additional training buy over prompting?","why":"Analyzing successful versus failing traces shows which errors dominate. In CoT hallucination is a major failure mode; in ReAct the model has grounded external knowledge and is more trustworthy, so errors are easier to catch and correct with guardrails.","how":"Compare error types across methods, then compare prompting against fine-tuning and against an RL loop. Fine-tuned ReAct beats prompted ReAct; an RL loop does even better.","detail":"<p>The failure-mode comparison is the headline: <b>CoT hallucination<\/b> is the dominant error mode, whereas ReAct retrieves grounded information from an external knowledge base and therefore makes fewer unsupported claims.<\/p><ul><li>Grounding makes the model more trustworthy and the decision trace auditable.<\/li><li><b>Prompting vs fine-tuning<\/b>: once you can fine-tune, ReAct improves clearly; with an RL loop it improves further. The lecture flags the RL loop as next week's material.<\/li><li>The takeaway is a ladder — prompting, then supervised fine-tuning, then RL — where each step converts the interleaved trace into a stronger policy.<\/li><li>ReAct also performs better across question answering, fact checking, and decision tasks, with lower hallucination and better decision traces.<\/li><\/ul>","terms":["hallucination","failure analysis","fine-tuning","RL loop","trustworthiness"]},"zh":{"title":"失败模式与 提示 < 微调 < RL 的阶梯","problem":"ReAct 在哪里失败，额外训练相比提示能带来多少提升？","why":"分析成功与失败轨迹能显示出哪些错误占主导。在 CoT 中幻觉是主要失败模式；在 ReAct 中模型拥有有 grounding 的外部知识、更值得信赖，因此错误更容易被防护措施捕获和纠正。","how":"比较各方法的错误类型，然后把提示与微调、与 RL 循环相比。微调过的 ReAct 胜过提示式 ReAct；RL 循环效果更好。","detail":"<p>失败模式对比是头条结果：<b>CoT 幻觉<\/b>是主要错误模式，而 ReAct 从外部知识库检索有 grounding 的信息，因此提出的无依据主张更少。<\/p><ul><li>grounding 让模型更值得信赖，决策轨迹可审计。<\/li><li><b>提示 vs 微调<\/b>：一旦可以微调，ReAct 明显改善；用 RL 循环则进一步提升。讲座把 RL 循环标为下周内容。<\/li><li>结论是一个阶梯——提示，然后监督微调，再然后 RL——每一步都把交替轨迹转化为更强的策略。<\/li><li>ReAct 在问答、事实核查和决策任务上也表现更好，幻觉更低，决策轨迹更好。<\/li><\/ul>","terms":["幻觉","失败分析","微调","RL 循环","可信度"]}},{"t":1226,"figs":[{"t":1226,"file":"slides/part04/slide_071.jpg"},{"t":1294,"file":"slides/part04/slide_072.jpg"},{"t":1339,"file":"slides/part04/slide_073.jpg"},{"t":1359,"file":"slides/part04/slide_074.jpg"}],"en":{"title":"WebShop decision tasks: error cascading and ReAct's limits","problem":"In WebShop (buy a product such as a nightstand with drawers from a simulated store), ReAct beats imitation learning and imitation learning + RL, yet still trails human experts — 66.6 versus 82.1 success in the reported setting.","why":"These are long multi-step trajectories (search, click, select options, buy), so a wrong early step cascades and corrupts everything downstream. Large action spaces require demonstrations that cannot fit in the context window, and many reasoning steps make inference expensive.","how":"Reasoning as an explicit abstraction still raises both the intermediate score and the final task success rate. The comparison is against imitation learning (plain SFT on traces) and imitation learning + RL (SFT plus RL).","detail":"<p><b>WebShop<\/b>: purchase a product from a simulated environment; success rate is reaching the task goal, while score reflects intermediate progress.<\/p><ul><li>Having the reasoning abstraction with ReAct yields a higher score and higher success rate than imitation learning or imitation + RL.<\/li><li>Residual gap cause: <b>errors compound<\/b> — one bad step propagates through the rest of the trajectory, so success rate is lower than the score.<\/li><li>Stated ReAct limitations: huge action spaces need more demonstrations than fit in context, and multiple reasoning steps raise inference cost.<\/li><li>Headroom remains large versus human experts (66.6 vs 82.1), motivating the discussion of additional cognitive mechanisms that follows.<\/li><\/ul>","terms":["WebShop","imitation learning","error cascading","inference cost","success rate"]},"zh":{"title":"WebShop 决策任务：错误级联与 ReAct 的局限","problem":"在 WebShop（从模拟商店购买带抽屉的床头柜等商品）中，ReAct 胜过模仿学习和模仿学习 + RL，却仍落后于人类专家——在报告设置中为 66.6 对 82.1 的成功率。","why":"这些是长的多步轨迹（搜索、点击、选择选项、购买），因此早期错误一步会级联并破坏下游一切。大动作空间需要示范，而示范无法放入上下文窗口，并且大量推理步骤使推理变得昂贵。","how":"推理作为显式抽象仍然同时提高了中间得分和最终任务成功率。比较对象是模仿学习（在轨迹上做普通 SFT）和模仿学习 + RL（SFT 加 RL）。","detail":"<p><b>WebShop<\/b>：在模拟环境中购买商品；成功率是达成任务目标，而得分反映中间进展。<\/p><ul><li>使用 ReAct 的推理抽象相比模仿学习或模仿 + RL 有更高的得分和成功率。<\/li><li>残余差距的原因：<b>错误会累积<\/b>——一个坏步骤会传播到轨迹其余部分，因此成功率低于得分。<\/li><li>论文列出的 ReAct 局限：巨大的动作空间需要比上下文能容纳的更多示范，且多次推理步骤提高推理成本。<\/li><li>相比人类专家仍有很大提升空间（66.6 对 82.1），这促使了随后关于额外认知机制的讨论。<\/li><\/ul>","terms":["WebShop","模仿学习","错误级联","推理成本","成功率"]}},{"t":1368,"figs":[{"t":1368,"file":"slides/part04/slide_077.jpg"},{"t":1394,"file":"slides/part04/slide_078.jpg"},{"t":1413,"file":"slides/part04/slide_080.jpg"}],"en":{"title":"Class discussion: noisy feedback, reflection, backtracking, and confidence","problem":"What happens when the environment feedback is noisy or misleading rather than honest?","why":"Misleading feedback can send the agent down repetitive loops, so it cannot blindly trust observations or remain committed to a chain of thought that no longer fits the evidence.","how":"Mitigations proposed by the class: add a reflection layer so the agent reasons about what the environment returned; support backtracking when a chain of thought stops making sense; and build better confidence metrics by sampling the same task multiple times and taking the best sample.","detail":"<p>The class exercise surfaced a catalogue of robustness techniques for noisy feedback:<\/p><ul><li><b>Reflection layer<\/b>: another pass in which the agent reasons about the environment feedback before acting on it, rather than treating it as ground truth.<\/li><li><b>Backtracking<\/b>: the ability to abandon or rewind a reasoning path when it stops fitting the problem, specifically to escape repetitive loops caused by misleading feedback.<\/li><li><b>Confidence metrics<\/b>: quantify how much to trust a given piece of feedback; one concrete method is to perform the task several times and take the highest sample, or otherwise estimate model confidence on the environment feedback.<\/li><\/ul><p>The framing is that robustness is an engineering layer on top of ReAct, not something the base loop provides for free.<\/p>","terms":["noisy feedback","reflection","backtracking","confidence metrics","repetitive loops"]},"zh":{"title":"课堂讨论：噪声反馈、反思、回溯与置信度","problem":"当环境反馈不是诚实的，而是有噪声或具有误导性时会发生什么？","why":"误导性反馈可能把智能体带入重复循环，因此它不能盲目信任观测，也不能固守一条已不再符合证据的思维链。","how":"课堂提出的缓解措施：增加反思层，让智能体对环境的返回进行推理；当思维链不再合理时支持回溯；通过多次采样同一任务并取最佳样本来建立更好的置信度指标。","detail":"<p>课堂练习整理出一系列针对噪声反馈的鲁棒性技术：<\/p><ul><li><b>反思层<\/b>：再做一遍，让智能体在依据环境反馈行动之前先对其进行推理，而不是把它当作绝对真理。<\/li><li><b>回溯<\/b>：当某条推理路径不再契合问题时，能够放弃或回退它，专门用于摆脱误导性反馈造成的重复循环。<\/li><li><b>置信度指标<\/b>：量化对某条反馈的信任程度；一个具体方法是把任务执行多次并取最高样本，或以其他方式估计模型对环境反馈的置信度。<\/li><\/ul><p>其定位是：鲁棒性是叠加在 ReAct 之上的一层工程，而不是基础循环免费提供的东西。<\/p>","terms":["噪声反馈","反思","回溯","置信度指标","重复循环"]}},{"t":1481,"figs":[],"en":{"title":"Class discussion: decomposition, memory, reasoning:action ratio, delegation","problem":"If ReAct is only one way to combine reasoning and action, what other cognitive mechanisms should an agent incorporate?","why":"Humans condition the mode of thinking on the task — sometimes relying on past experience, sometimes reasoning step by step — and relying on ReAct alone does not always lead to the right place. Some tasks need analysis before any action.","how":"The class catalogue: task decomposition before applying ReAct; parallel approaches to thinking; memory of past experience; tuning the reasoning-to-action ratio per task; counteracting overthinking; and building compound systems that benchmark subtasks on different models and delegate by strength.","detail":"<p>Mechanisms proposed and endorsed by the speaker:<\/p><ul><li><b>Task decomposition<\/b>: if the task is too complex, split it into subtasks before attacking it with ReAct.<\/li><li><b>Memory<\/b>: reuse past experience rather than re-deriving everything each time.<\/li><li><b>Reasoning-to-action ratio<\/b>: the ideal ratio is task-dependent; some tasks benefit from much more reasoning before acting, and this could even be trained per task.<\/li><li><b>Overthinking<\/b>: today's models often produce very long thinking traces even for simple tasks, so there is active work on getting them not to think too much.<\/li><li><b>Compound systems<\/b>: pick models by parameter count, benchmark subtasks on different models, and delegate tasks to the model that is best at them.<\/li><\/ul>","terms":["task decomposition","memory","reasoning-action ratio","overthinking","compound system","delegation"]},"zh":{"title":"课堂讨论：分解、记忆、推理:行动比例与委派","problem":"如果 ReAct 只是结合推理与行动的一种方式，智能体还应纳入哪些其他认知机制？","why":"人类会依任务决定思考模式——有时依赖过往经验，有时逐步推理——而仅靠 ReAct 并不总能通向正确之处。有些任务需要先分析再行动。","how":"课堂清单：在应用 ReAct 前先做任务分解；并行思考方式；过往经验的记忆；按任务调整推理与行动的比例；对抗过度思考；以及构建复合系统，在不同模型上基准测试子任务并按优势委派。","detail":"<p>提出并获得讲者认可的机制：<\/p><ul><li><b>任务分解<\/b>：如果任务太复杂，先拆成子任务再用 ReAct 处理。<\/li><li><b>记忆<\/b>：复用过往经验，而不是每次都重新推导一切。<\/li><li><b>推理与行动的比例<\/b>：理想比例取决于任务；有些任务在行动前需要多得多的推理，这甚至可以按任务训练。<\/li><li><b>过度思考<\/b>：如今的模型即使面对简单任务也常常产生很长的思考轨迹，因此有活跃的研究在让它们不要想太多。<\/li><li><b>复合系统<\/b>：按参数量挑选模型，在不同模型上基准测试子任务，并把任务委派给最擅长它的模型。<\/li><\/ul>","terms":["任务分解","记忆","推理-行动比例","过度思考","复合系统","委派"]}},{"t":1655,"figs":[{"t":1685,"file":"slides/part04/slide_100.jpg"},{"t":1724,"file":"slides/part04/slide_104.jpg"}],"en":{"title":"RLEF: grou
