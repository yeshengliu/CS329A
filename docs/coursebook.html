分——是困难得多的问题。常见的变通做法是把问题拆成子部分，让模型指向每个部分，并在知识库中提供参考解。<\/li><\/ul><p>两种方法都以验证保真度换取速度：学习到的代理便宜但可被利用，而分解则把任务与当前模型能力相匹配，而不是等待单一模型解决整件事。<\/p>","terms":["代理奖励模型","离线数据","kernel bench","性能剖析","问题分解","知识库"]}},{"t":2398,"figs":[{"t":2453,"file":"slides/part09/slide_047.jpg"},{"t":2545,"file":"slides/part09/slide_048.jpg"}],"en":{"title":"Efficiency: the mainframe era and exploding compute demand","problem":"Self-improvement multiplies inference (sampling, debate, tool calls) just as serving demand explodes, so the cost of intelligence becomes a first-order research constraint.","why":"Today's largest models run on cloud because they are big, proprietary, or both, and demand is growing at rates that outrun efficiency gains.","how":"Frame the second half of the lecture: study model-side and hardware-accelerator-side trends to predict what inference workloads will look like, then ask whether demand can be redistributed to local devices.","detail":"<p>Azalia opens the efficiency half. Today is a <b>mainframe era<\/b>: the large models behind ChatGPT and Gemini run on <b>cloud<\/b>, not locally, because they are big, often proprietary, and even open large models are served remotely. At the same time, inference demand is exploding.<\/p><ul><li>Google Cloud compute serving grew on the order of <b>1200x<\/b> in roughly 12-20 months.<\/li><li>NVIDIA saw around <b>10x<\/b> year-over-year growth.<\/li><li>Serving this demand implies data centers on the order of <b>~250 GW<\/b>, with steadily rising energy supply needs.<\/li><li>Tokens processed on Google's side rose from <b>160 trillion<\/b> (February last year) to <b>1.3 quadrillion<\/b> (October this year) -- among the fastest compute growth curves in history.<\/li><\/ul><p>Since self-improvement means far more inference per unit of output, the cost of intelligence is now a first-class constraint. The project studies both model-side and hardware-side trends to predict future workloads and asks how demand can be redistributed.<\/p>","terms":["mainframe era","cloud inference","compute demand","data center energy","token volume"]},"zh":{"title":"效率：大型机时代与激增的算力需求","problem":"自我改进会成倍增加推理（采样、辩论、工具调用），与此同时服务需求激增，因此智能的成本成为一阶研究约束。","why":"当今最大的模型运行在云上，因为它们很大、专有，或两者兼有，而需求增长的速度超过了效率提升。","how":"勾勒讲座下半场：研究模型侧与硬件加速器侧趋势以预测推理工作负载的形态，然后追问需求能否被重新分配到本地设备。","detail":"<p>Azalia 开启效率部分。今天是 <b>大型机时代<\/b>：ChatGPT 和 Gemini 背后的大模型运行在 <b>云<\/b> 上，而非本地，因为它们很大、往往专有，甚至开放的大模型也是远程服务。与此同时，推理需求正在激增。<\/p><ul><li>Google Cloud 的计算服务在约 12-20 个月内增长了约 <b>1200 倍<\/b>。<\/li><li>NVIDIA 同比增长约 <b>10 倍<\/b>。<\/li><li>服务这些需求意味着约 <b>~250 GW<\/b> 的数据中心，且能源供给需求稳步上升。<\/li><li>Google 侧处理的 tokens 从 <b>160 万亿<\/b>（去年二月）增长到 <b>1.3 千万亿<\/b>（今年十月）——是历史上最快的算力增长曲线之一。<\/li><\/ul><p>由于自我改进意味着每单位输出需要更多推理，智能的成本现在是一等约束。该项目研究模型侧与硬件侧趋势以预测未来工作负载，并追问需求如何能被重新分配。<\/p>","terms":["大型机时代","云推理","算力需求","数据中心能耗","token 量"]}},{"t":2595,"figs":[{"t":2613,"file":"slides/part09/slide_049.jpg"},{"t":2727,"file":"slides/part09/slide_050.jpg"}],"en":{"title":"Workload reality: most queries are simple and locally servable","problem":"It is assumed that all inference must go to frontier cloud accelerators, but the actual query distribution may not require them.","why":"From a large dataset of ChatGPT users, roughly 77% of requests are practical guidance, information, or writing -- tasks addressable by smaller/local models -- while local accelerator memory has grown ~126x since 2012 (laptops with ~100 GB, 8-bit quantized serving).","how":"Analyze the served workload to find what fraction is actually easy, pair it with the local-hardware trend, and define 'local' as 20B active parameters or less.","detail":"<p>The workload does not match the assumption that everything needs a frontier model.<\/p><ul><li>From a large dataset of ChatGPT users, about <b>77%<\/b> of requests are practical guidance, information, or writing -- tasks that smaller, local models can handle correctly.<\/li><li>Users keep asking harder questions as chatbots improve, but the vast majority of queries remain on the simpler side and are addressable by smaller models rather than large proprietary ones.<\/li><li>Meanwhile local inference accelerators improved roughly <b>126x<\/b> in GPU memory since 2012; laptops now carry on the order of <b>100 GB<\/b> of memory, enough to serve very large models when quantized to <b>8-bit<\/b> (and often lower).<\/li><li>For this study, <b>local<\/b> is defined as <b>20B active parameters or less<\/b>.<\/li><\/ul><p>These two trends -- simpler queries and capable local hardware -- suggest a different distribution of inference, motivating the question of what role local inference can play in <b>re-distributing demand<\/b> away from H100s, TPUs, and GB200/300-class cloud accelerators.<\/p>","terms":["local inference","quantization","GPU memory","query distribution","edge devices"]},"zh":{"title":"工作负载现实：大多数查询很简单且可在本地服务","problem":"人们假定所有推理都必须交给前沿云加速器，但实际的查询分布可能并不需要它们。","why":"来自 ChatGPT 用户的大数据集显示，大约 77% 的请求是实用指导、信息或写作——这些任务可由更小/本地的模型处理——而本地加速器内存在 2012 年以来增长了约 126 倍（约 100 GB 的笔记本，8-bit 量化服务）。","how":"分析被服务的负载以找出实际简单的比例，将其与本地硬件趋势配对，并把“本地”定义为 20B 活跃参数或更少。","detail":"<p>工作负载与“一切都需要前沿模型”的假设并不相符。<\/p><ul><li>来自 ChatGPT 用户的大数据集显示，约 <b>77%<\/b> 的请求是实用指导、信息或写作——更小、本地的模型可以正确处理的这类任务。<\/li><li>随着聊天机器人改进，用户会不断提出更难的问题，但绝大多数查询仍偏简单，可由更小的模型而非大型专有模型来处理。<\/li><li>与此同时，本地推理加速器的 GPU 内存在 2012 年以来提升了约 <b>126 倍<\/b>；笔记本现在携带约 <b>100 GB<\/b> 的内存，量化为 <b>8-bit<\/b>（往往更低）后足以服务非常大的模型。<\/li><li>在本研究中，<b>本地<\/b> 被定义为 <b>20B 活跃参数或更少<\/b>。<\/li><\/ul><p>这两个趋势——更简单的查询与有能力的本地硬件——暗示了推理的不同分布，引出了本地推理能在多大程度上把需求从 H100、TPU 以及 GB200/300 级别的云加速器上 <b>重新分配<\/b> 出去的问题。<\/p>","terms":["本地推理","量化","GPU 内存","查询分布","边缘设备"]}},{"t":2748,"figs":[{"t":2773,"file":"slides/part09/slide_051.jpg"},{"t":2829,"file":"slides/part09/slide_052.jpg"},{"t":2915,"file":"slides/part09/slide_053.jpg"}],"en":{"title":"Intelligence per watt: metric and study design","problem":"Existing evaluations score capability only, so there is no systematic way to compare a local model's usefulness against its energy cost or against purpose-built enterprise accelerators.","why":"Local chips were designed without the assumption that LLMs would run locally, so on LLM workload efficiency they lag optimized cloud parts even as model quality and local memory improve.","how":"Define intelligence per watt (average task accuracy divided by average power draw), sweep 20+ models across hardware and benchmarks, and open-source the per-substrate metrics so trends can be tracked.","detail":"<p>New metric: <b>intelligence per watt (IPW)<\/b> = average task accuracy divided by the average power draw to solve the task by the model. The capability side captures the share of single-turn/reasoning queries a model can address; the efficiency side captures useful compute per watt on local hardware.<\/p><ul><li>Study scope: <b>20+ local models<\/b> (quantization variants, <b>GPTQ<\/b>, <b>Llama 3<\/b>, and others), across both enterprise and local accelerators.<\/li><li>Workloads: <b>1 million<\/b> ChatGPT-sourced queries plus reasoning benchmarks -- <b>Natural Reasoning<\/b>, <b>MMLU Pro<\/b>, <b>Super GPQA<\/b>.<\/li><li>Metrics: accuracy, energy, latency, and compute, all <b>open-sourced<\/b> across model and hardware substrates.<\/li><li>Design intent: a single scalar to compare a local model's usefulness against its energy cost and against enterprise parts, since local chips were not designed assuming LLMs would run on them.<\/li><\/ul><p>The metric makes the efficiency question concrete: not just 'how smart' but 'how much intelligence per joule'.<\/p>","terms":["intelligence per watt","GPTQ","Llama 3","MMLU Pro","Super GPQA","power draw"]},"zh":{"title":"每瓦智能：指标与研究设计","problem":"现有评估只对能力打分，因此没有系统的方法来比较本地模型的有用性与它的能耗成本，或与企业级专用加速器比较。","why":"本地芯片设计时并未假设 LLM 会在本地运行，因此在 LLM 工作负载效率上落后于优化的云部件，即便模型质量与本地内存都在改善。","how":"定义每瓦智能（平均任务准确率除以平均功耗），在硬件与基准上扫描 20+ 个模型，并开源各基底的指标以便追踪趋势。","detail":"<p>新指标：<b>每瓦智能（intelligence per watt, IPW）<\/b> = 模型解决任务的平均任务准确率除以平均功耗。能力侧捕捉模型可处理的单轮/推理查询占比；效率侧捕捉本地硬件上每瓦的有用算力。<\/p><ul><li>研究范围：<b>20+ 个本地模型<\/b>（量化变体、<b>GPTQ<\/b>、<b>Llama 3<\/b> 等），跨企业级与本地加速器。<\/li><li>工作负载：<b>100 万<\/b> 条来自 ChatGPT 的查询，加上推理基准——<b>Natural Reasoning<\/b>、<b>MMLU Pro<\/b>、<b>Super GPQA<\/b>。<\/li><li>指标：准确率、能耗、延迟与算力，全部在模型与硬件基底上 <b>开源<\/b>。<\/li><li>设计意图：用单一标量来比较本地模型的有用性与它的能耗成本并对比企业级部件，因为本地芯片设计时并未假设 LLM 会运行在其上。<\/li><\/ul><p>该指标让效率问题变得具体：不只是“多聪明”，而是“每焦耳多少智能”。<\/p>","terms":["每瓦智能","GPTQ","Llama 3","MMLU Pro","Super GPQA","功耗"]}},{"t":2931,"figs":[{"t":3092,"file":"slides/part09/slide_054.jpg"}],"en":{"title":"Intelligence-per-watt findings and trends","problem":"How fast are local models and local hardware actually closing the gap, and where does the improvement come from?","why":"Decomposing IPW gains into model-side and hardware-side contributions shows whether the shift to edge is a model story, a chip story, or both.","how":"Compare the share of chat queries solved over time, benchmark Apple M4 Max against B200 on IPW, and factor the two-year gain into model and hardware components.","detail":"<p>Findings:<\/p><ul><li>Since 2023, local models improved <b>3.1x<\/b> on the proportion of chat queries they can solve -- a fast two-year jump -- and now address roughly <b>88.7%<\/b> of the studied queries.<\/li><li>Local accelerators still lag on efficiency: an <b>Apple M4 Max<\/b> delivers about <b>1.5x lower intelligence per watt<\/b> than a <b>B200<\/b>. The reason is optimization target: B200s are extremely tuned for language-model workloads, while local chips were designed for other workloads -- which is why chip-design focus has been on cloud-scale parts.<\/li><li>Overall IPW improved <b>5.3x<\/b> over two years, decomposed into <b>3.1x from better models<\/b> and <b>1.7x from more efficient hardware<\/b>.<\/li><\/ul><p>Because model capability and hardware efficiency are improving simultaneously, more traffic can plausibly move to edge devices -- laptop or phone -- over time. The trade-off is that local efficiency still trails cloud parts, so the shift is a distribution question, not a wholesale replacement.<\/p>","terms":["Apple M4 Max","B200","intelligence per watt","model efficiency","hardware efficiency","edge inference"]},"zh":{"title":"每瓦智能的发现与趋势","problem":"本地模型与本地硬件实际缩小差距的速度有多快，改进来自哪里？","why":"把 IPW 收益分解为模型侧与硬件侧贡献，可以看出向边缘的转移是模型的故事、芯片的故事，还是两者兼有。","how":"比较随时间可解决的聊天查询占比，在 IPW 上把 Apple M4 Max 与 B200 做基准对比，并把两年收益分解为模型与硬件两部分。","detail":"<p>发现：<\/p><ul><li>自 2023 年以来，本地模型在可解决的聊天查询占比上提升了 <b>3.1 倍<\/b>——两年的快速跃升——现在可处理所研究查询的约 <b>88.7%<\/b>。<\/li><li>本地加速器在效率上仍落后：<b>Apple M4 Max<\/b> 的每瓦智能比 <b>B200<\/b> 低约 <b>1.5 倍<\/b>。原因是优化目标：B200 针对语言模型工作负载做了极致调优，而本地芯片是为其他工作负载设计的——这也是芯片设计焦点一直放在云规模部件上的原因。<\/li><li>IPW 总体上在两年内提升了 <b>5.3 倍<\/b>，分解为 <b>来自更好模型的 3.1 倍<\/b> 与 <b>来自更高效硬件的 1.7 倍<\/b>。<\/li><\/ul><p>由于模型能力与硬件效率同时提升，随着时间推移，更多流量有望转移到边缘设备——笔记本或手机。代价是本地效率仍落后于云部件，因此这种转移是分布问题，而非整体替换。<\/p>","terms":["Apple M4 Max","B200","每瓦智能","模型效率","硬件效率","边缘推理"]}},{"t":3112,"figs":[{"t":3113,"file":"slides/part09/slide_056.jpg"}],"en":{"title":"Future directions: test-time scaling principles, flywheel, continual learning","problem":"The loop works empirically, but the principles behind test-time scaling are undescribed, models cannot learn on the go, and the synthetic-data flywheel is not understood.","why":"Repeated sampling producing correct answers is unexplained, best practices for distilling successful trajectories are unclear, and models rely on offline data generation plus asynchronous fine-tuning unlike humans who learn continuously from successes and failures.","how":"Open directions: foundational principles for test-time scaling and trajectory distillation, the synthetic-data flywheel, and continual learning -- possibly via weights, memory systems, or massively longer effective context.","detail":"<p>Open directions that connect the flywheel to learning on the go.<\/p><ul><li><b>Foundational principles of test-time scaling.<\/b> Why does asking the same question repeatedly yield correct answers? What is the model doing, and what are the best practices to <b>distill successful trajectories<\/b> back into the model? These remain open.<\/li><li><b>Synthetic-data flywheel.<\/b> Right now the approach is RL plus data collection plus fine-tuning; the instructors argue there is more to understand about this property and its connection to continual learning.<\/li><li><b>Continual learning.<\/b> Humans improve continuously while solving problems; models rely on offline experience collection followed later by fine-tuning -- a mismatch. The question is what new practices let positive experiences, negative experiences, and problem-solving feed back into the model more naturally than the current asynchronous data-generation-plus-fine-tuning paradigm.<\/li><\/ul><p>Possible mechanisms span weight updates, memory systems, and massively longer effective context -- the three are contrasted in the Q&amp;A that follows. The course deliberately covered pre-training less than post-training and test-time scaling.<\/p>","terms":["test-time scaling","trajectory distillation","synthetic-data flywheel","continual learning","asynchronous fine-tuning"]},"zh":{"title":"未来方向：test-time scaling 原理、飞轮、持续学习","problem":"该循环在经验上有效，但 test-time scaling 背后的原理未被阐明，模型无法边做边学，合成数据飞轮也未被理解。","why":"重复采样产生正确答案这一现象未被解释，将成功轨迹蒸馏的最佳实践尚不清晰，且模型依赖离线数据生成加异步微调，不同于人类从成功与失败中持续学习。","how":"开放方向：test-time scaling 与轨迹蒸馏的基础原理、合成数据飞轮，以及持续学习——可能通过权重、记忆系统或大规模延长的有效上下文实现。","detail":"<p>将飞轮与边做边学联系起来的开放方向。<\/p><ul><li><b>test-time scaling 的基础原理。<\/b> 为什么反复问同一个问题能得到正确答案？模型在做什么，把 <b>成功轨迹蒸馏<\/b> 回模型的最佳实践是什么？这些仍是开放问题。<\/li><li><b>合成数据飞轮。<\/b> 目前的做法是 RL 加数据收集加微调；讲师认为对这一性质及其与持续学习的联系还有更多需要理解之处。<\/li><li><b>持续学习。<\/b> 人类在解题过程中持续改进；模型则依赖离线经验收集，之后再微调——一种错配。问题是哪些新做法能让正面经验、负面经验与问题求解比当前异步的数据生成加微调范式更自然地回流到模型中。<\/li><\/ul><p>可能的机制横跨权重更新、记忆系统，以及大规模延长的有效上下文——这三者在随后的 Q&amp;A 中被对比。课程有意在 pre-training 上讲的比 post-training 和 test-time scaling 少。<\/p>","terms":["test-time scaling","轨迹蒸馏","合成数据飞轮","持续学习","异步微调"]}},{"t":3297,"figs":[{"t":3503,"file":"slides/part09/slide_057.jpg"}],"en":{"title":"Infrastructure, hybrid serving, and energy as the primary resource","problem":"The serving stack is not built for the inference pattern test-time scaling produces, and energy is becoming the binding constraint.","why":"Repeated sampling, generation-to-generation updates, and tool calling differ sharply from single-turn chatbot traffic, while local accelerators lag cloud parts and energy supply limits data centers.","how":"Build high-throughput low-latency test-time-scaling infra (e.g. Hydrogen, Tokamak), hybrid serving engines that route between local and cloud by complexity/resources, new energy-efficient architectures/kernels, and treat intelligence per watt as the target metric.","detail":"<p>The infrastructure layer is not built for the inference pattern that test-time scaling produces.<\/p><ul><li><b>High-throughput, low-latency test-time scaling.<\/b> Repeated sampling, generation-to-generation updates, and tool calling differ sharply from mainstream single-turn chatbot traffic. This opens systems and inference-optimization work; the lab's efforts include <code>Hydrogen<\/code> and <code>Tokamak<\/code>, and they matter more as these methods go mainstream.<\/li><li><b>Hybrid serving engines.<\/b> Route traffic smoothly between local and cloud models/accelerators depending on need and the complexity of the resources.<\/li><li><b>New architectures and kernels<\/b> for energy-efficient inference, especially on local accelerators -- a much less studied area than cloud accelerators.<\/li><li><b>Energy as the primary resource.<\/b> Metrics such as <b>intelligence per watt<\/b>, and better ways to measure and optimize watt and power usage, are expected to become mainstream target metrics.<\/li><\/ul><p>Framing: the unleashed frontier sits at the intersection of fine-tuning, online learning, and test-time scaling, and it contains many unsolved challenges.<\/p>","terms":["Hydrogen","Tokamak","hybrid serving","inference kernels","energy efficiency","intelligence per watt"]},"zh":{"title":"基础设施、混合服务，以及作为首要资源的能源","problem":"服务栈并非为 test-time scaling 所产生的推理模式而构建，且能源正成为约束瓶颈。","why":"重复采样、代际更新与工具调用与单轮聊天机器人流量差异显著，而本地加速器落后于云部件，能源供给限制着数据中心。","how":"构建高吞吐低延迟的 test-time-scaling 基础设施（如 Hydrogen、Tokamak）、根据复杂性与资源在本地与云之间路由的混合服务引擎、新的能效架构/kernel，并把每瓦智能视为目标指标。","detail":"<p>基础设施层并非为 test-time scaling 所产生的推理模式而构建。<\/p><ul><li><b>高吞吐、低延迟的 test-time scaling。<\/b> 重复采样、代际更新与工具调用与主流的单轮聊天机器人流量差异显著。这开启了系统与推理优化的工作；实验室的努力包括 <code>Hydrogen<\/code> 与 <code>Tokamak<\/code>，随着这些方法走向主流，它们会愈发重要。<\/li><li><b>混合服务引擎。<\/b> 根据需求与资源的复杂性，在本地与云模型/加速器之间平滑路由流量。<\/li><li>面向能效推理的 <b>新架构与 kernel<\/b>，尤其是在本地加速器上——这是比云加速器研究得少得多的领域。<\/li><li><b>能源作为首要资源。<\/b> 诸如 <b>每瓦智能<\/b> 之类的指标，以及更好地测量并优化瓦特与功耗的方法，预计会成为主流目标指标。<\/li><\/ul><p>框定：被释放的前沿位于微调、在线学习与 test-time scaling 的交汇处，并包含许多未解决的挑战。<\/p>","terms":["Hydrogen","Tokamak","混合服务","推理 kernel","能效","每瓦智能"]}},{"t":3532,"figs":[{"t":3663,"file":"slides/part09/slide_058.jpg"}],"en":{"title":"Q&A: memory vs weights, infinite context, environments as proxies","problem":"If continual learning is the goal, should knowledge go into a long-term memory store or into the model weights? And do self-created environments actually proxy real-world tasks?","why":"An idealized infinite context that remembers and reasons over every experience does not exist -- reasoning over in-context data degrades within a few million tokens -- and a side memory store aids lookup but does not teach reasoning over new domains (a skill-transfer problem).","how":"Weights updates are needed for genuine skill transfer (e.g. cross-embodiment robot generalization), while memory-side approaches (databases, cartridge/KV-cache knowledge, massively longer context) avoid fine-tuning; environments matter only insofar as they proxy real-world feedback, which is easiest in finite spaces like games.","detail":"<p>Two audience questions clarify the continual-learning discussion.<\/p><p><b>Memory vs weights.<\/b> An idealized <b>infinite context<\/b> that remembered every positive and negative experience and reasoned over all of it would be one answer -- but it does not exist, and reasoning over in-context (ICL) data diminishes within even a million or a few million tokens.<\/p><ul><li>Alternatives without fine-tuning: update a <b>memory store<\/b>/database (the simplest naive version -- just update the DB), or use <b>cartridge<\/b>-style methods that bring knowledge into activations or KV caches and enable long-context ICL.<\/li><li>Trade-off: a side memory store is easier but does not teach reasoning over new domains; genuine skill transfer needs <b>weight updates<\/b>. Example: cross-embodiment robot generalization does not emerge from memory alone -- it is a skill-transfer problem.<\/li><\/ul><p><b>Environments.<\/b> For Absolute-Zero-style self-created environments, the point is not who authors them but whether they are reasonable <b>proxies for real-world tasks<\/b>. Easily simulated tasks are straightforward; finite spaces like games are easiest to represent in code and simulate.<\/p>","terms":["infinite context","memory store","cartridge","KV cache","cross-embodiment generalization","environment as proxy"]},"zh":{"title":"Q&A：记忆 vs 权重、无限上下文、作为代理的环境","problem":"如果持续学习是目标，知识应进入长期记忆存储还是进入模型权重？自创建的环境是否真正代理真实世界任务？","why":"一个能记住并对每段经验进行推理的理想化无限上下文并不存在——对上下文内数据的推理在几百万 tokens 内就会退化——而侧边记忆存储有助于查找，却无法教会对新领域的推理（一个技能迁移问题）。","how":"真正的技能迁移需要权重更新（例如跨具身机器人泛化），而记忆侧方法（数据库、cartridge/KV-cache 知识、大规模延长的上下文）可避免微调；环境只有在能代理真实世界反馈时才有意义，这在游戏等有限空间中最容易实现。","detail":"<p>两个观众提问澄清了持续学习的讨论。<\/p><p><b>记忆 vs 权重。<\/b> 一个理想化的 <b>无限上下文<\/b>，能记住每一段正面与负面经验并对全部进行推理，会是一种答案——但它并不存在，而且对上下文内（ICL）数据的推理即便在百万或几百万 tokens 内也会减弱。<\/p><ul><li>无需微调的替代方案：更新 <b>记忆存储<\/b>/数据库（最简单的朴素版本——只更新 DB），或使用 <b>cartridge<\/b> 式方法把知识带入激活或 KV 缓存并支持长上下文 ICL。<\/li><li>权衡：侧边记忆存储更容易，但无法教会对新领域的推理；真正的技能迁移需要 <b>权重更新<\/b>。例如：跨具身机器人泛化不会仅从记忆中出现——它是一个技能迁移问题。<\/li><\/ul><p><b>环境。<\/b> 对于 Absolute-Zero 式自创建环境，重点不在于由谁编写，而在于它们是否是真实世界任务的合理 <b>代理<\/b>。易于仿真的任务很直接；像游戏这样的有限空间最容易用代码表示并仿真。<\/p>","terms":["无限上下文","记忆存储","cartridge","KV cache","跨具身泛化","作为代理的环境"]}},{"t":3922,"figs":[],"en":{"title":"Closing remarks","problem":"The course ends and students must decide how to carry the material forward.","why":"The field moves fast enough that taught material becomes history within a year, but the underlying techniques compound because new work keeps building on them.","how":"Thank the class and point students toward their research projects, posters, and future work in self-improving agents.","detail":"<p>The instructors close the course with thanks.<\/p><ul><li>The field is evolving so quickly that anything taught now starts becoming history by the next offering, but the <b>basic techniques<\/b> -- verifier-driven loops, RL and search, tool use, evaluation, and scaling -- remain valuable because new work still builds on them.<\/li><li>Students are pointed toward their research projects and posters as the place to push the open problems: reasoning diversity, robust and automated verification, data selection without a human bottleneck, synthetic-data flywheels, continual learning, and energy-efficient inference.<\/li><li>The second instructor notes the class was built while the instructors themselves were learning these fresh topics, and hopes it inspired new research directions.<\/li><\/ul><p>End of the course.<\/p>","terms":["self-improving agents","research directions","basic techniques","course close"]},"zh":{"title":"结语","problem":"课程结束，学生必须决定如何把所学的材料继续推进。","why":"该领域发展之快，使得所教材料在一年内就成为历史，但底层技术会不断累积，因为新工作不断在其上构建。","how":"感谢全班，并引导学生走向他们的研究项目、海报，以及在自我改进 agent 方面的未来工作。","detail":"<p>讲师以感谢结束课程。<\/p><ul><li>该领域演进如此之快，现在所教的任何内容到下次开课时都开始成为历史，但 <b>基本技术<\/b>——验证器驱动的循环、RL 与搜索、工具使用、评估与 scaling——仍有价值，因为新工作仍建立在其之上。<\/li><li>学生被引导向他们的研究项目与海报，作为推进开放问题的地方：推理多样性、鲁棒且自动化的验证、没有人类瓶颈的数据选择、合成数据飞轮、持续学习，以及能效推理。<\/li><li>第二位讲师指出，这门课是在讲师们自己也在学习这些新主题时构建的，并希望它启发了新的研究方向。<\/li><\/ul><p>课程结束。<\/p>","terms":["自我改进 agent","研究方向","基本技术","课程结语"]}}]}]};

}
function renderChrome(){
  $('#partsel').innerHTML=DATA.parts.map(p=>`<option value="${p.n}">${esc(tr(p).title)}</option>`).join('');
  $('#leclist').innerHTML=DATA.parts.map(p=>
    `<button class="lec" data-n="${p.n}"><b>${p.n}</b><span>${esc(tr(p).title)}</span></button>`).join('');
  $$('#leclist .lec').forEach(b=>b.onclick=()=>openPart(+b.dataset.n));
}
function openPart(n){
  part=DATA.parts.find(p=>p.n===n); if(!part)return;
  renderChrome();
  $('#partsel').value=n;
  $$('#leclist .lec').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));
  const tp=tr(part), figs=part.sections.reduce((a,s)=>a+s.figs.length,0);
  $('#main').innerHTML=`
    <div class="lechead">
      <h1>Part ${part.n} · ${esc(tp.title)}</h1>
      <div class="meta">
        <span class="pill">${fmt(part.duration)}</span>
        <span class="pill">${part.sections.length} ${T('sections')}</span>
        <span class="pill">${figs} ${T('figures')}</span>
        <a class="pill" href="${yt(part.id,0)}" target="_blank" rel="noopener">${T('original')} ↗</a>
      </div>
    </div>
    <div class="summary"><b>${T('summary')}：</b>${esc(tp.summary)}</div>
    ${part.sections.map((s,i)=>secHTML(s,i)).join('')}`;
  $('#toc').innerHTML=part.sections.map((s,i)=>{
    const ts=tr(s); return `<button class="sec-link" data-i="${i}" title="${esc(ts.title)}">${fmt(s.t)} · ${esc(ts.title)}</button>`;
  }).join('');
  $$('#toc .sec-link').forEach(b=>b.onclick=()=>document.getElementById(`sec-${part.n}-${b.dataset.i}`).scrollIntoView());
  $$('#main .term').forEach(b=>b.onclick=()=>{const t=b.dataset.term; $('#q').value=t; doSearch(t); openPanel();});
  $$('#main figure img').forEach(im=>im.onclick=()=>lightbox(im));
  history.replaceState(null,'',`#p${n}`);
  setupSpy();
}
function secHTML(s,i){
  const ts=tr(s);
  const figs=s.figs.map((f,k)=>`
    <figure>
      <img loading="lazy" src="${f.file}" alt="Part ${part.n}" data-cap="Part ${part.n} · ${fmt(f.t)}">
      <figcaption><span>${T('figure')} ${i+1}.${k+1}</span><a href="${yt(part.id,f.t)}" target="_blank" rel="noopener">${fmt(f.t)} ↗</a></figcaption>
    </figure>`).join('');
  return `<section class="sec" id="sec-${part.n}-${i}">
    <h2><span class="t">${fmt(s.t)}</span>${esc(ts.title)}</h2>
    <div class="chain">
      <div class="node p"><span class="tag">${T('problem')}</span><div>${ts.problem}</div></div>
      <div class="node w"><span class="tag">${T('why')}</span><div>${ts.why}</div></div>
      <div class="node h"><span class="tag">${T('how')}</span><div>${ts.how}</div></div>
    </div>
    <div class="prose">${ts.detail}</div>
    ${ts.terms&&ts.terms.length?`<div class="terms">${ts.terms.map(t=>`<button class="term" data-term="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
    ${figs?`<div class="figs">${figs}</div>`:''}
  </section>`;
}
let spy;
function setupSpy(){
  if(spy)spy.disconnect();
  const links=$$('#toc .sec-link');
  spy=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){const i=e.target.id.split('-').pop();
      links.forEach(l=>l.classList.toggle('active',l.dataset.i===i));}
  }),{rootMargin:'-64px 0px -72% 0px'});
  $$('#main section.sec').forEach(s=>spy.observe(s));
}
function lightbox(im){$('#lbimg').src=im.src;$('#lbcap').textContent=im.dataset.cap||'';$('#lightbox').classList.add('open');}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('open');

let st;
$('#q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>{doSearch(e.target.value);if(e.target.value.trim())openPanel();},150)};
function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){$('#searchResults').innerHTML=`<div class="nores">${T('typeKw')}</div>`;$('#searchMeta').textContent='';return;}
  const out=[];
  for(const p of DATA.parts) for(const s of p.sections){
    const ts=tr(s);
    const hay=(ts.title+' '+ts.problem+' '+ts.why+' '+ts.how+' '+ts.detail.replace(/<[^>]+>/g,' ')).toLowerCase();
    if(hay.includes(q)) out.push({p,s,ts});
  }
  $('#searchMeta').textContent=out.length+T('sectionUnit');
  if(!out.length){$('#searchResults').innerHTML=`<div class="nores">${T('noMatch')}</div>`;return;}
  $('#searchResults').innerHTML=out.map(r=>{const t=tr(r.p).title;
    return `<button class="result" data-n="${r.p.n}" data-i="${r.p.sections.indexOf(r.s)}">
      <div class="rq">Part ${r.p.n} · ${fmt(r.s.t)} · ${esc(t)}</div>
      <div class="rt">${esc(r.ts.title)}</div></button>`;}).join('');
  $$('#searchResults .result').forEach(b=>b.onclick=()=>{
    closePanel(); const n=+b.dataset.n; if(n!==part.n) openPart(n);
    setTimeout(()=>document.getElementById(`sec-${n}-${b.dataset.i}`).scrollIntoView(),60);
  });
}
function openPanel(){$('#overlay').classList.add('open');$('#searchPanel').classList.add('open');$('#q').focus();}
function closePanel(){$('#overlay').classList.remove('open');$('#searchPanel').classList.remove('open');}
$('#overlay').onclick=closePanel; $$('[data-close]').forEach(b=>b.onclick=closePanel);
$('#btnPonly').onclick=()=>{const on=!document.body.classList.contains('ponly');
  document.body.classList.toggle('ponly',on);$('#btnPonly').classList.toggle('on',on);LS.set('cs329a:ponly',on);};
$('#btnTheme').onclick=()=>{const c=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=c;LS.set('cs329a:cbtheme',c);};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}
  if(e.key==='/'){e.preventDefault();openPanel();}
  if(e.key==='Escape'){closePanel();$('#lightbox').classList.remove('open');}
});
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.width=(h>0?scrollY/h*100:0)+'%';});
addEventListener('hashchange',()=>{const m=location.hash.match(/^#p(\d+)/);if(m)openPart(+m[1]);});
$('#btnLang').textContent=T('langBtn');
boot();
</script>
</body>
</html>
