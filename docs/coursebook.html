一部分计算是<b>相互独立<\/b>的；无需等待所有步骤按顺序生成。<\/li><li>SPRINT 是一个<b>post-training / fine-tuning<\/b> 框架：它取一个 reasoning model，使其通过一个 <b>planner<\/b> 加上一组 <b>executor<\/b> 来生成回答。<\/li><li>planner 为问题创建一组计划；executor <b>并行<\/b>执行这些计划；这一过程可以<b>反复发生<\/b>，即 plan-set → parallel-execution → plan-set → parallel-execution。<\/li><li>正是<b>规划与执行的交错<\/b>加速了推理过程，同时让模型的输出通道仍保持为单一的 next-token 流。<\/li><\/ul>","terms":["planner","executor","并行执行","任务分解","交错","post-training","supervised fine-tuning"]}},{"t":1667,"figs":[{"t":1682,"file":"slides/part05/slide_044.jpg"}],"en":{"title":"SPRINT Data Construction: LLM Annotation, Reasoning DAG, and Packing","problem":"The model must be taught the parallel plan/execution format, but no labeled corpus of such traces exists.","why":"Annotating existing sequential traces with plan/execution boundaries yields exactly the supervision needed to reshape the model's decoding behavior, and an LLM can do the annotation at scale.","how":"Generate reasoning traces with DeepSeek R1, then use GPT-4o to step through each trace, segment it into steps 1..k, and label which span is the plan and which is execution (a step may have multiple execution pieces). From these labels build a DAG of dependencies (e.g. steps 4 and 2 both depend on step 1 but are independent of each other), then pack independent steps so they can be executed in parallel.","detail":"<p>Data creation uses the LLM itself for synthetic supervision:<\/p><ul><li>Have <b>DeepSeek R1<\/b> generate reasoning traces and responses for a set of questions.<\/li><li>Use a model like <b>GPT-4o<\/b> to walk each trace, segment it into <b>steps 1&hellip;k<\/b>, and annotate which part is the <b>plan<\/b> and which is the <b>execution<\/b>; some steps contain multiple execution pieces for one plan.<\/li><li>From the annotations, build a <b>DAG<\/b>: e.g. <i>step 4 and step 2 are not dependent on each other but both depend on step 1<\/i>. The model is reported to do a good job inferring these relations.<\/li><li><b>Pack<\/b> independent steps: step 1 first, then steps 2 and 3 <b>completely in parallel<\/b>, and so on.<\/li><\/ul><p>The result is a dataset of steps, plans, and parallel executions. Here <b>LRM<\/b> = large reasoning model; since all modern LLMs are reasoning models, the data is used to <b>fine-tune<\/b> (SFT) a model — e.g. DeepSeek R1 — to think in this parallel-tagged way.<\/p>","terms":["DeepSeek R1","GPT-4o","annotation","DAG","dependency graph","packing","plan tag","execution tag","LRM"]},"zh":{"title":"SPRINT 数据构建：LLM 标注、推理 DAG 与 Packing","problem":"必须教会模型并行的 plan/execution 格式，但不存在这类轨迹的标注语料。","why":"用 plan/execution 边界标注现有的顺序轨迹，恰好能提供重构模型解码行为所需的监督信号，而 LLM 可以大规模完成这种标注。","how":"用 DeepSeek R1 生成推理轨迹，然后用 GPT-4o 逐步遍历每条轨迹，将其切分为 steps 1..k，并标注哪一段是 plan、哪一段是 execution（一个 step 可能包含多个 execution 片段）。根据这些标注构建依赖的 DAG（例如 step 4 和 step 2 都依赖 step 1，但彼此独立），然后 pack 独立步骤，使它们可以并行执行。","detail":"<p>数据创建使用 LLM 本身进行合成监督：<\/p><ul><li>让 <b>DeepSeek R1<\/b> 为一组问题生成推理轨迹与回答。<\/li><li>用一个如 <b>GPT-4o<\/b> 的模型遍历每条轨迹，将其切分为 <b>steps 1&hellip;k<\/b>，并标注哪部分是 <b>plan<\/b>、哪部分是 <b>execution<\/b>；有些 step 会为一个 plan 包含多个 execution 片段。<\/li><li>根据标注构建一个 <b>DAG<\/b>：例如<i>step 4 和 step 2 互不依赖，但都依赖 step 1<\/i>。据报道模型能很好地推断这些关系。<\/li><li><b>Pack<\/b> 独立步骤：先 step 1，然后 steps 2 和 3 <b>完全并行<\/b>，依此类推。<\/li><\/ul><p>结果是一个由 steps、plans 与 parallel executions 组成的数据集。这里 <b>LRM<\/b> = large reasoning model；由于现代 LLM 都是 reasoning model，该数据被用于<b>fine-tune<\/b>（SFT）一个模型——例如 DeepSeek R1——使其以这种带并行标记的方式思考。<\/p>","terms":["DeepSeek R1","GPT-4o","标注","DAG","依赖图","packing","plan tag","execution tag","LRM"]}},{"t":1816,"figs":[{"t":1853,"file":"slides/part05/slide_063.jpg"},{"t":1905,"file":"slides/part05/slide_046.jpg"},{"t":1916,"file":"slides/part05/slide_055.jpg"}],"en":{"title":"SPRINT Inference and Why It Matters: The Sequential-Token Bottleneck","problem":"At inference, a standard reasoning model alternates plan → execute → plan → execute, so the total wall-clock is the sum of every plan and execution.","why":"Cutting the number of <b>sequential<\/b> tokens shortens the critical path and reduces both latency and cost, which is the core motivation for the method.","how":"After SPRINT fine-tuning, the model emits plan 1 and plan 2 together, then their executions start (e.g. via a calculator / Python tool) concurrently, results are synced back into context, and the model proceeds to the next plan set. The model still decodes token-by-token; special tags mark plan/execution boundaries so the harness can parallelize the executions.","detail":"<p>Sequential baseline: <i>query → plan 1 → execute 1 → plan 2 → execute 2 → &hellip; → final answer<\/i>; total time is the sum of these steps.<\/p><p>After SPRINT at inference:<\/p><ul><li>The model first generates <b>plan 1 and plan 2 together<\/b>, since they are independent.<\/li><li>Their executions then happen <b>at the same time<\/b> — e.g. both can be dispatched to a <b>calculator or Python<\/b> tool — and the results are synced back into the context.<\/li><li>Then the next stage / next set of plans proceeds the same way.<\/li><\/ul><p>The lecturer stresses this is still a next-token decoder: the difference is that the model is <b>trained to emit special tags<\/b> (e.g. <code>&lt;plan_1&gt;<\/code>, <code>&lt;plan_2&gt;<\/code>, execution blocks) so the runtime knows which blocks are independent and can run them in parallel. Teaching the model this format is precisely what the SFT data encodes.<\/p>","terms":["sequential tokens","plan tags","parallel execution","tool use","calculator","Python","wall-clock speedup","context sync"]},"zh":{"title":"SPRINT 推理及其意义：顺序 token 瓶颈","problem":"推理时，标准 reasoning model 交替进行 plan → execute → plan → execute，因此总 wall-clock 是每个 plan 和 execution 之和。","why":"减少<b>顺序<\/b> token 的数量可缩短关键路径，并同时降低延迟与成本，这是该方法的核心动机。","how":"SPRINT fine-tuning 之后，模型将 plan 1 和 plan 2 一起输出，然后它们的 execution 并发开始（例如通过 calculator / Python 工具），结果被同步回 context，模型继续处理下一组 plans。模型仍然逐 token 解码；特殊标记标出 plan/execution 边界，使 harness 能够并行化 executions。","detail":"<p>顺序基线：<i>query → plan 1 → execute 1 → plan 2 → execute 2 → &hellip; → final answer<\/i>；总时间是这些步骤之和。<\/p><p>推理时经过 SPRINT 之后：<\/p><ul><li>模型首先生成<b>plan 1 和 plan 2<\/b>，因为它们是独立的。<\/li><li>它们的 execution 随后<b>同时<\/b>发生——例如两者都可以派发给 <b>calculator 或 Python<\/b> 工具——结果被同步回 context。<\/li><li>然后下一阶段/下一组 plans 以同样的方式进行。<\/li><\/ul><p>讲师强调这仍然是一个 next-token 解码器：区别在于模型被<b>训练为输出特殊标记<\/b>（例如 <code>&lt;plan_1&gt;<\/code>、<code>&lt;plan_2&gt;<\/code>、execution 块），使 runtime 知道哪些块相互独立并能并行运行它们。教会模型这种格式正是 SFT 数据所编码的内容。<\/p>","terms":["顺序 token","plan tags","并行执行","工具使用","calculator","Python","wall-clock 加速","context 同步"]}},{"t":1980,"figs":[],"en":{"title":"SPRINT Q&A: Re-Planning, Context Retention, and Training Data Pairing","problem":"If plans are generated ahead of execution, how does the model revise an earlier plan when a later execution reveals it was wrong?","why":"The training recipe must preserve the model's ability to backtrack and revise, otherwise forced parallelism would make it brittle.","how":"The model is trained to plan at every point, including producing revisions of existing plans whenever it can emit parallelizable plans rather than waiting for plan 1 to finish before writing plan 2. It still sees the full prior context, so it can still go back and reverse a plan. Training data places plan 1 and plan 2 side by side and execution 1 and execution 2 side by side; at inference the executions genuinely run in parallel.","detail":"<p>A student asks: if the model realizes after execution 4 that an earlier plan was wrong, how does it know to refine, e.g. go back to plan 3 instead of plan 2?<\/p><ul><li>The model is taught to <b>plan at each point in time<\/b>, even when that means <b>revising<\/b> an existing plan. If it can generate plans that are <b>independent and executable in parallel<\/b>, it should do so — not wait for execution of plan 1 to generate plan 2.<\/li><li>Crucially, <b>it still sees all the context<\/b>, so it can still choose to go back and reverse a plan; it is just trained to prefer parallelism when it is safe.<\/li><li><b>Training data<\/b>: plan 1 and plan 2 appear <b>next to each other<\/b>, and execution 1 and execution 2 follow together, so the model learns that these can be co-emitted. At inference, the executions are actually dispatched in parallel.<\/li><li>The special tags give the runtime the hooks needed to realize that parallelism.<\/li><\/ul>","terms":["re-planning","context retention","plan revision","co-emission","training data pairing","special tags"]},"zh":{"title":"SPRINT 问答：重新规划、Context 保留与训练数据配对","problem":"如果 plans 在执行之前就被生成，那么当后续 execution 表明较早的 plan 有误时，模型如何修改它？","why":"训练配方必须保留模型回溯和修改的能力，否则强制的并行会让它变得脆弱。","how":"模型被训练为在每个时刻都进行规划，包括在能够输出可并行 plans 时对已有 plans 进行修改，而不是等 plan 1 结束再写 plan 2。它仍然能看到完整的先前 context，因此仍可回头撤销某个 plan。训练数据将 plan 1 和 plan 2 并排放置、execution 1 和 execution 2 并排放置；推理时这些 executions 真正并行运行。","detail":"<p>有学生提问：如果模型在 execution 4 之后意识到较早的某个 plan 是错的，它如何知道要去细化，例如回到 plan 3 而不是 plan 2？<\/p><ul><li>模型被教导要<b>在每个时刻都进行规划<\/b>，即使这意味着<b>修改<\/b>已有的 plan。如果它能生成<b>相互独立且可并行执行<\/b>的 plans，就应当这样做——而不是等 plan 1 执行完再生成 plan 2。<\/li><li>关键在于，<b>它仍然能看到全部 context<\/b>，因此仍可选择回头撤销某个 plan；只是被训练为在安全时优先选择并行。<\/li><li><b>训练数据<\/b>：plan 1 和 plan 2 出现<b>在彼此旁边<\/b>，execution 1 和 execution 2 紧随其后，因此模型学到它们可以一起输出。推理时，这些 executions 确实被并行派发。<\/li><li>特殊标记为 runtime 提供了实现这种并行所需的钩子。<\/li><\/ul>","terms":["重新规划","context 保留","计划修改","共同输出","训练数据配对","special tags"]}},{"t":2152,"figs":[{"t":2239,"file":"slides/part05/slide_056.jpg"},{"t":2314,"file":"slides/part05/slide_057.jpg"}],"en":{"title":"SPRINT Training Recipe and Results: 3.5% Accuracy Plus Efficiency","problem":"Does teaching parallelism only save tokens, or does restructuring the reasoning actually change correctness?","why":"If the structured parallel format also raises accuracy, the method is doubly valuable; if not, it is merely an efficiency trick.","how":"Generate ~6K thinking trajectories on a math dataset, keep the ones with higher parallelization, and SFT DeepSeek R1 distill 7B on the reformatted trajectories. Results: a ~3.5% accuracy jump over the R1-distill-7B baseline while using far fewer sequential tokens — more efficient than a 32B model on sequential token count.","detail":"<p><b>Recipe:<\/b><\/p><ul><li>Generate about <b>6K thinking trajectories<\/b> for a <b>math<\/b> dataset.<\/li><li>Keep the trajectories with <b>higher parallelization<\/b>.<\/li><li>Run <b>supervised fine-tuning<\/b> on <b>DeepSeek R1 distill 7B<\/b> over the reformatted traces.<\/li><\/ul><p><b>Surprising finding:<\/b> the project goal was to maximize parallelism to cut sequential generation, but the process <b>also helped accuracy<\/b> — the model appears to like the more structured way of thinking.<\/p><ul><li>~<b>3.5% accuracy jump<\/b> over the <b>R1-distill-7B<\/b> baseline.<\/li><li>Simultaneously much more efficient in <b>number of sequential tokens<\/b> — better than a <b>32B<\/b> model on that axis.<\/li><li>SPRINT <b>explores more and thinks in parallel more<\/b>, giving more chances for independent approaches at fixed compute.<\/li><\/ul>","terms":["6K trajectories","DeepSeek R1 distill 7B","supervised fine-tuning","parallelization","accuracy","sequential token reduction","32B model"]},"zh":{"title":"SPRINT 训练配方与结果：3.5% 准确率提升加上效率","problem":"教并行只是节省 token，还是重构推理过程确实改变了正确性？","why":"如果结构化的并行格式还能提升准确率，该方法就有双重价值；否则它不过是效率技巧。","how":"在一个数学数据集上生成约 6K 条 thinking 轨迹，保留并行度更高的那些，并在重新格式化后的轨迹上 SFT DeepSeek R1 distill 7B。结果：相比 R1-distill-7B 基线准确率跃升约 3.5%，同时使用的顺序 token 少得多——在顺序 token 数量上比 32B 模型更高效。","detail":"<p><b>配方：<\/b><\/p><ul><li>为<b>数学<\/b>数据集生成约 <b>6K 条 thinking 轨迹<\/b>。<\/li><li>保留<b>并行度更高<\/b>的轨迹。<\/li><li>在重新格式化后的轨迹上对 <b>DeepSeek R1 distill 7B<\/b> 进行 <b>supervised fine-tuning<\/b>。<\/li><\/ul><p><b>意外发现：<\/b>项目目标是最大化并行以减少顺序生成，但这一过程<b>还提升了准确率<\/b>——模型似乎喜欢这种更结构化的思考方式。<\/p><ul><li>相比 <b>R1-distill-7B<\/b> 基线准确率跃升约 <b>3.5%<\/b>。<\/li><li>同时在<b>顺序 token 数量<\/b>上高效得多——在该维度上优于 <b>32B<\/b> 模型。<\/li><li>SPRINT <b>探索更多、并行思考更多<\/b>，在固定算力下为独立方法提供了更多机会。<\/li><\/ul>","terms":["6K 轨迹","DeepSeek R1 distill 7B","supervised fine-tuning","并行化","准确率","顺序 token 减少","32B 模型"]}},{"t":2315,"figs":[{"t":2314,"file":"slides/part05/slide_057.jpg"}],"en":{"title":"SPRINT Out-of-Domain Generalization and Parallel Contradictions","problem":"Learning parallelism on math may not transfer, and parallel branches might individually look right yet combine into a wrong answer.","why":"Demonstrating transfer to unseen benchmarks shows the model learned a general 'think in parallel' behavior; addressing contradictions determines whether parallel decoding is safe.","how":"SPRINT trained on math also improves on unseen <b>Countdown<\/b> and <b>GPQA Diamond<\/b> — more parallelism opportunities and higher accuracy with no training on them. On contradictions, the model condenses everything into context and is expected to synthesize/resolve conflicts before the final answer; empirically the plans are independent steps of one solution rather than competing approaches to the same problem.","detail":"<p><b>Out-of-domain generalization:<\/b> trained on math only, SPRINT still does better on <b>Countdown<\/b> and <b>GPQA Diamond<\/b> — no training data from those sets. This suggests the model learns to <b>think in parallel<\/b> as a general skill, with the token savings arriving as a side effect.<\/p><p><b>Contradiction question:<\/b> could two parallel branches each look locally correct but, combined, produce a wrong answer — and what takes precedence?<\/p><ul><li>The model always <b>condenses everything into the context<\/b>, then must <b>synthesize a final answer<\/b>; if branches contradict, it is expected to <b>resolve the conflict<\/b> before answering.<\/li><li>Both sequential and parallel thinking can suffer contradictions, so the comparison is subtle.<\/li><li>Observation: the plans tend to be <b>different steps of one solution<\/b> rather than genuinely different approaches to the same problem, which lowers the risk.<\/li><\/ul>","terms":["out-of-domain generalization","Countdown","GPQA Diamond","contradiction resolution","synthesis","independent steps"]},"zh":{"title":"SPRINT 的域外泛化与并行矛盾","problem":"在数学上学到的并行性未必能迁移，而且并行分支可能各自看起来正确，组合起来却是错误答案。","why":"在未见过的基准上展示迁移，说明模型学到了通用的“并行思考”行为；处理矛盾则决定了并行解码是否安全。","how":"仅在数学上训练的 SPRINT 在未见过的 <b>Countdown<\/b> 和 <b>GPQA Diamond<\/b> 上也有提升——在未对这些数据训练的情况下获得了更多并行机会和更高准确率。关于矛盾，模型会把所有内容浓缩进 context，并被期望在最终答案之前综合/解决冲突；从经验上看，这些 plans 是同一个解的独立步骤，而不是针对同一问题的相互竞争方法。","detail":"<p><b>域外泛化：<\/b>仅在数学上训练的 SPRINT 在 <b>Countdown<\/b> 和 <b>GPQA Diamond<\/b> 上表现仍更好——未使用这些集合的训练数据。这表明模型把<b>并行思考<\/b>学成了一项通用技能，而 token 节省作为副作用出现。<\/p><p><b>矛盾问题：<\/b>两个并行分支是否可能各自局部正确，但组合起来产生错误答案——那么什么优先？<\/p><ul><li>模型总是<b>把所有内容浓缩进 context<\/b>，然后必须<b>综合出最终答案<\/b>；如果分支相互矛盾，它被期望在作答前<b>解决冲突<\/b>。<\/li><li>顺序思考和并行思考都可能遭遇矛盾，因此比较是微妙的。<\/li><li>观察：这些 plans 往往是<b>同一个解的不同步骤<\/b>，而非针对同一问题真正不同的方法，这降低了风险。<\/li><\/ul>","terms":["域外泛化","Countdown","GPQA Diamond","矛盾解决","综合","独立步骤"]}},{"t":2460,"figs":[{"t":2499,"file":"slides/part05/slide_061.jpg"}],"en":{"title":"SPRINT Q&A: Stragglers, Load Balancing, and Task-Dependent Width","problem":"Parallel branches often have unequal runtimes, so a slow straggler can erase the latency benefit; and the exploitable parallelism is not uniform across tasks.","why":"The critical path is set by the slowest branch, so deployment needs mitigation for stragglers and realistic expectations set by task structure.","how":"Mitigations include merging trivially simple executions into the plan to form larger parallel chunks; still, a step can straggle (e.g. step 4 >> step 2), and the runtime is bounded by the slowest branch, not the sum. Tree width is task-dependent: math has a lower sequential-token ratio than GPQA, indicating more inherent parallelism. Reported savings reach ~40% fewer sequential tokens at comparable accuracy.","detail":"<p><b>Straggler / load-balancing question:<\/b> how do you ensure independent plans run in similar time?<\/p><ul><li>Some measures exist, but a <b>straggler<\/b> is still possible (step 4 may take much longer than step 2). Because branches run concurrently, the runtime is confined to the <b>slowest branch<\/b> rather than the sum — a big win even with imbalance.<\/li><li>One mitigation: if an execution is <b>too simple<\/b>, <b>merge it into the plan<\/b> to form bigger parallelizable chunks — itself an optimization to explore across stages.<\/li><li>Cross-stage optimization of this balancing was not analyzed.<\/li><\/ul><p><b>Task dependence:<\/b> exploitable parallelism depends on the <b>width of the tree<\/b>. The sequential-token ratio is lower for <b>math<\/b> than for <b>GPQA<\/b>, i.e. some tasks are inherently more parallel. Reported reduction of sequential tokens is around <b>40%<\/b> with comparable accuracy.<\/p>","terms":["straggler","load balancing","critical path","tree width","task-dependent parallelism","40% token reduction","chunk merging"]},"zh":{"title":"SPRINT 问答：Straggler、负载均衡与任务相关的宽度","problem":"并行分支的运行时间往往不相等，因此一个慢的 straggler 就会抹掉延迟收益；而且可被利用的并行性在不同任务间并不一致。","why":"关键路径由最慢的分支决定，因此部署需要针对 straggler 的缓解措施，并根据任务结构设定现实的预期。","how":"缓解措施包括把极其简单的 executions 合并进 plan，以形成更大的并行块；即便如此，某个 step 仍可能成为 straggler（例如 step 4 远大于 step 2），而运行时间由最慢分支而非总和决定。树的宽度取决于任务：数学的顺序 token 比例低于 GPQA，说明其固有的并行性更强。据报告，在准确率相当的情况下，顺序 token 减少了约 40%。","detail":"<p><b>Straggler / 负载均衡问题：<\/b>如何确保相互独立的 plans 在相近的时间内运行？<\/p><ul><li>存在一些措施，但 <b>straggler<\/b> 仍可能出现（step 4 可能比 step 2 耗时多得多）。由于分支并发运行，运行时间被限制在<b>最慢分支<\/b>而非总和——即使不均衡这也是巨大胜利。<\/li><li>一种缓解措施：如果某个 execution <b>过于简单<\/b>，就<b>将它合并进 plan<\/b>，以形成更大的可并行块——这本身也是一个可跨阶段探索的优化点。<\/li><li>这种均衡的跨阶段优化并未被分析。<\/li><\/ul><p><b>任务相关性：<\/b>可被利用的并行性取决于<b>树的宽度<\/b>。<b>数学<\/b>的顺序 token 比例低于 <b>GPQA<\/b>，即某些任务本质上更并行。据报告，在准确率相当的情况下顺序 token 减少约 <b>40%<\/b>。<\/p>","terms":["straggler","负载均衡","关键路径","树宽度","任务相关的并行性","40% token 减少","块合并"]}},{"t":2718,"figs":[{"t":2779,"file":"slides/part05/slide_068.jpg"}],"en":{"title":"SPRINT on Harder Problems, Baselines, and the Tool-Use Regime","problem":"Parallelization may be pointless on easy problems where there is little thinking to overlap, and its advantage must be shown against strong baselines.","why":"Knowing where the method helps (hard, thinking-heavy, tool-heavy problems) tells practitioners when to deploy it and what to compare against.","how":"Savings are larger for problems that need more thinking; when the thinking is short there is little parallelism opportunity and SPRINT can even be worse. Compared against a rejection-fine-tuning (RFT) baseline. The lecture ties this to the Anthropic Sonnet 4.5 system card, whose prompt encourages the model to use tools at least 100 times, and notes inference is moving well beyond 8–10K tokens.","detail":"<p>Where SPRINT pays off:<\/p><ul><li>Savings grow with the amount of <b>thinking<\/b> required; if the generated thinking is short there is <b>less opportunity for parallelism<\/b>, and SPRINT can be <b>worse<\/b> than the baseline.<\/li><li>It shines on <b>harder problems<\/b> that need many <b>parallel tokens<\/b> — the regime where the sequential token count is high.<\/li><li>Comparison baseline includes <b>rejection fine-tuning (RFT)<\/b>.<\/li><\/ul><p>The broader trend cited: the <b>Claude Sonnet 4.5 system card<\/b> prompt apparently encourages the model to use tools <b>as much as possible and at least 100 times<\/b>. Alongside this, problems are being solved with far more than <b>8–10K tokens<\/b>, so overlapping serial work is increasingly valuable.<\/p>","terms":["rejection fine-tuning","RFT","hard problems","Sonnet 4.5 system card","tool use","8-10K tokens","thinking tokens"]},"zh":{"title":"SPRINT 在更难问题、基线与工具使用场景中的表现","problem":"在几乎没有思考可重叠的简单问题上，并行化可能毫无意义，而且它的优势必须通过与强基线对比来体现。","why":"了解该方法在何处有帮助（困难、思考密集、工具密集的问题），能让实践者知道何时部署它、以及应与什么对比。","how":"需要更多思考的问题节省更多；当思考很短时并行机会就少，SPRINT 甚至可能更差。与 rejection-fine-tuning（RFT）基线进行比较。讲座将这一点与 Anthropic Sonnet 4.5 的 system card 联系起来，其 prompt 鼓励模型至少使用工具 100 次，并指出推理正远远超出 8–10K tokens。","detail":"<p>SPRINT 见效之处：<\/p><ul><li>节省随所需<b>思考<\/b>量增长；如果生成的思考很短，<b>并行机会就更少<\/b>，SPRINT 可能比基线<b>更差<\/b>。<\/li><li>它在需要大量<b>并行 token<\/b> 的<b>更难问题<\/b>上表现出色——即顺序 token 数量很高的场景。<\/li><li>比较基线包括 <b>rejection fine-tuning（RFT）<\/b>。<\/li><\/ul><p>引用的更广泛趋势：<b>Claude Sonnet 4.5 system card<\/b> 的 prompt 显然鼓励模型<b>尽可能多地、至少 100 次<\/b>使用工具。与此同时，问题正以远超 <b>8–10K tokens<\/b> 的方式被解决，因此重叠串行工作越来越有价值。<\/p>","terms":["rejection fine-tuning","RFT","难题","Sonnet 4.5 system card","工具使用","8-10K tokens","thinking tokens"]}},{"t":2826,"figs":[],"en":{"title":"SPRINT Inference Mechanics, Training-Data Alignment, and RL Outlook","problem":"It is unclear whether inference decodes all steps at once (truly parallel) or keeps emitting plans one after another while only the executions overlap.","why":"Clarifying the mechanism prevents over-claiming parallelism: the model still generates tokens sequentially; what is parallelized is tool/environment execution.","how":"During inference the model still generates plans sequentially: it emits plan 1 and plan 2 first (once plan 1 is emitted its execution starts, then plan 2's), results return to context, then it generates two more plans. Training mirrors this prompting format, placing independent plan 1 and plan 2 side by side with execution 1 and execution 2. The lecturer notes RL/GRPO could yield much more benefit from the same data than SFT.","detail":"<p><b>Inference mechanics (student question):<\/b><\/p><ul><li>The model learns to generate plans that can be executed in parallel, but it still takes a <b>sequential approach to generating plans<\/b>: it outputs plan 1 and plan 2; once plan 1 is emitted its execution starts, then plan 2's, and the results return to context before the next pair of plans is generated.<\/li><li>The difference from the baseline: it is <b>trained to emit independent plans together<\/b>, and the executions then proceed concurrently.<\/li><li><b>Training alignment:<\/b> the training data shows plan 1 and plan 2 next to each other and execution 1 and execution 2 together, so what the model sees during training matches the inference prompt format.<\/li><\/ul><p><b>Future work:<\/b> the paper uses SFT, but <b>RL/GRPO<\/b> could extract more benefit from this data and improve generalization; overlapping different tools to realize real wall-clock speedups is another open implementation direction.<\/p>","terms":["inference mechanics","sequential plan generation","training alignment","RL","GRPO","wall-clock speedup","tool overlap"]},"zh":{"title":"SPRINT 推理机制、训练数据对齐与 RL 展望","problem":"目前不清楚推理是一次性解码所有步骤（真正并行），还是继续一个接一个地输出 plans、只有 executions 重叠。","why":"澄清机制可避免夸大并行性：模型仍然顺序生成 token；被并行化的是工具/环境执行。","how":"推理时，模型仍然顺序生成 plans：它先输出 plan 1 和 plan 2（plan 1 一经输出其 execution 就开始，接着是 plan 2 的），结果返回 context，然后它再生成两个 plans。训练与这种提示格式一致，将相互独立的 plan 1 和 plan 2 与 execution 1 和 execution 2 并排放置。讲师指出，与 SFT 相比，RL/GRPO 能从同一份数据中获得更多收益。","detail":"<p><b>推理机制（学生提问）：<\/b><\/p><ul><li>模型学会生成可以并行执行的 plans，但它仍采用<b>顺序方式生成 plans<\/b>：它输出 plan 1 和 plan 2；plan 1 一经输出其 execution 就开始，接着是 plan 2 的，结果返回 context 后再生成下一对 plans。<\/li><li>与基线的区别：它被<b>训练为将相互独立的 plans 一起输出<\/b>，随后 executions 并发进行。<\/li><li><b>训练对齐：<\/b>训练数据把 plan 1 和 plan 2 并排放置、execution 1 和 execution 2 放在一起，因此模型在训练时看到的与推理 prompt 格式一致。<\/li><\/ul><p><b>未来工作：<\/b>论文使用的是 SFT，但 <b>RL/GRPO<\/b> 可以从这份数据中获取更多收益并提升泛化；重叠不同工具以实现真正的 wall-clock 加速是另一个开放的实现方向。<\/p>","terms":["推理机制","顺序 plan 生成","训练对齐","RL","GRPO","wall-clock 加速","工具重叠"]}},{"t":2985,"figs":[{"t":3023,"file":"slides/part05/slide_076.jpg"},{"t":3035,"file":"slides/part05/slide_077.jpg"},{"t":3058,"file":"slides/part05/slide_078.jpg"},{"t":3167,"file":"slides/part05/slide_079.jpg"},{"t":3237,"file":"slides/part05/slide_080.jpg"}],"en":{"title":"SWIRL Introduction: Multi-Step Reasoning with Tools, and Design Goals","problem":"Many real-world tasks require coordinated multi-step reasoning and tool use, where errors compound across steps and tools are slow, flaky, and hard to use during training.","why":"Existing fine-tuning regimes (RLHF, RLAIF, execution feedback) are optimized for single-step tasks with a final-answer reward, giving no governance over the intermediate process.","how":"SWIRL (to appear at COLM, Montreal) is a training method for multi-step reasoning + tool use. Design goals: solve complex multi-step tasks; know when to call a tool and how to form the query; maintain per-step accuracy; recover from errors; know when to stop and answer; avoid live tools during training; and generalize to new tools and tasks.","detail":"<p><b>SWIRL<\/b> is presented as a training method that fine-tunes a language model for multi-step reasoning, continuing the synthetic-data thread from SPRINT.<\/p><p><b>Motivating tasks:<\/b> multi-hop QA with a search engine, math problem solving, software engineering projects, trip planning, data analysis — tasks where humans reason with tools repeatedly.<\/p><p><b>Challenges:<\/b> even a single reasoning-and-tool step is complicated; across many steps, <b>errors and complications compound<\/b>. Using tools live during training is hard because tools <b>fail, are slow, and have bugs<\/b>, which slows an already expensive training loop. Single-step RLHF/RLAIF optimize the final answer and back-propagate to actions without process governance.<\/p><p><b>Design goals:<\/b> know <b>when<\/b> to call a tool, generate the <b>right query<\/b>, carry out steps accurately, <b>recover from error<\/b>, know <b>when to stop<\/b> and answer, avoid using tools during training, and <b>generalize<\/b> to new tools/tasks.<\/p>","terms":["SWIRL","COLM","tool use","multi-hop QA","compounding errors","single-step RLHF","process governance","generalization"]},"zh":{"title":"SWIRL 简介：结合工具的多步推理与设计目标","problem":"许多真实世界任务需要协调的多步推理与工具使用，其中误差会跨步骤累积，而且工具在训练期间往往缓慢、不稳定且难以使用。","why":"现有的 fine-tuning 范式（RLHF、RLAIF、execution feedback）针对带最终答案奖励的单步任务进行优化，对中间过程没有任何治理。","how":"SWIRL（将在 Montreal 的 COLM 上发表）是一种用于多步推理 + 工具使用的训练方法。设计目标：解决复杂的多步任务；知道何时调用工具以及如何构造查询；保持每步的准确率；从错误中恢复；知道何时停止并作答；训练期间避免使用实时工具；并能泛化到新的工具和任务。","detail":"<p><b>SWIRL<\/b> 被介绍为一种对语言模型进行 fine-tune 以实现多步推理的训练方法，延续了 SPRINT 的合成数据脉络。<\/p><p><b>动机任务：<\/b>使用搜索引擎的多跳 QA、数学问题求解、软件工程项目、旅行规划、数据分析——这些都是人类反复借助工具进行推理的任务。<\/p><p><b>挑战：<\/b>即便单个推理加工具步骤也很复杂；跨多个步骤时，<b>误差与复杂性会累积<\/b>。在训练期间实时使用工具很困难，因为工具会<b>失败、缓慢且有 bug<\/b>，从而拖慢本就昂贵的训练循环。单步 RLHF/RLAIF 优化最终答案并反向传播到动作，却没有过程治理。<\/p><p><b>设计目标：<\/b>知道<b>何时<\/b>调用工具、生成<b>正确的查询<\/b>、准确执行每一步、<b>从错误中恢复<\/b>、知道<b>何时停止<\/b>并作答、训练期间避免使用工具，并能<b>泛化<\/b>到新的工具/任务。<\/p>","terms":["SWIRL","COLM","工具使用","多跳 QA","误差累积","单步 RLHF","过程治理","泛化"]}},{"t":3274,"figs":[{"t":3289,"file":"slides/part05/slide_081.jpg"}],"en":{"title":"SWIRL Synthetic Data Generation via Iterative Prompting","problem":"Supervision for multi-step tool use is scarce, and existing single-step datasets do not capture the trajectory-level reasoning/tool structure.","why":"Collecting trajectories by having the model take one action at a time, with real environment responses interleaved, produces exactly the multi-step, annotated data needed for training.","how":"Given a prompt, let the model take one step at a time and tell it at each step that it may (a) reason/free chain-of-thought, (b) call a tool, or (c) propose a final answer. Show the environment's response, then re-prompt with the original prompt plus prior action and result. Iterating builds trajectories of varying depth (1–5 steps) across many queries.","detail":"<p><b>Step 1 of SWIRL: create synthetic multi-step data.<\/b><\/p><ul><li>At each step, prompt the model with the original task and the list of available tools, and tell it it may: produce a <b>reasoning / chain-of-thought<\/b> step, <b>call a tool<\/b>, or emit a <b>final answer<\/b> if ready.<\/li><li>The model takes the first action (reasoning followed by a tool call), then the <b>environment response is shown back<\/b> to it.<\/li><li>Re-prompt with the original prompt, the previous action, and the tool result, and let the model take the next action or finalize.<\/li><li>This <b>iterative prompting<\/b> by design produces trajectories whose length varies with the query — e.g. <b>1, 3, 5<\/b> steps.<\/li><\/ul><p>The resulting corpus is a set of multi-step, tool-annotated trajectories that can be generated at scale <b>offline<\/b> (many questions processed in parallel). This is the substrate on which the reward labeling and filtering stages operate.<\/p>","terms":["iterative prompting","synthetic data","chain of thought","tool call","final answer","environment response","trajectory length"]},"zh":{"title":"SWIRL 通过迭代提示生成合成数据","problem":"多步工具使用的监督数据稀缺，且现有的单步数据集无法捕捉轨迹级别的推理/工具结构。","why":"让模型一次采取一个动作、并交错插入真实环境响应来收集轨迹，恰好能产生训练所需的多步、带标注数据。","how":"给定一个 prompt，让模型一次走一步，并在每一步告诉它可以（a）推理/自由 chain-of-thought、（b）调用工具，或（c）提出最终答案。展示环境的响应，然后用原始 prompt 加上之前的动作和结果重新提示。迭代即可在许多查询上构建深度不一的轨迹（1–5 步）。","detail":"<p><b>SWIRL 的第一步：创建合成的多步数据。<\/b><\/p><ul><li>在每一步，用原始任务和可用工具列表提示模型，并告诉它可以：产生一个<b>推理 / chain-of-thought<\/b> 步骤、<b>调用工具<\/b>，或在准备好时输出<b>最终答案<\/b>。<\/li><li>模型采取第一个动作（推理后跟一次工具调用），然后<b>环境响应被展示回<\/b>给它。<\/li><li>用原始 prompt、上一个动作和工具结果重新提示，让模型采取下一个动作或给出最终答案。<\/li><li>这种<b>迭代提示<\/b>按设计会产生长度随查询而变的轨迹——例如 <b>1、3、5<\/b> 步。<\/li><\/ul><p>由此得到的语料是一组多步、带工具标注的轨迹，可以<b>离线<\/b>大规模生成（许多问题并行处理）。这正是奖励标注与过滤阶段所操作的基底。<\/p>","terms":["迭代提示","合成数据","chain of thought","工具调用","最终答案","环境响应","轨迹长度"]}},{"t":3397,"figs":[{"t":3513,"file":"slides/part05/slide_084.jpg"}],"en":{"title":"SWIRL Process Rewards, Filtering Schemes, and the RL Example","problem":"Raw synthetic trajectories need labels that measure step quality, and it is unclear whether to keep trajectories by step quality or by final-answer correctness.","why":"How you filter selects which behaviors get reinforced: process filtering rewards good intermediate actions, while outcome filtering rewards lucky correct endings — and the two produce different models.","how":"Ask an LLM judge, given prior context and the current action, to estimate a per-step reward for the reasoning + tool call. Build datasets filtered by process (every step judged good), by outcome (final answer correct), by both, or random. Then train with multi-step RL on a concrete example: 'Who is older, Glenn or Rossling?' — search the first person's age, then the second's, then emit the answer.","detail":"<p><b>Labeling:<\/b> use an <b>LLM-as-a-judge<\/b> to assign each step a reward — given the prior context and the current reasoning step + tool call, estimate how good the trajectory/action is. This is done <b>offline<\/b> for many questions in parallel.<\/p><p><b>Filtering variants<\/b> for the training data:<\/p><ul><li><b>Process filter<\/b> — keep trajectories where the judge rated <b>every step<\/b> as good.<\/li><li><b>Outcome filter<\/b> — keep trajectories whose <b>final answer is correct<\/b>, regardless of per-step labels.<\/li><li><b>Both<\/b>, and a <b>random<\/b> baseline.<\/li><\/ul><p>Training is <b>multi-step reinforcement learning<\/b>. Worked example: <i>Who is older, Glenn or Rossling?<\/i> — action 1 searches the first person's age (get a reward), the environment result is shown, action 2 searches the second person's age (another reward), and the final action emits the answer inside answer tags, which gets its own reward.<\/p>","terms":["LLM as a judge","process reward","process filter","outcome filter","multi-step RL","reward per step","answer tags"]},"zh":{"title":"SWIRL 过程奖励、过滤方案与 RL 示例","problem":"原始合成轨迹需要能衡量步骤质量的标签，而且不清楚应当按步骤质量还是按最终答案正确性来保留轨迹。","why":"过滤方式决定了哪些行为会得到强化：process filtering 奖励良好的中间动作，而 outcome filtering 奖励碰巧正确的结局——两者会产生不同的模型。","how":"让 LLM judge 在给定先前 context 与当前动作的情况下，为推理 + 工具调用估计一个 per-step reward。构建按 process（每一步都被判定为好）、按 outcome（最终答案正确）、两者兼顾或随机的过滤数据集。然后用多步 RL 在一个具体示例上训练：“Who is older, Glenn or Rossling?”——先搜索第一个人的年龄，再搜索第二个人的，然后输出答案。","detail":"<p><b>标注：<\/b>使用 <b>LLM-as-a-judge<\/b> 为每一步分配奖励——给定先前 context 与当前推理步骤 + 工具调用，估计该轨迹/动作有多好。这一过程对许多问题并行地<b>离线<\/b>完成。<\/p><p>训练数据的<b>过滤变体<\/b>：<\/p><ul><li><b>Process filter<\/b>——保留 judge 将<b>每一步<\/b>都评为好的轨迹。<\/li><li><b>Outcome filter<\/b>——保留<b>最终答案正确<\/b>的轨迹，不论每步标签如何。<\/li><li><b>两者兼顾<\/b>，以及一个<b>随机<\/b>基线。<\/li><\/ul><p>训练方式是<b>多步强化学习<\/b>。示例：<i>Who is older, Glenn or Rossling?<\/i>——action 1 搜索第一个人的年龄（获得奖励），展示环境结果，action 2 搜索第二个人的年龄（再获得奖励），最后一个动作在 answer 标签内输出答案，它有自己的奖励。<\/p>","terms":["LLM as a judge","过程奖励","process filter","outcome filter","多步 RL","每步奖励","answer 标签"]}},{"t":3613,"figs":[{"t":3828,"file":"slides/part05/slide_085.jpg"}],"en":{"title":"SWIRL Training Without Live Tool Calls, and the Objective","problem":"Executing tools during RL is slow, failure-prone, and not even necessary if the reward can be assigned from the proposed query alone.","why":"Decoupling tool execution from the optimization loop removes the biggest source of instability and cost, while a query-quality reward is sufficient because judging whether a query is reasonable does not require the tool's output.","how":"All tool calls are performed during offline data annotation. During RL, the model proposes the next action and receives the precomputed reward; the judge scores the <b>quality of the query<\/b> (e.g. 'age of this person' is a sensible search) rather than the tool's output. The objective maximizes the expected reward of a single action given all prior context (states + actions), for actions 1..K.","detail":"<p><b>How SWIRL avoids live tool calls:<\/b> the trajectory — prompt, actions, tool calls, and environment responses — is collected <b>offline<\/b>. During RL the model generates the next action (e.g. up to action 1) but the action is <b>not executed<\/b>; instead the precomputed reward is used for optimization.<\/p><ul><li>The tool calls all happen during the <b>data annotation<\/b> phase, outside RL fine-tuning.<\/li><li><b>Why the judge can score without running the tool:<\/b> it evaluates the <b>query the model generates<\/b>, not the tool's output. For 'age of person X', the judge can decide that this is a reasonable query <b>before seeing the result<\/b>; it does not need to know the actual age.<\/li><li>So the reward is <b>process feedback<\/b>, and the tool-call resources are captured in the prior context.<\/li><\/ul><p><b>Objective:<\/b> optimize the <b>expected reward of a single action<\/b> given all context so far (the set of prior states and actions), across actions 1 through K.<\/p>","terms":["offline annotation","no live tool calls","query quality","process feedback","expected reward","multi-step RL","context"]},"zh":{"title":"SWIRL 无需实时工具调用的训练与目标函数","problem":"在 RL 期间执行工具很慢、容易失败，而且如果仅凭所提出的查询就能分配奖励，那甚至没有必要执行。","why":"将工具执行与优化循环解耦，消除了不稳定与成本的最大来源，而查询质量奖励已经足够，因为判断一个查询是否合理并不需要工具的输出。","how":"所有工具调用都在离线数据标注阶段完成。在 RL 期间，模型提出下一个动作并接收预先计算好的奖励；judge 为<b>查询的质量<\/b>（例如“this person 的年龄”是一个合理的搜索）打分，而不是为工具的输出打分。目标是在给定所有先前 context（states + actions）的情况下，最大化单个动作的期望奖励，覆盖 actions 1..K。","detail":"<p><b>SWIRL 如何避免实时工具调用：<\/b>轨迹——prompt、actions、tool calls 和 environment responses——是<b>离线<\/b>收集的。在 RL 期间，模型生成下一个动作（例如到 action 1），但该动作<b>不会被执行<\/b>；而是使用预先计算好的奖励进行优化。<\/p><ul><li>所有工具调用都发生在<b>数据标注<\/b>阶段，位于 RL fine-tuning 之外。<\/li><li><b>为什么 judge 无需运行工具就能打分：<\/b>它评估的是<b>模型生成的查询<\/b>，而不是工具的输出。对于“person X 的年龄”，judge 可以在<b>看到结果之前<\/b>就判定这是一个合理的查询；它不需要知道实际年龄。<\/li><li>因此奖励是<b>过程反馈<\/b>，而工具调用的资源已被捕获在先前的 context 中。<\/li><\/ul><p><b>目标：<\/b>在给定目前为止所有 context（先前 states 与 actions 的集合）的情况下，优化<b>单个动作的期望奖励<\/b>，覆盖 actions 1 到 K。<\/p>","terms":["离线标注","无实时工具调用","查询质量","过程反馈","期望奖励","多步 RL","context"]}},{"t":3858,"figs":[{"t":3941,"file":"slides/part05/slide_086.jpg"}],"en":{"title":"SWIRL Inference: Tag-Driven Iterative Tool Use","problem":"At deployment the model must actually use tools, decide when to stop, and hand off to a final answer without a human in the loop.","why":"The tags learned during training give a clean control interface: the runtime can detect a tool request, execute it, and feed the result back, or detect readiness to answer.","how":"Prompt the SWIRL-trained model with the input question and the available tool (e.g. a calculator) and instruct it to emit a mathematical query in special tags when useful, or an answer tag when ready. Step 1: the model calls the calculator with the math expression. The tool is executed and its output returned; the model is prompted again with the question, prior thinking, and tool result, and iterates until it emits the final answer.","detail":"<p>Inference uses the same iterative-prompting interface as data generation:<\/p><ul><li>Give the model the input questions and specify the tool it may use (here a <b>calculator<\/b>): <i>if you think it would help, generate a mathematical query enclosed in these tags<\/i>.<\/li><li>Also tell it: <i>once you have enough information you can generate an answer tag and produce the final answer<\/i>.<\/li><li><b>Step 1:<\/b> the model responds by calling the calculator with the arithmetic it wants to run; the tool is <b>executed with that input<\/b> and its output is returned.<\/li><li>Re-prompt with the original question, the result so far, and the tool spec: <i>if you're ready, answer; otherwise continue using the tool<\/i>.<\/li><li>Repeat until the model emits the <code>answer<\/code> tag.<\/li><\/ul><p>This is the deployment-time mirror of the training traces: the model, not the harness, decides <b>when<\/b> to invoke the tool and <b>when<\/b> to stop.<\/p>","terms":["iterative prompting","calculator","query tags","answer tag","tool execution","termination","inference"]},"zh":{"title":"SWIRL 推理：标签驱动的迭代式工具使用","problem":"部署时，模型必须真正使用工具、决定何时停止，并在无人介入的情况下交付最终答案。","why":"训练中学到的标签提供了干净的控制接口：runtime 可以检测到工具请求、执行它并将结果回馈，或检测到已准备好作答。","how":"用输入问题和可用工具（例如 calculator）提示 SWIRL 训练过的模型，并指示它在有用时用特殊标签输出一个数学查询，或在准备好时输出 answer 标签。Step 1：模型用数学表达式调用 calculator。工具被执行并返回其输出；再用问题、先前的思考和工具结果提示模型，如此迭代直到它输出最终答案。","detail":"<p>推理使用与数据生成相同的迭代提示接口：<\/p><ul><li>给模型输入问题，并指定它可以使用的工具（这里是 <b>calculator<\/b>）：<i>如果你认为有帮助，请生成一个用这些标签包裹的数学查询<\/i>。<\/li><li>还要告诉它：<i>一旦拥有足够信息，你就可以生成一个 answer 标签并给出最终答案<\/i>。<\/li><li><b>Step 1：<\/b>模型通过用它想运行的算术表达式调用 calculator 来回应；工具<b>以该输入被执行<\/b>并返回其输出。<\/li><li>用原始问题、目前的结果和工具说明重新提示：<i>如果准备好了就作答，否则继续使用工具<\/i>。<\/li><li>重复直到模型输出 <code>answer<\/code> 标签。<\/li><\/ul><p>这是训练轨迹在部署时的镜像：由模型而非 harness 决定<b>何时<\/b>调用工具、<b>何时<\/b>停止。<\/p>","terms":["迭代提示","calculator","query 标签","answer 标签","工具执行","终止","推理"]}},{"t":3976,"figs":[{"t":3988,"file":"slides/part05/slide_087.jpg"},{"t":4086,"file":"slides/part05/slide_094.jpg"}],"en":{"title":"SWIRL Experimental Setup and the Filtering Finding","problem":"Which filtering scheme actually produces the best trained model — process-only, outcome-only, both, or random?","why":"The answer reveals that for RL, process-quality signal dominates: training only on already-correct outcomes teaches little about problems the base model could not solve.","how":"Setup: a 227B model creates the synthetic multi-step data; questions come from HotpotQA and GSM8K; ~50K trajectories are generated and then filtered by process, outcome, both, or random. Result: process-filtered data helps most — surprisingly more than outcome-filtered or both — because filtering to already-correct outcomes does not teach the model to solve problems it previously failed.","detail":"<p><b>Experimental setup:<\/b><\/p><ul><li>A <b>227B<\/b> model is used to create the multi-step synthetic data.<\/li><li>Questions come from <b>HotpotQA<\/b> and <b>GSM8K<\/b>.<\/li><li>About <b>50K trajectories<\/b> are generated, with variants filtered by <b>process<\/b>, by <b>outcome<\/b>, by <b>both<\/b>, or <b>randomly<\/b>.<\/li><\/ul><p><b>Key (initially counter-intuitive) finding:<\/b> training on <b>process-filtered<\/b> data — steps majority-approved by the LLM judge, without requiring the final answer to be correct — helped <b>more<\/b> than rigorously keeping only correct-outcome or process-and-outcome-correct trajectories.<\/p><ul><li>Reason: if you only keep trajectories whose outcome the model already gets right, you are not helping it solve problems it <b>cannot<\/b> yet solve; you are only reinforcing what it knows.<\/li><li>Process-filtered data instead shows the model <b>how to think differently<\/b> about such problems (good intermediate moves toward answers it could not reach).<\/li><\/ul>","terms":["227B model","HotpotQA","GSM8K","50K trajectories","process filter","outcome filter","filtering impact"]},"zh":{"title":"SWIRL 实验设置与过滤发现","problem":"哪种过滤方案实际能训练出最好的模型——仅 process、仅 outcome、两者兼顾，还是随机？","why":"答案揭示了对于 RL，过程质量信号占主导：仅在已经正确的结局上训练，几乎无法教会模型解决 base model 无法解决的问题。","how":"设置：一个 227B 模型创建合成的多步数据；问题来自 HotpotQA 和 GSM8K；生成约 50K 条轨迹，然后按 process、outcome、两者兼顾或随机进行过滤。结果：process-filtered 数据帮助最大——出乎意料地超过 outcome-filtered 或两者兼顾——因为过滤到已经正确的结局并不能教会模型解决它此前失败的问题。","detail":"<p><b>实验设置：<\/b><\/p><ul><li>使用一个 <b>227B<\/b> 模型创建多步合成数据。<\/li><li>问题来自 <b>HotpotQA<\/b> 和 <b>GSM8K<\/b>。<\/li><li>生成约 <b>50K 条轨迹<\/b>，其变体按 <b>process<\/b>、按 <b>outcome<\/b>、按 <b>两者兼顾<\/b>或<b>随机<\/b>进行过滤。<\/li><\/ul><p><b>关键（起初反直觉）发现：<\/b>在 <b>process-filtered<\/b> 数据上训练——即步骤被 LLM judge 多数认可、但不要求最终答案正确——帮助<b>更大<\/b>，超过严格只保留正确结局或过程与结果都正确的轨迹。<\/p><ul><li>原因：如果你只保留模型已经答对的结局的轨迹，就无法帮助它解决<b>尚不能<\/b>解决的问题；只是在强化它已知的东西。<\/li><li>process-filtered 数据反而向模型展示了<b>如何以不同方式思考<\/b>这类问题（朝着它无法到达的答案迈出良好的中间步骤）。<\/li><\/ul>","terms":["227B 模型","HotpotQA","GSM8K","50K 轨迹","process filter","outcome filter","过滤影响"]}},{"t":4098,"figs":[{"t":4182,"file":"slides/part05/slide_089.jpg"},{"t":4240,"file":"slides/part05/slide_090.jpg"},{"t":4319,"file":"slides/part05/slide_091.jpg"},{"t":4327,"file":"slides/part05/slide_092.jpg"},{"t":4335,"file":"slides/part05/slide_093.jpg"}],"en":{"title":"SWIRL Cross-Domain Generalization, Scaling, and Process Improvement","problem":"Does SWIRL learn a specific tool, or a general skill of multi-step tool use? And does more synthetic data keep helping?","why":"Cross-domain transfer and favorable synthetic-data scaling are the strongest evidence that the method teaches transferable step-by-step tool use rather than memorizing one tool.","how":"Trained on GSM8K with a calculator, SWIRL is tested on HotpotQA with a search tool: accuracy rises from 65 to 75.1; trained on HotpotQA with search, it improves on GSM8K from 65 to 73 — and vice versa. Increasing synthetic data from 100 to 10,000 training examples keeps improving a completely different task. Process reward per step rises both in- and out-of-distribution.","detail":"<p><b>Generalization results:<\/b><\/p><ul><li>SWIRL trained on <b>GSM8K<\/b> (calculator tool), then tested on <b>HotpotQA<\/b> (search tool): accuracy goes from <b>65 → 75.1<\/b>.<\/li><li>Using HotpotQA's own tooling, the gain is <b>65 → 73<\/b>.<\/li><li>The reverse also holds: train on <b>HotpotQA with a search tool<\/b>, and it improves on <b>GSM8K with Python<\/b>.<\/li><li>Interpretation: what transfers is not one tool but the ability to <b>think in steps and invoke a tool<\/b>; the test sets are separate from training data.<\/li><\/ul><p><b>Synthetic-data scaling:<\/b> increasing training data from <b>100 to 10,000<\/b> examples (trained on HotpotQA + search) continues to improve accuracy on the different math task <b>GSM8K<\/b> — cited as the paper's most important graph.<\/p><p><b>Why it improves:<\/b> the average <b>process reward per step<\/b> rises after RL, both <b>in-distribution<\/b> (HotpotQA) and <b>out-of-distribution<\/b> (GSM8K), i.e. the model reasons more correctly at each step.<\/p>","terms":["cross-domain generalization","GSM8K","HotpotQA","search tool","Python","synthetic data scaling","process reward","in-distribution","out-of-distribution"]},"zh":{"title":"SWIRL 跨域泛化、规模扩展与过程改进","problem":"SWIRL 学到的是某个特定工具，还是多步工具使用的通用技能？更多合成数据是否持续有帮助？","why":"跨域迁移与有利的合成数据扩展是最有力的证据，表明该方法教的是可迁移的逐步工具使用，而不是记住某一个工具。","how":"在 GSM8K 上用 calculator 训练后，SWIRL 在带搜索工具的 HotpotQA 上测试：准确率从 65 升到 75.1；在带搜索的 HotpotQA 上训练后，它在 GSM8K 上从 65 提升到 73——反之亦然。将合成数据从 100 增加到 10,000 个训练样本，仍能持续改善一个完全不同的任务。每步的 process reward 在分布内和分布外都有上升。","detail":"<p><b>泛化结果：<\/b><\/p><ul><li>SWIRL 在 <b>GSM8K<\/b>（calculator 工具）上训练，然后在 <b>HotpotQA<\/b>（搜索工具）上测试：准确率从 <b>65 → 75.1<\/b>。<\/li><li>使用 HotpotQA 自己的工具时，增益为 <b>65 → 73<\/b>。<\/li><li>反向也成立：在带搜索工具的 <b>HotpotQA<\/b> 上训练，它在带 Python 的 <b>GSM8K<\/b> 上也有提升。<\/li><li>解读：迁移的不是某个工具，而是<b>分步思考并调用工具<\/b>的能力；测试集与训练数据是分离的。<\/li><\/ul><p><b>合成数据扩展：<\/b>将训练数据从 <b>100 增加到 10,000<\/b> 个样本（在 HotpotQA + 搜索上训练）持续提升另一个不同的数学任务 <b>GSM8K<\/b> 的准确率——被引为该论文最重要的图表。<\/p><p><b>为何会提升：<\/b>RL 之后平均<b>每步 process reward<\/b> 上升，无论在<b>分布内<\/b>（HotpotQA）还是<b>分布外<\/b>（GSM8K），即模型在每一步推理得更正确。<\/p>","terms":["跨域泛化","GSM8K","HotpotQA","搜索工具","Python","合成数据扩展","process reward","分布内","分布外"]}},{"t":4351,"figs":[{"t":4421,"file":"slides/part05/slide_096.jpg"},{"t":4454,"file":"slides/part05/slide_097.jpg"}],"en":{"title":"SWIRL: RL Beats SFT, and Lecture Summary","problem":"Given the same synthetic data, does multi-step RL actually beat supervised fine-tuning, and does the choice of filtering interact with the training algorithm?","why":"RL allows the model to try a new action given prior steps and get rewarded for it, so it can escape bad trajectories that imitation learning would simply copy.","how":"Multi-step RL beats SFT by a good margin. For SFT, the data needed to be correct (both process- and outcome-filtered), because SFT is imitation learning — incorrect outcomes hurt. RL instead gives the model a new chance at each step and rewards the new action, so it can break out of the imitation trap. Summary: SWIRL generalizes across datasets and tools, transfers to disparate tasks, and learns better from process-filtered synthetic data.","detail":"<p><b>RL vs SFT:<\/b> the entire pipeline could be run with supervised fine-tuning, but <b>multi-step RL does better by a good margin<\/b>.<\/p><ul><li>For <b>SFT<\/b>, the training data needed to be <b>correct<\/b> — both process- and outcome-filtered worked better than process-only data — which makes sense because SFT is <b>imitation learning<\/b>: showing the model trajectories to repeat, so incorrect outcomes hurt.<\/li><li><b>RL<\/b> gives the model a <b>new chance at each step<\/b>: given the prior steps it takes a new action and is rewarded for that action, so it can <b>break out<\/b> of a bad trajectory rather than imitating it.<\/li><\/ul><p><b>Lecture summary (SWIRL):<\/b><\/p><ul><li>Generalizes <b>across datasets and tools<\/b> and transfers to disparate tasks.<\/li><li>Learns better from <b>process-filtered<\/b> data.<\/li><li>Gains from more <b>synthetic data<\/b>, both in-domain and out-of-domain.<\/li><li>After fine-tuning, <b>process correctness per step improves<\/b> for both in-distribution and out-of-distribution data.<\/li><\/ul><p>Closing remark: multi-step reasoning and planning is a very active, fast-moving field.<\/p>","terms":["RL vs SFT","imitation learning","process-filtered","outcome-filtered","break out","process correctness","summary"]},"zh":{"title":"SWIRL：RL 胜过 SFT，以及课程总结","problem":"在相同合成数据下，多步 RL 是否真的胜过 supervised fine-tuning，过滤方式的选择是否与训练算法相互作用？","why":"RL 允许模型在给定先前步骤的情况下尝试新动作并因此获得奖励，因此它能摆脱 imitation learning 只会照抄的坏轨迹。","how":"多步 RL 以可观的优势胜过 SFT。对 SFT 而言，数据需要是正确的（process 和 outcome 双重过滤），因为 SFT 是 imitation learning——错误的结局会带来伤害。RL 则为模型在每一步提供新机会并奖励新动作，因此它能跳出 imitation 陷阱。总结：SWIRL 跨数据集与工具泛化，能迁移到差异很大的任务，并能从 process-filtered 合成数据中学得更好。","detail":"<p><b>RL vs SFT：<\/b>整条流水线也可以用 supervised fine-tuning 来跑，但<b>多步 RL 以可观的优势表现更好<\/b>。<\/p><ul><li>对 <b>SFT<\/b> 而言，训练数据需要是<b>正确的<\/b>——process 与 outcome 双重过滤比仅 process 效果更好——这很合理，因为 SFT 是 <b>imitation learning<\/b>：给模型展示轨迹让它重复，因此错误的结局会带来伤害。<\/li><li><b>RL<\/b> 给模型<b>在每一步的新机会<\/b>：在给定先前步骤的情况下采取新动作，并因该动作获得奖励，因此它能<b>跳出<\/b>坏轨迹，而不是去模仿它。<\/li><\/ul><p><b>课程总结（SWIRL）：<\/b><\/p><ul><li>跨<b>数据集与工具<\/b>泛化，并能迁移到差异很大的任务。<\/li><li>从 <b>process-filtered<\/b> 数据中学得更好。<\/li><li>受益于更多<b>合成数据<\/b>，无论域内还是域外。<\/li><li>fine-tune 之后，<b>每步的过程正确性都有提升<\/b>，对分布内和分布外数据均是如此。<\/li><\/ul><p>结束语：多步推理与规划是一个非常活跃、快速发展的领域。<\/p>","terms":["RL vs SFT","imitation learning","process-filtered","outcome-filtered","跳出","过程正确性","总结"]}}]},{"n":6,"id":"yVnmHSAy3ck","duration":4355,"slideCount":50,"en":{"title":"Train-Time Scaling and Scaling RL","summary":"This lecture closes the loop from test-time scaling to train-time scaling: let a model learn from its own outputs, filter them cleverly, and feed the survivors back as training data. It works through three papers. STaR bootstraps reasoning by keeping final-answer-correct rationales and rationalizing failures backward from the known answer, at the cost of being off-policy and plateauing. DeepSeek-Math primes a code-pretrained model with curated Common Crawl math, then scales RL with GRPO, a critic-free group-normalized advantage that lifts MATH from 46.8 to 51.7. DAPO documents the RL implementation details GRPO left implicit — asymmetric clipping, dynamic sampling, token-level loss, soft overlong punishment — and climbs AIME on Qwen 32B from 30 to 50 without entropy collapse. Recurring themes: verifiable rewards, reward distribution and hill-climbing signal, KL regularization, entropy as exploration, and RL raising majority@k rather than pass@k."},"zh":{"title":"训练时扩展与 Scaling RL","summary":"本节讲座把 test-time scaling 到 train-time scaling 的闭环补全：让模型从自身输出中学习，巧妙地过滤这些输出，再把存活下来的样本作为训练数据回灌。讲座围绕三篇论文展开。STaR 通过保留最终答案正确的 rationale、并针对失败样本从已知答案反向构造 rationale 来引导（bootstrap）推理，代价是 off-policy 且性能会进入平台期。DeepSeek-Math 先用精心筛选的 Common Crawl 数学数据对代码预训练模型做 priming，再用 GRPO 扩展 RL——一种无需 critic、组归一化的 advantage，把 MATH 从 46.8 提升到 51.7。DAPO 把 GRPO 未明确说明的 RL 实现细节逐一写清楚——非对称裁剪、动态采样、token 级损失、软性超长惩罚——并在 Qwen 32B 上把 AIME 从 30 提升到 50，且未发生 entropy 崩溃。反复出现的主题：可验证奖励、奖励分布与爬山（hill-climbing）信号、KL 正则化、把 entropy 视为探索，以及 RL 提升的是 majority@k 而非 pass@k。"},"sections":[{"t":5,"figs":[{"t":8,"file":"slides/part06/slide_002.jpg"},{"t":52,"file":"slides/part06/slide_004.jpg"}],"en":{"title":"Lecture Framing: Closing the Loop from Test-Time to Train-Time Scaling","problem":"The previous lectures optimized how a frozen model is used at inference — feedback loops, tool and code use, robust verification — but never changed the weights, so the loop from verification back into the model stayed open.","why":"If a model can learn from its own filtered outputs, capability can keep improving after pre-training and preference tuning; the class is built around those self-improvement mechanisms.","how":"Three papers structure the lecture: STaR (bootstrapping reasoning with rationales), DeepSeek-Math (curated math priming plus GRPO), and DAPO (stabilizing large-scale RL for long reasoning chains).","detail":"<p>Opening framing for CS329A lecture 6, <b>Train-Time Scaling and Scaling RL<\/b>.<\/p><ul><li>The course so far covered <b>test-time scaling<\/b>, feedback using tools and code, and <b>robust verification<\/b> — all inference-time techniques on a fixed model.<\/li><li>Today closes the loop: the model's outputs are filtered and used to improve the model itself, which is why the class is called <b>self-improving AI agents<\/b>.<\/li><li>Three papers: <code>STaR<\/code> (Stanford), which puts rationales into problems to boost reasoning; <code>DeepSeek-Math<\/code>, on mathematical reasoning in language models (introduces GRPO); and a third paper on stabilizing RL when reasoning chains get long (DAPO).<\/li><li>The through-line: verifiability turns generated traces into training signal, and the amount of train-time compute can substitute for parameter count.<\/li><\/ul>","terms":["train-time scaling","test-time scaling","robust verification","self-improving agents","STaR","DeepSeek-Math","DAPO"]},"zh":{"title":"讲座框架：补全从 test-time 到 train-time scaling 的闭环","problem":"此前的讲座优化的是冻结模型在推理阶段的使用方式——反馈循环、工具与代码的使用、鲁棒验证——但从未改变权重，因此从验证回灌到模型内部的闭环始终是断开的。","why":"如果模型能够从自身经过滤的输出中学习，那么能力就能在预训练与偏好调优之后继续提升；本课程正是围绕这些自我改进机制构建的。","how":"三篇论文构成本讲的结构：STaR（用 rationale 引导推理）、DeepSeek-Math（筛选数学数据做 priming 加 GRPO）、DAPO（为长推理链稳定大规模 RL）。","detail":"<p>CS329A 第 6 讲的开场框架，<b>Train-Time Scaling and Scaling RL<\/b>。<\/p><ul><li>课程到目前为止覆盖了 <b>test-time scaling<\/b>、使用工具与代码的反馈，以及 <b>robust verification<\/b>——全部都是针对固定模型的推理期技术。<\/li><li>今天要补全闭环：模型的输出经过滤后用于改进模型自身，这正是本课程被称为 <b>self-improving AI agents<\/b> 的原因。<\/li><li>三篇论文：<code>STaR<\/code>（Stanford），把 rationale 放入问题以增强推理；<code>DeepSeek-Math<\/code>，关于语言模型中的数学推理（提出 GRPO）；以及第三篇关于在推理链变长时稳定 RL 的论文（DAPO）。<\/li><li>贯穿主线：可验证性（verifiability）把生成的 trace 转化为训练信号，而 train-time compute 的数量可以替代参数量。<\/li><\/ul>","terms":["训练时扩展（train-time scaling）","测试时扩展（test-time scaling）","鲁棒验证（robust verification）","self-improving agents","STaR","DeepSeek-Math","DAPO"]}},{"t":71,"figs":[{"t":76,"file":"slides/part06/slide_007.jpg"}],"en":{"title":"AIME and the Small-Model Surprise","problem":"The parameter-scaling story predicts that bigger models are more accurate, yet on hard math small reasoning-tuned models massively outperform far larger non-reasoning ones.","why":"If a 7B model can beat a 175B model on AIME, then capability is not only about parameters — how the model is trained on its own outputs matters just as much.","how":"The motivating benchmark is AIME 2024/2025 (MATH is saturated and contaminated). GPT-3.5 sits near 5%; DeepSeek-Math 7B reaches 51.7%, 60% with extra tricks; DAPO on Qwen 32B reaches 50%.","detail":"<p>The lecture grounds the papers in <b>AIME 2024/2025<\/b>, chosen because the older MATH benchmark is saturated and contaminated (most models have trained on it).<\/p><ul><li><b>GPT-3.5<\/b>, believed to be ~<b>175B<\/b> parameters, scores about <b>5%<\/b> on AIME.<\/li><li><b>DeepSeek-Math<\/b>, a <b>7B<\/b> model using train-time scaling, reaches <b>51.7%<\/b>, and <b>60%<\/b> with additional tricks.<\/li><li><b>DAPO<\/b>, the third paper, reaches <b>50%<\/b> on a <b>Qwen 32B<\/b> model.<\/li><li>The contradiction with lecture 1: there, scaling parameter count raised benchmark accuracy; here, much smaller models are very performant because of train-time techniques.<\/li><\/ul><p>The pivot question the lecture answers: how did these smaller models become so accurate, and what <b>train-time scaling<\/b> tricks got them there? A recurring warning is that naive RL on reasoning usually fails because the <b>implementation details<\/b> are hard to get right.<\/p>","terms":["AIME 2024/2025","MATH","GPT-3.5","DeepSeek-Math","DAPO","Qwen 32B","contamination"]},"zh":{"title":"AIME 与小模型的意外表现","problem":"参数扩展的叙事预测模型越大越准确，但在困难数学任务上，经过推理调优的小模型却大幅超越规模大得多的非推理模型。","why":"如果 7B 模型能在 AIME 上击败 175B 模型，那么能力就不只取决于参数量——模型如何基于自身输出进行训练同样重要。","how":"作为切入点的基准是 AIME 2024/2025（MATH 已饱和且被污染）。GPT-3.5 约为 5%；DeepSeek-Math 7B 达到 51.7%，加上额外技巧可达 60%；DAPO 在 Qwen 32B 上达到 50%。","detail":"<p>讲座把这几篇论文锚定在 <b>AIME 2024/2025<\/b> 上，选择它是因为旧的 MATH 基准已饱和且被污染（大多数模型都在其上训练过）。<\/p><ul><li><b>GPT-3.5<\/b> 据信约有 <b>175B<\/b> 参数，在 AIME 上得分约 <b>5%<\/b>。<\/li><li><b>DeepSeek-Math<\/b> 是一个使用 train-time scaling 的 <b>7B<\/b> 模型，达到 <b>51.7%<\/b>，加上额外技巧可达 <b>60%<\/b>。<\/li><li>第三篇论文 <b>DAPO<\/b> 在 <b>Qwen 32B<\/b> 模型上达到 <b>50%<\/b>。<\/li><li>与第 1 讲的矛盾：那里扩大参数量提升了基准准确率；这里小得多的模型因为 train-time 技术而表现极佳。<\/li><\/ul><p>讲座要回答的关键问题：这些小模型是如何变得如此准确的，又是哪些 <b>train-time scaling<\/b> 技巧把它们带到这一步？一个反复出现的警告是：对推理做朴素 RL 通常会失败，因为 <b>实现细节<\/b> 很难做对。<\/p>","terms":["AIME 2024/2025","MATH","GPT-3.5","DeepSeek-Math","DAPO","Qwen 32B","数据污染（contamination）"]}},{"t":210,"figs":[{"t":256,"file":"slides/part06/slide_009.jpg"}],"en":{"title":"Three Key Insights Behind Train-Time Scaling","problem":"Naive RL on reasoning underperforms, and the failure is routinely blamed on tuning rather than on a small set of identifiable design choices.","why":"Reasoning RL needs a usable signal from the model's own outputs instead of gold traces, and it is unusually sensitive to implementation details that only bite at scale.","how":"The lecture isolates three insights: learn from your own outputs with clever filtering; let training compute substitute for parameters; and treat RL implementation details as decisive when scaling up.","detail":"<p>Three insights frame the entire lecture:<\/p><ul><li><b>Learn from your own outputs.<\/b> Pre-training fed the model internet text; if you instead let it learn from its own outputs and <b>filter them cleverly<\/b>, you can improve it further — hence self-improving AI agents.<\/li><li><b>Train-time compute substitutes for parameters.<\/b> The compute invested in training on a model's own outputs can compensate for model size, paralleling the earlier result that giving smaller models more data improves certain benchmarks.<\/li><li><b>RL is not supervised learning.<\/b> With reinforcement learning you must be very careful about implementation details; as you scale the algorithms, small fixes (loss shaping, clipping, sampling) become extremely important.<\/li><\/ul><p>These three points motivate the paper order: STaR shows the filtered-output loop cheaply, DeepSeek-Math shows correct RL at scale, and DAPO shows the small fixes that make large-scale RL stable.<\/p>","terms":["self-improving agents","filtering","compute for parameters","RL implementation details","pre-training","data scaling"]},"zh":{"title":"Train-Time Scaling 背后的三个关键洞见","problem":"对推理做朴素 RL 效果不佳，而这种失败常被归咎于调参，而非一小撮可识别的设计选择。","why":"推理 RL 需要从模型自身输出中获得可用信号，而非依赖 gold trace，并且它对那些只在大规模下才暴露的实现细节异常敏感。","how":"讲座提炼出三个洞见：通过巧妙过滤从自身输出中学习；让训练算力替代参数量；以及在扩展规模时把 RL 实现细节视为决定性因素。","detail":"<p>三个洞见贯穿整讲：<\/p><ul><li><b>从自身输出中学习。<\/b> 预训练给模型喂的是互联网文本；如果改为让它从自身输出中学习并 <b>巧妙地过滤<\/b>，就能进一步提升——这正是 self-improving AI agents 的由来。<\/li><li><b>Train-time compute 替代参数量。<\/b> 投入在模型自身输出上训练所用的算力可以补偿模型规模，这与早先给更小的模型更多数据能提升某些基准的结论相呼应。<\/li><li><b>RL 不是监督学习。<\/b> 使用强化学习时必须非常小心实现细节；随着算法规模扩大，小的修正（loss shaping、裁剪、采样）会变得极其重要。<\/li><\/ul><p>这三点决定了论文的讲述顺序：STaR 以低成本展示过滤输出的闭环，DeepSeek-Math 展示大规模下正确的 RL，DAPO 展示让大规模 RL 稳定的那些小修正。<\/p>","terms":["self-improving agents","过滤（filtering）","用算力换参数（compute for parameters）","RL 实现细节（RL implementation details）","预训练（pre-training）","数据扩展（data scaling）"]}},{"t":267,"figs":[{"t":285,"file":"slides/part06/slide_010.jpg"}],"en":{"title":"Three Training Paradigms and the Core Train-Time Loop","problem":"It is easy to conflate pre-training, preference fine-tuning, and inference-time tricks; the lecture needs a clean separation and a single memorable loop.","why":"Train-time scaling is defined by what it does with test-time outputs — it takes the filtered survivors and fine-tunes on them, converting a one-shot inference win into a weight update.","how":"The three paradigms are pre-training (internet text), fine-tuning / RLHF (chatbots from preference or RLHF/RLAIF data), and test-time scaling (majority voting, inference-time sampling, combining traces). The loop is: generate, filter, fine-tune, repeat.","detail":"<p>Three paradigms are contrasted:<\/p><ul><li><b>Pre-training<\/b> — training the model on internet text (covered in lecture 1, not detailed here).<\/li><li><b>Fine-tuning / RLHF<\/b> — how chatbots are produced, fine-tuning or doing RL with human feedback / RLAIF on preference data.<\/li><li><b>Test-time scaling<\/b> — inference-based techniques such as majority voting and inference-time sampling, then combining the outputs; this is what homework 1 exercises.<\/li><\/ul><p><b>Train-time scaling<\/b> is defined as taking what the model output <i>after<\/i> applying the test-time filter and fine-tuning further on it. The single takeaway loop: the model generates outputs, a verifier or test-time filter selects, you fine-tune on the survivors, and you repeat. &ldquo;If you take nothing away from this entire lecture but you just remember this loop, then you kind of have learned the basics of what train-time scaling does.&rdquo;<\/p>","terms":["pre-training","RLHF","RLAIF","test-time scaling","majority voting","train-time loop"]},"zh":{"title":"三种训练范式与核心的 train-time 闭环","problem":"人们很容易把预训练、偏好微调与推理期技巧混为一谈；讲座需要清晰的区分和一个便于记忆的闭环。","why":"Train-time scaling 的定义就在于它如何处理 test-time 输出——它取过滤后存活的样本进行微调，把一次性的推理收益转化为权重更新。","how":"三种范式是预训练（互联网文本）、微调 / RLHF（用偏好数据或 RLHF/RLAIF 数据训练聊天机器人），以及 test-time scaling（多数投票、推理期采样、组合 trace）。闭环是：生成、过滤、微调、重复。","detail":"<p>对比三种范式：<\/p><ul><li><b>预训练<\/b>——在互联网文本上训练模型（第 1 讲已覆盖，此处不再展开）。<\/li><li><b>微调 / RLHF<\/b>——聊天机器人的产生方式，在偏好数据上做微调或用人类反馈 / RLAIF 做 RL。<\/li><li><b>Test-time scaling<\/b>——基于推理的技术，如多数投票与推理期采样，然后把输出组合起来；这正是作业 1 所练习的内容。<\/li><\/ul><p><b>Train-time scaling<\/b> 的定义是：取模型在应用 test-time 过滤器<i>之后<\/i>的输出，并在此基础上进一步微调。唯一需要记住的闭环：模型生成输出，verifier 或 test-time 过滤器进行选择，你在存活样本上微调，然后重复。&ldquo;如果你从整讲中什么都不带走，只记住这个闭环，那么你基本就学到了 train-time scaling 的核心。&rdquo;<\/p>","terms":["预训练（pre-training）","RLHF","RLAIF","test-time scaling","多数投票（majority voting）","train-time 闭环（train-time loop）"]}},{"t":347,"figs":[{"t":374,"file":"slides/part06/slide_086.jpg"}],"en":{"title":"Audience Question and the o1/Qwen Compute-Scaling Curves","problem":"A student asks how to balance a fixed compute budget between train-time and test-time scaling, and whether train-time returns flatten at some point.","why":"The answer determines how to spend money: test-time compute is cheap to add but only re-ranks samples, while train-time compute changes the weights. The lecturer defers the full trade-off to the third paper.","how":"o1 plots put AIME pass@1 on the y-axis against train-time compute (left) and test-time compute (right), both log-scaled; increasing either raises accuracy and increasing both composes. Qwen showed the same pattern, enabling a generate-and-feed-back loop.","detail":"<p>The student's question — what is the good balance between train-time and test-time scaling, and does ROI flatten? — is explicitly deferred to the third paper (DAPO), where the trade-offs are revisited.<\/p><ul><li>The motivating plot is <b>o1<\/b>: AIME <b>pass@1<\/b> on the y-axis, compute on the x-axis, with <b>train-time compute on the left<\/b> and <b>test-time compute on the right<\/b>, both log-linear.<\/li><li>More inference-time compute gives better pass@1; more train-time compute also improves pass@1; the two compose, enabling a loop that generates model outputs and feeds them back to improve the model on the benchmark.<\/li><li><b>Qwen<\/b> showed the same combined improvement for AIME.<\/li><li>A caution planted for later: the quantities are not always intuitive, and vendor plots are not always reliable — reference to OpenAI's release graphs.<\/li><\/ul>","terms":["compute allocation","pass@1","log-linear scaling","train-time compute","test-time compute","o1","Qwen"]},"zh":{"title":"听众提问与 o1/Qwen 的算力扩展曲线","problem":"学生问：如何在固定的算力预算下权衡 train-time 与 test-time scaling，以及 train-time 的收益是否会在某个点开始趋于平缓。","why":"答案决定了钱该怎么花：test-time compute 添加成本低，但只能对样本重新排序，而 train-time compute 会改变权重。讲者把完整的权衡留到第三篇论文讨论。","how":"o1 的图把 AIME pass@1 放在 y 轴，分别对 train-time compute（左）和 test-time compute（右）作图，两者均为对数尺度；增加任一者都能提升准确率，两者叠加也有效。Qwen 呈现了相同模式，从而支持生成并回灌的闭环。","detail":"<p>学生的问题——train-time 与 test-time scaling 之间良好的平衡是什么，ROI 是否会趋于平缓？——被明确推迟到第三篇论文（DAPO）中，届时会重新讨论这些权衡。<\/p><ul><li>作为引入的图是 <b>o1<\/b>：y 轴为 AIME <b>pass@1<\/b>，x 轴为算力，<b>左侧是 train-time compute<\/b>，<b>右侧是 test-time compute<\/b>，两者都是对数线性。<\/li><li>更多推理期算力带来更好的 pass@1；更多 train-time 算力同样改善 pass@1；两者可以叠加，从而形成一个在基准上生成模型输出并回灌以改进模型的闭环。<\/li><li><b>Qwen<\/b> 在 AIME 上展现了相同的组合式提升。<\/li><li>为后文埋下的警示：这些量并不总是符合直觉，厂商的图也不总是可靠——此处指 OpenAI 发布时的图。<\/li><\/ul>","terms":["算力分配（compute allocation）","pass@1","对数线性扩展（log-linear scaling）","train-time compute","test-time compute","o1","Qwen"]}},{"t":438,"figs":[],"en":{"title":"Why the Loop Closes: Verifiability","problem":"The generate-filter-fine-tune loop only works if the filter can reliably tell correct from incorrect outputs; an unreliable filter would feed noise into the weights.","why":"Math is a domain with verifiability — there is a ground-truth answer — so the model can label its own outputs and select the correct ones to train on.","how":"Because final answers can be checked, the correct outputs are fed into train-time scaling; the method therefore works best in verifiable domains. This is the robust-verification thread from the earlier lecture.","detail":"<p>The mechanism that lets train-time scaling work at all: <b>verifiability<\/b>.<\/p><ul><li>Math has a checkable final answer, so you can know which outputs are correct and which are not, and choose the correct ones to feed into train-time scaling.<\/li><li>This is a direct callback to the earlier lecture on <b>robust verification<\/b>: verification is what makes the filter trustworthy.<\/li><li>Consequence: the technique works better in domains with verifiability (math, code, data analysis) than in open-ended ones without a checkable signal.<\/li><li>Trade-off to remember: if the verifier is weak, the filter itself becomes the bottleneck and the loop can reinforce wrong reasoning.<\/li><\/ul>","terms":["verifiability","robust verification","final-answer check","filter","reward signal"]},"zh":{"title":"闭环为何成立：可验证性","problem":"生成-过滤-微调的闭环只有在过滤器能可靠区分正确与错误输出时才成立；不可靠的过滤器会把噪声灌进权重。","why":"数学是一个具备可验证性的领域——存在 ground-truth 答案——因此模型能标注自己的输出并选出正确的那些用于训练。","how":"由于最终答案可以核对，正确的输出会被送入 train-time scaling；因此该方法在可验证领域效果最好。这就是早前讲座中鲁棒验证这条线索。","detail":"<p>让 train-time scaling 得以运作的根本机制：<b>可验证性<\/b>。<\/p><ul><li>数学有可核对的最终答案，因此你知道哪些输出正确、哪些不正确，并选出正确的输出送入 train-time scaling。<\/li><li>这直接呼应了先前关于 <b>robust verification<\/b> 的讲座：验证才使过滤器可信。<\/li><li>结果：该技术在具备可验证性的领域（数学、代码、数据分析）比在缺乏可核对信号的开放式领域效果更好。<\/li><li>需要记住的权衡：如果 verifier 较弱，过滤器本身就成为瓶颈，闭环可能强化错误的推理。<\/li><\/ul>","terms":["可验证性（verifiability）","鲁棒验证（robust verification）","最终答案核对（final-answer check）","过滤器（filter）","奖励信号（reward signal）"]}},{"t":460,"figs":[{"t":463,"file":"slides/part06/slide_016.jpg"},{"t":496,"file":"slides/part06/slide_017.jpg"}],"en":{"title":"What Chain-of-Thought Buys and Where It Pays Off","problem":"Models without long chains of thought cannot solve hard problems, and the improvements from reasoning are uneven across domains.","why":"Reasoning tokens are spent on problem analysis, task decomposition, self-evaluation, backtracking, and trying alternative approaches — a somewhat parallel search that needs some sense of whether a solution is correct.","how":"Thinking models (o1, Gemini Flash Thinking, and peers) emit these patterns naturally. Win rate over non-thinking GPT-4o exceeds 50% in verifiable domains (programming, data analysis, math) but shows little gain for personal writing and editing.","detail":"<p>Thinking models solve hard problems by spending tokens on <b>chain of thought<\/b>:<\/p><ul><li><b>Problem analysis<\/b> — for a bash script that prints a matrix transpose, the model first infers the input/output format before solving.<\/li><li><b>Task decomposition<\/b> — parse the string, build the matrix, transpose, format the output; overkill for the toy case but valuable as tasks grow.<\/li><li><b>Self-evaluation and self-correction<\/b> — computing the pH of a solution, the model realizes its formula is wrong and revises it; it can backtrack to a previous step and try a different approach.<\/li><li>This amounts to a <b>somewhat parallel search<\/b> over approaches, which requires the model to have some sense of whether a solution is correct.<\/li><\/ul><p>Empirically, win rate versus non-thinking <b>GPT-4o<\/b> exceeds 50% in verifiable domains (computer programming, data analysis, mathematical calculation) but sees little gain for personal writing/editing. Domains that can verify and close the loop benefit most.<\/p>","terms":["chain of thought","problem analysis","task decomposition","self-correction","backtracking","win rate","GPT-4o"]},"zh":{"title":"Chain-of-Thought 带来了什么，以及在哪些领域见效","problem":"没有长 chain of thought 的模型无法解决困难问题，而推理带来的提升在不同领域间并不均衡。","why":"推理 token 被花在问题分析、任务分解、自我评估、回退（backtracking）以及尝试不同方法上——这是一种略显并行的搜索，需要模型对解是否正确有一定判断。","how":"思考型模型（o1、Gemini Flash Thinking 等同侪）会自然地产生这些模式。在可验证领域（编程、数据分析、数学）中，相对非思考型 GPT-4o 的胜率超过 50%，但在个人写作与编辑上几乎没有增益。","detail":"<p>思考型模型通过在 <b>chain of thought<\/b> 上花费 token 来解决困难问题：<\/p><ul><li><b>问题分析<\/b>——对于一个打印矩阵转置的 bash 脚本，模型会先推断输入/输出格式，然后再求解。<\/li><li><b>任务分解<\/b>——解析字符串、构建矩阵、转置、格式化输出；对这个小例子来说是杀鸡用牛刀，但随着任务变复杂就很有价值。<\/li><li><b>自我评估与自我纠正<\/b>——在计算溶液的 pH 时，模型意识到自己的公式有误并加以修正；它还可以回退到之前的步骤并尝试不同方法。<\/li><li>这相当于在不同方法上做 <b>一种略显并行的搜索<\/b>，而这要求模型对解是否正确有一定判断。<\/li><\/ul><p>经验上，在可验证领域（计算机编程、数据分析、数学计算）中，相对非思考型 <b>GPT-4o<\/b> 的胜率超过 50%，但在个人写作/编辑上几乎没有增益。能够验证并闭合闭环的领域获益最大。<\/p>","terms":["chain of thought","问题分析（problem analysis）","任务分解（task decomposition）","自我纠正（self-correction）","回退（backtracking）","胜率（win rate）","GPT-4o"]}},{"t":700,"figs":[],"en":{"title":"Audience Skepticism and Restating the Fundamentals","problem":"A student notices the o1 plot looks suspicious — performance at zero train-time compute appears better than at finite train-time compute — and the class pushes on whether test-time or train-time compute is the better investment.","why":"The tension matters: test-time compute is cheap and, with a good verifier, can be scaled almost without bound; train-time compute instead changes the weights, but only if the loop has enough successes to bootstrap.","how":"The speaker concedes the plot is one instantiation and not always reliable, then restates the fundamentals: test-time compute is inference-only, train-time boosts pass@1, and both need robust verification to close the loop.","detail":"<p>The class challenges the curve: performance at zero train-time compute looks better than at finite train-time compute. The lecturer agrees it is one instantiation, says it is not always right (the field's curves have been wrong in latest releases), and moves on.<\/p><p>Restating the fundamentals:<\/p><ul><li><b>Test-time compute is cheap to add.<\/b> Train a model, run many inferences, and if one answer is correct and you have a good verifier, you can scale compute nearly without bound — cf. AlphaCode-style search (next Friday's topic).<\/li><li><b>The closed loop needs enough successes.<\/b> If the model essentially never produces a correct sample, train-time scaling has nothing to bootstrap from.<\/li><li><b>A caveat:<\/b> test-time compute works well only where verifiability is robust; otherwise you must make the model reason better, and you still need verification loops.<\/li><li>Net: with train-time scaling you boost <b>pass@1<\/b> so the correct output is more likely, but verification of the loop is still required.<\/li><\/ul>","terms":["AlphaCode","pass@1","closed feedback loop","robust verifiability","test-time compute","bootstrap"]},"zh":{"title":"听众的质疑与对基本原理的重申","problem":"一名学生注意到 o1 的图看起来可疑——零 train-time compute 时的性能似乎比有限 train-time compute 时更好——课堂上进而追问 test-time 还是 train-time compute 更值得投入。","why":"这种张力很重要：test-time compute 成本低，且有好的 verifier 时可以几乎无上限地扩展；而 train-time compute 改变的是权重，但前提是闭环中有足够多的成功样本可供 bootstrap。","how":"讲者承认那张图只是一个实例，且并不总是可靠，随后重申基本原理：test-time compute 仅作用于推理，train-time 提升 pass@1，两者都需要鲁棒验证才能闭合闭环。","detail":"<p>课堂上对这条曲线提出质疑：零 train-time compute 时的性能看起来比有限 train-time compute 时更好。讲者承认那只是一个实例，并表示它并不总是正确（该领域的曲线在最新发布中曾出错），随后继续讲下去。<\/p><p>重申基本原理：<\/p><ul><li><b>Test-time compute 添加成本低。<\/b> 训练一个模型，运行大量推理，只要有一个答案正确且你有好的 verifier，就能几乎无上限地扩展算力——参见 AlphaCode 式的搜索（下周五的主题）。<\/li><li><b>闭环需要足够多的成功样本。<\/b> 如果模型基本上从不产生正确样本，train-time scaling 就没有可 bootstrap 的基础。<\/li><li><b>一个注意点：<\/b> test-time compute 只有在可验证性足够鲁棒时才有效；否则你必须让模型推理得更好，而且仍然需要验证闭环。<\/li><li>总之：借助 train-time scaling 你提升了 <b>pass@1<\/b>，使正确输出更可能出现，但闭环的验证仍然必不可少。<\/li><\/ul>","terms":["AlphaCode","pass@1","闭环反馈（closed feedback loop）","鲁棒可验证性（robust verifiability）","test-time compute","bootstrap"]}},{"t":924,"figs":[],"en":{"title":"Audience Q: Regression on Easy Problems and Overthinking","problem":"Fine-tuning a model to solve difficult problems better could plausibly regress its performance on easier problems, since all weights update.","why":"This is the classic capability/retention trade-off, and it foreshadows the RL concern about drifting away from behaviors the model already had.","how":"The lecturer's answer: there should not normally be regression on easy problems unless the reasoning chains break down — the specific failure mode being repetitive chains known as overthinking.","detail":"<p>The student asks whether teaching the model to solve hard problems regresses simpler ones — a worry that resurfaces for every post-training method in the lecture.<\/p><ul><li>The lecturer holds the deep version for the papers but answers the direct case: typically there should be <b>no regression<\/b>, because solving harder problems should not damage easy ones.<\/li><li>The exception is when the model goes into <b>reasoning chains that are completely broken<\/b> — repetitive chains — a failure mode called <b>overthinking<\/b>. Repetitive, non-productive traces can consume the budget and degrade answers the model previously handled.<\/li><li>This is the same concern later addressed with <b>KL divergence<\/b> and other regularization in GRPO/DAPO, and it is a recurring motivation for keeping <b>entropy<\/b> and <b>response length<\/b> under control.<\/li><li>It also connects to the DAPO length/truncation fixes: if a model learns to emit ever-longer chains, quality can drop even as training reward rises.<\/li><\/ul>","terms":["regression","overthinking","repetitive reasoning","KL divergence","catastrophic forgetting"]},"zh":{"title":"听众提问：简单问题上的性能回退与 overthinking","problem":"微调模型以更好地解决困难问题，有可能使其在更简单问题上的性能回退，因为所有权重都会更新。","why":"这是经典的能力/保持权衡，也预示了 RL 中关于偏离模型已有行为的担忧。","how":"讲者的回答：通常不应在简单问题上出现回退，除非推理链崩溃——这种具体的失败模式就是被称为 overthinking 的重复链。","detail":"<p>学生问：教模型解决困难问题是否会使其在更简单问题上回退——这是本讲中每一种后训练方法都会重新引发的担忧。<\/p><ul><li>讲者把深入版本留到论文部分，但先回答了直接的情形：通常<b>不应出现回退<\/b>，因为解决更难的问题不应损害简单问题。<\/li><li>例外情况是模型陷入<b>完全崩溃的推理链<\/b>——重复的链——这种失败模式被称为 <b>overthinking<\/b>。重复、无产出的 trace 会消耗预算，并让模型此前能处理的答案变差。<\/li><li>这与后文在 GRPO/DAPO 中用 <b>KL divergence<\/b> 及其他正则化处理的是同一个担忧，也是持续把 <b>entropy<\/b> 和 <b>response length<\/b> 控制住的动机。<\/li><li>它还与 DAPO 的长度/截断修正相关：如果模型学会输出越来越长的链，即使训练奖励上升，质量也可能下降。<\/li><\/ul>","terms":["性能回退（regression）","overthinking","重复推理（repetitive reasoning）","KL divergence","灾难性遗忘（catastrophic forgetting）"]}},{"t":968,"figs":[{"t":985,"file":"slides/part06/slide_031.jpg"}],"en":{"title":"Paper 1, STaR: Motivation and the Rationale Data Bottleneck","problem":"Getting models to produce strong step-by-step rationales is bottlenecked by data: internet-scale corpora contain very few reasoning steps, and human annotation of rationales is expensive.","why":"Few-shot prompting with a handful of reasoning examples underperforms fine-tuning on much larger datasets that lack reasoning chains, and automating rationale generation from known solution patterns works only in very narrow domains.","how":"STaR (Stanford) attacks the data problem by bootstrapping rationales from the model's own generations, filtered by whether the final answer is correct.","detail":"<p>STaR starts from chain-of-thought: asking a model to show its work step by step gives <b>interpretability<\/b> and boosts mathematical and commonsense reasoning on several benchmarks.<\/p><p>The data bottleneck:<\/p><ul><li>No internet-scale dataset really contains <b>reasoning steps<\/b>; only a few sources have large-scale rationales.<\/li><li>Manually annotating reasoning steps is very expensive — it literally requires humans.<\/li><li>Automating rationale generation from known solution patterns works only in very specific domains.<\/li><li><b>Few-shot prompting<\/b> with a few problem/rationale/answer examples still underperforms models fine-tuned on much larger datasets, so a small reasoning set does not cut it.<\/li><\/ul><p>Hence the goal: obtain reasoning data without human annotation, by filtering the model's own outputs with a final-answer check.<\/p>","terms":["STaR","chain of thought","rationales","few-shot prompting","data bottleneck","self-improving agents"]},"zh":{"title":"论文 1，STaR：动机与 rationale 数据瓶颈","problem":"让模型产出高质量的逐步 rationale 受制于数据：互联网规模的语料中几乎不含推理步骤，而人工标注 rationale 成本高昂。","why":"用少量推理示例做 few-shot prompting，其效果不如在缺乏推理链但要大得多的数据集上做微调；而从已知解法模式自动生成 rationale 只在非常狭窄的领域可行。","how":"STaR（Stanford）通过从模型自身生成中 bootstrap rationale 来解决数据问题，并以最终答案是否正确进行过滤。","detail":"<p>STaR 从 chain-of-thought 出发：要求模型逐步展示其工作过程可带来 <b>可解释性<\/b>，并在多个基准上提升数学与常识推理。<\/p><p>数据瓶颈：<\/p><ul><li>互联网规模的数据集中实际上并不包含 <b>推理步骤<\/b>；只有少数来源拥有大规模 rationale。<\/li><li>人工标注推理步骤非常昂贵——它确实需要真人来做。<\/li><li>从已知解法模式自动生成 rationale 只在非常特定的领域可行。<\/li><li>用少量问题/rationale/答案示例做 <b>few-shot prompting<\/b>，效果仍不如在更大得多的数据集上微调的模型，因此小规模推理集是不够的。<\/li><\/ul><p>因此目标就是：通过用最终答案核对来过滤模型自身的输出，从而在无需人工标注的情况下获得推理数据。<\/p>","terms":["STaR","chain of thought","rationale","few-shot prompting","数据瓶颈（data bottleneck）","self-improving agents"]}},{"t":1065,"figs":[{"t":1084,"file":"slides/part06/slide_032.jpg"},{"t":1109,"file":"slides/part06/slide_035.jpg"},{"t":1186,"file":"slides/part06/slide_040.jpg"}],"en":{"title":"STaR: Generate, Filter Correct, Rationalize Failures, Iterate","problem":"Fine-tuning only on correct examples leaves no signal on problems the model got stuck on, so it cannot learn to solve new, harder problems.","why":"Failed attempts still carry information, but the model produced no correct reasoning path; outcome-only filtering discards exactly the problems at the edge of its capability.","how":"STaR generates solutions (say 10k problems), keeps only final-answer-correct ones, fine-tunes, and repeats. For failures it uses rationalization: add the known answer as a hint, ask the model to generate the rationale backward, and train on it as if solved directly.","detail":"<p>The STaR algorithm is deliberately bare-bones:<\/p><ul><li>Start from a small set of examples <b>with rationales<\/b>; generate solutions over a much larger question/answer set (about <b>10k<\/b> is a representative number).<\/li><li>Keep only outputs whose <b>final answer is correct<\/b>; fine-tune on problem → rationale → answer; repeat the loop.<\/li><li><b>Rationalization for failures:<\/b> give the model the answer as a <b>hint<\/b> (&ldquo;the answer is 42, now explain backwards&rdquo;), generate the rationale, and add problem → rationale → answer to the training set as if it had been solved directly — the hint is never shown at inference.<\/li><li>This expands the training set to harder problems than the model can currently solve, so it bootstraps iteratively instead of being capped by easy problems.<\/li><li>The lecture calls it almost an <b>off-policy reinforcement learning<\/b> technique: generate attempts, learn from successful paths, and rationalize failed ones.<\/li><\/ul>","terms":["rationalization","hint","generate-filter-finetune","off-policy RL","bootstrap","10k problems"]},"zh":{"title":"STaR：生成、过滤正确答案、为失败样本构造 rationale、迭代","problem":"只对正确示例做微调，会让模型卡住的问题上没有任何信号，因此它无法学会解决新的、更难的问题。","why":"失败的尝试仍携带信息，但模型没有产出正确的推理路径；仅按结果过滤恰好丢弃了那些处于能力边缘的问题。","how":"STaR 生成解答（比如 1 万个问题），只保留最终答案正确的，进行微调，然后重复。对失败样本它使用 rationalization：把已知答案作为 hint 加入，要求模型反向生成 rationale，并把它当作直接解出来一样用于训练。","detail":"<p>STaR 算法刻意做得极简：<\/p><ul><li>从一小组<b>带 rationale<\/b> 的示例出发；在一个大得多的问题/答案集上生成解答（约 <b>1 万<\/b>是一个有代表性的数量）。<\/li><li>只保留<b>最终答案正确<\/b>的输出；在 问题 → rationale → 答案 上微调；重复该闭环。<\/li><li><b>为失败样本做 rationalization：<\/b> 把答案作为 <b>hint<\/b> 给模型（&ldquo;答案是 42，现在倒着解释&rdquo;），生成 rationale，并把 问题 → rationale → 答案 加入训练集，就像它被直接解出来一样——推理时从不展示这个 hint。<\/li><li>这会把训练集扩展到比模型当前能解决的更难的问题，因此它能迭代地 bootstrap，而不是被简单问题所封顶。<\/li><li>讲座把它称为一种近乎 <b>off-policy reinforcement learning<\/b> 的技术：生成尝试、从成功的路径中学习，并为失败的路径构造 rationale。<\/li><\/ul>","terms":["rationalization","hint","生成-过滤-微调（generate-filter-finetune）","off-policy RL","bootstrap","1 万个问题（10k problems）"]}},{"t":1192,"figs":[],"en":{"title":"STaR as Off-Policy RL and Its Core Assumptions","problem":"STaR's filtering only works if a correct final answer is a good proxy for a good reasoning chain, and if the model can actually produce a valid rationale when given the answer.","why":"These assumptions define the method's failure envelope: on problems far outside the base model's capability, no correct sample and no valid rationale exist, so there is nothing to learn from.","how":"The lecture names three assumptions — final-answer correctness proxies reasoning quality, the model can rationalize from an answer hint, and the initial model is strong enough to bootstrap from few-shot examples — making the iterative aspect essential.","detail":"<p>STaR makes explicit assumptions:<\/p><ul><li><b>Correct answer ⟹ good rationale.<\/b> In math they found this
