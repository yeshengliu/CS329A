文）比 <b>maintainer<\/b> <b>慢 5-18 倍<\/b>，而模型的表现更接近<b>外包人员的时间<\/b>。<\/li><li>含义：模型作为<b>低上下文工作者<\/b>运作，有价值但并非领域专家；当积累的上下文很重要时，模型处于劣势。<\/li><\/ul>","terms":["data contamination","SWE-bench","contractor vs maintainer","messiness","context gap","low-context worker"]}},{"t":1672,"figs":[{"t":1696,"file":"slides/part08/slide_072.jpg"},{"t":1721,"file":"slides/part08/slide_075.jpg"}],"en":{"title":"GDPval: Scoring Real Work Against Experts","problem":"Horizon metrics say nothing about economic usefulness, and there was no quantitative way to measure which professional tasks models can do.","why":"Real work is subjective, multimodal, and context-heavy, so it cannot be reduced to pass/fail unit tests.","how":"GDPval sources real deliverables from professionals with 10+ years experience and scores models by pairwise win rate against those experts.","detail":"<p><b>GDPval<\/b> (OpenAI) flips the question: if a task were handed to the model instead of a professional, is the output <b>good enough<\/b>?<\/p><ul><li>Tasks are real deliverables sourced from professionals with <b>10+ years<\/b> of experience across a broad set of industries.<\/li><li>Scoring is a <b>pairwise win rate<\/b> against those experts, reported as <b>wins+ties<\/b> and <b>wins-only<\/b> preferences.<\/li><li>Because the models are multimodal, the suite includes video, CAD, audio, spreadsheets, and presentations, not just text.<\/li><li>The design deliberately accepts subjectivity: real work is evaluated relative to a human expert rather than a single ground-truth answer, capturing whether output is useful rather than exactly right.<\/li><\/ul>","terms":["GDPval","win rate","pairwise preference","expert","multimodal deliverable"]},"zh":{"title":"GDPval：以真实工作对标专家评分","problem":"跨度指标对经济有用性只字未提，也没有定量方法来衡量模型能完成哪些专业任务。","why":"真实工作具有主观性、多模态且高度依赖上下文，因此无法被化简为 pass/fail 的单元测试。","how":"GDPval 从拥有 10 年以上经验的专业人士处获取真实交付物，并通过与这些专家进行成对胜率比较来为模型评分。","detail":"<p><b>GDPval<\/b>（OpenAI）翻转了问题：如果一个任务被交给模型而非专业人士，其输出是否<b>足够好<\/b>？<\/p><ul><li>任务是从拥有 <b>10 年以上<\/b>经验、横跨广泛行业的专业人士处获取的真实交付物。<\/li><li>评分方式是对这些专家的<b>成对胜率<\/b>，以 <b>wins+ties<\/b> 和 <b>wins-only<\/b> 偏好报告。<\/li><li>由于模型是多模态的，该套件包含视频、CAD、音频、电子表格和演示文稿，而不仅是文本。<\/li><li>该设计刻意接受主观性：真实工作相对于人类专家来评估，而非相对于单一 ground-truth 答案，从而捕捉输出是否有用，而非是否完全正确。<\/li><\/ul>","terms":["GDPval","win rate","pairwise preference","expert","multimodal deliverable"]}},{"t":1746,"figs":[{"t":1751,"file":"slides/part08/slide_078.jpg"}],"en":{"title":"GDPval Example Tasks Across Professions","problem":"Concrete examples are needed to judge which real deliverables are tractable.","why":"Task realism and subjectivity determine whether a win rate is meaningful.","how":"Walk through the suite: manufacturing, finance, nursing, video editing, customer service, concierge, audit, real estate, and recreation tasks, all sourced from professionals.","detail":"<p>Concrete tasks make the abstraction tangible; all are sourced from professionals in their fields.<\/p><ul><li><b>Manufacturing engineer:<\/b> design a 3D model of a cable-reel stand for an assembly line.<\/li><li><b>Financial/investment analyst:<\/b> create the competitive landscape (research heavy).<\/li><li><b>Registered nurse:<\/b> assess images of an issue and produce a consultation report.<\/li><li><b>Film/video editor:<\/b> create an intro reel from a script.<\/li><li><b>Customer service:<\/b> draft an email response to a dissatisfied customer.<\/li><li><b>Concierge:<\/b> build an itinerary for a family of four.<\/li><li><b>Auditor:<\/b> find pricing inconsistencies across purchase orders.<\/li><li><b>Real-estate agent:<\/b> design a sales brochure for a new property.<\/li><li><b>Recreation worker:<\/b> optimize the layout for a vendor fair.<\/li><\/ul><p>These range from objective (audit) to subjective (brochure), which motivates the win-rate metric and the later discussion of context.<\/p>","terms":["manufacturing engineer","competitive landscape","consultation report","vendor fair","sales brochure","audit"]},"zh":{"title":"GDPval 跨职业的示例任务","problem":"需要具体示例来判断哪些真实交付物是可处理的。","why":"任务的真实性（realism）与主观性决定了胜率是否有意义。","how":"逐一走查该套件：制造、金融、护理、视频剪辑、客服、礼宾、审计、房地产和康乐任务，全部来自专业人士。","detail":"<p>具体任务使抽象变得可感知；它们全部来自各领域的专业人士。<\/p><ul><li><b>制造工程师：<\/b>为装配线设计一个电缆卷盘支架的 3D 模型。<\/li><li><b>金融/投资分析师：<\/b>创建竞争格局（研究密集型）。<\/li><li><b>注册护士：<\/b>评估某问题的图像并生成一份咨询报告。<\/li><li><b>电影/视频剪辑师：<\/b>根据脚本制作一段片头短片。<\/li><li><b>客户服务：<\/b>为一位不满的客户起草一封电子邮件回复。<\/li><li><b>礼宾：<\/b>为一个四口之家制定行程。<\/li><li><b>审计员：<\/b>找出采购订单中的定价不一致之处。<\/li><li><b>房地产经纪人：<\/b>为一处新房产设计销售宣传册。<\/li><li><b>康乐工作人员：<\/b>优化一个摊位集市的布局。<\/li><\/ul><p>这些任务从客观（审计）到主观（宣传册）不等，这正是采用胜率指标以及后续讨论上下文的动因。<\/p>","terms":["manufacturing engineer","competitive landscape","consultation report","vendor fair","sales brochure","audit"]}},{"t":1822,"figs":[],"en":{"title":"Subjectivity, Win Rate, and Expert Context","problem":"Many real tasks are subjective, so no single correct answer exists and a model's chosen style may not hold for all cases.","why":"Real work requires both context and subjective judgment; capability and appropriateness are separate questions.","how":"Use pairwise preference versus experts; separate can-models-do-it from should-we-deploy-it; prefer deliverables with a fairly clear working/not-working signal.","detail":"<p>Students note that many tasks are <b>subjective<\/b> -- there may be no single right answer, and a model's chosen style may not hold for all cases. The instructor agrees and separates concerns.<\/p><ul><li>Subjectivity is exactly why GDPval uses a <b>win rate<\/b> rather than pass/fail, and why real work requires both <b>context<\/b> and subjective judgment.<\/li><li>The instructor separates whether models are good at a task from whether we want to use them for <b>ethics/compliance<\/b> -- e.g. legal tasks may be capable but not appropriate to delegate.<\/li><li>Healthcare examples skew to <b>registered nurses/nurse practitioners<\/b> rather than doctors; music composition may appear later but is not in the benchmark yet because <b>verification is hard<\/b>.<\/li><li>The discussion favors deliverables with a <b>fairly clear working/not-working signal<\/b>, which makes grading tractable.<\/li><\/ul>","terms":["subjectivity","win rate","pairwise preference","compliance","verification","multimodal"]},"zh":{"title":"主观性、胜率与专家上下文","problem":"许多真实任务具有主观性，因此不存在唯一正确答案，且模型选定的风格可能并非在所有情况下都成立。","why":"真实工作既需要上下文也需要主观判断；能力与恰当性是彼此独立的问题。","how":"使用与专家的成对偏好；将“模型能否做到”与“我们是否应部署它”区分开；优先选择具有相当清晰可用/不可用信号的交付物。","detail":"<p>学生指出许多任务是<b>主观的<\/b>——可能没有唯一正确答案，且模型选定的风格可能并非在所有情况下都成立。讲师表示同意，并对关注点加以区分。<\/p><ul><li>主观性正是 GDPval 采用<b>胜率<\/b>而非 pass/fail 的原因，也是真实工作需要<b>上下文<\/b>与主观判断的原因。<\/li><li>讲师将“模型是否擅长某任务”与“我们是否愿意将其用于<b>伦理/合规<\/b>”区分开——例如法律任务可能模型有能力做，但委派它并不恰当。<\/li><li>医疗健康领域的示例偏向<b>注册护士/执业护士<\/b>而非医生；音乐创作可能日后出现，但目前尚不在该 benchmark 中，因为<b>验证很困难<\/b>。<\/li><li>讨论倾向于选择具有<b>相当清晰的可用/不可用信号<\/b>的交付物，这使评分变得可处理。<\/li><\/ul>","terms":["subjectivity","win rate","pairwise preference","compliance","verification","multimodal"]}},{"t":2020,"figs":[{"t":2020,"file":"slides/part08/slide_083.jpg"},{"t":2095,"file":"slides/part08/slide_086.jpg"}],"en":{"title":"GDPval Dataset Anatomy: Top 5% of GDP, 220 Tasks","problem":"The suite must represent economically valuable work and be well specified, or win rates reflect prompt artifacts.","why":"Coverage and specification determine whether results generalize to the professions the benchmark claims to measure.","how":"Build top-down across 9 sectors targeting the top 5% of GDP, 44 occupations and ~220 gold tasks, with multimodal artifacts and expert vetting.","detail":"<p>The suite is built top-down to be economically representative:<\/p><ul><li><b>9 sectors<\/b> chosen to target the <b>top 5% of GDP<\/b> -- the most economically valuable tasks.<\/li><li><b>44 occupations<\/b> and roughly <b>220 tasks<\/b> in the open <b>gold set<\/b>, with about <b>60%<\/b> of computer-based <b>O*NET<\/b> tasks included.<\/li><li>Task characteristics: average completion up to <b>~7 hours<\/b>, some spanning <b>weeks<\/b>; text plus <b>multimodal<\/b> artifacts (CAD, video, audio, spreadsheets, presentations); average task value around <b>$400<\/b>.<\/li><li>About <b>70%<\/b> of tasks require <b>interacting with reference files<\/b> to reach the final output.<\/li><li>About <b>89%<\/b> of tasks were <b>vetted by experts<\/b> as well specified -- not ill-specified traps that would fail models for the wrong reason.<\/li><\/ul>","terms":["O*NET","gold set","top 5% of GDP","reference files","multimodal deliverable","task value"]},"zh":{"title":"GDPval 数据集剖析：GDP 前 5%、220 个任务","problem":"该套件必须代表具有经济价值的工作，并且规格明确，否则胜率将反映的是 prompt 造成的假象。","why":"覆盖范围和规格说明决定了结果能否泛化到该 benchmark 声称要衡量的职业。","how":"自顶向下构建，横跨 9 个部门，瞄准 GDP 前 5%，包含 44 种职业和约 220 个黄金任务，配有多模态产物并经过专家审核。","detail":"<p>该套件自顶向下构建，以具有经济代表性：<\/p><ul><li>选择 <b>9 个部门<\/b>以瞄准 <b>GDP 前 5%<\/b>——最具经济价值的任务。<\/li><li>开放 <b>gold set<\/b> 中包含 <b>44 种职业<\/b>和约 <b>220 个任务<\/b>，其中纳入了约 <b>60%<\/b> 基于计算机的 <b>O*NET<\/b> 任务。<\/li><li>任务特征：平均完成时间最长约 <b>7 小时<\/b>，部分跨越<b>数周<\/b>；文本加<b>多模态<\/b>产物（CAD、视频、音频、电子表格、演示文稿）；平均任务价值约为 <b>400 美元<\/b>。<\/li><li>约 <b>70%<\/b> 的任务需要<b>与参考文件交互<\/b>才能得到最终输出。<\/li><li>约 <b>89%<\/b> 的任务被<b>专家审核<\/b>为规格良好——并非规格不清、会让模型因错误原因而失败的陷阱。<\/li><\/ul>","terms":["O*NET","gold set","top 5% of GDP","reference files","multimodal deliverable","task value"]}},{"t":2139,"figs":[{"t":2177,"file":"slides/part08/slide_088.jpg"},{"t":2317,"file":"slides/part08/slide_092.jpg"}],"en":{"title":"GDPval Trend: Linear Win-Rate Growth","problem":"Economic win rate improves far more slowly than METR's exponential horizon story suggests.","why":"Real work requires tacit knowledge and faithful reference-data use, so models cannot substitute fluent generation for grounding.","how":"Plot win rate against model generation, report wins+ties vs wins-only, compare to METR in Q&A, and break results down by profession.","detail":"<p>Win rate versus model generation tells a different story than METR.<\/p><ul><li>x-axis: models from <b>GPT-4o<\/b> through <b>GPT-5-high<\/b> to <b>Claude Opus 4.1<\/b>; y-axis: win rate versus an industry professional. Light blue is <b>wins+ties<\/b>; dark blue is <b>wins only<\/b>.<\/li><li><b>GPT-4o<\/b> (2024) averages about <b>12.4%<\/b>; by 2025 models reach the 20s-30s; <b>Claude Opus 4.1<\/b> reaches about <b>47.6%<\/b>.<\/li><li>This is a <b>roughly linear<\/b> trend, not the ~7-month exponential doubling of METR.<\/li><li>In Q&A the instructor says the two are not directly comparable -- different metrics -- but GDPval shows that on multi-hour to multi-week, profession-specific real work models are <b>only so reliable<\/b>.<\/li><li>Breaking performance down <b>by profession<\/b> makes the assessment more realistic than a single hours-based number.<\/li><\/ul>","terms":["win rate","GPT-4o","Claude Opus 4.1","linear trend","tacit knowledge","reference data"]},"zh":{"title":"GDPval 趋势：线性胜率增长","problem":"经济胜率的提升远慢于 METR 指数式跨度叙事所暗示的速度。","why":"真实工作既需要隐性知识，也需要忠实地使用参考数据，因此模型无法用流畅的生成来替代 grounding。","how":"将胜率对模型代际作图，报告 wins+ties 与 wins-only，在 Q&A 中与 METR 比较，并按职业细分结果。","detail":"<p>胜率对模型代际所讲述的故事与 METR 不同。<\/p><ul><li>x 轴：从 <b>GPT-4o<\/b> 到 <b>GPT-5-high<\/b> 再到 <b>Claude Opus 4.1<\/b> 的模型；y 轴：相对行业专业人士的胜率。浅蓝色为 <b>wins+ties<\/b>；深蓝色为 <b>wins only<\/b>。<\/li><li><b>GPT-4o<\/b>（2024）平均约 <b>12.4%<\/b>；到 2025 年模型达到 20-30 多；<b>Claude Opus 4.1<\/b> 达到约 <b>47.6%<\/b>。<\/li><li>这是一个<b>大致线性<\/b>的趋势，而非 METR 那种约 7 个月的指数式翻倍。<\/li><li>在 Q&A 中讲师表示二者不能直接比较——指标不同——但 GDPval 表明，在多小时到多周、针对具体职业的真实工作上，模型<b>只有这样的可靠性<\/b>。<\/li><li>将表现<b>按职业<\/b>细分，相比单一的基于小时的数字，能使评估更贴近现实。<\/li><\/ul>","terms":["win rate","GPT-4o","Claude Opus 4.1","linear trend","tacit knowledge","reference data"]}},{"t":2330,"figs":[{"t":2357,"file":"slides/part08/slide_093.jpg"},{"t":2388,"file":"slides/part08/slide_096.jpg"}],"en":{"title":"Model Strengths, Instruction-Following Failures, Output Quality","problem":"The dominant failures are instruction following and grounding, not raw reasoning, and usefulness is capped by context the model lacks.","why":"Real tasks are well specified but require tacit knowledge and faithful use of provided reference data.","how":"Decompose failures by type and sector, grade output quality, and compare model profiles on aesthetics, formatting, calculations, and text.","detail":"<p>Two analyses dominate this chunk: which models are strong where, and what actually fails.<\/p><ul><li><b>Strengths:<\/b> some models win on <b>aesthetics, document formatting, PDFs, spreadsheets, and presentations<\/b>; GPT-5 tends to win on <b>instruction following, correct calculations, and text tasks<\/b>.<\/li><li><b>Failure modes<\/b> are dominated by <b>instruction following<\/b>: models <b>promise to consult reference data but do not<\/b>, override it with hallucinated content, and make formatting errors. GPT-5 shows fewer reference-data instruction failures.<\/li><li><b>Usefulness distribution:<\/b> roughly <b>half<\/b> of tasks are <b>acceptable but subpar<\/b> if delegated; about <b>20%<\/b> are tasks where the model would <b>genuinely be better<\/b>; about <b>29%<\/b> are <b>bad or catastrophic<\/b>.<\/li><li>There is measurable <b>disagreement between human graders<\/b>, which adds noise to these numbers.<\/li><\/ul>","terms":["instruction following","hallucination","document formatting","output quality","grader disagreement","aesthetics"]},"zh":{"title":"模型优势、指令遵循失败、输出质量","problem":"主要失败在于指令遵循和 grounding，而非原始推理，且有用性受限于模型所缺乏的上下文。","why":"真实任务规格良好，但需要隐性知识以及对所提供的参考数据的忠实使用。","how":"按类型和部门分解失败，对输出质量评分，并比较模型在美学、格式、计算和文本方面的表现。","detail":"<p>本段由两类分析主导：哪些模型在何处强，以及实际失败的是什么。<\/p><ul><li><b>优势：<\/b>某些模型在<b>美学、文档格式、PDF、电子表格和演示文稿<\/b>上获胜；GPT-5 倾向于在<b>指令遵循、正确计算和文本任务<\/b>上获胜。<\/li><li><b>失败模式<\/b>以<b>指令遵循<\/b>为主：模型<b>承诺查阅参考数据却并未查阅<\/b>，用过 hallucinate 的内容覆盖它，并出现格式错误。GPT-5 表现出更少的参考数据指令遵循失败。<\/li><li><b>有用性分布：<\/b>约<b>一半<\/b>任务若被委派则<b>可接受但欠佳<\/b>；约 <b>20%<\/b> 的任务模型<b>确实会做得更好<\/b>；约 <b>29%<\/b> 的任务<b>糟糕或灾难性<\/b>。<\/li><li>人类评分者之间存在可测量的<b>分歧<\/b>，这为这些数字增添了噪声。<\/li><\/ul>","terms":["instruction following","hallucination","document formatting","output quality","grader disagreement","aesthetics"]}},{"t":2434,"figs":[{"t":2439,"file":"slides/part08/slide_100.jpg"},{"t":2509,"file":"slides/part08/slide_102.jpg"}],"en":{"title":"Self-Refinement: n Attempts, 1.6x Cost, 1.4x Speed","problem":"One-shot win rates understate what iterative self-correction can add.","why":"Parallel and sequential sampling with self-correction can recover quality, directly relevant to a self-improving-agents class.","how":"Compare a single trial with n attempts where each iteration improves on the last; measure cost and speed versus an unaided expert and against salary.","detail":"<p>Because the course is about self-improving agents, the instructors test iterative self-correction.<\/p><ul><li>Protocol: a naive <b>single trial<\/b> versus <b>n attempts<\/b>, where in the sequential case each iteration is asked to improve on the previous one (parallel or sequential sampling).<\/li><li>Reported gains for <b>GPT-5<\/b>: about <b>1.6x cost improvement<\/b> and about <b>1.4x speed improvement<\/b> relative to an unaided expert.<\/li><li>Even when successful, the run still costs <b>less than 10% of a human expert's salary<\/b> -- so a subset of professions is already strongly served.<\/li><li>The caveat is that these gains apply <b>where the model is successful<\/b>; they do not remove the underlying reliability gap, and repeated attempts multiply evaluation cost.<\/li><li>This connects the evaluation to the self-improvement theme: sampling plus self-correction is a first-order knob.<\/li><\/ul>","terms":["parallel sampling","sequential sampling","self-refinement","cost improvement","expert salary","reliability"]},"zh":{"title":"Self-Refinement：n 次尝试、1.6 倍成本、1.4 倍速度","problem":"单次（one-shot）胜率低估了迭代式自我纠正所能带来的增益。","why":"带有自我纠正的并行与顺序采样可以恢复质量，这与自我改进 agent 的课程直接相关。","how":"将单次试验与 n 次尝试（每次迭代在上一轮基础上改进）进行比较；测量相对于无辅助专家的成本与速度，以及与薪资的对比。","detail":"<p>由于本课程关注自我改进 agent，讲师测试了迭代式自我纠正。<\/p><ul><li>协议：朴素的<b>单次试验<\/b>与 <b>n 次尝试<\/b>对比，在顺序情形中每一轮都被要求在前一轮基础上改进（并行或顺序采样）。<\/li><li><b>GPT-5<\/b> 报告的增益：相对于无辅助专家，约 <b>1.6 倍成本改进<\/b>和约 <b>1.4 倍速度改进<\/b>。<\/li><li>即便成功，该运行的成本仍<b>低于人类专家薪资的 10%<\/b>——因此一部分职业已得到强有力的服务。<\/li><li>需要注意的是，这些增益仅适用于<b>模型成功的场合<\/b>；它们并未消除底层的可靠性差距，且重复尝试会成倍增加评估成本。<\/li><li>这将评估与自我改进主题联系起来：采样加自我纠正是一个一阶的调控旋钮。<\/li><\/ul>","terms":["parallel sampling","sequential sampling","self-refinement","cost improvement","expert salary","reliability"]}},{"t":2514,"figs":[{"t":2594,"file":"slides/part08/slide_104.jpg"},{"t":2647,"file":"slides/part08/slide_105.jpg"},{"t":2680,"file":"slides/part08/slide_107.jpg"},{"t":2695,"file":"slides/part08/slide_108.jpg"},{"t":2735,"file":"slides/part08/slide_110.jpg"},{"t":2739,"file":"slides/part08/slide_112.jpg"}],"en":{"title":"Sector Variation and Where Models Reach Parity","problem":"Aggregate win rate hides large per-occupation variation.","why":"Some task categories suit model strengths (digital, text, research) while others require expertise models lack.","how":"Compare per-occupation win rates against the red human-expert line and identify where models reach or exceed parity.","detail":"<p>Aggregate win rate hides large variation, so the lecture drills into occupations (red line = human expert; each color = a model).<\/p><ul><li><b>Approaching or at parity:<\/b> counter/rental clerks, real-estate brokers, shipping/receiving and inventory clerks, buyers and purchasing agents, computer/IT system managers, and software developers.<\/li><li><b>Doing extremely well:<\/b> government administrative service managers, compliance officers, medical and health service managers, personal financial advisors, customer service representatives, plus sales, editing, investigative/detective, and news-analyst tasks.<\/li><li><b>Caveat on software:<\/b> the human baseline may be repository <b>maintainers<\/b> rather than a full decade of experience; in fields such as industrial/mechanical engineering, decade-long expertise matters more.<\/li><li>These plots act as a <b>taxonomy<\/b> of where models are useful today and a starting point for studying failures.<\/li><\/ul>","terms":["occupation parity","real-estate brokers","software developers","compliance officers","taxonomy","maintainer"]},"zh":{"title":"部门差异与模型达到平价的领域","problem":"总体胜率掩盖了各职业间的巨大差异。","why":"某些任务类别契合模型优势（数字化、文本、研究），而另一些则需要模型所缺乏的专业知识。","how":"将各职业胜率与红色的人类专家线比较，并识别模型达到或超过平价的领域。","detail":"<p>总体胜率掩盖了巨大差异，因此本讲深入到职业层面（红线 = 人类专家；每种颜色 = 一个模型）。<\/p><ul><li><b>接近或达到平价：<\/b>柜台/租赁文员、房地产经纪人、收发货与库存文员、采购员与采购代理、计算机/IT 系统经理，以及软件开发人员。<\/li><li><b>表现极佳：<\/b>政府行政服务经理、合规官、医疗与健康服务经理、个人理财顾问、客户服务代表，以及销售、编辑、调查/侦探和新闻分析师任务。<\/li><li>关于软件的<b>注意：<\/b>人类基线可能是仓库 <b>maintainer<\/b>，而非拥有完整十年经验者；在工业/机械工程等领域，十年的专业经验更为重要。<\/li><li>这些图充当了模型今日在何处有用的<b>分类体系<\/b>，也是研究失败之处的起点。<\/li><\/ul>","terms":["occupation parity","real-estate brokers","software developers","compliance officers","taxonomy","maintainer"]}},{"t":2740,"figs":[{"t":2739,"file":"slides/part08/slide_112.jpg"},{"t":2829,"file":"slides/part08/slide_114.jpg"},{"t":2869,"file":"slides/part08/slide_116.jpg"}],"en":{"title":"Underspecification and the Context Gap","problem":"When prompts are underspecified or require gathered context, models cannot figure out what to work on.","why":"Real work is context-heavy; humans hold context in their heads and architect the problem, while models cannot yet acquire it autonomously.","how":"Test underspecified prompts, compare contractor vs maintainer, frame near-term value as AI assistance with human oversight, and prioritize task categories over dollar value.","detail":"<p>The last GDPval theme is what models cannot do without help.<\/p><ul><li><b>Underspecification:<\/b> removing context from prompts lowers win rate only a few points, but the model's <b>output quality degrades more<\/b> because it cannot figure out <b>what to work on<\/b>.<\/li><li><b>Context gap:<\/b> a repository <b>maintainer<\/b> is far faster than an external <b>contractor<\/b>; models behave like the low-context contractor and cannot gather that context themselves.<\/li><li>Hence in real work <b>humans architect the set of problems<\/b> and supply context; the model then executes. Near-term, AI assistance is <b>cost-effective when coupled with human oversight<\/b>, and different models suit different task types.<\/li><li>On dollar value: the amount matters less than the <b>category of task<\/b> (deep research, code generation, synthesizing diverse sources); the benchmark is a quantifiable <b>taxonomy<\/b> of valuable categories.<\/li><\/ul>","terms":["underspecification","context gap","contractor vs maintainer","human oversight","task taxonomy","delegation"]},"zh":{"title":"规格不足与上下文差距","problem":"当 prompt 规格不足或需要收集上下文时，模型无法弄清该做什么。","why":"真实工作高度依赖上下文；人类在头脑中保有上下文并架构问题，而模型尚无法自主获取它。","how":"测试规格不足的 prompt，比较外包人员与 maintainer，将近期的价值界定为在人工监督下的 AI 辅助，并优先考虑任务类别而非美元价值。","detail":"<p>GDPval 的最后一个主题是模型在没有帮助时无法做到的事。<\/p><ul><li><b>规格不足（Underspecification）：<\/b>从 prompt 中移除上下文只会使胜率下降几个点，但模型的<b>输出质量退化更多<\/b>，因为它无法弄清<b>该做什么<\/b>。<\/li><li><b>上下文差距：<\/b>仓库 <b>maintainer<\/b> 远比外部 <b>外包人员<\/b>快；模型的行为就像低上下文的外包人员，且无法自行收集那些上下文。<\/li><li>因此在真实工作中，<b>人类架构问题集合<\/b>并提供上下文；模型随后执行。近期来看，AI 辅助<b>在与人工监督相结合时具有成本效益<\/b>，且不同模型适合不同任务类型。<\/li><li>关于美元价值：金额本身不如<b>任务类别<\/b>（深度研究、代码生成、综合多样化来源）重要；该 benchmark 是一份可量化的有价值类别<b>分类体系<\/b>。<\/li><\/ul>","terms":["underspecification","context gap","contractor vs maintainer","human oversight","task taxonomy","delegation"]}},{"t":3094,"figs":[{"t":3115,"file":"slides/part08/slide_128.jpg"},{"t":3206,"file":"slides/part08/slide_130.jpg"},{"t":3238,"file":"slides/part08/slide_131.jpg"}],"en":{"title":"DeepScholarBench: Live Related-Work Synthesis","problem":"Real work also requires grounding in knowledge bases, not just long duration or economic value.","why":"Models are frozen at a knowledge cutoff, may miss foundational papers, and coherent writing is not the same as coverage or verifiability.","how":"DeepScholarBench (Stanford) generates related-work sections from recent PhD-level papers across 22 domains, rerun monthly and restricted to post-training papers; three human-validated axes.","detail":"<p><b>DeepScholarBench<\/b> (Stanford) targets the related-work section of a paper -- a task a classmate asked for and that practitioners constantly need.<\/p><ul><li><b>Live and contamination-resistant:<\/b> built from <b>recent arXiv papers<\/b> at PhD-level difficulty across <b>22 domains<\/b>, <b>rerun monthly<\/b> with new papers, and restricted to papers published <b>after a major model's training cutoff<\/b>.<\/li><li>Task: retrieve relevant references, synthesize findings into coherent claims, and support them with <b>verifiable citations<\/b>.<\/li><li>Prior art includes OpenAI Deep Research, Gemini Deep Research, Perplexity, Stanford's <b>STORM<\/b>, and <b>OpenScholar<\/b>.<\/li><li>Three human-validated axes: <b>knowledge synthesis<\/b> (coherent, captures key facts), <b>retrieval quality<\/b> (relevance, citation counts, foundational-paper coverage), and <b>verifiability<\/b> (do citations actually support the claims).<\/li><li>Metrics agree with humans about <b>70-80%<\/b> of the time.<\/li><\/ul>","terms":["DeepScholarBench","live benchmark","data contamination","knowledge synthesis","retrieval quality","verifiability"]},"zh":{"title":"DeepScholarBench：实时的 Related-Work 综述","problem":"真实工作还需要 grounding 于知识库，而不仅仅是长时长或经济价值。","why":"模型冻结于某个知识截止点，可能遗漏基础性论文，而连贯的写作并不等同于覆盖度或可验证性。","how":"DeepScholarBench（Stanford）从 22 个领域的近期 PhD 级论文生成 related-work 章节，每月重跑，且限定为训练后发表的论文；三条经人类验证的轴。","detail":"<p><b>DeepScholarBench<\/b>（Stanford）针对论文的 related-work 章节——这是同学曾请求的任务，也是从业者经常需要的任务。<\/p><ul><li><b>实时且抗 contamination：<\/b>由 <b>22 个领域<\/b>、PhD 级难度的<b>近期 arXiv 论文<\/b>构建，随新论文<b>每月重跑<\/b>，并限定为在<b>某主要模型训练截止点之后<\/b>发表的论文。<\/li><li>任务：检索相关参考文献，将发现综合为连贯的论断，并以<b>可验证的引用<\/b>予以支撑。<\/li><li>先前工作包括 OpenAI Deep Research、Gemini Deep Research、Perplexity、Stanford 的 <b>STORM<\/b>，以及 <b>OpenScholar<\/b>。<\/li><li>三条经人类验证的轴：<b>knowledge synthesis<\/b>（连贯、捕捉关键事实）、<b>retrieval quality<\/b>（相关性、引用次数、基础性论文覆盖度），以及 <b>verifiability<\/b>（引用是否真正支撑论断）。<\/li><li>这些指标与人类判断的吻合度约为 <b>70-80%<\/b>。<\/li><\/ul>","terms":["DeepScholarBench","live benchmark","data contamination","knowledge synthesis","retrieval quality","verifiability"]}},{"t":3318,"figs":[{"t":3323,"file":"slides/part08/slide_134.jpg"},{"t":3472,"file":"slides/part08/slide_137.jpg"}],"en":{"title":"DeepScholarBench Results: No System Above 19%","problem":"Despite industrial deep-research prototypes, quality and verifiability remain far below expert level.","why":"Success requires finding comprehensive foundational sources, surfacing key facts, and keeping citations faithful -- capabilities current systems lack.","how":"Report per-axis scores and failure modes; probe retrieval and synthesis separately; vary whether perfect sources are supplied to isolate the bottleneck.","detail":"<p>Unlike most benchmarks, this one has enormous headroom: <b>no existing system exceeds 19%<\/b>.<\/p><ul><li><b>Knowledge synthesis:<\/b> OpenAI Deep Research writes well but <b>almost all models consistently miss key facts<\/b> -- coherent English without full coverage.<\/li><li><b>Retrieval quality:<\/b> overall only <b>okay-ish<\/b>; all systems struggle to find comprehensive and important sources; <b>document importance is below 12.5%<\/b>.<\/li><li><b>Verifiability:<\/b> DeepScholarBench reaches up to about <b>90% precision<\/b>, but Open Deep Research has lower verifiability despite fluent prose.<\/li><li><b>Failure modes:<\/b> not finding <b>foundational papers<\/b>; poor assessment of document importance; even when given the <b>perfect sources<\/b>, key-fact coverage is only about <b>50%<\/b>.<\/li><li><b>Trade-off:<\/b> no system excels at both synthesis quality and verifiability -- exactly the precision/recall balance an occupation needs.<\/li><\/ul>","terms":["19% ceiling","foundational papers","key-fact coverage","document importance","precision/recall","verifiability"]},"zh":{"title":"DeepScholarBench 结果：无系统超过 19%","problem":"尽管有工业界的深度研究原型，质量与可验证性仍远低于专家水平。","why":"成功需要找到全面的基础性来源、呈现关键事实，并保持引用的忠实性——这些都是当前系统所缺乏的能力。","how":"报告各轴分数与失败模式；分别探究检索与综合；变化是否提供完美来源以隔离瓶颈。","detail":"<p>与大多数 benchmark 不同，这个 benchmark 有巨大的提升空间：<b>无任何现有系统超过 19%<\/b>。<\/p><ul><li><b>Knowledge synthesis：<\/b>OpenAI Deep Research 写得很好，但<b>几乎所有模型都持续遗漏关键事实<\/b>——连贯的英文却缺乏完整覆盖。<\/li><li><b>Retrieval quality：<\/b>总体仅<b>马马虎虎<\/b>；所有系统都难以找到全面且重要的来源；<b>文档重要性低于 12.5%<\/b>。<\/li><li><b>Verifiability：<\/b>DeepScholarBench 最高可达约 <b>90% 精确率<\/b>，但 Open Deep Research 尽管文笔流畅，可验证性却更低。<\/li><li><b>失败模式：<\/b>找不到<b>基础性论文<\/b>；对文档重要性的评估很差；即便提供了<b>完美的来源<\/b>，关键事实覆盖度也只有约 <b>50%<\/b>。<\/li><li><b>权衡：<\/b>没有任何系统能同时在综合质量与可验证性上表现出色——而这恰恰是一个职业所需的精确率/召回率平衡。<\/li><\/ul>","terms":["19% ceiling","foundational papers","key-fact coverage","document importance","precision/recall","verifiability"]}},{"t":3513,"figs":[{"t":3516,"file":"slides/part08/slide_146.jpg"}],"en":{"title":"DeepScholarBench Q&A and Synthesis in Horizon Terms","problem":"Why single out this narrow task, and how does it relate to horizon and economics?","why":"Real-world tasks need knowledge-base grounding, and related work is a representative, economically valuable research-synthesis task.","how":"Q&A clarifies claims/citations coverage, then the instructor places synthesis on the horizon axis and attributes gaps to multi-step reasoning, information gathering, verifiability, and context engineering.","detail":"<p>Q&A clarifies the benchmark, then the instructor places it on the horizon axis.<\/p><ul><li>Experts provide a <b>list of foundational papers<\/b>, but the benchmark also checks whether the written <b>claims<\/b> are supported and which papers back them -- not just the count retrieved.<\/li><li>On the METR duration axis, research-synthesis tasks are estimated at <b>30 minutes to 8 hours<\/b>, while current capability sits around <b>50 minutes<\/b>, often with only <b>~50% success<\/b>.<\/li><li>A task can look long-horizon on the plot yet produce low-quality, low-verifiability output -- duration and quality are different axes.<\/li><li>Gaps come from <b>multi-step reasoning<\/b>, comprehensive information gathering, and <b>maintaining verifiability while synthesizing<\/b>.<\/li><li>This mirrors homework 3: combining multiple agent calls requires <b>context engineering<\/b> across distributed sources and repeated tool calls while preserving provenance.<\/li><\/ul>","terms":["related-work synthesis","claims and citations","multi-step reasoning","context engineering","distributed sources","verifiability"]},"zh":{"title":"DeepScholarBench 的 Q&A 与跨度视角下的综合","problem":"为什么要单独挑出这个狭窄任务，它又与跨度和经济有何关联？","why":"真实世界任务需要知识库 grounding，而 related work 是一个有代表性、具有经济价值的研究综合任务。","how":"Q&A 澄清了论断/引用的覆盖，随后讲师将综合置于跨度轴上，并将差距归因于多步推理、信息收集、可验证性和 context engineering。","detail":"<p>Q&A 澄清了该 benchmark，随后讲师将其放到跨度轴上。<\/p><ul><li>专家提供一份<b>基础性论文清单<\/b>，但该 benchmark 还会检查所写的<b>论断<\/b>是否被支撑、以及哪些论文支撑了它们——而不仅仅是检索到的数量。<\/li><li>在 METR 时长轴上，研究综合任务的估计时长约为 <b>30 分钟到 8 小时<\/b>，而当前能力位于约 <b>50 分钟<\/b>，且成功率往往只有 <b>约 50%<\/b>。<\/li><li>一个任务在图上看起来像是长跨度，却可能产出低质量、低可验证性的输出——时长与质量是不同的轴。<\/li><li>差距来自<b>多步推理<\/b>、全面的信息收集，以及在<b>综合的同时保持可验证性<\/b>。<\/li><li>这与 homework 3 相呼应：组合多个 agent 调用需要在分布式来源和重复工具调用之间进行 <b>context engineering<\/b>，同时保留来源出处（provenance）。<\/li><\/ul>","terms":["related-work synthesis","claims and citations","multi-step reasoning","context engineering","distributed sources","verifiability"]}},{"t":3773,"figs":[{"t":3794,"file":"slides/part08/slide_150.jpg"},{"t":3891,"file":"slides/part08/slide_151.jpg"},{"t":3960,"file":"slides/part08/slide_153.jpg"},{"t":3982,"file":"slides/part08/slide_154.jpg"}],"en":{"title":"Benchmark Comparison and Known vs Low-Confidence Gaps","problem":"Each benchmark measures one axis, so no single number tells you whether agents are deployable on real work.","why":"All three are proxies with known limitations, and confidence varies sharply by task type.","how":"Compare the three on scoring, multi-agent structure, resource constraints, and subjectivity, then list what is well established versus what remains low-confidence.","detail":"<p>The instructor compares the three benchmarks and separates confident from uncertain claims.<\/p><ul><li><b>METR:<\/b> automatically scored, no multi-agent interaction, no resource constraints, and <b>not punishing of mistakes<\/b> -- it targets single-agent, cleanly verifiable tasks.<\/li><li><b>GDPval:<\/b> tasks are <b>extremely well specified<\/b> (the human's implicit context is written into the prompt) and <b>one-shot<\/b>, with no iterative correction; it requires <b>tacit knowledge<\/b> already in the model.<\/li><li><b>DeepScholarBench:<\/b> fills the reference-data gap, exposing retrieval, foundational-paper, and verifiability failures.<\/li><li><b>Well established:<\/b> models improve on isolated, well-specified tasks; SWE and ML research show the most progress; stronger models produce well-organized output even when parts are wrong.<\/li><li><b>Low confidence:<\/b> context-heavy tasks, ambiguous prompts, adversarial environments, <b>95% reliability<\/b>, generalization beyond software/knowledge work, and finding/verifying sources in a knowledge base.<\/li><\/ul>","terms":["benchmark limitations","one-shot","resource constraints","adversarial environments","95% reliability","generalization"]},"zh":{"title":"Benchmark 比较与已知及低置信度的差距","problem":"每个 benchmark 只测量一条轴，因此没有任何单一数字能告诉你 agent 在真实工作上是否可部署。","why":"三者都是带有已知局限的代理指标，且置信度因任务类型而差异极大。","how":"在评分方式、多 agent 结构、资源约束和主观性上比较三者，然后列出哪些已被充分确立、哪些仍属低置信度。","detail":"<p>讲师比较了这三个 benchmark，并将有把握的论断与不确定的论断区分开。<\/p><ul><li><b>METR：<\/b>自动评分，无多 agent 交互，无资源约束，且<b>不惩罚错误<\/b>——它针对单 agent、可清晰验证的任务。<\/li><li><b>GDPval：<\/b>任务<b>规格极其明确<\/b>（人类的隐含上下文被写入 prompt），且为<b>单次（one-shot）<\/b>，没有迭代纠正；它要求模型中已具备<b>隐性知识<\/b>。<\/li><li><b>DeepScholarBench：<\/b>填补了参考数据的缺口，暴露出检索、基础性论文和可验证性方面的失败。<\/li><li><b>已充分确立：<\/b>模型在孤立、规格良好的任务上有提升；SWE 和 ML 研究显示出最大进展；更强的模型即便部分内容有误也能产出组织良好的输出。<\/li><li><b>低置信度：<\/b>高度依赖上下文的任务、模糊的 prompt、对抗性环境、<b>95% 可靠性<\/b>、超出软件/知识工作的泛化，以及在知识库中查找/验证来源。<\/li><\/ul>","terms":["benchmark limitations","one-shot","resource constraints","adversarial environments","95% reliability","generalization"]}},{"t":3994,"figs":[{"t":4037,"file":"slides/part08/slide_155.jpg"},{"t":4090,"file":"slides/part08/slide_156.jpg"}],"en":{"title":"Final Synthesis: Forecasts, Reliability, Metrics","problem":"The exponential horizon story must be reconciled with the linear economic-value story, and it is unclear what to measure.","why":"Different metrics capture different progress; reliability and error recovery improve while performance stays task-dependent.","how":"Summarize METR's 7-month doubling and the 2028-2031 month-long-task forecast, contrast GDPval's linear 48% win rate, and prescribe duration-, economic-, and synthesis-quality metrics validated against humans.","detail":"<p>The closing synthesis ties the metrics together.<\/p><ul><li><b>METR:<\/b> a <b>7-month doubling<\/b> of the horizon at <b>50% reliability<\/b>, with a forecast that by <b>2028-2031<\/b> models will nearly complete <b>one-month tasks<\/b>.<\/li><li><b>GDPval:<\/b> a much more <b>linear<\/b> improvement over two years, reaching about <b>48% win rate<\/b> on some tasks while many categories remain low -- tempering the exponential story with real economic work.<\/li><li><b>Context/reference data<\/b> is the recurring gap: many GDPval tasks require context or reference files, and DeepScholarBench shows quality and verifiability lagging humans.<\/li><li><b>Forecast:<\/b> reliability and error recovery should keep improving, but performance will stay <b>task-dependent<\/b>; solving longer-horizon tasks does not guarantee reliable or high-quality outputs.<\/li><li><b>Metric prescription:<\/b> we need <b>duration-based<\/b>, <b>economic-value-based<\/b>, and <b>synthesis-quality-based<\/b> metrics, each validated against humans who can actually solve the tasks.<\/li><\/ul>","terms":["seven-month doubling","forecast","win rate","synthesis quality","human validation","task-dependent"]},"zh":{"title":"最终综合：预测、可靠性、指标","problem":"必须将指数式跨度叙事与线性经济价值叙事相协调，且尚不清楚该测量什么。","why":"不同的指标捕捉不同的进展；可靠性与错误恢复在改进，而表现仍取决于任务。","how":"总结 METR 的 7 个月翻倍以及 2028-2031 年完成一个月长任务的预测，对比 GDPval 线性的 48% 胜率，并提出基于时长、经济和综合质量的指标，且都需经人类验证。","detail":"<p>收尾的综合将各项指标串联起来。<\/p><ul><li><b>METR：<\/b>在 <b>50% 可靠性<\/b>下跨度<b>每 7 个月翻倍<\/b>，并预测到 <b>2028-2031<\/b> 年模型将几乎能完成<b>为期一个月<\/b>的任务。<\/li><li><b>GDPval：<\/b>两年多以来改善要<b>线性<\/b>得多，在某些任务上达到约 <b>48% 胜率<\/b>，而许多类别仍然很低——用真实经济工作为指数式叙事降温。<\/li><li><b>Context/参考数据<\/b>是反复出现的差距：许多 GDPval 任务需要上下文或参考文件，而 DeepScholarBench 显示质量与可验证性落后于人类。<\/li><li><b>预测：<\/b>可靠性与错误恢复应持续改善，但表现仍将<b>取决于任务<\/b>；解决更长跨度的任务并不能保证可靠或高质量的输出。<\/li><li><b>指标建议：<\/b>我们需要<b>基于时长<\/b>、<b>基于经济价值<\/b>和<b>基于综合质量<\/b>的指标，每一条都要针对真正能解决该任务的人类进行验证。<\/li><\/ul>","terms":["seven-month doubling","forecast","win rate","synthesis quality","human validation","task-dependent"]}},{"t":4107,"figs":[{"t":4400,"file":"slides/part08/slide_161.jpg"},{"t":4402,"file":"slides/part08/slide_165.jpg"},{"t":4411,"file":"slides/part08/slide_163.jpg"}],"en":{"title":"Open Q&A: Deployability, Long Tail, AI Co-Scientist","problem":"Practitioners ask whether current reliability makes agents deployable and what fundamentally blocks the long tail.","why":"The last 20% -- reliability and hard domains -- is far harder than the first 80%, and both data and model capability matter.","how":"Instructor answers on the long tail, clarifies that METR's 50% is an average of per-task success rates across attempts, and frames today's systems as AI co-scientists rather than autonomous AI scientists.","detail":"<p>The final Q&A ranges from deployability to career advice.<\/p><ul><li><b>Long tail:<\/b> the first 80% is easy and the <b>last 20% takes a decade<\/b>; hard domains such as <b>distributed systems<\/b> stay difficult. SWE and verified coding keep improving, but many non-PR tasks remain hard.<\/li><li>On the METR 50% number: it is the <b>average of per-task success rates<\/b> across attempts (e.g. across 97 tasks), so a 50% task means the answer is good about half the time.<\/li><li><b>Trajectory:<\/b> timelines move fast and are hard to predict; today's systems are <b>AI co-scientists<\/b> -- strong brainstormers with broad knowledge -- not yet autonomous <b>AI scientists<\/b> that build the next generation of models.<\/li><li><b>What blocks the long tail:<\/b> both <b>data<\/b> and <b>fundamental model capability<\/b>; robotics startups, for instance, bet on data collection to close the gap.<\/li><li><b>Closing advice:<\/b> CS fundamentals remain valuable, and the durable skill is <b>providing the model the context it needs<\/b>.<\/li><\/ul>","terms":["long tail","distributed systems","AI co-scientist","AI scientist","reliability","data collection"]},"zh":{"title":"开放式 Q&A：可部署性、长尾、AI Co-Scientist","problem":"从业者询问当前的可靠性是否使 agent 可部署，以及究竟是什么从根本上阻碍了长尾。","why":"最后的 20%——可靠性与困难领域——远比前 80% 更难，且数据与模型能力都很重要。","how":"讲师就长尾作答，澄清 METR 的 50% 是各任务在各次尝试中成功率的平均，并将当今系统界定为 AI co-scientists 而非自主 AI scientists。","detail":"<p>最后的 Q&A 涵盖从可部署性到职业建议等话题。<\/p><ul><li><b>长尾：<\/b>前 80% 容易，而<b>最后的 20% 要花十年<\/b>；诸如<b>分布式系统<\/b>这样的困难领域依然艰难。SWE 和可验证的编码持续进步，但许多非 PR 任务仍然困难。<\/li><li>关于 METR 的 50% 数字：它是各任务在各次尝试中<b>成功率的平均值<\/b>（例如跨 97 个任务），因此一个 50% 的任务意味着答案大约有一半时间是好的。<\/li><li><b>走向：<\/b>时间线变化很快且难以预测；当今系统是 <b>AI co-scientists<\/b>——知识广博、善于头脑风暴——尚不是能构建下一代模型的自主 <b>AI scientists<\/b>。<\/li><li><b>什么阻碍了长尾：<\/b>既有<b>数据<\/b>，也有<b>基础模型能力<\/b>；例如机器人初创公司押注于数据收集来弥合差距。<\/li><li><b>结课建议：<\/b>CS 基础知识仍有价值，而持久的能力是<b>为模型提供它所需的上下文<\/b>。<\/li><\/ul>","terms":["long tail","distributed systems","AI co-scientist","AI scientist","reliability","data collection"]}}]},{"n":9,"id":"AyO6wyu4DEg","duration":4058,"slideCount":42,"en":{"title":"Future Research Areas","summary":"The final CS329A lecture recaps the quarter, then frames the self-improvement loop as bottlenecked on three fronts (reasoning-chain diversity, robust verification, human-curated task/prompt selection) and anchors each to a paper: multi-agent fine-tuning for diversity, DeepSeek-Math V2 meta-verification, and Absolute-Zero-style self-proposed tasks. The second half pivots to efficiency for intelligence: exploding cloud compute demand (~1200x, 160T to 1.3Q tokens), the charge that ~77% of queries are locally servable, the intelligence-per-watt metric (5.3x over two years), and the trend toward local/edge inference. It closes with open directions: foundational principles of test-time scaling, the synthetic-data flywheel, continual learning (weights vs memory vs infinite context), hybrid serving infra (Hydrogen, Tokamak), and energy as the primary resource."},"zh":{"title":"未来研究方向","summary":"最后一节 CS329A 课程首先回顾本季度内容，随后把自我改进循环的瓶颈归纳为三方面（推理链多样性、鲁棒的验证、人工筛选的任务/提示词选择），并为每个瓶颈锚定一篇论文：用于提升多样性的多 agent 微调、DeepSeek-Math V2 的元验证，以及 Absolute-Zero 式的自我提出任务。下半场转向面向智能的效率问题：云算力需求激增（约 1200 倍，从 160T 到 1.3Q tokens）、约 77% 的查询可在本地服务的论断、每瓦智能指标（两年内提升 5.3 倍），以及向本地/边缘推理发展的趋势。最后以开放方向收尾：test-time scaling 的基础原理、合成数据飞轮、持续学习（权重 vs 记忆 vs 无限上下文）、混合服务基础设施（Hydrogen、Tokamak），以及把能源视为首要资源。"},"sections":[{"t":5,"figs":[{"t":68,"file":"slides/part09/slide_002.jpg"}],"en":{"title":"Course recap: from verifier loops to agents","problem":"The quarter spanned test-time scaling, train-time scaling, open-ended search, agentic workflows, and evaluation; without a recap the connections between the topics are lost.","why":"Each topic fed the same self-improvement loop -- verifiers produce feedback and rewards, and RL plus search let models hill climb -- with an exploration branch where a model may explore a definable space.","how":"Recap the arc in order: test-time and train-time scaling, open-ended evolution (Alpha Evolve), end-to-end tool-use workflows with retrieval and memory, next-generation evaluation, and guest lectures on post-training, multi-model agents, robotics, and reasoning.","detail":"<p>The instructor recaps the quarter. The class opened with LLMs and the past year's shift toward <b>test-time scaling<\/b> and <b>train-time scaling<\/b> via self-improvement, where the fundamental loop is driven by <b>verifiers<\/b>, feedback from running them, rewards, and reinforcement learning plus search algorithms that let models hill climb on math and coding.<\/p><ul><li>Then evolutionary strategies and <b>open-endedness<\/b>: not only reward-driven loops but letting models explore when the exploration space can be defined -- <code>Alpha Evolve<\/code> and similar techniques.<\/li><li>Then end-to-end agent workflows with <b>tool use<\/b>: models interact with environments and tools; multi-step tasks require knowledge bases, hence <b>retrieval and memory<\/b>, better <b>planning<\/b> and multi-step reasoning.<\/li><li>Next-generation model evaluation and what capabilities drive it; guest lectures on post-training, multi-model agents, robotics, and reasoning.<\/li><li>A guest lecturer framed <b>symbolic techniques<\/b> under tool use as a way to add to <b>synthetic data<\/b>, another trend the instructors flag.<\/li><\/ul><p>Why it matters: the field moves so fast that today's material starts becoming history by the next offering, yet the basic techniques compound because new work builds on them.<\/p>","terms":["test-time scaling","train-time scaling","verifiers","open-endedness","Alpha Evolve","tool use","synthetic data"]},"zh":{"title":"课程回顾：从验证器循环到 agent","problem":"本季度涵盖了 test-time scaling、train-time scaling、开放式搜索、agentic 工作流与评估；如果不做回顾，各主题之间的联系就会丢失。","why":"每个主题都服务于同一个自我改进循环——验证器产生反馈与奖励，RL 加搜索让模型能够爬山——并带有一个探索分支，模型可以在其中探索一个可定义的空间。","how":"按顺序回顾整条脉络：test-time 与 train-time scaling、开放式演化（Alpha Evolve）、带检索与记忆的端到端工具使用工作流、下一代评估，以及关于 post-training、多模型 agent、机器人学和推理的嘉宾讲座。","detail":"<p>讲师回顾本季度内容。课程最初从 LLM 讲起，以及过去一年向 <b>test-time scaling<\/b> 和通过自我改进实现的 <b>train-time scaling<\/b> 的转变，其基本循环由 <b>验证器<\/b>、运行验证器得到的反馈、奖励，以及让模型能在数学和编程上爬山的强化学习加搜索算法驱动。<\/p><ul><li>随后是演化策略与 <b>开放式性（open-endedness）<\/b>：不仅是奖励驱动的循环，还允许模型在可定义探索空间的地方进行探索——<code>Alpha Evolve<\/code> 及类似技术。<\/li><li>接着是带 <b>工具使用<\/b> 的端到端 agent 工作流：模型与环境、工具交互；多步任务需要知识库，因此需要 <b>检索与记忆<\/b>，以及更好的 <b>规划<\/b> 与多步推理。<\/li><li>下一代模型评估及其驱动因素；关于 post-training、多模型 agent、机器人学和推理的嘉宾讲座。<\/li><li>一位嘉宾讲师将工具使用下的 <b>符号技术<\/b> 定位为补充 <b>合成数据<\/b> 的一种方式，这也是讲师们强调的另一个趋势。<\/li><\/ul><p>为什么重要：该领域发展如此之快，以致今天的内容到下次开课时就开始成为历史，但基本技术会不断累积，因为新工作都建立在其之上。<\/p>","terms":["test-time scaling","train-time scaling","验证器","开放式性","Alpha Evolve","工具使用","合成数据"]}},{"t":149,"figs":[{"t":177,"file":"slides/part09/slide_003.jpg"},{"t":200,"file":"slides/part09/slide_005.jpg"},{"t":268,"file":"slides/part09/slide_006.jpg"}],"en":{"title":"From LLM to agent: workflow framing and lecture organization","problem":"LLMs by themselves are often not powerful enough to drive a full goal, so agents are still largely handwritten workflows, and it is unclear how the orchestration pieces fit together.","why":"An agent generalizes an LLM by having a goal, interacting with an environment, collecting feedback, and correcting its own steps -- which requires planning, multi-step reasoning, self-correction, and self-improvement.","how":"Describe the orchestration stack (LLMs, verifiers and LLM-judges, tool calls, parallel search) and frame the final lecture as key ideas from papers split between the self-improvement side and the efficiency-for-intelligence side.","detail":"<p>The class is titled <i>self-improving agents<\/i>, so the focus is the agent, not just the LLM. An agent is a generalization of an LLM: it has a <b>goal<\/b>, interacts with the <b>environment<\/b>, collects feedback, and uses that feedback to correct its steps -- a system that directs its own processes, uses tools, and accomplishes a goal.<\/p><ul><li>Today's LLMs are often not powerful enough to drive a full goal alone, so workflows are still largely handwritten: you orchestrate <b>LLMs<\/b>, <b>verifiers<\/b> (needed for reward), <b>LLM-as-judge<\/b> verifiers, <b>tool calls<\/b>, and <b>parallel search<\/b> over LLM calls.<\/li><li>Coding agents are the notable case where the workflow is increasingly driven by the model itself.<\/li><li>Because the workflow chases a goal, it needs <b>planning<\/b>, multi-step reasoning, self-correction when heading the wrong way, and continued capability improvement -- the self-improvement aspect.<\/li><\/ul><p>This final lecture covers future research areas, organized as key ideas from papers that span the self-improvement side and the efficiency-for-intelligence side, both of which the instructors consider the next important directions.<\/p>","terms":["agent","workflow orchestration","LLM-as-judge","verifier","self-improvement","efficiency for intelligence"]},"zh":{"title":"从 LLM 到 agent：工作流框架与讲座组织","problem":"单靠 LLM 往往不足以驱动一个完整目标，因此 agent 在很大程度上仍是手写工作流，而且各编排组件如何衔接尚不清晰。","why":"agent 通过拥有目标、与环境交互、收集反馈并修正自身步骤来对 LLM 进行泛化——这需要规划、多步推理、自我修正与自我改进。","how":"描述编排栈（LLM、验证器与 LLM-judge、工具调用、并行搜索），并把最后一讲定位为论文关键思想的集合，分为自我改进一侧与面向智能的效率一侧。","detail":"<p>课程标题是 <i>self-improving agents<\/i>，因此焦点是 agent，而不只是 LLM。agent 是 LLM 的泛化：它拥有 <b>目标<\/b>，与 <b>环境<\/b> 交互，收集反馈，并利用反馈修正自身步骤——一个能主导自身流程、使用工具并完成目标的系统。<\/p><ul><li>如今的 LLM 往往不足以单独驱动完整目标，因此工作流在很大程度上仍是手写的：你要编排 <b>LLM<\/b>、<b>验证器<\/b>（奖励所需）、<b>LLM-as-judge<\/b> 验证器、<b>工具调用<\/b>，以及在 LLM 调用之上的 <b>并行搜索<\/b>。<\/li><li>编程 agent 是工作流日益由模型自身驱动的显著案例。<\/li><li>由于工作流以目标为导向，它需要 <b>规划<\/b>、多步推理、走错方向时的自我修正，以及持续的能力提升——即自我改进方面。<\/li><\/ul><p>这最后一讲涵盖未来研究方向，组织为跨自我改进一侧与面向智能的效率一侧的论文关键思想，讲师认为这两者都是下一个重要方向。<\/p>","terms":["agent","工作流编排","LLM-as-judge","验证器","自我改进","面向智能的效率"]}},{"t":278,"figs":[{"t":382,"file":"slides/part09/slide_045.jpg"}],"en":{"title":"Three bottlenecks of the self-improvement loop","problem":"Test-time scaling (multiple samples, majority voting) and train-time scaling still work mostly in narrow domains such as math and coding, and prompts are chosen statically by humans.","why":"Three root causes bound the loop: a single model produces low-diversity reasoning chains even at high temperature, verification is hard (outcome-only checking saturates benchmarks), and task/prompt curation requires scarce domain experts.","how":"Survey one research direction per bottleneck -- multi-agent generation for diversity, meta-verification, and self-proposed tasks at the edge of ability -- then pivot to the efficiency half and ask what 'intelligence per unit cost' means.","detail":"<p>Two lessons recap: <b>test-time scaling<\/b> (multiple samples, majority voting) and <b>train-time scaling<\/b> (feedback from the inference loop turned into rewards that drive self-improvement). The limitation is that this remains narrow -- mostly math and coding.<\/p><ul><li><b>Bottleneck 1 -- diversity.<\/b> How do you get generalization across domains and keep reasoning chains diverse enough to keep driving the loop? A single LLM emits near-duplicate chains even at high temperature.<\/li><li><b>Bottleneck 2 -- verification.<\/b> Robust verification or <b>meta-verification<\/b> that checks what went into the reasoning chain is valuable; outcome reward models saturate math benchmarks while hiding invalid reasoning.<\/li><li><b>Bottleneck 3 -- data.<\/b> Prompts entering training are selected very statically and require humans; how does the loop pick the right data to drive itself?<\/li><\/ul><p>The second half shifts to <b>efficiency for intelligence<\/b> -- intelligence per what? -- because self-improvement means much more inference per unit of useful output. Each theme is anchored to a paper that, given how fast the field moves, might itself be taught next time.<\/p>","terms":["test-time scaling","train-time scaling","diversity","meta-verification","data barrier","intelligence per watt"]},"zh":{"title":"自我改进循环的三大瓶颈","problem":"test-time scaling（多次采样、多数投票）与 train-time scaling 仍主要局限于数学、编程等狭窄领域，且提示词由人工静态选择。","why":"三个根因约束着循环：单一模型即使在高温度下产生的推理链多样性也很低；验证很难（仅看结果的检查会让基准饱和）；任务/提示词的筛选需要稀缺的领域专家。","how":"针对每个瓶颈梳理一个研究方向——为提升多样性而做的多 agent 生成、元验证，以及在能力边界处自我提出的任务——随后转向效率部分，追问“单位成本智能”意味着什么。","detail":"<p>回顾两个教训：<b>test-time scaling<\/b>（多次采样、多数投票）与 <b>train-time scaling<\/b>（把推理循环中的反馈转化为驱动自我改进的奖励）。局限在于它仍很狭窄——主要是数学与编程。<\/p><ul><li><b>瓶颈 1——多样性。<\/b> 如何在跨领域上实现泛化，并让推理链足够多样以持续驱动循环？单一 LLM 即使在高温度下也会产生近乎重复的链。<\/li><li><b>瓶颈 2——验证。<\/b> 检查推理链中内容的鲁棒验证或 <b>元验证<\/b> 很有价值；结果奖励模型会让数学基准饱和，同时掩盖无效推理。<\/li><li><b>瓶颈 3——数据。<\/b> 进入训练的提示词选择非常静态且依赖人工；循环如何挑选正确的数据来驱动自身？<\/li><\/ul><p>下半场转向 <b>面向智能的效率<\/b>——以什么衡量智能？——因为自我改进意味着每单位有用输出需要更多推理。每个主题都锚定一篇论文，鉴于领域发展之快，这些论文下次可能就会被讲授。<\/p>","terms":["test-time scaling","train-time scaling","多样性","元验证","数据壁垒","intelligence per watt"]}},{"t":411,"figs":[{"t":474,"file":"slides/part09/slide_011.jpg"},{"t":520,"file":"slides/part09/slide_012.jpg"},{"t":587,"file":"slides/part09/slide_014.jpg"},{"t":666,"file":"slides/part09/slide_015.jpg"},{"t":685,"file":"slides/part09/slide_016.jpg"},{"t":751,"file":"slides/part09/slide_017.jpg"}],"en":{"title":"Multi-agent fine-tuning: debate for diverse reasoning","problem":"Iterative synthetic-data fine-tuning (generate, filter with rejection sampling, SFT on the good ones; STaR-style) stops improving after a few or tens of iterations.","why":"A single LLM generates near-duplicate solutions even at high temperature, so the training set lacks diversity and the loop hits a ceiling -- unlike internet-scale pretraining data, which was diverse because humans produced it over a long period.","how":"Train specialized generation and critic agents: generation agents produce diverse initial solutions, critic agents evaluate/refine across debate rounds, responses are summarized across agents, and majority-vote-matching outputs are used for SFT.","detail":"<p>First paper: <b>multi-agent fine-tuning<\/b> for self-improvement with diverse reasoning chains. Motivation: pre-training compresses internet-scale data, but instruction fine-tuning needs real human preferences for good vs bad responses. The synthetic alternative is iterative fine-tuning with <b>rejection sampling<\/b>: generate solutions, filter incorrect ones, fine-tune on the good ones (variants such as <code>STaR<\/code>, optionally adding reasoning chains).<\/p><ul><li>Problem: a single LLM's solutions are highly similar, so gains stall after a few or tens of iterations; internet data was diverse because it accumulated from humans over time.<\/li><li>Mechanism: multiple specialized agents. <b>Generation agents<\/b> (fine-tuned from the same base model) produce diverse initial solutions; <b>critic agents<\/b> evaluate and refine over multiple debate rounds.<\/li><li>Each later step summarizes all other agents' responses (summarize with a model or concatenate) and includes that in generating the next response; the critic critiques the updated set rather than a single response.<\/li><li>Critics are fine-tuned on trajectories that start correct and are corrected through debate, learning to <b>contrast correct vs incorrect<\/b> answers. A naive version uses different models or prompts as a 'poor man's' diversity.<\/li><\/ul><p>Caveat: because fine-tuning is involved, you are restricted to open-source base models.<\/p>","terms":["rejection sampling","STaR","generation agents","critic agents","debate","majority voting","SFT"]},"zh":{"title":"多 agent 微调：通过辩论获得多样化推理","problem":"迭代式合成数据微调（生成、用拒绝采样过滤、对好的样本做 SFT；STaR 式）在几轮或几十轮迭代后就不再提升。","why":"单一 LLM 即使在高温度下也会产生近乎重复的解，因此训练集缺乏多样性、循环触及天花板——不同于互联网规模的预训练数据，后者因人类在长时间内产生而具有多样性。","how":"训练专门的生成 agent 与评论 agent：生成 agent 产生多样化的初始解，评论 agent 在多轮辩论中评估/精炼，跨 agent 汇总回答，并用多数投票一致的输出做 SFT。","detail":"<p>第一篇论文：用于自我改进、产生多样化推理链的 <b>多 agent 微调<\/b>。动机：预训练压缩了互联网规模的数据，但指令微调需要真实人类偏好来区分好回答与坏回答。合成替代方案是带 <b>拒绝采样<\/b> 的迭代微调：生成解、过滤错误解、对好的解微调（如 <code>STaR<\/code> 等变体，可选地加入推理链）。<\/p><ul><li>问题：单一 LLM 的解高度相似，因此几轮或几十轮后收益停滞；互联网数据因随时间从人类积累而具有多样性。<\/li><li>机制：多个专门化 agent。<b>生成 agent<\/b>（从同一基座模型微调而来）产生多样化的初始解；<b>评论 agent<\/b> 在多轮辩论中评估并精炼。<\/li><li>之后的每一步都会汇总其他所有 agent 的回答（用模型总结或拼接），并纳入其中以生成下一个回答；评论者评论的是更新后的集合，而非单个回答。<\/li><li>评论者在从初始正确、经辩论被纠正的轨迹上微调，学会 <b>对比正确与错误<\/b> 答案。朴素版本使用不同模型或提示词作为“穷人版”的多样性。<\/li><\/ul><p>注意：由于涉及微调，你只能局限于开源基座模型。<\/p>","terms":["拒绝采样","STaR","生成 agent","评论 agent","辩论","多数投票","SFT"]}},{"t":755,"figs":[{"t":804,"file":"slides/part09/slide_018.jpg"},{"t":832,"file":"slides/part09/slide_019.jpg"},{"t":852,"file":"slides/part09/slide_022.jpg"}],"en":{"title":"Multi-agent fine-tuning results and transfer","problem":"It is not obvious that multi-agent debate actually sustains hill climbing, or whether it merely produces noisier data that still saturates.","why":"Single-agent fine-tuning sharpens the generating distribution; spreading generation across specialized agents keeps the response distribution wide, so each round still carries new signal.","how":"Measure iterations vs negative log likelihood (performance proxy) and embedding dissimilarity (diversity), compare single- vs multi-agent, and test transfer to an adjacent domain (GSM8K).","detail":"<p>Results are plotted as fine-tuning iterations (x) against <b>negative log likelihood<\/b> (a performance proxy) and <b>embedding dissimilarity<\/b> (higher = more diverse).<\/p><ul><li>For two open-source models, performance keeps climbing across iterations of multi-agent fine-tuning; <b>Llama 3<\/b> appears more responsive to the technique.<\/li><li>The more interesting plot: response diversity stays high across iterations on a math dataset, while <b>single-agent fine-tuning<\/b> accuracy collapses or stops improving.<\/li><li>The experiment was repeated on math across three open-source models; multi-agent methods improved even over multiple fine-tuning steps, whereas single-agent fine-tuning plateaued.<\/li><li><b>Transfer:<\/b> on an adjacent domain, <b>GSM8K<\/b>, the fine-tuned agents also scored higher (an older paper, so absolute numbers are not high).<\/li><\/ul><p>Takeaway: self-improvement requires <b>diverse reasoning chains<\/b>; one way to generate them is multiple models or agents, and the benefit generalizes beyond the in-domain dataset. The lecture then names the open challenge: how to push the improvement frontier more reliably using only verifiable domains.<\/p>","terms":["negative log likelihood","embedding dissimilarity","Llama 3","GSM8K","generalization","diversity"]},"zh":{"title":"多 agent 微调的结果与迁移","problem":"多 agent 辩论是否真的能维持爬山，还是只是产生更嘈杂、仍会饱和的数据，这一点并不明显。","why":"单 agent 微调会锐化生成分布；把生成分散到多个专门化 agent 能让回答分布保持较宽，因此每轮仍携带新信号。","how":"测量迭代次数与负对数似然（性能代理）及嵌入不相似度（多样性）的关系，比较单 agent 与多 agent，并在相邻领域（GSM8K）上测试迁移。","detail":"<p>结果以微调迭代次数（x 轴）对 <b>负对数似然<\/b>（性能代理）与 <b>嵌入不相似度<\/b>（越高越多样）绘制。<\/p><ul><li>对两个开源模型，多 agent 微调在多轮迭代中性能持续攀升；<b>Llama 3<\/b> 似乎对该技术更敏感。<\/li><li>更有意思的图：在数学数据集上，回答多样性在多轮迭代中保持较高，而 <b>单 agent 微调<\/b> 的准确率崩塌或停止提升。<\/li><li>该实验在三个开源模型上针对数学重复进行；多 agent 方法即使经过多轮微调仍有提升，而单 agent 微调则趋于平台期。<\/li><li><b>迁移：<\/b> 在相邻领域 <b>GSM8K<\/b> 上，微调后的 agent 得分也更高（属于较老的论文，因此绝对数值不高）。<\/li><\/ul><p>要点：自我改进需要 <b>多样化的推理链<\/b>；生成它们的一种方式是用多个模型或 agent，且收益会泛化到域内数据集之外。随后讲座点出开放挑战：如何仅用可验证领域更可靠地推进改进前沿。<\/p>","terms":["负对数似然","嵌入不相似度","Llama 3","GSM8K","泛化","多样性"]}},{"t":889,"figs":[{"t":966,"file":"slides/part09/slide_024.jpg"},{"t":1007,"file":"slides/part09/slide_025.jpg"},{"t":1055,"file":"slides/part09/slide_026.jpg"},{"t":1102,"file":"slides/part09/slide_027.jpg"},{"t":1169,"file":"slides/part09/slide_029.jpg"}],"en":{"title":"Verification bottleneck: DeepSeek-Math V2 meta-verifiers","problem":"Outcome reward models only check whether the final answer matches ground truth, so math benchmarks saturate even when the reasoning is invalid -- fatal for theorem proving, which needs rigorous step-by-step derivation.","why":"LLMs are trained mostly on quantitative reasoning, emit mathematically invalid proofs, and when asked to verify declare those invalid proofs valid (LLM-as-judge fails). Expert humans can spot gaps, but process reward models are hard to build and human labeling does not scale.","how":"DeepSeek-Math V2 asks humans to identify proof flaws with no reference solution, trains LLMs to imitate that issue-spotting, and adds a meta-verifier that audits whether the verifier's flagged issues are real and whether the score follows.","detail":"<p>Second bottleneck: <b>verification<\/b>. Model outputs are hard to verify; typically you look only at the outcome -- an <b>outcome reward model<\/b> checks whether the final answer matches ground truth. This saturates math benchmarks even when the reasoning is wrong; a correct answer can hide an invalid derivation.<\/p><ul><li>Current RL assumes the final answer matches ground truth, but LLMs trained mostly on quantitative reasoning emit proofs that can be mathematically invalid.<\/li><li><b>LLM-as-judge fails<\/b> here: asked to verify, the model claims incorrect proofs are valid. Expert humans instead spot gaps -- a step that does not follow, or a bad reference -- but <b>process reward models<\/b> are hard to build and human labeling does not scale.<\/li><li><b>DeepSeek-Math V2<\/b> proposes <b>meta-verifiers<\/b>: humans identify issues in proofs with <i>no reference solutions<\/i>, LLMs learn to imitate that issue-spotting, and a meta-verifier reviews the verifier's analysis.<\/li><li>Architecture: a generator produces proofs, a verifier scores them on a <b>0.5-1<\/b> scale from identified issues, and the meta-verifier checks whether flagged issues are real and whether the score follows. Generator and verifier then co-improve in a loop.<\/li><\/ul>","terms":["outcome reward model","process reward model","DeepSeek-Math V2","meta-verifier","LLM-as-judge","theorem proving"]},"zh":{"title":"验证瓶颈：DeepSeek-Math V2 元验证器","problem":"结果奖励模型只检查最终答案是否与真值匹配，因此在推理无效时数学基准也会饱和——这对需要严格逐步骤推导的定理证明是致命的。","why":"LLM 主要在定量推理上训练，会产生数学上无效的证明，而被要求验证时又会宣称这些无效证明有效（LLM-as-judge 失败）。人类专家能发现漏洞，但过程奖励模型难以构建，人工标注也无法规模化。","how":"DeepSeek-Math V2 让人在没有参考答案的情况下找出证明缺陷，训练 LLM 模仿这种问题识别，并加入一个元验证器来审查验证器标出的问题是否真实、分数是否随之成立。","detail":"<p>第二个瓶颈：<b>验证<\/b>。模型输出难以验证；通常只看结果——<b>结果奖励模型<\/b> 检查最终答案是否与真值匹配。这会在推理错误时也让数学基准饱和；正确答案可能掩盖无效推导。<\/p><ul><li>当前 RL 假设最终答案与真值匹配，但主要在定量推理上训练的 LLM 会输出数学上可能无效的证明。<\/li><li><b>LLM-as-judge 在此失败<\/b>：被要求验证时，模型会声称不正确的证明有效。人类专家则能发现漏洞——某个步骤推导不成立，或引用有误——但 <b>过程奖励模型<\/b> 难以构建，且人工标注无法规模化。<\/li><li><b>DeepSeek-Math V2<\/b> 提出 <b>元验证器<\/b>：人类在<i>没有参考答案<\/i>的情况下识别证明中的问题，LLM 学会模仿这种问题识别，再由元验证器审视验证器的分析。<\/li><li>架构：生成器产生证明，验证器根据识别出的问题在 <b>0.5-1<\/b> 区间打分，元验证器检查标出的问题是否真实、分数是否随之成立。随后生成器与验证器在循环中共同改进。<\/li><\/ul>","terms":["结果奖励模型","过程奖励模型","DeepSeek-Math V2","元验证器","LLM-as-judge","定理证明"]}},{"t":1202,"figs":[{"t":1232,"file":"slides/part09/slide_030.jpg"},{"t":1255,"file":"slides/part09/slide_031.jpg"},{"t":1289,"file":"slides/part09/slide_032.jpg"},{"t":1353,"file":"slides/part09/slide_033.jpg"}],"en":{"title":"Meta-verification results and the verification recipe","problem":"Does adding a meta-verifier actually raise proof quality, and can the labeling loop escape dependence on human experts?","why":"Once seeded with human issue identification, the meta-verifier can automate labeling; generator and verifier form a co-improving loop where better proofs harden the verifier and a stronger verifier improves the generator.","how":"Benchmark the generator-verifier loop on IMO and CNML problems, track proof score across iterations and pass@1/best@32, then abstract the recipe: reference-free verifiers, a meta-verification block, and an incentive for deliberate reasoning.","detail":"<p>Once seeded with human-identified issues, labeling can be automated -- the meta-verifier learns the skill, so you no longer depend on experts. The loop builds on <b>GRPO<\/b> over <b>DeepSeek V3<\/b> base models and is benchmarked on <b>IMO<\/b> and <b>CNML<\/b> problems.<\/p><ul><li>Across <b>8 iterations<\/b>, the proof score keeps climbing with <b>pass@1<\/b> just from the iterative verification-generation loop.<\/li><li>With <b>best@32<\/b> (pick the best of 32 generated proofs), the model approaches <b>~42%<\/b> on the IMO short list 2024 -- promising as a hill-climbing technique.<\/li><li>Insight: the best proofs earn higher verification scores, the generator learns to separate high-quality from flawed proofs, and self-verification yields a better improvement loop.<\/li><li>Caveat: still limited to domains where verification is relatively easy.<\/li><\/ul><p>The generalizable recipe: (1) LLM-based verifiers that identify issues <b>without reference solutions<\/b>; (2) a <b>meta-verification<\/b> block to reduce hallucinated issues; (3) an added incentive for the generator to maximize quality through deliberate reasoning.<\/p>","terms":["meta-verification","GRPO","DeepSeek V3","IMO","CNML","best@32","pass@1"]},"zh":{"title":"元验证的结果与验证配方","problem":"加入元验证器是否真的能提升证明质量，标注循环能否摆脱对人类专家的依赖？","why":"一旦以人类问题识别作为种子，元验证器就能自动化标注；生成器与验证器形成一个共同改进的循环，更好的证明会强化验证器，更强的验证器会改进生成器。","how":"在 IMO 与 CNML 问题上对生成器-验证器循环做基准测试，跟踪多轮迭代中的证明分数与 pass@1/best@32，然后抽象出配方：无参考答案验证器、元验证模块，以及对刻意推理的激励。","detail":"<p>一旦以人类识别的问题作为种子，标注即可自动化——元验证器学会了这项技能，因此不再依赖专家。该循环构建在 <b>DeepSeek V3<\/b> 基座模型上的 <b>GRPO<\/b> 之上，并在 <b>IMO<\/b> 与 <b>CNML<\/b> 问题上做基准测试。<\/p><ul><li>在 <b>8 轮迭代<\/b> 中，仅凭迭代式验证-生成循环，证明分数连同 <b>pass@1<\/b> 就持续攀升。<\/li><li>配合 <b>best@32<\/b>（从 32 个生成的证明中挑最好的），模型在 IMO short list 2024 上接近 <b>~42%<\/b>——作为一种爬山技术很有前景。<\/li><li>洞见：最好的证明获得更高的验证分数，生成器学会区分高质量与有缺陷的证明，自我验证带来更好的改进循环。<\/li><li>注意：仍局限于验证相对容易的领域。<\/li><\/ul><p>可推广的配方：（1）能在<b>没有参考答案<\/b>的情况下识别问题的基于 LLM 的验证器；（2）<b>元验证<\/b> 模块以减少幻觉出的问题；（3）为生成器增加激励，使其通过刻意推理最大化质量。<\/p>","terms":["元验证","GRPO","DeepSeek V3","IMO","CNML","best@32","pass@1"]}},{"t":1393,"figs":[{"t":1455,"file":"slides/part09/slide_035.jpg"},{"t":1491,"file":"slides/part09/slide_036.jpg"},{"t":1523,"file":"slides/part09/slide_037.jpg"},{"t":1573,"file":"slides/part09/slide_038.jpg"}],"en":{"title":"Data barrier: self-proposed tasks (Absolute Zero)","problem":"SFT uses human-curated reasoning traces and RLVR needs expert-curated question-answer pairs (math/IMO experts, strong coders); as models surpass humans, the supply of experts and suitably hard tasks becomes the limiting factor.","why":"Learning needs tasks at the edge of current ability -- neither trivial nor impossible -- and human supply of such tasks cannot keep pace with model capability.","how":"A single model both proposes and solves tasks in a coding abstraction with three task types (deduction, abduction, induction); the proposer is conditioned on past generated examples to promote diversity.","detail":"<p>Third bottleneck: <b>what data or prompts should we train on?<\/b> The current stack uses human-curated reasoning traces (SFT) or expert-curated question-answer pairs (RLVR), which requires domain experts -- math experts for math, IMO experts for IMO problems, strong software coders for code. As models surpass human intelligence, finding enough experts and hard tasks becomes limiting.<\/p><ul><li>Proposal (the <b>Absolute Zero<\/b> line): a single model both <b>proposes<\/b> tasks and <b>solves<\/b> them, going to the other extreme from human curation -- essentially no external human data needed, provided some verification exists.<\/li><li>Domain: coding. Three task types: <b>deduction<\/b> (generate a program and input; the environment executes to produce the output); <b>abduction<\/b> (similar -- generate program and inputs, environment computes outputs); <b>induction<\/b> (sample an existing program, generate new inputs plus a natural-language description of the function; the environment executes and decides whether the direction is right).<\/li><li>The proposer is conditioned on <b>past generated examples<\/b>, explicitly added to the prompt, to promote diversity.<\/li><\/ul>","terms":["Absolute Zero","proposer","solver","deduction","abduction","induction","RLVR"]},"zh":{"title":"数据壁垒：自我提出的任务（Absolute Zero）","problem":"SFT 使用人工筛选的推理轨迹，RLVR 需要专家筛选的问答对（数学/IMO 专家、优秀程序员）；随着模型超越人类，专家与足够困难任务的供给成为限制因素。","why":"学习需要处于当前能力边界的任务——既非平凡也非不可能——而人类对此类任务的供给无法跟上模型能力。","how":"单一模型在带三种任务类型（演绎、溯因、归纳）的编程抽象中既提出任务又求解任务；提出器以过去生成的样例为条件以促进多样性。","detail":"<p>第三个瓶颈：<b>我们该用什么数据或提示词来训练？<\/b> 当前技术栈使用人工筛选的推理轨迹（SFT）或专家筛选的问答对（RLVR），这需要领域专家——数学需要数学专家，IMO 问题需要 IMO 专家，代码需要优秀的软件程序员。随着模型超越人类智能，找到足够的专家与困难任务会成为限制。<\/p><ul><li>提议（<b>Absolute Zero<\/b> 路线）：单一模型既 <b>提出<\/b> 任务又 <b>求解<\/b> 任务，走向与人工筛选相反的极端——基本上不需要外部人类数据，只要有某种验证存在即可。<\/li><li>领域：编程。三种任务类型：<b>演绎<\/b>（生成程序与输入；环境执行以产生输出）；<b>溯因<\/b>（类似——生成程序与输入，环境计算输出）；<b>归纳<\/b>（采样一个已有程序，生成新输入以及对该函数功能的自然语言描述；环境执行并判断方向是否正确）。<\/li><li>提出器以 <b>过去生成的样例<\/b> 为条件，明确加入提示词以促进多样性。<\/li><\/ul>","terms":["Absolute Zero","提出器","求解器","演绎","溯因","归纳","RLVR"]}},{"t":1601,"figs":[{"t":1643,"file":"slides/part09/slide_039.jpg"},{"t":1735,"file":"slides/part09/slide_040.jpg"}],"en":{"title":"Proposer rewards, validation, and evolving curriculum","problem":"A self-proposed loop can generate garbage or reward-hacked tasks, and there is no inherent signal for which generated tasks are worth training on.","why":"Selecting tasks the solver sometimes passes and sometimes fails maximizes learning signal, and code tasks can be validated objectively (execution, safety, determinism).","how":"Reward proposals by solver success (0 if never solved, else 1 minus average success rate), keep a buffer of (input, output, program) triplets with success/fail counts, and validate program integrity, safety, and determinism before training.","detail":"<p>How tasks are selected and validated:<\/p><ul><li>The proposer gets a reward from solver success. If the solver's success rate is <b>zero<\/b>, reward is <b>zero<\/b>; otherwise it is <b>1 minus average success rate<\/b>. This selects <b>moderate difficulty<\/b> -- tasks the solver sometimes passes and sometimes fails -- maximizing learning signal.<\/li><li>The goal is <b>optimal task difficulty at the current model weights<\/b>: as the model becomes more capable, the proposer must learn to generate harder problems.<\/li><li>A <b>task buffer<\/b> stores (input, output, program) triplets with success/fail counts; the proposer samples references from it.<\/li><li>Before entering the training pipeline, proposed tasks are <b>validated<\/b>: program integrity (execute and check for errors), safety checks, and determinism (same inputs must yield identical outputs -- possible in code). This prevents the proposer from hacking garbage tasks.<\/li><\/ul><p>Net effect: an <b>evolving curriculum<\/b>, a play on synthetic data generated in-loop at the task level, where proposer and solver co-adapt. It clearly relies on curriculum learning and on having some form of verification available.<\/p>","terms":["curriculum learning","task buffer","reward hacking","determinism","task validation"]},"zh":{"title":"提出器奖励、验证与演化课程","problem":"自我提出的循环可能产生垃圾任务或被奖励攻击的任务，而且对于哪些生成任务值得训练没有内在信号。","why":"选择求解器有时通过、有时失败的任务能最大化学习信号，而代码任务可以被客观验证（执行、安全、确定性）。","how":"以求解器成功率奖励提议（从未解出为 0，否则为 1 减去平均成功率），维护带成功/失败计数的 (输入, 输出, 程序) 三元组缓冲区，并在训练前验证程序完整性、安全性与确定性。","detail":"<p>任务如何被选择与验证：<\/p><ul><li>提出器从求解器成功中获得奖励。如果求解器成功率为 <b>零<\/b>，奖励为 <b>零<\/b>；否则为 <b>1 减去平均成功率<\/b>。这会选出 <b>中等难度<\/b>——求解器有时通过、有时失败的任务——从而最大化学习信号。<\/li><li>目标是 <b>在当前模型权重下的最优任务难度<\/b>：随着模型能力增强，提出器必须学会生成更难的问题。<\/li><li><b>任务缓冲区<\/b> 存储带成功/失败计数的 (输入, 输出, 程序) 三元组；提出器从中采样参考。<\/li><li>在进入训练流程之前，提出的任务会被 <b>验证<\/b>：程序完整性（执行并检查错误）、安全检查，以及确定性（相同输入必须产生相同输出——在代码中可行）。这防止提出器用垃圾任务进行攻击。<\/li><\/ul><p>净效果：一个 <b>演化课程<\/b>，是在任务层面循环内生成合成数据的一种玩法，其中提出器与求解器共同适应。它显然依赖课程学习以及某种可用的验证形式。<\/p>","terms":["课程学习","任务缓冲区","奖励攻击","确定性","任务验证"]}},{"t":1762,"figs":[{"t":1834,"file":"slides/part09/slide_041.jpg"},{"t":1900,"file":"slides/part09/slide_042.jpg"}],"en":{"title":"Self-proposed task results and emerging behaviors","problem":"It is unclear whether a self-proposed curriculum can match or beat human-curated data, and whether any gains stay in-domain.","why":"Because proposer and solver are mildly adversarial but co-improving, validated self-generated tasks act as an on-the-fly synthetic-data source whose difficulty rises with capability.","how":"Compare against models trained on tens of thousands of expert examples, track complexity and diversity metrics over iterations, and evaluate on both coding and math benchmarks.","detail":"<p>Results: the loop hill climbs on coding benchmarks with <b>no human-curated prompt data<\/b>, and outperforms models trained on <b>tens of thousands of expert examples<\/b>.<\/p><ul><li><b>Complexity metrics increase over time<\/b>, as expected when the proposer keeps raising task difficulty.<\/li><li>Diversity of programs and answers improves when the loop is set up correctly, and the proposer generates harder tasks as training progresses.<\/li><li>Proposer and solver are slightly <b>adversarial<\/b> -- a game-theoretic flavor -- but overall help each other improve.<\/li><li>Despite hill climbing only on self-proposed <i>code<\/i> tasks, they see strong performance on both coding and math benchmarks -- surprising, but explainable from other results in the field.<\/li><li><b>Larger models get bigger gains<\/b> relative to smaller models.<\/li><\/ul><p>Takeaway: task selection should not bottleneck on human data, as long as some verification exists, and the technique clearly depends on curriculum learning. This is another promising lever for continuing to hill climb the self-improvement loop.<\/p>","terms":["self-proposed tasks","complexity metrics","coding benchmarks","math transfer","curriculum learning"]},"zh":{"title":"自我提出任务的结果与涌现行为","problem":"尚不清楚自我提出的课程能否匹敌或超越人工筛选的数据，以及收益是否停留在域内。","why":"由于提出器与求解器轻度对抗但共同改进，经过验证的自生成任务充当了即时的合成数据来源，其难度随能力增长而上升。","how":"与用数万条专家样例训练的模型比较，跟踪迭代中的复杂性与多样性指标，并在编程与数学基准上评估。","detail":"<p>结果：该循环在 <b>没有任何人工筛选提示词数据<\/b> 的情况下在编程基准上爬山，并超越了用 <b>数万条专家样例<\/b> 训练的模型。<\/p><ul><li><b>复杂性指标随时间上升<\/b>，这在提出器不断提高任务难度时符合预期。<\/li><li>当循环设置得当时，程序与答案的多样性会提高，且提出器随着训练推进生成更难的任务。<\/li><li>提出器与求解器略带 <b>对抗性<\/b>——有博弈论意味——但总体上互相帮助改进。<\/li><li>尽管仅在自我提出的 <i>代码<\/i> 任务上爬山，它们在编程和数学基准上都表现出色——这有些意外，但可从该领域的其他结果中得到解释。<\/li><li><b>更大的模型比较小的模型获得更大收益。<\/b><\/li><\/ul><p>要点：只要有某种验证存在，任务选择就不应以人类数据为瓶颈，且该技术显然依赖课程学习。这是继续让自我改进循环爬山的又一个有前景的杠杆。<\/p>","terms":["自我提出任务","复杂性指标","编程基准","数学迁移","课程学习"]}},{"t":1906,"figs":[],"en":{"title":"Discussion: Swirl, transferability, and model scale","problem":"Is the self-improvement data flywheel a general phenomenon or specific to one task family?","why":"Self-generated data appears to improve the model on the generation task and to transfer to adjacent tool-use skills, and larger models absorb the flywheel better.","how":"Compare with Swirl (step-by-step RL with synthetic data): training on multi-hop QA with retrieval improved other tool calling (Python, math) and vice versa; note larger-model gains on the RL optimization side.","detail":"<p>A student connects this to <b>Swirl<\/b> (step-by-step RL with synthetic data) and the recurring <b>synthetic-data flywheel<\/b> pattern.<\/p><ul><li>In Swirl, training on multi-hop question answering <b>with retrieval<\/b> made the model better at other tool calling -- e.g. calling Python to solve math problems -- and vice versa. So self-generated data improves the model on the generation task and <b>transfers<\/b> to adjacent skills.<\/li><li>Larger models seem better at absorbing this kind of data flywheel and generalizing through it, especially on the RL optimization side.<\/li><li>The instructors note the repeated trend -- model-generated training data driving generalization -- and observe that the diversity lever and the synthetic-data flywheel reinforce each other.<\/li><\/ul><p>Implication: the open questions are how to achieve reasoning-chain diversity more reliably and how to push the improvement frontier on verifiable tasks and then transfer the gains to domains without automated verification.<\/p>","terms":["Swirl","transferability","data flywheel","tool calling","synthetic data"]},"zh":{"title":"讨论：Swirl、可迁移性与模型规模","problem":"自我改进数据飞轮是普遍现象，还是仅限某一类任务？","why":"自生成数据似乎能在生成任务上改进模型，并迁移到相邻的工具使用技能，且更大的模型能更好地吸收该飞轮。","how":"与 Swirl（带合成数据的分步 RL）比较：用检索训练多跳 QA 改进了其他工具调用（Python、数学），反之亦然；并指出 RL 优化一侧更大模型的收益。","detail":"<p>一位学生将其与 <b>Swirl<\/b>（带合成数据的分步 RL）以及反复出现的 <b>合成数据飞轮<\/b> 模式联系起来。<\/p><ul><li>在 Swirl 中，用 <b>检索<\/b> 训练多跳问答让模型更擅长其他工具调用——例如调用 Python 解数学题——反之亦然。因此自生成数据能在生成任务上改进模型，并 <b>迁移<\/b> 到相邻技能。<\/li><li>更大的模型似乎更善于吸收这类数据飞轮并借此泛化，尤其是在 RL 优化一侧。<\/li><li>讲师指出反复出现的趋势——模型生成的训练数据驱动泛化——并观察到多样性杠杆与合成数据飞轮相互强化。<\/li><\/ul><p>含义：开放问题是更可靠地实现推理链多样性，以及如何在可验证任务上推进改进前沿，再把收益迁移到没有自动验证的领域。<\/p>","terms":["Swirl","可迁移性","数据飞轮","工具调用","合成数据"]}},{"t":1987,"figs":[],"en":{"title":"Recap of three bottlenecks and the verifiable-frontier proposal","problem":"Where does the self-improvement frontier go next: stay within verifiable domains, or attack the non-verifiable ones directly?","why":"Diversity, robust verification, and data selection are the three levers; if synthetic data on diverse verifiable tasks makes models generally smarter, that can reduce dependence on labeled data elsewhere.","how":"The instructors summarize the three open problems, then propose a compute-heavy experiment: push the frontier using only verifiable domains and test whether the gains generalize to domains without automated verification.","detail":"<p>Instructor summary of the three bottlenecks, then a concrete research proposal.<\/p><ul><li><b>Diversity:<\/b> true generalization and reasoning need diverse reasoning chains; how to achieve that remains an open problem.<\/li><li><b>Verification:<\/b> the more the verifier loop can be broken without human bottlenecking -- building reward models is challenging -- the better; meta-verification is one route.<\/li><li><b>Data:<\/b> only so much data can be curated by humans for which prompts go in; breaking this barrier is important for the next generation of self-improving models.<\/li><\/ul><p><b>Proposal from the co-instructor:<\/b> measure how far the self-improvement frontier can be pushed using only <b>verifiable domains<\/b>, where synthetic data can be generated across diverse tasks and brought back to the model. The key question is whether this makes the model generally smarter and whether it <b>generalizes to non-verifiable domains<\/b> -- potentially minimizing or removing the need for labeled data there. It is flagged as a very <b>compute-heavy<\/b> research experiment.<\/p>","terms":["reasoning diversity","robust verification","data selection","verifiable domains","generalization"]},"zh":{"title":"三大瓶颈回顾与可验证前沿提议","problem":"自我改进前沿接下来走向何方：停留在可验证领域，还是直接攻克不可验证领域？","why":"多样性、鲁棒验证与数据选择是三个杠杆；如果多样可验证任务上的合成数据能让模型更普遍地变聪明，那就能减少对其他领域标注数据的依赖。","how":"讲师总结三个开放问题，然后提出一个算力密集的实验：仅用可验证领域推进前沿，并检验收益能否泛化到没有自动验证的领域。","detail":"<p>讲师对三大瓶颈的总结，随后是一个具体的研究提议。<\/p><ul><li><b>多样性：<\/b> 真正的泛化与推理需要多样的推理链；如何实现仍是开放问题。<\/li><li><b>验证：<\/b> 验证器循环越能在不造成人类瓶颈的情况下被打通越好——构建奖励模型颇具挑战——元验证是其中一条路径。<\/li><li><b>数据：<\/b> 能由人工筛选的“哪些提示词进入训练”的数据有限；打破这一壁垒对下一代自我改进模型很重要。<\/li><\/ul><p><b>联合讲师的提议：<\/b> 测量仅用 <b>可验证领域<\/b> 能把自我改进前沿推进多远，在这些领域中合成数据可跨多样任务生成并回流给模型。关键问题是这是否能让模型普遍更聪明，以及是否 <b>泛化到不可验证领域<\/b>——有可能最小化或消除那些领域对标注数据的需求。它被标记为一个非常 <b>算力密集<\/b> 的研究实验。<\/p>","terms":["推理多样性","鲁棒验证","数据选择","可验证领域","泛化"]}},{"t":2110,"figs":[],"en":{"title":"Non-verifiable domains and reward hacking","problem":"Many valuable applications have no fast verifier: scientific discovery, chip design whose simulation takes days to yield one reward signal, chemistry requiring a wet lab, and creative work whose quality is subjective.","why":"RL fine-tuning and test-time scaling need rewards that arrive quickly -- ideally instant, maybe minutes to an hour -- because training takes hundreds or thousands of iterations and cannot wait days or a human in the loop; a slightly-off learned proxy invites reward hacking.","how":"Enumerate the non-verifiable cases and their timescales, and note that subjective rewards can be modeled, but the RL or agent will hack them if the proxy is off base.","detail":"<p>Which applications fall outside verifiable problems?<\/p><ul><li><b>Scientific discovery<\/b> and <b>chip design<\/b>, where a slow simulation can take <b>days<\/b> to yield a single reward signal.<\/li><li><b>Chemistry and bio experiments<\/b> that require a wet lab: you must physically run things to see the output quality or reward.<\/li><li><b>Creativity and creative writing<\/b>, where quality is subjective and an exact reward function is hard to design -- 'truly non-verifiable'.<\/li><\/ul><p>The core constraint: in RL fine-tuning and test-time scaling, verifiers must be almost instant -- perhaps minutes, maybe up to an hour at the outside -- because training needs <b>hundreds or thousands of iterations<\/b> and cannot wait days or a human in the loop for each reward. These are the <b>non-verifiable domains<\/b>.<\/p><p>You can always model a subjective objective with a learned reward, but if the model is slightly off base the RL or agent can <b>reward-hack<\/b> it. Slow or subjective verification is therefore a structural limit on where self-improvement loops can be applied.<\/p>","terms":["non-verifiable domains","scientific discovery","chip design","wet lab","reward hacking","subjective reward"]},"zh":{"title":"不可验证领域与奖励攻击","problem":"许多有价值的应用没有快速验证器：科学发现、仿真需要数天才能给出一个奖励信号的芯片设计、需要湿实验室的化学，以及质量主观的创造性工作。","why":"RL 微调与 test-time scaling 需要快速到达的奖励——理想是即时，也许几分钟到一小时——因为训练需要数百或数千轮迭代，无法等待数天或每步都有人工介入；稍有偏差的学习代理会招致奖励攻击。","how":"列举不可验证案例及其时间尺度，并指出主观奖励可以被建模，但如果代理偏离基准，RL 或 agent 会对其发起攻击。","detail":"<p>哪些应用落在可验证问题之外？<\/p><ul><li><b>科学发现<\/b> 与 <b>芯片设计<\/b>，其中缓慢的仿真可能需要 <b>数天<\/b> 才能给出单个奖励信号。<\/li><li>需要湿实验室的 <b>化学与生物实验<\/b>：你必须实际运行才能看到输出质量或奖励。<\/li><li><b>创造力与创意写作<\/b>，其质量主观、精确的奖励函数难以设计——“真正不可验证”。<\/li><\/ul><p>核心约束：在 RL 微调与 test-time scaling 中，验证器必须近乎即时——也许几分钟，最多大概一小时——因为训练需要 <b>数百或数千轮迭代<\/b>，无法为每个奖励等待数天或人工介入。这些就是 <b>不可验证领域<\/b>。<\/p><p>你总可以用学习到的奖励来建模主观目标，但如果模型稍有偏差，RL 或 agent 就能对其 <b>奖励攻击<\/b>。因此缓慢或主观的验证是自我改进循环适用范围的结构性限制。<\/p>","terms":["不可验证领域","科学发现","芯片设计","湿实验室","奖励攻击","主观奖励"]}},{"t":2224,"figs":[],"en":{"title":"Workarounds: surrogate reward models and decomposition","problem":"How do practitioners get a usable reward when the true verification -- simulation, wet lab, performance profiling -- is slow or unavailable?","why":"A learned surrogate can stand in for the expensive check inside the RL loop, but its generality is bounded by the offline data, and inaccuracy propagates into training.","how":"Train a separate reward model on offline data to predict simulation/experiment outcome and use it as the verification object; or decompose the problem into sub-parts with reference solutions and a knowledge base (e.g. kernel-bench performance profiling).","detail":"<p>How people attack the hard-to-verify domains:<\/p><ul><li><b>Surrogate reward models.<\/b> Instead of running the expensive simulation, emulation, or experiment, collect a lot of data offline and train a separate <b>reward model<\/b> that, given an input, predicts the quality of the output. Use that model as the verification object inside the RL optimization loop. Caveat: its generality is a function of how much data you have, and inaccuracy causes problems (and reward hacking).<\/li><li><b>Problem decomposition.<\/b> Instructors cite Stanford's <b>kernel bench<\/b>-style work: compiler execution gives a pass/fail and some metrics, but reading performance profiles as complexity grows -- concatenating kernels and finding the unoptimized parts -- is a much harder problem. The common workaround is to break the problem into sub-parts, point the model at each part, and provide reference solutions in a knowledge base.<\/li><\/ul><p>Both approaches trade verification fidelity for speed: a learned proxy is cheap but exploitable, while decomposition matches the task to current model capability instead of waiting for one model to solve the whole thing.<\/p>","terms":["surrogate reward model","offline data","kernel bench","performance profiling","problem decomposition","knowledge base"]},"zh":{"title":"变通方案：代理奖励模型与问题分解","problem":"当真实验证——仿真、湿实验室、性能剖析——缓慢或不可用时，从业者如何获得可用的奖励？","why":"学习到的代理可以在 RL 循环内替代昂贵的检查，但其泛化能力受离线数据限制，且不准确性会传播到训练中。","how":"在离线数据上训练一个独立的奖励模型来预测仿真/实验结果，并将其用作验证对象；或者把问题分解为带参考解和知识库的子部分（例如 kernel-bench 性能剖析）。","detail":"<p>人们如何攻克难以验证的领域：<\/p><ul><li><b>代理奖励模型。<\/b> 不运行昂贵的仿真或实验，而是离线收集大量数据，训练一个独立的 <b>奖励模型<\/b>，给定输入即预测输出质量。将该模型用作 RL 优化循环内的验证对象。注意：其泛化能力取决于你拥有多少数据，且不准确性会引发问题（以及奖励攻击）。<\/li><li><b>问题分解。<\/b> 讲师引用 Stanford 的 <b>kernel bench<\/b> 式工作：编译器执行给出通过/失败及一些指标，但随着复杂性增长，读懂性能剖析——拼接 kernel 并找出未优化的部
