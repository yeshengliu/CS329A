主张<b>把基座模型做得更好是比无限扩大采样更容易的一条轴<\/b>，并且任何外推都必须面对成本。<\/p><ul><li><b>Capability gap：<\/b>如果基座模型不够强，它们会在某个点触到极限；更深层的目标是构建一个能推理并闭环的系统，然后把它蒸馏进一个大型推理模型。<\/li><li><b>Diversity 假设：<\/b>单纯不断加更多样本的计划假设 diversity 持续增加；聚类的存在是为了找到多样化集合，而更多不带来新解类别的样本并没有帮助。<\/li><li><b>理论：<\/b>pass@k 与样本预算之间的关系在理论上可以推导，引用的是 <i>Large Language Monkeys<\/i> 论文及其后续工作，这正是 log-linear 形式是意料之中而非令人惊讶的原因。<\/li><\/ul>","terms":["extrapolation","capability gap","diversity","Large Language Monkeys","distillation","log-linear"]}},{"t":1356,"figs":[{"t":1397,"file":"slides/part07/slide_062.jpg"},{"t":1467,"file":"slides/part07/slide_063.jpg"}],"en":{"title":"AlphaCode takeaways: coverage, novelty, and where loss misleads","problem":"High coverage is encouraging, but the approach has clear ceilings and practical limits that must be understood before reusing it.","why":"Loss is a poor proxy for solve rate because many programs can solve a problem, and one-shot generation cannot handle problems that need multiple steps.","how":"Keep massive sampling where compute allows, recognize weak domains like dynamic programming and constructive algorithms, and under a time bound rank acceptable solutions as they are generated rather than assuming unlimited attempts.","detail":"<p>Takeaways for AlphaCode:<\/p><ul><li><b>Coverage is real and genuinely novel.<\/b> Large-scale sampling plus filtering and clustering buys high coverage, and a novelty search over the training data confirmed the generated code was <b>out-of-distribution<\/b> &mdash; the model was reasoning, not copying solutions.<\/li><li><b>Loss is a poor proxy for solve rate.<\/b> Because many programs can solve a problem, good loss can coexist with weakness on specific domains such as <b>dynamic programming<\/b> and <b>constructive algorithms<\/b>.<\/li><li><b>Cost is prohibitive.<\/b> A million samples per problem is impractical everywhere; under a time bound you want to <b>rank acceptable solutions as they are generated<\/b>, whereas an accuracy-only setting favors unlimited attempts.<\/li><li><b>Hard problems need structure.<\/b> Difficult domains needed many more experiments and the one-shot approach did not do well, so <b>multi-step<\/b> solution approaches are required.<\/li><\/ul>","terms":["coverage","out-of-distribution","loss","dynamic programming","constructive algorithms","multi-step"]},"zh":{"title":"AlphaCode 要点：coverage、novelty，以及 loss 在哪里误导","problem":"高 coverage 令人鼓舞，但该方法有明确的天花板与实际限制，在复用它之前必须理解这些。","why":"loss 是 solve rate 的糟糕代理，因为许多程序都能解决同一问题，而 one-shot 生成无法处理需要多个步骤的问题。","how":"在算力允许的地方保留大规模采样，认识到 dynamic programming 与 constructive algorithms 等薄弱领域，并在时间受限时对生成出的可接受解进行排名，而不是假设有无限次尝试。","detail":"<p>AlphaCode 的要点：<\/p><ul><li><b>Coverage 是真实的，且确实新颖。<\/b>大规模采样加上筛选与聚类换来了高 coverage，而对训练数据做的 novelty 搜索确认生成的代码是 <b>out-of-distribution<\/b> 的 &mdash; 模型在推理，而不是在抄解。<\/li><li><b>Loss 是 solve rate 的糟糕代理。<\/b>因为许多程序都能解决同一问题，良好的 loss 可能与在 <b>dynamic programming<\/b> 和 <b>constructive algorithms<\/b> 等特定领域上的薄弱并存。<\/li><li><b>成本高得难以承受。<\/b>每个问题一百万样本在任何地方都不现实；在时间受限时，你希望对<b>生成出的可接受解进行排名<\/b>，而仅追求准确率的设定则偏好无限次尝试。<\/li><li><b>难题需要结构。<\/b>困难领域需要多得多的实验，且 one-shot 方法表现不佳，因此需要<b>多步<\/b>求解方法。<\/li><\/ul>","terms":["coverage","out-of-distribution","loss","dynamic programming","constructive algorithms","multi-step"]}},{"t":1481,"figs":[{"t":1498,"file":"slides/part07/slide_065.jpg"},{"t":1556,"file":"slides/part07/slide_068.jpg"},{"t":1632,"file":"slides/part07/slide_069.jpg"}],"en":{"title":"AlphaCode 2: fine-tuned Gemini Pro, a model family, and a learned scorer","problem":"AlphaCode pretrained a bespoke model, burned a million samples per problem, and relied on a clustering heuristic that cannot estimate which candidate is actually correct.","why":"A weaker base model forces more sampling, and semantic clustering only says programs are equivalent, not which one is right, so selection stayed heuristic.","how":"Fine-tune an existing LLM (Gemini Pro) instead of pretraining; fine-tune a family of variants with different hyperparameters, difficulty levels, and tags for diversity; and train a scoring model that estimates correctness, using CodeContests v2 plus a high-quality dataset.","detail":"<p>AlphaCode 2 inverts the recipe: instead of pretraining a bespoke model, start from an existing LLM &mdash; <b>Gemini Pro<\/b>, since the work was at Google &mdash; and <b>fine-tune<\/b> it rather than merely prompting. Three changes are layered on:<\/p><ul><li><b>Diversity via a model family:<\/b> multiple AlphaCode 2 variants with different hyperparameters, difficulty levels, and tags are fine-tuned so massive sampling draws from a spread of generators.<\/li><li><b>Learned scoring model:<\/b> a fine-tuned Gemini Pro produces a <b>scoring/reward<\/b> estimate of correctness, replacing the heuristic clustering-and-filtering notion of preference with a learned approximation of what deserves a high score.<\/li><li><b>Data:<\/b> fine-tuning uses the open-source <b>CodeContests v2<\/b> plus a separate high-quality dataset used to train the scorer; the goal is a better base model and better selection to cut sample cost.<\/li><\/ul>","terms":["Gemini Pro","fine-tuning","model family","scoring model","reward model","CodeContests v2"]},"zh":{"title":"AlphaCode 2：fine-tune 后的 Gemini Pro、模型家族与学习得到的 scorer","problem":"AlphaCode 预训练了一个定制模型，每个问题烧掉一百万样本，并依赖一个无法估计哪个候选实际正确的聚类启发式。","why":"较弱的基座模型迫使采样更多，而语义聚类只说明程序是否等价，并不说明哪一个是对的，因此 selection 仍是启发式的。","how":"不再预训练，而是 fine-tune 一个已有的 LLM（Gemini Pro）；fine-tune 一族具有不同超参数、难度等级与 tags 的变体以获得多样性；并训练一个估计正确性的 scoring model，使用 CodeContests v2 加一个高质量数据集。","detail":"<p>AlphaCode 2 把配方反过来：不再预训练定制模型，而是从已有的 LLM &mdash; <b>Gemini Pro<\/b>，因为这项工作在 Google 完成 &mdash; 出发，并<b>fine-tune<\/b> 它，而不仅仅是 prompting。在此之上叠加了三项改动：<\/p><ul><li><b>通过模型家族实现 diversity：<\/b>fine-tune 多个具有不同超参数、难度等级与 tags 的 AlphaCode 2 变体，使大规模采样从一组分散的 generator 中抽取。<\/li><li><b>学习得到的 scoring model：<\/b>一个 fine-tune 后的 Gemini Pro 产出对正确性的 <b>scoring/reward<\/b> 估计，用对「什么值得高分」的学习近似，取代启发式的聚类加筛选偏好概念。<\/li><li><b>数据：<\/b>fine-tuning 使用开源的 <b>CodeContests v2<\/b> 加上一个用于训练 scorer 的独立高质量数据集；目标是更好的基座模型与更好的 selection，以削减样本成本。<\/li><\/ul>","terms":["Gemini Pro","fine-tuning","model family","scoring model","reward model","CodeContests v2"]}},{"t":1636,"figs":[{"t":1645,"file":"slides/part07/slide_077.jpg"},{"t":1669,"file":"slides/part07/slide_075.jpg"},{"t":1741,"file":"slides/part07/slide_080.jpg"}],"en":{"title":"AlphaCode 2 training data: v2 segmentation and the curated scorer set","problem":"The system needs generators that produce diverse samples and a scorer that reliably estimates correctness, and neither falls out of a single dataset.","why":"Naively training one generator on one dataset yields little diversity, and a scorer needs preference data over comparable problems without being contaminated by them.","how":"Segment and tag CodeContests v2 into subsets to fine-tune multiple generator variants, and use a separate manually curated, human-annotated set to train the scorer to output a correctness probability between 0 and 1.","detail":"<p>The training stage detail answers how to get both diversity and a good scorer.<\/p><ul><li><b>Generator family:<\/b> the v2 dataset is bisected and segmented into different tagged subsets, each used to fine-tune a different generator variant, so sampling from the family yields more diverse outputs.<\/li><li><b>Scorer training:<\/b> a separate <b>manually curated, human-annotated<\/b> dataset teaches the scoring model to estimate the probability a code sample is correct between <b>0 and 1<\/b>; concretely, it learns which of two solutions to prefer and how to rank them.<\/li><li><b>Caveats raised in class:<\/b> the scorer should not train on exactly the generator problems (<b>contamination<\/b>), but it still needs <b>in-distribution<\/b> data.<\/li><li><b>Multi-stage caution:<\/b> sequentially changing data quality without mixing the previous version risks <b>catastrophic forgetting<\/b> in the final fine-tuning stage, which is why the recipe is deliberately staged.<\/li><\/ul>","terms":["CodeContests v2","segmentation","scoring model","human annotation","contamination","catastrophic forgetting"]},"zh":{"title":"AlphaCode 2 训练数据：v2 的分段与策展的 scorer 集合","problem":"系统需要能产出多样样本的 generator，以及能可靠估计正确性的 scorer，而这两者都无法从单一数据集中自然得出。","why":"天真地在一个数据集上训练单个 generator 只能带来很少的多样性，而 scorer 需要关于可比问题的偏好数据，同时又不被这些问题污染。","how":"把 CodeContests v2 分段并打上标签成子集，以 fine-tune 多个 generator 变体，并使用一个单独的、手工策展、人工标注的集合来训练 scorer 输出 0 到 1 之间的正确性概率。","detail":"<p>训练阶段的细节回答了如何同时获得多样性与一个好的 scorer。<\/p><ul><li><b>Generator 家族：<\/b>把 v2 数据集一分为二并分段成不同的带标签子集，每个子集用于 fine-tune 一个不同的 generator 变体，因此从该家族采样能产出更多样的输出。<\/li><li><b>Scorer 训练：<\/b>一个单独的<b>手工策展、人工标注<\/b>数据集教会 scoring model 估计某个代码样本正确的概率，取值在 <b>0 到 1<\/b> 之间；具体来说，它学习在两个解中更偏好哪一个以及如何对它们排名。<\/li><li><b>课堂上提出的注意事项：<\/b>scorer 不应刚好在 generator 的问题上训练（<b>contamination<\/b>），但它仍然需要 <b>in-distribution<\/b> 数据。<\/li><li><b>多阶段的谨慎：<\/b>在不混入前一版本的情况下依次改变数据质量，会在最后的 fine-tuning 阶段带来 <b>catastrophic forgetting<\/b> 的风险，这正是该配方被刻意分阶段的原因。<\/li><\/ul>","terms":["CodeContests v2","segmentation","scoring model","human annotation","contamination","catastrophic forgetting"]}},{"t":1746,"figs":[{"t":1806,"file":"slides/part07/slide_087.jpg"}],"en":{"title":"AlphaCode 2 pipeline: massive sampling to rerank and submit","problem":"Even with a better model, roughly 95% of samples do not compile or fail test inputs, so most compute is spent and discarded.","why":"Massive sampling is expensive, and after filtering you still need a principled way to pick one candidate per idea rather than relying on raw frequency.","how":"Split sampling across the model family (C++ only, randomizing temperature and metadata), execute on test inputs, remove about 95% to leave roughly 50k samples, aggregate and keep the top 10 largest clusters, then rerank with the scoring model and pick the best candidate per cluster.","detail":"<p>The AlphaCode 2 pipeline upgrades every stage of the original:<\/p><ul><li><b>Sampling:<\/b> split across the model family, now restricted to <b>C++ only<\/b> (AlphaCode used half Python, half C++), randomizing temperature and metadata for diversity.<\/li><li><b>Filtering:<\/b> each output is executed on test inputs and anything incorrect or non-compiling is removed &mdash; about <b>95%<\/b> of samples &mdash; leaving roughly <b>50k<\/b> candidates.<\/li><li><b>Curation:<\/b> aggregate, keep the <b>top 10 largest clusters<\/b>, then <b>rerank<\/b> using the scoring model's correctness estimate and pick the <b>best candidate per cluster<\/b>.<\/li><li><b>Evaluation:<\/b> the selected candidates are submitted and judged exactly as in AlphaCode, so the comparison is apples-to-apples and isolates the value of the new base model, the diversity, and the scorer.<\/li><\/ul>","terms":["large scale sampling","C++","filtering","clustering","reranking","top-10 clusters"]},"zh":{"title":"AlphaCode 2 流水线：大规模采样、重排并提交","problem":"即使有了更好的模型，约 95% 的样本仍无法编译或通不过测试输入，因此大部分算力被花掉又丢弃。","why":"大规模采样很昂贵，而筛选之后你仍需要一种有原则的方法，为每个想法挑出一个候选，而不是依赖原始频次。","how":"把采样分散到模型家族上（仅 C++，随机化 temperature 与 metadata），在测试输入上执行，剔除约 95% 只留下大约 50k 个样本，聚合并保留最大的 top 10 簇，然后用 scoring model 重排并为每个簇挑出最佳候选。","detail":"<p>AlphaCode 2 的流水线升级了原版的每一个阶段：<\/p><ul><li><b>采样：<\/b>分散到模型家族上，现在限制为<b>仅 C++<\/b>（AlphaCode 用了一半 Python、一半 C++），随机化 temperature 与 metadata 以获得多样性。<\/li><li><b>筛选：<\/b>每个输出都在测试输入上执行，错误的或无法编译的都被移除 &mdash; 约占样本的 <b>95%<\/b> &mdash; 留下大约 <b>50k<\/b> 个候选。<\/li><li><b>策展：<\/b>聚合、保留<b>最大的 top 10 簇<\/b>，然后用 scoring model 的正确性估计进行<b>重排<\/b>，并为每个簇挑出<b>最佳候选<\/b>。<\/li><li><b>评估：<\/b>选出的候选完全按 AlphaCode 的方式提交与评判，因此比较是同类对同类，能隔离出新基座模型、diversity 与 scorer 的价值。<\/li><\/ul>","terms":["large scale sampling","C++","filtering","clustering","reranking","top-10 clusters"]}},{"t":1807,"figs":[{"t":1806,"file":"slides/part07/slide_087.jpg"},{"t":1814,"file":"slides/part07/slide_084.jpg"}],"en":{"title":"AlphaCode 2 results: 100 samples match the old million","problem":"It is unclear how much the new system actually buys over AlphaCode for the same test-time compute.","why":"A better base model, a diverse generator family, and a learned scorer should each reduce the number of samples needed to reach a given solve rate.","how":"Compare solve rate against sampling budget: by about 100 samples AlphaCode 2 matches AlphaCode at 1 million, and at 1 million it reaches 43% versus 25%, roughly a 2x gain at equal budget.","detail":"<p>Comparing AlphaCode 2 with AlphaCode, with sampling budget on the x-axis and solve rate on the y-axis:<\/p><ul><li><b>Sample efficiency:<\/b> by about <b>100 samples<\/b>, AlphaCode 2 reaches the solve rate that AlphaCode needed <b>1 million samples<\/b> to reach.<\/li><li><b>Headline:<\/b> at 1M samples AlphaCode 2 solves <b>43%<\/b> versus AlphaCode's <b>25%<\/b> &mdash; close to a <b>2x<\/b> improvement at equal budget.<\/li><li><b>Sources of the gain:<\/b> a better base model, more diverse solutions, and a better scoring model, all layered into one system.<\/li><li><b>Still scaling:<\/b> the solve rate continues to improve with more samples, so the system benefits from both better modelling and more test-time compute.<\/li><li><b>Cost caveat:<\/b> the pipeline still discards the overwhelming majority of samples as non-compiling or incorrect, which is where the compute bill concentrates.<\/li><\/ul>","terms":["solve rate","sampling budget","sample efficiency","2x","scoring model","test-time compute"]},"zh":{"title":"AlphaCode 2 结果：100 个样本媲美过去的一百万","problem":"在相同的 test-time compute 下，新系统相对 AlphaCode 究竟带来多少收益，尚不清楚。","why":"更好的基座模型、多样化的 generator 家族以及学习得到的 scorer，各自都应减少达到某一给定 solve rate 所需的样本数。","how":"比较 solve rate 与采样预算：约 100 个样本时 AlphaCode 2 就能达到 AlphaCode 用 1 百万样本达到的水平，而在 1 百万样本时它达到 43%，AlphaCode 为 25%，在相同预算下大致是 2 倍的提升。","detail":"<p>把 AlphaCode 2 与 AlphaCode 作比较，横轴为采样预算，纵轴为 solve rate：<\/p><ul><li><b>Sample efficiency：<\/b>约 <b>100 个样本<\/b>时，AlphaCode 2 就达到了 AlphaCode 需要 <b>1 百万样本<\/b>才能达到的 solve rate。<\/li><li><b>头条结果：<\/b>在 1M 样本时 AlphaCode 2 解决 <b>43%<\/b>，AlphaCode 为 <b>25%<\/b> &mdash; 在相同预算下接近 <b>2 倍<\/b>的提升。<\/li><li><b>收益的来源：<\/b>更好的基座模型、更多样的解，以及更好的 scoring model，全部叠加进一个系统。<\/li><li><b>仍在 scaling：<\/b>solve rate 随更多样本继续提升，因此系统同时受益于更好的建模与更多 test-time compute。<\/li><li><b>成本注意事项：<\/b>流水线仍把绝大多数样本作为无法编译或错误而丢弃，这也是算力账单集中的地方。<\/li><\/ul>","terms":["solve rate","sampling budget","sample efficiency","2x","scoring model","test-time compute"]}},{"t":1888,"figs":[{"t":2122,"file":"slides/part07/slide_091.jpg"}],"en":{"title":"Q&A and practical framing: sampling cost, self-iteration, RL, production scale","problem":"A student flags that roughly 95% of sampling compute is wasted on non-compiling or wrong answers and asks whether better prompting or sampling could reduce it.","why":"This paper did not address it directly, so the class falls back on earlier course ideas and the practical question of how to build systems that use test-time compute efficiently.","how":"Use self-iteration and refinement on top of generated samples, add an RL loop so the model needs less test-time compute, aggregate information across samples, and remember that production agents run far more samples than everyday chat models.","detail":"<p>The instructor confirms this paper did not attack the waste directly, then links to earlier course ideas and a broader practical framing.<\/p><ul><li><b>Self-iteration:<\/b> generate solutions, collect any available feedback, and refine them &mdash; essentially <b>parallel search<\/b> plus refinement; the open question is what feedback is actually available for code.<\/li><li><b>RL instead of raw sampling:<\/b> improving the model with an RL loop can substitute for test-time sample volume, cutting inference cost.<\/li><li><b>Aggregation:<\/b> better ways to aggregate information across the sampled candidates can also reduce how many are needed.<\/li><li><b>Production framing:<\/b> everyday reasoning models use dozens of samples, while production research agents can run hundreds of thousands; the hard problem is <b>building the system<\/b> that reasons and closes the loop, then distilling that into a single large reasoning model.<\/li><\/ul>","terms":["self-refinement","RL loop","aggregation","distillation","test-time compute","production scale"]},"zh":{"title":"问答与实践框架：采样成本、自迭代、RL、production scale","problem":"一名学生指出，约 95% 的采样算力浪费在无法编译或错误的答案上，并问更好的 prompting 或采样能否减少这种浪费。","why":"这篇论文没有直接处理该问题，因此课堂退回到课程早先的想法，以及如何构建高效利用 test-time compute 的系统的实际问题。","how":"在生成的样本之上使用 self-iteration 与 refinement，加入 RL 循环使模型需要更少的 test-time compute，跨样本聚合信息，并记住 production agent 运行的样本数远多于日常 chat 模型。","detail":"<p>讲师确认这篇论文没有直接攻克这一浪费，随后把它联系到课程早先的想法以及一个更广的实践框架。<\/p><ul><li><b>Self-iteration：<\/b>生成解、收集任何可得的反馈，并对其进行精炼 &mdash; 本质上是<b>并行搜索<\/b>加 refinement；悬而未决的问题是，对于代码而言究竟有哪些反馈可用。<\/li><li><b>用 RL 取代原始采样：<\/b>用 RL 循环改进模型可以替代 test-time 的样本量，从而降低推理成本。<\/li><li><b>聚合：<\/b>更好的跨采样候选聚合信息的方法，也能减少所需的样本数量。<\/li><li><b>生产框架：<\/b>日常推理模型使用几十个样本，而生产环境中的 research agent 可以运行数十万个；真正的难题是<b>构建系统<\/b>使其推理并闭环，然后把它蒸馏进单个大型推理模型。<\/li><\/ul>","terms":["self-refinement","RL loop","aggregation","distillation","test-time compute","production scale"]}},{"t":2155,"figs":[],"en":{"title":"Q&A on the scoring model: contamination, in-distribution data, forgetting","problem":"Why is the scoring model not simply trained on the same CodeContests v2 data used to train the generators?","why":"A scorer trained on exactly the generator problems risks contamination, yet it still needs data from a comparable distribution to generalize.","how":"Train the scorer on a separate, curated set drawn from the same distribution but not the same problems, teaching it a preference/ranking signal; handle multi-stage fine-tuning carefully to avoid forgetting.","detail":"<p>The instructor frames the answer as deliberate system design rather than an oversight.<\/p><ul><li><b>Contamination:<\/b> the scorer should not see exactly the same problems as the generators, or it can be contaminated by them.<\/li><li><b>In-distribution requirement:<\/b> it still needs data from a similar distribution, so the fix is a separate, curated set over comparable problems.<\/li><li><b>What the scorer learns:<\/b> given two solutions for a problem class, which should be preferred and what ranking to apply &mdash; a preference signal rather than raw correctness labels on generator problems.<\/li><li><b>Multi-stage caution:<\/b> mixing datasets across stages is doable but delicate; if you change data quality without mixing the previous version, the model can forget earlier information in the final fine-tuning stage.<\/li><\/ul>","terms":["scoring model","contamination","in-distribution","preference ranking","multi-stage fine-tuning","forgetting"]},"zh":{"title":"关于 scoring model 的问答：contamination、in-distribution 数据、forgetting","problem":"为什么 scoring model 不直接在训练 generator 所用的同一份 CodeContests v2 数据上训练？","why":"在恰好是 generator 问题的数据上训练的 scorer 有 contamination 风险，但它仍需要来自可比分布的数据才能泛化。","how":"在一个单独的、策展过的集合上训练 scorer，该集合取自同一分布但不是同一批问题，教给它一种 preference/ranking 信号；谨慎处理多阶段 fine-tuning 以避免 forgetting。","detail":"<p>讲师把这一答案框定为有意的系统设计，而非疏漏。<\/p><ul><li><b>Contamination：<\/b>scorer 不应看到与 generator 完全相同的问题，否则可能被它们污染。<\/li><li><b>In-distribution 要求：<\/b>它仍然需要来自相似分布的数据，因此解决办法是一个单独的、针对可比问题的策展集合。<\/li><li><b>Scorer 学到什么：<\/b>给定同一问题类别下的两个解，应更偏好哪个、应采用什么排名 &mdash; 这是一种偏好信号，而不是 generator 问题上的原始正确性标签。<\/li><li><b>多阶段的谨慎：<\/b>跨阶段混合数据集可行但很微妙；如果你在不混入前一版本的情况下改变数据质量，模型会在最后的 fine-tuning 阶段忘记早先的信息。<\/li><\/ul>","terms":["scoring model","contamination","in-distribution","preference ranking","multi-stage fine-tuning","forgetting"]}},{"t":2266,"figs":[{"t":2304,"file":"slides/part07/slide_096.jpg"},{"t":2344,"file":"slides/part07/slide_098.jpg"},{"t":2383,"file":"slides/part07/slide_100.jpg"}],"en":{"title":"Aggregate results versus humans, takeaways, and two discussion questions","problem":"It is unclear how AlphaCode 2 compares to human contestants overall, as opposed to on isolated contests.","why":"Aggregate comparison requires the percentile of contestants scoring at a given level, which contextualizes what the system-level gains mean.","how":"Report normalized score versus human percentile: about the 85th percentile, between expert and candidate/master level, up from AlphaCode's 46%, with top-two solutions exceeding roughly 99.5%.","detail":"<p>Aggregate comparison to humans uses the <b>percentile of contestants<\/b> at a given score:<\/p><ul><li><b>AlphaCode 2<\/b> performs around the <b>85th percentile<\/b>, between expert and candidate/master level contestants, a clear step up from AlphaCode, which outperformed about <b>46%<\/b>.<\/li><li>If you take the <b>top two<\/b> submitted solutions, AlphaCode 2 would outperform roughly <b>99.5%<\/b> of contestants &mdash; a large jump achieved in a single year by improving the system rather than only scaling samples.<\/li><\/ul><p>Takeaways: performance rose with <b>fewer samples<\/b>, driven by a better foundation model and a scoring model that selects the best candidate; but experimentation is still costly, the approach is very code-specific, and much compute is wasted on bad syntax. Two discussion questions are posed: how to adapt the methods to <b>task complexity<\/b>, and how to <b>embed reasoning<\/b> directly into the models.<\/p>","terms":["percentile","normalized score","top-two solutions","foundation model","scoring model","takeaways"]},"zh":{"title":"与人类比较的汇总结果、要点，以及两个讨论问题","problem":"目前不清楚 AlphaCode 2 在总体上（而非仅在个别竞赛上）与人类参赛者相比如何。","why":"汇总比较需要某一给定得分水平上参赛者的百分位，这为系统层面的增益意味着什么提供了背景。","how":"报告 normalized score 与人类百分位的关系：约在第 85 百分位，介于 expert 与 candidate/master 水平之间，较 AlphaCode 的 46% 有所提升，若取前两个解则超过约 99.5%。","detail":"<p>与人类的汇总比较使用某一给定得分上<b>参赛者的百分位<\/b>：<\/p><ul><li><b>AlphaCode 2<\/b> 的表现大约在第 <b>85 百分位<\/b>，介于 expert 与 candidate/master 水平的参赛者之间，明显比 AlphaCode 更进一步，后者胜过约 <b>46%<\/b> 的参赛者。<\/li><li>如果取<b>前两个<\/b>提交解，AlphaCode 2 将胜过大约 <b>99.5%<\/b> 的参赛者 &mdash; 这是通过改进系统而非仅仅扩大采样，在一年之内取得的巨大跃升。<\/li><\/ul><p>要点：性能以<b>更少的样本<\/b>得以提升，驱动因素是更好的 foundation model 以及选出最佳候选的 scoring model；但实验仍然昂贵，该方法高度特定于代码，且大量算力浪费在糟糕的语法上。讲座提出了两个讨论问题：如何让这些方法适应<b>task complexity<\/b>，以及如何把<b>reasoning 直接嵌入<\/b>模型。<\/p>","terms":["percentile","normalized score","top-two solutions","foundation model","scoring model","takeaways"]}},{"t":2401,"figs":[],"en":{"title":"Class discussion: difficulty-aware sampling","problem":"The pipeline is one-size-fits-all: it cannot adapt the sampling budget to how hard a problem actually is.","why":"Easy problems reach coverage with far fewer samples, while hard problems need more or must be decomposed, so a fixed million-sample budget is wasteful.","how":"A difficulty judge labels each question easy, medium, or hard and the sampling set carries those labels; easier questions draw more from the easier bank and need fewer samples, while hard ones use decomposition and multi-step search.","detail":"<p>For the question of adapting to task complexity, the class proposes a <b>difficulty judge<\/b>:<\/p><ul><li><b>Label first:<\/b> a separate model classifies each question as easy, medium, or hard, and the sampling dataset carries those labels.<\/li><li><b>Route the budget:<\/b> if a question is easy, sample from the matching bank &mdash; simpler problems are more likely to reach coverage with fewer samples, echoing the test-time-compute lectures.<\/li><li><b>Fewer samples when possible:<\/b> the point is to avoid always paying for a million samples; easier problems can be solved with an initial set plus some iterative refinement.<\/li><li><b>Trade-off between strategies:<\/b> large parallel sampling buys diversity across approaches, whereas refinement tries to fix what the model already produced; harder problems may need <b>decomposition<\/b> and multi-step search.<\/li><\/ul>","terms":["difficulty judge","task complexity","sampling budget","decomposition","iterative refinement","coverage"]},"zh":{"title":"课堂讨论：难度感知的采样","problem":"流水线是一刀切的：它无法根据问题实际的难度来调整采样预算。","why":"简单问题用远少于一百万的样本就能达到 coverage，而困难问题需要更多样本或必须被分解，因此固定的百万样本预算很浪费。","how":"一个 difficulty judge 把每个问题标记为 easy、medium 或 hard，采样集携带这些标签；较简单的问题更多从较容易的题库中抽取并需要更少样本，而困难问题使用 decomposition 与 multi-step search。","detail":"<p>对于如何适应 task complexity 的问题，课堂提出了一个 <b>difficulty judge<\/b>：<\/p><ul><li><b>先打标签：<\/b>一个单独的模型把每个问题分类为 easy、medium 或 hard，采样数据集携带这些标签。<\/li><li><b>分配预算：<\/b>如果问题简单，就从匹配的题库中采样 &mdash; 更简单的问题更可能用更少样本达到 coverage，这与 test-time-compute 几讲相呼应。<\/li><li><b>尽可能减少样本：<\/b>要点是避免总是支付一百万样本的代价；较简单的问题可以用一个初始集合加上一些 iterative refinement 来解决。<\/li><li><b>策略之间的权衡：<\/b>大规模并行采样换来跨方法的 diversity，而 refinement 试图修正模型已经产出的东西；更难的问题可能需要 <b>decomposition<\/b> 与 multi-step search。<\/li><\/ul>","terms":["difficulty judge","task complexity","sampling budget","decomposition","iterative refinement","coverage"]}},{"t":2555,"figs":[],"en":{"title":"Class discussion: embedding reasoning into the model","problem":"The model does not capture the thinking a programmer does before writing code, so it solves hard problems in one shot rather than reasoning toward them.","why":"Training data that includes only final solutions misses the abstract pattern and the chain of thought that generalize to new problems.","how":"Add algorithmic hints and chain-of-thought to training data, use STaR-style hint rationalization, decompose hard problems into hinted subparts, run tree search with backtracking, and keep a human in the loop for out-of-distribution patterns.","detail":"<p>For embedding reasoning, the class and instructor converge on several mechanisms:<\/p><ul><li><b>Hints in the training data:<\/b> capture what programmers think before writing &mdash; the kind of algorithm, a more generic version of the pattern &mdash; so the model learns an abstract solution approach, not only output code.<\/li><li><b>STaR-style rationalization:<\/b> generate the solution, provide the answer as a hint, and ask the model to reconstruct the reasoning, then train on that chain of thought.<\/li><li><b>Decomposition:<\/b> split complex problems into subparts and add hints for each, since a correct first step can be followed by a flawed later one.<\/li><li><b>Tree search with backtracking:<\/b> sample step one, check whether it is roughly correct, sample step two, and backtrack as needed &mdash; closing the loop multi-step.<\/li><li><b>Human in the loop:<\/b> genuinely out-of-distribution patterns may need an AI-scientist-style workflow.<\/li><\/ul>","terms":["chain of thought","STaR","hints","decomposition","tree search","backtracking","human in the loop"]},"zh":{"title":"课堂讨论：把 reasoning 嵌入模型","problem":"模型没有捕捉程序员写代码之前的思考过程，因此它一次性（one shot）解决难题，而不是朝着解推理。","why":"只包含最终解的训练数据遗漏了能泛化到新问题的抽象模式与 chain of thought。","how":"向训练数据加入算法提示与 chain-of-thought，使用 STaR 风格的 hint rationalization，把难题分解为带提示的子部分，运行带 backtracking 的 tree search，并对 out-of-distribution 模式保留 human in the loop。","detail":"<p>对于如何嵌入 reasoning，课堂与讲师归结出若干机制：<\/p><ul><li><b>训练数据中的提示：<\/b>捕捉程序员在写之前所想 &mdash; 算法的种类、模式的更通用版本 &mdash; 使模型学到一种抽象的解题方法，而不只是输出代码。<\/li><li><b>STaR 风格的 rationalization：<\/b>生成解，把答案作为提示提供，并要求模型重建推理过程，然后在这个 chain of thought 上训练。<\/li><li><b>Decomposition：<\/b>把复杂问题拆成子部分并为每个部分加提示，因为正确的前一步之后可能跟着有缺陷的后一步。<\/li><li><b>带 backtracking 的 tree search：<\/b>采样第一步、检查它是否大致正确、采样第二步，并按需回溯 &mdash; 以多步方式闭环。<\/li><li><b>Human in the loop：<\/b>真正 out-of-distribution 的模式可能需要 AI-scientist 风格的工作流。<\/li><\/ul>","terms":["chain of thought","STaR","hints","decomposition","tree search","backtracking","human in the loop"]}},{"t":2792,"figs":[{"t":2831,"file":"slides/part07/slide_105.jpg"},{"t":2888,"file":"slides/part07/slide_107.jpg"}],"en":{"title":"Deep research agents: knowledge cutoffs and uncertainty in reasoning chains","problem":"Large reasoning models have a fixed knowledge cutoff and cannot know events after training; when they hit a gap they guess from their weights and the error cascades.","why":"The knowledge gap surfaces as uncertainty tokens in long reasoning traces (visible on GPQA), so an early guess contaminates the rest of the chain and the final answer is low-confidence.","how":"Bootstrap the gaps with external retrieval rather than trusting the weights, turning deep research agents into a way to bridge knowledge the base reasoning model does not have.","detail":"<p>The lecture pivots to <b>deep research agents<\/b>, built on top of large reasoning models. These reason impressively but are frozen at a <b>knowledge cutoff<\/b>: if something happened yesterday, the model must look it up rather than recall it.<\/p><ul><li><b>Failure mode:<\/b> when reasoning models lack knowledge they tend to <b>guess<\/b>, and the guess propagates as an error through the rest of the chain, leaving the final answer low-confidence.<\/li><li><b>Diagnostic signal:<\/b> on <b>GPQA<\/b>, uncertainty terms such as <i>perhaps<\/i>, <i>alternatively<\/i>, and <i>wait<\/i> appear frequently in reasoning chains &mdash; knowledge gaps surface as expressed uncertainty.<\/li><li><b>Goal:<\/b> bootstrap those gaps with external information so the uncertainty does not cascade into a wrong final answer.<\/li><li><b>Transition:<\/b> the rest of the lecture contrasts how to retrieve and integrate that information during, not before, reasoning.<\/li><\/ul>","terms":["deep research agent","knowledge cutoff","GPQA","uncertainty","reasoning chain","bootstrap"]},"zh":{"title":"Deep research agent：knowledge cutoff 与 reasoning chain 中的不确定性","problem":"大型推理模型有固定的 knowledge cutoff，无法知道训练之后发生的事件；当它们遇到知识缺口时，会从权重中猜测，误差随之级联。","why":"知识缺口在长推理轨迹中表现为不确定性 token（在 GPQA 上可见），因此早期的猜测污染链条的其余部分，最终答案的置信度很低。","how":"用外部检索来 bootstrap 这些缺口，而不是信任权重，使 deep research agent 成为弥合基座推理模型所不具备知识的一种方式。","detail":"<p>讲座转向 <b>deep research agent<\/b>，它构建在大型推理模型之上。这些模型推理能力令人印象深刻，但被冻结在一个 <b>knowledge cutoff<\/b> 上：如果某件事发生在昨天，模型必须去查找，而不是凭记忆回想。<\/p><ul><li><b>失败模式：<\/b>当推理模型缺乏知识时，它们倾向于<b>猜测<\/b>，而猜测会作为错误传播到链条的其余部分，使最终答案的置信度很低。<\/li><li><b>诊断信号：<\/b>在 <b>GPQA<\/b> 上，诸如 <i>perhaps<\/i>、<i>alternatively<\/i> 和 <i>wait<\/i> 这类不确定性词汇频繁出现在 reasoning chain 中 &mdash; 知识缺口表现为外显的不确定性。<\/li><li><b>目标：<\/b>用外部信息 bootstrap 这些缺口，使不确定性不会级联成错误的最终答案。<\/li><li><b>转折：<\/b>本讲余下部分对比如何在推理期间而非之前检索并整合这些信息。<\/li><\/ul>","terms":["deep research agent","knowledge cutoff","GPQA","uncertainty","reasoning chain","bootstrap"]}},{"t":2901,"figs":[{"t":2910,"file":"slides/part07/slide_108.jpg"},{"t":3029,"file":"slides/part07/slide_111.jpg"}],"en":{"title":"RAG versus agentic RAG and Search-o1's on-the-fly querying","problem":"Plain retrieval-augmented generation retrieves once at the beginning, so each reasoning step cannot request the different piece of information it actually needs.","why":"A simple weather question may need one search, but a complex multi-part problem needs new information after each reasoning step, and retrieval up front cannot adapt.","how":"Agentic RAG triggers searches during reasoning when the model hits entities it cares about, and Search-o1 goes further: the model generates queries on the go at knowledge gaps over multiple iterations, then analyzes retrieved documents rather than dumping them.","detail":"<p>Three approaches are contrasted:<\/p><ul><li><b>Direct reasoning:<\/b> the model answers alone and, on knowledge gaps, guesses from its weights.<\/li><li><b>Plain RAG:<\/b> generate a query, retrieve a document, put it in the prompt, answer. It improves over direct reasoning but <b>retrieves once at the beginning<\/b>, so it cannot adapt mid-reasoning; on complex, multi-part problems each reasoning step needs different information, so it suffers on multi-step reasoning.<\/li><li><b>Agentic RAG:<\/b> insert special tokens where the model cares about an entity, trigger search tool calls <i>during<\/i> reasoning, and insert the returned documents into the reasoning chain &mdash; effectively calling tools as part of reasoning.<\/li><li><b>Search-o1's refinement:<\/b> the model generates queries <b>on the go<\/b> whenever it detects a knowledge gap, issuing multiple retrieval iterations in one reasoning session and <b>analyzing retrieved documents<\/b> instead of dumping them.<\/li><\/ul>","terms":["retrieval augmented generation","agentic rag","Search-o1","tool call","multi-step reasoning","knowledge gap"]},"zh":{"title":"RAG 与 agentic RAG，以及 Search-o1 的即时查询","problem":"朴素的 retrieval-augmented generation 在开始时只检索一次，因此每个推理步骤无法请求它实际需要的不同信息。","why":"一个简单的天气问题可能只需一次搜索，但一个复杂的多部分问题在每个推理步骤后都需要新信息，而事前的检索无法适应。","how":"agentic RAG 在推理过程中当模型遇到它关心的实体时触发搜索，而 Search-o1 更进一步：模型在知识缺口处即时生成查询，跨越多个迭代，然后分析检索到的文档而不是把它们一股脑塞入。","detail":"<p>对比了三种方法：<\/p><ul><li><b>Direct reasoning：<\/b>模型独自作答，遇到知识缺口时从权重中猜测。<\/li><li><b>Plain RAG：<\/b>生成查询、检索文档、放入 prompt、作答。它比 direct reasoning 有改进，但<b>只在开始时检索一次<\/b>，因此无法在推理中途适应；在复杂的多部分问题上，每个推理步骤需要不同信息，所以它在 multi-step reasoning 上表现不佳。<\/li><li><b>Agentic RAG：<\/b>在模型关心某个实体处插入特殊 token，在推理<i>期间<\/i>触发 search tool call，并把返回的文档插入 reasoning chain &mdash; 实际上是把工具调用作为推理的一部分。<\/li><li><b>Search-o1 的 refinement：<\/b>每当模型检测到知识缺口时就<b>即时<\/b>生成查询，在一次推理会话中发起多次检索迭代，并<b>分析检索到的文档<\/b>而不是把它们一股脑塞入。<\/li><\/ul>","terms":["retrieval augmented generation","agentic rag","Search-o1","tool call","multi-step reasoning","knowledge gap"]}},{"t":3040,"figs":[{"t":3043,"file":"slides/part07/slide_122.jpg"}],"en":{"title":"Reason within documents: the chemistry walkthrough","problem":"A chemistry question asks for the carbon-atom count of product three; vanilla reasoning guesses the structure and plain retrieval dumps too much context.","why":"Fetching many related documents gives more noise than signal, so the model is overwhelmed and still answers wrongly, while a single guessed structure also fails.","how":"Search-o1 searches the unfamiliar formula, reasons within the retrieved documents, extracts only the relevant chunk, refines it to a structure, and integrates it cleanly into the reasoning chain to produce the correct answer.","detail":"<p>The chemistry walkthrough makes the distinction concrete. The question asks for the carbon-atom count of product three, produced by a chain of reactions.<\/p><ul><li><b>Vanilla reasoning:<\/b> the model encounters an unfamiliar formula, does not look it up, and <b>guesses<\/b> a structure from its weights; the guess is wrong and the error cascades, so the final answer is low-confidence and incorrect.<\/li><li><b>Agentic RAG:<\/b> the model issues a web search and returns documents, but it dumps too much context. Fetching about <b>10 related documents<\/b> gives more noise than signal, the model is overwhelmed, and it still answers wrongly &mdash; <b>14<\/b> carbons instead of the correct <b>10<\/b>.<\/li><li><b>Search-o1:<\/b> it searches the formula, <b>reasons within the retrieved documents<\/b>, extracts only the relevant chunk, refines to a structure, and integrates cleanly into the chain to answer correctly.<\/li><li><b>Lesson:<\/b> the ability to summarize and reason within documents, rather than stuffing the prompt, is what improves the final answer.<\/li><\/ul>","terms":["Search-o1","reason in documents","chunk extraction","over-retrieval","context length","chemistry"]},"zh":{"title":"在文档内推理：化学示例讲解","problem":"一道化学题问第三个产物的碳原子数；vanilla reasoning 猜测结构，而 plain retrieval 塞入过多上下文。","why":"抓取许多相关文档带来的噪声多于信号，因此模型被淹没且仍然答错，而单独一个猜测的结构同样失败。","how":"Search-o1 搜索不熟悉的化学式，在检索到的文档内推理，只抽取相关的 chunk，把它精炼成一个结构，并干净地整合进 reasoning chain 以得出正确答案。","detail":"<p>这个化学示例把区别讲得很具体。题目问由一连串反应生成的第三个产物的碳原子数。<\/p><ul><li><b>Vanilla reasoning：<\/b>模型遇到一个不熟悉的化学式，不去查找，而是从权重中<b>猜测<\/b>一个结构；猜测是错的，误差级联，因此最终答案置信度低且不正确。<\/li><li><b>Agentic RAG：<\/b>模型发起网络搜索并返回文档，但它塞入了过多上下文。抓取约 <b>10 篇相关文档<\/b>带来的噪声多于信号，模型被淹没，仍然答错 &mdash; 给出 <b>14<\/b> 个碳，而正确答案是 <b>10<\/b> 个。<\/li><li><b>Search-o1：<\/b>它搜索该化学式，<b>在检索到的文档内推理<\/b>，只抽取相关的 chunk，精炼成一个结构，并干净地整合进链条以正确作答。<\/li><li><b>教训：<\/b>能在文档内总结并推理，而不是把 prompt 塞满，才是改善最终答案的关键。<\/li><\/ul>","terms":["Search-o1","reason in documents","chunk extraction","over-retrieval","context length","chemistry"]}},{"t":3300,"figs":[{"t":3301,"file":"slides/part07/slide_131.jpg"},{"t":3390,"file":"slides/part07/slide_127.jpg"},{"t":3578,"file":"slides/part07/slide_134.jpg"},{"t":3641,"file":"slides/part07/slide_136.jpg"}],"en":{"title":"Reason-in-documents mechanics, context engineering, and pass@1 results","problem":"Agentic RAG still dumps raw, lengthy, noisy documents into the prompt, and long-context reasoning degrades when 10 or 20 documents are concatenated.","why":"The binding constraint is how much relevant, non-noisy content the model can actually reason over, not how much text you can fit in the window.","how":"Reason-in-documents analyzes each retrieved document for relevance and extracts only the relevant chunks, considering the current query and prior reasoning, then appends just those; empirically, pass@1 rises with the number of documents for Search-o1 while direct reasoning and plain RAG stay flat.","detail":"<p>Mechanically, agentic RAG and Search-o1 inject retrieval into the token stream:<\/p><ul><li><b>Special tokens:<\/b> while generating, the model emits special tokens that mark a search query; the retrieval tool returns documents that are appended to the reasoning chain.<\/li><li><b>Reason-in-documents module:<\/b> rather than dumping raw documents, it analyzes each for relevance and <b>extracts the relevant chunks<\/b>, appending only those &mdash; analogous to a human taking notes instead of curating every reference.<\/li><li><b>State assumption:<\/b> a memory buffer tracks the current query and prior reasoning; the structure makes this explicit rather than implicit.<\/li><li><b>Context-engineering limit:<\/b> the binding constraint is how much content the model can reason over well, a concern of the recent <i>agentic context engineering<\/i> work; the ideal is to reason well over everything.<\/li><li><b>Evidence:<\/b> plotting pass@1 against the number of documents, direct reasoning and plain RAG stay flat while Search-o1 <b>improves<\/b> &mdash; an axis of <b>parallel refinement<\/b> built on chunk extraction.<\/li><\/ul>","terms":["reason in documents","special tokens","memory buffer","agentic context engineering","pass@1","parallel refinement"]},"zh":{"title":"Reason-in-documents 机制、context engineering 与 pass@1 结果","problem":"agentic RAG 仍把原始、冗长、含噪的文档塞进 prompt，而当拼接 10 或 20 篇文档时，long-context reasoning 会退化。","why":"真正的约束是模型实际能够推理多少相关、非噪声的内容，而不是你能在窗口里塞进多少文本。","how":"reason-in-documents 结合当前查询与先前推理，分析每篇检索到的文档的相关性并只抽取相关 chunk，然后仅追加这些内容；经验上，Search-o1 的 pass@1 随文档数量上升，而 direct reasoning 与 plain RAG 保持平坦。","detail":"<p>从机制上看，agentic RAG 与 Search-o1 把检索注入到 token 流中：<\/p><ul><li><b>特殊 token：<\/b>生成时模型发出标记搜索查询的特殊 token；检索工具返回文档，这些文档被追加到 reasoning chain 中。<\/li><li><b>Reason-in-documents 模块：<\/b>它不塞入原始文档，而是分析每篇文档的相关性并<b>抽取相关 chunk<\/b>，只追加这些内容 &mdash; 类似于人做笔记，而不是把每一条参考文献都整理进去。<\/li><li><b>状态假设：<\/b>一个 memory buffer 跟踪当前查询与先前推理；该结构把这变得显式而非隐式。<\/li><li><b>Context-engineering 的限制：<\/b>真正的约束是模型能多好地推理多少内容，这是近期 <i>agentic context engineering<\/i> 工作所关注的；理想状态是对一切都推理得很好。<\/li><li><b>证据：<\/b>把 pass@1 对文档数量作曲线，direct reasoning 与 plain RAG 保持平坦，而 Search-o1 <b>上升<\/b> &mdash; 这是建立在 chunk 抽取之上的 <b>parallel refinement<\/b> 轴。<\/li><\/ul>","terms":["reason in documents","special tokens","memory buffer","agentic context engineering","pass@1","parallel refinement"]}},{"t":3665,"figs":[{"t":3695,"file":"slides/part07/slide_139.jpg"},{"t":3857,"file":"slides/part07/slide_142.jpg"}],"en":{"title":"Search-o1 on GPQA versus human experts and the chemistry gap","problem":"It is unclear whether Search-o1 is genuinely competitive with domain experts on hard, multi-disciplinary science questions.","why":"GPQA is a hard benchmark, and comparing against humans requires matching the right expert to the right domain rather than using a single aggregate number.","how":"Compare on the diagonal (physicists on physics, chemists on chemistry): Search-o1 is competitive and sometimes better in physics, competitive in biology, and clearly lags in chemistry, where tokenization or out-of-distribution training data may hurt.","detail":"<p>On the hard <b>GPQA<\/b> set, Search-o1 is compared against human experts, focusing on the <b>diagonal<\/b> &mdash; physicists on physics problems, and so on &mdash; because changing the domain changes the comparison baseline.<\/p><ul><li><b>Physics:<\/b> Search-o1 is competitive, sometimes better than the human experts.<\/li><li><b>Biology:<\/b> almost competitive with the biologist solving the problem.<\/li><li><b>Chemistry:<\/b> noticeably weaker, leaving headroom; the instructor suggests chemistry may be under-trained or out of distribution, and a student hypothesizes that chemistry formula tokenization (preserving meaning across sub-combinations) makes it harder.<\/li><li><b>Interpretation:<\/b> this says the system is <b>competitive<\/b> with experts on this class of problems, not that it outperforms experts in general.<\/li><li><b>Mechanism:<\/b> increasing the number of documents helps because the architecture extracts relevant context from each document rather than merely lengthening the prompt.<\/li><\/ul>","terms":["GPQA","human experts","diagonal comparison","chemistry tokenization","out-of-distribution","document scaling"]},"zh":{"title":"Search-o1 在 GPQA 上对比人类专家，以及化学上的差距","problem":"目前不清楚 Search-o1 在困难的跨学科科学问题上是否真正能与领域专家竞争。","why":"GPQA 是一个困难基准，与人类比较需要把正确的专家匹配到正确的领域，而不是使用单一的汇总数字。","how":"在对角线上比较（物理学家做物理题、化学家做化学题）：Search-o1 在物理上有竞争力，有时更好；在生物上有竞争力；在化学上明显落后，可能是 tokenization 或 out-of-distribution 训练数据拖累了它。","detail":"<p>在困难的 <b>GPQA<\/b> 集合上，Search-o1 与人类专家比较，重点关注<b>对角线<\/b> &mdash; 物理学家做物理题，等等 &mdash; 因为改变领域会改变比较的基线。<\/p><ul><li><b>物理：<\/b>Search-o1 有竞争力，有时优于人类专家。<\/li><li><b>生物：<\/b>与解题的生物学家几乎不相上下。<\/li><li><b>化学：<\/b>明显较弱，仍有提升空间；讲师认为化学可能训练不足或属于 out of distribution，一名学生假设化学式的 tokenization（在子组合之间保持语义）使其更难。<\/li><li><b>解读：<\/b>这说明系统在这一类问题上与专家<b>有竞争力<\/b>，而并非在总体上超越专家。<\/li><li><b>机制：<\/b>增加文档数量有帮助，因为架构从每篇文档中抽取相关上下文，而不仅仅是把 prompt 加长。<\/li><\/ul>","terms":["GPQA","human experts","diagonal comparison","chemistry tokenization","out-of-distribution","document scaling"]}},{"t":3868,"figs":[{"t":3875,"file":"slides/part07/slide_143.jpg"},{"t":3994,"file":"slides/part07/slide_146.jpg"},{"t":4013,"file":"slides/part07/slide_148.jpg"},{"t":4069,"file":"slides/part07/slide_149.jpg"}],"en":{"title":"Multi-hop question answering, takeaways, and Search-R1","problem":"On multi-hop question answering, plain RAG and even agentic RAG tend to saturate, so extra documents stop helping.","why":"Multi-hop questions require chaining facts across documents and iterating: identify what you do not know, refine, and construct a better next search.","how":"Search-o1 reaches state-of-the-art on HotpotQA, 2WikiMultihop, and Bamboo through an iterative multi-turn loop that reduces uncertainty; Search-R1 later teaches the same behavior with RL instead of prompting.","detail":"<p>On <b>multi-hop<\/b> question answering, standard RAG and even agentic RAG tend to <b>saturate<\/b> in performance. Search-o1 does not: on <b>HotpotQA<\/b>, <b>2WikiMultihop<\/b>, and <b>Bamboo<\/b>, the bolded state-of-the-art numbers are attributed to Search-o1.<\/p><ul><li><b>Why it works:<\/b> the model identifies what it does not know, refines across documents, and runs an <b>iterative multi-turn loop<\/b> that constructs better subsequent searches, reducing uncertainty at each step.<\/li><li><b>Retrieval caveat (class Q&amp;A):<\/b> the claim assumes at least loosely relevant documents are retrieved; with many loosely correlated documents, requiring the model to reason over all of them is where plain methods fail, whereas chunk extraction keeps it tractable.<\/li><li><b>Takeaways:<\/b> gains come from <b>reducing uncertainty<\/b>, improved document quality, and the multi-turn loop; larger reasoning models tend to do better.<\/li><li><b>Next step:<\/b> <b>Search-R1<\/b> versus Search-o1 &mdash; Search-o1 closes the loop by <b>prompting<\/b>, while Search-R1 teaches the model to search with an <b>RL<\/b> loop.<\/li><\/ul>","terms":["multi-hop","HotpotQA","2WikiMultihop","Bamboo","iterative loop","Search-R1"]},"zh":{"title":"Multi-hop 问答、要点与 Search-R1","problem":"在 multi-hop 问答上，plain RAG 乃至 agentic RAG 都趋于饱和，因此额外的文档不再有帮助。","why":"multi-hop 问题需要跨文档串联事实并迭代：识别你不知道什么、精炼，并构造更好的下一次搜索。","how":"Search-o1 通过减少不确定性的迭代式 multi-turn 循环，在 HotpotQA、2WikiMultihop 与 Bamboo 上达到 state-of-the-art；Search-R1 随后用 RL 而非 prompting 教出同样的行为。","detail":"<p>在 <b>multi-hop<\/b> 问答上，标准 RAG 乃至 agentic RAG 的性能都趋于<b>饱和<\/b>。Search-o1 则不然：在 <b>HotpotQA<\/b>、<b>2WikiMultihop<\/b> 和 <b>Bamboo<\/b> 上，加粗标记的 state-of-the-art 数字都归功于 Search-o1。<\/p><ul><li><b>为何有效：<\/b>模型识别出自己不知道什么，跨文档精炼，并运行一个<b>迭代式 multi-turn 循环<\/b>来构造更好的后续搜索，在每一步减少不确定性。<\/li><li><b>检索的注意事项（课堂问答）：<\/b>这一论断假设至少检索到了松散相关的文档；当存在许多松散相关的文档时，要求模型对全部文档进行推理正是 plain 方法失败之处，而 chunk 抽取使其保持可处理。<\/li><li><b>要点：<\/b>收益来自<b>减少不确定性<\/b>、更好的文档质量以及 multi-turn 循环；更大的推理模型往往表现更好。<\/li><li><b>下一步：<\/b><b>Search-R1<\/b> 与 Search-o1 &mdash; Search-o1 通过 <b>prompting<\/b> 闭环，而 Search-R1 用 <b>RL<\/b> 循环教模型搜索。<\/li><\/ul>","terms":["multi-hop","HotpotQA","2WikiMultihop","Bamboo","iterative loop","Search-R1"]}},{"t":4135,"figs":[],"en":{"title":"Closing Q&A: calibration, overconfidence, and knowing what you know","problem":"A student asks whether the probability a model assigns to a generation correlates with whether the answer is actually correct, including under RAG.","why":"Models tend to be overconfident, so raw probabilities are poorly calibrated; measured against correctness, a model may be about 50% correct yet roughly 80% confident.","how":"Aggregate token log-probabilities meaningfully (averaging or a geometric combination), recognize the overconfidence pattern, and use second-pass confidence estimation or RLHF to calibrate; knowing what a model knows remains open research.","detail":"<p>The closing Q&amp;A is about whether a model's own probabilities can signal correctness. A student notes each generation carries a probability and asks whether correct answers correlate with high probability, and whether RAG changes that.<\/p><ul><li><b>Aggregation:<\/b> you can compute log-probabilities of output tokens, but must aggregate meaningfully (averaging or a geometric combination) rather than summing naively.<\/li><li><b>Overconfidence:<\/b> models tend to be <b>overconfident<\/b>; calibrating against correctness shows that when a model is only about <b>50% correct<\/b> it may still be roughly <b>80% confident<\/b>, and it will not readily change its mind.<\/li><li><b>Correlation pattern:<\/b> if the answer is correct the model is likely confident and correct; when wrong it is often confidently wrong &mdash; the hallucination failure.<\/li><li><b>Open problem:<\/b> efforts use a second pass or RLHF to make models estimate and act on confidence; <b>knowing what they know<\/b> remains an active research area, and the second question is posed as a homework experiment.<\/li><\/ul>","terms":["calibration","log-probability","overconfidence","hallucination","RLHF","knowing what you know"]},"zh":{"title":"结课问答：calibration、overconfidence 与知道自己知道什么","problem":"一名学生问，模型赋予某次生成的概率是否与答案实际是否正确相关，包括在 RAG 下。","why":"模型往往过度自信，因此原始概率的校准很差；对照正确性来衡量，模型可能只有约 50% 正确，却约有 80% 的置信度。","how":"有意义地聚合 token log-probability（取平均或几何组合），识别过度自信的模式，并使用第二遍置信度估计或 RLHF 进行校准；让模型知道自己知道什么仍是开放研究。","detail":"<p>结课问答讨论的是：模型自身的概率能否指示正确性。一名学生指出每次生成都带有概率，并问正确答案是否与高概率相关，以及 RAG 是否改变这一点。<\/p><ul><li><b>聚合：<\/b>你可以计算输出 token 的 log-probability，但必须有意义地聚合（取平均或几何组合），而不是天真地求和。<\/li><li><b>Overconfidence：<\/b>模型往往<b>过度自信<\/b>；对照正确性进行校准会发现，当模型只有约 <b>50% 正确<\/b>时，它可能仍约有 <b>80% 的置信度<\/b>，而且不会轻易改变想法。<\/li><li><b>相关性模式：<\/b>如果答案正确，模型很可能既自信又正确；当它错误时，常常是自信地犯错 &mdash; 即 hallucination 失败。<\/li><li><b>开放问题：<\/b>相关工作使用第二遍或 RLHF 让模型估计并依据置信度行动；<b>知道自己知道什么<\/b>仍是一个活跃的研究领域，而第二个问题被布置为作业实验。<\/li><\/ul>","terms":["calibration","log-probability","overconfidence","hallucination","RLHF","knowing what you know"]}}]},{"n":8,"id":"8JAqLnTaZu4","duration":4513,"slideCount":52,"en":{"title":"Agentic Evaluations and Long Horizon Tasks","summary":"Classic chatbot/QA/single-shot benchmarks saturate and cannot track agentic progress, so this lecture builds a framework for evaluating long-horizon autonomy along three axes: task duration, real-world economic value, and research-synthesis quality. It walks METR's human-calibrated time horizon (SWAA/EdgeCast/RE-Bench, ~170 tasks from 1s to 8h, doubling every ~7 months at 50% success, far shorter at 80%), OpenAI's GDPval (pairwise win rate vs decade-experienced professionals on top-5%-of-GDP tasks, rising roughly linearly to ~48%), and Stanford's DeepScholarBench (live, contamination-resistant related-work synthesis where no system exceeds 19%). Recurring gaps are reliability, context/reference-data grounding, error recovery, and faithful instruction following rather than raw task length."},"zh":{"title":"Agentic Evaluations 与长周期任务","summary":"经典的 chatbot/QA/单次（single-shot）benchmark 已趋于饱和，无法跟踪 agentic 能力的进展，因此本讲构建了一个沿三条轴评估长周期自主性的框架：任务时长、真实世界经济价值，以及研究综述质量。课程依次讲解 METR 的以人类为基准的时间跨度（SWAA/EdgeCast/RE-Bench，约 170 个任务，时长从 1 秒到 8 小时，在 50% 成功率下约每 7 个月翻倍，在 80% 成功率下则短得多）、OpenAI 的 GDPval（在占 GDP 前 5% 的任务上与拥有十年经验的专业人士进行成对胜率比较，大致线性上升到约 48%），以及 Stanford 的 DeepScholarBench（实时的、抗 contamination 的 related-work 综述，无任何系统超过 19%）。反复出现的短板在于可靠性、context/reference-data grounding、错误恢复，以及忠实的指令遵循，而非原始任务长度。"},"sections":[{"t":5,"figs":[{"t":7,"file":"slides/part08/slide_002.jpg"},{"t":101,"file":"slides/part08/slide_008.jpg"}],"en":{"title":"Framing: What Counts as an Agentic Evaluation","problem":"Most practitioners run no formal evaluation, and the ones who do reach for short, single-purpose tasks that say little about long-horizon autonomy.","why":"The field lacks a shared definition of an agentic eval; ad-hoc task choices vary wildly in horizon, tool use, and grounding, so they cannot track progress.","how":"The instructor polls the room, collects concrete eval examples, then lays out the lecture's three anchor papers: METR, GDPval, and DeepScholarBench.","detail":"<p>The instructor opens by polling who has run an evaluation and what tasks they used. Answers cluster around <b>multihop QA<\/b> (HotpotQA-style), <b>SweBench<\/b>, and an agent that distills a <b>private wiki<\/b> into notes before feeding a coding agent.<\/p><ul><li>The framing question is what makes <b>agentic evaluations hard<\/b> relative to prior evaluation regimes.<\/li><li>Three anchor papers structure the lecture: <b>METR<\/b> (time horizon of completable tasks), <b>GDPval<\/b> (real-world economically valuable tasks, OpenAI), and <b>DeepScholarBench<\/b> (live generative research synthesis, Stanford).<\/li><li>These evals differ along <b>task duration<\/b>, <b>economic value<\/b>, and <b>grounding in reference data<\/b>; each is a distinct measurement axis.<\/li><li>They are also more expensive and higher-variance than chat/QA suites because they require tool loops and human grading.<\/li><li>The instructor warns that any benchmark is a representation of what we believe is measurable, not ground truth.<\/li><\/ul>","terms":["agentic evaluation","multihop QA","SweBench","private-wiki QA","METR","GDPval","DeepScholarBench"]},"zh":{"title":"界定：什么才算 Agentic Evaluation","problem":"大多数从业者不进行任何正式评估，而进行正式评估的人又往往选用短小、单一用途的任务，这些任务几乎无法反映长周期自主性。","why":"该领域缺乏对 agentic eval 的共同定义；临时选定的任务在任务跨度、工具使用和 grounding 上差异极大，因此无法跟踪进展。","how":"讲师在课堂上进行投票，收集具体的评估示例，然后引出本讲的三个锚点论文：METR、GDPval 和 DeepScholarBench。","detail":"<p>讲师首先投票询问谁做过评估、用了什么任务。答案集中在 <b>multihop QA<\/b>（HotpotQA 风格）、<b>SweBench<\/b>，以及一个先将<b>私有 wiki<\/b> 提炼为笔记、再喂给编码 agent 的 agent。<\/p><ul><li>核心界定问题是：相较于以往的评估范式，究竟是什么让 <b>agentic evaluations 变得困难<\/b>。<\/li><li>三篇锚点论文构成了本讲的骨架：<b>METR<\/b>（可完成任务的时间跨度）、<b>GDPval<\/b>（真实世界具有经济价值的任务，OpenAI），以及 <b>DeepScholarBench<\/b>（实时生成式研究综述，Stanford）。<\/li><li>这些评估在<b>任务时长<\/b>、<b>经济价值<\/b>和<b>对参考数据的 grounding<\/b> 上各不相同；每一个都是独立的测量轴。<\/li><li>与 chat/QA 套件相比，它们也更昂贵、方差更高，因为它们需要 tool loop 和人工评分。<\/li><li>讲师提醒：任何 benchmark 都只是我们认为可测量之物的表征，而非 ground truth。<\/li><\/ul>","terms":["agentic evaluation","multihop QA","SweBench","private-wiki QA","METR","GDPval","DeepScholarBench"]}},{"t":164,"figs":[{"t":167,"file":"slides/part08/slide_017.jpg"},{"t":234,"file":"slides/part08/slide_018.jpg"}],"en":{"title":"Why Measure: Saturation, Capability, and Economic Value","problem":"Traditional chatbot, question-answering, and single-shot benchmarks whose answer is already in context are saturating quickly.","why":"We must forecast capability and economic/safety impact, and shallow in-context recall scores no longer discriminate frontier agents.","how":"Track two complementary metrics -- METR's human-calibrated time horizon (capability) and GDPval's win rate vs experts (economic value) -- then add a third for research synthesis.","detail":"<p>The instructor frames the core challenge: to assess AI progress we must measure <b>what matters<\/b>, and what matters now spans both <b>capability<\/b> and <b>economic/safety impact<\/b>.<\/p><ul><li>Four to five years ago, merely generating a fluent explanation was a milestone; today we ask whether models affect economics or safety.<\/li><li><b>Traditional benchmarks<\/b> -- chatbots, question answering, and single-shot tasks whose answer is already in context -- are <b>saturating quickly<\/b>.<\/li><li>Two complementary metrics are introduced: <b>METR<\/b> measures the <b>time horizon<\/b> of tasks (how long or complex a task a model can finish), calibrated by human professionals; <b>GDPval<\/b> measures the model's <b>win rate<\/b> versus experts on real work.<\/li><li>Both are equally valid and yield similar qualitative insights, but the <b>trends they measure differ<\/b> -- exponential versus roughly linear.<\/li><li>A third metric, research-synthesis quality, is added via DeepScholarBench.<\/li><\/ul>","terms":["benchmark saturation","single-shot","time horizon","win rate","economic impact","capability"]},"zh":{"title":"为何要测量：饱和、能力与经济价值","problem":"传统的 chatbot、question-answering 和单次（single-shot）benchmark——其答案已在上下文之中——正在迅速饱和。","why":"我们必须预测能力以及经济/安全影响，而浅层的 in-context recall 分数已无法区分前沿 agent。","how":"跟踪两个互补的指标——METR 的以人类为基准的时间跨度（能力）和 GDPval 相对专家的胜率（经济价值）——再为研究综述加入第三个指标。","detail":"<p>讲师界定了核心挑战：要评估 AI 进展，就必须测量<b>真正重要之物<\/b>，而如今重要之物同时涵盖<b>能力<\/b>与<b>经济/安全影响<\/b>。<\/p><ul><li>四五年前，仅仅生成流畅的解释就是一个里程碑；今天我们则要问模型是否影响经济或安全。<\/li><li><b>传统 benchmark<\/b>——chatbot、question answering，以及答案已存在于上下文中的单次任务——正在<b>迅速饱和<\/b>。<\/li><li>引入两个互补的指标：<b>METR<\/b> 测量任务的<b>时间跨度<\/b>（模型能完成的任务有多长或多复杂），由人类专业人士校准；<b>GDPval<\/b> 测量模型在真实工作中相对专家的<b>胜率<\/b>。<\/li><li>两者同样有效，并给出相似的定性洞见，但它们<b>所测量的趋势不同<\/b>——指数式与大致线性。<\/li><li>通过 DeepScholarBench 加入第三个指标：研究综述质量。<\/li><\/ul>","terms":["benchmark saturation","single-shot","time horizon","win rate","economic impact","capability"]}},{"t":272,"figs":[{"t":274,"file":"slides/part08/slide_022.jpg"}],"en":{"title":"The Time Horizon: Duration plus Reliability","problem":"A raw can-the-model-do-this question is too coarse; there is no unit of how long a model can keep working or how often it succeeds.","why":"Chatbots lost context after a few turns, so sustained multi-turn work is itself new; and duration without reliability is meaningless for deployment.","how":"METR measures task duration and associates a reliability level (e.g. 50% or 80% success) with it, anchored to how long human professionals need.","detail":"<p>The horizon framing starts from a concrete observation: three to five years ago a chatbot would lose the thread after a couple of turns, whereas today conversations stay coherent over long multi-turn exchanges. That contextual endurance is the raw substrate for long-horizon work.<\/p><ul><li><b>METR<\/b> therefore measures two things: the <b>duration<\/b> of the task the model can complete and the <b>reliability<\/b> with which it does so.<\/li><li>Reliability is reported as a success threshold -- e.g. completion with <b>50% success<\/b> versus <b>80% success<\/b>.<\/li><li>The universal anchor for difficulty is <b>how long a human professional<\/b> takes on the same task, making durations comparable across domains.<\/li><li>Horizon is not a single number: the 50%-reliability and 80%-reliability horizons can differ by an order of magnitude.<\/li><\/ul>","terms":["time horizon","reliability","success rate","duration","human professional"]},"zh":{"title":"时间跨度：时长加可靠性","problem":"单纯问“模型能否完成这个”过于粗糙；缺少衡量模型能持续工作多久、或成功率有多高的单位。","why":"chatbot 在几轮对话后就会丢失上下文，因此持续的多轮工作本身即是新事物；而脱离可靠性的时长对部署毫无意义。","how":"METR 测量任务时长，并为其关联一个可靠性水平（例如 50% 或 80% 成功率），以人类专业人士所需的时间作为锚点。","detail":"<p>时间跨度的框架始于一个具体观察：三到五年前，chatbot 在几轮对话后就会失去脉络，而如今对话在长时间的多轮交流中仍能保持连贯。这种上下文持久性正是长周期工作的原始基础。<\/p><ul><li>因此 <b>METR<\/b> 测量两件事：模型能完成任务的<b>时长<\/b>，以及它完成时的<b>可靠性<\/b>。<\/li><li>可靠性以成功阈值报告——例如<b>50% 成功率<\/b>与 <b>80% 成功率<\/b>下的完成情况。<\/li><li>衡量难度的通用锚点是<b>人类专业人士<\/b>完成同一任务所需的时间，从而使跨领域的时长具有可比性。<\/li><li>跨度并非单一数字：50% 可靠性与 80% 可靠性下的跨度可能相差一个数量级。<\/li><\/ul>","terms":["time horizon","reliability","success rate","duration","human professional"]}},{"t":342,"figs":[{"t":344,"file":"slides/part08/slide_023.jpg"},{"t":402,"file":"slides/part08/slide_027.jpg"}],"en":{"title":"METR's Three Suites, from Seconds to Eight Hours","problem":"No single task set spans the full range from atomic software actions to multi-hour ML research.","why":"To fit a horizon curve you need tasks whose human completion times cover several orders of magnitude.","how":"METR combines three suites -- SWAA (1-30s atomic), EdgeCast (1 min-30h diverse SWE/research), RE-Bench (up to 8h ML research) -- about 170 tasks total.","detail":"<p>METR assembles three suites to span the duration range:<\/p><ul><li><b>SWAA-style small suite:<\/b> <b>1-30 seconds<\/b>, purely <b>atomic software actions<\/b> (e.g. open a file) -- about <b>66 tasks<\/b>.<\/li><li><b>EdgeCast:<\/b> <b>1 minute to ~30 hours<\/b> of diverse software and research engineering tasks -- about <b>97 tasks<\/b>.<\/li><li><b>RE-Bench:<\/b> full <b>ML research<\/b> tasks up to about <b>8 hours<\/b> (AI-scientist style) -- only about <b>7 tasks<\/b>.<\/li><li>In total roughly <b>170 tasks<\/b> from one second to eight hours, mapped onto a single duration axis.<\/li><li>Example tasks span finding a shell script (~3 s) through detecting and fixing a bug in a simulation's input files (~10 min) to implementing custom <b>CUDA kernels<\/b> to a performance target (tens of hours, capped near 8 h).<\/li><li>The spread lets success rate be plotted smoothly against human time.<\/li><\/ul>","terms":["SWAA","EdgeCast","RE-Bench","task suite","CUDA kernel","AI scientist"]},"zh":{"title":"METR 的三套任务，从秒到八小时","problem":"没有单一任务集能覆盖从原子级软件操作到多小时的 ML 研究的完整范围。","why":"要拟合出一条跨度曲线，就需要人类完成时间跨越数个数量级的任务。","how":"METR 组合三套任务——SWAA（1-30 秒的原子操作）、EdgeCast（1 分钟-30 小时多样化的 SWE/研究任务）、RE-Bench（最长 8 小时的 ML 研究）——总计约 170 个任务。","detail":"<p>METR 汇集三套任务以覆盖时长范围：<\/p><ul><li><b>SWAA 风格的小型套件：<\/b><b>1-30 秒<\/b>，纯<b>原子软件操作<\/b>（例如打开一个文件）——约 <b>66 个任务<\/b>。<\/li><li><b>EdgeCast：<\/b><b>1 分钟到约 30 小时<\/b>的多样化软件与研究工程任务——约 <b>97 个任务<\/b>。<\/li><li><b>RE-Bench：<\/b>完整的 <b>ML 研究<\/b>任务，最长约 <b>8 小时<\/b>（AI-scientist 风格）——仅约 <b>7 个任务<\/b>。<\/li><li>总计约 <b>170 个任务<\/b>，从一秒到八小时，映射到单一的时间轴。<\/li><li>示例任务涵盖从查找一个 shell 脚本（约 3 秒），到检测并修复仿真输入文件中的 bug（约 10 分钟），再到为实现性能目标而编写自定义 <b>CUDA kernel<\/b>（数十小时，上限接近 8 小时）。<\/li><li>这种跨度使得成功率能够平滑地对人类时间作图。<\/li><\/ul>","terms":["SWAA","EdgeCast","RE-Bench","task suite","CUDA kernel","AI scientist"]}},{"t":410,"figs":[],"en":{"title":"Constructing the Curve from Human Completion Times","problem":"Turning raw task outcomes into a single horizon number requires a principled aggregation pipeline.","why":"A model may pass some tasks and fail others in the same human-time bucket, so per-task results must be summarized into a curve.","how":"Collect and vet tasks, record human and agent time estimates, then fit success rate against human time and read off the horizon at a chosen reliability.","detail":"<p>The horizon number is produced by a pipeline, not a single score:<\/p><ul><li>Tasks are <b>collected and vetted<\/b> for each suite so the suite is representative.<\/li><li>For each task, <b>human runs<\/b> estimate completion time and difficulty; <b>agent runs<\/b> measure whether the task is completed reliably.<\/li><li>Given enough data points, METR <b>fits a curve of success rate versus human time estimate<\/b> and reads off the horizon at a chosen reliability.<\/li><li>Horizons are then plotted against <b>model release dates<\/b>, yielding the trend the lecture examines next.<\/li><li>This design makes a single time-horizon number meaningful, but the number also inherits every bias in the human estimates and in the fit.<\/li><\/ul>","terms":["task vetting","success-rate curve","time estimate","release date","horizon fit"]},"zh":{"title":"从人类完成时间构建曲线","problem":"要将原始任务结果转化为单一的跨度数字，需要一条有原则的聚合流程。","why":"在同一人类时间区间内，模型可能通过某些任务而失败于另一些任务，因此必须将逐任务结果汇总为一条曲线。","how":"收集并审核任务，记录人类和 agent 的时间估计，然后将成功率对人类时间拟合，并在选定可靠性下读出跨度。","detail":"<p>跨度数字由一条流程产生，而非单一分数：<\/p><ul><li>为每套任务<b>收集并审核<\/b>任务，使该套件具有代表性。<\/li><li>对每个任务，<b>人类运行<\/b>用于估计完成时间和难度；<b>agent 运行<\/b>用于测量任务是否被可靠完成。<\/li><li>在拥有足够数据点后，METR <b>拟合出一条成功率对人类时间估计的曲线<\/b>，并在选定可靠性下读出跨度。<\/li><li>随后将各跨度对<b>模型发布时间<\/b>作图，得到本讲接下来考察的趋势。<\/li><li>这一设计使单一的时间跨度数字具有意义，但该数字也继承了人类估计与拟合中的所有偏差。<\/li><\/ul>","terms":["task vetting","success-rate curve","time estimate","release date","horizon fit"]}},{"t":474,"figs":[{"t":571,"file":"slides/part08/slide_030.jpg"}],"en":{"title":"Class Calibration: What Takes Minutes vs Hours","problem":"Students must calibrate which duration bucket a realistic task actually falls into.","why":"Suite assignment depends on human completion time, and students systematically underestimate how long real tasks take.","how":"The instructor solicits minute-scale and hour-scale tasks students would delegate, then maps each to SWAA, EdgeCast, or RE-Bench.","detail":"<p>To build intuition, the instructor asks students for a task taking a couple of minutes and one taking a couple of hours that they would delegate.<\/p><ul><li>A several-hour task lands in <b>EdgeCast or RE-Bench<\/b> territory.<\/li><li>Double-checking a bibliography entry by querying the right websites maps to the <b>EdgeCast<\/b>-style diverse-task bucket.<\/li><li><b>Refactoring code<\/b> can be small or large: moving code while preserving logic may take a few hours to a couple of days, and someone must verify correctness -- pushing it toward RE-Bench.<\/li><li>The exercise shows that suite assignment depends on <b>human completion time<\/b>, not on how a task &quot;feels.&quot;<\/li><li>It also surfaces a recurring theme: <b>verification cost<\/b> is often the hidden part of a task's true duration.<\/li><\/ul>","terms":["task calibration","refactoring","bibliography verification","EdgeCast","RE-Bench","verification cost"]},"zh":{"title":"课堂校准：哪些任务耗时几分钟、哪些耗时几小时","problem":"学生必须校准一个现实任务实际落在哪个时长区间。","why":"套件归属取决于人类完成时间，而学生系统性地低估真实任务所需的时间。","how":"讲师征集学生愿意委派的分钟级和小时级任务，然后将每个映射到 SWAA、EdgeCast 或 RE-Bench。","detail":"<p>为建立直觉，讲师请学生给出一个耗时几分钟、以及一个耗时几小时且他们愿意委派的任务。<\/p><ul><li>耗时数小时的任务落入 <b>EdgeCast 或 RE-Bench<\/b> 的范畴。<\/li><li>通过查询正确的网站来复核一条参考文献条目，映射到 <b>EdgeCast<\/b> 风格的多样化任务区间。<\/li><li><b>代码重构<\/b>可小可大：在保持逻辑不变的前提下移动代码可能需要几小时到数天，并且必须有人验证正确性——这将其推向 RE-Bench。<\/li><li>该练习表明套件归属取决于<b>人类完成时间<\/b>，而非任务的“感觉”。<\/li><li>它还揭示了一个反复出现的主题：<b>验证成本<\/b>往往是任务真实时长中隐藏的部分。<\/li><\/ul>","terms":["task calibration","refactoring","bibliography verification","EdgeCast","RE-Bench","verification cost"]}},{"t":596,"figs":[{"t":597,"file":"slides/part08/slide_032.jpg"},{"t":721,"file":"slides/part08/slide_038.jpg"}],"en":{"title":"Human Baselines: Experts, Agreement, Cost, and Bias","problem":"Human completion time is the universal anchor, but it varies across people and is expensive to collect at scale.","why":"Many experts per task is costly, the estimate is a distribution rather than a point, and expert self-assessment is systematically biased.","how":"Use a few skilled professionals (~5 years experience), record successful-attempt times, take a geometric mean for difficulty, check inter-human agreement, and gather more points only when estimates diverge.","detail":"<p>Human completion time is the anchor, but it is a distribution and expensive to collect.<\/p><ul><li>Rather than many experts, METR typically has <b>a few skilled professionals<\/b> (~<b>5 years<\/b> experience) solve each task, records times on <b>successful attempts<\/b>, and takes a <b>geometric mean<\/b> as the difficulty rating.<\/li><li><b>Inter-human agreement<\/b> is checked; more data points are gathered only when estimates diverge. Many experts would give a better distribution but cost far more.<\/li><li><b>Example ladder:<\/b> find a shell script (~3 s); Wikipedia research; detect/fix a bug in simulation input files (~10 min); munging JSON between formats; implement custom CUDA kernels to a target (up to ~8 h).<\/li><li><b>Expert bias:<\/b> experienced annotators are conditioned to know what &quot;success&quot; means and often <b>underestimate difficulty<\/b>, which may not match how a model perceives the task.<\/li><\/ul>","terms":["geometric mean","inter-rater agreement","expert bias","annotation cost","human baseline","CUDA kernel"]},"zh":{"title":"人类基线：专家、一致性、成本与偏差","problem":"人类完成时间是通用锚点，但它在不同人之间差异很大，且大规模收集成本高昂。","why":"每个任务配备多位专家代价高昂，该估计是一个分布而非点值，并且专家的自我评估存在系统性偏差。","how":"使用少数熟练专业人士（约 5 年经验），记录成功尝试的时间，取几何平均作为难度，检查人类间一致性，仅在估计出现分歧时收集更多数据点。","detail":"<p>人类完成时间是锚点，但它是一个分布，且收集成本高昂。<\/p><ul><li>METR 通常并非使用多位专家，而是让<b>少数熟练专业人士<\/b>（约 <b>5 年<\/b>经验）求解每个任务，记录<b>成功尝试<\/b>的时间，并取<b>几何平均<\/b>作为难度评级。<\/li><li>会检查<b>人类间一致性<\/b>；仅在估计出现分歧时才收集更多数据点。更多专家能得到更好的分布，但成本高得多。<\/li><li><b>示例阶梯：<\/b>查找一个 shell 脚本（约 3 秒）；Wikipedia 研究；检测/修复仿真输入文件中的 bug（约 10 分钟）；在格式之间转换 JSON；为实现目标编写自定义 CUDA kernel（最长约 8 小时）。<\/li><li><b>专家偏差：<\/b>经验丰富的标注者习惯于知道“成功”意味着什么，常常<b>低估难度<\/b>，这可能与模型感知任务的方式不符。<\/li><\/ul>","terms":["geometric mean","inter-rater agreement","expert bias","annotation cost","human baseline","CUDA kernel"]}},{"t":757,"figs":[{"t":772,"file":"slides/part08/slide_040.jpg"},{"t":866,"file":"slides/part08/slide_057.jpg"}],"en":{"title":"The Horizon Plot and the Seven-Month Doubling","problem":"It is unclear whether models really complete ever-longer tasks or whether reported gains are artifacts of easy tasks.","why":"A success-rate-versus-duration curve across suites and release dates is needed to see a trend and explain which capabilities move it.","how":"Plot success against human time, read the horizon at 50% success, compare release dates, and attribute gains to reasoning, code, tools, reliability, error recovery, and context engineering.","detail":"<p>On the horizon plot, the x-axis is human completion time and the y-axis is model success rate.<\/p><ul><li><b>SWAA (small) tasks<\/b> generally sit high; <b>EdgeCast<\/b> tasks scatter from about <b>0.8 down to 0<\/b>; <b>RE-Bench<\/b> tasks sit low -- <b>longer tasks are harder<\/b> to stay on track with.<\/li><li>Reading the horizon at <b>50% success<\/b> by release date: <b>GPT-2<\/b> (2019) ~<b>2 seconds<\/b>; <b>GPT-4<\/b> (2023) ~<b>8 minutes<\/b>; <b>Claude 3.7 Sonnet<\/b> (2025) up to <b>59 minutes<\/b> -- an apparent <b>doubling roughly every 7 months<\/b>.<\/li><li>The caveat: 50% success means the model fails half the time -- like an intern who only sometimes returns an answer, so uncertainty always remains.<\/li><li><b>Drivers<\/b> include better logical reasoning, code generation, tool use (ReAct), non-repetitive reliability, <b>error recovery<\/b>, goal awareness/memory of progress, and context engineering.<\/li><\/ul>","terms":["doubling time","GPT-2","GPT-4","Claude 3.7 Sonnet","error recovery","context engineering"]},"zh":{"title":"跨度图与七个月翻倍","problem":"尚不清楚模型是真的完成了越来越长的任务，还是所报告的增长只是简单任务带来的假象。","why":"需要跨套件和发布日期的成功率对时长曲线，才能看出趋势并解释是哪些能力推动了它。","how":"将成功率对人类时间作图，在 50% 成功率处读出跨度，比较发布日期，并将增长归因于推理、代码、工具、可靠性、错误恢复和 context engineering。","detail":"<p>在跨度图上，x 轴是人类的完成时间，y 轴是模型成功率。<\/p><ul><li><b>SWAA（小型）任务<\/b>总体位于高位；<b>EdgeCast<\/b> 任务从约 <b>0.8 散布到 0<\/b>；<b>RE-Bench<\/b> 任务位于低位——<b>任务越长，越难保持正轨<\/b>。<\/li><li>按发布日在 <b>50% 成功率<\/b>处读取跨度：<b>GPT-2<\/b>（2019）约 <b>2 秒<\/b>；<b>GPT-4<\/b>（2023）约 <b>8 分钟<\/b>；<b>Claude 3.7 Sonnet<\/b>（2025）最长约 <b>59 分钟<\/b>——呈现出<b>大约每 7 个月翻倍<\/b>。<\/li><li>需要注意的是：50% 成功率意味着模型有一半时间会失败——就像一个只是偶尔才返回答案的实习生，因此不确定性始终存在。<\/li><li><b>驱动因素<\/b>包括更好的逻辑推理、代码生成、工具使用（ReAct）、非重复性可靠性、<b>错误恢复<\/b>、目标意识/对进展的记忆，以及 context engineering。<\/li><\/ul>","terms":["doubling time","GPT-2","GPT-4","Claude 3.7 Sonnet","error recovery","context engineering"]}},{"t":895,"figs":[{"t":896,"file":"slides/part08/slide_044.jpg"},{"t":918,"file":"slides/part08/slide_048.jpg"}],"en":{"title":"What Drives Progress: Reasoning, Code, Tools, Recovery","problem":"The horizon trend needs a mechanism; it is not obvious which capabilities produce longer autonomous runs.","why":"Longer tasks compound errors, so progress requires more than better next-token quality.","how":"Attribute gains to improved logical reasoning, code generation, tool use (ReAct), non-repetitive reliability, error recovery, goal/state awareness, and context management.","detail":"<p>Why do horizons keep growing? The instructor attributes the improvement to several concrete capabilities rather than scale alone.<\/p><ul><li><b>Logical reasoning:<\/b> models learned to reason in ways covered by earlier lectures, which helps decompose and execute multi-step tasks.<\/li><li><b>Code generation:<\/b> stronger coding drives gains on SWE and ML-research suites.<\/li><li><b>Tool use:<\/b> ReAct-style tool selection and invocation is now more reliable.<\/li><li><b>Reliability:<\/b> models repeat behavior less often and avoid getting stuck.<\/li><li><b>Error recovery:<\/b> an 8-hour task will contain wrong steps, so the model must detect and recover from them.<\/li><li><b>Goal awareness and memory:<\/b> the model must track the final goal and how far it has progressed.<\/li><li><b>Context engineering:<\/b> managing context across many steps (compaction, planning, replanning) is itself a major driver.<\/li><\/ul>","terms":["logical reasoning","code generation","ReAct","error recovery","goal awareness","context engineering"]},"zh":{"title":"什么推动进展：推理、代码、工具、恢复","problem":"跨度趋势需要机制来解释；哪些能力能产生更长的自主运行尚不明显。","why":"更长的任务会累积错误，因此进展需要的不仅仅是更好的 next-token 质量。","how":"将增长归因于改进的逻辑推理、代码生成、工具使用（ReAct）、非重复性可靠性、错误恢复、目标/状态意识，以及上下文管理。","detail":"<p>为什么跨度持续增长？讲师将这一改进归因于若干具体能力，而非仅仅是规模。<\/p><ul><li><b>逻辑推理：<\/b>模型学会了以往课程所涵盖的推理方式，这有助于分解并执行多步任务。<\/li><li><b>代码生成：<\/b>更强的编码能力推动了 SWE 和 ML 研究套件上的增长。<\/li><li><b>工具使用：<\/b>ReAct 风格的工具选择与调用如今更加可靠。<\/li><li><b>可靠性：<\/b>模型更少重复行为，并避免陷入卡顿。<\/li><li><b>错误恢复：<\/b>一个 8 小时的任务必然包含错误步骤，因此模型必须检测并从中恢复。<\/li><li><b>目标意识与记忆：<\/b>模型必须跟踪最终目标以及自己已推进到何处。<\/li><li><b>Context engineering：<\/b>跨许多步骤管理上下文（compaction、planning、replanning）本身就是一个主要驱动因素。<\/li><\/ul>","terms":["logical reasoning","code generation","ReAct","error recovery","goal awareness","context engineering"]}},{"t":992,"figs":[],"en":{"title":"Class Discussion: Context Engineering, Compaction, Replanning","problem":"Why do coding agents such as Claude Code improve year over year?","why":"Mechanisms inside the agent loop, not just the base model, determine long-horizon success.","how":"Collect student explanations: context engineering, compaction, planning/replanning, user-feedback loops, online RL from logs, and memory of the environment.","detail":"<p>The instructor asks why Claude Code and similar coding agents are better today than a year ago, and collects several mechanisms.<\/p><ul><li><b>Context engineering:<\/b> structuring context better across many steps is a new discipline that improves the tooling.<\/li><li><b>Compaction:<\/b> when the context window fills, the agent summarizes and compresses history and continues.<\/li><li><b>Planning and replanning:<\/b> on complex problems the agent first breaks the task into steps, and when execution reveals new data it may generate a <b>new set of steps<\/b>.<\/li><li><b>User feedback:<\/b> when the user says the output is wrong, the agent redoes the work -- like an assignment sent back.<\/li><li><b>Online RL from user logs:<\/b> students speculate products such as Cursor learn from real usage logs.<\/li><li><b>Memory of the environment:<\/b> understanding the codebase helps the agent once it has operated there before.<\/li><\/ul>","terms":["context engineering","compaction","replanning","user feedback","online RL","memory"]},"zh":{"title":"课堂讨论：Context Engineering、Compaction、Replanning","problem":"为什么 Claude Code 等编码 agent 会逐年提升？","why":"决定长周期成功的是 agent loop 内部的机制，而不仅仅是基础模型。","how":"收集学生的解释：context engineering、compaction、planning/replanning、用户反馈循环、从日志中进行 online RL，以及对环境的记忆。","detail":"<p>讲师提问：为什么 Claude Code 及类似的编码 agent 比一年前更好？并收集了若干机制。<\/p><ul><li><b>Context engineering：<\/b>跨许多步骤更好地组织上下文是一门新学科，它改进了工具链。<\/li><li><b>Compaction：<\/b>当上下文窗口填满时，agent 会总结并压缩历史记录，然后继续。<\/li><li><b>Planning 与 replanning：<\/b>面对复杂问题时，agent 会先将任务分解为步骤，当执行揭示新数据时，它可能生成<b>一组新的步骤<\/b>。<\/li><li><b>用户反馈：<\/b>当用户指出输出有误时，agent 会重做工作——就像一份被退回的作业。<\/li><li><b>从用户日志中进行 online RL：<\/b>学生推测 Cursor 等产品会从真实使用日志中学习。<\/li><li><b>对环境的记忆：<\/b>一旦 agent 曾经在该代码库中操作过，理解该代码库就会有所帮助。<\/li><\/ul>","terms":["context engineering","compaction","replanning","user feedback","online RL","memory"]}},{"t":1219,"figs":[{"t":1331,"file":"slides/part08/slide_060.jpg"}],"en":{"title":"The Reliability Axis: The 50% vs 80% Horizon Gap","problem":"A 59-minute horizon sounds deployable until you demand confidence: at 80% success the same model sustains far less.","why":"Capability and reliability are separate axes; a 50% success rate is unacceptable when a failed run has real cost.","how":"Report multiple reliability curves (gray = 50%, blue = 80%) and compare horizons at each; the gap quantifies headroom for systems built on top of the model.","detail":"<p>The reliability view re-plots the same horizon data with a higher bar.<\/p><ul><li>The <b>gray line<\/b> is 50% reliability; the <b>blue line<\/b> is <b>80% success rate<\/b>. x-axis is release date, y-axis is model time-to-complete.<\/li><li>For <b>Claude 3.7 Sonnet<\/b>, the 50% horizon is <b>59 minutes<\/b>, but the <b>80% horizon is roughly 15 minutes<\/b> (one plot suggests 8-10 minutes) -- a large delta.<\/li><li>The doubling time (~7 months) is similar on both curves, but the absolute deployable duration is far lower at 80%.<\/li><li>Implication: deploying models on real tasks hits <b>reliability challenges even for moderately complex tasks<\/b>, leaving headroom for <b>systems built on top<\/b> (verification, retries, tools).<\/li><li>This is also a cost/variance problem: failed attempts consume tokens and wall-clock time, and low success rates multiply them.<\/li><\/ul>","terms":["reliability","80% success","50% success","deployment gap","headroom","variance"]},"zh":{"title":"可靠性轴：50% 与 80% 跨度之间的差距","problem":"59 分钟的跨度听起来可部署，直到你要求置信度：在 80% 成功率下，同一模型能维持的时长远短于此。","why":"能力与可靠性是两条独立的轴；当一次失败运行具有真实成本时，50% 成功率是不可接受的。","how":"报告多条可靠性曲线（灰色 = 50%，蓝色 = 80%）并比较各自的跨度；这一差距量化了构建于模型之上的系统的发挥空间。","detail":"<p>可靠性视角以更高的门槛重新绘制了同一组跨度数据。<\/p><ul><li><b>灰线<\/b>是 50% 可靠性；<b>蓝线<\/b>是 <b>80% 成功率<\/b>。x 轴是发布日期，y 轴是模型的完成时间。<\/li><li>对 <b>Claude 3.7 Sonnet<\/b>，50% 跨度为 <b>59 分钟<\/b>，但 <b>80% 跨度大约只有 15 分钟<\/b>（有一张图显示为 8-10 分钟）——差距很大。<\/li><li>两条曲线上的翻倍时间（约 7 个月）相似，但 80% 下的绝对可部署时长要低得多。<\/li><li>含义：在真实任务上部署模型时，<b>即使对中等复杂度的任务也会遇到可靠性挑战<\/b>，从而为<b>构建于其上的系统<\/b>（验证、重试、工具）留出了发挥空间。<\/li><li>这同时也是一个成本/方差问题：失败的尝试会消耗 token 和 wall-clock 时间，而低成功率会使其倍增。<\/li><\/ul>","terms":["reliability","80% success","50% success","deployment gap","headroom","variance"]}},{"t":1355,"figs":[{"t":1359,"file":"slides/part08/slide_063.jpg"},{"t":1473,"file":"slides/part08/slide_065.jpg"},{"t":1497,"file":"slides/part08/slide_067.jpg"}],"en":{"title":"Failure Modes of Long-Horizon Agents","problem":"Long tasks compound errors, but it is unclear which failure categories dominate and whether reasoning models fix them.","why":"Reaching a goal over many steps requires correct decomposition, tool choice, and global state awareness.","how":"METR classified failures on a non-reasoning model (GPT-4o) versus a reasoning model (o1): poor planning, poor tool choice, incorrect reasoning, premature abandonment, and repetitive loops.","detail":"<p>METR's failure analysis compares a non-reasoning model (<b>GPT-4o<\/b>) with a reasoning model (<b>o1<\/b>); the categories are the learning signal.<\/p><ul><li><b>Poor planning:<\/b> the model fails to break the given task into steps.<\/li><li><b>Poor tool choice:<\/b> it selects an inappropriate tool or malformed call.<\/li><li><b>Incorrect mental math / reasoning:<\/b> it attempts reasoning but gets it wrong.<\/li><li><b>Premature abandonment:<\/b> it loops on repetitive behavior and cannot determine what success means.<\/li><li><b>Repetitive loops:<\/b> after an action fails it remains the highest-probability action, so the model repeats it; this was high for GPT-4o and <b>lower for o1<\/b>.<\/li><li>Failure-mode analysis is standard on hard benchmarks and is exactly the self-refinement homework task: find where the agent's loop broke down.<\/li><li>These modes (planning, tool choice, goal detection, loops) map directly onto the capabilities needed for longer horizons.<\/li><\/ul>","terms":["failure modes","poor planning","tool selection","premature abandonment","repetitive loop","o1"]},"zh":{"title":"长周期 Agent 的失败模式","problem":"长任务会累积错误，但尚不清楚哪类失败占主导，以及推理模型是否能修复它们。","why":"要在许多步骤中达成目标，需要正确的分解、工具选择以及全局状态意识。","how":"METR 对非推理模型（GPT-4o）与推理模型（o1）的失败进行了分类：规划不当、工具选择不当、推理错误、过早放弃，以及重复循环。","detail":"<p>METR 的失败分析比较了一个非推理模型（<b>GPT-4o<\/b>）与一个推理模型（<b>o1<\/b>）；这些类别正是学习信号。<\/p><ul><li><b>规划不当：<\/b>模型未能将给定任务分解为步骤。<\/li><li><b>工具选择不当：<\/b>它选择了不合适的工具，或发出了格式错误的调用。<\/li><li><b>心算/推理错误：<\/b>它尝试推理但搞错了。<\/li><li><b>过早放弃：<\/b>它陷入重复行为，无法判断成功的含义。<\/li><li><b>重复循环：<\/b>某个动作失败后仍保持最高概率，于是模型重复它；这在 GPT-4o 上很高，而在 <b>o1 上更低<\/b>。<\/li><li>失败模式分析是困难 benchmark 上的标准做法，也恰好是 self-refinement 作业任务：找出 agent 循环在何处崩溃。<\/li><li>这些模式（规划、工具选择、目标检测、循环）直接对应到更长跨度所需的能力。<\/li><\/ul>","terms":["failure modes","poor planning","tool selection","premature abandonment","repetitive loop","o1"]}},{"t":1521,"figs":[],"en":{"title":"METR's Limitations: Messiness, Contamination, Contractors","problem":"Horizon scores are optimistic proxies, distorted by distribution mismatch and training-data contamination.","why":"Suites reward clean, verifiable outcomes; models have seen public repos; annotators underestimate durations; and models lack an expert's accumulated context.","how":"Treat the numbers as bounded: expect lower messy-task performance, discount contamination-prone suites, and compare model behavior against low-context humans (contractors).","detail":"<p>The instructor stresses that no benchmark is perfect; METR is a first attempt at measuring time horizon and has three concrete limitations.<\/p><ul><li><b>Messiness:<\/b> performance is lower on tasks with no single correct answer or extra complexity, though similar trend shapes recur across categories.<\/li><li><b>Contamination:<\/b> on <b>SWE-bench<\/b> the models have seen most public GitHub repositories and annotators underestimate durations, so estimates are <b>shorter than they would be on unseen repos<\/b>.<\/li><li><b>Context gap:<\/b> for internal pull requests, <b>contractors<\/b> (no codebase context) are <b>5-18x slower<\/b> than <b>maintainers<\/b>, and model performance tracks closer to <b>contractor times<\/b>.<\/li><li>Implication: the model operates as a <b>low-context worker<\/b>, valuable but not an area expert; when accumulated context matters, the model is at a disadvantage.<\/li><\/ul>","terms":["data contamination","SWE-bench","contractor vs maintainer","messiness","context gap","low-context worker"]},"zh":{"title":"METR 的局限：杂乱性、Contamination、外包人员","problem":"跨度分数是乐观的代理指标，会受到分布不匹配和训练数据 contamination 的扭曲。","why":"这些套件奖励干净、可验证的结果；模型见过公开仓库；标注者低估时长；而模型缺乏专家积累的上下文。","how":"将这些数字视为有界的：预期在杂乱任务上表现更低，对易受 contamination 影响的套件打折扣，并将模型行为与低上下文的人类（外包人员）比较。","detail":"<p>讲师强调没有 benchmark 是完美的；METR 是测量时间跨度的首次尝试，存在三个具体局限。<\/p><ul><li><b>杂乱性（Messiness）：<\/b>在没有唯一正确答案或额外复杂度的任务上表现更低，尽管各类别中会出现相似的曲线形状。<\/li><li><b>Contamination：<\/b>在 <b>SWE-bench<\/b> 上，模型见过大多数公开 GitHub 仓库，且标注者低估时长，因此估计值<b>会比在未见过的仓库上更短<\/b>。<\/li><li><b>上下文差距：<\/b>对于内部 pull request，<b>外包人员<\/b>（无代码库上下
