 generally true, so incorrect answers are filtered as a proxy for filtering low-quality reasoning. Cost: the model never learns from incorrect reasoning chains, and there can be true negatives and false positives (invalid steps that happen to reach the right answer).<\/li><li><b>The model can rationalize.<\/b> Showing it the answer and asking for its work is assumed to yield a valid reasoning path.<\/li><li><b>The base model is strong enough<\/b> to bootstrap from few-shot examples. If the problem class is far outside its capability, STaR makes little progress, which is why the <b>iterative<\/b> loop matters — improvements accumulate so harder problems come into range.<\/li><\/ul>","terms":["assumptions","proxy for reasoning quality","rationalization","true negatives","false positives","iterative bootstrap"]},"zh":{"title":"STaR 作为 off-policy RL 及其核心假设","problem":"STaR 的过滤只有在以下条件下才成立：最终答案正确是良好推理链的良好代理，且模型在给定答案时确实能产出有效的 rationale。","why":"这些假设界定了该方法的失效边界：对于远超 base model 能力的问题，既没有正确样本也没有有效 rationale，因此无从学起。","how":"讲座列出三个假设——最终答案正确可代理推理质量、模型能根据答案 hint 构造 rationale、初始模型足够强以从 few-shot 示例中 bootstrap——这使迭代这一环节至关重要。","detail":"<p>STaR 做出了明确的假设：<\/p><ul><li><b>答案正确 ⟹ rationale 良好。<\/b> 在数学中他们发现这大体成立，因此把答案错误的样本过滤掉，作为过滤低质量推理的代理。代价：模型从不会从不正确的推理链中学习，而且可能存在 true negatives 与 false positives（恰好得出正确答案的无效步骤）。<\/li><li><b>模型能够构造 rationale。<\/b> 把答案展示给它并要求写出过程，被假定能产出有效的推理路径。<\/li><li><b>base model 足够强<\/b>，能从 few-shot 示例中 bootstrap。如果问题类别远超其能力，STaR 进展甚微，这正是 <b>迭代<\/b>闭环重要的原因——改进会累积，使更难的问题进入射程。<\/li><\/ul>","terms":["假设（assumptions）","推理质量的代理（proxy for reasoning quality）","rationalization","true negatives","false positives","迭代式 bootstrap（iterative bootstrap）"]}},{"t":1274,"figs":[],"en":{"title":"STaR Q&A: Step Filtering, Process Rewards, and Learning from Failures","problem":"Students probe the weak points of the loop: where do correct answers come from, are intermediate steps checked, and what happens when the model fails even given the answer?","why":"Without step-level verification, a correct final answer can hide invalid intermediate reasoning, and without a way to learn from negatives, the loop cannot exploit its failures.","how":"Answers: the seed data is a benchmark (questions and known answers); STaR itself does not filter step three, though follow-on papers add a process reward model to score steps; and learning from negative examples is still unsolved, so failures are dropped.","detail":"<p>Q&amp;A on STaR's mechanics and gaps:<\/p><ul><li><b>Where do correct answers come from?<\/b> Everyone starts from a benchmark that has the correct answers; the reasoning is what is generated, the answer provides the label.<\/li><li><b>Is step three filtered?<\/b> STaR itself does <b>not<\/b> filter the rationalized step. Follow-on work adds a <b>process reward model<\/b> on top of the reasoning chains to judge which steps make sense — flagged as a possible project idea.<\/li><li><b>What if the model fails even with the answer?<\/b> The assumption is that the benchmark is within range (or a subset is); iterating lets the model eventually handle more of these.<\/li><li><b>Learning from negatives:<\/b> the lecturer states that learning from negative examples &ldquo;has not been nailed&rdquo;; learning from positive examples works whenever reward is non-zero, and negatives are largely filtered out today.<\/li><li><b>Verifying rationale quality<\/b> would require humans (tedious) or a process reward model, since there is no automatic step-level check.<\/li><\/ul>","terms":["process reward model","step-level verification","negative examples","benchmark seed data","rationale quality"]},"zh":{"title":"STaR 问答：步骤过滤、过程奖励与从失败中学习","problem":"学生探究闭环的薄弱点：正确答案从何而来、中间步骤是否被检查，以及模型即便拿到答案仍然失败时会怎样？","why":"没有步骤级验证，正确的最终答案可能掩盖无效的中间推理；没有从负样本中学习的方法，闭环就无法利用其失败。","how":"回答：种子数据是一个基准（问题与已知答案）；STaR 本身并不过滤第三步，不过后续论文加入 process reward model 来给步骤打分；从负样本中学习仍未解决，因此失败样本被丢弃。","detail":"<p>关于 STaR 的机制与缺口的问答：<\/p><ul><li><b>正确答案从何而来？<\/b> 每个人都从带有正确答案的基准出发；推理是生成出来的，答案提供标签。<\/li><li><b>第三步是否被过滤？<\/b> STaR 本身<b>不<\/b>过滤经 rationalization 得到的步骤。后续工作在推理链之上加入 <b>process reward model<\/b> 来判断哪些步骤合理——这被标记为一个可能的项目想法。<\/li><li><b>如果模型即便拿到答案仍然失败怎么办？<\/b> 假设是基准处于其能力范围内（或至少有一个子集在范围内）；通过迭代，模型最终能处理其中更多问题。<\/li><li><b>从负样本中学习：<\/b> 讲者表示从负样本中学习&ldquo;尚未被攻克&rdquo;；只要奖励非零，从正样本学习就有效，而如今负样本在很大程度上被过滤掉了。<\/li><li><b>验证 rationale 质量<\/b>需要人工（繁琐）或 process reward model，因为没有自动的步骤级检查。<\/li><\/ul>","terms":["process reward model","步骤级验证（step-level verification）","负样本（negative examples）","基准种子数据（benchmark seed data）","rationale 质量（rationale quality）"]}},{"t":1513,"figs":[{"t":1519,"file":"slides/part06/slide_051.jpg"},{"t":1577,"file":"slides/part06/slide_056.jpg"},{"t":1621,"file":"slides/part06/slide_057.jpg"},{"t":1693,"file":"slides/part06/slide_059.jpg"}],"en":{"title":"STaR in Detail: Algorithm, GPT-J Setup, and Datasets","problem":"The informal loop needs a precise description of the prompt set, the training set, the rationalization branch, and the experimental configuration that makes iteration work.","why":"The prompt set is small and rationale-bearing while the training set is large and answer-only, so the method's behavior depends on how few-shot rationale style transfers to the generated training data.","how":"Start from a small prompt dataset (question, rationale, answer) and a large training dataset (question, answer). Few-shot prompt the model on training questions, keep correct rationales, add answer-hinted rationalizations for failures, fine-tune, and repeat. Experiments use GPT-J 6B with warm-up, constant learning rate, and growing inner loops.","detail":"<p>The rigorous walkthrough:<\/p><ul><li><b>Prompt data set<\/b> is small and includes a rationale plus the correct answer (e.g. a multiple-choice question about where to put grapes, rationale, answer B = grocery cart).<\/li><li><b>Training data set<\/b> is large and answer-only (like a benchmark's train split); <b>vanilla STaR<\/b> few-shot prompts on these questions, checks answers by the LM, collects correct rationales, and fine-tunes.<\/li><li><b>Rationalization branch:<\/b> for incorrect answers, add the correct answer as a hint, generate the rationale from it, and add it to the rationale set before fine-tuning.<\/li><li><b>Iterate:<\/b> after fine-tuning the LM produces better chains, so re-run over the training set and retry previously unsolved problems.<\/li><li>Experiments use an open-source <b>GPT-J 6B<\/b>; a small warm-up then <b>constant learning rate<\/b>; a fixed number of outer-loop iterations with the number of inner-loop steps <b>increased each round<\/b> (slow start, then more work).<\/li><li>Datasets: <b>GSM8K<\/b> (~9K grade-school problems), <b>CommonSenseQA<\/b>, multi-digit <b>arithmetic<\/b>, and synthetic data.<\/li><\/ul>","terms":["prompt data set","training data set","GPT-J 6B","constant learning rate","outer loop","inner loop","GSM8K","CommonSenseQA"]},"zh":{"title":"STaR 详解：算法、GPT-J 设置与数据集","problem":"这个非形式化的闭环需要精确描述 prompt 集、训练集、rationalization 分支，以及让迭代生效的实验配置。","why":"prompt 集很小且带 rationale，而训练集很大且只有答案，因此该方法的行为取决于 few-shot 的 rationale 风格如何迁移到生成的训练数据上。","how":"从小的 prompt 数据集（问题、rationale、答案）和大的训练数据集（问题、答案）出发。在训练问题上对模型做 few-shot prompt，保留正确的 rationale，为失败样本加入带答案 hint 的 rationalization，微调，然后重复。实验使用 GPT-J 6B，带 warm-up、恒定学习率，以及不断增大的内循环。","detail":"<p>严谨的逐步讲解：<\/p><ul><li><b>Prompt 数据集<\/b>很小，包含一个 rationale 加上正确答案（例如一道关于把葡萄放在哪里的选择题、rationale、答案 B = 购物车）。<\/li><li><b>训练数据集<\/b>很大且只有答案（类似基准的训练划分）；<b>vanilla STaR<\/b> 在这些问题上做 few-shot prompt，由 LM 检查答案，收集正确的 rationale，然后微调。<\/li><li><b>Rationalization 分支：<\/b> 对答案错误的样本，把正确答案作为 hint 加入，据其生成 rationale，并在微调前将其加入 rationale 集。<\/li><li><b>迭代：<\/b> 微调后 LM 能产出更好的链，因此重新在训练集上运行并重试此前未解决的问题。<\/li><li>实验使用开源的 <b>GPT-J 6B<\/b>；先做少量 warm-up，然后用 <b>恒定学习率<\/b>；外循环迭代次数固定，内循环步数<b>每一轮递增<\/b>（先慢启动，再加大工作量）。<\/li><li>数据集：<b>GSM8K<\/b>（约 9K 道小学题）、<b>CommonSenseQA<\/b>、多位数<b>算术<\/b>，以及合成数据。<\/li><\/ul>","terms":["prompt 数据集（prompt data set）","训练数据集（training data set）","GPT-J 6B","恒定学习率（constant learning rate）","外循环（outer loop）","内循环（inner loop）","GSM8K","CommonSenseQA"]}},{"t":1711,"figs":[{"t":1711,"file":"slides/part06/slide_061.jpg"},{"t":1819,"file":"slides/part06/slide_064.jpg"},{"t":1882,"file":"slides/part06/slide_069.jpg"}],"en":{"title":"STaR Results: Sample Efficiency, Human Evaluation, and the GSM8K Null","problem":"It is not obvious whether STaR beats straightforward supervised fine-tuning or how far repeated iterations can be pushed.","why":"Rationalization helps most when a problem is just beyond the model's capability; on problems already within capability it adds no signal, and the method's off-policy nature makes it plateau.","how":"Reported results: MATH 51.7 using only 70–87% of the data, human raters judge the rationales reasonable, and STaR reaches 72.5% with 86% of the data vs a large-data baseline. On GSM8K, rationalization gives no gain.","detail":"<p>Results across the four datasets:<\/p><ul><li><b>MATH: 51.7%<\/b>, reached using only <b>70–87%<\/b> of the data because incorrect solutions were thrown out.<\/li><li><b>Sample efficiency:<\/b> STAR with rationalization reaches about <b>72.5%<\/b> using roughly <b>86%<\/b> of the data — high accuracy without the volume a plain fine-tuning baseline needs.<\/li><li><b>Human evaluation (CommonSenseQA):<\/b> rationales were shown to human raters and compared to the few-shot rationales; qualitatively, STAR's rationales were judged reasonable.<\/li><li><b>Off-policy caveat:<\/b> it is not true RL, so after several iterations performance <b>plateaus<\/b> and requires tuning.<\/li><li><b>GSM8K null result:<\/b> rationalization did <b>not<\/b> improve performance — the number of calculation steps the model used was similar with or without rationalization. GSM8K is within GPT-4o's capability, so the problem is too simple and added reasoning does not help.<\/li><\/ul>","terms":["MATH 51.7","sample efficiency","human evaluation","CommonSenseQA","plateau","GSM8K","capability frontier"]},"zh":{"title":"STaR 结果：样本效率、人工评估与 GSM8K 的零结果","problem":"STaR 是否优于直接的监督微调，以及反复迭代能推进到多远，这些并不显然。","why":"当问题恰好略超模型能力时，rationalization 帮助最大；对已在其能力范围内的问题它不提供信号，而该方法的 off-policy 性质使其进入平台期。","how":"报告结果：仅使用 70–87% 的数据即达到 MATH 51.7，人工评估者认为 rationale 合理，STaR 用 86% 的数据达到 72.5%，优于大数据基线。在 GSM8K 上，rationalization 没有带来增益。","detail":"<p>在四个数据集上的结果：<\/p><ul><li><b>MATH：51.7%<\/b>，仅使用 <b>70–87%<\/b> 的数据即达到，因为不正确的解被丢弃了。<\/li><li><b>样本效率：<\/b> 带 rationalization 的 STaR 用大约 <b>86%<\/b> 的数据达到约 <b>72.5%<\/b>——无需普通微调基线所需的体量就能取得高准确率。<\/li><li><b>人工评估（CommonSenseQA）：<\/b> 把 rationale 展示给人工评估者，并与 few-shot rationale 比较；从定性上看，STaR 的 rationale 被认为合理。<\/li><li><b>Off-policy 的注意事项：<\/b> 它不是真正的 RL，因此经过若干次迭代后性能<b>进入平台期<\/b>，需要调参。<\/li><li><b>GSM8K 的零结果：<\/b> rationalization <b>没有<\/b>提升性能——无论有无 rationalization，模型使用的计算步数都相近。GSM8K 处于 GPT-4o 的能力范围内，因此问题过于简单，额外的推理没有帮助。<\/li><\/ul>","terms":["MATH 51.7","样本效率（sample efficiency）","人工评估（human evaluation）","CommonSenseQA","平台期（plateau）","GSM8K","能力边界（capability frontier）"]}},{"t":1917,"figs":[{"t":1951,"file":"slides/part06/slide_072.jpg"},{"t":1997,"file":"slides/part06/slide_074.jpg"}],"en":{"title":"STaR Takeaways and Challenges","problem":"Even when STaR works, it depends on filtering by final answers only, which can admit wrong intermediate reasoning, and it offers no reliable way to evaluate rationale quality.","why":"The value proposition is high sample efficiency without human rationale annotation, but the absence of step-level verification and the bias injected by few-shot formatting limit reliability.","how":"Takeaways: rationalization conditions on having the answer; outputs without rationalization come from cases where the model is already confident. Challenges: no good rationale evaluation (needs humans or a process reward model), and true negatives / false positives from filtering only on correct answers.","detail":"<p>Takeaways and open challenges for STaR:<\/p><ul><li><b>Nuance on rationalization:<\/b> it conditions on having the answer to figure out a good rationale. Outputs <i>without<\/i> rationalization are cases where the model is already confident, but if it can look at the answer it may produce a better rationale.<\/li><li><b>Style bias:<\/b> few-shot prompting biases how rationales are formatted, which in turn affects what rationales the model produces and therefore what you train on; prompt engineering can steer the model in unintended ways.<\/li><li><b>Upside:<\/b> bootstrap-generated rationales give high sample efficiency without humans, and apply broadly to symbolic problems and natural-language mathematical reasoning.<\/li><li><b>Challenges:<\/b> there is no good automatic evaluation of rationales for most tasks (you need humans or a process reward model); filtering only on correct answers leaves invalid intermediate steps in the training set.<\/li><\/ul>","terms":["sample efficiency","rationale evaluation","few-shot style bias","process reward model","false positives","true negatives"]},"zh":{"title":"STaR 的要点与挑战","problem":"即便 STaR 有效，它也仅依赖最终答案进行过滤，这可能放行错误的中间推理，而且它没有可靠的方法评估 rationale 质量。","why":"其价值主张是在无需人工标注 rationale 的情况下实现高样本效率，但缺少步骤级验证以及 few-shot 格式引入的偏差限制了可靠性。","how":"要点：rationalization 以拥有答案为前提；没有 rationalization 的输出来自模型已有信心的情形。挑战：缺乏良好的 rationale 评估（需要人工或 process reward model），以及仅按正确答案过滤带来的 true negatives / false positives。","detail":"<p>STaR 的要点与开放挑战：<\/p><ul><li><b>对 rationalization 的细致理解：<\/b> 它以拥有答案为前提来找出好的 rationale。<i>没有<\/i> rationalization 的输出来自模型已有信心的情形，但如果它能看答案，就可能产出更好的 rationale。<\/li><li><b>风格偏差：<\/b> few-shot prompting 会影响 rationale 的格式，进而影响模型产出何种 rationale，从而影响你训练所用的数据；prompt engineering 可能以非预期的方式引导模型。<\/li><li><b>优点：<\/b> bootstrap 生成的 rationale 无需人工就能带来高样本效率，并广泛适用于符号问题与自然语言数学推理。<\/li><li><b>挑战：<\/b> 对大多数任务而言没有良好的自动 rationale 评估（需要人工或 process reward model）；仅按正确答案过滤会把无效的中间步骤留在训练集中。<\/li><\/ul>","terms":["样本效率（sample efficiency）","rationale 评估（rationale evaluation）","few-shot 风格偏差（few-shot style bias）","process reward model","false positives","true negatives"]}},{"t":2032,"figs":[{"t":2044,"file":"slides/part06/slide_076.jpg"},{"t":2174,"file":"slides/part06/slide_079.jpg"},{"t":2236,"file":"slides/part06/slide_080.jpg"}],"en":{"title":"Audience Q: Distillation, Is STaR Real RL, and VAR / Quiet-STaR","problem":"A student notes you could instead use a frontier model to generate the rationale data (distillation), questioning the practical value of self-bootstrapping a small model.","why":"Distillation is often easier in practice, but the lecture's goal is to understand raw model improvement without relying on a stronger teacher; the exchange also opens the door to the generator/verifier and latent-thought variants.","how":"The lecturer concedes distillation is a fair point for many projects, then positions STaR as a proxy verifier. Adding a real verifier to the loop is VAR (generator + verifier trained together), and Quiet-STaR moves reasoning into the latent space with MLPs.","detail":"<p>Two audience threads:<\/p><ul><li><b>Distillation.<\/b> A student argues that for practical application you would just take a powerful model's outputs (distillation) rather than bootstrap from a small model. The lecturer agrees it is a fair point but says the lecture intentionally builds the capability from scratch so students understand what that takes; distillation is a related but different topic.<\/li><li><b>Is STaR full RL, and SFT vs RL?<\/b> The question triggers the transition to GRPO; the SFT-vs-RL trade-off is held until the end.<\/li><li><b>VAR:<\/b> in STaR the correct final answer acts as a proxy verifier. If you instead add an actual <b>verifier<\/b> to the loop, you get a paper that trains a <b>generator and a verifier in a loop<\/b>.<\/li><li><b>Quiet-STaR:<\/b> instead of reasoning steps in the language space, it puts reasoning steps in the <b>latent space<\/b> via MLPs — &ldquo;why have them in English when the model can think internally?&rdquo;<\/li><\/ul>","terms":["distillation","proxy verifier","VAR","generator-verifier loop","Quiet-STaR","latent reasoning"]},"zh":{"title":"听众提问：distillation、STaR 是否是真正的 RL，以及 VAR / Quiet-STaR","problem":"一名学生指出，你其实可以用前沿模型来生成 rationale 数据（distillation），从而质疑让小模型自我 bootstrap 的实际价值。","why":"Distillation 在实践中往往更容易，但本讲的目标是在不依赖更强 teacher 的前提下理解模型本身的改进；这段交流也引出了 generator/verifier 与 latent-thought 的变体。","how":"讲者承认对许多项目而言 distillation 是合理的观点，随后把 STaR 定位为代理 verifier。把真正的 verifier 加入闭环就是 VAR（generator 与 verifier 一起训练），而 Quiet-STaR 用 MLP 把推理移入 latent space。","detail":"<p>两条听众线索：<\/p><ul><li><b>Distillation。<\/b> 一名学生主张，在实际应用中你会直接取用强大模型的输出（distillation），而不是从小模型 bootstrap。讲者同意这是一个合理的观点，但表示本讲有意从零开始构建这一能力，以便学生理解其中需要付出什么；distillation 是一个相关但不同的话题。<\/li><li><b>STaR 是完整的 RL 吗？SFT 与 RL 的关系？<\/b> 这个问题触发了向 GRPO 的过渡；SFT 与 RL 的权衡被留到最后。<\/li><li><b>VAR：<\/b> 在 STaR 中，正确的最终答案充当代理 verifier。如果你改为把一个真正的 <b>verifier<\/b> 加入闭环，就会得到一篇在<b>闭环中同时训练 generator 与 verifier<\/b> 的论文。<\/li><li><b>Quiet-STaR：<\/b> 它不把推理步骤放在语言空间，而是通过 MLP 把推理步骤放入 <b>latent space<\/b>——&ldquo;既然模型能在内部思考，为什么还要用英语写出来？&rdquo;<\/li><\/ul>","terms":["distillation","代理 verifier（proxy verifier）","VAR","generator-verifier 闭环（generator-verifier loop）","Quiet-STaR","latent 推理（latent reasoning）"]}},{"t":2255,"figs":[{"t":2255,"file":"slides/part06/slide_083.jpg"}],"en":{"title":"Class Discussion: What Bounds STaR's Performance","problem":"The open class question is what fundamentally limits STaR as a technique, beyond implementation details.","why":"STaR cannot invent logical leaps that are not already latent in the base model; its ceiling is the base model's reasoning ability, which matters because RL builds on the same foundation.","how":"Students propose the bounds: no new logical leaps beyond the training distribution; performance tracks the model's capacity to reason (and to rationalize even given hints); wrong samples can be introduced. The lecturer ties this to the base model's capability.","detail":"<p>A class discussion asking what bounds STaR's performance:<\/p><ul><li><b>Student:<\/b> STaR should not make logical leaps that are not in its training data — rationalization stays at roughly the same level as what the model already knew, it just yields more rationale data.<\/li><li><b>Student:<\/b> if the model cannot reason even given the hints, rationalization does not show up at all, and if it produces bad reasoning it injects <b>wrong samples<\/b> into training.<\/li><li><b>Student:<\/b> performance is bounded by the model's capability to reason; some answers are inherently easier to rationalize (e.g. 225 as 15&times;15), and non-obvious answers need more data to form generalized reasoning to backtrack.<\/li><li><b>Lecturer:<\/b> all answers are valid, and this is worth keeping in mind as the lecture moves to RL — much of the magic in this domain is <b>what the base model can already do<\/b> as you build on top of it.<\/li><\/ul>","terms":["base model capability","logical leaps","distribution shift","wrong samples","rationalization","RL foundation"]},"zh":{"title":"课堂讨论：什么限制了 STaR 的性能","problem":"课堂上提出的开放问题是：撇开实现细节不谈，从根本上限制 STaR 这一技术的是什么。","why":"STaR 无法凭空创造 base model 中尚未潜藏的逻辑跳跃；它的上限就是 base model 的推理能力，这很重要，因为 RL 建立在同样的基础上。","how":"学生提出各种限制：无法做出超出训练分布的新逻辑跳跃；性能随模型推理（以及即便给出 hint 也能构造 rationale）的能力而变化；可能引入错误样本。讲者把这些归结为 base model 的能力。","detail":"<p>一场关于什么限制了 STaR 性能的课堂讨论：<\/p><ul><li><b>学生：<\/b> STaR 不应做出训练数据中没有的逻辑跳跃——rationalization 大致停留在模型已知的同一水平，只是产出了更多 rationale 数据。<\/li><li><b>学生：<\/b> 如果模型即便给出 hint 也无法推理，rationalization 就完全不会出现；而如果它产出糟糕的推理，就会把<b>错误样本<\/b>注入训练。<\/li><li><b>学生：<\/b> 性能受模型推理能力限制；有些答案天生更容易构造 rationale（例如把 225 视作 15&times;15），而不那么显然的答案需要更多数据才能形成可回退的泛化推理。<\/li><li><b>讲者：<\/b> 所有回答都成立，这一点在讲座转向 RL 时值得牢记——这个领域的大部分魔力在于，当你在此基础上构建时，<b>base model 已经能做什么<\/b>。<\/li><\/ul>","terms":["base model 能力（base model capability）","逻辑跳跃（logical leaps）","分布偏移（distribution shift）","错误样本（wrong samples）","rationalization","RL 基础（RL foundation）"]}},{"t":2454,"figs":[{"t":2496,"file":"slides/part06/slide_088.jpg"},{"t":2527,"file":"slides/part06/slide_089.jpg"},{"t":2616,"file":"slides/part06/slide_093.jpg"}],"en":{"title":"Paper 2, DeepSeek-Math: Priming with Curated Math and Code","problem":"A base model weak in math cannot be fixed by RL alone; prior STEM work trained on arXiv-style data with limited domain coverage.","why":"Archive papers lack breadth of math content, whereas curated Common Crawl math pages give much larger token yield and coverage; code pretraining also transfers to reasoning and tool use.","how":"Prime the model first: curate OpenWebMath from Common Crawl, start from DeepSeek-Coder, and supervised-fine-tune on the math corpus before scaling RL. Code-to-math transfer significantly helped while archive-only training did not.","detail":"<p>DeepSeek-Math's first contribution is <b>priming the base model<\/b> before RL.<\/p><ul><li>On the MATH top-1 chart, accuracy historically rose with model size; then a <b>7B<\/b> DeepSeek-Math appeared doing very well, and the leap was doing the <b>RL part of the train-time loop correctly<\/b>.<\/li><li>Prior STEM work (<b>Minerva<\/b>, on PaLM) trained on a lot of arXiv-style science/math data. DeepSeek found that training on archive papers was <b>not the trick<\/b> — papers lack coverage across math domains.<\/li><li>Instead they curated <b>OpenWebMath<\/b> from <b>Common Crawl<\/b>, yielding far more high-quality math tokens and broader domain coverage.<\/li><li>They started from <b>DeepSeek-Coder<\/b>: beginning with a code-pretrained model <b>significantly helped<\/b> math reasoning and tool use; this code-to-math transfer was shown here first.<\/li><li>They then supervised fine-tuned on the curated math corpus to build capability — consistent with the rule that RL cannot fix a domain the base model is weak in.<\/li><\/ul>","terms":["DeepSeek-Math","Minerva","PaLM","OpenWebMath","Common Crawl","DeepSeek-Coder","code-to-math transfer"]},"zh":{"title":"论文 2，DeepSeek-Math：用筛选后的数学与代码做 priming","problem":"数学能力薄弱的 base model 无法仅靠 RL 修复；此前的 STEM 工作基于 arXiv 风格的数据训练，领域覆盖有限。","why":"存档论文缺乏数学内容的广度，而从 Common Crawl 筛选出的数学页面提供了远更大的 token 产出与覆盖；代码预训练也能迁移到推理与工具使用上。","how":"先对模型做 priming：从 Common Crawl 筛选出 OpenWebMath，以 DeepSeek-Coder 为起点，在数学语料上做监督微调，然后再扩展 RL。代码到数学的迁移帮助显著，而仅用存档数据训练则没有。","detail":"<p>DeepSeek-Math 的第一项贡献是在 RL 之前对 <b>base model 做 priming<\/b>。<\/p><ul><li>在 MATH top-1 图上，准确率历史上随模型规模上升；随后出现了一个表现非常好的 <b>7B<\/b> DeepSeek-Math，而这一飞跃来自<b>正确地完成 train-time 闭环中的 RL 部分<\/b>。<\/li><li>此前的 STEM 工作（<b>Minerva<\/b>，基于 PaLM）在大量 arXiv 风格的科学/数学数据上训练。DeepSeek 发现基于存档论文训练<b>并非关键所在<\/b>——论文缺乏跨数学领域的覆盖。<\/li><li>他们改为从 <b>Common Crawl<\/b> 中筛选出 <b>OpenWebMath<\/b>，产出远更多的高质量数学 token 和更广的领域覆盖。<\/li><li>他们以 <b>DeepSeek-Coder<\/b> 为起点：从代码预训练的模型出发<b>显著帮助<\/b>了数学推理与工具使用；这种代码到数学的迁移在此首次被展示。<\/li><li>他们随后在筛选后的数学语料上做监督微调以构建能力——这与 RL 无法修复 base model 薄弱领域这一规律一致。<\/li><\/ul>","terms":["DeepSeek-Math","Minerva","PaLM","OpenWebMath","Common Crawl","DeepSeek-Coder","代码到数学的迁移（code-to-math transfer）"]}},{"t":2629,"figs":[{"t":2652,"file":"slides/part06/slide_111.jpg"},{"t":2701,"file":"slides/part06/slide_095.jpg"},{"t":2715,"file":"slides/part06/slide_096.jpg"},{"t":2743,"file":"slides/part06/slide_099.jpg"}],"en":{"title":"GRPO: Dropping the Critic with a Group-Relative Advantage","problem":"PPO-style RLHF/RLVR keeps an old policy, a new policy, a critic/value network, and a reward model, and four model copies become a memory bottleneck as RL scales.","why":"Reward models are trained on comparisons anyway, so a separately learned critic is redundant; the critic is exactly the expensive part that prevents scaling to larger models.","how":"GRPO drops the critic: sample a group of answers per question, score them with the reward model, and use the group-normalized reward (r − mean)/std as the advantage, leaving only three model copies.","detail":"<p>Standard RLHF/RLVR uses <b>PPO<\/b>, which keeps several model copies: old policy, new policy, a <b>critic<\/b> (value network), and a reward model. Four copies is fine at 7B but becomes a <b>memory bottleneck<\/b> as RL scales.<\/p><p><b>GRPO<\/b> removes the critic. For each question it samples a group of answers, scores them with the reward model, and defines the advantage as the <b>group-normalized reward<\/b>, <code>(r − mean(r)) / std(r)<\/code>. Because reward models are already trained on comparisons, the learned baseline is redundant, and only three copies remain.<\/p><ul><li>Result: <b>46.8 → 51.7<\/b> on MATH; the first open-source <b>7B<\/b> model to cross 50% without a critic.<\/li><li>RL variants differ mainly in the <b>data source<\/b> and how the <b>gradient coefficient<\/b> is computed (the group-baseline estimator here) for a single-step, answer-level problem.<\/li><li>Contrast: STaR and online-rejection fine-tuning give a binary 0/1 reward and reject failures; GRPO keeps all samples and gives each a relative, shaped advantage within its group.<\/li><\/ul>","terms":["PPO","GRPO","critic","value network","reward model","group-normalized advantage","online rejection fine-tuning"]},"zh":{"title":"GRPO：用组相对 advantage 去掉 critic","problem":"PPO 式的 RLHF/RLVR 需要保留旧策略、新策略、critic/value network 和一个 reward model，四份模型副本在 RL 扩展时成为内存瓶颈。","why":"reward model 本来就是基于比较训练的，因此单独学一个 critic 是多余的；而 critic 正是阻碍扩展到更大模型的那个昂贵部分。","how":"GRPO 去掉了 critic：对每个问题采样一组答案，用 reward model 打分，并用组归一化奖励 (r − mean)/std 作为 advantage，于是只剩三份模型副本。","detail":"<p>标准的 RLHF/RLVR 使用 <b>PPO<\/b>，需要保留多份模型副本：旧策略、新策略、一个 <b>critic<\/b>（value network）以及一个 reward model。在 7B 时四份副本尚可接受，但随着 RL 扩展会成为<b>内存瓶颈<\/b>。<\/p><p><b>GRPO<\/b> 去掉了 critic。对每个问题，它采样一组答案，用 reward model 打分，并把 advantage 定义为<b>组归一化奖励<\/b>，即 <code>(r − mean(r)) / std(r)<\/code>。由于 reward model 本就基于比较训练，学出来的 baseline 是多余的，于是只剩三份副本。<\/p><ul><li>结果：在 MATH 上 <b>46.8 → 51.7<\/b>；首个在无 critic 情况下跨过 50% 的开源 <b>7B<\/b> 模型。<\/li><li>对于单步、答案级的问题，各种 RL 变体的差异主要在于<b>数据来源<\/b>以及<b>梯度系数<\/b>的计算方式（此处是组基线估计量）。<\/li><li>对比：STaR 与 online-rejection fine-tuning 给出二值 0/1 奖励并丢弃失败样本；GRPO 保留所有样本，并在各自组内给予相对且经过整形的 advantage。<\/li><\/ul>","terms":["PPO","GRPO","critic","value network","reward model","组归一化 advantage（group-normalized advantage）","online rejection fine-tuning"]}},{"t":2787,"figs":[{"t":2820,"file":"slides/part06/slide_100.jpg"},{"t":3084,"file":"slides/part06/slide_109.jpg"},{"t":3138,"file":"slides/part06/slide_113.jpg"}],"en":{"title":"GRPO's Limits: Reward Distribution, KL, and majority@k vs pass@k","problem":"GRPO gives no learning signal when every sampled answer for a question is correct or every answer is wrong, so gradient is wasted and hard problems teach nothing.","why":"The group normalization divides by the spread of rewards; if all rewards are 0 or all are 1 the advantage is zero. RL needs a distribution of rewards across the batch to hill-climb on.","how":"Diagnostics: a KL divergence term keeps the model near behaviors it already solved; a reward model can produce graded scores beyond 0/1; and DeepSeek-Math improved majority@k (consistency) but not pass@k (fundamental capability).","detail":"<p>The group baseline is also GRPO's weakness.<\/p><ul><li>If all sampled answers for a question are correct (too easy) or all wrong (too hard), the reward spread is zero, so <b>the advantage is zero<\/b> and that group contributes no gradient. What RL needs is a <b>distribution of rewards<\/b>; all-zero or all-one batches give no hill-climbing signal.<\/li><li>A student notes the <b>KL divergence<\/b> term in PPO/GRPO prevents the policy from drifting away from behaviors it already solved — addressing regression on easy problems. The lecturer agrees: KL keeps the model near what it could already do.<\/li><li><b>Reward model scoring:<\/b> beyond binary rewards, a reward model assigns each answer a score, which enables averaging and a graded advantage; without it you can still use 0/1 as a proxy.<\/li><li><b>Key diagnostic:<\/b> online RL beats the STaR-style loop, but on DeepSeek-Math it improved <b>majority@k<\/b> (consistency) and <b>not pass@k<\/b> — the model became more reliable, not fundamentally smarter.<\/li><\/ul>","terms":["advantage","reward distribution","KL divergence","reward model","majority@k","pass@k","consistency"]},"zh":{"title":"GRPO 的局限：奖励分布、KL，以及 majority@k 与 pass@k","problem":"当某个问题采样的所有答案都正确或都错误时，GRPO 不提供学习信号，梯度被浪费，困难问题也教不了任何东西。","why":"组归一化除以奖励的离散程度；如果所有奖励都是 0 或都是 1，advantage 就是零。RL 需要在批次中存在奖励分布才能爬山。","how":"诊断：KL divergence 项让模型贴近它已经解决的各类行为；reward model 可以产生超出 0/1 的分级分数；而 DeepSeek-Math 提升的是 majority@k（一致性），而非 pass@k（根本能力）。","detail":"<p>组基线也是 GRPO 的弱点。<\/p><ul><li>如果某个问题采样的所有答案都正确（太简单）或都错误（太难），奖励的离散程度为零，于是 <b>advantage 为零<\/b>，该组不贡献梯度。RL 需要的是<b>奖励分布<\/b>；全零或全一的批次不提供爬山信号。<\/li><li>一名学生指出 PPO/GRPO 中的 <b>KL divergence<\/b> 项能防止策略偏离它已经解决的各类行为——这解决了简单问题上的回退。讲者表示同意：KL 让模型贴近它本就能做的事。<\/li><li><b>Reward model 打分：<\/b> 除了二值奖励，reward model 会给每个答案一个分数，从而支持求平均和分级 advantage；没有它，你仍可用 0/1 作为代理。<\/li><li><b>关键诊断：<\/b> online RL 优于 STaR 式闭环，但在 DeepSeek-Math 上它提升的是 <b>majority@k<\/b>（一致性），而<b>不是 pass@k<\/b>——模型变得更可靠，而非从根本上更聪明。<\/li><\/ul>","terms":["advantage","奖励分布（reward distribution）","KL divergence","reward model","majority@k","pass@k","一致性（consistency）"]}},{"t":3187,"figs":[{"t":3234,"file":"slides/part06/slide_115.jpg"},{"t":3257,"file":"slides/part06/slide_117.jpg"},{"t":3295,"file":"slides/part06/slide_119.jpg"}],"en":{"title":"Paper 3, DAPO: Why Naively Scaling GRPO Breaks","problem":"Naively scaling GRPO to harder reasoning, for example on a public Qwen 32B model, yields only about 30% on AIME and the run is unstable.","why":"Entropy collapses so the policy becomes overconfident, response length explodes until traces are truncated by the context limit, and PPO's symmetric clipping throttles exactly the exploration you need.","how":"DAPO makes explicit the RL implementation details GRPO left implicit — clipping shape, sampling, loss shape, length control — so the loop can hill-climb on longer, harder reasoning chains without collapsing. DeepSeek's earlier work reached 47% on AIME, so the ceiling is higher.","detail":"<p>Naively scaling GRPO to harder reasoning (e.g. a public <b>Qwen 32B<\/b>) gives only about <b>30%<\/b> on AIME and is unstable.<\/p><ul><li><b>Entropy collapse<\/b>: the policy gets too confident, exploration dies, and entropy — a proxy for how much exploration is possible — falls.<\/li><li><b>Training instability<\/b> and <b>uncontrollable response length<\/b>: chains grow until they are <b>truncated<\/b>, and truncated traces inject noise into the gradient.<\/li><li><b>PPO clipping is symmetric<\/b>: it caps how much a low-probability token can be raised, so exploration is throttled. DAPO uses <b>asymmetric clipping<\/b> that allows bigger increases; the graphs show higher accuracy and more stable (non-collapsing) entropy.<\/li><li><b>Reference point:<\/b> DeepSeek's earlier work reached <b>47%<\/b> on AIME, so 30% is far from the ceiling.<\/li><li>DAPO's goal is to turn the folklore of PPO/GRPO exploration details into an <b>explicit recipe<\/b>.<\/li><\/ul>","terms":["DAPO","Qwen 32B","entropy collapse","response length","symmetric clipping","asymmetric clipping","truncation"]},"zh":{"title":"论文 3，DAPO：为什么朴素地扩展 GRPO 会失败","problem":"把 GRPO 朴素地扩展到更难的推理上，例如在公开的 Qwen 32B 模型上，在 AIME 上只得到约 30%，而且运行不稳定。","why":"Entropy 崩溃，策略变得过度自信；response length 爆炸式增长，直到 trace 被上下文上限截断；而 PPO 的对称裁剪恰好扼杀了你所需要的探索。","how":"DAPO 把 GRPO 未明确说明的 RL 实现细节显式化——裁剪形状、采样、loss 形状、长度控制——从而使闭环能在更长、更难的推理链上爬山而不崩溃。DeepSeek 早前的工作在 AIME 上达到 47%，因此上限更高。","detail":"<p>把 GRPO 朴素地扩展到更难的推理（例如公开的 <b>Qwen 32B<\/b>）在 AIME 上只得到约 <b>30%<\/b>，且不稳定。<\/p><ul><li><b>Entropy 崩溃<\/b>：策略变得过度自信，探索消亡，作为可探索程度代理的 entropy 下降。<\/li><li><b>训练不稳定<\/b>与<b>无法控制的 response length<\/b>：链不断增长直至被<b>截断<\/b>，而被截断的 trace 会把噪声注入梯度。<\/li><li><b>PPO 的裁剪是对称的<\/b>：它限制了低概率 token 能被抬升的幅度，从而扼杀探索。DAPO 使用<b>非对称裁剪<\/b>，允许更大的提升；图中显示准确率更高、entropy 更稳定（不崩溃）。<\/li><li><b>参照点：<\/b> DeepSeek 早前的工作在 AIME 上达到 <b>47%<\/b>，因此 30% 远未触及上限。<\/li><li>DAPO 的目标是把 PPO/GRPO 探索细节中的经验之谈变成<b>显式的配方<\/b>。<\/li><\/ul>","terms":["DAPO","Qwen 32B","entropy 崩溃（entropy collapse）","response length","对称裁剪（symmetric clipping）","非对称裁剪（asymmetric clipping）","截断（truncation）"]}},{"t":3322,"figs":[{"t":3346,"file":"slides/part06/slide_120.jpg"}],"en":{"title":"DAPO: Dynamic Sampling for a Usable Reward Distribution","problem":"With a fixed group size, many groups are all-correct or all-wrong, so their advantage is zero and the gradient is wasted — precisely the GRPO failure mode identified earlier.","why":"What you want is a batch in which most groups carry a usable reward distribution; oversampling and discarding degenerate groups keeps the effective batch signal-rich.","how":"Dynamic sampling oversamples, filters out groups whose rewards are all zero or all one, and keeps only the subset with an intermediate distribution between 0 and N. This maintains an effective batch size for gradient propagation.","detail":"<p><b>Dynamic sampling<\/b> directly addresses the reward-distribution problem.<\/p><ul><li>In GRPO you sample a fixed group (the lecture uses <b>64<\/b> as an exemplar) and take a group baseline. DAPO instead <b>oversamples<\/b>.<\/li><li>It then <b>filters out all-correct and all-wrong groups<\/b>, keeping only a subset whose rewards have a real distribution between 0 and N.<\/li><li>Goal: your advantage should not be zero. If rewards are all correct or all wrong, the group is discarded; only groups with signal are kept.<\/li><li>This maintains an <b>effective batch size<\/b> for propagating gradients, because gradients are not computed from degenerate groups.<\/li><li><b>Q&amp;A:<\/b> a student asks whether 64 samples is small, suggesting AIME's limited question pool. The lecturer says the number is a benchmark- and base-model-dependent choice and the setup is an exemplar of what the paper achieved.<\/li><\/ul>","terms":["dynamic sampling","oversampling","effective batch size","reward distribution","group baseline","gradient signal"]},"zh":{"title":"DAPO：用动态采样获得可用的奖励分布","problem":"在固定的组大小下，许多组全对或全错，因此其 advantage 为零，梯度被浪费——这正是此前指出的 GRPO 失败模式。","why":"你想要的是一批中大多数组都携带可用的奖励分布；通过过采样并丢弃退化组，可让有效批次保持富含信号。","how":"动态采样进行过采样，过滤掉奖励全为零或全为一的组，只保留在 0 与 N 之间具有中间分布的子集。这样可维持用于梯度传播的有效批次大小。","detail":"<p><b>动态采样<\/b>直接解决了奖励分布问题。<\/p><ul><li>在 GRPO 中你会采样固定大小的组（讲座以 <b>64<\/b> 为例）并取组基线。DAPO 则<b>过采样<\/b>。<\/li><li>然后它<b>过滤掉全对和全错的组<\/b>，只保留奖励在 0 与 N 之间具有真实分布的子集。<\/li><li>目标：你的 advantage 不应为零。如果奖励全对或全错，该组就被丢弃；只保留有信号的组。<\/li><li>这样可维持用于传播梯度的<b>有效批次大小<\/b>，因为梯度不是从退化组计算得来的。<\/li><li><b>问答：<\/b> 一名学生问 64 个样本是否偏少，并提到 AIME 题库有限。讲者说这个数字取决于基准与 base model，该设置只是论文所取得结果的一个示例。<\/li><\/ul>","terms":["动态采样（dynamic sampling）","过采样（oversampling）","有效批次大小（effective batch size）","奖励分布（reward distribution）","组基线（group baseline）","梯度信号（gradient signal）"]}},{"t":3452,"figs":[{"t":3491,"file":"slides/part06/slide_123.jpg"},{"t":3508,"file":"slides/part06/slide_124.jpg"},{"t":3542,"file":"slides/part06/slide_125.jpg"},{"t":3575,"file":"slides/part06/slide_126.jpg"}],"en":{"title":"DAPO: Token-Level Loss and Overlong Reward Shaping","problem":"Sample-level loss gives a long garbage answer the same weight as a short good one, and hard problems generate reasoning chains that hit the context limit and get truncated.","why":"As the model improves, chains grow longer; truncation injects noise, and sample-level averaging lets runaway output length distort the gradient and destabilize entropy.","how":"DAPO switches to token-level loss (so shorter, better answers are shaped more sensibly) and adds a soft overlong punishment — a gradual length penalty instead of a hard cutoff — which stabilizes training. Alternatives include increasing context length over the RL loop.","detail":"<p>Two coupled fixes around response length:<\/p><ul><li><b>Sample-level vs token-level loss.<\/b> With sample-level loss, each question/answer sequence contributes equally, so a very long garbage answer gets the same weight as a short good answer. DAPO uses a <b>token-level loss<\/b>, which shapes the signal by length and controls both <b>entropy<\/b> and <b>mean response length<\/b>.<\/li><li><b>Overlong / truncation handling.<\/b> On hard problems the chain gets <b>truncated<\/b> at the context limit; truncated reasoning chains generate noise. DAPO adds a <b>gradual (soft) penalty<\/b> in the tokens rather than a hard cutoff, stabilizing training.<\/li><li>Alternative approach in other papers: increase the <b>context length<\/b> over the RL loop so traces fit.<\/li><li>Without these controls, response length grows uncontrollably and entropy becomes unstable as the model learns to emit longer and longer chains.<\/li><\/ul>","terms":["token-level loss","sample-level loss","soft overlong punishment","response length","entropy","context length","truncation noise"]},"zh":{"title":"DAPO：token 级损失与超长奖励整形","problem":"样本级损失会让一段冗长的垃圾答案与一段简短的好答案获得相同权重，而困难问题生成的推理链会触及上下文上限并被截断。","why":"随着模型改进，链会变长；截断注入噪声，而样本级平均会让失控的输出长度扭曲梯度并破坏 entropy 的稳定。","how":"DAPO 改用 token 级损失（使更短、更好的答案得到更合理的整形），并加入软性超长惩罚——一种渐进式长度惩罚而非硬性截断——从而稳定训练。替代方案包括在 RL 闭环中逐步增加上下文长度。","detail":"<p>围绕 response length 的两个相互关联的修正：<\/p><ul><li><b>样本级损失 vs token 级损失。<\/b> 使用样本级损失时，每个问题/答案序列贡献相同，因此一段很长的垃圾答案与一段简短的好答案权重相同。DAPO 使用 <b>token 级损失<\/b>，按长度对信号进行整形，并同时控制 <b>entropy<\/b> 与<b>平均 response length<\/b>。<\/li><li><b>超长/截断处理。<\/b> 在困难问题上链会在上下文上限处被<b>截断<\/b>；被截断的推理链会产生噪声。DAPO 在 token 上加入<b>渐进式（软性）惩罚<\/b>而非硬性截断，从而稳定训练。<\/li><li>其他论文中的替代做法：在 RL 闭环中逐步增加<b>上下文长度<\/b>，使 trace 能容纳下。<\/li><li>没有这些控制，response length 会不受控地增长，entropy 也会变得不稳定，因为模型学会了输出越来越长的链。<\/li><\/ul>","terms":["token 级损失（token-level loss）","样本级损失（sample-level loss）","软性超长惩罚（soft overlong punishment）","response length","entropy","上下文长度（context length）","截断噪声（truncation noise）"]}},{"t":3583,"figs":[{"t":3608,"file":"slides/part06/slide_128.jpg"},{"t":3651,"file":"slides/part06/slide_129.jpg"}],"en":{"title":"DAPO Ablation Ladder and Results","problem":"It is unclear which of DAPO's fixes actually matters and how much each contributes; an ablation isolates them one at a time on the AIME benchmark.","why":"Each fix targets a different failure: noisy truncated samples, collapsed exploration, runaway length, loss weighting, and degenerate reward groups. Together they recover far more than 30%.","how":"On AIME with Qwen 32B: overlong filtering 30 → 36; asymmetric clipping → 38; soft overlong punishment → 41; token-level loss → 42; dynamic sampling → 50, beating DeepSeek-R1 distilled to Qwen 32B.","detail":"<p>The ablation ladder on <b>AIME / Qwen 32B<\/b>:<\/p><ul><li><b>Overlong filtering<\/b> removes truncated, noisy samples: <b>30 → 36<\/b>.<\/li><li><b>Asymmetric clipping<\/b> (clip higher on the up-side) preserves exploration and keeps entropy stable: <b>→ 38<\/b>.<\/li><li><b>Soft overlong punishment<\/b>, a gradual length penalty instead of a hard cutoff: <b>→ 41<\/b>.<\/li><li><b>Token-level loss<\/b> instead of sample-level loss, so a long garbage answer does not get the same weight as a short good one: <b>→ 42<\/b>.<\/li><li><b>Dynamic sampling<\/b>, oversampling and discarding all-correct / all-wrong groups so the effective batch always carries signal: <b>→ 50<\/b>.<\/li><li>The final <b>50<\/b> beats DeepSeek-R1 <b>distilled down to Qwen 32B<\/b> — DAPO hill-climbs on Qwen 32B directly rather than relying on distillation from a stronger reasoner.<\/li><\/ul>","terms":["ablation ladder","overlong filtering","asymmetric clipping","soft overlong punishment","token-level loss","dynamic sampling","DeepSeek-R1 distill"]},"zh":{"title":"DAPO 的消融阶梯与结果","problem":"DAPO 的哪些修正真正重要、各自贡献多少尚不清楚；消融实验在 AIME 基准上逐一分离它们。","why":"每个修正针对不同的失败：含噪声的截断样本、探索崩溃、长度失控、损失加权，以及退化的奖励组。它们合起来把成绩从 30% 提升得多得多。","how":"在 Qwen 32B 的 AIME 上：超长过滤 30 → 36；非对称裁剪 → 38；软性超长惩罚 → 41；token 级损失 → 42；动态采样 → 50，超过蒸馏到 Qwen 32B 的 DeepSeek-R1。","detail":"<p><b>AIME / Qwen 32B<\/b> 上的消融阶梯：<\/p><ul><li><b>超长过滤<\/b>去除被截断、含噪声的样本：<b>30 → 36<\/b>。<\/li><li><b>非对称裁剪<\/b>（在上侧裁剪得更高）保住探索并使 entropy 稳定：<b>→ 38<\/b>。<\/li><li><b>软性超长惩罚<\/b>，用渐进式长度惩罚代替硬性截断：<b>→ 41<\/b>。<\/li><li>用 <b>token 级损失<\/b>代替样本级损失，使一段冗长的垃圾答案不会与一段简短的好答案获得相同权重：<b>→ 42<\/b>。<\/li><li><b>动态采样<\/b>，过采样并丢弃全对/全错的组，使有效批次始终携带信号：<b>→ 50<\/b>。<\/li><li>最终的 <b>50<\/b> 超过了<b>蒸馏到 Qwen 32B<\/b> 的 DeepSeek-R1——DAPO 直接在 Qwen 32B 上爬山，而不是依赖从更强推理模型蒸馏。<\/li><\/ul>","terms":["消融阶梯（ablation ladder）","超长过滤（overlong filtering）","非对称裁剪（asymmetric clipping）","软性超长惩罚（soft overlong punishment）","token 级损失（token-level loss）","动态采样（dynamic sampling）","DeepSeek-R1 蒸馏（DeepSeek-R1 distill）"]}},{"t":3671,"figs":[{"t":3688,"file":"slides/part06/slide_131.jpg"},{"t":3753,"file":"slides/part06/slide_132.jpg"}],"en":{"title":"DAPO Learnings, SFT vs RL, and Comparing the Three Methods","problem":"The RL loss alone is not a sufficient proxy for progress: reward models saturate, response length and entropy run away, and optimization in the RL loop is harder than in supervised learning.","why":"Rewards can be noisy or saturate, exploration can collapse, and truncated or length-mismatched samples distort the gradient, so several coupled quantities must be controlled at once.","how":"Watch three quantities: response length, entropy (neither too low nor too high), and the fraction of samples with accuracy 1 (how much you need to sample). Then choose among STaR, GRPO, and DAPO based on data, base model, memory, and reasoning-chain length.","detail":"<p>Learnings and method selection:<\/p><ul><li>Monitor <b>response length<\/b> (exploding length ⇒ control the loss), <b>entropy<\/b> (keep exploration alive but not chaotic), and the <b>fraction of samples with full accuracy<\/b> (tells you how much to sample). If there is no improvement after many steps, the <b>reward model may be saturated<\/b>.<\/li><li><b>SFT vs RL:<\/b> RL hill-climbs with <b>fewer examples<\/b> in domains with a strong reward signal, but takes a lot of work to tune. SFT with lots of high-quality data is often the faster way to improve raw performance, but it does not boost reasoning trace capabilities by itself.<\/li><li><b>STaR:<\/b> good when you have only a few hundred reasoning examples and no RL infrastructure; simple tasks like GSM8K improve modestly while staying within the model's capability.<\/li><li><b>GRPO:<\/b> needs a good base model and priming with instruction data, but works with limited GPUs/memory and is well-proven on standard math reasoning.<\/li><li><b>DAPO:<\/b> needed when chains are long (harder problems) and you want state-of-the-art; you must control the loss, sampling, clipping, and length variables.<\/li><\/ul>","terms":["reward saturation","response length","entropy","accuracy fraction","SFT vs RL","infrastructure trade-off"]},"zh":{"title":"DAPO 的经验、SFT 与 RL，以及三种方法的比较","problem":"仅凭 RL loss 不足以作为进展的代理：reward model 会饱和，response length 与 entropy 会失控，而且 RL 闭环中的优化比监督学习更难。","why":"奖励可能有噪声或饱和，探索可能崩溃，被截断或长度不匹配的样本会扭曲梯度，因此必须同时控制多个相互耦合的量。","how":"关注三个量：response length、entropy（既不过低也不过高），以及准确率为 1 的样本比例（决定你需要采样多少）。然后根据数据、base model、内存与推理链长度，在 STaR、GRPO 与 DAPO 之间选择。","detail":"<p>经验与方法选择：<\/p><ul><li>监控 <b>response length<\/b>（长度爆炸 ⇒ 控制损失）、<b>entropy<\/b>（让探索保持活跃但不要混乱），以及<b>完全正确的样本比例<\/b>（告诉你需要采样多少）。如果很多步之后仍无提升，<b>reward model 可能已饱和<\/b>。<\/li><li><b>SFT 与 RL：<\/b> 在有强奖励信号的领域，RL 用<b>更少的样本<\/b>就能爬山，但调参工作量很大。用大量高质量数据做 SFT 通常是更快提升原始性能的方式，但它本身不会提升推理 trace 的能力。<\/li><li><b>STaR：<\/b> 当你只有几百条推理示例且没有 RL 基础设施时很合适；像 GSM8K 这样的简单任务会在模型能力范围内获得适度提升。<\/li><li><b>GRPO：<\/b> 需要一个好的 base model 并用指令数据做 priming，但可在有限的 GPU/内存下工作，且已在标准数学推理上得到充分验证。<\/li><li><b>DAPO：<\/b> 当链很长（更难的问题）且你想要 state-of-the-art 时需要它；你必须控制损失、采样、裁剪与长度这些变量。<\/li><\/ul>","terms":["奖励饱和（reward saturation）","response length","entropy","正确率比例（accuracy fraction）","SFT 与 RL（SFT vs RL）","基础设施权衡（infrastructure trade-off）"]}},{"t":3793,"figs":[{"t":3825,"file":"slides/part06/slide_133.jpg"},{"t":3921,"file":"slides/part06/slide_135.jpg"}],"en":{"title":"What Actually Improves vs Fundamental Capability","problem":"It matters greatly whether these methods make the model fundamentally smarter or merely more reliable; the lecture claims the latter, and questions where new capability comes from.","why":"Pass@k measures whether the model can solve a new problem at all; majority@k measures how often it does, so a rise in consistency is not the same as a rise in capability.","how":"All three techniques improve majority@k, answer formatting, and multi-step coherence as compute rises — but none yet improve fundamental capability, teach genuinely new problems, or generalize out of domain. Also raised: reward hacking when the model outgrows the reward model, and ensemble verifiers.","detail":"<p>What to expect from the three techniques:<\/p><ul><li>All three improve <b>majority@k<\/b> (y-axis, as more compute is applied), <b>answer formatting<\/b>, and <b>coherence over multiple steps<\/b>.<\/li><li><b>None yet improve fundamental capability<\/b>: they do not teach the model to solve genuinely new problems or generalize much out of domain. Improving <b>pass@k<\/b> means improving the fundamental ability to solve new problems, which historically comes from a breakthrough or scaling in some dimension.<\/li><li><b>Reward hacking:<\/b> if the model is too capable, rewards get hacked; if the reward model lacks signal, the loop cannot hill-climb. The optimization problem is fundamentally harder than supervised learning — you depend on the model's ability to reason and on a verifier or reward model.<\/li><li><b>Verification supply<\/b> is the bottleneck: code has final answers, execution feedback, and unit tests; math has answers. How many domains offer such signals, can ensembles of verifiers fill one verifier's gaps, and which verification signals are good enough remain central questions.<\/li><\/ul>","terms":["majority@k","pass@k","fundamental capability","reward hacking","ensemble verifiers","execution feedback","verification supply"]},"zh":{"title":"真正提升的是什么，与根本能力之别","problem":"这些方法究竟让模型从根本上更聪明，还是仅仅更可靠，这非常重要；讲座主张是后者，并追问新能力从何而来。","why":"pass@k 衡量模型究竟能否解决一个新问题；majority@k 衡量它解决的频率，因此一致性的提升不等同于能力的提升。","how":"随着算力增加，这三种技术都能提升 majority@k、答案格式与多步连贯性——但都尚未提升根本能力、教会真正新的问题，或做跨领域泛化。还提到：当模型超出 reward model 时出现的 reward hacking，以及 ensemble verifier。","detail":"<p>对这三种技术可以期待什么：<\/p><ul><li>随着投入更多算力，三者都能提升 <b>majority@k<\/b>（纵轴）、<b>答案格式<\/b>与<b>多步连贯性<\/b>。<\/li><li><b>都尚未提升根本能力<\/b>：它们没有教会模型解决真正新的问题，也没有多少跨领域泛化。提升 <b>pass@k<\/b> 意味着提升解决新问题的根本能力，而这在历史上来自某个维度的突破或扩展。<\/li><li><b>Reward hacking：<\/b> 如果模型能力过强，奖励就会被钻空子；如果 reward model 缺乏信号，闭环就无法爬山。这个优化问题从根本上比监督学习更难——你依赖于模型的推理能力，以及一个 verifier 或 reward model。<\/li><li><b>验证供给<\/b>是瓶颈：代码有最终答案、执行反馈和单元测试；数学有答案。有多少领域能提供这类信号、verifier 的 ensemble 能否填补单个 verifier 的缺口、哪些验证信号足够好，这些仍是核心问题。<\/li><\/ul>","terms":["majority@k","pass@k","根本能力（fundamental capability）","reward hacking","ensemble verifier（ensemble verifiers）","执行反馈（execution feedback）","验证供给（verification supply）"]}},{"t":3996,"figs":[{"t":4035,"file":"slides/part06/slide_140.jpg"}],"en":{"title":"Open Problems, Directions, and Final Q&A","problem":"Train-time scaling is an active research area with unresolved questions about what actually improves, whether reported reasoning behaviors are real, and how to exploit failures.","why":"Methods teach reliability rather than new capability, reasoning traces may be statistically amplified rather than emergent, failures are discarded rather than learned from, and reward noise and saturation cap the loop.","how":"Open problems: why majority@k rises without pass@k; whether backtracking/self-correction is real; learning from failures. Directions: better data generation, RL robust to reward noise, choosing rewards, and combining STaR-style rationalization with DAPO. The final Q&A covers RL's share of frontier compute and data efficiency.","detail":"<p>Open problems called out:<\/p><ul><li><b>Why majority@k increases but pass@k does not<\/b> — the central unexplained empirical fact.<\/li><li><b>Are reasoning behaviors real?<\/b> Backtracking and self-correction appear in traces, but are they emerging or already present and just becoming statistically more prevalent?<\/li><li><b>Learning from failures<\/b> is unsolved; most techniques filter failures out.<\/li><li><b>Promising directions:<\/b> along <b>data<\/b> (generate better training data), along <b>algorithm<\/b> (make RL robust to reward-model noise, choose rewards), and combining STaR-style rationalization with DAPO.<\/li><\/ul><p>Final Q&amp;A: a student asks what fraction of frontier training is still raw next-token prediction vs reasoning data. The lecturer cites public RL share growing from roughly <b>99%/1% pre-training/RL<\/b> toward ~5%, while <b>Grok 4<\/b> claimed ~50% RL without a corresponding jump — bottlenecked by weak/noisy rewards. On limited datasets (AIME, USM), RL is <b>more data-efficient<\/b>, and the right abstraction is not &ldquo;is there enough data&rdquo; but &ldquo;is there enough data to <b>hill-climb<\/b> on&rdquo; (e.g. without dynamic-sampling filtering). Ensemble verifiers help fill the signal gap.<\/p>","terms":["open problems","majority@k","pass@k","reasoning behaviors","learning from failures","Grok 4","data efficiency","hill-climb"]},"zh":{"title":"开放问题、研究方向与最后的问答","problem":"Train-time scaling 是一个活跃的研究领域，仍有未解决的问题：究竟什么在提升、所报告的推理行为是否真实，以及如何利用失败样本。","why":"这些方法教会的是可靠性而非新能力，推理 trace 可能是被统计性地放大而非涌现，失败样本被丢弃而非被学习利用，而奖励噪声与饱和限制了闭环。","how":"开放问题：为什么 majority@k 上升而 pass@k 不上升；回退/自我纠正是否真实；从失败中学习。方向：更好的数据生成、对奖励噪声鲁棒的 RL、奖励的选择，以及把 STaR 式 rationalization 与 DAPO 结合。最后的问答涉及 RL 在前沿算力中的占比与数据效率。","detail":"<p>被点出的开放问题：<\/p><ul><li><b>为什么 majority@k 上升而 pass@k 不上升<\/b>——这是核心且尚未解释的经验事实。<\/li><li><b>推理行为是真实的吗？<\/b> 回退与自我纠正会出现在 trace 中，但它们是涌现出来的，还是本就存在、只是变得在统计上更普遍？<\/li><li><b>从失败中学习<\/b>尚未解决；大多数技术把失败样本过滤掉了。<\/li><li><b>有前景的方向：<\/b> 沿<b>数据<\/b>方向（生成更好的训练数据）、沿<b>算法<\/b>方向（让 RL 对 reward model 噪声鲁棒、选择奖励），以及把 STaR 式 rationalization 与 DAPO 结合。<\/li><\/ul><p>最后的问答：一名学生问，前沿训练中仍有哪一比例是原始的 next-token prediction，哪一比例是推理数据。讲者引述公开数据称 RL 占比从大约 <b>99%/1% 的预训练/RL<\/b> 朝向约 5% 增长，而 <b>Grok 4<\/b> 声称约 50% 用于 RL，却没有相应的跃升——瓶颈在于奖励薄弱/有噪声。在有限的数据集（AIME、USM）上，RL <b>更节省数据<\/b>，正确的抽象不是&ldquo;数据是否足够多&rdquo;，而是&ldquo;数据是否足以用来<b>爬山<\/b>&rdquo;（例如在没有动态采样过滤的情况下）。ensemble verifier 有助于填补信号缺口。<\/p>","terms":["开放问题（open problems）","majority@k","pass@k","推理行为（reasoning behaviors）","从失败中学习（learning from failures）","Grok 4","数据效率（data efficiency）","爬山（hill-climb）"]}}]},{"n":7,"id":"Uni9dqyuuDM","duration":4343,"slideCount":43,"en":{"title":"Self-Improvement and Deep Research Agents","summary":"Self-improvement is framed as search over a model's output space: the solution often already exists among the samples, and the engineering problem is curating it out. The lecture first follows AlphaCode (pretrain on GitHub plus CodeContests, sample 1M programs per problem, filter with example tests, cluster semantically, submit about 10 to Codeforces) and then AlphaCode 2 (fine-tune Gemini Pro, train a family of generators for diversity, learn a scoring model for selection) to show that better base models and learned selection roughly double solve rate while cutting sample cost. It then pivots to deep research agents: reasoning models are frozen at a knowledge cutoff and hedge with uncertainty tokens on GPQA, so the lecture contrasts direct reasoning, plain RAG (one-shot retrieval), agentic RAG (search during reasoning), and Search-o1 (query on the fly and reason within retrieved documents), then closes with Search-R1 and calibration."},"zh":{"title":"自我改进与 Deep Research Agent","summary":"自我改进被框定为对模型输出空间的搜索：正确解往往已经存在于样本之中，工程问题在于把它策展出来。讲座首先梳理 AlphaCode（在 GitHub 加 CodeContests 上预训练，每个问题采样 1M 个程序，用示例测试筛选，按语义聚类，向 Codeforces 提交约 10 个），随后是 AlphaCode 2（fine-tune Gemini Pro，训练一族 generator 以获得多样性，学习一个 scoring model 用于选择），表明更好的基座模型与学习得到的 selection 在削减样本成本的同时大致将 solve rate 翻倍。之后转向 deep research agent：推理模型被冻结在 knowledge cutoff 上，并在 GPQA 上用不确定性 token 来对冲，因此讲座对比 direct reasoning、plain RAG（一次性检索）、agentic RAG（推理期间搜索）和 Search-o1（即时查询并在检索到的文档内推理），最后以 Search-R1 与 calibration 收尾。"},"sections":[{"t":5,"figs":[{"t":43,"file":"slides/part07/slide_002.jpg"}],"en":{"title":"Framing: self-improvement as search over the output space","problem":"A model can emit many outputs, but a single stochastic trace is just a draw, and there is no built-in mechanism to pull the correct solution out of everything it can generate.","why":"Solutions are rare relative to the enormous space of possible programs or answers, so generation alone leaves value on the table; curation, not sampling, is the bottleneck.","how":"The lecture reframes self-improvement as search over model outputs, splitting into code-model massive-sampling search (AlphaCode / AlphaCode 2, reused in Homework 2) and deep-research agentic search (Homework 3), with coverage and selection as recurring concerns.","detail":"<p>The instructor frames the entire lecture around one claim: <b>a correct solution already lies somewhere in the model's output space<\/b>; the engineering problem is <i>curating<\/i> it out of everything the model can emit. Two search patterns are announced:<\/p><ul><li><b>Code-model sampling search<\/b> &mdash; generate many samples and search over them (AlphaCode / AlphaCode 2), the pattern reused in the HumanEval-focused homework.<\/li><li><b>Deep-research agentic search<\/b> &mdash; the retrieve-and-synthesize loop used in Homework 3.<\/li><\/ul><p>The concrete contrast is a coding assistant that behaves like <b>autocomplete<\/b> (complete a line) versus <b>competitive programming<\/b>, which supplies a problem description plus input/output examples acting as a contract and demands the model infer the algorithm before writing it. The recurring decomposition for the rest of the lecture: <b>coverage<\/b> (is a correct sample even present?) versus <b>selection<\/b> (can the pipeline identify it?).<\/p>","terms":["search","coverage","selection","competitive programming","autocomplete","deep research"]},"zh":{"title":"框架：将自我改进视为对输出空间的搜索","problem":"模型可以产生大量输出，但单条随机轨迹只是一次抽样，且没有内建机制能从它所能生成的一切中抽出正确解。","why":"相对于可能程序或答案的巨大空间，正确解十分稀少，因此仅靠生成会留下未被利用的价值；瓶颈在于策展（curation），而非采样。","how":"本讲将自我改进重新表述为对模型输出的搜索，分为代码模型的大规模采样搜索（AlphaCode / AlphaCode 2，在 Homework 2 中复用）与 deep research 的 agentic 搜索（Homework 3），coverage 与 selection 是贯穿始终的关注点。","detail":"<p>讲师围绕一个论断来组织整堂课：<b>正确解已经存在于模型的输出空间中的某处<\/b>；工程问题在于把它从模型所能生成的一切中<i>策展<\/i>出来。讲座宣布了两种搜索模式：<\/p><ul><li><b>代码模型采样搜索<\/b> &mdash; 生成大量样本并在其中搜索（AlphaCode / AlphaCode 2），即面向 HumanEval 的作业中复用的模式。<\/li><li><b>Deep research 的 agentic 搜索<\/b> &mdash; Homework 3 中使用的 retrieve-and-synthesize 循环。<\/li><\/ul><p>具体的对比是：一个像 <b>autocomplete<\/b>（补全一行）那样行为的编码助手，与 <b>competitive programming<\/b> 的对比——后者提供问题描述以及充当契约的输入/输出示例，并要求模型在写代码之前推断出算法。贯穿本讲余下部分的分解方式：<b>coverage<\/b>（正确样本究竟是否存在？）与 <b>selection<\/b>（流水线能否识别出它？）。<\/p>","terms":["search","coverage","selection","competitive programming","autocomplete","deep research"]}},{"t":71,"figs":[{"t":125,"file":"slides/part07/slide_004.jpg"},{"t":149,"file":"slides/part07/slide_005.jpg"},{"t":170,"file":"slides/part07/slide_007.jpg"}],"en":{"title":"AlphaCode setup and preview: end-to-end competitive programming","problem":"Line-level code completion succeeds at high rates, but solving a whole competitive-programming problem end-to-end fails badly.","why":"A competitive problem requires reading a long description, inferring the intended algorithm from the docstring, then producing a long solution, whereas completion only extends a pattern a programmer already framed.","how":"AlphaCode (roughly 2022) attacks the full problem; at release it ranked near the top 54% among participants across 10 contests, the first demonstration that an AI could generalize beyond narrow tasks and solve problems end-to-end.","detail":"<p>AlphaCode (roughly 2022) is presented as a strictly harder version of a coding agent. A completion model sees a line and extends it; a competitive-programming problem hands over a long description plus input/output pairs and asks for an end-to-end program, so the model must infer the intended algorithm before solving.<\/p><ul><li><b>Why the jump matters:<\/b> longer problem descriptions, longer solutions, and reasoning about the <i>approach<\/i> rather than extending a pattern a programmer already framed.<\/li><li><b>Preview of achievement:<\/b> at release AlphaCode ranked near the <b>top 54%<\/b> among contest participants across <b>10 contests<\/b> &mdash; the first demonstration that an AI could generalize beyond narrow tasks and solve problems end-to-end.<\/li><li><b>Benchmark contrast:<\/b> much harder than HumanEval, where the instruction already states exactly what to implement, so there is no need to reason about what it would take to solve the problem.<\/li><li><b>Setup:<\/b> the speaker then walks the pipeline block diagrams one by one.<\/li><\/ul>","terms":["AlphaCode","HumanEval","docstring","generalization","competitive programming","end-to-end"]},"zh":{"title":"AlphaCode 的设定与预览：端到端 competitive programming","problem":"行级代码补全有很高的成功率，但端到端地求解一整个 competitive programming 问题却表现很差。","why":"一道竞赛题需要阅读冗长的描述、从 docstring 推断出题者意图的算法，然后产出很长的解；而补全只是扩展一个程序员已经搭好框架的模式。","how":"AlphaCode（约 2022 年）直接攻取完整问题；发布时它在 10 场竞赛的参赛者中排名接近前 54%，首次展示了 AI 能够超越狭窄任务进行泛化并端到端求解问题。","detail":"<p>AlphaCode（约 2022 年）被呈现为编码 agent 的一个严格更难版本。补全模型看到一行并扩展它；competitive programming 问题则给出冗长的描述以及输入/输出对，要求一个端到端的程序，因此模型必须先推断出意图中的算法再求解。<\/p><ul><li><b>为何这一跃迁重要：<\/b>问题描述更长、解更长，并且要对<i>方法<\/i>进行推理，而不是扩展一个程序员已经搭好框架的模式。<\/li><li><b>成就预览：<\/b>发布时 AlphaCode 在 <b>10 场竞赛<\/b>的参赛者中排名接近 <b>前 54%<\/b> &mdash; 首次展示 AI 能够超越狭窄任务进行泛化并端到端求解问题。<\/li><li><b>基准对比：<\/b>比 HumanEval 难得多，后者指令已经明确说明了要实现什么，因此无需推理求解该问题需要做什么。<\/li><li><b>设定：<\/b>讲者随后逐一讲解流水线的框图。<\/li><\/ul>","terms":["AlphaCode","HumanEval","docstring","generalization","competitive programming","end-to-end"]}},{"t":228,"figs":[{"t":233,"file":"slides/part07/slide_038.jpg"},{"t":339,"file":"slides/part07/slide_018.jpg"}],"en":{"title":"AlphaCode pretraining: own model, masked-LM loss, 700 GB of GitHub","problem":"AlphaCode predates the practice of borrowing a frontier LLM, so the authors had to build and train their own model from scratch.","why":"The base model's quality sets the ceiling for coverage: you can only cluster and select from the space of programs it can actually generate.","how":"Pretrain an encoder-decoder model with masked-language-model loss and next-token prediction on roughly 700 GB of GitHub code plus CodeContests, a large corpus of competitive-programming problems and solutions.","detail":"<p>AlphaCode predates the practice of borrowing a frontier LLM, so the authors pretrained their own model. The slide walkthrough shows a <b>pre-training stage<\/b> producing a distribution to sample from, later replaced by a large language model in newer systems.<\/p><ul><li><b>Objective and data:<\/b> masked-language-model loss (with next-token prediction), pretrained on roughly <b>700 GB of GitHub<\/b> code plus <b>CodeContests<\/b>, a large corpus of competitive-programming problems and solutions.<\/li><li><b>Architecture:<\/b> an <b>encoder-decoder<\/b> model initially; decoder-only variants were tried in AlphaCode 2.<\/li><li><b>Why it matters:<\/b> the base model's quality sets the ceiling on <b>coverage<\/b> &mdash; you can only cluster and select from the space of programs it can actually generate.<\/li><li><b>Framing:<\/b> the earlier lectures' repeated sampling now happens at massive scale after this pretraining step.<\/li><\/ul>","terms":["pre-training","masked-language-model loss","GitHub","CodeContests","encoder-decoder","coverage"]},"zh":{"title":"AlphaCode 预训练：自有模型、masked-LM loss、700 GB 的 GitHub","problem":"AlphaCode 早于借用前沿 LLM 的实践，因此作者不得不从零构建并训练自己的模型。","why":"基座模型的质量为 coverage 设定了上限：你只能在它实际能生成的程序空间中进行聚类与选择。","how":"在约 700 GB 的 GitHub 代码加上 CodeContests（一个包含大量 competitive programming 问题与解的大型语料库）上，用 masked-language-model loss 和 next-token prediction 预训练一个 encoder-decoder 模型。","detail":"<p>AlphaCode 早于借用前沿 LLM 的实践，因此作者预训练了自己的模型。幻灯片讲解展示了一个<b>预训练阶段<\/b>，它产生一个可供采样的分布，在新系统中后来被大型语言模型取代。<\/p><ul><li><b>目标与数据：<\/b>masked-language-model loss（配合 next-token prediction），在约 <b>700 GB 的 GitHub<\/b> 代码加上 <b>CodeContests<\/b>（一个包含大量 competitive programming 问题与解的大型语料库）上预训练。<\/li><li><b>架构：<\/b>最初是一个 <b>encoder-decoder<\/b> 模型；AlphaCode 2 中尝试了 decoder-only 变体。<\/li><li><b>为何重要：<\/b>基座模型的质量为 <b>coverage<\/b> 设定了上限 &mdash; 你只能在它实际能生成的程序空间中进行聚类与选择。<\/li><li><b>定位：<\/b>前面几讲中的重复采样，在此预训练步骤之后以超大规模进行。<\/li><\/ul>","terms":["pre-training","masked-language-model loss","GitHub","CodeContests","encoder-decoder","coverage"]}},{"t":342,"figs":[{"t":349,"file":"slides/part07/slide_019.jpg"}],"en":{"title":"GOLD regularization, value conditioning, and decoder-only models","problem":"Next-token prediction treats low- and high-likelihood tokens uniformly, so fine-tuning can fail to concentrate probability on meaningful code patterns.","why":"For code, precision matters: spreading mass across superficial token patterns makes the searchable distribution worse, regardless of how much you sample.","how":"During fine-tuning, add the GOLD weighting term that up-weights higher-likelihood tokens and down-weights lower-likelihood ones, alongside value conditioning and prediction; AlphaCode started encoder-decoder and AlphaCode 2 used decoder-only models.","detail":"<p>Before massive sampling pays off, the fine-tuning objective must concentrate probability on meaningful code structure. Standard next-token prediction weights low- and high-likelihood tokens alike, which can spread mass across superficial patterns.<\/p><ul><li><b>GOLD regularization:<\/b> during fine-tuning they add a weighting term that assigns <b>higher weight to higher-likelihood tokens<\/b> and lower weight to lower-likelihood tokens, improving precision and pushing probability toward meaningful patterns in code.<\/li><li><b>Value conditioning and prediction:<\/b> an additional fine-tuning trick tied to the likelihood weighting; the speaker flags it as the key detail on this slide.<\/li><li><b>Architecture evolution:<\/b> AlphaCode started as an encoder-decoder and AlphaCode 2 experimented with <b>decoder-only<\/b> models.<\/li><li><b>Takeaway:<\/b> fine-tuning details, not just scale, determine how searchable the sample distribution is.<\/li><\/ul>","terms":["GOLD","value conditioning","next-token prediction","precision","decoder-only","fine-tuning"]},"zh":{"title":"GOLD 正则化、value conditioning 与 decoder-only 模型","problem":"next-token prediction 对低概率与高概率 token 一视同仁，因此 fine-tuning 可能无法把概率集中到有意义的代码模式上。","why":"对于代码而言，precision 很重要：把概率质量分散到表层的 token 模式上会使可搜索的分布变差，无论你采样多少。","how":"在 fine-tuning 期间，加入 GOLD 加权项，提高较高概率 token 的权重、降低较低概率 token 的权重，并配合 value conditioning 与 prediction；AlphaCode 起初为 encoder-decoder，AlphaCode 2 使用 decoder-only 模型。","detail":"<p>在大规模采样产生回报之前，fine-tuning 目标必须把概率集中到有意义的代码结构上。标准的 next-token prediction 对低概率与高概率 token 一视同仁，这会把概率质量分散到表层模式上。<\/p><ul><li><b>GOLD 正则化：<\/b>在 fine-tuning 期间加入一个加权项，<b>给较高概率的 token 更高权重<\/b>、给较低概率的 token 更低权重，从而提升 precision 并把概率推向代码中有意义的模式。<\/li><li><b>Value conditioning 与 prediction：<\/b>与似然加权相关的一项额外 fine-tuning 技巧；讲者把它标记为本页幻灯片上的关键细节。<\/li><li><b>架构演进：<\/b>AlphaCode 起初是 encoder-decoder，AlphaCode 2 试验了 <b>decoder-only<\/b> 模型。<\/li><li><b>要点：<\/b>决定样本分布可搜索程度的，是 fine-tuning 的细节，而不只是规模。<\/li><\/ul>","terms":["GOLD","value conditioning","next-token prediction","precision","decoder-only","fine-tuning"]}},{"t":398,"figs":[{"t":405,"file":"slides/part07/slide_022.jpg"}],"en":{"title":"Massive sampling: one million programs per problem","problem":"With a usable model, a single solution is still only one draw from a huge space; coverage demands many independent attempts.","why":"Diverse solutions are what make clustering and selection meaningful, and machines can afford sample volumes far beyond human iteration.","how":"Generate about 1 million diverse sample programs per question, split about half Python and half C++, randomizing problem tags and ratings in the prompt and sampling at high temperature.","detail":"<p>With a usable model, AlphaCode performs <b>large-scale sampling<\/b> &mdash; a much bigger version of the repeated sampling covered earlier in the course.<\/p><ul><li><b>Scale:<\/b> about <b>1 million diverse sample programs per question<\/b>, split roughly half Python and half C++.<\/li><li><b>Forcing diversity:<\/b> the prompt randomizes the problem tags and ratings, and sampling uses a <b>high temperature<\/b>, so solutions differ rather than collapsing to one pattern.<\/li><li><b>Why machines can afford it:<\/b> the instructor notes this volume is feasible for machines even though it is far beyond human iteration.<\/li><li><b>New stage versus prior lectures:<\/b> unlike simply closing the loop by running tests, AlphaCode adds a <b>selection stage before<\/b> execution and evaluation, deciding which samples to even test.<\/li><\/ul>","terms":["large scale sampling","temperature","diversity","sample budget","tags and ratings"]},"zh":{"title":"大规模采样：每个问题一百万程序","problem":"有了可用的模型后，单个解仍然只是从一个巨大空间中的一次抽样；coverage 要求许多独立的尝试。","why":"多样化的解才使聚类与选择有意义，而机器能够负担远超人类迭代量的样本规模。","how":"为每个问题生成约 100 万个多样的样本程序，大致一半 Python、一半 C++，在 prompt 中随机化问题 tags 与 ratings，并以高 temperature 采样。","detail":"<p>有了可用的模型后，AlphaCode 执行<b>大规模采样<\/b> &mdash; 这是课程早先讲过的重复采样的大得多的版本。<\/p><ul><li><b>规模：<\/b>每个问题约 <b>100 万个多样的样本程序<\/b>，大致一半 Python、一半 C++。<\/li><li><b>强制多样性：<\/b>prompt 随机化问题的 tags 与 ratings，采样使用<b>高 temperature<\/b>，因此各个解彼此不同，而不会坍缩到同一种模式。<\/li><li><b>为何机器负担得起：<\/b>讲师指出，这一体量对机器而言是可行的，尽管它远超人类迭代量。<\/li><li><b>相较于前面几讲的新阶段：<\/b>与单纯通过运行测试来闭环不同，AlphaCode 在评估与执行之前增加了<b>选择阶段<\/b>，决定哪些样本才值得测试。<\/li><\/ul>","terms":["large scale sampling","temperature","diversity","sample budget","tags and ratings"]}},{"t":442,"figs":[{"t":447,"file":"slides/part07/slide_024.jpg"}],"en":{"title":"Filtering and semantic clustering before submission","problem":"The judge accepts only a handful of programs, and most of the million samples are wrong or are syntactic copies of the same idea.","why":"Many programs are semantically equivalent, so resubmitting near-duplicates wastes the few allowed slots; the pipeline needs a notion of behavioral difference, not textual difference.","how":"Filter to samples that pass the example tests in the problem statement, then cluster syntactically different but semantically equivalent programs using a separately trained test-input generation model that predicts new inputs from problem descriptions.","detail":"<p>Raw samples must be curated because the judge accepts only a handful of submissions.<\/p><ul><li><b>Filtering:<\/b> keep only samples that pass the example tests given in the problem statement, discarding the rest.<\/li><li><b>Clustering by semantics:<\/b> group programs that are syntactically different but <b>semantically equivalent<\/b>. A separate, trained <b>test-input generation model<\/b> predicts new test inputs from problem descriptions and runs candidates on them to expose behavioral differences, including on unseen problems.<\/li><li><b>Why clustering is the crux:<\/b> it selects a set of solutions <b>diverse enough<\/b> to be worth evaluating, since only a small subset of the roughly 10 allowed submissions can go to the platform.<\/li><li><b>Link to coverage/selection:<\/b> enough samples may contain a correct program, but finding and distinguishing it is a separate, harder problem.<\/li><\/ul>","terms":["filtering","clustering","semantic equivalence","test-input generation model","submissions","diversity"]},"zh":{"title":"提交前的筛选与语义聚类","problem":"评测系统只接受极少数程序，而那一百万样本中大多数要么是错的，要么是同一想法的语法副本。","why":"许多程序在语义上等价，因此重复提交近乎相同的程序会浪费为数不多的名额；流水线需要的是行为差异的概念，而非文本差异。","how":"先筛选出通过题面示例测试的样本，再用一个单独训练的 test-input generation model（从问题描述预测新的输入）对语法不同但语义等价的程序进行聚类。","detail":"<p>原始样本必须经过策展，因为评测系统只接受极少数提交。<\/p><ul><li><b>筛选：<\/b>只保留通过题面所给示例测试的样本，丢弃其余样本。<\/li><li><b>按语义聚类：<\/b>把语法不同但<b>语义等价<\/b>的程序归为一组。一个单独训练的 <b>test-input generation model<\/b> 从问题描述预测新的测试输入，并在这些输入上运行候选程序以揭示行为差异，包括在未见过的问题上。<\/li><li><b>为何聚类是关键：<\/b>它选出一组<b>足够多样<\/b>、值得评估的解，因为允许提交到平台的约 10 个提交中只有一小部分能用上。<\/li><li><b>与 coverage/selection 的联系：<\/b>足够多的样本中可能含有正确程序，但找到并区分出它是个独立的、更难的问题。<\/li><\/ul>","terms":["filtering","clustering","semantic equivalence","test-input generation model","submissions","diversity"]}},{"t":501,"figs":[{"t":502,"file":"slides/part07/slide_028.jpg"},{"t":585,"file":"slides/part07/slide_029.jpg"}],"en":{"title":"Codeforces evaluation and the first live results","problem":"The pipeline needs a real-world signal of correctness and a fair comparison against human programmers.","why":"Codeforces checks correctness and benchmarks against other performers, and the held-out CodeContests test set gives a measurable signal independent of the live judge.","how":"Submit only the curated subset (about 10 programs per problem) to 10 competitions with roughly 5,000 participants each; the result was an average ranking of about 54.3, competitive with about 28% of contestants active in the last six months.","detail":"<p>The curated candidates are submitted to <b>Codeforces<\/b>, the competition platform, which checks correctness and benchmarks against other performers.<\/p><ul><li><b>Constraint:<\/b> the full 1M samples cannot be submitted, so the earlier filtering and clustering is what makes submission possible.<\/li><li><b>Held-out signal:<\/b> evaluation on <b>CodeContests<\/b> uses a held-out test set the authors constructed, giving a measurable signal beyond the live judge.<\/li><li><b>Live setup:<\/b> the model ran live in <b>10 competitions each with about 5,000 participants<\/b>, using roughly <b>10 submissions per problem<\/b>.<\/li><li><b>Headline results:<\/b> an average ranking of about <b>54.3<\/b> and competitiveness with about <b>28%<\/b> of contestants active over the last six months; ranking reflects both <b>correctness and efficiency<\/b> of a submitted solution.<\/li><\/ul>","terms":["Codeforces","CodeContests","average ranking","percentile","efficiency","held-out test set"]},"zh":{"title":"Codeforces 评估与首批现场结果","problem":"流水线需要一个真实世界中的正确性信号，以及与人类程序员公平的比较。","why":"Codeforces 检验正确性并与其他参赛者进行基准比较，而留出的 CodeContests 测试集提供了独立于现场评测系统的可度量信号。","how":"只把策展后的子集（每个问题约 10 个程序）提交到 10 场竞赛，每场约 5,000 名参赛者；结果平均排名约为 54.3，与过去六个月活跃的约 28% 参赛者具有竞争性。","detail":"<p>策展后的候选被提交到 <b>Codeforces<\/b> 这一竞赛平台，它检验正确性并与其他参赛者进行基准比较。<\/p><ul><li><b>约束：<\/b>全部 100 万样本无法提交，因此正是先前的筛选与聚类使提交成为可能。<\/li><li><b>留出信号：<\/b>在 <b>CodeContests<\/b> 上的评估使用作者构建的留出测试集，提供了独立于现场评测系统的可度量信号。<\/li><li><b>现场设置：<\/b>模型现场参加了 <b>10 场竞赛，每场约 5,000 名参赛者<\/b>，每个问题使用约 <b>10 次提交<\/b>。<\/li><li><b>头条结果：<\/b>平均排名约 <b>54.3<\/b>，与过去六个月活跃的约 <b>28%<\/b> 参赛者具有竞争性；排名同时反映提交解的<b>正确性与效率<\/b>。<\/li><\/ul>","terms":["Codeforces","CodeContests","average ranking","percentile","efficiency","held-out test set"]}},{"t":626,"figs":[{"t":629,"file":"slides/part07/slide_045.jpg"}],"en":{"title":"Class Q&A: explaining cross-contest variance","problem":"AlphaCode's performance swings widely across contests, from near the top to roughly the 90th percentile, which makes reliability hard to characterize.","why":"Two distinct causes are plausible: how in-distribution the contest problems are, and whether the selection stage can pick the right candidate.","how":"The instructor throws the question back to the class and isolates two hypotheses: problem in-distributionness (coverage) and a selection bottleneck where many candidates are almost, but not completely, correct.","detail":"<p>A student asks why per-contest performance varies so widely, from near the top to roughly the 90th percentile. The instructor throws the question back, asking where the variance could come from in the pipeline.<\/p><ul><li><b>Hypothesis 1 &mdash; in-distributionness:<\/b> contests whose problems resemble training problems fare well, while contests introducing a new algorithm or a new problem style are harder; how close the inputs are to the training distribution drives coverage.<\/li><li><b>Hypothesis 2 &mdash; selection bottleneck:<\/b> even with large-scale sampling, the ability to <b>select the right candidates<\/b> varies by contest; there can be solutions that are <b>almost correct but not completely correct<\/b>, making ranking hard.<\/li><li><b>Conclusion:<\/b> both factors jointly determine where the system succeeds and where it struggles, cleanly separating the coverage question from the selection question.<\/li><\/ul>","terms":["in-distribution","selection bottleneck","coverage","variance","ranking"]},"zh":{"title":"课堂问答：解释跨竞赛的方差","problem":"AlphaCode 的表现在不同竞赛间波动很大，从接近榜首到大约第 90 百分位，这使得可靠性难以刻画。","why":"有两种不同的可能原因：竞赛问题的 in-distribution 程度，以及选择阶段能否挑出正确的候选。","how":"讲师把问题抛回给班级，并分离出两个假设：问题的 in-distribution 程度（coverage），以及一个 selection bottleneck——许多候选几乎正确但并不完全正确。","detail":"<p>一名学生问，为什么每场竞赛的表现波动如此之大，从接近榜首到大约第 90 百分位。讲师把问题抛回给班级，问方差可能来自流水线的哪个环节。<\/p><ul><li><b>假设 1 &mdash; in-distribution 程度：<\/b>问题与训练问题相似的竞赛表现良好，而引入新算法或新问题风格的竞赛更难；输入与训练分布的接近程度驱动着 coverage。<\/li><li><b>假设 2 &mdash; selection bottleneck：<\/b>即使有大规模采样，<b>选出正确候选<\/b>的能力也因竞赛而异；可能存在<b>几乎正确但并不完全正确<\/b>的解，使排名变得困难。<\/li><li><b>结论：<\/b>两个因素共同决定系统在哪里成功、在哪里挣扎，清晰地把 coverage 问题与 selection 问题分开。<\/li><\/ul>","terms":["in-distribution","selection bottleneck","coverage","variance","ranking"]}},{"t":820,"figs":[{"t":953,"file":"slides/part07/slide_048.jpg"}],"en":{"title":"pass@k versus 10@k: separating coverage from selection","problem":"It is unclear how much accuracy the selection stage costs relative to simply having a correct sample present, and whether sampling-scale gains survive filtering.","why":"pass@k submits all k samples and therefore measures coverage, while 10@k submits only 10 of k and so additionally tests the filtering and scoring process.","how":"Measure 10@k at budgets of 1K, 10K, 100K, and 1M samples on validation and test sets for 9B, 41B, and 41B-plus-clustering models; improvement is consistent, and larger models plus clustering are reliably best.","detail":"<p>Two metrics isolate the two failure modes:<\/p><ul><li><b>pass@k<\/b> &mdash; generate k samples and submit all of them to hidden tests; it measures how good the <b>search aspect<\/b> of sampling is, i.e. <b>coverage<\/b> (unlimited attempts).<\/li><li><b>10@k<\/b> &mdash; generate k samples but submit only <b>10<\/b>, so it additionally measures the <b>filtering and scoring<\/b> process.<\/li><\/ul><p>They report 10@1K, 10@10K, 10@100K, and 10@1M on validation and test sets for a <b>9B<\/b> model, a <b>41B<\/b> model, and <b>41B + clustering<\/b>. Larger models consistently beat smaller ones, and increasing the sample budget consistently helps; <b>41B + clustering is consistently best<\/b>. The speaker stresses that this matches earlier pass@k versus sample-budget results, and that a larger model extracts more from each additional sample.<\/p>","terms":["pass@k","10@k","coverage","selection","clustering","model size"]},"zh":{"title":"pass@k 与 10@k：分离 coverage 与 selection","problem":"目前不清楚：相对于仅仅让正确样本存在，选择阶段损失了多少准确率，以及采样规模的收益能否在筛选后依然保持。","why":"pass@k 提交全部 k 个样本，因此度量的是 coverage；而 10@k 只提交 k 个中的 10 个，因而还检验了筛选与打分过程。","how":"在验证集与测试集上，针对 9B、41B 以及 41B-plus-clustering 模型，在 1K、10K、100K、1M 样本预算下度量 10@k；改进是一致的，更大的模型加聚类稳定地最好。","detail":"<p>两个指标分别隔离出两种失败模式：<\/p><ul><li><b>pass@k<\/b> &mdash; 生成 k 个样本并把它们全部提交到隐藏测试；它度量采样的<b>搜索方面<\/b>有多好，即 <b>coverage<\/b>（无限次尝试）。<\/li><li><b>10@k<\/b> &mdash; 生成 k 个样本但只提交 <b>10<\/b> 个，因此它还度量<b>筛选与打分<\/b>过程。<\/li><\/ul><p>他们报告了在验证集与测试集上，针对 <b>9B<\/b> 模型、<b>41B<\/b> 模型以及 <b>41B + clustering<\/b> 的 10@1K、10@10K、10@100K 和 10@1M。更大的模型持续胜过更小的模型，增加样本预算也持续有帮助；<b>41B + clustering 稳定地最好<\/b>。讲者强调，这与早先 pass@k 与样本预算的结果一致，并且更大的模型能从每个额外样本中提取更多。<\/p>","terms":["pass@k","10@k","coverage","selection","clustering","model size"]}},{"t":1062,"figs":[{"t":1092,"file":"slides/part07/slide_056.jpg"}],"en":{"title":"Log-linear scaling and the selection saturation gap","problem":"It is not obvious whether the log-linear sampling trend survives the selection stage, or what ultimately caps performance.","why":"If diversity keeps increasing, more samples should keep helping; but a hard cap on submissions means selection can dominate the result.","how":"Plot solve rate against sampling budget: the log-linear trend holds even after selection, larger models have steeper slopes, clustering raises the level, but 10 submissions saturate near 30% versus above 40% for unlimited pass@k.","detail":"<p>The key claim is that the <b>log-linear<\/b> relationship between solve rate and sampling budget survives the selection stage: solve rate still rises log-linearly with the sample budget, and larger models have <b>steeper slopes<\/b> than a 300M-parameter baseline (the 41B curve versus the small model).<\/p><ul><li><b>Selection is a real bottleneck:<\/b> with only 10 submissions, accuracy saturates near <b>30%<\/b>, whereas pass@k with unlimited attempts reaches above <b>40%<\/b>, isolating the gap attributable to filtering and clustering.<\/li><li><b>Why clustering helps:<\/b> competitive problems are hard, so resubmitting near-duplicates wastes the few slots; submitting a <b>diverse set<\/b> is what buys accuracy.<\/li><li><b>Diversity caveat:<\/b> sampling more only helps if the model actually produces more diverse solutions; if ten times the samples add no new solution classes, performance does not improve.<\/li><\/ul>","terms":["log-linear","saturation","selection bottleneck","steepness","diversity","unlimited attempts"]},"zh":{"title":"对数线性 scaling 与 selection 饱和差距","problem":"log-linear 采样趋势能否在 selection 阶段后保持，以及究竟是什么最终限制了性能，这些都并不显然。","why":"如果 diversity 持续增加，更多样本就应该持续有帮助；但提交数量的硬性上限意味着 selection 可能主导结果。","how":"把 solve rate 对采样预算作曲线：即使在 selection 之后 log-linear 趋势依然成立，更大的模型斜率更陡，clustering 提高了整体水平，但 10 次提交在接近 30% 处饱和，而无限制 pass@k 则超过 40%。","detail":"<p>核心论断是：solve rate 与采样预算之间的 <b>log-linear<\/b> 关系在 selection 阶段后依然成立 &mdash; solve rate 仍随样本预算对数线性上升，且更大的模型比 300M 参数的基线有<b>更陡的斜率<\/b>（41B 曲线对小型模型）。<\/p><ul><li><b>Selection 是真正的瓶颈：<\/b>只有 10 次提交时，准确率在接近 <b>30%<\/b> 处饱和，而无限制尝试的 pass@k 达到 <b>40%<\/b> 以上，从而隔离出可归因于筛选与聚类的差距。<\/li><li><b>为何聚类有帮助：<\/b>竞赛题很难，因此重复提交近乎相同的程序会浪费为数不多的名额；提交一个<b>多样化集合<\/b>才是换来准确率的关键。<\/li><li><b>Diversity 的注意事项：<\/b>采样更多只有在模型确实产出更多样化解时才有帮助；如果十倍的样本没有带来新的解类别，性能就不会提升。<\/li><\/ul>","terms":["log-linear","saturation","selection bottleneck","steepness","diversity","unlimited attempts"]}},{"t":1161,"figs":[],"en":{"title":"Q&A: extrapolation, capability gaps, diversity, and theory","problem":"A student asks whether extrapolating the log-linear trend by another factor of ten would simply double the score.","why":"Extrapolation assumes diversity keeps increasing and ignores a capability gap: weak base models hit limits, so the trend cannot be pushed without bound.","how":"The instructor redirects to AlphaCode 2, arguing that making the base model better is easier than scaling samples, that clustering exists precisely to find diverse solutions, and that the log-linear form is theoretically derivable.","detail":"<p>A student asks whether extrapolating the log-linear trend &mdash; roughly another factor of ten &mdash; would double the score. The instructor redirects to AlphaCode 2, arguing that <b>making the base model better is an easier axis than scaling samples indefinitely<\/b>, and that any extrapolation must confront cost.<\/p><ul><li><b>Capability gap:<\/b> if base models are not strong enough they hit limits at some point; the deeper goal is building a system that reasons and closes the loop, then distilling that into one large reasoning model.<\/li><li><b>Diversity assumption:<\/b> the plan to simply pour on more samples assumes diversity keeps increasing; clustering exists to find the diverse set, and more samples that add no new solution classes do not help.<\/li><li><b>Theory:<\/b> the pass@k versus sample-budget relationship is theoretically derivable, referenced as the <i>Large Language Monkeys<\/i> paper and follow-ups, which is why the log-linear form is expected rather than surprising.<\/li><\/ul>","terms":["extrapolation","capability gap","diversity","Large Language Monkeys","distillation","log-linear"]},"zh":{"title":"问答：外推、能力差距、diversity 与理论","problem":"一名学生问，把 log-linear 趋势再外推十倍是否就会让得分翻倍。","why":"外推假设 diversity 持续增加，并忽略了 capability gap：弱基座模型会触到极限，因此这一趋势不能被无界地推进。","how":"讲师把话题转向 AlphaCode 2，主张把基座模型做得更好比扩大采样更容易，聚类的存在正是为了找到多样化的解，并且 log-linear 形式在理论上可以推导出来。","detail":"<p>一名学生问，把 log-linear 趋势再外推 &mdash; 大约又是一个十倍 &mdash; 是否会让得分翻倍。讲师把话题转向 AlphaCode 2，
