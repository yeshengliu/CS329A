采样加上自动验证器，使较弱的开源模型能够超越前沿闭源模型——并推导出一条推理扩展定律：覆盖率随样本数量呈幂律关系，仅在任务分布具有长尾难题时成立。随后课程分离出生成-验证差距：多数投票与奖励模型选择器的表现远低于 oracle 覆盖率，且该差距在更难的数据上进一步扩大。在综述了验证机制（形式化证明、单元测试、编译器）并对开放方向进行课堂讨论之后，课程讲解了 Scaling Test-Time Compute Optimally 论文——并行采样 vs 顺序修订、ORM vs PRM、PRM 引导的束搜索，以及按难度分桶的算力分配。最后以 Archon/ITAS 收尾，它在模型组合与基于提示的推理算子（generation、fusion、critic、ranker、verifier、unit tests）之上进行搜索，在推理调用预算约束下最大化 pass@1，以平均 +14.1% 的成绩用开源模型追平闭源前沿模型。"},"sections":[{"t":5,"figs":[{"t":22,"file":"slides/part02/slide_003.jpg"}],"en":{"title":"Three Stages of LLM Development and the Inference Axis","problem":"Historically a model's capability is frozen once pre-training ends: inference is a single low-compute round-trip between query and model, so the only route to a smarter system is another very expensive training run.","why":"Capability is baked into the parameters, and the old serving regime spent almost nothing per call, so there was no per-query lever that could trade compute for accuracy.","how":"Treat inference (test-time) compute as a first-class scaling axis: spend more compute at generation time to make the same frozen model more useful, without changing parameters and without any fine-tuning.","detail":"<p>The lecture frames LLM development as <b>three stages<\/b>: <b>pre-training<\/b> (historically months of many GPUs over trillions of data tokens — the dominant cost), <b>fine-tuning<\/b> (orders of magnitude less data than pre-training), and <b>inference<\/b>, where the model is actually used.<\/p><ul><li>Old regime: a near-zero-cost, single back-and-forth between user query and model; almost nothing spent per call.<\/li><li>New regime: allocate substantial per-query compute and convert it into higher answer quality, and this compute can run <b>offline<\/b>.<\/li><li>Hard constraint: the parameters stay fixed — no weight updates, no fine-tuning — only the procedure wrapped around the frozen model changes.<\/li><li>Why it matters: this is an axis orthogonal to parameters and data, and unlike pre-training it is available to anyone with API access rather than only labs that can afford a frontier run.<\/li><\/ul>","terms":["pre-training","fine-tuning","inference","test-time compute"]},"zh":{"title":"LLM 开发的三个阶段与推理维度","problem":"从历史上看，模型的能力在预训练结束后就被冻结：推理只是查询与模型之间一次低算力的往返，因此让系统变得更聪明的唯一途径就是再进行一次极其昂贵的训练。","why":"能力被固化在参数之中，而旧有的服务模式在每次调用上几乎不花费任何算力，因此不存在任何能够以算力换取准确率的按查询调节杠杆。","how":"将推理（测试时）算力视为一等的扩展维度：在生成时投入更多算力，使同一个冻结的模型变得更有用，既不改变参数也不做任何微调。","detail":"<p>本讲将 LLM 开发划分为<b>三个阶段<\/b>：<b>预训练<\/b>（历史上需要大量 GPU 运行数月、处理数万亿数据 token——是主要的成本来源）、<b>微调<\/b>（数据量比预训练少几个数量级），以及<b>推理<\/b>，即模型真正被使用的地方。<\/p><ul><li>旧模式：用户查询与模型之间近乎零成本的单次往返；每次调用几乎不花费任何算力。<\/li><li>新模式：为每次查询分配可观的算力并将其转化为更高的答案质量，而且这部分算力可以<b>离线<\/b>运行。<\/li><li>硬约束：参数保持固定——不更新权重，不做微调——改变的只是包裹在冻结模型外部的流程。<\/li><li>为何重要：这是一个与参数和数据正交的维度，且与预训练不同，它并非只有能负担前沿训练的实验机构才可用，任何拥有 API 访问权限的人都可用。<\/li><\/ul>","terms":["pre-training","fine-tuning","inference","test-time compute"]}},{"t":72,"figs":[{"t":74,"file":"slides/part02/slide_047.jpg"},{"t":78,"file":"slides/part02/slide_009.jpg"},{"t":122,"file":"slides/part02/slide_010.jpg"}],"en":{"title":"Large Language Monkeys: Repeated Sampling Plus a Verifier","problem":"One-shot generation badly under-reports model ability: on hard math, coding, and question answering, smaller open models look far behind frontier proprietary models.","why":"Generation is stochastic and high-variance — a correct trajectory is just one draw among many — so a single attempt exposes only one sample of the model's distribution and hides answers the model can actually produce.","how":"Repeatedly sample the same input (10, 100, up to 1000+ times) and apply a verifier to pick a correct candidate, converting latent, rare success into system-level accuracy.","detail":"<p>Invoking the <b>infinite monkey theorem<\/b>, the <b>Large Language Monkeys<\/b> paradigm samples the same problem many times and uses a <b>verifier<\/b> to select a correct response. The speaker's framing is that the models already know the answers to these hard problems and repeated sampling merely <b>elicits and surfaces<\/b> them — they just do not reveal the answer on the first trial.<\/p><ul><li>Result: <b>Llama 3 8B/70B<\/b>, clearly inferior to <b>GPT-4o<\/b> at a single attempt, can become better than GPT-4o and other larger proprietary models after enough samples.<\/li><li>The effect is demonstrated across hard math, coding, and question-answering problems.<\/li><li>Mechanism: sample k candidates, let the verifier identify which one is correct, and return that as the system output.<\/li><li>Failure mode: everything hinges on having an automated verifier; without one there is no way to know which candidate is correct.<\/li><\/ul>","terms":["Large Language Monkeys","repeated sampling","verifier","elicitation","pass@k"]},"zh":{"title":"Large Language Monkeys：重复采样加验证器","problem":"单次生成严重低估了模型的能力：在困难的数学、代码和问答任务上，较小的开源模型看起来远远落后于前沿闭源模型。","why":"生成是随机的且方差很高——一条正确的轨迹只是众多抽样中的一个样本——因此单次尝试只暴露了模型分布中的一个样本，掩藏了模型实际上能够产生的答案。","how":"对同一输入反复采样（10 次、100 次，最多 1000 次以上），并应用验证器挑选出正确的候选，将潜在的、稀有的成功转化为系统级的准确率。","detail":"<p>借用<b>无限猴子定理<\/b>，<b>Large Language Monkeys<\/b> 范式对同一问题多次采样，并使用<b>验证器<\/b>选出正确的回答。讲者的表述是：模型其实已经知道这些难题的答案，重复采样只是<b>引出并显现<\/b>它们——它们只是在第一次尝试时没有给出答案。<\/p><ul><li>结果：<b>Llama 3 8B/70B<\/b> 在单次尝试时明显不如 <b>GPT-4o<\/b>，但在采样足够多次之后可以变得比 GPT-4o 及其他更大的闭源模型更好。<\/li><li>该效应在困难的数学、代码和问答问题上均得到验证。<\/li><li>机制：采样 k 个候选，让验证器识别出哪一个是正确的，并将其作为系统输出返回。<\/li><li>失效模式：一切都取决于是否拥有自动验证器；没有它就无法知道哪个候选是正确的。<\/li><\/ul>","terms":["Large Language Monkeys","repeated sampling","verifier","elicitation","pass@k"]}},{"t":196,"figs":[{"t":241,"file":"slides/part02/slide_013.jpg"}],"en":{"title":"Cross-Domain Coverage and Automated Selection (SWE-bench)","problem":"It is unclear whether repeated sampling generalizes beyond math, and whether the generate-then-select loop can be fully automated end to end.","why":"If the paradigm only helps on benchmarks with hand-built answer extraction, it is not a general capability lever; the interesting case is when selection is also automated.","how":"Plot coverage — the fraction of problems solved by at least one of k samples — against the number of samples from 1 to 1000, across domains including agentic software-engineering benchmarks.","detail":"<p>The paradigm is reported to work across essentially any domain tried, including agentic benchmarks such as <b>SWE-bench<\/b>, which mimics how a software engineer edits code and creates new patches.<\/p><ul><li>The x-axis is the number of samples (1 to 1000); the y-axis is <b>coverage<\/b>, the fraction of problems solved by at least one sample.<\/li><li>Concrete result: <b>DeepSeek V3<\/b> outperforms <b>Claude 3.5<\/b> and <b>o1-preview<\/b> after ~1000 samples on coding and software-engineering problems.<\/li><li>The key enabler is that coding problems come with <b>unit tests<\/b>: if the tests can select which sample is correct, the entire pipeline is automated.<\/li><li>Consequence: a cheap open-source model can be turned into a more capable system without any weight changes — an end-to-end automated way to create a stronger model out of a weaker one.<\/li><\/ul>","terms":["coverage","SWE-bench","DeepSeek V3","unit tests","agentic benchmarks"]},"zh":{"title":"跨领域覆盖率与自动选择（SWE-bench）","problem":"尚不清楚重复采样是否能推广到数学之外，以及“先生成再选择”的循环能否端到端地完全自动化。","why":"如果该范式只在带有手工构建答案抽取的基准上有效，它就不是一种通用的能力杠杆；真正有趣的情形是选择过程也实现自动化。","how":"将覆盖率——至少被 k 个样本之一解决的问题比例——对样本数量（从 1 到 1000）作图，覆盖包括 agentic 软件工程基准在内的多个领域。","detail":"<p>据报道，该范式在几乎所有尝试过的领域中都有效，包括诸如 <b>SWE-bench<\/b> 这样的 agentic 基准，它模拟软件工程师编辑代码并创建新补丁的过程。<\/p><ul><li>x 轴是样本数量（1 到 1000）；y 轴是<b>覆盖率<\/b>，即至少被一个样本解决的问题比例。<\/li><li>具体结果：在代码和软件工程问题上，<b>DeepSeek V3<\/b> 在约 1000 个样本后超越 <b>Claude 3.5<\/b> 和 <b>o1-preview<\/b>。<\/li><li>关键的使能因素是代码问题自带<b>单元测试<\/b>：如果测试能够选出哪个样本是正确的，整条流水线就实现了自动化。<\/li><li>结果：无需任何权重改动，就能把一个廉价的开源模型变成一个能力更强的系统——一种端到端自动地从较弱模型打造出更强模型的方式。<\/li><\/ul>","terms":["coverage","SWE-bench","DeepSeek V3","unit tests","agentic benchmarks"]}},{"t":283,"figs":[{"t":302,"file":"slides/part02/slide_015.jpg"},{"t":339,"file":"slides/part02/slide_018.jpg"},{"t":431,"file":"slides/part02/slide_019.jpg"}],"en":{"title":"An Inference Scaling Law: Coverage vs Number of Samples","problem":"Pre-training has scaling laws that predictably map data, compute, and parameters to test loss, but there was no analogous predictive theory for how test-time compute buys accuracy.","why":"Without a quantitative relationship between samples drawn and problems solved, you cannot forecast how many samples a target coverage requires or how to budget inference resources.","how":"Define an inference/test-time scaling law: coverage as a function of the number of parallel samples follows an exponential power law, with coefficients fitted from the model's observed scaling behavior.","detail":"<p>The lecture reuses the pre-training scaling-law template — equations that may change with setup but give a predictable path from data/compute/parameters to test loss — and instantiates it for inference. Here the relationship is between <b>coverage<\/b> and the number of samples <b>k<\/b> drawn in parallel, and it follows an <b>exponential power law<\/b> with fitted coefficients (call them <code>A<\/code> and <code>B<\/code>).<\/p><ul><li>Validated across a range of models and parameter sizes — <b>Llama 3 8B/70B, Gemma, Pythia<\/b> — from <b>70M up to 70B parameters<\/b>, and across domains.<\/li><li>The predicted curve closely tracks measured coverage, so you can predict how many samples are needed to hit a target coverage and how much compute to allocate.<\/li><li>Surprising detail: even a <b>70M-parameter<\/b> model exhibits the same scaling behavior, not only large models.<\/li><li>Trade-off: the law describes potential (coverage) rather than realized accuracy of a deployable selector, whose quality is the separate bottleneck discussed next.<\/li><\/ul>","terms":["inference scaling law","coverage","power law","Llama 3","Gemma","Pythia"]},"zh":{"title":"一条推理扩展定律：覆盖率与样本数量的关系","problem":"预训练拥有可预测地将数据、算力与参数映射到测试损失的扩展定律，但对于测试时算力如何换取准确率，此前没有类似的可预测理论。","why":"若没有抽取样本数与解决问题数之间的定量关系，就无法预测达到目标覆盖率需要多少样本，也无法规划推理资源预算。","how":"定义一条推理/测试时扩展定律：覆盖率作为并行样本数量的函数服从指数幂律，其系数由观测到的模型扩展行为拟合得到。","detail":"<p>本讲复用了预训练扩展定律的模板——方程可能随设定变化，但给出了一条从数据/算力/参数到测试损失的可预测路径——并将其实例化到推理上。此处的关系是<b>覆盖率<\/b>与并行抽取的样本数 <b>k<\/b> 之间的关系，它服从带拟合系数的<b>指数幂律<\/b>（记为 <code>A<\/code> 和 <code>B<\/code>）。<\/p><ul><li>在多种模型与参数规模上得到验证——<b>Llama 3 8B/70B、Gemma、Pythia<\/b>——从 <b>70M 到 70B 参数<\/b>，且跨越多个领域。<\/li><li>预测曲线与实测覆盖率高度吻合，因此可以预测达到目标覆盖率需要多少样本，以及应分配多少算力。<\/li><li>令人惊讶的细节：即便是 <b>70M 参数<\/b>的模型也表现出相同的扩展行为，而不只是大模型。<\/li><li>权衡：该定律描述的是潜力（覆盖率），而非可部署选择器所实现的实际准确率，后者是接下来讨论的另一个独立瓶颈。<\/li><\/ul>","terms":["inference scaling law","coverage","power law","Llama 3","Gemma","Pythia"]}},{"t":453,"figs":[{"t":471,"file":"slides/part02/slide_021.jpg"}],"en":{"title":"Why a Power Law: Per-Problem pass@k and the Long-Tail Condition","problem":"The aggregate power law is counter-intuitive: for one problem pass@k grows exponentially and saturates, yet across a suite of problems the equation changes and a power law emerges.","why":"Aggregating per-problem exponentials with differing pass@1 does not trivially produce a clean power law; a specific distribution of per-problem difficulty is required.","how":"Derive pass@k = 1 - (1 - P)^k for a single problem, then identify the necessary and sufficient dataset-level condition — a long tail of hard problems — that yields the observed scaling.","detail":"<p>For a single problem with probability P of a correct response, the probability that <i>at least one<\/i> of k answers is correct is <code>1 - (1 - P)^k<\/code>: <code>(1 - P)<\/code> is the probability that all k are wrong, and one minus that is the probability that at least one is right.<\/p><ul><li>This per-problem curve is exponential and saturating, but across a suite of problems the individual equations differ, so the <b>aggregate<\/b> curve is a different object.<\/li><li>The paper asks what dataset-level property justifies the exponential/power-law scaling, and the answer is a <b>sufficient-and-necessary condition<\/b>: a <b>long tail of hard problems<\/b>.<\/li><li>Formally, the pass@1 distribution over problems must have a heavy tail of low but nonzero success probabilities for the aggregate power law to appear.<\/li><li>Trade-off: this makes the scaling law a property of the task distribution, not the model alone — the same model gives different curves on different datasets.<\/li><\/ul>","terms":["pass@k","pass@1","long tail of hard problems","power law","coverage"]},"zh":{"title":"为何是幂律：单题 pass@k 与长尾条件","problem":"聚合后的幂律反直觉：对于单个问题，pass@k 呈指数增长并饱和，然而在一组问题上方程会发生变化并涌现出幂律。","why":"将具有不同 pass@1 的单个问题指数曲线聚合起来，并不会简单地产生一条干净的幂律；这要求每道题的难度服从某种特定的分布。","how":"推导单个问题的 pass@k = 1 - (1 - P)^k，然后找出产生所观测扩展行为的数据集层面的充分必要条件——难题的长尾。","detail":"<p>对于单个问题，设单次正确回答的概率为 P，则 k 个答案中<i>至少有一个<\/i>正确的概率为 <code>1 - (1 - P)^k<\/code>：<code>(1 - P)<\/code> 是 k 个全都错误的概率，而 1 减去它就是至少一个正确的概率。<\/p><ul><li>这条单题曲线是指数且饱和的，但在一组问题上各个方程各不相同，因此<b>聚合<\/b>后的曲线是另一个对象。<\/li><li>论文追问：是什么数据集层面的性质支撑了这种指数/幂律扩展，答案是<b>充分必要条件<\/b>：<b>难题的长尾<\/b>。<\/li><li>形式上，问题上的 pass@1 分布必须具有低但非零成功概率的重尾，聚合幂律才会出现。<\/li><li>权衡：这使该扩展定律成为任务分布的性质，而非仅由模型决定——同一个模型在不同数据集上会给出不同的曲线。<\/li><\/ul>","terms":["pass@k","pass@1","long tail of hard problems","power law","coverage"]}},{"t":525,"figs":[{"t":561,"file":"slides/part02/slide_022.jpg"},{"t":618,"file":"slides/part02/slide_025.jpg"}],"en":{"title":"Empirical Evidence for the Long Tail","problem":"The long-tail condition is a mathematical requirement; it must be checked against real datasets, otherwise the scaling law is vacuous.","why":"If benchmark problems were uniformly difficult or uniformly easy, the aggregation would not produce the reported power-law behavior.","how":"Count how many problems are solved at pass@1 and at increasing sample counts, and inspect the distribution of per-problem pass@1 across a corpus.","detail":"<p>Empirically, the condition holds. Looking at the count of problems solved at pass@1 versus more and more samples, the picture is consistent across the tasks tried:<\/p><ul><li>A large portion of problems are <b>simple and solved in a single attempt<\/b>.<\/li><li>As complexity rises, pass@1 falls monotonically, leaving a long tail of problems that are rarely solved.<\/li><li>The resulting curve — high at simple problems, low and tapering at the hardest ones — is exactly the shape required to justify the observed power-law scaling.<\/li><li>This tail is also where repeated sampling pays off: those low-pass@1 problems are the ones where a correct answer appears only once or twice among thousands of samples.<\/li><li>Connection to later material: because the correct answers in the tail are so rare, any frequency-based selector cannot capture them, which motivates the generation-verification gap.<\/li><\/ul>","terms":["pass@1 distribution","long tail","coverage","difficulty"]},"zh":{"title":"长尾的经验证据","problem":"长尾条件是一个数学要求；必须用真实数据集加以检验，否则该扩展定律就是空洞的。","why":"如果基准问题难度均匀地难或均匀地易，聚合就不会产生所报道的幂律行为。","how":"统计在 pass@1 以及不断增加样本数时被解决的问题数量，并考察整个语料库中每题 pass@1 的分布。","detail":"<p>经验上，该条件成立。观察在 pass@1 与不断增加样本数下被解决的问题数量，所尝试的各项任务呈现出一致的图景：<\/p><ul><li>很大一部分问题是<b>简单的、单次尝试即可解决<\/b>的。<\/li><li>随着复杂度上升，pass@1 单调下降，留下一道很少被解决的难题长尾。<\/li><li>由此得到的曲线——在简单问题上很高、在最难问题上很低且逐渐收窄——正是支撑所观测幂律扩展所需的形状。<\/li><li>这道长尾也正是重复采样发挥作用之处：那些低 pass@1 的问题，正确答案在数千个样本中只出现一两次。<\/li><li>与后续内容的联系：由于长尾中的正确答案如此稀有，任何基于频率的选择器都无法捕捉到它们，这引出了生成-验证差距。<\/li><\/ul>","terms":["pass@1 distribution","long tail","coverage","difficulty"]}},{"t":684,"figs":[{"t":721,"file":"slides/part02/slide_026.jpg"}],"en":{"title":"Reallocating Compute from Pre-training to Inference","problem":"The historical spend profile — hundreds of millions to billions on pre-training, much less on fine-tuning, and almost nothing per inference call — was dictated by a paradigm where capability came only from training.","why":"Pre-training is a one-time capital expense baked into weights, while earlier serving treated inference as a cheap single round-trip, so there was no operational reason to spend there.","how":"Shift budget toward inference: spend heavily at test time, and crucially run that compute offline by releasing agents that keep generating tokens and improving answers.","detail":"<p>The speaker reframes the economics. Previously companies spent hundreds of millions to billions on <b>pre-training<\/b> alone, much less on fine-tuning, and almost nothing per inference call because each call was a one-time back-and-forth between query and model. The new paradigm lets you spend far more compute on inference and convert it into capability.<\/p><ul><li>Inference compute can be <b>offline<\/b>: you can release agents to go solve a problem and keep generating tokens, improving the quality of the answer they produce.<\/li><li>Because sampling parallelizes, the budget becomes a per-problem allocation decision rather than a fixed per-call cost.<\/li><li>Concrete tension the speaker raises: pre-training is paid <b>once<\/b>, but test-time scaling is paid <b>every time the model runs<\/b>, so any comparison is not one-to-one.<\/li><li>Strategic implication: this raises the question of whether pre-training is 'done', since a fixed model plus more samples can serve many tasks.<\/li><\/ul>","terms":["inference compute","offline inference","pre-training cost","token budget"]},"zh":{"title":"将算力从预训练重新分配到推理","problem":"历史上的支出结构——预训练花费数亿到数十亿、微调少得多、而每次推理调用几乎不花钱——是由一种能力只能来自训练的范式所决定的。","why":"预训练是一次性计入权重的资本支出，而早期服务将推理视为廉价的单次往返，因此没有运营上的理由在那里花钱。","how":"将预算向推理倾斜：在测试时大量投入，并且关键的是让这部分算力离线运行——释放 agent 持续生成 token 并改进答案。","detail":"<p>讲者重新诠释了经济学。此前公司在<b>预训练<\/b>上就要花费数亿到数十亿，微调少得多，而每次推理调用几乎不花钱，因为每次调用只是查询与模型之间的一次性往返。新范式让你可以在推理上花费多得多的算力，并将其转化为能力。<\/p><ul><li>推理算力可以<b>离线<\/b>：你可以释放 agent 去解决问题并持续生成 token，提升它们所产生答案的质量。<\/li><li>由于采样可以并行化，预算就变成了按问题的分配决策，而不是固定的每次调用成本。<\/li><li>讲者提出的具体张力：预训练是<b>一次<\/b>付费，而测试时扩展在<b>模型每次运行时<\/b>都要付费，因此任何比较都不是一对一的。<\/li><li>战略含义：这引出了预训练是否已经“完成”的问题，因为一个固定的模型加上更多样本就能服务许多任务。<\/li><\/ul>","terms":["inference compute","offline inference","pre-training cost","token budget"]}},{"t":739,"figs":[{"t":746,"file":"slides/part02/slide_028.jpg"},{"t":773,"file":"slides/part02/slide_038.jpg"}],"en":{"title":"The Need for Automated Verification: Proofs and Unit Tests","problem":"Repeated sampling produces many candidates but no ground truth; without a selector there is no way to know which sample is correct, so the whole method collapses.","why":"For most open-ended outputs correctness is hard to check directly; the loop only closes when a cheap, reliable, automated checker exists that can adjudicate candidate answers.","how":"Exploit domains where verification is much easier than generation: run formal proof checkers on math and execute unit tests on code, using them as the verifier in the generate-select loop.","detail":"<p>The lecture surveys domains with a cheap ground-truth check.<\/p><ul><li><b>Math<\/b>: for certain problem types you can use <b>formal proofs<\/b> — given a proof strategy, run it through formal-proof software that checks whether each step is correct.<\/li><li><b>Coding<\/b>: <b>unit tests<\/b>. The crucial asymmetry is that writing a unit test is arguably a much simpler task than writing the entire program that solves the problem, so tests can be written by humans and used as the verifier.<\/li><li>Automated verification is the precondition for the entire repeated-sampling pipeline; without it there is simply no answer to 'which one is correct?'.<\/li><li>Quality caveat: the verifier is only as good as its coverage. Unit tests that do not truly cover the code are an explicit failure mode, and even manual correctness checks (the speaker cites a high but not perfect rate on math) leave room for error.<\/li><\/ul>","terms":["automated verification","formal proofs","unit tests","verifier"]},"zh":{"title":"自动验证的必要性：证明与单元测试","problem":"重复采样产生许多候选，却没有真值；没有选择器就无法知道哪个样本是正确的，因此整个方法会崩塌。","why":"对于大多数开放式输出，直接检验正确性很困难；只有当存在一个廉价、可靠、自动的检查器能够裁定候选答案时，这个循环才能闭合。","how":"利用验证远比生成容易的领域：在数学上运行形式化证明检查器，在代码上执行单元测试，将它们用作生成-选择循环中的验证器。","detail":"<p>本讲综述了具有廉价真值检验的领域。<\/p><ul><li><b>数学<\/b>：对于某些问题类型，可以使用<b>形式化证明<\/b>——给定一个证明策略，将其送入形式化证明软件检查每一步是否正确。<\/li><li><b>代码<\/b>：<b>单元测试<\/b>。关键的不对称性在于，编写一个单元测试可以说比编写解决整个问题的程序要简单得多，因此测试可以由人来写并用作验证器。<\/li><li>自动验证是整个重复采样流水线的前提；没有它，就根本无法回答“哪一个是正确的？”这个问题。<\/li><li>质量告诫：验证器的好坏取决于其覆盖范围。未能真正覆盖代码的单元测试是一种明确的失效模式，即便是人工正确性检查（讲者提到数学上有一个高但并非完美的比率）也留有出错的余地。<\/li><\/ul>","terms":["automated verification","formal proofs","unit tests","verifier"]}},{"t":809,"figs":[{"t":862,"file":"slides/part02/slide_034.jpg"}],"en":{"title":"AI as a Compiler: CUDA Generation and Behavioral Equivalence","problem":"Verification is easy for math and coding, but there is a broader class of tasks where the correct output is expensive to define yet cheap to compare against a reference.","why":"When a task is a translation between languages, correctness reduces to behavioral equivalence — matching outputs on the same inputs — which is a perfect default verifier.","how":"Have an LLM generate low-level code (CUDA) from source code (PyTorch), then verify by comparing the two implementations' outputs for any given input; benchmark with KernelBench.","detail":"<p>This is one of the lab projects the speaker is most excited about. An LLM generates compiler-like low-level code such as <b>CUDA<\/b> for a source program such as <b>PyTorch<\/b>, and the reason it is verifiable is that you can always run both and compare outputs for any input.<\/p><ul><li><b>CUDA<\/b> is the lower-level, hardware-aware language used for optimized GPU code; the generated kernel must reproduce the reference semantics.<\/li><li>Benchmark: <b>KernelBench<\/b>, a dataset/benchmark for CUDA generation, shows the same coverage curve improving with the number of samples.<\/li><li>Because outputs are compared directly, there is effectively a <b>perfect verifier by default<\/b>, so no learned reward model is needed.<\/li><li>Generalization: the same idea covers any translation between two languages (e.g., porting Python or C++ to Java and back), where equivalence can be measured much more easily than the code can be written.<\/li><li>Trade-off: this only applies to semantics-preserving translation tasks, not open-ended generation.<\/li><\/ul>","terms":["AI as a compiler","CUDA","PyTorch","KernelBench","behavioral equivalence"]},"zh":{"title":"AI 作为编译器：CUDA 生成与行为等价性","problem":"对于数学和代码，验证很容易，但还有更广泛的一类任务，其正确输出很难定义，却很容易与参考实现进行比较。","why":"当任务是在两种语言之间做翻译时，正确性归结为行为等价性——在相同输入上输出一致——这正是一个完美的默认验证器。","how":"让 LLM 从源代码（PyTorch）生成底层代码（CUDA），然后通过比较两种实现对于任意给定输入的输出进行验证；使用 KernelBench 进行基准测试。","detail":"<p>这是讲者最兴奋的实验室项目之一。LLM 为诸如 <b>PyTorch<\/b> 的源程序生成类似编译器产出的底层代码，例如 <b>CUDA<\/b>，其可验证性在于你总是可以同时运行两者并比较任意输入下的输出。<\/p><ul><li><b>CUDA<\/b> 是用于优化 GPU 代码的、更底层且感知硬件的语言；生成的 kernel 必须复现参考语义。<\/li><li>基准：用于 CUDA 生成的 <b>KernelBench<\/b> 数据集/基准显示出同样的覆盖率曲线随样本数量增加而改善。<\/li><li>由于输出是被直接比较的，实际上默认就有一个<b>完美的验证器<\/b>，因此不需要学习式的奖励模型。<\/li><li>推广：同样的思路适用于任意两种语言之间的翻译（例如将 Python 或 C++ 移植到 Java 再移植回来），其中等价性远比编写代码本身更容易度量。<\/li><li>权衡：这仅适用于保持语义的翻译任务，而不适用于开放式生成。<\/li><\/ul>","terms":["AI as a compiler","CUDA","PyTorch","KernelBench","behavioral equivalence"]}},{"t":935,"figs":[{"t":964,"file":"slides/part02/slide_041.jpg"},{"t":1102,"file":"slides/part02/slide_043.jpg"},{"t":1162,"file":"slides/part02/slide_045.jpg"}],"en":{"title":"The Generation-Verification Gap","problem":"Many domains have no verifier, and there the best practical selectors — majority voting and model-based reward-model rankers — fall far short of the model's true coverage.","why":"On the hardest problems the correct answer appears only once, twice, or three times across thousands of samples, so any frequency-based or weak-scoring selector cannot surface it; generation is strong but verification is the bottleneck.","how":"Name and quantify the mismatch as the generation-verification gap — the distance between what practical selectors achieve and oracle coverage — and make shrinking it the research target.","detail":"<p>The lecture compares <b>majority voting<\/b> (pick the most frequent generated answer), a <b>reward-model<\/b> ranker (an LLM trained to score response quality, possibly combined with majority voting), and an oracle/perfect selector representing true coverage.<\/p><ul><li>Majority voting <b>plateaus after roughly 10-50 samples<\/b> and sits far below the oracle line; even LLM-based reward models leave a large gap.<\/li><li>The gap is <b>more pronounced on harder datasets<\/b>: MATH is harder and more complex than GSM8K, and the divergence is larger there.<\/li><li>Root cause: rare successes. Correct responses to the hardest problems may appear only once, twice, or three times across a thousand or ten thousand samples, so majority voting structurally cannot capture them.<\/li><li>On simpler data such as GSM8K, many answers are easy to generate and majority voting works for many problems — but even there the hardest items have low correct-answer frequency.<\/li><li>Implication: the model can generate good answers it cannot identify, so verification, not generation, is the limiting factor.<\/li><\/ul>","terms":["generation-verification gap","majority voting","reward model","oracle selector","best-of-n","MATH","GSM8K"]},"zh":{"title":"生成-验证差距","problem":"许多领域没有验证器，而在这些领域，最实用的选择器——多数投票和基于模型的奖励模型排序器——都远未达到模型的真实覆盖率。","why":"在最难的问题上，正确答案在数千个样本中只出现一两次或三次，因此任何基于频率的或评分较弱的选择器都无法将其显现；生成很强，但验证才是瓶颈。","how":"将这种不匹配命名并量化为生成-验证差距——实用选择器所达到的水平与 oracle 覆盖率之间的距离——并把缩小它作为研究目标。","detail":"<p>本讲比较了<b>多数投票<\/b>（选取出现最频繁的生成答案）、<b>奖励模型<\/b>排序器（一个被训练来给回答质量打分的 LLM，可能结合多数投票），以及代表真实覆盖率的 oracle/完美选择器。<\/p><ul><li>多数投票<b>在约 10-50 个样本后趋于平台<\/b>，且远低于 oracle 线；即使基于 LLM 的奖励模型也留下很大的差距。<\/li><li>该差距<b>在更难的数据集上更为明显<\/b>：MATH 比 GSM8K 更难、更复杂，那里的分叉更大。<\/li><li>根本原因：稀有的成功。对数最难题目的正确回答可能在 1000 甚至 10000 个样本中只出现一次、两次或三次，因此多数投票在结构上就无法捕捉到它们。<\/li><li>在诸如 GSM8K 这样较简单的数据上，许多答案都易于生成，多数投票对很多问题都有效——但即便在那里，最难的题目正确答案频率也很低。<\/li><li>含义：模型能够生成它自己无法识别的好答案，因此限制因素在于验证而非生成。<\/li><\/ul>","terms":["generation-verification gap","majority voting","reward model","oracle selector","best-of-n","MATH","GSM8K"]}},{"t":1163,"figs":[{"t":1162,"file":"slides/part02/slide_045.jpg"}],"en":{"title":"Class Discussion I: Verifier Quality and Hybrid RAG Off-Ramps","problem":"Having established repeated sampling and the generation-verification gap, the class probes what actually generalizes and where the open problems are.","why":"The practical value of test-time scaling is bounded by verifier quality and by whether cheaper selection signals exist in domains without clean checkers.","how":"Students consolidate takeaways — sample many answers, and make verifier quality the priority — and propose a knowledge-graph/RAG hybrid that falls back to retrieval when inference-time confidence is low.","detail":"<p>The first student takeaway is that sampling many answers helps, and that with a good verifier the gain is large; the second is that <b>the quality of the verifier is what really matters<\/b> for this approach.<\/p><ul><li>A student proposes a hybrid: build a <b>knowledge graph<\/b> plus an advanced retrieval-augmented generation (RAG) method, and decide between retrieval and model generation based on the accuracy/confidence of the inference-time score.<\/li><li>Motivation: reduce reliance on expensive sampling and increase answer <b>speed<\/b> while maintaining accuracy — use knowledge when it is reliable and fall back to generation/RAG when accuracy must be raised.<\/li><li>The professor confirms the direction (RAG helping the efficiency/time dimension) and notes the goal is to reduce the dependency on test-time compute to increase accuracy.<\/li><li>This sets up later suggestions that self-study, partial verifiers, and verifier ensembles can improve the pass@k-vs-k trend beyond raw repeated sampling.<\/li><\/ul>","terms":["verifier quality","RAG","knowledge graph","hybrid retrieval"]},"zh":{"title":"课堂讨论 I：验证器质量与混合 RAG 备用路径","problem":"在确立了重复采样和生成-验证差距之后，课堂探究了什么才真正具有泛化性，以及开放问题在哪里。","why":"测试时扩展的实际价值受限于验证器质量，以及在没有干净检查器的领域中是否存在更廉价的选择信号。","how":"学生总结收获——采样大量答案，并把验证器质量作为优先事项——并提出一种知识图谱/RAG 混合方案：当推理时置信度低时回退到检索。","detail":"<p>学生的第一个收获是：采样大量答案有帮助，而且拥有一个好的验证器时收益很大；第二个是<b>验证器的质量才是这种方法真正关键之处<\/b>。<\/p><ul><li>一位学生提出混合方案：构建<b>知识图谱<\/b>加上一种先进的检索增强生成（RAG）方法，并根据推理时分数的准确率/置信度在检索与模型生成之间做选择。<\/li><li>动机：在保持准确率的同时，减少对昂贵采样的依赖并提高答案<b>速度<\/b>——在知识可靠时使用知识，在必须提高准确率时回退到生成/RAG。<\/li><li>教授确认了这一方向（RAG 有助于效率/时间维度），并指出目标是减少对测试时算力的依赖以提高准确率。<\/li><li>这为后续建议做了铺垫：自学（self-study）、部分验证器和验证器集成可以改善 pass@k-vs-k 的趋势，超越单纯的重复采样。<\/li><\/ul>","terms":["verifier quality","RAG","knowledge graph","hybrid retrieval"]}},{"t":1416,"figs":[],"en":{"title":"Class Discussion II: Self-Study, Partial Verifiers, Ensembles, Coverage","problem":"Naive repeated sampling wastes budget and fails on hard problems, and in some domains verification is only partial — you can detect wrongness more easily than correctness.","why":"Pre-exploration may improve the sampling distribution; partial signals (reject-wrong) enable evolutionary search; and a single verifier is fragile, so ensembling helps but costs compute.","how":"Propose self-study/exploration before sampling, wrongness filters plus simulation/tool verifiers, weak-supervision verifier ensembles, and careful validation of what 'coverage' really means.","detail":"<p>Discussion points, in order:<\/p><ul><li>A <b>self-study<\/b> phase — let the model explore a domain and consolidate insights before sampling solutions — could produce better pass@k trends, and the professor confirms later material covers self-study search and tool use.<\/li><li>In hard domains it can be easy to detect that an answer is <b>wrong<\/b> even when confirming correctness is expensive; use that to <b>project out bad answers<\/b> and drive an evolutionary loop.<\/li><li>For physics/dynamics/robotics, a <b>simulation<\/b> or another model can filter incorrect answers, though simulation verifiers are not fully accurate.<\/li><li>On <b>ensembling verifiers<\/b>: the lab has weakly supervised ensembling work; ~10-20 verifiers is feasible (not 1000) but is compute-costly. The dataset of <b>10,000 samples per problem<\/b> is on Hugging Face.<\/li><li>On coverage validity for engineering tasks: manually checking math answers gave a high but imperfect rate (~78%), and unit tests without true code coverage are a failure mode.<\/li><li>Closing intuition: generate solutions as a <b>tree<\/b> and verify each node.<\/li><\/ul>","terms":["self-study","partial verifier","weak supervision","verifier ensemble","simulation","Hugging Face"]},"zh":{"title":"课堂讨论 II：自学、部分验证器、集成、覆盖率","problem":"朴素的重复采样浪费预算且在难题上失效，而且在某些领域验证只能是部分的——检测出错误比确认正确更容易。","why":"预先探索可能改善采样分布；部分信号（拒绝错误）可支持进化式搜索；而单一验证器很脆弱，因此集成有帮助但会消耗算力。","how":"提出在采样前进行自学/探索、错误过滤器加上模拟/工具验证器、弱监督验证器集成，并审慎验证“覆盖率”的真正含义。","detail":"<p>讨论要点，按顺序如下：<\/p><ul><li>一个<b>自学<\/b>阶段——让模型在采样解法之前先探索某领域并整合洞见——可能产生更好的 pass@k 趋势，教授确认后续内容会涵盖自学搜索与工具使用。<\/li><li>在困难领域中，即便确认正确性很昂贵，检测出一个答案是<b>错误<\/b>的也可能很容易；利用这一点来<b>排除坏答案<\/b>并驱动一个进化式循环。<\/li><li>对于物理/动力学/机器人，<b>模拟<\/b>或另一个模型可以过滤错误答案，尽管模拟验证器并不完全准确。<\/li><li>关于<b>验证器集成<\/b>：实验室有弱监督集成方面的工作；约 10-20 个验证器是可行的（而不是 1000 个），但算力成本很高。每题 <b>10000 个样本<\/b>的数据集已发布在 Hugging Face 上。<\/li><li>关于工程任务的覆盖率有效性：人工检查数学答案得到高但不完美的比率（约 78%），而没有真正覆盖代码的单元测试是一种失效模式。<\/li><li>收尾直觉：把解法生成为一棵<b>树<\/b>，并验证每个节点。<\/li><\/ul>","terms":["self-study","partial verifier","weak supervision","verifier ensemble","simulation","Hugging Face"]}},{"t":1612,"figs":[{"t":1618,"file":"slides/part02/slide_046.jpg"},{"t":1638,"file":"slides/part02/slide_049.jpg"}],"en":{"title":"Parallel Sampling vs Sequential Revisions","problem":"Repeated sampling is only one axis of test-time scaling; it is unclear how to spend compute between independent samples and iterative refinement.","why":"Parallel sampling explores diverse one-shot trajectories, while sequential revision deepens a single trajectory from different angles — they exploit different failure modes.","how":"Read Scaling LLM Test-Time Compute Optimally and separate parallel sampling from sequential revisions, which can be induced by prompting or are internalized by reasoning models.","detail":"<p>The paper <b>Scaling LLM Test-Time Compute Optimally Can Be More Effective Than Scaling Model Parameters<\/b> frames two ways to generate or improve answers with test-time compute.<\/p><ul><li><b>Parallel sampling<\/b>: generate multiple independent answers to the same input question.<\/li><li><b>Sequential revisions<\/b>: the model produces one initial approach, then keeps revising, looking at the problem from different angles and adding to its solution until it is confident enough to emit a final answer.<\/li><li>In this lecture the revision behavior is assumed to come from <b>our own prompting<\/b>, but the speaker notes that reasoning models are now trained so that they exhibit this revision behavior internally in their own answers.<\/li><li>Trade-off: parallelism buys diversity per token budget; sequential revision buys depth and self-correction per token budget — the optimal mix is the subject of the following experiments.<\/li><\/ul>","terms":["parallel sampling","sequential revisions","reasoning models","test-time scaling"]},"zh":{"title":"并行采样 vs 顺序修订","problem":"重复采样只是测试时扩展的一个维度；如何在独立样本与迭代精化之间分配算力尚不明确。","why":"并行采样探索多样的单次轨迹，而顺序修订从不同角度加深单条轨迹——它们利用的是不同的失效模式。","how":"阅读 Scaling LLM Test-Time Compute Optimally，并将并行采样与顺序修订区分开来；后者可由提示诱导，或由推理模型内化。","detail":"<p>论文 <b>Scaling LLM Test-Time Compute Optimally Can Be More Effective Than Scaling Model Parameters<\/b> 提出了用测试时算力生成或改进答案的两种方式。<\/p><ul><li><b>并行采样<\/b>：对同一输入问题生成多个独立的答案。<\/li><li><b>顺序修订<\/b>：模型先给出一个初始思路，然后不断修订，从不同角度审视问题并对其解法加以补充，直到足够确信才输出最终答案。<\/li><li>在本讲中，修订行为被假定来自<b>我们自己的提示<\/b>，但讲者指出推理模型如今已被训练成在自身答案内部表现出这种修订行为。<\/li><li>权衡：并行在每个 token 预算下换来多样性；顺序修订在每个 token 预算下换来深度与自我纠错——最优的混合方式正是接下来实验的主题。<\/li><\/ul>","terms":["parallel sampling","sequential revisions","reasoning models","test-time scaling"]}},{"t":1716,"figs":[{"t":1751,"file":"slides/part02/slide_051.jpg"},{"t":1801,"file":"slides/part02/slide_054.jpg"},{"t":1803,"file":"slides/part02/slide_055.jpg"},{"t":1838,"file":"slides/part02/slide_056.jpg"},{"t":1918,"file":"slides/part02/slide_057.jpg"},{"t":2012,"file":"slides/part02/slide_059.jpg"}],"en":{"title":"Selection Models: ORMs, PRMs, and PRM-Guided Beam Search","problem":"Improving the quality of generated answers is not enough — you must also decide how to select among them, and different scoring models match different search structures.","why":"An outcome score gives no mid-solution signal, while a process score can prune partial reasoning; the granularity and supervision of the scorer determine what search is possible.","how":"Compare outcome reward models (score the final answer) and process reward models (score each step), and use a PRM to guide a beam search over the reasoning tree.","detail":"<p>Two scoring families drive inference-time selection:<\/p><ul><li><b>Outcome reward models (ORMs)<\/b> look only at the final answer and produce a score; their accuracy/quality can be limited, especially on new domains.<\/li><li><b>Process reward models (PRMs)<\/b> assign a score per <b>step<\/b> of the generated solution (e.g., a five-step math solution), typically a value between 0 and 1 given the question, the step, or both. They are generally fine-tuned language models, work best in-domain, but exhibit some cross-task generalization.<\/li><li>Granularity: PRM scoring is <b>not per token<\/b> — a step is an 'intellectually meaningful chunk' or a sentence, and training typically uses human yes/no annotations of each step.<\/li><li><b>Best-of-n with a verifier<\/b>: generate n samples and take the highest ORM score.<\/li><li><b>PRM-guided beam search<\/b>: with a per-level budget of four samples, keep the top two by PRM score, resample and expand from them, optionally with a threshold — a tree search whose expansion is guided by step scores.<\/li><li>Availability: many <b>off-the-shelf PRMs<\/b> can be used or you can train your own PRM/ORM on your own data.<\/li><\/ul>","terms":["outcome reward model","process reward model","best-of-n","PRM-guided beam search","step-level annotation"]},"zh":{"title":"选择模型：ORM、PRM 与 PRM 引导的束搜索","problem":"提升生成答案的质量还不够——你还必须决定如何在其中进行选择，而不同的评分模型对应不同的搜索结构。","why":"结果分数不提供解到一半时的信号，而过程分数可以剪枝部分推理；评分器的粒度与监督方式决定了可行的搜索方式。","how":"比较结果奖励模型（对最终答案打分）与过程奖励模型（对每一步打分），并使用 PRM 在推理树上引导束搜索。","detail":"<p>驱动推理时选择的有两个评分类别：<\/p><ul><li><b>结果奖励模型（ORM）<\/b>只关注最终答案并给出一个分数；其准确率/质量可能有限，尤其是在新领域上。<\/li><li><b>过程奖励模型（PRM）<\/b>为生成解法的每个<b>步骤<\/b>分配一个分数（例如一个五步的数学解法），通常是给定问题、步骤或两者时的一个 0 到 1 之间的值。它们一般是微调过的语言模型，在同领域内效果最好，但表现出一定的跨任务泛化能力。<\/li><li>粒度：PRM 打分<b>不是按 token<\/b> 的——一个步骤是一个“在智识上有意义的片段”或一句话，训练通常使用对每一步的人工是/否标注。<\/li><li><b>带验证器的 best-of-n<\/b>：生成 n 个样本并取 ORM 分数最高者。<\/li><li><b>PRM 引导的束搜索<\/b>：每层预算为四个样本，保留 PRM 分数最高的两个，从它们出发重新采样并扩展，可选地设置阈值——这是一种扩展由步骤分数引导的树搜索。<\/li><li>可用性：可以使用许多<b>现成的 PRM<\/b>，也可以在自己的数据上训练自己的 PRM/ORM。<\/li><\/ul>","terms":["outcome reward model","process reward model","best-of-n","PRM-guided beam search","step-level annotation"]}},{"t":2079,"figs":[{"t":2129,"file":"slides/part02/slide_062.jpg"},{"t":2158,"file":"slides/part02/slide_066.jpg"},{"t":2220,"file":"slides/part02/slide_067.jpg"}],"en":{"title":"Compute-Optimal Allocation: MATH Difficulty Bins and Mixing Axes","problem":"It is unclear whether test-time compute should be spent on parallel exploration or sequential refinement, and how to combine the two to minimize budget for a target accuracy.","why":"Problem difficulty changes the structure of the search: easy problems admit many paths to the answer, while hard problems have few viable paths and differ in how much exploration versus depth is required.","how":"Define difficulty from per-problem pass@1, bucket MATH problems into five bins, sweep generation budgets, and compare majority voting, ORM, PRM, and optimized mixtures while tracking the sequential-to-parallel token ratio.","detail":"<p>The experiment uses the <b>MATH<\/b> dataset (~<b>12k train<\/b>, <b>500 test<\/b> questions) with a <b>PaLM<\/b> model. Difficulty is defined from observed <b>pass@1<\/b> over many samples, producing <b>five complexity bins<\/b> (bin 5 = hardest, lowest accuracy).<\/p><ul><li>For each bin they sweep the generation budget and compare <b>majority voting<\/b>, <b>ORM<\/b>, <b>PRM<\/b>, and an optimized mix; the optimized region is still open research.<\/li><li>On the sequential-to-parallel ratio: for <b>easier<\/b> problems a high <b>sequential<\/b> share (many more revision tokens than parallel branches) reaches the best accuracy.<\/li><li>As problems become <b>harder<\/b> the optimum shifts, and it changes again between bucket four and bucket five, so the optimal allocation is difficulty-dependent and not universally settled.<\/li><li>Goal: for every target accuracy, use the <b>minimum generation budget<\/b>; combining best-of-n with sequential revisions supervised by an ORM/PRM beats either axis alone.<\/li><\/ul>","terms":["MATH","difficulty bins","pass@1","sequential-to-parallel ratio","PaLM","compute-optimal"]},"zh":{"title":"算力最优分配：MATH 难度分桶与维度混合","problem":"尚不清楚测试时算力应花在并行探索还是顺序精化上，以及如何将两者结合以在达到目标准确率的前提下最小化预算。","why":"问题难度改变了搜索的结构：简单问题有多条通往答案的路径，而难题可行路径很少，并且在需要多少探索 vs 深度上有所不同。","how":"从每题的 pass@1 定义难度，将 MATH 问题分到五个桶中，扫描生成预算，在跟踪顺序与并行 token 比例的同时比较多数投票、ORM、PRM 和优化混合。","detail":"<p>该实验使用 <b>MATH<\/b> 数据集（约 <b>12k 训练<\/b>、<b>500 测试<\/b>道题）以及一个 <b>PaLM<\/b> 模型。难度由大量样本上观测到的 <b>pass@1<\/b> 定义，产生<b>五个复杂度桶<\/b>（桶 5 = 最难，准确率最低）。<\/p><ul><li>对每个桶，他们扫描生成预算并比较<b>多数投票<\/b>、<b>ORM<\/b>、<b>PRM<\/b> 以及一种优化混合；优化区域仍是开放研究。<\/li><li>关于顺序与并行的比例：对于<b>较容易<\/b>的问题，较高的<b>顺序<\/b>占比（修订 token 远多于并行分支）能达到最佳准确率。<\/li><li>随着问题变得<b>更难<\/b>，最优值发生偏移，并且在桶四与桶五之间再次变化，因此最优分配依赖于难度，并没有普遍定论。<\/li><li>目标：对每一个目标准确率，使用<b>最小的生成预算<\/b>；将由 ORM/PRM 监督的 best-of-n 与顺序修订结合，优于单独使用任一维度。<\/li><\/ul>","terms":["MATH","difficulty bins","pass@1","sequential-to-parallel ratio","PaLM","compute-optimal"]}},{"t":2283,"figs":[{"t":2350,"file":"slides/part02/slide_071.jpg"}],"en":{"title":"Test-Time Compute vs Pre-training: Which Budget Wins","problem":"Are we done pre-training, or does more pre-training still matter, given that inference compute can be scaled too?","why":"The two budgets have different cost structures — pre-training is a one-time capital expense, test-time scaling is paid on every run — so the right trade depends on problem difficulty and who is paying.","how":"Compare the ratio of inference tokens to pre-training tokens by difficulty and observe where each strategy dominates.","detail":"<p>For <b>easy and medium<\/b> questions, additional test-time compute is reported to be more favorable than scaling pre-training of the model; the inference-to-pre-training token ratio is positive there.<\/p><ul><li>For the <b>hardest<\/b> problems, larger and more heavily pre-trained <b>frontier models still do better<\/b> even with a reasonably large (essentially unbounded) test-time budget.<\/li><li>The speaker stresses this is not a one-to-one comparison and is still work in progress, but it holds across much of the lab's research.<\/li><li>Structural asymmetry: <b>pre-training is done once<\/b>, while <b>test-time scaling happens every time we run the model<\/b>.<\/li><li>Important practical caveat: not everyone can pre-train a large model, so even if pre-training were strictly better per token, test-time scaling on smaller/open models is often the only feasible route; frontier models must presumably continue pre-training for the very hardest problems.<\/li><li>A small model can be fine-tuned into an expert on a narrow question set, but the comparison here is about general recipes on general data, not task-specific specialization.<\/li><\/ul>","terms":["pre-training vs inference","frontier models","token ratio","test-time budget"]},"zh":{"title":"测试时算力 vs 预训练：哪种预算更胜一筹","problem":"既然推理算力也可以扩展，那么预训练是否已经完成，还是更多的预训练仍然重要？","why":"这两种预算具有不同的成本结构——预训练是一次性资本支出，测试时扩展在每次运行时都要付费——因此正确的取舍取决于问题难度以及由谁付费。","how":"按难度比较推理 token 与预训练 token 的比率，并观察每种策略在何处占优。","detail":"<p>对于<b>容易和中等<\/b>的问题，据报道额外的测试时算力比扩展模型的预训练更有利；那里的推理与预训练 token 比率是正的。<\/p><ul><li>对于<b>最难<\/b>的问题，即便有相当大（本质上无上限）的测试时预算，更大、预训练更充分的<b>前沿模型仍然表现更好<\/b>。<\/li><li>讲者强调这不是一对一的比较，且仍是进行中的工作，但这一点在实验室的许多研究中都成立。<\/li><li>结构性不对称：<b>预训练只做一次<\/b>，而<b>测试时扩展在我们每次运行模型时都会发生<\/b>。<\/li><li>重要的现实告诫：并非每个人都能预训练一个大模型，因此即便预训练按 token 计算严格更优，在较小/开源模型上做测试时扩展往往也是唯一可行的路径；对于最难的问题，前沿模型想必仍须继续预训练。<\/li><li>一个模型可以被微调成某个狭窄问题集上的专家，但此处的比较针对的是通用数据上的通用配方，而非针对特定任务的专门化。<\/li><\/ul>","terms":["pre-training vs inference","frontier models","token ratio","test-time budget"]}},{"t":2545,"figs":[{"t":2568,"file":"slides/part02/slide_074.jpg"}],"en":{"title":"Class Discussion III: Tree Search, Mixing, and Easy-vs-Hard Intuition","problem":"Given parallel and sequential axes plus verification, what is the right general strategy — and is there a universal answer?","why":"The correct allocation depends on the branching structure of the problem, and no single recipe dominates across difficulty levels.","how":"Discuss tree search as a mix of both axes with verification-based pruning, and reason about how the number of viable solution paths varies with difficulty.","detail":"<p>There is no universal answer; the general sentiment is that <b>combining<\/b> the two axes does better than either alone.<\/p><ul><li><b>Tree search<\/b> mixes the two: you reuse partial reasoning (a tree) rather than throwing away entire samples, and prune confusing or violating branches.<\/li><li>Connection to the earlier beam search: bring in a <b>PRM<\/b> to cut the tree at each level and explore only the more promising branches.<\/li><li>A student's intuition: bigger/easier problems have many <b>paths<\/b> to success, so a chain-of-thought style approach with verification at each step suffices, pruning branches as they violate constraints; harder problems have few viable paths, so you need many <b>parallel<\/b> samples to find at least one viable solution.<\/li><li>The professor agrees this is an intuitive way to think about it, and frames the whole problem as knobs: how to allocate generated tokens and how to elicit generations from the model.<\/li><\/ul>","terms":["tree search","pruning","branching","PRM","parallel vs sequential"]},"zh":{"title":"课堂讨论 III：树搜索、混合与易难直觉","problem":"有了并行与顺序两个维度加上验证，正确的通用策略是什么——是否存在一个普适的答案？","why":"正确的分配取决于问题的分支结构，没有任何单一配方能在所有难度层次上占优。","how":"讨论将树搜索作为两个维度的混合并配合基于验证的剪枝，并推演可行解法路径数量如何随难度变化。","detail":"<p>没有普适的答案；总体看法是<b>结合<\/b>这两个维度比单独使用任一者更好。<\/p><ul><li><b>树搜索<\/b>将两者混合：你复用部分推理（一棵树），而不是丢弃整个样本，并剪掉令人困惑或违反约束的分支。<\/li><li>与前面束搜索的联系：引入一个 <b>PRM<\/b> 在每一层对树进行切割，只探索更有前景的分支。<\/li><li>一位学生的直觉：更大/更容易的问题有许多通往成功的<b>路径<\/b>，因此一种链式思维式、每步都进行验证的方法就足够了，在分支违反约束时将其剪掉；更难的问题可行路径很少，因此需要许多<b>并行<\/b>样本来找到至少一个可行解。<\/li><li>教授同意这是一种直观的思考方式，并把整个问题框定为一组旋钮：如何分配生成的 token，以及如何从模型引出生成结果。<\/li><\/ul>","terms":["tree search","pruning","branching","PRM","parallel vs sequential"]}},{"t":2747,"figs":[{"t":2784,"file":"slides/part02/slide_076.jpg"},{"t":2839,"file":"slides/part02/slide_077.jpg"}],"en":{"title":"Archon and ITAS: Inference-Time Architecture Search","problem":"There are many inference-time operators and models, but no principled way to choose which to use, how to sequence them, or how to allocate an inference-call budget to maximize accuracy.","why":"Hand-designing a test-time pipeline is combinatorial and wasteful, and naive parallel sampling or single-model selection leaves accuracy and budget on the table.","how":"Reframe inference scaling as an architecture design problem: input benchmarks, a budget, available LLMs, and a library of inference techniques; output a composed architecture found by the optimizer ITAS.","detail":"<p><b>Archon<\/b> is an architecture research framework for inference-time scaling (the TA is a co-author). The paper's framing is to treat inference scaling as an <b>inference architecture design<\/b> problem.<\/p><ul><li>Inputs: a set of target benchmarks; an inference-call <b>budget<\/b>; a set of <b>available LLMs<\/b> (models can be mixed and matched); and a set of inference-time techniques.<\/li><li><b>ITAS<\/b> (inference time architecture search) is the optimizer that decides how to compose the models and techniques — parallel, sequential, and otherwise.<\/li><li>Output: an architecture that mixes and matches techniques and models to maximize answer quality under the budget; the objective is to hit high quality without wasting tokens and generations.<\/li><li>Trade-off: the search itself is compute-expensive because it requires many inference calls, so the space is pruned (see later slides).<\/li><\/ul>","terms":["Archon","ITAS","inference time architecture search","inference budget","test-time techniques"]},"zh":{"title":"Archon 与 ITAS：推理时架构搜索","problem":"推理时算子和模型有很多，但没有一种有原则的方法来选择使用哪些、如何排序它们，或如何分配推理调用预算以最大化准确率。","why":"手工设计测试时流水线是组合爆炸且浪费的，而朴素的并行采样或单模型选择会让准确率与预算白白流失。","how":"把推理扩展重新表述为架构设计问题：输入基准、预算、可用 LLM 以及一个推理技术库；输出一个由优化器 ITAS 找到的组合架构。","detail":"<p><b>Archon<\/b> 是一个面向推理时扩展的架构研究框架（助教是共同作者）。该论文的表述是把推理扩展视为<b>推理架构设计<\/b>问题。<\/p><ul><li>输入：一组目标基准；一个推理调用<b>预算<\/b>；一组<b>可用 LLM<\/b>（模型可以混搭）；以及一组推理时技术。<\/li><li><b>ITAS<\/b>（inference time architecture search）是决定如何组合模型与技术的优化器——并行、顺序以及其他方式。<\/li><li>输出：一个混搭技术与模型的架构，以在预算下最大化答案质量；目标是在不浪费 token 和生成的前提下达到高质量。<\/li><li>权衡：搜索本身算力昂贵，因为它需要大量推理调用，因此搜索空间会被剪枝（见后续幻灯片）。<\/li><\/ul>","terms":["Archon","ITAS","inference time architecture search","inference budget","test-time techniques"]}},{"t":2887,"figs":[{"t":2891,"file":"slides/part02/slide_084.jpg"}],"en":{"title":"Archon Operators I: Generation and Fusion","problem":"What are the composable building blocks of an inference architecture, and which ones actually move accuracy?","why":"The search space is defined by its operators; if the operators are weak or too few, the optimizer cannot do better than manual sampling.","how":"Define generation (n samples) and fusion (an LLM synthesizes one answer from k responses), both implemented via prompting with no task-specific training.","detail":"<p>Archon's operators are all <b>prompting-based<\/b> — the model is not trained for a specific test-time-scaling task; it is simply instructed in the prompt.<\/p><ul><li><b>Generation (gen)<\/b>: sample from the model, optionally n generations at a time, producing n different responses to the input question — the basis of repeated sampling.<\/li><li><b>Fusion<\/b>: given k different responses, show all of them plus the input question to an LLM and ask it to <b>synthesize one output response<\/b> that is aware of all the ways the question was answered.<\/li><li>Fusion is surprisingly effective and is categorized as a <b>sequential update<\/b> over parallel samples: parallel samples are fused into a single answer.<\/li><li>Trade-off: fusion trades token budget for a chance to exceed any individual candidate, including beating an oracle selector (shown later).<\/li><\/ul>","terms":["generation","fusion","synthesis","prompting-based"]},"zh":{"title":"Archon 算子 I：生成与融合","problem":"推理架构的可组合构件块有哪些，其中哪些真正能提升准确率？","why":"搜索空间由其算子定义；如果算子很弱或太少，优化器就无法比手工采样做得更好。","how":"定义生成（n 个样本）与融合（一个 LLM 从 k 个回答中综合出一个答案），两者均通过提示实现，不做任何特定任务的训练。","detail":"<p>Archon 的算子全部是<b>基于提示<\/b>的——模型并未针对某个特定的测试时扩展任务进行训练；只是在提示中给出指令。<\/p><ul><li><b>生成（gen）<\/b>：从模型采样，可选地一次进行 n 次生成，对输入问题产生 n 个不同的回答——这是重复采样的基础。<\/li><li><b>融合（fusion）<\/b>：给定 k 个不同的回答，把它们全部连同输入问题展示给一个 LLM，要求它<b>综合出一个输出回答<\/b>，该回答须知晓问题被作答的所有方式。<\/li><li>融合出人意料地有效，并被归类为对并行样本的一种<b>顺序更新<\/b>：并行样本被融合成一个答案。<\/li><li>权衡：融合用 token 预算换取超越任何单个候选的机会，甚至能超越 oracle 选择器（后文展示）。<\/li><\/ul>","terms":["generation","fusion","synthesis","prompting-based"]}},{"t":2993,"figs":[],"en":{"title":"Archon Operators II: Critic, Ranker, Verifier","problem":"Selection and refinement operators beyond raw generation are needed to exploit the candidates that sampling produces.","why":"A critic exposes failure modes of a response, a ranker orders candidates globally, and a verifier produces a score with justification — each provides a different signal for the search.","how":"Add prompt-based critic, ranker, and verifier operators to the search space, all usable without fine-tuning.","detail":"<p>The remaining core operators are again implemented purely by prompting:<\/p><ul><li><b>Critic<\/b>: for any given response, ask a model to describe its <b>weaknesses and strengths<\/b>; this critique can be an inference-time scaling action in its own right or feed later stages.<\/li><li><b>Ranker<\/b>: ask the model to <b>rank<\/b> the generated responses from a previous step by quality; the top-ranked response can be selected directly.<\/li><li><b>Verifier<\/b>: returns a response together with the <b>reasoning<\/b> for why it came to a particular score for an answer.<\/li><li>All are prompt-based optimization — the framework has not trained the model for these specific test-time-scaling tasks.<\/li><li>Unit-test generation and evaluation are the next two operators, covered on the following slides, and are especially relevant for code and math.<\/li><\/ul>","terms":["critic","ranker","verifier","prompt-based optimization"]},"zh":{"title":"Archon 算子 II：Critic、Ranker、Verifier","problem":"除了原始生成之外，还需要选择与精化算子来利用采样所产生的候选。","why":"critic 揭示回答的失效模式，ranker 对候选进行全局排序，verifier 给出带有理由的分数——各自为搜索提供不同的信号。","how":"将基于提示的 critic、ranker 与 verifier 算子加入搜索空间，它们都无需微调即可使用。","detail":"<p>其余的核心算子同样完全通过提示实现：<\/p><ul><li><b>Critic<\/b>：对任意给定回答，要求模型描述其<b>弱点与优点<\/b>；这一批评本身可以是一种推理时扩展动作，也可以为后续阶段提供输入。<\/li><li><b>Ranker<\/b>：要求模型按质量对前一步生成的回答进行<b>排序<\/b>；排名最高的回答可以被直接选中。<\/li><li><b>Verifier<\/b>：返回一个回答，连同它对某个答案得出特定分数的<b>推理过程<\/b>。<\/li><li>全部都是基于提示的优化——该框架并未针对这些特定的测试时扩展任务训练模型。<\/li><li>单元测试生成与评估是接下来的两个算子，将在后续幻灯片中讲解，对代码和数学尤为相关。<\/li><\/ul>","terms":["critic","ranker","verifier","prompt-based optimization"]}},{"t":3063,"figs":[{"t":3081,"file":"slides/part02/slide_079.jpg"}],"en":{"title":"Fusion Beats Oracle Selection; Model Ensembling Confirms the Trend","problem":"Do these techniques actually help, and how large is the gain relative to an unattainable perfect selector?","why":"Fusion can repair and combine correct fragments across candidates, so it can outperform even an oracle that merely picks one candidate, which reframes where the headroom lies.","how":"Measure win rate on a reasoning benchmark across random selection, model ranking, oracle selection, fusion, and filtered fusion; then repeat with 1, 2, and 10 models each contributing one answer.","detail":"<p>On a reasoning benchmark (a reasoning/QA task), the win-rate comparison shows a clean ordering:<\/p><ul><li><b>Orange — random selection<\/b>: the worst case, randomly pick one generated response.<\/li><li><b>Green — model ranker<\/b>: ask the model to rank responses and take the top one; already beats random.<\/li><li><b>Blue — oracle selection<\/b>: assume an oracle verifier that identifies the single best generated response; better than the model ranker but still restricted to choosing one candidate.<\/li><li><b>Red — fusion<\/b>: show all k responses and ask the model to synthesize one answer; this can <b>exceed oracle selection<\/b>, showing that generation of a new fused answer is more powerful than selection.<\/li><li><b>Purple — filtered fusion<\/b>: first select the top five responses, then fuse them; filtering before fusing beats fusing everything.<\/li><li>Right-hand experiment: instead of one model, use 1, 2, or 10 different models each producing one answer; the same ordering persists (random gets worse because the ensemble includes weaker models), and the ensemble is built by adding the best model first, then second best, and so on.<\/li><\/ul>","terms":["win rate","oracle selection","fusion","filtered fusion","model ensemble"]},"zh":{"title":"融合超越 Oracle 选择；模型集成印证了这一趋势","problem":"这些技术真的有帮助吗，相对于一个无法企及的完美选择器，收益有多大？","why":"融合能够修复并组合各候选中的正确片段，因此它甚至可以超越仅仅挑选一个候选的 oracle，这重新界定了提升空间所在。","how":"在一个推理基准上衡量随机选择、模型排序、oracle 选择、融合与过滤融合的胜率；然后用 1、2 和 10 个模型各贡献一个答案重复实验。","detail":"<p>在一个推理基准（一个推理/QA 任务）上，胜率比较显示出清晰的排序：<\/p><ul><li><b>橙色——随机选择<\/b>：最差情形，随机挑一个生成的回答。<\/li><li><b>绿色——模型排序器<\/b>：要求模型对回答排序并取最高者；已经优于随机。<\/li><li><b>蓝色——oracle 选择<\/b>：假设有一个 oracle 验证器识别出单个最佳生成回答；优于模型排序器，但仍受限于只能选择一个候选。<\/li><li><b>红色——融合<\/b>：展示全部 k 个回答并要求模型综合出一个答案；这可以<b>超越 oracle 选择<\/b>，表明生成一个新的融合答案比选择更强大。<\/li><li><b>紫色——过滤融合<\/b>：先选出排名前五的回答，再融合它们；融合前先过滤优于融合全部。<\/li><li>右侧实验：不用一个模型，而是用 1、2 或 10 个不同模型各产生一个答案；同样的排序依然成立（随机变得更差，因为集成中包含较弱的模型），集成是按先加入最好的模型、再加入次好的模型这样的方式构建的。<\/li><\/ul>","terms":["win rate","oracle selection","fusion","filtered fusion","model ensemble"]}},{"t":3301,"figs":[{"t":3343,"file":"slides/part02/slide_085.jpg"},{"t":3381,"file":"slides/part02/slide_092.jpg"}],"en":{"title":"Unit Test Generation and Unit Test Evaluation","problem":"For coding and math, verification should be automated, but running executable tests is not always available or convenient inside an inference architecture.","why":"Tests can be generated by the model itself, and even evaluating an answer against a test can be delegated to the model, giving a scalable selection signal.","how":"Have the model generate unit tests, then either run them or ask the model to evaluate a candidate answer against the test; use these as operators in the architecture.","detail":"<p><b>Unit test generation<\/b>: ask the model to produce unit tests for a coding task, a math optimization problem, or another reasoning task.<\/p><ul><li>Example prompt: check for <b>balanced round brackets<\/b> in an input string. A good generated test is 'given a string with an odd number of brackets, the solution should output no'. Another is 'when a closing bracket is encountered, it must match the most recently opened unmatched bracket'.<\/li><li>The model can also generate the <b>code<\/b> to run these tests.<\/li><li><b>Unit test evaluation<\/b> is the crazier variant: instead of running the test, ask the model to evaluate a generated answer <b>against<\/b> the unit test, delegating execution semantics to the model.<\/li><li>Trade-off: this removes the need for an execution sandbox but introduces the model's own judgment as a source of verification error.<\/li><li>These operators feed the optimized architectures shown next: generate a large number of samples, generate unit tests, and evaluate candidates.<\/li><\/ul>","terms":["unit test generation","unit test evaluation","balanced brackets","automatic verification"]},"zh":{"title":"单元测试生成与单元测试评估","problem":"对于代码和数学，验证应当自动化，但在推理架构内部运行可执行测试并不总是可得或方便。","why":"测试可以由模型自己生成，甚至把答案对照测试进行评估也可以委托给模型，从而给出一种可扩展的选择信号。","how":"让模型生成单元测试，然后要么运行它们，要么要求模型对照测试来评估一个候选答案；将这些作为架构中的算子使用。","detail":"<p><b>单元测试生成<\/b>：要求模型为某个代码任务、数学优化问题或其他推理任务生成单元测试。<\/p><ul><li>示例提示：检查输入字符串中的<b>圆括号是否平衡<\/b>。一个好的生成测试是“给定一个括号数为奇数的字符串，解法应输出 no”。另一个是“当遇到一个右括号时，它必须与最近一个未匹配的左括号配对”。<\/li><li>模型还可以生成用于运行这些测试的<b>代码<\/b>。<\/li><li><b>单元测试评估<\/b>是更疯狂的变体：不运行测试，而是要求模型对照单元测试评估一个生成的答案，把执行语义委托给模型。<\/li><li>权衡：这消除了对执行沙箱的需求，但引入了模型自身判断作为验证误差的来源。<\/li><li>这些算子为接下来展示的优化架构提供输入：生成大量样本、生成单元测试、评估候选。<\/li><\/ul>","terms":["unit test generation","unit test evaluation","balanced brackets","automatic verification"]}},{"t":3511,"figs":[{"t":3511,"file":"slides/part02/slide_090.jpg"},{"t":3600,"file":"slides/part02/slide_095.jpg"},{"t":3636,"file":"slides/part02/slide_098.jpg"}],"en":{"title":"Depth Helps; Bayesian Optimization Over a Constrained Search Space","problem":"The space of possible architectures is huge, and searching it naively is prohibitively expensive.","why":"Layered pipelines behave like deep networks — more stages keep improving accuracy — but exhaustive or random search over orderings is intractable.","how":"Stack layers of inference operators and use Bayesian optimization over a pruned search space with hard structural constraints, optimizing accuracy under a call budget.","detail":"<p>A key empirical property: <b>stacking more layers<\/b> of inference-time techniques — making the architecture deeper — helps accuracy. The rightmost architecture (an <b>ensemble<\/b> of models plus three layers of critique and fusers and a final fuser layer) is significantly better across tasks than using only the best model once, or the best model eight times with one fusion layer. The analogy is adding layers in deep learning: careful additional inference layers make the model more accurate.<\/p><ul><li>The optimizer is a <b>Bayesian optimizer<\/b> (widely available in open-source tooling), which maps architectural configurations to accuracy and optimizes that objective; it is much more sample-efficient than greedy or random selection.<\/li><li>Search-space constraints to control cost: allow <b>only one inference technique per layer<\/b>; the <b>first layer is always the generator<\/b>; a <b>critic must precede<\/b> a ranker or fuser (validated locally); a <b>unit test generator must be followed by an evaluator<\/b>.<\/li><li>Objectives can include which models are available and the inference-call budget; the search uses a held-out training set and optimizes accuracy vs number of calls.<\/li><\/ul>","terms":["depth","Bayesian optimization","search space constraints","critique-fuser layers","sample efficiency"]},"zh":{"title":"深度有帮助；在受限搜索空间上的贝叶斯优化","problem":"可能的架构空间极其庞大，朴素地搜索它的代价高得令人望而却步。","why":"分层流水线的行为类似于深度网络——更多的阶段持续提升准确率——但对排序进行穷举或随机搜索是不可行的。","how":"堆叠多层推理算子，并在带有硬性结构约束的剪枝搜索空间上使用贝叶斯优化，在调用预算下优化准确率。","detail":"<p>一个关键的经验性质：<b>堆叠更多层<\/b>推理时技术——使架构更深——有助于提高准确率。最右侧的架构（模型的<b>集成<\/b>加上三层 critique 与 fuser，再有一个最终的 fuser 层）在各个任务上都显著优于只用一次最好的模型，或让最好的模型运行八次加一个融合层。类比于深度学习中的加层：精心设计的额外推理层让模型更准确。<\/p><ul><li>优化器是一个<b>贝叶斯优化器<\/b>（在开源工具中广泛可用），它将架构配置映射到准确率并优化该目标；它比贪心或随机选择在样本效率上高得多。<\/li><li>为控制成本而设置的搜索空间约束：每层<b>只允许一种推理技术<\/b>；<b>第一层始终是生成器<\/b>；<b>critic 必须先于<\/b>ranker 或 fuser（已在本地验证）；<b>单元测试生成器后面必须跟一个评估器<\/b>。<\/li><li>目标可以包括哪些模型可用以及推理调用预算；搜索使用一个留出的训练集，并优化准确率与调用次数的权衡。<\/li><\/ul>","terms":["depth","Bayesian optimization","search space constraints","critique-fuser layers","sample efficiency"]}},{"t":3687,"figs":[{"t":3760,"file":"slides/part02/slide_099.jpg"},{"t":3783,"file":"slides/part02/slide_100.jpg"}],"en":{"title":"Archon Results: Open Models Match Frontier, +14.1% Average pass@1","problem":"Can a searched inference-time architecture, built only from open-source models, really compete with the frontier closed models of the time?","why":"If so, test-time architecture search is a practical capability lever that does not require pre-training a frontier model, and it reframes the value of open weights.","how":"Optimize Archon for task-specific and general-purpose objectives, then compare final-response pass@1 against GPT-4o and Claude 3.5 Sonnet across instruction following, reasoning, math, and coding.","detail":"<p>The distinguishing property of Archon is that it emits <b>one final response<\/b> at the end — it is optimizing <b>pass@1<\/b>, not coverage. Using only open-source models, it could match or exceed the frontier closed-source models of the time by a large margin across many tasks in pass@1.<\/p><ul><li>Archon can be trained <b>task-specific<\/b> (Bayesian-optimize on one task and test on it) or <b>general-purpose<\/b> (optimize to do well across many tasks).<\/li><li>Even the <b>general-purpose<\/b> configuration does very well, better than the frontier models across these tasks — an important observation, since it shows these inference architectures generalize <b>beyond the tasks they were searched on<\/b>.<\/li><li>Headline number: on average, Archon outperformed <b>GPT-4o<\/b> and <b>Claude 3.5 Sonnet<\/b> in pass@1 by <b>14.1%<\/b> across instruction following, reasoning, math, and coding problems.<\/li><li>The lecture closes with further discussion questions left for students to think about over the weekend.<\/li><\/ul>","terms":["pass@1","Archon","general-purpose architecture","GPT-4o","Claude 3.5 Sonnet","task-specific"]},"zh":{"title":"Archon 结果：开源模型追平前沿，pass@1 平均 +14.1%","problem":"一个仅由开源模型构建、经搜索得到的推理时架构，真的能与当时的前沿闭源模型竞争吗？","why":"如果确实如此，测试时架构搜索就是一种无需预训练前沿模型即可使用的实用能力杠杆，并且重新界定了开放权重的价值。","how":"为任务特定目标和通用目标分别优化 Archon，然后在指令遵循、推理、数学和代码任务上，将最终回答的 pass@1 与 GPT-4o 和 Claude 3.5 Sonnet 进行比较。","detail":"<p>Archon 的显著特性是它在最后给出<b>一个最终回答<\/b>——它优化的是 <b>pass@1<\/b>，而非覆盖率。仅使用开源模型，它在 pass@1 上就能以较大优势在许多任务上追平或超越当时的前沿闭源模型。<\/p><ul><li>Archon 可以按<b>任务特定<\/b>方式训练（在某一任务上做贝叶斯优化并在该任务上测试）或按<b>通用<\/b>方式训练（优化以在多个任务上表现良好）。<\/li><li>即便是<b>通用<\/b>配置也表现得非常好，在这些任务上优于前沿模型——这是一个重要的观察，因为它表明这些推理架构的泛化能力<b>超越了它们被搜索时所基于的任务<\/b>。<\/li><li>头条数字：在指令遵循、推理、数学和代码问题上，Archon 在 pass@1 上平均以 <b>14.1%<\/b> 的优势超过了 <b>GPT-4o<\/b> 和 <b>Claude 3.5 Sonnet<\/b>。<\/li><li>本讲以留给学生周末思考的更多讨论问题收尾。<\/li><\/ul>","terms":["pass@1","Archon","general-purpose architecture","GPT-4o","Claude 3.5 Sonnet","task-specific"]}}]},{"n":3,"id":"p7TdPUcPoik","duration":4375,"slideCount":50,"en":{"title":"Robust Verification","summary":"Lecture 3 of Stanford CS329A traces four papers on verification for LLM reasoning. It starts from the generation-verification gap: repeated sampling raises coverage but selectors like majority voting stop improving. Paper 1 (OpenAI 2021) trains a GSM8K verifier with binary and LM losses, ablates verification vs fine-tuning and generator/verifier capacity, and shows verifier test-time scaling to ~400 samples. Paper 2 (Let's Verify Step by Step) contrasts outcome vs process reward models, uses human step labels (PRM800K, 2.6x active-learning efficiency), and shows PRM beats ORM and majority voting while generalizing across distribution shift. Paper 3 (Math-Shepherd) removes human annotation via hard/soft rollout-based step labels and RLs the generator against the learned PRM. Paper 4 (Beaver) ensembles weak verifiers (PRMs, ORMs, LLM judges) with weak-to-strong supervision, scales verification compute, bridges model classes, and distills to a ~400M verifier at 97% quality and 99%+ less compute. The lecture closes with discussion of coding, reasoning models, and open questions."},"zh":{"title":"鲁棒验证","summary":"Stanford CS329A 的第 3 讲梳理了四篇关于 LLM 推理验证的论文。它从 generation-verification gap 出发：重复采样提升了覆盖率，但像多数投票这样的选择器却停止改进。论文 1（OpenAI 2021）用二元损失和 LM 损失训练了一个 GSM8K 验证器，消融比较了验证与微调以及生成器/验证器容量，并展示了验证器在测试时可扩展到约 400 个样本。论文 2（Let's Verify Step by Step）对比了结果奖励模型与过程奖励模型，使用人工步骤标签（PRM800K，主动学习效率提升 2.6 倍），并表明 PRM 优于 ORM 和多数投票，同时能跨 distribution shift 泛化。论文 3（Math-Shepherd）通过基于 hard/soft rollout 的步骤标签去除了人工标注，并用 RL 让生成器针对学到的 PRM 进行优化。论文 4（Beaver）用 weak-to-strong 监督集成弱验证器（PRM、ORM、LLM judge），扩展验证算力，弥合模型类别差距，并蒸馏出一个约 400M 的验证器，达到 97% 的质量且算力减少 99% 以上。本讲最后讨论了编程、reasoning model 以及开放问题。"},"sections":[{"t":5,"figs":[{"t":6,"file":"slides/part03/slide_002.jpg"},{"t":69,"file":"slides/part03/slide_003.jpg"}],"en":{"title":"Lecture framing: verification and the generation-verification gap","problem":"Language models hallucinate and confidently present wrong solutions; with repeated sampling they can often produce a correct answer, but the system has no automatic way to pick it.","why":"Inference-time scaling only converts extra samples into accuracy if something can select or guide the correct answer. Last lecture showed majority voting eventually fails to track coverage: the generation-verification gap.","how":"Frame the lecture as the arc of verification research, then study four papers that progressively change how verifiers are built and used.","detail":"<p>Verification is introduced as the missing half of test-time scaling. A generator can be sampled many times, but the useful question is how to <em>automatically select the correct answer<\/em> or guide generation step by step. The lecture notes this is a persistent problem, not a solved one.<\/p><ul><li>Definition of the gap: coverage (pass@k) rises with samples while the selector (e.g. majority voting) stops improving, so the system accuracy stalls.<\/li><li>Four papers trace the progression of verification over roughly four years, from training verifiers on GSM8K to ensembling weak verifiers.<\/li><li>Recurring levers: outcome vs process supervision, human vs automatic step labels, RL with a verifier as reward, and inference-compute scaling of the verifier itself.<\/li><\/ul>","terms":["verification","generation-verification gap","repeated sampling","test-time scaling","hallucination"]},"zh":{"title":"课程框架：验证与 generation-verification gap","problem":"语言模型会产生幻觉，并自信地给出错误解答；通过重复采样它们往往能产生正确答案，但系统无法自动将其挑选出来。","why":"只有当存在某种机制能够选出或引导出正确答案时，推理时扩展才能把额外的采样转化为准确率。上一讲已经表明，多数投票最终无法跟上覆盖率的增长：这就是 generation-verification gap。","how":"将本讲定位为验证研究的发展脉络，然后依次研究四篇论文，它们逐步改变了验证器的构建方式与使用方式。","detail":"<p>验证被引入为 test-time scaling 缺失的另一半。生成器可以被多次采样，但真正有用的问题是<em>如何自动选出正确答案<\/em>，或者一步步地引导生成。课程指出这是一个长期存在的问题，而非已经解决的问题。<\/p><ul><li>gap 的定义：覆盖率（pass@k）随采样数上升，而选择器（例如多数投票）停止改进，于是系统准确率停滞。<\/li><li>四篇论文勾勒出验证在大约四年间的发展，从在 GSM8K 上训练验证器，到对弱验证器进行集成。<\/li><li>反复出现的杠杆：结果监督 vs 过程监督、人工 vs 自动步骤标签、以验证器作为奖励的 RL，以及验证器自身的推理算力扩展。<\/li><\/ul>","terms":["验证","generation-verification gap","重复采样","test-time scaling","幻觉"]}},{"t":73,"figs":[{"t":77,"file":"slides/part03/slide_005.jpg"},{"t":89,"file":"slides/part03/slide_006.jpg"},{"t":179,"file":"slides/part03/slide_007.jpg"}],"en":{"title":"Paper 1: training verifiers on GSM8K (OpenAI, 2021)","problem":"LLMs confidently emit wrong solutions, and at the time grade-school math word problems were hard for them.","why":"A benchmark requiring genuine multi-step reasoning plus a model that outputs the probability a solution is correct gives a measurable target for verification.","how":"Introduce GSM8K (~8,500 grade-school problems) and train a verifier that scores a (question, solution) pair.","detail":"<p>The first paper is an OpenAI 2021 work whose motivation was that LLMs hallucinate and present wrong solutions confidently. Its contribution is twofold.<\/p><ul><li>GSM8K: roughly 8,500 grade-school math problems built for quality and diversity, deliberately requiring several reasoning steps even though the arithmetic is simple. Solutions are written in natural language rather than pure math, and a single human answer was collected per problem.<\/li><li>A verification objective: given a question and a solution, output the probability that the solution is correct, analogous to giving a student a rubric for self-checking.<\/li><li>The benchmark is still used today for smaller models and as a template for custom project evals.<\/li><\/ul>","terms":["GSM8K","verifier","multi-step reasoning","hallucination"]},"zh":{"title":"论文 1：在 GSM8K 上训练验证器（OpenAI, 2021）","problem":"LLM 会自信地输出错误解答，而在当时，小学阶段的数学应用题对它们而言相当困难。","why":"一个真正需要多步推理的基准，加上一个能输出解答正确概率的模型，为验证提供了一个可度量的目标。","how":"引入 GSM8K（约 8,500 道小学题），并训练一个对 (问题, 解答) 对进行打分的验证器。","detail":"<p>第一篇论文是 OpenAI 于 2021 年的工作，其动机是 LLM 会产生幻觉并自信地给出错误解答。它有两方面贡献。<\/p><ul><li>GSM8K：约 8,500 道小学数学题，为质量与多样性而构建，尽管算术很简单，却刻意要求若干个推理步骤。解答用自然语言而非纯数学书写，每道题只收集了单个人工答案。<\/li><li>一个验证目标：给定问题和解答，输出该解答正确的概率，类似于给学生一份用于自查的评分标准（rubric）。<\/li><li>该基准至今仍被用于较小模型，并作为自定义项目评测的模板。<\/li><\/ul>","terms":["GSM8K","验证器","多步推理","幻觉"]}},{"t":203,"figs":[{"t":215,"file":"slides/part03/slide_009.jpg"},{"t":285,"file":"slides/part03/slide_010.jpg"},{"t":419,"file":"slides/part03/slide_011.jpg"}],"en":{"title":"Training the GSM8K verifier: labels, dual loss, scalar head","problem":"Supervised verifier training needs labels indicating whether each sampled solution is correct.","why":"GSM8K problems were written with human final answers, so correctness labels can be derived automatically by matching the generator final answer to ground truth.","how":"Sample many solutions per question, label them, and train a language-model verifier with a small scalar head.","detail":"<p>The generator answers question Q_i with solution S_i. For each problem the model samples 100 completions, and each is labeled correct or incorrect by comparing its final answer against the human ground truth (a single human answer collected once per problem).<\/p><ul><li>The verifier is itself a language model with a small scalar head producing a per-token prediction of closeness to a correct solution.<\/li><li>Two losses are combined: a binary correctness classification loss and a standard next-token language-modeling loss, which the paper says helps.<\/li><li>Question tokens are masked out of the objective; only the generated solution is optimized.<\/li><li>Ablations explored sentence-level vs token-level labels; token-level labels are very noisy, while sentence-level labels mark whether the previous sentence is a correct step.<\/li><\/ul>","terms":["binary label","scalar head","language modeling loss","token-level labels","sentence-level labels"]},"zh":{"title":"训练 GSM8K 验证器：标签、双重损失、scalar head","problem":"有监督的验证器训练需要标注每个采样解答是否正确的标签。","why":"GSM8K 题目带有最终人工答案，因此可以通过将生成器的最终答案与 ground truth 匹配来自动推导正确性标签。","how":"为每道题采样大量解答，为其打标签，并用一个带有小型 scalar head 的语言模型验证器进行训练。","detail":"<p>生成器用解答 S_i 回答问题 Q_i。对每道题，模型采样 100 个 completion，并将每个的最终答案与人工 ground truth（每道题只收集一次的单一人工答案）比较，标注为正确或错误。<\/p><ul><li>验证器本身就是一个语言模型，带有小型 scalar head，逐 token 预测其接近正确解答的程度。<\/li><li>组合使用两种损失：二元正确性分类损失和标准的下一 token 语言建模损失，论文称后者有帮助。<\/li><li>问题部分的 token 在目标中被 mask 掉；只有生成的解答被优化。<\/li><li>消融实验比较了句子级和 token 级标签；token 级标签噪声很大，而句子级标签标记上一句是否为正确的一步。<\/li><\/ul>","terms":["二元标签","scalar head","语言建模损失","token 级标签","句子级标签"]}},{"t":427,"figs":[{"t":440,"file":"slides/part03/slide_012.jpg"},{"t":492,"file":"slides/part03/slide_014.jpg"},{"t":601,"file":"slides/part03/slide_015.jpg"}],"en":{"title":"Recipe, ablations, and reading a single verifier score","problem":"The per-token head yields many predictions, but selection needs one score per solution.","why":"Scoring convention and label granularity change accuracy, so the paper ablates them and fixes a final-token rule.","how":"Fine-tune generator for two epochs, sample 100 completions, train verifier for one epoch, then read the score after the last token.","detail":"<p>The training recipe is two-stage: fine-tune the generator on a portion of the data for two epochs, sample 100 completions per question, label them, then train the verifier for a single epoch. The lecturer notes this supervised fine-tuning step is debatable today since instruction-following and math ability are now strong, so newer verifiers often skip straight to the verifier objective.<\/p><ul><li>Final solution score is taken after the last token; the last token prediction is treated as correct/incorrect for the whole generation.<\/li><li>Token-level visualization shows green (high) and red (low) spans. Correct solutions often dip mid-reasoning but end green; a wrong solution starts well, errs late, ends red.<\/li><li>Predicted labels match ground truth in the shown examples.<\/li><\/ul>","terms":["supervised fine-tuning","final token score","verifier ablation","per-token prediction"]},"zh":{"title":"训练配方、消融实验，以及如何读取单个验证器得分","problem":"逐 token 的 head 会产生许多预测，但选择需要每个解答只对应一个得分。","why":"打分约定与标签粒度都会改变准确率，因此论文对二者做了消融，并确定了 final-token 规则。","how":"将生成器微调两个 epoch，采样 100 个 completion，训练验证器一个 epoch，然后读取最后一个 token 之后的得分。","detail":"<p>训练配方分为两个阶段：在部分数据上把生成器微调两个 epoch，为每道题采样 100 个 completion，为其打标签，然后训练验证器一个 epoch。讲师指出，这一有监督微调步骤在今天有争议，因为指令遵循与数学能力如今都已很强，所以较新的验证器往往直接进入验证目标。<\/p><ul><li>最终解答得分取自最后一个 token 之后；最后一个 token 的预测被视为整个生成结果正确/错误。<\/li><li>token 级可视化显示绿色（高）和红色（低）区段。正确解答常常在推理中途下探，但结尾为绿色；错误解答开局良好，后段出错，结尾为红色。<\/li><li>所示示例中，预测标签与 ground truth 一致。<\/li><\/ul>","terms":["有监督微调","final token 得分","验证器消融","逐 token 预测"]}},{"t":672,"figs":[{"t":713,"file":"slides/part03/slide_017.jpg"}],"en":{"title":"Ablation: verification vs direct fine-tuning","problem":"It is unclear whether a separate verifier beats simply fine-tuning the generator on the data.","why":"The comparison determines whether the extra verifier and sampling cost is justified.","how":"Compare verification-based selection against supervised fine-tuning at different training-set sizes for 6B and 175B models.","detail":"<p>The paper compares verification against plain supervised fine-tuning at 6B and 175B scale (the 175B model is a GPT-3-class model), sweeping the amount of verifier training data. At test time the verification system samples many solutions and delivers the one with the highest verifier score.<\/p><ul><li>For both model sizes verification wins as the verifier training set grows, eventually outperforming the fine-tuning-only approach, so the curves cross.<\/li><li>With small data fine-tuning wins; for the 175B model with fewer than about 1,000 training problems, verification does not help much.<\/li><li>A student asks whether the two curves cross again at very large data; the lecturer expects convergence rather than a perpetual gap.<\/li><\/ul>","terms":["verification","fine-tuning","data scale","6B","175B"]},"zh":{"title":"消融：验证 vs 直接微调","problem":"尚不清楚单独的验证器是否优于直接在数据上微调生成器。","why":"这一比较决定了额外的验证器与采样开销是否值得。","how":"在不同训练集规模下，于 6B 和 175B 模型上比较基于验证的选择与有监督微调。","detail":"<p>论文在 6B 和 175B 规模（175B 模型属于 GPT-3 级模型）下比较验证与普通有监督微调，并扫描验证器训练数据量的变化。测试时，验证系统采样大量解答，并给出验证器得分最高的那个。<\/p><ul><li>对两种模型规模，随着验证器训练集增大，验证都会胜出，最终超过仅微调的方法，因此两条曲线会交叉。<\/li><li>数据较少时微调胜出；对 175B 模型，当训练题数少于约 1,000 时，验证帮助不大。<\/li><li>有学生问到在数据极大时两条曲线是否会再次交叉；讲师预期二者会收敛，而不是长期保持差距。<\/li><\/ul>","terms":["验证","微调","数据规模","6B","175B"]}},{"t":777,"figs":[{"t":832,"file":"slides/part03/slide_018.jpg"}],"en":{"title":"Generator vs verifier capacity: who should be bigger","problem":"How should model capacity be split between the generator and the verifier.","why":"If generation is on average harder than verification, capacity should favor the generator.","how":"Compare a larger generator with a smaller verifier against the reverse configuration.","detail":"<p>The ablation tests two assignments: a larger generator with a smaller verifier, versus a smaller generator with a larger verifier. The larger generator plus smaller verifier wins, which is intuitive if generation is on average harder than verification.<\/p><ul><li>Finding the Pareto-optimal size ratio between generator and verifier is flagged as an open research question, especially as base generators improve rapidly.<\/li><li>Many off-the-shelf verifier and reward models now exist, with leaderboards for testing them, so the question becomes how to select and size them against a chosen generator.<\/li><li>This reframes verification as a capacity-budget allocation problem rather than defaulting to a big verifier.<\/li><\/ul>","terms":["generator size","verifier size","Pareto optimal","reward model leaderboard"]},"zh":{"title":"生成器 vs 验证器的容量：谁应该更大","problem":"模型容量应如何在生成器与验证器之间分配。","why":"如果生成平均而言比验证更难，那么容量应偏向生成器。","how":"将“更大的生成器配更小的验证器”与相反配置进行比较。","detail":"<p>该消融测试了两种分配：较大的生成器搭配较小的验证器，与较小的生成器搭配较大的验证器。前者胜出，如果生成平均而言比验证更难，这一结果符合直觉。<\/p><ul><li>寻找生成器与验证器之间的 Pareto 最优规模比被列为一个开放研究问题，尤其是在基础生成器快速改进的背景下。<\/li><li>如今已有许多现成的验证器和奖励模型，并有用于测试它们的排行榜，因此问题变成了如何针对选定的生成器来挑选它们并确定其规模。<\/li><li>这把验证重新定义为一个容量预算分配问题，而不是默认采用一个大的验证器。<\/li><\/ul>","terms":["生成器规模","验证器规模","Pareto 最优","奖励模型排行榜"]}},{"t":859,"figs":[{"t":883,"file":"slides/part03/slide_019.jpg"}],"en":{"title":"Test-time scaling of the verifier and the generation-verification gap","problem":"Selection accuracy must keep improving as more samples are drawn, otherwise extra compute is wasted.","why":"Measuring where the verifier stops tracking isolates the generation-verification gap.","how":"Increase completions per problem and use the verifier highest score, comparing against per-problem ground truth.","detail":"<p>Sweeping completions per problem, the verifier keeps improving accuracy up to roughly 400 samples, after which gains flatten; at around 800 the verifier fails to track which solutions are best relative to the true distribution. Evaluation takes the highest-scoring of the N solutions and checks it against per-problem ground truth.<\/p><ul><li>Context from the previous lecture: majority voting fails after roughly 10 to 50 samples even though coverage keeps rising, and that setting never usefully reached 50 samples.<\/li><li>The verifier extends the useful range from tens of samples to hundreds, directly narrowing the generation-verification gap in end-to-end accuracy rather than coverage.<\/li><li>This motivates later work that scales the verifier itself rather than only the generator.<\/li><\/ul>","terms":["test-time scaling","majority voting","coverage","pass@k","verifier accuracy"]},"zh":{"title":"验证器的 test-time scaling 与 generation-verification gap","problem":"随着采样增多，选择准确率必须持续提升，否则额外的算力就被浪费了。","why":"测量验证器在何处停止跟踪，可以分离出 generation-verification gap。","how":"增加每道题的 completion 数量并使用验证器的最高得分，与每道题的 ground truth 进行比较。","detail":"<p>扫描每道题的 completion 数量后发现，验证器的准确率持续提升到约 400 个样本，之后增益趋于平缓；在约 800 时，验证器已无法相对于真实分布跟踪哪些解答最好。评测取 N 个解答中得分最高者，并与每道题的 ground truth 核对。<\/p><ul><li>上一讲的背景：尽管覆盖率持续上升，多数投票在约 10 到 50 个样本后就会失效，而那一设置从未真正有效地达到 50 个样本。<\/li><li>验证器把有效范围从几十个样本扩展到几百个，直接在端到端准确率（而非覆盖率）上收窄了 generation-verification gap。<\/li><li>这推动了后续工作：不只扩展生成器，也扩展验证器本身。<\/li><\/ul>","terms":["test-time scaling","多数投票","覆盖率","pass@k","验证器准确率"]}},{"t":1037,"figs":[],"en":{"title":"Paper 1 discussion: why accuracy drops, and stopping at 100","problem":"Accuracy falls after roughly 400 samples even though more samples cannot reduce coverage.","why":"Explains the precision limit of the verifier as a selector.","how":"Examine score separability as the candidate pool grows.","detail":"<p>Asked why accuracy drops after 400, the lecturer explains that coverage is not the issue: as the pool grows to 800, the verifier must separate near-tied solutions, and two solutions very close in score - one correct, one not - cannot be distinguished as reliably as at 400. That loss of precision causes the drop.<\/p><ul><li>In the deployed system they stopped at 100 samples, where most of the gains occur and results are consistent.<\/li><li>A student asks whether scaling the verifier is worthwhile; yes, and verifier test-time scaling is covered in later slides.<\/li><li>Design lesson: verifier sharpness, not generator coverage, caps accuracy at large sample counts.<\/li><\/ul>","terms":["precision","ranking","coverage","verifier scaling"]},"zh":{"title":"论文 1 讨论：准确率为何下降，以及为何在 100 处停止","problem":"在约 400 个样本之后准确率下降，尽管更多样本不可能降低覆盖率。","why":"解释了验证器作为选择器的精度上限。","how":"考察候选池增大时得分可分性的变化。","detail":"<p>当被问到为什么在 400 之后准确率下降时，讲师解释说覆盖率并不是问题所在：当池子增大到 800 时，验证器必须区分得分接近的解答，而两个得分极为接近的解答——一个正确、一个错误——无法像在 400 时那样可靠地区分。正是这种精度的损失导致了下降。<\/p><ul><li>在实际部署的系统中，他们停在 100 个样本，因为大部分增益都发生在那里，且结果稳定。<\/li><li>有学生问扩展验证器是否值得；答
