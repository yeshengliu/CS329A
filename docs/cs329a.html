const saveProg = () => { try { S.ls.set(PROG_KEY, PROG); } catch (e) {} };
function entry(n) { const e = PROG[n]; return (e && typeof e === 'object') ? e : null; }
/* 兼容旧数据：cs329a:read 里的讲号 = 已学完 */
function pctOf(n) { const e = entry(n); if (e) return Math.max(0, Math.min(100, e.pct || 0)); return readSet.has(n) ? 100 : 0; }
function doneOf(n) { const e = entry(n); if (e && e.done) return true; return readSet.has(n) || pctOf(n) >= 100; }
function setPct(n, v, done) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  PROG[n] = { pct: v, done: done === undefined ? v >= 100 : !!done, t: Date.now() };
  if (PROG[n].done) readSet.add(n); else readSet.delete(n);
  saveProg(); S.ls.set('cs329a:read', [...readSet]);
}
function markDone(n) { setPct(n, 100, true); }
function resetPart(n) { delete PROG[n]; readSet.delete(n); saveProg(); S.ls.set('cs329a:read', [...readSet]); }
function totalStats() {
  let done = 0, sum = 0;
  for (const p of DATA.parts) { sum += pctOf(p.n); if (doneOf(p.n)) done++; }
  return { done, total: DATA.parts.length, pct: DATA.parts.length ? Math.round(sum / DATA.parts.length) : 0 };
}
/* 当前讲的阅读百分比：按最靠下的已滚过段落估算 */
function scrollPct(part) {
  const ps = $$('#reader .para'); if (!ps.length) return 0;
  /* 与配图页一致：某一段的底端完全划过视口顶端，才算这一段读过去了 */
  let i = 0;
  for (const p of ps) { if (p.getBoundingClientRect().bottom <= 0) i++; else break; }
  return Math.round(i / ps.length * 100);
}

/* ---------- 侧栏收缩 ---------- */
const mqMobile = () => matchMedia('(max-width:900px)').matches;
function setSidebar(collapsed, persist) {
  document.body.classList.toggle('sbcol', collapsed);
  const b = $('#sbToggle');
  if (b) b.setAttribute('aria-expanded', String(!collapsed));
  const btn = $('#btnSide'); if (btn) btn.classList.toggle('on', collapsed);
  if (persist) { try { localStorage.setItem('cs329a:sb', collapsed ? 'col' : 'open'); } catch (e) {} }
}
function initSidebar() {
  let saved = null; try { saved = localStorage.getItem('cs329a:sb'); } catch (e) {}
  setSidebar(saved ? saved === 'col' : mqMobile(), false);
  matchMedia('(max-width:900px)').addEventListener('change', e => {
    let s2 = null; try { s2 = localStorage.getItem('cs329a:sb'); } catch (err) {}
    if (!s2) setSidebar(e.matches, false);
  });
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return (h ? h + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yt = (id, t) => `https://www.youtube.com/watch?v=${id}&t=${Math.floor(t)}s`;
const noteKey = n => `cs329a:note:${n}`;

function markText(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function snippet(text, q, span = 190) {
  const i = text.toLowerCase().indexOf(q);
  let s = Math.max(0, i - 60), e = Math.min(text.length, i + q.length + span);
  let out = (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
  return markText(out, q);
}

/* ---------- sidebar ---------- */
function renderParts() {
  $('#partlist').innerHTML = DATA.parts.map(p => {
    const read = doneOf(p.n), note = !!S.ls.get(noteKey(p.n), ''), pct = pctOf(p.n);
    return `<button class="partitem${read ? ' read' : ''}" data-n="${p.n}">
      <span class="num">${p.n}</span>
      <span><span class="tt">${esc(p.title)}</span><span class="mt">${fmt(p.duration)} · ${p.paras.length} 段</span>
        <span class="pitem-prog"><span class="t"><i style="width:${pct}%"></i></span><span class="c">${pct}%</span></span>
      </span>
      <span class="badges"><span class="dot ${read ? 'on' : ''}" title="已学完"></span><span class="dot note ${note ? 'on' : ''}" title="有笔记"></span></span>
    </button>`;
  }).join('');
  $$('.partitem').forEach(b => b.onclick = () => openPart(+b.dataset.n));
  renderOverall();
}
function renderOverall() {
  const st = totalStats();
  const box = $('#sbprog');
  if (box) box.innerHTML = `<div class="row"><span>总体进度</span><b>${st.pct}%</b></div>
    <div class="row" style="margin-top:3px"><span>${st.done}/${st.total} 讲已学完</span></div>
    <div class="t"><i style="width:${st.pct}%"></i></div>`;
  const rf = $('#railF'); if (rf) rf.style.height = st.pct + '%';
  const rp = $('#railP'); if (rp) rp.textContent = st.pct + '%';
}

function renderOutline(part) {
  if (!part.outline.length) { $('#outlinebox').hidden = true; return; }
  $('#outlinebox').hidden = false;
  $('#outlinelist').innerHTML = part.outline.map((o, i) =>
    `<button class="olink" data-t="${o.t}" data-i="${i}" title="${fmt(o.t)}">${fmt(o.t)} · ${esc(o.label)}</button>`).join('');
  $$('#outlinelist .olink').forEach(b => b.onclick = () => gotoTime(+b.dataset.t));
}

/* ---------- reader ---------- */
function openPart(n, opts = {}) {
  const part = DATA.parts.find(p => p.n === n); if (!part) return;
  S.part = part;
  renderParts();
  const prev = DATA.parts.find(p => p.n === n - 1), next = DATA.parts.find(p => p.n === n + 1);
  $('#main').innerHTML = `
    <div class="phead">
      <h1>Part ${part.n} · ${esc(part.title)}</h1>
      <div class="pmeta">
        <span class="pill">${fmt(part.duration)}</span>
        <span class="pill">${part.paras.length} 段</span>
        <a class="pill" href="${yt(part.id, 0)}" target="_blank" rel="noopener">在 YouTube 打开 ↗</a>
        <a class="pill" href="${DATA.source}" target="_blank" rel="noopener">课程播放列表 ↗</a>
      </div>
    </div>
    <div class="pbar">
      ${prev ? `<button class="tbtn" data-go="${prev.n}">← Part ${prev.n}</button>` : ''}
      ${next ? `<button class="tbtn" data-go="${next.n}">Part ${next.n} →</button>` : ''}
      <button class="tbtn" id="markDone">${doneOf(n) ? '标记未学完' : '标记本讲学完'}</button>
      <button class="tbtn" id="openNotes">本讲笔记</button>
      <button class="tbtn" id="toTop">回到顶部</button>
    </div>
    <div class="pread" id="pread"></div>
    ${part.outline.length ? `<div class="chips">${part.outline.map(o =>
      `<button class="chip" data-t="${o.t}"><b>${fmt(o.t)}</b>${esc(o.label)}</button>`).join('')}</div>` : ''}
    <div id="reader"></div>`;
  $('#reader').innerHTML = part.paras.map((p, i) =>
    `<p class="para" id="p-${part.n}-${i}" data-i="${i}" data-t="${p.t}">
       <a class="ts" href="${yt(part.id, p.t)}" target="_blank" rel="noopener" title="在视频 ${fmt(p.t)} 处打开">${fmt(p.t)}</a><span class="txt">${esc(p.text)}</span>
     </p>`).join('');
  renderOutline(part);
  $$('#main [data-go]').forEach(b => b.onclick = () => openPart(+b.dataset.go));
  $$('#main .chip').forEach(b => b.onclick = () => gotoTime(+b.dataset.t));
  $('#markDone').onclick = () => { doneOf(n) ? resetPart(n) : markDone(n); openPart(n); };
  $('#openNotes').onclick = openNotes;
  $('#toTop').onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
  document.body.classList.toggle('compact', S.compact);
  document.body.classList.toggle('nots', !S.ts);
  history.replaceState(null, '', `#p${n}`);
  paintRead(n);
  setupSpy();
  setupReadTrack(n);
  setupPosTrack(n);
  /* 回到本讲上次读到的段落；没有记录就从顶部开始。搜索结果跳转时以目标段落为准。 */
  restorePosition(opts.highlight != null ? opts.highlight : POS[n]);

}

/* 回到上次读到的段落；定位后校正一次，避免懒加载/布局变化把位置带偏 */
let restoringUntil = 0;
function restorePosition(idx) {
  restoringUntil = Date.now() + 1400;
  setTimeout(() => { restoringUntil = 0; }, 1200);
  if (!S.part) { scrollTo({ top: 0, behavior: 'auto' }); return; }
  /* 没有记录，或记录就是第一段：确定性回到顶部（不继承上一讲的像素偏移） */
  if (idx == null || idx <= 0) {
    scrollTo({ top: 0, behavior: 'auto' });
    setTimeout(() => { if (scrollY > 80) scrollTo({ top: 0, behavior: 'auto' }); }, 200);
    return;
  }
  const go = () => {
    const el = $(`#p-${S.part.n}-${idx}`);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'auto' });
  };
  go();
  setTimeout(go, 200);
}
/* 记住当前读到的段落（视口上方最靠下的那一段） */
let posH = null, posT = null;
function setupPosTrack(n) {
  if (posH) removeEventListener('scroll', posH);
  posH = () => {
    clearTimeout(posT);
    posT = setTimeout(() => {
      if (!S.part || S.part.n !== n) return;
      /* 校正位置期间不要写记忆，否则「路过顶部」会被误记成位置 0 */
      if (Date.now() < restoringUntil) return;
      if (!readArmed) return;   /* 用户还没自己滚动过，不要写记忆 */
      if (scrollY < 40) { POS[n] = 0; savePos(); return; }
      const ps = $$('#reader .para'); if (!ps.length) return;
      const line = scrollY + 90;
      let cur = 0;
      for (const p of ps) { if (p.offsetTop <= line) cur = +p.dataset.i; else break; }
      POS[n] = cur; savePos();
    }, 300);
  };
  addEventListener('scroll', posH, { passive: true });
}

/* 本讲进度条：滚到哪儿就记到哪儿，只增不减（除非用户重置） */
function paintRead(n) {
  const box = $('#pread'); if (!box || !S.part) return;
  const pct = pctOf(S.part.n), total = S.part.paras.length;
  const at = Math.round(total * pct / 100);
  box.innerHTML = `<span>本讲进度</span><span class="t"><i style="width:${pct}%"></i></span>
    <b style="color:var(--acc2);font:12px var(--mono)">${pct}%</b>
    <span>约 ${at}/${total} 段</span>${doneOf(S.part.n) ? '<span style="color:var(--acc2)">✓ 已学完</span>' : ''}`;
  renderOverall();
  renderParts();
}
/* 触底停留 5 秒才算「学完」；中途滚走取消计时，再次触底重新计 */
const BOTTOM_HOLD_MS = 5000;
let bottomTimer = null;
function atDocBottom() {
  return scrollY + innerHeight >= document.documentElement.scrollHeight - 8;
}
function cancelBottomTimer() { if (bottomTimer) { clearTimeout(bottomTimer); bottomTimer = null; } }
function scheduleBottomDone(n) {
  if (doneOf(n)) { cancelBottomTimer(); return; }
  if (!readArmed || Date.now() < restoringUntil || !atDocBottom()) { cancelBottomTimer(); return; }
  /* 每次 scroll 事件都重置：只有真正在底部停住 5 秒才算学完 */
  cancelBottomTimer();
  bottomTimer = setTimeout(() => {
    bottomTimer = null;
    if (!S.part || S.part.n !== n) return;
    if (!readArmed || Date.now() < restoringUntil) return;
    if (!atDocBottom()) return;
    markDone(n); paintRead(n);
  }, BOTTOM_HOLD_MS);
}
let readDecks = [], readArmed = false;
function setupReadTrack(n) {
  if (readDecks.length) { readDecks.forEach(t => clearTimeout(t)); }
  readDecks = [];
  cancelBottomTimer();
  readArmed = false;          /* 切讲后等用户真的滚动过，再开始记进度 */
  let saveTimer = null;
  if (readDecks.h) removeEventListener('scroll', readDecks.h);
  const h = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (!S.part || S.part.n !== n) return;
      if (Date.now() < restoringUntil) return;   /* 恢复定位途中不记 */
      if (!readArmed) return;                    /* 用户还没自己滚动过，不记 */
      const pct = scrollPct(S.part);
      if (pct > pctOf(n)) { setPct(n, pct, false); paintRead(n); }
      scheduleBottomDone(n);   /* 触底停留 5 秒才算学完 */
    }, 320);
  };
  readDecks.h = h;
  addEventListener('scroll', h, { passive: true });
}
/* 用户自己滚动/按键才算数；程序化定位（切讲恢复、搜索跳转、目录跳转）不算 */
(() => {
  const arm = () => { if (Date.now() >= restoringUntil) readArmed = true; };
  addEventListener('wheel', arm, { passive: true });
  addEventListener('touchmove', arm, { passive: true });
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key) >= 0) arm();
  });
})();

function flash(el) { el.classList.add('hit', 'flash'); setTimeout(() => el.classList.remove('flash'), 1500); }
/* 程序化跳转（目录/时间点/搜索）期间不记进度，避免「跳过去」被当成「读过了」 */
function suppressRead(ms) { restoringUntil = Math.max(restoringUntil, Date.now() + (ms || 1200)); }
function gotoTime(t, exact = false) {
  suppressRead(1500);
  const paras = S.part.paras; let best = 0;
  for (let i = 0; i < paras.length; i++) if (paras[i].t <= t + (exact ? 0.5 : 0)) best = i;
  const el = $(`#p-${S.part.n}-${best}`); if (!el) return;
  el.scrollIntoView({ block: 'start' }); flash(el);
}

let spy;
function setupSpy() {
  if (spy) spy.disconnect();
  const links = $$('#outlinelist .olink'); if (!links.length) return;
  spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const t = +en.target.dataset.t, cur = +$('.olink.active')?.dataset.t || -1;
        let sel = links.filter(l => +l.dataset.t <= t); sel = sel[sel.length - 1];
        if (sel && sel.dataset.t !== String(cur)) { links.forEach(l => l.classList.remove('active')); sel.classList.add('active'); }
      }
    });
  }, { rootMargin: '-70px 0px -75% 0px' });
  $$('#reader .para').forEach(p => spy.observe(p));
}

/* ---------- search ---------- */
let lastQ = '';
function doSearch(q) {
  q = q.trim().toLowerCase(); lastQ = q;
  if (!q) { $('#searchResults').innerHTML = '<div class="nores">输入关键词开始搜索。</div>'; $('#searchMeta').textContent = ''; return; }
  const out = [];
  for (const part of DATA.parts) {
    part.paras.forEach((p, i) => {
      if (p.text.toLowerCase().includes(q)) out.push({ part, i, p });
    });
  }
  $('#searchMeta').textContent = `${out.length} 处匹配`;
  if (!out.length) { $('#searchResults').innerHTML = '<div class="nores">没有找到匹配，试试更短的关键词。</div>'; return; }
  $('#searchResults').innerHTML = out.slice(0, 500).map(r =>
    `<button class="result" data-n="${r.part.n}" data-i="${r.i}">
       <div class="rq">Part ${r.part.n} · <b>${fmt(r.p.t)}</b> · ${esc(r.part.title)}</div>
       <div class="rt">${snippet(r.p.text, q)}</div>
     </button>`).join('') + (out.length > 500 ? '<p class="nores">仅显示前 500 条。</p>' : '');
  $$('#searchResults .result').forEach(b => b.onclick = () => {
    closePanels(); openPart(+b.dataset.n, { highlight: +b.dataset.i });
  });
}

/* ---------- glossary ---------- */
function renderGlossary() {
  const g = DATA.glossary;
  const paint = (box, items) => {
    box.innerHTML = items.map(x => `<button class="gtag" data-term="${esc(x.term)}">${esc(x.term)}<i>${x.count}</i></button>`).join('');
  };
  paint($('#gAcro'), g.acronyms); paint($('#gConc'), g.concepts);
  $('#gstat').textContent = `${g.acronyms.length} 个缩写 · ${g.concepts.length} 个概念/短语（点击即搜索，数字为出现次数）`;
  $$('.gtag').forEach(b => b.onclick = () => {
    const term = b.dataset.term; closePanels(); $('#q').value = term; doSearch(term); openPanel('searchPanel');
  });
  $('#gfilter').oninput = e => {
    const f = e.target.value.trim().toLowerCase();
    paint($('#gAcro'), g.acronyms.filter(x => x.term.toLowerCase().includes(f)));
    paint($('#gConc'), g.concepts.filter(x => x.term.toLowerCase().includes(f)));
    $$('.gtag').forEach(b => b.onclick = () => { const t = b.dataset.term; closePanels(); $('#q').value = t; doSearch(t); openPanel('searchPanel'); });
  };
}

/* ---------- notes ---------- */
function openNotes() {
  if (!S.part) return;
  $('#notesTitle').textContent = `笔记 · Part ${S.part.n} · ${S.part.title}`;
  $('#notesArea').value = S.ls.get(noteKey(S.part.n), '');
  updateNotesStat();
  openPanel('notesPanel');
  setTimeout(() => $('#notesArea').focus(), 200);
}
function updateNotesStat() {
  const v = $('#notesArea').value;
  $('#notesStat').textContent = `${v.length} 字符 · 自动保存`;
}
let noteTimer;
function onNotesInput() {
  updateNotesStat();
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    S.ls.set(noteKey(S.part.n), $('#notesArea').value);
    $('#notesStat').textContent = '已保存 ✓';
    renderParts();
  }, 400);
}
$('#notesArea').addEventListener('input', onNotesInput);
$('#notesExport').onclick = () => {
  let md = `# CS329A 笔记\n\n`;
  for (const p of DATA.parts) {
    const v = S.ls.get(noteKey(p.n), ''); if (!v) continue;
    md += `## Part ${p.n} · ${p.title}\n\n${v}\n\n`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
  a.download = 'cs329a-notes.md'; a.click();
};
$('#notesClear').onclick = () => {
  if (!S.part || !confirm('清空本讲笔记？')) return;
  S.ls.set(noteKey(S.part.n), ''); $('#notesArea').value = ''; updateNotesStat(); renderParts();
};

/* ---------- panels / misc ---------- */
function openPanel(id) { $('#overlay').classList.add('open'); $('#' + id).classList.add('open'); }
function closePanels() { $('#overlay').classList.remove('open'); $$('.panel').forEach(p => p.classList.remove('open')); }
$('#overlay').onclick = closePanels;
$$('[data-close]').forEach(b => b.onclick = closePanels);
$('#btnGlossary').onclick = () => openPanel('glossaryPanel');
$('#btnNotes').onclick = openNotes;
$('#btnTheme').onclick = () => {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = cur; S.ls.set('cs329a:theme', cur);
};

let searchTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { doSearch(e.target.value); if (e.target.value.trim()) openPanel('searchPanel'); }, 160);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q') && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closePanels();
  if (document.activeElement.tagName === 'TEXTAREA') return;
  if (e.key === 'j' || e.key === 'k') {
    const ps = $$('#reader .para'); if (!ps.length) return;
    const top = scrollY + 90;
    if (e.key === 'j') { const n = ps.find(p => p.offsetTop > top + 4); if (n) n.scrollIntoView({ block: 'start' }); }
    else { const n = [...ps].reverse().find(p => p.offsetTop < top - 60); if (n) n.scrollIntoView({ block: 'start' }); }
  }
});
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  $('#progress').style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
});
addEventListener('hashchange', () => { const m = location.hash.match(/^#p(\d+)/); if (m) openPart(+m[1]); });

/* ---------- boot ---------- */
function boot() {
  document.documentElement.dataset.theme = S.ls.get('cs329a:theme', 'dark');
  initSidebar();
  $('#sbToggle').onclick = () => setSidebar(!document.body.classList.contains('sbcol'), true);
  $('#btnSide').onclick = () => setSidebar(!document.body.classList.contains('sbcol'), true);
  renderParts(); renderGlossary();
  const m = location.hash.match(/^#p(\d+)/);
  if (m) openPart(+m[1]);
}
boot();
</script>
