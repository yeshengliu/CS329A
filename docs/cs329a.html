<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS329A · Self-Improving AI Agents · 学习文档</title>
<style>
:root{
  --bg:#0f1117; --bg2:#151823; --bg3:#1c2030; --line:#272c3d;
  --fg:#e6e9f2; --fg2:#a7aec4; --fg3:#6f7793;
  --acc:#7aa2ff; --acc2:#5ee1c4; --warn:#ffb86b; --hit:#3a4a2f; --hit2:#c8f08a;
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f6f7fb; --bg2:#ffffff; --bg3:#eef1f7; --line:#dfe3ee;
  --fg:#1a1f2e; --fg2:#4b5468; --fg3:#8b93a7;
  --acc:#2f5fd0; --acc2:#0e8a72; --warn:#b06000; --hit:#fff2b8; --hit2:#7a5b00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:60;transition:width .1s}

header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--fg3);font-size:11px;letter-spacing:.4px}
.searchwrap{position:relative;flex:1;max-width:620px}
.searchwrap input{width:100%;padding:9px 34px 9px 36px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg);outline:none}
.searchwrap input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.searchwrap .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.searchwrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--mono);
  color:var(--fg3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.tbtn{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--fg2);font-size:13px;white-space:nowrap}
.tbtn:hover{color:var(--fg);border-color:var(--acc)}
.tbtn.on{color:var(--acc);border-color:var(--acc)}

.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:0;min-height:calc(100vh - 58px);
  transition:grid-template-columns .2s ease}
body.sbcol .layout{grid-template-columns:46px minmax(0,1fr)}
body.sbcol main{max-width:none}
#sidebar{position:relative;min-width:0}
#sbToggle{position:absolute;top:10px;left:10px;z-index:2;width:26px;height:26px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg2);color:var(--fg2);font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#sbToggle:hover{color:var(--fg);border-color:var(--acc)}
#sbToggle .g{transition:transform .2s ease}
body.sbcol #sbToggle .g{transform:rotate(180deg)}
aside{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto;
  border-right:1px solid var(--line);background:var(--bg2);padding:14px;transition:padding .2s ease}
body.sbcol aside{padding:46px 4px 20px;overflow:hidden}
body.sbcol aside .sbody{opacity:0;pointer-events:none;width:0;height:0;overflow:hidden;
  transition:opacity .12s ease}
.rail{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .14s ease .06s}
body.sbcol .rail{opacity:1}
.rail .rt{writing-mode:vertical-rl;font-size:10.5px;letter-spacing:1.6px;color:var(--fg3);text-transform:uppercase}
.rail .rb{flex:1;width:4px;border-radius:99px;background:var(--bg3);overflow:hidden;display:flex;align-items:flex-end;min-height:40px}
.rail .rb i{display:block;width:100%;height:0;background:linear-gradient(180deg,var(--acc),var(--acc2));transition:height .25s}
.rail .rp{font:10px var(--mono);color:var(--acc)}
aside h4{margin:6px 6px 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--fg3)}
.partitem{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:start;width:100%;
  text-align:left;padding:9px 10px;border-radius:10px;color:var(--fg2);margin-bottom:3px}
.pitem-prog{display:flex;align-items:center;gap:7px;margin-top:5px}
.pitem-prog .t{flex:1;height:3px;border-radius:99px;background:var(--bg3);overflow:hidden}
.pitem-prog .t i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.pitem-prog .c{font:10.5px var(--mono);color:var(--fg3)}
.partitem.read .pitem-prog .t i{background:var(--acc2)}
.partitem.read .pitem-prog .c{color:var(--acc2)}
.sbprog{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;margin:4px 0 12px}
.sbprog .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;color:var(--fg3)}
.sbprog .row b{font:12px var(--mono);color:var(--acc2)}
.sbprog .t{height:5px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:7px}
.sbprog .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s}
.partitem:hover{background:var(--bg3);color:var(--fg)}
.partitem.active{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--fg)}
.partitem .num{font:12px/1.5 var(--mono);color:var(--fg3);padding-top:1px}
.partitem.active .num{color:var(--acc)}
.partitem .tt{font-size:13.5px;line-height:1.35}
.partitem .mt{font-size:11px;color:var(--fg3);margin-top:2px}
.badges{display:flex;gap:5px;align-items:center;padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc2);display:none}
.dot.on{display:block}
.dot.note{background:var(--warn)}

.outline{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.olink{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;color:var(--fg3);font-size:12.5px;
  border-left:2px solid transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olink:hover{color:var(--fg);background:var(--bg3)}
.olink.active{color:var(--acc);border-left-color:var(--acc)}

main{padding:26px 30px 120px;max-width:1080px}
.phead{margin-bottom:14px}
.phead h1{margin:0 0 6px;font-size:27px;line-height:1.25}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--fg3);font-size:13px;align-items:center}
.pmeta .pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg2)}
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px;border-top:1px solid var(--line);padding:10px 0 0}
.pread{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 20px;
  border-bottom:1px solid var(--line);padding:0 0 10px;font-size:12.5px;color:var(--fg3)}
.pread .t{width:150px;height:4px;border-radius:99px;background:var(--bg3);overflow:hidden}
.pread .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .25s}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.chip{font-size:12.5px;color:var(--fg2);border:1px solid var(--line);background:var(--bg2);
  border-radius:999px;padding:4px 11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip b{color:var(--fg3);font:11px var(--mono);margin-right:6px}

.para{margin:0 0 10px;padding:4px 8px 4px 6px;border-radius:8px;scroll-margin-top:76px}
.para .ts{font:11.5px/1 var(--mono);color:var(--fg3);margin-right:9px;vertical-align:1px;user-select:none}
.para .ts:hover{color:var(--acc)}
.para .txt{color:var(--fg)}
body.nots .para .ts{display:none}
body.compact .para{margin-bottom:3px}
body.compact .para .txt{color:var(--fg2)}
.para.hit{background:color-mix(in srgb,var(--acc) 12%,transparent);outline:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.para.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--acc) 30%,transparent)}100%{background:transparent}}
mark{background:var(--hit);color:var(--hit2);border-radius:3px;padding:0 2px}

.empty{padding:80px 10px;text-align:center;color:var(--fg3)}
.empty h2{color:var(--fg2)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(680px,94vw);background:var(--bg2);
  border-left:1px solid var(--line);z-index:80;transform:translateX(102%);transition:transform .22s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header h3{margin:0;font-size:16px;flex:1}
.panel .body{overflow:auto;padding:16px}
.panel footer{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}
.close{font-size:20px;color:var(--fg3);line-height:1;padding:2px 6px}
.close:hover{color:var(--fg)}

.result{width:100%;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid transparent;display:block;margin-bottom:6px}
.result:hover{background:var(--bg3);border-color:var(--line)}
.result .rq{font-size:11.5px;color:var(--fg3);font:11.5px var(--mono);margin-bottom:3px}
.result .rq b{color:var(--acc)}
.result .rt{font-size:13.5px;color:var(--fg2)}
.result .rt mark{color:var(--hit2)}
.nores{color:var(--fg3);padding:20px 4px}

.gsec{margin-bottom:22px}
.gsec h4{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3)}
.gtags{display:flex;gap:7px;flex-wrap:wrap}
.gtag{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg2)}
.gtag:hover{border-color:var(--acc2);color:var(--fg)}
.gtag i{font-style:normal;color:var(--fg3);font:11px var(--mono);margin-left:6px}
.gfilter{width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-bottom:16px}

textarea.notes{width:100%;min-height:220px;resize:vertical;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:10px;padding:11px;line-height:1.6}
.stat{color:var(--fg3);font-size:12.5px;margin-top:8px}

@media(max-width:900px){
  .layout,body.sbcol .layout{grid-template-columns:1fr}
  #sidebar{position:static;border-bottom:1px solid var(--line)}
  aside{position:static;height:auto;max-height:none;border-right:0;border-bottom:0}
  body.sbcol aside{display:none}
  body.sbcol #sidebar{border-bottom:0}
  #sbToggle{position:static;width:auto;height:26px;padding:0 10px;font-size:12px;gap:6px}
  #sbToggle .g{transform:none!important}
  .rail{display:none}
  main{padding:18px}
  .brand small{display:none}
}
@media print{#sidebar,#sbToggle,.rail,.pread{display:none!important}}
@media(max-width:640px){
  header.top{position:static;flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{order:1;flex:1 1 auto;font-size:15px}
  .brand small{display:none}
  .tools{order:2;margin-left:0;gap:5px;flex:0 0 auto}
  .tbtn{padding:6px 9px;font-size:12.5px}
  .searchwrap{order:3;flex:1 1 100%;max-width:none;margin-left:0}
  .searchwrap kbd{display:none}
  main{padding:16px 14px 90px}
  .phead h1{font-size:23px}
}
</style>
</head>
<body>

      <div class="sbody">

          <div id="outlinelist"></div>

      </div>

        <span class="rt">Progress</span>
        <span class="rb"><i id="railF"></i></span>
        <span class="rp" id="railP">0%</span>

  <main id="main"><div class="empty"><h2>选择左侧任意一讲开始</h2><p>字幕已全部离线内嵌，可直接搜索、跳转、记笔记。</p></div></main>
</div>

  <header><h3>搜索结果</h3><span id="searchMeta" style="color:var(--fg3);font-size:12.5px"></span><button class="close" data-close>×</button></header>

</section>

<script>
const DATA = {"course":"Stanford CS329A — Self-Improving AI Agents","source":"https://www.youtube.com/playlist?list=PLangBM27OtEA","parts":[{"n":1,"id":"6YnLB0XbTnI","title":"Course Overview","file":"01 - Course Overview.srt","duration":4178,"paras":[{"t":5.52,"e":59.2,"text":"Welcome everyone to fall quarter and welcome to CS 329A. I hope you made it to the right class. This class is on self-improving AI agents. Anyone made it to the right class here? Yes? Okay. How many of you are here and doing masters at Stanford? PhD? A few of you and then undergrad? Okay. So masters is the big crowd here. >> There's a good balance. Yeah. >> It's a really good balance. Uh So we'll introduce ourselves. So I'm Akanksha. I have been working in large language models for a while and I'm an adjunct professor at Stanford and I'm also in research at a startup called Reflection AI. >> Hi, I'm Azalia Mirhoseini. I'm a I'm an"},{"t":56.12,"e":105.28,"text":"assistant professor in the CS department and Akanksha and I met each other when we were at Google Google Brain Google Brain. Yeah, back in the day and then Google DeepMind. And I also worked on Cod and Anthropic and Gemini at Google DeepMind and we are so excited to teach this course again. This is the second time we're teaching. Of course, we have made some updates both to the lectures and also the way we are kind of conducting everything during the the for the course. And we are we were just so amazed by the amount of interest for people to join this course. So we are excited to have you here. >> The course website is at"},{"t":102.88,"e":147.88,"text":"cs329a.stanford.edu. We have updated the website in terms of all the lecture materials and and the papers that you'll be reading as well as what's the homework schedule to expect the project proposal and project structures as well. So, in today's lecture we'll start with an overview of large language models. Just how the scaling trends have evolved over the last 5 years and then we'll focus more on what we will cover in this class. And then from there in the second half of the this lecture we'll cover the course logistics and that part you should pay a lot of attention to because that influences your grades. So, let's take a look at an overview of"},{"t":145.84,"e":188.84,"text":"the trends for large language models. So, one of the aspects that has been mind-blowing since GP3 came out is that there is a as you scale up the number of parameters in a model they get better and what this means is that language models like BERT and T5 were good but as we increase the number of parameters they got really better. They they perform much better and what this led to is something called a scaling loss for large language models which are used in building the base model for the pre-trained base model as you increase the amount of compute. So, there are three graphs here. As you increase the amount of compute on the"},{"t":184.68,"e":228.32,"text":"x-axis the loss function on the y-axis goes down and and the more compute you have put in the more the test test loss goes down which leads to a better model. So, that was one big aspect that led to GP3 and then all the subsequent chat GPT, Palm, Gemini and so on. And then similarly as you increase the data set size on x-axis the test loss goes down further on y-axis. So, that's another aspect of like another axis of scaling that leads to better language models. And the fourth one is of course the third one is of course parameter count. So, if you increase the number of layers in a transformer or the amount of parameters"},{"t":226.2,"e":272.56,"text":"that are there in the language model that improves the loss our and that that leads to a better model. And then this has been the foundation for a lot of the this has been the foundation for a long time until last year where this was starting to hit some kind of a saturation point. So, from 2018 to almost 2024, this graph is a little bit outdated but from 2018 to 2024, the as the model size has gone up almost consistently, we have been increasing the the size of the model. So, we started with something like BERT was 340 million parameters, GPT-2 was 1.5 billion parameters, and then GPT-3 was 175 billion parameters, and then"},{"t":269.28,"e":309.0,"text":"PaLM was 540 billion, and then there was a bunch of subsequent models, and GPT-4 is estimated to be there which is like trillions of parameters. So, you can imagine that there has been an exponential growth in just the model size of for large language models. The large stands for that they're growing in size, and that has been one of the key areas in which the models have been getting better. So, why do we care about the models getting bigger? What does this lead to? So, as I was explaining that as the models get bigger, they continuously improve in performance on natural language benchmarks, on various other benchmarks, reasoning benchmarks, and so"},{"t":308.12,"e":350.4,"text":"on. And then other interesting aspect that I will show you in a moment is that they learn how to do few-shot learning. So, earlier you have to fine-tune the model for a specific domain, but just by giving a few examples, the model can follow that template and and reason in that same vein which makes it extremely easy to prototype things. And then the third aspect is that as the models become bigger, they have emergent behavior where the capabilities like reasoning only emerge in larger models. So, just to understand few-shot learning or zero-shot learning here. So, if if the model is given a question like or a task like translate English to"},{"t":349.32,"e":386.12,"text":"French, it's able to give So this is called a prompt. Like it's given a task translate English to French and then it's asked to translate cheese to whatever is the French word. If the model can predict the answer without actually being trained on the specific task, then that would be called zero-shot learning. And then few-shot learning, in addition to giving the description of the task, you're also giving a few examples. So in this particular case, it's given translate English to French and it's given a few examples of the translation from English translate cheese and it's able to translate that and you can see that this"},{"t":383.68,"e":427.08,"text":"capability shows up in the large language models across a large number of tasks and that has been one of the key areas that GPT-3 and Palm and other models enabled and then that subsequent innovations came from reasoning aspects of this. So on the reasoning side, as models have become bigger, they have this emergent behavior of reasoning which Azalia will tell us a little bit more about. >> So as the models become bigger, not only we have this kind of a predictive scaling laws property that we kind of know how the loss function's going to go down as we throw in more compute data and parameters in the model, there are"},{"t":423.04,"e":470.56,"text":"new kind of behaviors that appear in the model that they didn't have before and we never could predict that until we had these bigger models and saw these kind of behavior in them. And one of the most important one of those behaviors is the emergent is the chain of thought behavior. And for those of you who are not familiar with this, here is how it works. So in a usual prompt prompting of a model, we can ask a model in this case a a math problem and then we can give it a one-shot example. Here is a math problem, here is the answer. Now I ask you a similar but not exact and not exactly the same math problem, and the model is expected to"},{"t":468.92,"e":514.48,"text":"answer that. Um And the model might be able to use the the one-shot example or it might not be. But we can do better here by not only give an example in but also provide the reasoning or the chain of thought on how we got to that answer. So, in this case, the question is a very simple question. Roger has five tennis balls. He buys two more cans of tennis balls. Each can Each can has three tennis balls. How many How many total tennis balls does he have now? And instead of just saying 11, like we're walking the model through how to get to this. Um Roger started with five balls. Two cans of three tennis balls is six. And"},{"t":512.2,"e":561.08,"text":"uh 5 + 6 is 11. Uh And with this example, then the model has become familiar with the process to get to the answer, and it can leverage that to answer new problems. Well, obviously this is a very simple problem. Any like one-B parameter model nowadays can solve this. Doesn't need a an example or a few shot or a chain of thought. But the chain of thought property itself is a property that is holding to this day and it's a very very important property for the reasoning models and all the thinking models and all the prog and many much of the progress that we have seen um in the past year or so. Now, um this property again appears as we have"},{"t":558.88,"e":608.04,"text":"larger and larger models. Here are three models, Lambda, GPT, and PaLM. And as you can see, the chain of thought and this is some results on the math some math data set. And these models when they're smaller, like eight billion parameter for Lambda or um deep for GPT around 7 billion. They can't really benefit from chain of thought. Like it doesn't do anything for them. But as they become larger or for a palm model again at 8 billion, it can leverage this chain of thought property and learn from the reasoning that is and the the process that is provided in the context in order to solve problems better. And not only that, there are other kind"},{"t":605.6,"e":655.72,"text":"of abilities to solve new task as we increase the size of the models. Like for example, small models can all of a sudden solve mod arithmetics better or word unscramble problem just by having this larger size and this property. You see that all of a sudden it appears at a certain size. And because of all of this, we still as in frontier companies and labs are still interested in pushing the the the scaling laws and not only get the natural kind of progression, but also we are we we will see more and more of these kind of emergent behavior that we that is going to be very important. Now, a little bit of history here. So"},{"t":652.52,"e":708.52,"text":"chat GPT was launched in November 2022. Obviously, it was one of the most successful kind of apps or software ever created. The time to reach 1 million users for it was 5 days, which is significantly faster than any that many of the other famous software that you can see there or services that you can see there. And there were pieces of kind of innovation on top of just scaling up the parameter size of the model that were very important to make chat GPT what it was and to make that kind of leapfrog and over the previous models like GPT-3 and so on. And two two important piece here but were um the instruction tuning and um the"},{"t":706.88,"e":756.56,"text":"reinforcement learning from human feedback which which we're going to briefly mention in the next slides but throughout this course we're going to learn more and more about them. Um so let's first and then um we're going to learn about all of these in more details but let's just take a step back and see how the process works. So the pre-training step is the step that the the beginning of any language model training. Uh that's the easiest step and we just train the model to predict the next token out of all sort of text and data and so on. And then this is the fine-tuning step that was a key differentiating factor for a model like chat GPT. Um and let's"},{"t":753.88,"e":803.8,"text":"start with um uh the first aspect of fine fine-tuning which is kind of alignment between human preferences. So when a model is pre-trained it has no sense it has seen all data on the internet on the in the books everywhere but it has no sense of like what is right and wrong and what is it just  the past 2 years, this instruction tuning data is like a combination of human generated data or templates and then and then and the synthetic data. But, the way this instruction to fine-tuning works is that we do have instruction and then question answer pairs where the model learns how to follow the questions and answers them. For example, here an instruction for tuning data set could be about the"},{"t":947.32,"e":994.0,"text":"weather like please answer the following question. What is the boiling point of nitrogen? And then that this is the answer. Or, we can have chain of thought fine-tuning where we show the model how it can walk through a process to get to the answer. And then we have the label, we have the results over here. And this is like these pairs of like questions and instructions and answers. And again, this this data set is very um is is there's a lot of effort that goes into this data set and the quality of data set and the uh generality of it uh has a lot of impact on the quality of the model that we get at this stage. Um and after this point in the model"},{"t":990.56,"e":1038.52,"text":"becomes more and more like um like the models we see today. Like you can ask them questions, you can go back and forth with them. They they have this sense of like how to uh perceive a question and how to walk through kind of uh some sort of like process to get to to an answer. And the next step after instruction fine-tuning is this process of um using human preferences and fine-tuning the model based on that. And this process is called RLHF or reinforce reinforcement learning from human feedback. Um the way this is different from the previous system is the way we create the objective function and uh create the data. So, in this"},{"t":1035.8,"e":1086.88,"text":"case, instead of like just creating some supervised prompt and labels, we are basically creating a reward model out of human preferences. So, companies spend a lot of money uh asking humans, sometimes experts, sometimes just humans, normal humans, uh about questions and the answers generated by the model. And we ask the the humans to rate them to see which one is correct and is not correct. And that's how we can create some sort of a reward model here. Um and this reward model is instead instead of human, then we can use the reward model in order to kind of like guide the parameters of our LLM towards uh generating answers that are in line"},{"t":1084.92,"e":1126.56,"text":"with this reward model. So, basically, we want the the generations by the model uh to be such that this reward model says, \"Yes, these are good generations.\" Um we're going to learn more about this here, but I wanted We wanted to you to have um the high-level idea of what RLAIF means. Uh and we can collect We can have different reward type different types of reward. For example, we could ask the model to reward a pair of answers based on their correctness or helpfulness or specificity or harmlessness, all sort of reward functions that we can define. And depending on how we want the models to be and what we care most about, we can"},{"t":1124.2,"e":1175.4,"text":"weight these different reward models and kind of use that in the RLAIF process. So, these step at a at a high level, of course, there's a lot of effort goes into that, but like pre-training and then um fine-tuning on higher-quality data, instruction tuning, and RLAIF are were the core kind of components that made um a model like ChatGPT over over something that existed over all the large models like GPT-3 and prior models. So, that made the huge difference in how good and capable the models were. Um Uh so that was very cool up until last year or a year a year year and a half ago, pre-training and then fine-tuning were"},{"t":1173.8,"e":1224.88,"text":"the big pieces. Uh but since a year and a half ago, it turns out inference is also a frontier for making the models much more capable. Um and that opened like a whole set of whole lot of new research and directions and ways that we can make the model better. Um so let's think let's talk about it a little bit. Like this is a work we did in my lab last year uh last summer. It it was called large language monkeys. Um and it's kind of inspired by the infinite monkey theorem and it's related to inference scaling. Um how many of you have heard of the infinite monkey theorem? Okay, that's a good amount. So, the idea of the infinite monkey theorem uh what"},{"t":1223.2,"e":1271.48,"text":"it says is that it's not proven, but what it says is that if you have a monkey and a kind of a typing machine and then we keep letting the monkey type all day forever, um after some time you will have the works of William Shakespeare in in the things that the monkey types. Um so we were inspired by that to name our project. Uh but the idea here was that let's let's have the LLM be the monkey and uh let's uh ask the model over and over again to solve a given input problem. Uh you can think of it as parallel sampling or parallel generation. So, instead of asking the model once to solve the input problem, you can ask it"},{"t":1268.96,"e":1310.08,"text":"many times. And also, let's assume you have some sort of a verifier or selection mechanism, so you can pick which one of these generated responses were correct. Um and then you output that in your system. That becomes the out the final output. So, the model, instead of generating one answer, generates many, many answers. And then your verifier selects which one of them is correct and then outputs one of the correct ones. Um you can think of a verifier as, say, some unit tests. If the problem is a generating code, the verifier can could be the unit test that we run against the code and we see which which one of the"},{"t":1308.12,"e":1359.64,"text":"code generations passes all the unit tests and so on. Um The reason this is very This is a a This can be a possible possibility here is that models are um do not are not uh there is some variance in the data the models generate responses. It's not deterministic. And you can even control the variation in the model responses with this thing called temperature. So, you can force the model or encourage the model to generate more different responses as you ask a question. And here, now let's see some of the results of this repeated sampling. For a bunch of tasks like math and coding benchmarks, we increased the number of"},{"t":1356.4,"e":1411.12,"text":"samples per problem from one, this is the normal one, uh to 10,000. And here we are showing the coverage or the fraction of problems that are solved by at least one of these samples. And what we are seeing here is that um so the red line, the red dashed one, was the GPT-40 model. And while these blue and green lines, which were the llama 8B, llama 3 8B, and 7B, were worse than GPT for our model with one sample, but if we increase the number of samples from these models, in all of these cases, they do better than the GPT 4 model. And what it says is that it kind of seems like the model or models already know a whole lot more"},{"t":1409.28,"e":1451.28,"text":"than what you get out of them when you just ask them once, right? So, this is the kind of the underlying property of inference scaling because it seems like we can get a whole lot of a whole lot more capability and problem-solving kind of ability from these models if we just bring in this inference scaling. Here, you're showing repeated sampling, but there are many other ways to do that. And we are So, the reason it's called inference scaling is that we're not touching any of the parameters of the model. The model is fixed, and we are just like at inference time, we are creating different ways to generate to kind of produce generations from the"},{"t":1448.64,"e":1479.84,"text":"model and use them to generate higher-quality answers or answers to harder problems for the model. Um the interesting part here is that for some of these problems, out goal and then what this slide is showing you is that"},{"t":2635.52,"e":2674.2,"text":"one model is perhaps uh giving the output like a solution and then another model is judging it and then deciding based on that whether the solution should be accepted. So, that's like one orchestration framework that's possible. Uh Deep Research will be more of the second one where you're basically generating you're calling the LLM on multiple possible inputs and then aggregating these things to get the output which will be a summary of the deep research results. So, this is a very cartoonish abstraction of what agentic workflows might look like and you can generalize from there, but instead of having like very open-ended loop that I"},{"t":2672.72,"e":2711.2,"text":"was showing you here where you're supposed to go take an action from the environment and come back and do some feedback. Um, it's easier for open-ended problems to like construct this graph by hand of like how a human would do it and then like get this feedback perhaps from an LLM which is the LLM evaluator here. So, a lot of the real world workflows still have this paradigm, but in in certain cases we are starting to see signs of life for what's possible in this slide encoding being one and research being another one. So, typically the workflows will have things like LLM calls. So, you would basically call an LLM with an"},{"t":2709.04,"e":2749.36,"text":"instruction or some form of like input and then you're asking the LLM to give you an output. It will have some form of verifiers. We'll cover verifiers in a whole lecture by itself. It will have some form of critics or judges which is effectively LLM as a judge paradigm. There might be tool calls. For example, for deep research you have to actually go search the web to figure out what exactly is the content that you should be looking at. So, there might be tool calls of that form or getting some value around what exactly is the weather. Um, and similarly search would be another tool call. And then you would orchestrate these in in some form of a"},{"t":2746.92,"e":2783.28,"text":"workflow. So, a simplest workflow here would be prompt chaining. So, similar to reasoning models where the task gets decomposed into subtasks, prompt chaining would simply be like you have chained a bunch of different subtasks that you're supposed to go accomplish to achieve the end-to-end goal. There might be routing. Routing works for complex tasks where you say, \"Okay, if this is very complex, then go do this more complicated set of LLM calls, and if it's less complicated, then do this simpler workflow.\" Um there might be parallelization where you like deep research is one example where you you can have multiple LLM"},{"t":2780.4,"e":2819.08,"text":"calls work simultaneously on researching different keywords that you give it as input to the LLM, and then uh finally you aggregate the output, or you might break the task into independent subtasks, and then uh combine uh the solution. Or you might have this notion of orchestrator where you basically are actually using some sort of a In simple words, LLM managers where central LLM is actually doing the planning. So, in Claude code, you actually start to see that that there is some notion of like a plan that it comes up with, and then based on that plan, it will like make subsequent LLM calls. You might have an evaluator or a judge."},{"t":2817.4,"e":2855.68,"text":"So, instead of like getting feedback from real-world like user or from some sort of a actual running a unit test, it actually might just use LLM as a judge, and we will have uh some homeworks that will cover this aspect. And then you might have verifiers. Verifiers are things where you can actually verify the output. So, in code for example, if you run the code, how do you know that this code is correct? So, typically as software developers, we write unit tests. Uh so, similarly, verifiers might be running some kind of unit test to check whether what LLM generated is correct. And in domains which are verifiable, uh math, code, um and other"},{"t":2853.8,"e":2894.76,"text":"domains that are more rule-based, uh this verification is a good way to give feedback back to the model so that um it can correct its steps. So, most of these uh workflows mean that the uh the LLM needs to be better at planning. It needs to be better at multi-step reasoning, and it needs to be better at self-improvement. Like when it makes mistakes, it needs to be able to correct itself. So, effectively, these are sort of new paradigms that the current set of LLMs just with reasoning were not quite accomplishing, and these are some of the topics we do plan to cover in subsequent lectures. And just to drive the point home around"},{"t":2892.84,"e":2930.12,"text":"coding agents, so this is a very simple example. This is actually I should have updated the slide to four cloud code, but basically, what this is showing is that you have an LM agent, and it's interacting with the computer these days just with the terminal. You give it an instruction where you might tell it that you want to implement a task, and then has some navigation of repository, searching of files, all of these tool calls around like viewing files, editing lines, and then it will go execute a bunch of commands in the terminal, and based on the output, it might be like, \"Okay, I need to go edit this other file, or I need to go look at this other"},{"t":2928.16,"e":2943.36,"text":"file.\" So, if you look at this loop, this very much mirrors uh what was So, this was not quite reliable last year, and it's just starting to get reliable in what we're seeing in the realm of coding agents now. Yes."},{"t":2951.4,"e":2965.92,"text":"I mean, I think the paradigm is very much the same. It's it's mostly a matter of more powerful models, and then better RL. RL with verifiable rewards is working. The train time scaling is working well."},{"t":2977.84,"e":3021.4,"text":"I mean, it's computer data, right? One of those two, but like just also, once the models start to get better, there's the self-improvement loop that kicks in. Uh because you can now generate tasks, and the tasks become more reliable. So, in the published pieces of work, if you look at say Code Monkeys, which we coded last year, if you can generate unit tests for whatever code the model generated and then see if the generated unit tests are making things better, then that that that's a very good way to verify things, >> Yeah, like model-based. It seems like to some extent, if we have good verifiers, um we can make the model generate the the"},{"t":3019.36,"e":3059.32,"text":"right code. Um but the question is how do we do that? And there are ways to do it. And we would be happy to for you guys to take research projects in that domain, too. But obviously, it's an active research area, but there are ways to make improvements that we can discuss. >> what you're alluding to is this notion of generator-verifier gap. So, it's easy for models to generate a whole bunch of nonsense or sensible set of like reasoning traces or like useful set of content. But at the end of the day, whether that's useful or not, we need feedback loop for that. And if you're creative writing, how much feedback can you get? So, human feedback ends up"},{"t":3057.2,"e":3093.24,"text":"becoming a bottleneck. In domains where you can have good feedback, that's where it's possible to continue to improve the model. And that like but where getting robust verification, a lot of robust verification is hard. So, uh Azalia will cover a paper that she did in her her lab about like how to combine verifiers. And but what verification continues to be one of the bottlenecks in this space to make them better. >> Yes. >> Um just like intuitively, like in pre-training, you get abilities to find looking at the same logical abilities. >> Mhm. >> So, just like to me, intuitively, I'm trying to figure out why there's a"},{"t":3091. ch um"},{"t":3207.08,"e":3243.92,"text":"which is also uh mentioned here. But the the key idea is that if you give it a task, how does it come back and how do you know that it's going to complete what you asked it for? Often times the users will not specify the problem well enough. So, asking clarifying the user intent so that it knows what to go look for and how to verify it starts to become important and in models like 03, I think they have seen a lot of these traces end to end. So, they are able to like do the planning, the reasoning, the multi-step reasoning and like come back with the conclusion, but a lot of this is needed for um completing tasks end to end or having an"},{"t":3242.24,"e":3283.48,"text":"end to end goal. And where this has been super useful is if you have repeated repetitive tasks like code migrations or version upgrades or if you need to restructure the code base. Or if you have tasks that involve data engineering where you have to basically do some sort of extract the data and then do some sort of clean clean up on the data or if you have to do some sort [snorts] of data warehouse migration. So, a lot of this work tends to be extremely repetitive and it's much easier to just delegate it to coding agents. Same for unit tasks often times like much easier to like start to give it to Another area where agents have become"},{"t":3281.68,"e":3317.36,"text":"extremely prevalent is in customer support. It's one of the most thankless jobs that when when you are on the customer support side of things you have to do and using LLMs to do that definitely makes streamlines the experience in interesting ways. So, one simple set of examples ends up being like you can use them to do live transcriptions. So, that gives you a very nice record and and you're seeing that even for meetings these days. Another simple example is that you can have knowledge assist. So, if you have a database of information, the customer support agent does not need to know everything. They can consult with the"},{"t":3314.88,"e":3356.8,"text":"LLM and and get an answer and surface the relevant article which is better than having just search like an index and search by itself. Smart replies. So, in in chat often times this has existed for a while, but you can use an agent to like give chat responses and then having a call summary can help you um you can use the call summary to really improve the customer experience by itself as well. So, overall, I think in the customer support area, there are [snorts] multiple companies that are going after this area, but uh there are different segments of the problem that can be addressed using LLMs and they have been super useful and then"},{"t":3355.32,"e":3392.4,"text":"there's also the end-to-end stuff that's starting to happen here. And then the third example that we will use and actually some of the homeworks is that if you have very complex topics and you want to provide a comprehensive report, um earlier it used to be that you had to do a literature review and then you had to summarize each paper and then you had to synthesize these things and these days you can just give it to an LLM and actually do it for you and um study maybe more articles than you would. So, typically, if you give it an example like uh say 2022 Winter Olympics opening ceremony, it will identify what references to go look at, then it will"},{"t":3390.88,"e":3432.76,"text":"construct an outline of like, okay, these references are relevant or not, and then summarize each references as to what is the relevant content and then combine them to create a full-length article, um which is uh very impressive in certain cases and and you'll get to try it in one of the homeworks. And then even uh more uh forward-looking um these research agents are starting to be used for uh as AI scientists. So, basically, they're starting to assist scientists in say uh solving math problems or solving science problems. So, here the LLM is used as a brainstor {"t":2780.4,"label":"calls work simultaneously on researching different keywords that you give it as input…"},{"t":3207.08,"label":"which is also mentioned here. But the the key idea is that if…"},{"t":3355.32,"label":"there's also the end-to-end stuff that's starting to happen here. And then the…"},{"t":3469.72,"label":"sometimes the reading the web allows these LLMs to come up with ideas…"},{"t":3623.52,"label":"could also say think about it that they have seen this kind of…"}]},{"n":2,"id":"-Ggc37xLj_Y","title":"Test-Time Compute Scaling","file":"02 - Test-Time Compute Scaling.srt","duration":3797,"paras":[{"t":5.6,"e":52.56,"text":"So today we're going to talk about inference scaling. Um we briefly hinted on this uh in the first lecture. So there are three stages for LLM kind of development. The first one is pre-training. This stage historically takes a lot more time. It could take several months. a whole lot of uh GPUs uh that are used for training these. Um and then there's a fine-tuning step. Usually this is a less or historically has been a less kind of compute intense process. If you're talking about trillions of uh data tokens in the pre-training side on the fine-tuning side, this is orders of magnitude less data that we use for fine-tuning. And"},{"t":50.4,"e":100.64,"text":"then there is the inference part where we get to use the model and uh we are going to see different ways that at inference time we can make the model be better and become more useful without changing uh the parameters of the model and without any kind of uh fine-tuning of the models. So uh let's first start with the large language monkeys paper. Again, uh you are familiar with the infinite monkey theorem by now because we discussed it on uh uh Monday. But to recap, the idea of this paper is that we have an LLM and we have a problem as input. Instead of generating the response for this problem only once, we are going to repeatedly"},{"t":97.84,"e":149.84,"text":"ask the same input problem again and again. Uh this could be a number of times, it could be 10 times, 100 times and so on. uh and we will see how that affects the performance and then we are going to have a verifier that can tell us which one of these responses were the correct response and then that is going to be the output of this system. The reason we like that is that by doing this repeated sampling, we can make models that are inferior. For example, a llama 38B or 7P that is um not as capable at GPT40 with single attempt. By by doing this repeated sampling and selecting the correct one among the generated candidates, we can um significantly"},{"t":148.24,"e":201.76,"text":"improve the performance of these inferior models and make them better than these uh larger and proprietary ones. And these are here you can see examples across uh really hard math coding uh uh and different styles of math problem uh question answering problems. Is that is this clear to everyone? Um it just seems like the models and smaller models already know the answers to these hard problems and we are just like by doing this repeated sampling we are kind of eliciting those and surfacing those answers. It just they don't and they they just don't tell us that in the first trial. Um now this um uh kind of paradigm of repeated sampling"},{"t":199.52,"e":253.84,"text":"works well across pretty much any domain that we have tried in so far including agentic uh benchmarks such as bbench which kind of mimics like how a software engineer goes about um editing code and creating new patches. Um so here we are seeing the coverage meaning uh the the the uh fraction of problems that are solved by at least one of the samples and here on the x-axis we have the number of samples going from one to a thousand and what we are seeing here is that a model such as deepseek um can u uh I I believe this was the deepseek v3 model can perform can outperform models such as claw 3.5 or 01 uh preview um after a thousand samples"},{"t":252.0,"e":281.96,"text":"like it can solve more coding and software engineering problems than those and the reason this is interesting is that we are doing um uh in this case for coding problems if we have unit tests that can that we can use to select which one of these samples is correct then we have an end toend automated way to create a more capable model um out of this in this case out of Deepseek and open source model."},{"t":283.92,"e":333.2,"text":"Um now again we saw pre-training scaling laws in the last class uh and that was we can predictably uh kind of reduce the test loss given these equations in in this paper and these equations might might change given the setup but there is a predictable path to increase data uh amount of compute used and the number of parameters in the model and use that uh to kind of uh predict or reduce the test loss. So this is for pre-training but it turns out we can define a similar scaling loss but this time for inference or test time compute. Um and that is something that we showed in this paper. Basically you're showing that the"},{"t":329.92,"e":381.52,"text":"relationship between co coverage and the number of samples that are being drawn in parallel from the model follow an exponential power law. So assume this C is coverage meaning how many problems are solved by at least one of the samples and then K is the number of samples and A and B are these kind of coefficient that we can find through this uh the carefidding parameters that we can find through this scaling uh kind of u uh scaling behavior of the model. So concretely um as we scaled the number of samples across a range of models from llama 3 8b 7eb and models like gemma or pithia uh and this is for various range"},{"t":378.88,"e":422.92,"text":"of parameter sizes going from 70 million parameter parameters all the way to 70 billion parameters. We can see that we can u predict this power law and have a have a have a predicted curve that um closely for for the most part very closely follows the actual u practical kind of coverage that we are seeing as we increase the number of samples. So basically the way to think about it is that we can we can predict how many sample to achieve a certain coverage how many samples we're going to need to and and how much we should how much resources we should allocate to achieve that."},{"t":426.0,"e":485.92,"text":"Um and again the these curves show that this behavior is true for a range of models and a range of parameter sizes. Again I think one of the very interesting properties that we saw here is that for a very small model like a 70 million parameter we also see this scaling behavior and of course this is true for much larger models as well and it is true across domains. Now, uh we uh we looked a bit more into why we see this um kind of paral law behavior in in in repeated sample sampling. um because it's it might be at first a little non-intuitive because if the probability of um the pass atmon being correct the probability of a correct response to a"},{"t":481.28,"e":533.36,"text":"to a question is for example P then we can calculate the probability of um at least one of the answers being correct at K for an individual problems. So for problem I, if we have the pass at one for problem I, we can calculate directly what is pass at K for problem I with this um exponential equation. I hope this is clear for everybody. But basically this 1 minus P is the probability of the first like K answers not being correct and then one minus that is the probability of at least one of these K answers being correct. So this is for an individual problem. But what we are seeing that across a suite of problems we are seeing the"},{"t":530.08,"e":588.88,"text":"expon the power law uh scaling law meaning across um AC across these problems we are seeing the the the equations are changing. So the question that we wanted to answer is that how does this what kind of behavior should we see across uh the problem examples in ot less on fine-tuning and then almost like nothing at each inference call because it used to be like a on time back and forth between the user and query and the model. Now we have a new paradigm where we can spend a whole lot more compute on inference and use that to increase the capability of model and this compute the inference compute can be done offline. We can kind of uh release our agents to go solve a"},{"t":730.32,"e":785.04,"text":"problem and just keep generating tokens and keep uh improving the the the quality of the answers that they generate. Um now when we talk about this repeated sampling something that that's important kind of have in mind is the need for automated verification because if you have a bunch of samples we still need to know which one of them are the correct ones and how to go about selecting them. um in certain domains uh verification is easier than the others. For example, for certain types of math problems, you can use formal formal proofs. So given a a proof u strategy, we can run them by these formal proof kind of software"},{"t":782.8,"e":835.76,"text":"tools to verify whether each step is correct or not. Um we can write unit tests for coding and um in some cases writing a unit test arguably arguably is a much simpler task than writing the entire program that solves a problem. Right? So the unit test can be written for example by humans um and um we can use that as our verifier. Um there are other cases like AI as a compiler and this is one of the projects in the lab. um that and a direction that I'm very excited about and that is when we can generate compiler like lower level code like CUDA for a source code like P pietorch with LLM and the reason this is verifiable is that um for"},{"t":832.08,"e":890.88,"text":"example here we can always um compare the output of CUDA with the source PyTorch and see if they're the same for for any given input. Right? So we don't need if we want to say whether the model has generate has generated the correct CUDA code for our source PyTorch code we can just see um whether their outputs match for any for any inputs. Um for those of you who are not familiar for CUDA, I hope you you all are, but it's like a lower level language for writing uh more hardware aware and optimized for hardware code uh for on on GPUs. Um for example, here um we we have a data set or a benchmark on CUDA generation called kernel bench. And here"},{"t":887.76,"e":941.04,"text":"again we are seeing the same s sort of uh linear improving coverage uh in this case for CUDA code generation as we increase the number of samples that we take from the model. And in this case we have this again by by default perfect verifier that we can use for um measuring the correctness of our CUDA generated code. And and there are other examples of this um other any basically any kind of translation between two languages. If you want to like port from Python or C++ to Java or vice versa. This is again this is true. You can measure the the equivalency uh much easier. Um now there are domains that we don't have verifier for and in"},{"t":939.28,"e":990.24,"text":"those domains what we observe was that there is a large gap between best of end methods uh such as majority v voting um and uh and model based rankers and what is the true coverage of the model. Let's take a look at one example here. Um so here we compared a few different methods. We are going to learn about reward models or verifiers on Monday more but let's take a look at these examples. So we have a number of samples and then we are measuring the success rate here like basically what would be the output of this system. Um majority voting or the green one is we we just see which answer among the generated answers has um appeared the most. So"},{"t":987.84,"e":1036.08,"text":"based on that we just select that answer or that response as the output of our system. Does that make sense? It's just majority voting. And uh the blue line here is coverage. This is assuming we had a perfect selector or verifier in this case. And as you can see here, there is a large difference between majority voting which plateau plateaus after 10 or 50 samples and what we could possibly get if we had a perfect verifier. So this is a very very large gap. Um especially and this gap is even more pronounced if you have harder problems. So for example the math capital math here data set is a harder more complex data set than GSM8K"},{"t":1033.52,"e":1085.84,"text":"and we here we we compared other methods like using a reward model and com add and um that uh generates that measures gives a reward per answer and we take the best of best of those or ways to combine these two we'll learn more about these reward models basically they're LLM based kind of LLMs that are trained to to kind of um score their the response quality and even with those there is a large cap gap. Uh and this is what we call the generation verification gap. So the generation it turns out we can generate a lot of good responses but the verification is this basically this gap is tells us how much we can actually"},{"t":1083.04,"e":1137.44,"text":"capture those responses or those uh correct answers. Um, the reason methods such as majority voting doesn't work is that as we look into the quality of answers, it turns out that for some problems that are hardest to solve, sometimes we see that they were solved maybe even once or two times or three times across the thousand or 10,000 samples that we take from the model. So these correct problems um uh are actually very rarely solved by the model with the samples that we are taking from it. So it makes sense that a majority voting mechanism cannot capture those because they're rare. But for many of the problems in this case especially"},{"t":1134.32,"e":1183.6,"text":"for the GSM8K which is simpler because uh the the answers or responses are more are simpler to generate majority voting works for many of the problems. But even even i ain we sample"},{"t":1854.56,"e":1912.24,"text":"from them uh and and and and we continue and we can have a threshold on what how the to for selecting the top kind of um two two kind responses in this case and expanding the tree from there. So here we are doing a beam search approach to that uses the process reward model to guide how we are sampling our model. Is that clear? Yes. >> How do you choose the option >> based on the PRM score? So the process reward model is trained to generate a score imagine between zero and one based on the a step given given the question and or or just a step alone >> is the PR function from the language model. Yes, PRMs are generally also fine"},{"t":1910.4,"e":1954.88,"text":"from a language model. As you can imagine, they would work better for in domain kind of types of task. So, if you have a certain task that you want to uh a certain benchmark that you want to optimize for, of course, training a PRM on a like a subset of that task helps you with test time scaling on that task better than across new task. uh but because they're language model based they they do exhibit some generalization across task as well. >> Yes. >> For the process reward uh is this a reward that's being computed in practice? I don't know what the research is like per token that is being done or maybe like blocks of tokens and then"},{"t":1954.0,"e":1990.92,"text":"it's being computed. >> Yeah, it's not per token. is per like step like imagine and this is something we're going to learn about in future lectures. Imagine these are like a math problem and then there are steps to answer that like in one way to do it is to have humans annotate the quality of each step like yes or no this is good or bad and then training the model based on each step which could be like you can assume it's like one kind of intellectually meaningful chunk of the result or it could be you can define it as a sentence and so on."},{"t":1994.0,"e":2044.96,"text":"And of course um as it's i  can use on top of just PRMs and OMS. Um so here this first graph just shows um how ensembling and using a number of verifiers that are they could be trained by different labs on different data sets. We just like and there are all these language models that take a query as input and give a score at on the output side. Here we are comparing uh we are seeing these four data sets. So in this case we showing"},{"t":3252.56,"e":3308.24,"text":"the performance of top one versus top five versus top 10 verifiers based on like how good they are in some ranking system. Overall, it seems like um like just uh un ensembling them with each other um and using them at test time uh does improve things u but not in a necessarily in a monotonically monotonic way. But the thing that always helped was that if we train a model to a a way for them to to add them together. to assign weights for different members of the ensemble if we have labels from them. Here we have we have two methods naive base or logistic regression. These are very simple methods. Basically, you add a simple single weight per verifier"},{"t":3305.84,"e":3357.36,"text":"to score them together to and if you have a training set set for for your with a with labels, you can basically come up with these weights and and now these results are on the test set corresponding to those tasks. So, you basically say for math 500 500 I have a set of labels. I use that to average my verifiers, find the weights and then I use this averages on a new on test data. So that does give it seems like it does give a lot lot of improvement just this simple task. Um now you can do other things. So the the way we works is by this score weight and select approach. So in the first step, we are going to score outputs of the verifiers and uh"},{"t":3355.28,"e":3400.88,"text":"normalize them so they're all on the same scale and and um and filter out the lowquality verifier. So in this setup even we are assuming we have access to a very limited labels that we can say okay these verifiers are just so bad against our labels we just remove them from our ensemble. We have noticed that this is a very important step like your verifiers should be above a certain quality to be even be let in the pool of verifiers. So then you have your verifiers, you have your LM judges, you have your reward models and then you get these scores from them whether it's zero or one or the log prop of correctness per um per"},{"t":3396.96,"e":3452.16,"text":"verifier. And then um what weieber did was to use weak su weak supervision to uh estimate kind of the verifier accuracy with very small uh data labeled data and then um and then we use those ways to combine the verifiers output and assign a score. Um I go briefly through like how this week to strong supervision works. Some of you if you have t taken deep learning courses or even CS 229s last time we talked about it about weak to strong supervision. There's a whole body of work here. Uh beaver was specifically u kind of uh um motivated by the work by snorkel by Alex ran ratnell atal and other work from Stanford. So the so here is how we"},{"t":3449.84,"e":3504.96,"text":"have these weak verifiers like weak signal from our verifiers and combine them together to get a stronger signal. The setup is the following. We have n queries. For each query we create k solutions and then let's assume we have m verifiers. So we have a total of n * k * m labels. uh and our goal here is to create to get this probability of um query I sample J uh equal to one given all the labels that we get from all the verifiers. So how do we estimate this probability correctly? Um the assumption in beaver is that each verifier captures independent aspect of the correctness. So this is a key assumption that we made. Um to some extent the reason we"},{"t":3502.24,"e":3548.24,"text":"get so think about it this way if you have a pool of verifiers if all of them agree on the score that they give to any sample then we are no
