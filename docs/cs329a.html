on't have that and that's why we are training these verifiers. Um the the purple one is we were supervised and that's assumed that we have a large body of label data and we can use them to learn these weights. The blue one is the unsupervised. In this case, we're using 1% of the training labels for each data set. Um the orange one is the naive ensemble, meaning we just average them average the on the the the verifiers without any special treatment. We still are filtering um and keeping the good"},{"t":3692.48,"e":3726.36,"text":"verifiers in the loop. And then all of these are significantly better than methods such as majority voting or multi- aent verification. And multi-agent verification just or MAV is um it's just based on prompting LLMs and asking them to score a given response based on different kind of aspects that is produced. So kind of a rubric base which is doesn't do that that much better or actually worse in these two cases than majority voting."},{"t":3728.64,"e":3787.44,"text":"Um but something to notice here is the drastic gains that the model can have going from something like 40 less like slightly over 40% to over 70% on these hard uh problems. and in this case matching a model like 03 mini. Um so the thing that is interesting here is that the we can use this weak to super weak to strong supervision to reduce the gap between model classes. So what we are saying here is that if we take a generator model of llama 3.18b instruct and the verifier um model which is like the the pool of verifiers that are 8b and below uh we get an average of 70% on these data set and this is almost comparable to the accuracy that we get"},{"t":3784.8,"e":3839.76,"text":"with majority voting but when our models and uh models are at 7B. So we are kind of like making the model making this 8B model um the same roughly the same as the 7TB class by just doing this inference scaling and using the verifier and in this case unlike the what we saw in most of the previous lecture we are talking about the end results we're not talking about the coverage we're talking about the solution accuracy of the entire system. Um and here again in this case for when we do the same apply the same generation and verification to 70B class of models we are getting an average accuracy of 86.2% 2% on these data sets and this is"},{"t":3835.6,"e":3886.72,"text":"very comparable to this to O3 mini which um which has a much uh uh which is like a proprietary model and in general is a higher like a different class of models. So this shows how much verification or this work on verification can help with the results. Um, another uh work that was done on the increasing the usefulness of something like Vaver is that a challenge with ensembling verifiers is that you have a ton of like models that now you need to run for each solution to get a score and then to average them, right? To uh and that increases the cost especially if you instead of one sample per per you have a 100 samples and then you want to create"},{"t":3882.32,"e":3937.52,"text":"all these scores. So instead what uh the proposal here is that what if we do train wever once and then distill it into a much smaller model um and that's how instead of running each of these LLM judges or reward models per sample we just take this distilled uh LM which in this case we show that it could be really really tiny like something like 400 million parameters as opposed to the original model which was in the 70B range. Um, and it turns out that with this distilled model, we can kind of capture 97% of accuracy of this large pool of L uh verifiers, but be significantly in this case 99 plus% use less compute at test time. And these uh"},{"t":3934.64,"e":3986.4,"text":"and these um distilled version and the original version, they're all open sourced and the checkpoints are available. um if any of you are interested in working with them in your um agentic or test time scaling projects. Um and here is another graph. Here is the distilled one which is the light blue one and the original beaver is the dark blue one. And we are comparing again the efficiency the success rate over the inference compute the total inference compute that we are spending on this data set. Um and u um and the distilled one obviously is like significantly more efficient. uh but even the original weaver because it"},{"t":3983.12,"e":4040.32,"text":"reaches higher levels of accuracy um at those levels it becomes more flop efficient than models like naive ensemble and majority voting let's do a quick recap. So um here we today we covered like four papers that also showed the trajectory of how this work on verific how research on verification has progressed over the last like four years. We talked about how verification um can improve training both during uh can improve the outcome of the and the quality of results uh both uh during training and inference. uh process rewards seems to be very useful and overall uh very effective uh and more so than the outcome rewards but perhaps we"},{"t":4038.56,"e":4087.36,"text":"need to combine them to get the best results both PRMS and OMS um and we also in Matt Shepard learned that scaling you need a lot of data and the more data you throw in the verifier training it becomes better and you can use it during your RL uh fine-tuning to increase the quality of your generator as well. And uh the beaver work was took a whole different approach to verification was and that was just uh doing this weak supervised optimization on an ensemble of verifiers and in a way we are using test time scaling but by bringing more verifiers rather than sampling a single verifier more um to to get the results and we can turns out we can distill that"},{"t":4084.48,"e":4135.12,"text":"and capture a whole lot of the quality uh from a much smaller model and With that I can conclude the class. Any questions? Yes. >> The papers were on math or reasoning uh benchmarks. Do you think there's anything else that [clears throat] could work for project other ways to evaluate the model? >> Um like coding other ways to evaluate the model. You mean other areas like coding would be a very interesting uh area for for reasoning. So these like there were like some coding problems in this CT like in some of the benchmarks here. So it's not not just math uh but um coding is also a very interesting kind of uh area for verification. We"},{"t":4132.48,"e":4159.32,"text":"will uh we will talk about code monkeys. This is a paper uh that instead of directly training a verifier, you can make the model create a test time system to make the model generate unit tests and those unit tests become your verifier. So that's an entire different approach. Um but these kind of verifications should also be useful for any kind of reasoning task."},{"t":4162.96,"e":4215.44,"text":">> Yes. I'm curious like how do generation verification help us model like that internalized one. >> Okay. So the question is that for reasoning model how does the generation verification or these kind of test time scalings work for them? It actually helps them as well still. uh but the reasoning model like uh we're going to talk about them in this class but basically what they're doing a big part of it is to generate these reasoning steps use the reward for it and do an RL loop and generate positive trajectories and then use that positive trajectories as part of training for the next round. Right? So the test time scaling is"},{"t":4212.16,"e":4263.44,"text":"inherently used to generate data and generate the training process. But they still would benefit because they still uh could explore different parts of the solution space with with more sampling kind of like knowledge using training on the test. Do you think in the future like this two parish or do you think like um maybe like repeat sampling would only be used for generating training for >> Yes. So the question is like would we converge to a future where these kind of test time scaling repeated sampling and science just for training time to create the data and then at test time we uh we just use ask the model once I think"},{"t":4261.76,"e":4304.32,"text":"that's the direction we want to go right we want the model to be really really good at pass at one like the first time we ask it to do something we want it to generate and that increases the efficiency and all that like that would be the hope one challenge though with making the model too like like to make the the log props of the model too sharpened through through one answer is that the creativity and diversity of solutions may be lost some somehow during the training. Um so surprisingly we still like them like models that are very d like create have a lot of creativity and diversity in the way that they they think and that's like"},{"t":4302.32,"e":4350.24,"text":"a good feature that we want to have in the models. >> Yes. Does it matter if generator and verifiers have very different architectures? For example, if the verifier is like a mini version of the generator versus if they're very different architectures, >> but does it matter like like which one which one is um empirically? >> Okay, so the question is like if the generator and verifier from the same family or not. That's that's a good research question. Um I think in general it's interesting like models like their own generations and their their own way of interpreting results much better than using a different family of models. Um"},{"t":4346.96,"e":4375.0,"text":"we are going to talk about a paper that talks about how uh certain models can benefit from like a different class of verifiers over themselves. But like a specifically uh I am unaware of a study that has looked into that specific question of uh same kind of size and family versus uh different size different family. How does how that changes the behavior of the model?"}],"outline":[{"t":161.52,"label":"8,500 grade school math problems. and the goal with was this for this…"},{"t":1248.8,"label":"be the same going to kind of converge to the same thing. But…"},{"t":1660.0,"label":"increasing the quality of the data. So and at each step the label…"},{"t":2268.48,"label":"go through the next the next paper. Matt Shepard verify and reinforce LLM…"},{"t":3305.84,"label":"to score them together to and if you have a training set set…"}]},{"n":4,"id":"Lxh9RF5S-K0","title":"Learning from Feedback with Tools and Code","file":"04 - Learning from Feedback with Tools and Code.srt","duration":4269,"paras":[{"t":5.52,"e":44.56,"text":"In the first lecture, what that we covered is that large language models are really good at solving natural language processing problems. And [snorts] I think most of you are very familiar with using them in chatbot kind of scenarios. But to make them useful in real world tasks, they do need to be able to interact with real world environments, tools, and code and learn from what they interact with. So you already saw some examples of test time compute and robust verification that Asia covered in the last two lectures. Now we'll build a little bit more on top of that. Okay. So today's lecture we will focus on three different papers."},{"t":42.48,"e":85.76,"text":"The first paper will start with the notion of tool calling and how can we get the models to go beyond just uh reasoning to also take into account actions via tool calls. And the paper that we'll cover here is called React which actually was one of the first that went around to combine reasoning and acting in language models. The second paper that we'll look into is RLEF or grounding code LLMs in execution feedback. What this will focus on is how do you how do you actually do code generation by using execution feedback from like being able to run the code or run the tests of the code. And the third thing that we'll look into is uh"},{"t":83.52,"e":128.56,"text":"constitutional AI where we use the mo model critiquing itself uh as a feedback loop to improve the model. So all three of those techniques are ways for the model to improve itself. But what differs in each of these techniques is where is the feedback coming from? It's some form of interaction with either the environment or some form of critique mechanism or grounding using what we know should be the right answer. So let's start with um just uh let's start with tool calling as the first abstraction. So what React really uh tried to focus on was this notion of when humans want to go and do some action, they think about it first. For example, if you"},{"t":126.48,"e":164.56,"text":"decide that you want to come take a class, you think about how that might actually help you. Um [snorts] and uh what this roughly means is that once you have thought about it then you will have a reason to act and then based on that action you might observe that you have a new observation about the environment. So like once you come to the class you might decide you like the class or you don't like the class and based on that information you come up with new reasoning. Maybe you'll go do the homework and then that will make you decide something else. So there is this loop between thinking and action that helps us function as humans."},{"t":161.92,"e":202.48,"text":"A similar loop can be very useful in terms of refining what uh language models generate. And typically when you look at language models um they have struggle to combine reasoning and acting by themselves as isolated processes. In today's models the reasoning has become innate because thinking has become part of the models. But if you look at the history of the LMS in the last couple of years this was not something that came out of the box. And one of the challenges of why it was hard for models to combine reasoning and acting is because they typically will hallucinate. They will have no context of what is actually happening in the environment."},{"t":200.24,"e":242.88,"text":"So for example, if you were to type into a model like Gemini or Chad GPT or claude um what is the temperature uh today? What is where where is something happening today? It has no information about the current events unless it actually goes and does a search call and then fetches that information. So it has no notion of grounding in the real world. And as a result of that, it cannot go and take actions and then actually uh combine that back into reasoning. So React was one of the first abstractions that tried to combine it in a way that would be effective. And and what you see today's models do is actually go beyond React to do this in"},{"t":240.48,"e":276.32,"text":"in the chain of thought. itself. So let's take a look at what we covered in lecture one. So if you look at chain of thought by itself, chain of thought already gives the model some sense of reasoning. So if you gave it a math problem, the model will show the steps the intermediate steps it takes to get to the answer. But these steps may or may not be grounded because they don't they are based on model's internal state. They have no feedback from the external world. And then there is a second class of uh LMS that were developed for example web GBT which go and interact with say web browsers and what they're basically learning is how"},{"t":273.92,"e":312.48,"text":"to interact with web browsers or which is a form of a tool. So they don't necessarily have a reasoning process but they're basically learning how to go interact with uh web browsers. So you basically can fine-tune on traces that are uh interaction traces with web browsers and then what do humans prefer and not. But as a result of those two different things, one is focused more on reasoning and one is focused more on actions. How do we combine these two paradigms where we can both reason and act in an uh in a useful way? A very simple abstraction that React came up with was uh just using prompting you can get the model to generate verbal"},{"t":310.32,"e":348.0,"text":"reasoning traces. So first you say okay I want to want the model to go do this task and ask the model to think say step by step about it and then it comes back with its reasoning trace. You append that in the prompt and then you say okay what action should be taken based on that and then you go take an action. This really helps the model improve performance where grounding matters. So hotspot QA for example is a question answering task. Then fever is a fact-checking task. So these require real world knowledge. They require knowledge about what is happening in the world. And then web shop for example is an task where you're supposed to uh ask"},{"t":346.16,"e":384.32,"text":"the model to go buy products on the internet. So it's supposed to do a series of tool calls to actually identify what product to search and then have sequence of those actions to actually complete the purchase for the user. So each of these tasks requires some notion of grounding in the real world and without that grounding um it's not possible for the model to keep making progress. A second benefit of having uh the model explicitly do reasoning and action steps is that it will allow the model to give traces that are more interpretable. And interpretable allows um humans to like really trust the model's responses. It's"},{"t":382.8,"e":424.16,"text":"almost like getting the model to break down uh what it's doing step by step. So what you might be familiar with is that if you prompt the LLM and you ask it to think step by step which we were showing in uh earlier uh examples then you will get some form of a reasoning trace where it shows its intermediate steps and then if you ask the model to say do a tool call like go search for example um Google or find the temperature it will go call an API and it will get a bunch of observations. So that would be action only. Um typically you will have a list of actions if you have a give uh if you have a list of two calls that you are valid. What react"},{"t":421.12,"e":460.88,"text":"does is it will take a goal and have some form of reasoning. So that will be the left loop and then based on those reasoning chains it will go and act that will be the loop in the right. So what what this is setting up is a full agent in in itself where you have some observations about the world and then some set of actions based on what's the context and if you were to for example take this entire context with observations and the set of actions that have happened in the past typically you could go learn a policy but that would like require a full loop of which will be complex and expensive but you can actually start doing this in language"},{"t":459.04,"e":500.32,"text":"space which is what react is doing where it's basically just generating the thoughts in the language space and those thoughts are not affecting the environment and then based on those thoughts it's then going and taking an action just in the prompting space. So a very simple abstraction of how to prompt the models to start thinking about these things and and and generate uh actions which are valid. One interesting concept I'll mention here is that when you get the models to generate actions uh in this particular slide typically how do you know that these actions are valid? So one typical way in which you get these models to generate um correct"},{"t":496.48,"e":534.16,"text":"actions is to give them uh more uh to frame the problem more as a classification task. So you say that this is the valid subset of actions and then use that as a way to say okay here is your reasoning here's the state of the world and here is what are the valid set of actions to go take next and then based on that it goes and decides okay this is the action to take and then that generally provides a more grounded response and in fact this was also used in another paper that uh we worked on in collaboration at Google with robotics folks where the state of the world and all of that requires very valid action so you can't really operate uh without"},{"t":532.64,"e":572.0,"text":"having a list of actions. So that provides one way to like really grounded knowledge and what actions to take next. [snorts] Okay. So in terms of implementing this idea and uh in a very simple way this was done uh with uh this is this is an older model but with the pal model with a frozen LLM in few short examples the model was given some actions some thoughts and some observations and then asked to go take the next action. So for the reasoning traces, it was basically seeing actions and thoughts. I'll show you an example. And for the decision tasks, it it was basically looking at what's the state of the world, what is the thinking and then"},{"t":570.08,"e":611.2,"text":"deciding whether to reason and whether to take action next. So you can either go and reason or you can decide whether I have to reason or take action next. So let's look through an example and walk through it carefully. So this is uh like aside from the Apple remote, what other device can control the program Apple report uh remote was originally designed to interact with? So this is basically a question from hot pot QA. If you basically just do standard prompting, the answer that will come back will not be correct. Now you can do chain of thought where you basically ask the model to go things step by step. It's showing you all the intermediate steps"},{"t":608.16,"e":652.08,"text":"here. However, um the answer is still not coming out to be completely correct. Um now let's see if we ask it to take some actions where it can like do some grounded knowledge and it can call do some search calls. So it goes and sees that okay the thing that I'm really needing more information on is Apple remote. So it goes and does an action on Apple remote. It gets some observation. Then it goes and does another search call on front row uh which is some text that is there in observation one and then follow continues to follow on and then it's like realizes that okay this is a discontinued something. So as a result there's not really a good answer"},{"t":649.04,"e":690.24,"text":"that it can give. Now how does thinking and action like interle those traces help? So here it thinks first that okay I have to search for Apple remote and then find the program it was originally designed to interact with. So it first goes and searches Apple remote. It finds the information that it's a remote control introduced very early on like 2005 two decades ago and it was originally designed to control the front row media center. Then it thinks okay so I need to search front row next. So it goes and searches for this. It's not able to find it. So then it comes up with a new terminology called front row software"},{"t":688.56,"e":727.92,"text":"and then it searches that and it's able to figure out okay it's a discontinued media software center and then it thinks about it again. So it's able to give an answer based on that. So basically uh the reasoning process is an abstraction which allows it to come back with better answer than just taking actions and then coming back with answers in between and and uh interlection and the observation aspect is basically allowing the model to behave better. Now what is happening in the LLMs today where for example if you go in the thinking mode of say Quen or um other models you'll see this happening automatically. So if you actually turn"},{"t":725.92,"e":766.96,"text":"on the thinking mode in sequent models, you'll see all of this starting to happen because the models have already been distilled on these kind of traces. So like the thinking fusion stuff that happens and several of the open source models already captures this kind of things. So they've already learned how to do for example tool calls and so on. Questions? >> Yes. Uh how do you how do does the model know what it knows like what to search or when to search like clearly you don't want to search on plus one but like how do you determine sea d some feedback uh from the code generated. So that there's a way to iterate on top of that. So what this paper shows is um basically an end to end RL fine-tuning framework. The actions in this particular case are generated code and the observations that I was showing earlier come from execution feedback. Execution feedback is test feedback. You're running some tests and you're collecting output of whether those tests pass or fail. And you get binary reward based on whether"},{"t":1737.36,"e":1778.48,"text":"those tests pass or fail. And then based on that feedback you can iteratively refine in fine-tuning time um and decide to make the model better based on that. So PPU can be used for this kind of approach. The two techniques that this paper covers are two-tier test strategy and then hybrid token turnle level policy. Both of those are very interesting. So I'll cover the basic ideas here but I do encourage you to read this paper very very carefully. So the core of their framework is an iterative feedback loop. They're using both training time and inference time execution feedback. So um let me explain the training time and the"},{"t":1776.8,"e":1814.48,"text":"inference time feedback. So at the very top in the purple block, what you're seeing is that the model gets a natural language problem description. For example, someone asked you to say write a hello world program. Then it generates a code solution which then it evaluates on some public set of tests. If the code fails, the execution feedback is provided to the LLM for another attempt. And this cycle will continue until the either until either the code will pass or it will reach a limit of the number of turns it's supposed to um do this loop for. And then based on u this whatever set of solutions it has generated for passing solutions a"},{"t":1812.88,"e":1855.12,"text":"private set of tests will determine determine what reward to give and then that will be used in the PO training loop with RL. So what here is  RLHF or helpful plus harmlessness based RLHF which is all human feedback based and then just using constitutional AI and constitutional AI with chain of thought."},{"t":3268.4,"e":3325.2,"text":"And what they roughly show is that just getting the model to evaluate its responses based on these principles, you still get the model to be equally helpful, maybe a little bit less helpful, but it's much less harmless as a result. So the harmlessness scores are much higher [snorts] and that was something that uh Claude and um the claude models were extremely strong at. And now that's that's a set of techniques that used across the models. >> Yes. Say that again. >> The chain the chain of sound has lower health. >> Uh yes without compar means that chain of sound actually worse. >> A possible that's a good point. >> I mean you on the right."},{"t":3323.6,"e":3364.64,"text":"So I think I think the correlation is less with chain of thought and more with the fact that as we as I showed you in the last slide um this one like anytime harmless is going up there is some amount of like inverse relationship between these two. So um it's almost like uh in this particular case if it was more harmless then it does hurt the helpful lens but overall you have to find the right balance between these >> Yes. go back to like step one of like the constitution AI to the supervised learning part. >> Okay. >> So like it said in the slides that like we want to fine tune on like the data generated by self critique and repeat"},{"t":3363.2,"e":3402.72,"text":"issues. Yeah. So like I want to understand like whether this just simply means that we want to just reinforce the lock likelihoods over like literally like the generations like the robots of like the of like the original policy like you know when so basically we just ask it to critique itself then we just like fine-tune like this kind of like sample robots so that they're more likely. That's like what this stage is basically doing. That's basically what it's it's it's uh it's a stage that's used in a lot of uh lot of other things that you'll see but what this is basically is doing a set of these are kind of traces that it's generated like"},{"t":3400.96,"e":3435.44,"text":"it's based on reasoning you wanted to follow certain set of principles and then it critiqued itself it revised itself and it got fine-tuned on that these set of traces right I mean if you were training it for thinking for example these would be the reasoning traces right so being being trained on it's being fine tuned on those reasoning traces. >> But I guess like it's kind of interesting that like there's not really like explicit feedback, right? >> There's no feedback, >> right? Because it's just asked to like do this thing and then we just fine tune it over like what it has tried to do, right? Then >> yeah, but as long as the fine tuning is"},{"t":3433.76,"e":3476.72,"text":"not very large scale. It's like much smaller than what the base model was initially trained on, it will not lose its initial capabilities, but the distribution of what it will output will start to get biased towards these set of responses. So the validation is feedback um the AI feedback. >> Yes. How do they validate whether or not they provide accurate feedback or >> that's a good question. So I think uh for the preference model when you do train this preference model you want to have some sort of test set or validation set to make sure that the preference model will do a great job. So you do want to have some human like typically"},{"t":3474.88,"e":3503.08,"text":"what you'll do is you will do a lot of AI feedback but for the prevalence model you'll also like get it to give some scores on set of things and then match it with humans. So you do want to do some sort of like consistency with humans for the preference model. It's not like >> it's not scaled to 10,000 or or that level. You're basically able to do based on compositional principles, right?"},{"t":3506. an be weak in creating a diversity of solutions or acting upon them and um planning multiple steps of optimization to reach a solution. Um so this paper focused on bringing known techniques from reinforcement learning and multi-kind of multi-step planning that existed in the past um including multi-step uh Monte Carlo research into the LLM reasoning path. Um and given that the models can uh take feedback in it also introduce ways for the model to take different feedback as the model explores with the the environment and bring that back in in order to f refine and optimize future uh plans and search processes."},{"t":219.76,"e":275.04,"text":"So just a quick kind of example of how uh how this worked. Uh for example the the prompt is to plan a trip to Hawaii. There are different ways and different actions that the model can take. Um so it can for example the if we sample the model for this prompt the model might decide that uh we might consider asking friends that already went to Hawaii or read subreddits uh related to that. And then this this uh framework introduce a mechanism for getting a score for each of these actions. Um and then kind of update the search space or the trajectory of follow-up kind of expansion of this tree that is being formed based on that score. So in this"},{"t":273.28,"e":324.24,"text":"case and we talked about how these scores are generated in this case action one has a higher score. So we expand that action. So the model expands that action. Um so in this case ask two friends uh about uh friend A and friend B about opinions and then based on the quality of responses there's score for that and we can follow on from from uh the model can expand from there. So there is a there's a flavor of multi-action sampling. In this case, the actions can be in fact ex be executed in parallel like these two actions or these two actions. They both can be executed in parallel. And there's this notion of like let's do continue exploration based"},{"t":320.56,"e":378.8,"text":"on the best state but also consider a a mix of exploration and exploitation. And that's where the MCTS comes in. Um so there are two kind of papers that uh this paper was basically saying how it diverges from those. Math sheepard is a paper that we saw previously and in that paper there was a verifier that was guiding the search process uh in the test time. Basically um the the reasoning kind of trajectories are scored by this verifier and then um the the the expansion is uh guided by that. But in lats which is this paper that we are going to uh learn more about in this lecture uh the scoring is not based on reasoning choices but it's based on the"},{"t":375.92,"e":430.72,"text":"outcomes of the actions that the model takes. uh and also there is this part about reflection of the model to kind of evaluate how this trajectory went uh and um also about the observations from the environment. Um it also improves based on previous uh methods uh uh frameworks and reasoning such as the React work. um where um basically in React uh there there is this extra step of we're going to see how this works but there is this extra step of kind of memorization and again reflection and then interaction with the environment that we have in the lats uh p paper and specifically we have more and more planning in into the process"},{"t":431.44,"e":486.16,"text":"So um here is uh the intuition [clears throat] uh behind lats. Uh there is the chain of thought uh where the reasoning process is basically decomposed into a number of steps. There is this notion of tree expansion. Um basically through this type types of actionings that action uh generation that we have we have a tree that we form a tree and we do search and planning through that and then we have this kind of like borrowed that from the react framework where uh the feedback from these actions are incorporated into into this search process for the future search search and so on. So this method concretely has six types"},{"t":482.8,"e":532.4,"text":"of kind of uh uh stages. Selection, expansion, evaluation, simulation, back propagation and reflection. So let's see exactly how this method works. Um and let's walk through an example an example prompt. So in this case, the prompt is um navigate through a maze to reach an exit. Um and then the initial observation is that you're in a dimly lit room. There are two doors, one on the left and one on the right. And the goal is to reach an exit in this case. So let's see how these different steps of lats uh come into play. So first is the selection process. In this stage, we need to select a node to expand. Let's say we"},{"t":530.88,"e":576.16,"text":"have done that. We see exactly how that's done. Uh but given a node, we want to see what kind of actions we can given that we have selected a node and this is based on UTC. We're going to see it in a bit. We want to see what kind of actions that we can take from that node. So in this case our initialized node is uh this thing you're in a dimly lit room and so on. Now let's say the model samples different actions here. In this case three actions are sampled. One is open the left door, open the right door and the third one is inspect the room for clues. Then the next step is each of these actions are executed in the"},{"t":573.68,"e":628.96,"text":"environment and the observation is kind of basically appended to uh to the context. So in this case say if the action is open the left room the observation is dark corridor with paintings. Action B is open the right there's another observation and so on for action C. Now uh comes the evaluation. So let's say we have an action. We have executed an action. We want to evaluate our new state that we are going into. For this part um they suggest averaging for creating a score based on the current uh kind of action and observation. They suggest adding up two scores together. One is using an LM score basically prompting using LLM as a judge and"},{"t":62 ":830.56,"text":"then that is used to influence the score of each each state um and uh and we're going to talk about it in a bit. Okay, let's talk about how these value function and back propagation is used. So for the value function we already saw that that is a weighted average of asking an LLM as a judge given this observation this action how do you have what are the chances of success give us a score between 0 to one and then there's the self-consistency which basically we just count how many times a given action is sample then there is the notion of UCT or upper confidence bounds applied to trees that's something that this is the the"},{"t":826.88,"e":876.48,"text":"the basically the number or score that is used for selection because we have at each point we have a range of like values that we want to see which node we go and expand. So the way UCT works and this is like completely borrowed from the MCTS kind of literature. Uh the way it's designed is to try to balance between exploration and exploitation. If we just go based on the highest value at that point, we might miss out other nodes that right now maybe at the current moment have a lower uh value but down the road at the end might have higher value. So let's balance the the two of them. So the way UCT works is that it has this"},{"t":873.52,"e":927.04,"text":"uh one which is V of S plus a hyperparameter times this other term which encourages exploration. And the way this work here is that the np is the parent the number of times a parent of a node is visited and ns is the number of the nodes that this current node is not the parent but the current node is visited. And basically think about it this way relative to the parent node. If a node is visited less we want to encourage visiting that node more. And if that node relative to the parent is in is visited um a high a large number of times then this number this uh division this becomes a smaller number and UCT becomes uh lower relative to unexplored kind of"},{"t":922.32,"e":979.16,"text":"children of a parent node. So um UCT again is the number that we use for expans for selection of a node and going from there. Now back propagation and that's where we go at the end of an a trajectory either we succeed or fail the return of that trajectory is used to update the values and this is like back propagated through the the steps. So at each point the value of an of a state is the value of the old state times the number of v visits to that to that node uh minus one plus the return divided by the total number of visits to that node. So that's that's how the math behind this um framework. Yes. UCP long take a long"},{"t":979.92,"e":1036.48,"text":">> it's it's just something there's some math and theoretical intuitions behind it. There's no proof that this is the optimal round but you want to just balance the two in that like this is considered a more optimized way of doing things. Oh. >> Yes. Yes. Um so once back propagation is done uh they also they also append this reflection of the model itself about the uh the trajectory that was expanded. If it fails or if it succeeds, the model adds some thinking behind what happened, what led to the failure or the success of this trajectory. And this apparently has been very helpful in overall increasing the quality of this approach."},{"t":1033.76,"e":1084.16,"text":"Um so they tested this approach on hotspot QA which is some data set that we still uh uh we use it for multi-step reasoning optimization. Basically the way this data set works is that for each question for answering them you need retrieval from at least two like different Wikipedia pages um because it's just designed like that. So you need this multi-step by design kind of process in order to find an answer and um obvious and they're doing really well like just look in in terms of like as they increase the number of samples or the number of trajectories that they sample they can significantly improve performance. um and the the the reflection and"},{"t":1081.84,"e":1132.08,"text":"bringing those kind of reasoning traces also gives a lot of boosts at the end to the model. So basically they have provided a mechanism to um translate more compute at test time effectively to better kind of uh solutions for this multi-step reasoning tasks. Um they also tested that on webshaw which is this interesting um data set uh for practical app applications. there are um this is like just to show you an example how this data set works. For example, there is I'm looking for a small portable hoarding desk that's already fully assembled. It should have a this color and this finish and so on and the prices. So it's by design it's a"},{"t":1129.12,"e":1186.88,"text":"very multi-step pro it's a multi-step process and um they're showing that their approach without any kind of fine-tuning and just at test time they can get really high results even close to human um experts in this case. Uh so to summarize what LZ proposed was a new technique for kind of bringing in reasoning uh taking actions and planning all together and kind of brought in our known ideas like MCTS into the into the language model world. um and they got very strong results on multiple domains and um given the test time approach and the modular approach it's very portable and easy to uh relatively easy to create. The downside of course is the"},{"t":1183.84,"e":1231.84,"text":"cost. um um each of these kind of like back propagation and like expansion of a tree all of those are adding a lot of cost and um they like um the cost benefits was not really analyzed in the paper. Another assumption that this is not this paper didn't address was really that um there are scenarios where taking an action may be reversible. So there are that's going to be challenging like how do we adapt uh to those scenarios right if like for example the model is running a transaction like if if it actually takes those actions it could be very consequential like paying for a service and so on. So so that is another uh"},{"t":1227.68,"e":1261.96,"text":"scenario where u this approach might not be um adaptable to. So here there are a few questions about this paper that I really would like you to think about it maybe for a couple minutes and then we discuss uh anything related to where you see the strengths or weaknesses of this paper or if you were to adapt it or extend it how do you how would you do that? So let's start doing that and I'll get back to you in a couple of minutes."},{"t":1263.52,"e":1310.8,"text":"All right, let's get back. Anyone wants to comment on on this fork? >> So the UCT method, it's basically like confidence found like from like bandit learning setting, right? There's other algorithms for like picking like in bandit learning like picking and exploring various arms. Did they try like different ones in this paper? >> Okay, the question you think is one way to create this exploration. There are a lot of literature. know that whether they compared. >> Yeah. >> Um no and there is that whole literature multi-arm bandit and other ways that we can uh bring in exploration exploitation into the optimization process and all of"},{"t":1307.76,"e":1329.32,"text":"that could be like also explored here. They just like I think their main contribution is that created a platform that now can others can bring in other approaches to optimization. Yeah. Anything else? Questions or comments?"},{"t":1331.92,"e":1387.76,"text":"Okay, let's move on to the next paper. >> Yes, go ahead. Um so if we were to keep track of um the action trajectory based with the Monte Carlo tree search what if there were times when there's like repeated actions like action A B A B if or or like um when the same action is seen in multiple nodes uh is there any way to optimize this tree or does this tree recognize all of these repeated actions as uh independent trajectories? Um so the question is if if a series of actions are repeated how do you so so ou're also figuring out where the uncertainty is over multiple steps. So…"}]},{"n":8,"id":"8JAqLnTaZu4","title":"Agentic Evaluations and Long Horizon Tasks","file":"08 - Agentic Evaluations and Long Horizon Tasks.srt","duration":4513,"paras":[{"t":5.52,"e":31.36,"text":"Today's lecture will focus on agentic evaluations and long horizon tasks. How many of you have had to run an evaluation for your project um to do whatever you've been doing? No one is running an evaluation. How are you guys doing any projects? Uh what evaluation tasks have you used for agentic evaluations?"},{"t":33.28,"e":65.24,"text":"I'm going to call people out if I don't get answers. What do you What have you been using in your project? >> Like I wonder for like enacting meditation. Do you mean like it has to be something like speed bench or like knowledge task? A multihoff knowledge task. >> All of those count, right? >> Okay. Yeah. So then I guess like hard QA QA. Okay. So that's a multihop question answering task. Sweeten would also count. >> What else have you folks been using?"},{"t":67.12,"e":112.08,"text":">> There's no other answers. >> What about you? >> Yeah. >> Uh, I'm a [clears throat] I'm working on a private wiki for my employer and I guess that down and make notes out of that and then feed that into a coding agent. >> Okay, nice. Okay, so private wiki question answers. So I think a lot of this lecture will focus on what is challenging about agentic evaluations relative to where things have been before and how things become harder. Um the papers that we'll cover to cover this topic will be uh focused on measuring the ability of these models to complete long tasks uh in terms of what's the length of the task length as"},{"t":110.24,"e":148.96,"text":"in time horizon of the task that the models can uh complete. uh also in terms a second paper that we'll look at is GDP val which was a recent benchmark that was released by open AI. This will focus on how do the models perform on real world economically valuable tasks. So there has been a lot of discussion around uh the models can uh do tasks that real world uh professionals can do. So this is measuring that in a very real sense. And then the last task will very much focus on deep research style tasks. So it is called deep scholar bench. that's out of Stanford and it's a live benchmark that focused on generative research synthesis. So it takes a bunch"},{"t":146.8,"e":192.4,"text":"of papers and then tries to write the related work section a task that I have always wanted the language models to go do for uh the papers that I write. So uh this actually measures how good of a job does the model do in in solving these kind of tasks. So one of the challenges of measuring intelligence or progress of AI is that we have to measure um what matters like how is the how is the how are the models progressing. So when we started about four or five years ago even the fact that the models could generate any explanations was uh such a big deal and now uh we may measure the progress of AI in terms of whether we can uh forecast"},{"t":190.16,"e":234.64,"text":"how it will influence economics or how it will influence safety. traditional benchmarks uh which involve chat bots or which involve say question answering or singleshot just answering uh something that was already in the context are starting to saturate it fairly quickly. However, we do need to measure uh both in terms of capability and economic um uh impact how these models are progressing so that we can see what their uh impact will be in the coming years. So in terms of um measuring capability uh what we covered today is we are looking at the task of how long or how complex of a task can these models accomplish. Um and the second question"},{"t":231.92,"e":278.0,"text":"we ask is what is the economic value of the task that these uh models can do or can they do real world tasks that humans can currently do and the two papers that we are uh referencing here ly giving a full ML research style tasks which can go on as long as eight hours. So you've seen like AI scientist paper covered in this graph before. So uh similar style of benchmarks. In total it covers about 170 tasks um going all the way from say 1 seconds to 8 hours. So if you were to look at this um in terms of a division you will see that edgecast has about 97 task. the the these are the one minute to 30 hour tasks. SWAA has about 66 tasks and then rebench which are more"},{"t":405.76,"e":443.92,"text":"researching tasks that took take much longer are about seven tasks. So the first they do is they they collect these tasks they vet the set of tasks that go into each of these uh benchmark suites. Then they actually have uh time estimates from both human doing the task and then the agent doing the task. From human runs, they actually estimate the amount of time it takes the human to complete that task and whether they found it difficult or not. And then for the agent, uh they're measuring whether they completed it reliably or not. And uh finally based on enough data points, they fit a curve which measures the success rate versus the time estimate."},{"t":442.16,"e":470.28,"text":"And based on that, they find the time horizon for these models completing the tasks. Um so that that gives a sense of the horizon length relative to model release dates. So what we'll see in terms of trends are um for models released on different dates uh roughly what is the time horizon with which the models complete the tasks 50% of the time or 80% of the time uh 80% of the time questions."},{"t":474.64,"e":534.48,"text":"What is a task that takes you guys um a couple of minutes and what's a task that takes you guys say a couple of hours that you think the like you would like to delegate to the models >> yes that that usually would take several so that that would be a great task and I would fall somewhere in a cast or reb task. Um any other takers related to what you do? >> Yeah. >> I for each like reference >> say that >> double check the tag for each. >> Okay. So in the paper writing you want the the bip item to be correct. So you wanted to go query the right websites and find the bipe item. >> Okay. How many minutes do you think that"},{"t":532.16,"e":549.88,"text":"was should take? So it falls more in that one the edgecast style like diverse tasks. Okay, cool. Any other task that people think that the model should be like good at?"},{"t":552.08,"e":555.08,"text":">> Okay."},{"t":558.64,"e":612.32,"text":">> Mhm. >> Okay. would be able to faster. >> So refactoring for code can be large or can be small, right? >> Yeah. Depends on >> what the refactor requires. If the logic stays the same as just moving around code, then that perhaps a few hours can be couple of days. Someone has to check correctness of that as well. Makes sense. So that one will fall perhaps like closer to our bench. One can imagine that there will be a version of just like the coding related tasks. Cool. Okay, it's okay. I ask a question about this patient. So for the second step with the task for this task human people do it faster, some people do it"},{"t":610.96,"e":653.76,"text":"slower. Mhm. >> So I'm just uh wondering so on one on one case you just have one main evaluator and then you have just one result on the other extreme you have like 100 you have distribution and you can compare. So where is the head? So I'm just curious where that's most of the process. >> So typically what's done with most of the I mean getting a lot of experts to solve the task is is uh relatively expensive. So typically you will have a few experts solve the task and then you look for interrator agreement or interhuman agreement in this particular case and what you're saying is that generally if the numbers are very far"},{"t":651.52,"e":693.52,"text":"off then you go get more data points and if there is like generally agreement then you kind of move on. So just the example of tasks just related to what the class talked about where you wanted the literature review section or you wanted the bipek um uh being uh accurately classified or or or the refactoring of the codebase. Some of the example tasks of different durations that were in this paper are like find a shell script. So that that's perhaps just take 3 seconds or Wikipedia research. This is closer to the research section that um that you wanted or another one is like detect and fix a bug in the input files for a simulation. So"},{"t":691.6,"e":732.48,"text":"that that takes like 10 minutes for a human. Uh then there is like munching of data. So data munching task where you're transforming some JSON data from one format to another. And then uh CUDA back testing tool uh which basically you are uh implementing custom CUDA kernels can take uh tens of hours. So here it's like 8 hours and they're um aiming for a certain performance improvement. So all of these tests are part of um this particular benchmark and the way this actually addresses the question you were asking. The way they are going about um getting the human baseline for task completion is that they go and uh get uh skilled"},{"t":730.64,"e":766.72,"text":"professionals uh with roughly five years of experience in the field to record their completion times for successful attempts and then they take a geometric mean for the task difficulty rating based on the humans that went and solved this. One challenge with this is that people who are experienced in the field are conditioned to like what it means to be successful in this. So they will often underestimate the difficulty of the task which might not correlate to how the model sees whether this task is difficult or not. So in terms of trends what they found is on the x-axis we have the human time to complete and on the y-axis we have the"},{"t":764.16,"e":808.88,"text":"success rate going all the way from 0 to uh one. So the model success rate um for uh if you look at smaller tasks like the 1 to  lie. Um typically the failure modes come from not finding comprehensive sources. So even when they do find relevant documents they're not always finding the foundational papers. So this is where if you are an expert in the area you kind of know from experience that there are all these foundational papers because"},{"t":3421.6,"e":3460.88,"text":"they you kind of build that context and and bookmark all the important papers. uh the uh deep research agents do a reasonably strong job but they struggle to assess the document importance uh beyond whether that's relevant to the context or not. Uh they surface essential facts. So even with good retrieval they don't always uh extract the key information efficiently. If you do give the perfect sources um so even if you say that okay here are all the papers that should have been included even then if you try to get them to extract the key facts even then they get about 50% coverage and without knowing the exact papers they get lower coverage"},{"t":3459.28,"e":3497.76,"text":"and then finally if you're trying to balance out the qual synthesis quality versus verifiability none of the systems actually uh excels at both like the quality of synthesis and the verifiability in certain ways. So you can see that uh being able to refer to reference data in in the Asianic evaluation tasks is a non-trivial problem. So it's not just about how long a task is or whether it's real world economic value or not. If you have to reference some reference data to look go look at it's non-trivial because you might not get the context that an expert has. So you might not have that much foundational knowledge available."},{"t":3495.92,"e":3512.44,"text":"It might not extract the key information well enough. So it does something but not uh it so it's good with human AI assistance and the verifiability with respect to citations may not have the right precision recall trade-off that's acceptable for that occupation."},{"t":3513.6,"e":3530.84,"text":"So  covered by the field. So even the the key information coverage and then which papers get referenced for those claims don't have sufficient um coverage and so on. So it's both retrieval quality and then what gets written down in terms of the"},{"t":3655.44,"e":3658.6,"text":"key funds."},{"t":3660.0,"e":3709.04,"text":"Does that make sense? Okay. So let's try to summarize across a different set of tasks. So um and this is kind of also addressing the question that our classmate asked. Um so in the time horizon sense um research synthesis tasks uh can be anywhere from 30 minutes to 8 hours but uh the current capability range is somewhere around 50 minutes but the quality at this horizon might still be poor. You might still end up with say 50% success rates. So uh what this is roughly saying is that if research synthesis tasks are in uh long horizon in MTR and even though they look good on that plot they might not be um might not be high quality in terms of economic"},{"t":3706.16,"e":3745.84,"text":"value. Um I mean research synthesis tasks show up in say financial investig uh financial research. They show up in a lot of different research tasks, but um so they have clear economic value, but they definitely require capabilities um that current models are not always hitting. And often times the gaps are coming from say multi-step reasoning from being able to do a comprehensive job at information gathering to maintain verifiability while you're synthesizing this information. So if you remember from homework three when you basically combine information from multiple different agent calls you still have to maintain certain amount of verifiability"},{"t":3742.88,"e":3786.56,"text":"and then you are combining the context. So there's context engineering from a distributed set of sources. Maybe you did a bunch of different tool calls. You maybe you did went and did read red read redid the tool calls. So all of that information needs uh you have to maintain the context in in e
